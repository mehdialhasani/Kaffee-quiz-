im Zyklon und am Rohr", "Luftstrom merklich schwächer"], "cup": "Röstungen laufen träger, gelegentlich Funkenflug am Rohr"}, "options": ["Mehr Gas geben, um den schwachen Luftstrom auszugleichen", "Ventilator höher stellen, um die Ablagerungen auszugleichen", "Feste Reinigungsintervalle für Zyklon und Abluftrohr einführen", "Abluftklappe weiter schließen, damit weniger Funken austreten"], "correct": 2, "explain": "Chaff und Kreosot sind leicht entzündlich und verengen bei Ablagerung den Luftweg. Regelmäßige Reinigung von Zyklon und Abluft senkt das Brandrisiko und stellt den Luftstrom wieder her.", "source": {"title": "Barista Hustle – Chaff, Creosote und Abluft", "url": "https://www.baristahustle.com/?p=421062"}, "img": "trommel", "topic": "Fallstudie"}, {"id": "r1-13", "mode": "roester", "level": 1, "type": "mc", "topic": "Phasen & Crack", "q": "Wie unterscheidet sich der Second Crack vom First Crack im Klang?", "options": ["Er ist ein lauteres, tieferes Knallen", "Er ist ein feineres, schnelleres Knistern", "Er ist ein dumpfes, langsameres Poppen", "Er ist ein gleichmäßiges, leises Zischen"], "correct": 1, "explain": "Der First Crack ist ein popcornartiges Knallen, der Second Crack ein feineres Knistern, wie Milch auf Reis-Crispies. Manche Natural-Kaffees knacken im First Crack allerdings sehr leise.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack"}, {"id": "r1-14", "mode": "roester", "level": 1, "type": "mc", "topic": "Phasen & Crack", "q": "Was passiert beim Rösten mit Volumen und Dichte der Bohne?", "options": ["Volumen sinkt, Dichte steigt", "Volumen bleibt, Dichte sinkt", "Volumen nimmt zu, Dichte nimmt ab", "Volumen und Dichte steigen beide"], "correct": 2, "explain": "Die Bohne dehnt sich durch Gas- und Dampfdruck aus. In einer Studie wuchs das Volumen von Arabica je nach Röstgrad um etwa 40–70 %, die Dichte sank deutlich.", "source": {"title": "Bicho et al. 2012, Ciência e Tecnologia de Alimentos – Use of colour parameters for roasted coffee assessment", "url": "https://www.redalyc.org/pdf/3959/395940113004.pdf"}, "img": "bohne"}, {"id": "r1-15", "mode": "roester", "level": 1, "type": "mc", "topic": "Wärme & Maschine", "q": "Was bedeutet „Drop“ in der Röstersprache?", "options": ["Das Entleeren der Bohnen am Ende der Röstung", "Der Temperaturabfall nach dem Einfüllen", "Das Absenken der Gaszufuhr vor dem First Crack", "Das Ablassen des Chaffs aus dem Zyklon"], "correct": 0, "explain": "Mit dem Drop werden die gerösteten Bohnen aus der Maschine entlassen. Damit endet die Röstung, danach folgt das Abkühlen.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel"}, {"id": "r1-16", "mode": "roester", "level": 1, "type": "mc", "topic": "Wärme & Maschine", "q": "Was bedeutet „Charge“ beim Rösten?", "options": ["Das Vorheizen der leeren Trommel vor dem ersten Start", "Das Entleeren der Bohnen ins Kühlsieb am Ende", "Die Gaszufuhr während der ersten Röstminuten", "Das Einfüllen des Rohkaffees zum Start der Röstung"], "correct": 3, "explain": "Charge meint das Laden des Rohkaffees in Trichter oder Trommel und damit den Start der Röstung. Die Trommeltemperatur in diesem Moment heißt Charge-Temperatur.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel"}, {"id": "r1-17", "mode": "roester", "level": 1, "type": "mc", "topic": "Wärme & Maschine", "q": "Warum werden die Bohnen nach dem Drop möglichst schnell abgekühlt?", "options": ["Damit das CO₂ in der Bohne gebunden bleibt", "Damit die Röstreaktionen schnell stoppen", "Damit sich das Chaff leichter absieben lässt", "Damit die Bohnen Feuchte aus der Luft aufnehmen"], "correct": 1, "explain": "Heiße Bohnen rösten weiter und können gebacken schmecken. Barista Hustle nennt als Ziel, die Bohnen in weniger als 4 Minuten unter 40 °C zu bringen.", "source": {"title": "Barista Hustle – Roasting Science RS 4.13: Cooling", "url": "https://baristahustle.com/?p=465630"}, "img": "trommel"}, {"id": "r1-18", "mode": "roester", "level": 1, "type": "mc", "topic": "Wärme & Maschine", "q": "Wofür dient der Zyklon an einem Trommelröster?", "options": ["Er führt heiße Abluft zurück in die Trommel", "Er kühlt die Bohnen nach dem Drop mit Luft ab", "Er trennt Chaff und Partikel aus der Abluft", "Er erzeugt den Unterdruck für den Luftstrom"], "correct": 2, "explain": "Der Zyklon lässt die Abluft kreisen und scheidet dabei Chaff und größere Partikel ab, laut Barista Hustle etwa 96–99 %. Sie landen im Chaff-Behälter darunter.", "source": {"title": "Barista Hustle – Chaff, Creosote und Abluft", "url": "https://www.baristahustle.com/?p=421062"}, "img": "trommel"}, {"id": "r1-19", "mode": "roester", "level": 1, "type": "mc", "topic": "Ruhezeit & Lagerung", "q": "Wozu dient das Einwegventil an Kaffeetüten?", "options": ["Es lässt CO₂ hinaus, aber keinen Sauerstoff hinein", "Es lässt Stickstoff hinein und hält das Aroma drin", "Es gleicht den Luftdruck in beide Richtungen aus", "Es lässt Feuchte hinaus, aber kein CO₂ hinein"], "correct": 0, "explain": "Frisch gerösteter Kaffee gast CO₂ aus, das eine dichte Tüte aufblähen oder platzen lassen kann. Das Ventil öffnet bei Überdruck und schließt wieder, damit kein Sauerstoff eindringt.", "source": {"title": "Plitek – One-Way Degassing Systems", "url": "https://www.plitek.com/resources/technical-resources/one-way-degassing-systems"}, "img": "sack"}, {"id": "r1-20", "mode": "roester", "level": 1, "type": "mc", "topic": "Ruhezeit & Lagerung", "q": "Welches Gas geben frisch geröstete Bohnen beim Ausgasen hauptsächlich ab?", "options": ["Sauerstoff (O₂)", "Stickstoff (N₂)", "Methan (CH₄)", "Kohlendioxid (CO₂)"], "correct": 3, "explain": "Beim Rösten entsteht viel CO₂, das in den Tagen danach entweicht, anfangs besonders schnell. In geringerer Menge entweicht auch Kohlenmonoxid.", "source": {"title": "Plitek – One-Way Degassing Systems", "url": "https://www.plitek.com/resources/technical-resources/one-way-degassing-systems"}, "img": "sack"}, {"id": "r1-21", "mode": "roester", "level": 1, "type": "mc", "topic": "Ruhezeit & Lagerung", "q": "Wie wirkt sich das Mahlen auf das Ausgasen von geröstetem Kaffee aus?", "options": ["Es verlangsamt das Ausgasen deutlich", "Es beschleunigt das Ausgasen stark", "Es beeinflusst das Ausgasen kaum", "Es stoppt das Ausgasen weitgehend"], "correct": 1, "explain": "In einer Studie von Smrke et al. entwich bis zu 75 % des eingeschlossenen Gases schon während und kurz nach dem Mahlen. Darum altert gemahlener Kaffee schneller.", "source": {"title": "Smrke et al. 2017 – Time-resolved gravimetric method to assess degassing of roasted coffee (ZHAW)", "url": "https://digitalcollection.zhaw.ch/bitstream/11475/12175/2/2017_Smrke-etal_Roasted-coffe-degassing-time-resolved-gravimetry.pdf"}, "img": "bohne"}, {"id": "r1-22", "mode": "roester", "level": 1, "type": "mc", "topic": "Röstgrad", "q": "Bei welchen Röstungen zeigt sich typischerweise Öl auf der Bohnenoberfläche?", "options": ["Bei hellen bis mittleren Röstungen", "Bei sehr hellen, kaum entwickelten Filterröstungen", "Bei mitteldunklen bis sehr dunklen Röstungen", "Bei allen Röstgraden etwa gleich stark"], "correct": 2, "explain": "Laut Coffee Review bleiben helle und mittlere Röstungen trocken. Ab mitteldunkel können Öltröpfchen erscheinen, sehr dunkle Röstungen glänzen ölig.", "source": {"title": "Coffee Review – Roast Definitions (Agtron)", "url": "https://www.coffeereview.com/roast-definitions/"}, "img": "bohne"}, {"id": "r1-23", "mode": "roester", "level": 1, "type": "mc", "topic": "Röstgrad", "q": "Wann wird eine „City“-Röstung nach Sweet Maria's typischerweise beendet?", "options": ["Gegen Ende des First Crack oder kurz danach", "Mit den ersten Knacken des Second Crack", "Kurz bevor der First Crack überhaupt einsetzt", "Mitten im Second Crack, wenn Öl austritt"], "correct": 0, "explain": "Sweet Maria's beschreibt City als frühesten gut trinkbaren Röstgrad. Gedroppt wird meist beim letzten hörbaren First-Crack-Knacken oder kurz danach, vor dem Second Crack.", "source": {"title": "Sweet Maria's – Glossar: City Roast", "url": "https://library.sweetmarias.com/glossary/city-roast/"}, "img": "crack"}, {"id": "r1-24", "mode": "roester", "level": 1, "type": "mc", "topic": "Röstgrad", "q": "Was misst ein Farbmessgerät wie ein Agtron?", "options": ["Die Restfeuchte von Bohnen oder Mahlgut", "Die Dichte von Bohnen oder Mahlgut", "Den Ölgehalt von Bohnen oder Mahlgut", "Die Röstfarbe von Bohnen oder Mahlgut"], "correct": 3, "explain": "Röstfarbmesser sind Spektrophotometer, Agtron ist eine bekannte Marke. Sie machen den Röstgrad objektiv vergleichbar, auch wenn Geräte untereinander kalibriert werden müssen.", "source": {"title": "Coffee Review – Agtron Numerology", "url": "https://www.coffeereview.com/agtron-numerology/"}, "img": "bohne"}, {"id": "r1-25", "mode": "roester", "level": 1, "type": "mc", "topic": "Cupping & Qualität", "q": "Wofür nutzt man einen Probenröster (Sample Roaster)?", "options": ["Um während der Röstung Bohnen zu entnehmen", "Um kleine Mengen für das Cupping zu rösten", "Um Rohkaffee vor dem Rösten vorzutrocknen", "Um sehr dunkle Espressoröstungen zu machen"], "correct": 1, "explain": "Probenröster sind kleine, oft mehrtrommelige Maschinen. Sie rösten gerade genug Kaffee, um eine Partie ein- oder zweimal zu cuppen.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel"}, {"id": "r1-26", "mode": "roester", "level": 1, "type": "mc", "topic": "Chemie", "q": "Wie viel Restfeuchte enthält frisch gerösteter Kaffee typischerweise?", "options": ["Etwa 1–3 %", "Etwa 10–12 %", "Etwa 5–7 %", "Unter 0,1 %"], "correct": 0, "explain": "Barista Hustle nennt für Röstkaffee rund 1–3 % Feuchte, je nach Kaffee und Röstung. Rohkaffee startet bei etwa 10–12 %.", "source": {"title": "Barista Hustle – Roasting Science: Feuchte im Rohkaffee", "url": "https://www.baristahustle.com/?p=407661"}, "img": "bohne"}, {"id": "r1-27", "mode": "roester", "level": 1, "type": "mc", "topic": "Sicherheit", "q": "Wofür wird ein Afterburner (Nachverbrenner) an einer Rösterei eingesetzt?", "options": ["Um die Trommel zwischen den Chargen nachzuheizen", "Um das Chaff im Zyklon rückstandsfrei zu verbrennen", "Um Rauch und Schadstoffe in der Abluft zu verbrennen", "Um den Luftstrom durch die Trommel zu verstärken"], "correct": 2, "explain": "Afterburner, thermisch oder katalytisch, zerstören Rauch und flüchtige organische Verbindungen in der Abluft. Thermische Anlagen laufen laut Royal Coffee bei rund 700 °C (1.300 °F).", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel"}, {"id": "r1-29", "mode": "roester", "level": 1, "type": "case", "topic": "Fallstudie", "q": "Was änderst du beim nächsten Cupping?", "case": {"title": "Fall · Cupping im Röstbetrieb", "facts": ["Proben morgens für den ganzen Tag vorgemahlen", "Mahlgut offen auf dem Tisch", "Cupping erst am Nachmittag"], "cup": "Alle Proben wirken flach und aromaarm"}, "options": ["Feiner mahlen und das Verhältnis Kaffee zu Wasser erhöhen", "Proben etwas dunkler rösten, damit sie mehr Körper haben", "Direkt vor dem Cupping mahlen oder das Mahlgut abdecken", "Mit heißerem Wasser aufgießen, um mehr zu extrahieren"], "correct": 2, "explain": "Gemahlener Kaffee verliert sehr schnell Gas und Aromen. Das SCA-Protokoll verlangt, unmittelbar vor dem Cupping zu mahlen oder vorgemahlene Proben abzudecken.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "sack"}, {"id": "r1-30", "mode": "roester", "level": 1, "type": "case", "topic": "Fallstudie", "q": "Ein Mitarbeiter klagt über Kopfschmerzen. Was änderst du?", "case": {"title": "Fall · Lager für Röstkaffee", "facts": ["Offene Behälter mit frisch gerösteten Bohnen", "Mitarbeiter beugt sich zum Befüllen tief in die Behälter", "Kein CO-Melder im Raum"], "cup": "Kopfschmerzen und Schwindel nach der Schicht"}, "options": ["Behälter abdecken, nicht hineinbeugen, CO-Melder installieren", "Deckel nur nachts schließen, Rauchmelder an der Decke montieren", "Staubmaske tragen, Fenster schließen, Behälter offen lassen", "Größere Behälter wählen, Raum wärmer halten, Luft befeuchten"], "correct": 0, "explain": "Röstkaffee gast Kohlenmonoxid aus. NIOSH empfiehlt, Behälter abzudecken, Arbeiten mit dem Kopf in Bohnenbehältern zu minimieren und CO-Melder mit Alarm bei 200 ppm aufzustellen. Bei Beschwerden gehört das auch ärztlich abgeklärt.", "source": {"title": "NIOSH HHE 2016-0144-3305 – Coffee roasting and packaging facility", "url": "https://www.cdc.gov/niosh/hhe/reports/pdfs/2016-0144-3305.pdf"}, "img": "sack"}, {"id": "r2-13", "mode": "roester", "level": 2, "type": "mc", "topic": "Chemie", "q": "Ab etwa welcher Bohnentemperatur setzen die Maillard-Reaktionen beim Rösten deutlich ein?", "options": ["Um 100 °C", "Um 200 °C", "Um 150 °C", "Um 230 °C"], "correct": 2, "explain": "Royal Coffee nennt rund 302 °F, also etwa 150 °C, als Beginn der Maillard-Phase. Dann wechseln die Bohnen sichtbar von gelb zu braun.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "bohne"}, {"id": "r2-14", "mode": "roester", "level": 2, "type": "mc", "topic": "Chemie", "q": "Was beschreibt der Strecker-Abbau beim Rösten?", "options": ["Koffein zerfällt in der Röstwärme schrittweise zu Theobromin und CO₂", "Aminosäuren reagieren mit Carbonylverbindungen zu Aldehyden und CO₂", "Saccharose wird in der Hitze zu Glukose und Fruktose gespalten", "Chlorogensäuren zerfallen in der Hitze zu Chinasäure und Kaffeesäure"], "correct": 1, "explain": "Beim Strecker-Abbau reagiert eine Aminosäure mit einer Carbonylverbindung, es entstehen CO₂ und ein Aldehyd oder Keton. Er hängt eng mit den Maillard-Reaktionen zusammen und liefert wichtige Aromastoffe.", "source": {"title": "Sweet Maria's – Glossar: Strecker Degradation", "url": "https://library.sweetmarias.com/glossary/strecker-degradation/"}, "img": "bohne"}, {"id": "r2-16", "mode": "roester", "level": 2, "type": "mc", "topic": "Chemie", "q": "Was passiert mit dem Trigonellin im Rohkaffee beim Rösten?", "options": ["Es wird teilweise abgebaut, unter anderem zu N-Methylpyridinium", "Es wird vollständig abgebaut, unter anderem zu Koffein und Wasser", "Es bleibt weitgehend stabil, ähnlich wie das Koffein", "Es reichert sich an, weil es aus Chlorogensäuren entsteht"], "correct": 0, "explain": "Geröstete Bohnen enthalten etwa nur noch die Hälfte des Trigonellins. Das Abbauprodukt N-Methylpyridinium nimmt mit dem Röstgrad zu.", "source": {"title": "Votavová et al. 2009, Czech J. Food Sci. – Trigonelline degradation products upon coffee roasting", "url": "https://www.agriculturejournals.cz/pdfs/cjf/2009/10/120.pdf"}, "img": "bohne"}, {"id": "r2-17", "mode": "roester", "level": 2, "type": "mc", "topic": "Chemie", "q": "Wie verhält sich Acrylamid im Verlauf der Röstung?", "options": ["Es bildet sich langsam und steigt bis zur dunkelsten Röstung an", "Es entsteht vor allem in der Trocknungsphase und bleibt danach stabil", "Es bildet sich schnell beim Bräunen und sinkt bei dunklerer Röstung", "Es bildet sich erst im Second Crack und steigt danach stark an"], "correct": 2, "explain": "In der Bräunungsphase bildet sich Acrylamid schnell und wird bei längerer, dunklerer Röstung wieder abgebaut. Furane dagegen nehmen mit dem Röstgrad zu.", "source": {"title": "Daily Coffee News – Study: Common coffee toxicants cannot be simultaneously reduced in roasting", "url": "https://dailycoffeenews.com/2023/09/28/study-common-coffee-toxicants-cannot-be-simultaneously-reduced-in-roasting"}, "img": "kurve"}, {"id": "r2-18", "mode": "roester", "level": 2, "type": "mc", "topic": "Rohkaffee", "q": "Ab welcher Wasseraktivität (aw) steigt bei Rohkaffee das Risiko für Schimmel und Mikroben?", "options": ["Ab etwa 0,30", "Ab etwa 0,60", "Ab etwa 0,90", "Ab etwa 0,15"], "correct": 1, "explain": "Unter etwa 0,60 aw wachsen kaum Mikroorganismen, darüber steigt das Risiko. Royal Coffee nennt Werte nahe 0,60 als guten Kompromiss für Rohkaffee.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part I: Moisture Content and Water Activity", "url": "https://royalcoffee.com/green-coffee-analytics-relevance-to-roasters-buyers-and-producers-part-i-moisture-content-and-total-water-activity/"}, "img": "sack"}, {"id": "r2-19", "mode": "roester", "level": 2, "type": "mc", "topic": "Rohkaffee", "q": "Was gilt laut Royal Coffee für Rohkaffee mit hoher Dichte?", "options": ["Er neigt bei hoher Hitze besonders zu Scorching", "Er braucht eine längere, sanftere Trocknungsphase", "Er sollte grundsätzlich dunkler geröstet werden", "Er nimmt Wärme effizient auf und verträgt mehr Hitze"], "correct": 3, "explain": "Dichte Bohnen nehmen Wärme gut auf und leiten sie weiter, sie vertragen eine kräftigere Wärmezufuhr. Bohnen mit geringer Dichte neigen dabei eher zu Scorching und Fehlaromen.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "sack"}, {"id": "r2-20", "mode": "roester", "level": 2, "type": "mc", "topic": "Wärme & Maschine", "q": "Was messen ET und BT an einem Röster?", "options": ["ET die Trommelwand, BT die Bohnen im Kühlsieb", "ET die Luft- bzw. Ablufttemperatur, BT das Bohnenbett", "ET die Brennerflamme, BT die Temperatur im Trichter", "ET das Bohnenbett, BT die Luft- bzw. Ablufttemperatur"], "correct": 1, "explain": "BT (Bean Temperature) kommt vom Fühler im Bohnenbett. ET (Environmental Temperature) misst meist die Luft- bzw. Abluft­temperatur, also die konvektive Wärme.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "kurve"}, {"id": "r2-21", "mode": "roester", "level": 2, "type": "mc", "topic": "Röstfehler", "q": "Welchen Röstfehler kann eine zu langsame Trommeldrehzahl begünstigen?", "options": ["Quakers (helle Bohnen)", "Baking (flach, gebacken)", "Scorching (Brandflecken)", "Unterentwicklung (grasig)"], "correct": 2, "explain": "Dreht die Trommel zu langsam, liegen die Bohnen zu lange an der heißen Trommelwand. Royal Coffee nennt eine langsame Trommel als eine Ursache für Scorching.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel"}, {"id": "r2-22", "mode": "roester", "level": 2, "type": "mc", "topic": "Röstgrad", "q": "Wie unterscheiden sich Agtron-Werte von ganzer Bohne und Mahlgut typischerweise?", "options": ["Gemahlen meist höher, Abstand bei hellen Röstungen größer", "Gemahlen meist höher, Abstand bei dunklen Röstungen größer", "Ganze Bohne meist höher, Abstand bei hellen Röstungen größer", "Gemahlen meist niedriger, Abstand bei dunklen Röstungen größer"], "correct": 0, "explain": "Coffee Review nennt als Beispiel etwa 70 ganz und 95 gemahlen bei sehr hellen Röstungen. Je dunkler die Röstung, desto kleiner wird der Abstand.", "source": {"title": "Coffee Review – Agtron Numerology", "url": "https://www.coffeereview.com/agtron-numerology/"}, "img": "bohne"}, {"id": "r2-23", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Was änderst du bei dieser Partie?", "case": {"title": "Fall · Neue Ernte, 12,8 % Feuchte", "facts": ["Gleiches Profil wie bei der Vorgängerpartie mit 10,5 %", "Gleiche Drop-Temperatur", "Farbe ungleichmäßig"], "cup": "Weniger entwickelt, leicht grasig"}, "options": ["Höhere Charge-Temperatur, kürzere Trocknungsphase", "Früher droppen, Drop-Temperatur leicht senken", "Sanftere Anfangshitze, längere Trocknungsphase", "Mehr Luftstrom ab Start, kürzere Entwicklung"], "correct": 2, "explain": "Feuchtere Bohnen brauchen mehr Zeit und Energie für eine gleichmäßige Röstung. Royal Coffee empfiehlt geringere Anfangshitze, um die Trocknung zu verlängern.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "kurve"}, {"id": "r2-24", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Die Röstung wirkt optisch mittel. Was änderst du?", "case": {"title": "Fall · Entkoffeinierter Kaffee", "facts": ["Drop rein nach Bohnenfarbe", "Kaum hörbarer First Crack", "Ziel: mittlere Röstung"], "cup": "Grasig, unterentwickelt"}, "options": ["Nicht nur nach Farbe droppen, Decaf sieht dunkler aus als er ist", "Früher droppen, weil Decaf nach dem Drop nachdunkelt", "Charge-Temperatur stark erhöhen, den Drop weiter nach Farbe setzen", "Mehr Luftstrom geben, damit der First Crack hörbarer wird"], "correct": 0, "explain": "Decaf wirkt bei gleichem Röstgrad dunkler und knackt oft leise. Sweet Maria's rät, damit zu rechnen, damit man ihn nicht unterentwickelt. Bohnentemperatur und Gewichtsverlust helfen zusätzlich beim Drop.", "source": {"title": "Sweet Maria's – Closeup on Roasting Decaf Coffee", "url": "https://library.sweetmarias.com/closeup-on-roasting-decaf-coffee/"}, "img": "bohne"}, {"id": "r2-25", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Die BT-Kurve ist unbrauchbar. Was änderst du?", "case": {"title": "Fall · Sehr kleine Charge", "facts": ["Charge bei ca. 20 % der Nennkapazität", "BT springt bei jeder Gas- oder Luftänderung", "Fühlerspitze ragt sichtbar aus dem Bohnenbett"], "cup": "Röstungen schwer reproduzierbar"}, "options": ["RoR-Glättung erhöhen, damit die Kurve ruhiger wird", "Charge so groß wählen, dass der Fühler ganz bedeckt ist", "Höhere Charge-Temperatur, damit der Fühler schneller reagiert", "Gas stärker variieren, um die Reaktion besser zu sehen"], "correct": 1, "explain": "Bei sehr kleinen Chargen ist der Bohnenfühler nicht ganz bedeckt und misst vor allem heiße Luft. Barista Hustle nennt seine Lage als Untergrenze für die Chargengröße.", "source": {"title": "Barista Hustle – Roasting Science RS 4.09: Batch Size", "url": "https://baristahustle.com/?p=432443"}, "img": "kurve"}, {"id": "r2-26", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Was änderst du?", "case": {"title": "Fall · Volle Trommel, schwacher Brenner", "facts": ["Charge auf 100 % der Herstellerangabe", "Brenner schon früh auf Maximum", "Drop erst nach 18:30"], "cup": "Flach, gebacken, kaum Süße"}, "options": ["Charge-Temperatur senken, damit die Röstung sanfter wird", "Das Ende strecken, damit sich mehr Süße entwickelt", "Trommeldrehzahl senken, damit die Bohnen mehr Kontakt haben", "Chargengröße verkleinern, damit die Röstung kürzer wird"], "correct": 3, "explain": "Die Herstellerkapazität ist oft ein theoretisches Maximum. Ist die Charge zu groß für den Brenner, dauert die Röstung zu lange und schmeckt flach und gebacken.", "source": {"title": "Barista Hustle – Roasting Science RS 4.09: Batch Size", "url": "https://baristahustle.com/?p=432443"}, "img": "trommel"}, {"id": "r2-27", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Die Blend röstet ungleichmäßig. Was änderst du?", "case": {"title": "Fall · Espresso-Blend, gemeinsam geröstet", "facts": ["Kenia, gewaschen, sehr dicht", "Brasilien, natural, geringe Dichte", "Brasilien-Anteil zeigt dunkle Spitzen, Kenia wirkt hell"], "cup": "Teils röstig, teils grün-säuerlich"}, "options": ["Komponenten getrennt rösten und danach mischen", "Mehr Luftstrom im First Crack einsetzen", "Charge-Temperatur erhöhen, damit Kenia aufholt", "Später droppen, bis auch Kenia dunkel genug ist"], "correct": 0, "explain": "Unterschiedliche Größe, Dichte und Feuchte können im Pre-Blend die Gleichmäßigkeit stören. Getrennt rösten gibt Kontrolle über jede Komponente. Alternativ hilft eine etwas längere Trocknung.", "source": {"title": "Sweet Maria's – Blending Resources and Resourceful Blending", "url": "https://library.sweetmarias.com/blending-resources-and-resourceful-blending/"}, "img": "bohne"}, {"id": "r2-28", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Was änderst du an der Verpackung?", "case": {"title": "Fall · Röstung bleibt zum Ausgasen offen stehen", "facts": ["Bohnen 2 Tage offen in Kisten", "Danach in Tüten ohne Ventil", "Röstung selbst sauber"], "cup": "Schnell schal und flach"}, "options": ["Länger offen ausgasen, dann in Tüten ohne Ventil", "Nach dem Abkühlen zügig in Ventiltüten verpacken", "Noch warm in Tüten ohne Ventil einschweißen", "In Tüten mit kleinen Lüftungslöchern verpacken"], "correct": 1, "explain": "Wer offen ausgasen lässt, setzt den Kaffee Sauerstoff aus und verliert Frische und Aroma. Mit Einwegventil kann man zügig verpacken: CO₂ entweicht, Sauerstoff bleibt draußen.", "source": {"title": "Plitek – One-Way Degassing Systems", "url": "https://www.plitek.com/resources/technical-resources/one-way-degassing-systems"}, "img": "sack"}, {"id": "r2-29", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Was änderst du?", "case": {"title": "Fall · Nach Wartung, Trommel dreht langsamer", "facts": ["Trommeldrehzahl deutlich unter Herstellerwert", "Charge-Temperatur und Füllmenge wie immer", "Dunkle Brandflecken auf den flachen Seiten"], "cup": "Aschig, wenig Süße"}, "options": ["Füllmenge erhöhen, damit die Bohnen dichter liegen", "Entwicklung verlängern, damit die Süße zurückkommt", "Trommeldrehzahl wieder auf den empfohlenen Wert stellen", "Abluft drosseln, damit die Trommel gleichmäßiger heizt"], "correct": 2, "explain": "Brandflecken auf den flachen Seiten sind Scorching. Bleiben Charge-Temperatur und Füllmenge gleich, ist die zu langsame Trommel die naheliegende Ursache, die Bohnen liegen zu lange an der heißen Wand.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel"}, {"id": "r2-30", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Was tust du mit dieser Partie?", "case": {"title": "Fall · Rohkaffee-Eingang", "facts": ["Wasseraktivität 0,68 aw", "Lieferung im Sommer, Lager warm", "Kaffee schmeckt bei Ankunft gut"], "cup": "Probe sauber und frisch"}, "options": ["Länger im Jutesack lagern, damit die Feuchte entweicht", "Zeitnah rösten, bis dahin kühl im hermetischen Liner lagern", "Als Reserve für das kommende Jahr im Lager einplanen", "Mit höherer Charge-Temperatur rösten, sonst normal lagern"], "correct": 1, "explain": "Über etwa 0,60 aw ist Rohkaffee weniger lagerstabil, steigt das Mikrobenrisiko, und er verliert schneller an Qualität. Kühl und hermetisch lagern und zügig rösten.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part I: Moisture Content and Water Activity", "url": "https://royalcoffee.com/green-coffee-analytics-relevance-to-roasters-buyers-and-producers-part-i-moisture-content-and-total-water-activity/"}, "img": "sack"}, {"id": "r3-13", "mode": "roester", "level": 3, "type": "mc", "topic": "Ruhezeit & Lagerung", "q": "Wie beeinflusst der Röstgrad das Ausgasen ganzer Bohnen laut Smrke et al.?", "options": ["Hellere Röstungen gasen mehr und schneller aus", "Kein messbarer Unterschied zwischen Röstgraden", "Nur die Röstzeit zählt, nicht der Röstgrad", "Dunklere Röstungen gasen mehr und schneller aus"], "correct": 3, "explain": "Dunkle Röstungen gaben in der Studie ein Mehrfaches an Gas ab und schneller als helle. Der Röstgrad wirkte stärker als die Röstgeschwindigkeit.", "source": {"title": "Smrke et al. 2017 – Time-resolved gravimetric method to assess degassing of roasted coffee (ZHAW)", "url": "https://digitalcollection.zhaw.ch/bitstream/11475/12175/2/2017_Smrke-etal_Roasted-coffe-degassing-time-resolved-gravimetry.pdf"}, "img": "kurve"}, {"id": "r3-14", "mode": "roester", "level": 3, "type": "mc", "topic": "Sicherheit", "q": "Was gilt für Diacetyl und 2,3-Pentandion in Röstereien?", "options": ["Sie entstehen beim Rösten, beim Mahlen ist die Belastung oft am höchsten", "Sie stammen aus Aromazusätzen, im Röstkaffee entstehen sie nicht", "Sie entstehen beim Rösten, zerfallen aber schon beim Abkühlen", "Sie entstehen im Rohkaffeelager und werden beim Rösten wieder zerstört"], "correct": 0, "explain": "Beide Stoffe kommen natürlich in Röstkaffee vor und werden teils zusätzlich in Aromen eingesetzt. Eingeatmet können sie Bronchiolitis obliterans auslösen, beim Mahlen wurden die höchsten Werte gemessen.", "source": {"title": "LeBouf et al. 2020, Frontiers in Public Health – Diacetyl, 2,3-Pentanedione in Coffee Roasting Facilities", "url": "https://www.frontiersin.org/articles/10.3389/fpubh.2020.561740/pdf"}, "img": "sack"}, {"id": "r3-15", "mode": "roester", "level": 3, "type": "mc", "topic": "Wärme & Maschine", "q": "Warum empfiehlt Scott Rao dünne Fühler (nicht über ca. 3 mm) für den Bohnenfühler?", "options": ["Sie sind robuster und verbiegen sich im Bohnenbett nicht", "Sie reagieren schneller, RoR-Änderungen werden früher sichtbar", "Sie glätten die Kurve, sodass die RoR ruhiger aussieht", "Sie zeigen höhere Temperaturen und liefern damit realistischere Werte"], "correct": 1, "explain": "Dicke Fühler reagieren träge, die Kurve hinkt der Bohne hinterher. Rao rät, die thermische Verzögerung zu begrenzen, um z. B. einen Flick rechtzeitig zu erkennen.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve"}, {"id": "r3-16", "mode": "roester", "level": 3, "type": "mc", "topic": "Wärme & Maschine", "q": "Wo sitzt laut Barista Hustle der ET-Fühler typischerweise?", "options": ["Im Rohkaffeetrichter über der Trommel", "Im Bohnenbett an der Trommelfront", "Im Luftstrom zwischen Trommel und Abluft", "Direkt über der Brennerflamme"], "correct": 2, "explain": "Die Spitze des BT-Fühlers gehört ins Bohnenbett, die des ET-Fühlers in den Luftstrom zwischen Trommel und Abluft. Empfohlen werden ungeerdete Thermoelemente Typ J oder K mit etwa 3 mm.", "source": {"title": "Barista Hustle – Roasting Science: Fühler-Platzierung (BT/ET)", "url": "https://www.baristahustle.com/?p=450912"}, "img": "trommel"}, {"id": "r3-17", "mode": "roester", "level": 3, "type": "mc", "topic": "Wärme & Maschine", "q": "Was gilt laut Barista Hustle für Röster mit Luftrückführung (Rezirkulation)?", "options": ["Sie brauchen für dieselbe Menge weniger Wärmezufuhr", "Sie brauchen für dieselbe Menge deutlich mehr Wärmezufuhr", "Sie kommen ganz ohne Abluft oder Zyklon aus", "Sie eignen sich nur für kleine Probenröstungen"], "correct": 0, "explain": "Rezirkulierende Röster sind energieeffizienter und brauchen weniger Wärme für dieselbe Menge. Für die Kapazität ist sonst vor allem die Brennerleistung entscheidend.", "source": {"title": "Barista Hustle – Roasting Science RS 4.09: Batch Size", "url": "https://baristahustle.com/?p=432443"}, "img": "trommel"}, {"id": "r3-18", "mode": "roester", "level": 3, "type": "mc", "topic": "Wärme & Maschine", "q": "Was sagt die vom Hersteller angegebene Röstkapazität laut Barista Hustle meist aus?", "options": ["Die optimale Chargengröße für Specialty-Röstungen", "Die Mindestmenge, damit der Bohnenfühler bedeckt ist", "Ein Richtwert, den man um etwa 20 % gefahrlos überschreiten kann", "Oft ein theoretisches Maximum, real röstet man kleiner"], "correct": 3, "explain": "Die Nennkapazität ist oft ein theoretisches Maximum, Profis rösten meist kleinere Chargen. Bei manchen Maschinen liegt die beste Maximalcharge nur bei etwa der Hälfte.", "source": {"title": "Barista Hustle – Roasting Science RS 4.09: Batch Size", "url": "https://baristahustle.com/?p=432443"}, "img": "trommel"}, {"id": "r3-20", "mode": "roester", "level": 3, "type": "mc", "topic": "Cupping & Qualität", "q": "Welches Verhältnis Kaffee zu Wasser sieht das SCA-Cupping-Protokoll vor?", "options": ["8,25 g auf 150 ml (ca. 1:18)", "15 g auf 150 ml (ca. 1:10)", "10 g auf 250 ml (ca. 1:25)", "12 g auf 100 ml (ca. 1:8)"], "correct": 0, "explain": "Das Protokoll nennt 8,25 g ganze Bohnen auf 150 ml Wasser, etwa 1:18. Aufgegossen wird mit rund 93 °C.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "sack"}, {"id": "r3-21", "mode": "roester", "level": 3, "type": "mc", "topic": "Rohkaffee", "q": "Was hilft laut Sweet Maria's am meisten, wenn man eine Blend vorgemischt (Pre-Blend) röstet?", "options": ["Eine etwas längere Zeit im First Crack, etwa 30–60 Sekunden", "Etwas mehr Luftstrom im First Crack, etwa eine Stufe höher", "Eine etwas längere Trocknungsphase, etwa 30–60 Sekunden", "Eine etwas höhere Charge-Temperatur, etwa 10–15 °C mehr"], "correct": 2, "explain": "Sweet Maria's nennt eine etwas längere Trocknung als Schlüssel für Pre-Blends und rät davon ab, die Zeit im First Crack zu strecken. Zu viel Luft im First Crack kann bei weniger dichten Bohnen Tipping fördern.", "source": {"title": "Sweet Maria's – Blending Resources and Resourceful Blending", "url": "https://library.sweetmarias.com/blending-resources-and-resourceful-blending/"}, "img": "kurve"}, {"id": "r3-22", "mode": "roester", "level": 3, "type": "mc", "topic": "Chemie", "q": "Bei welcher Wasseraktivität laufen Maillard-Reaktionen laut Royal Coffee am schnellsten?", "options": ["Etwa 0,10–0,20", "Etwa 0,30–0,40", "Etwa 0,90–1,00", "Etwa 0,60–0,70"], "correct": 3, "explain": "Die Maillard-Rate steigt mit der Wasseraktivität, erreicht zwischen 0,60 und 0,70 ihr Maximum und sinkt darüber wieder. Deshalb ist aw auch für die Lagerung von Rohkaffee wichtig.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part I: Moisture Content and Water Activity", "url": "https://royalcoffee.com/green-coffee-analytics-relevance-to-roasters-buyers-and-producers-part-i-moisture-content-and-total-water-activity/"}, "img": "bohne"}, {"id": "r3-23", "mode": "roester", "level": 3, "type": "mc", "topic": "Chemie", "q": "Warum lassen sich Acrylamid und Furan über den Röstgrad nicht gleichzeitig minimieren?", "options": ["Acrylamid steigt bei dunkler Röstung, Furane sinken", "Acrylamid sinkt bei dunkler Röstung, Furane steigen", "Acrylamid und Furane steigen beide bei dunkler Röstung", "Beide entstehen erst beim Mahlen, nicht beim Rösten"], "correct": 1, "explain": "Eine Studie zeigte: Acrylamid sinkt bei längerer, dunklerer Röstung wieder, Furane nehmen zu. Eine Veränderung des Röstgrads senkt also das eine und erhöht das andere.", "source": {"title": "Daily Coffee News – Study: Common coffee toxicants cannot be simultaneously reduced in roasting", "url": "https://dailycoffeenews.com/2023/09/28/study-common-coffee-toxicants-cannot-be-simultaneously-reduced-in-roasting"}, "img": "kurve"}, {"id": "r3-24", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du für diese Partie?", "case": {"title": "Fall · Brasilien, natural, niedrige Dichte", "facts": ["Profil von einem sehr dichten Kenia übernommen", "Hohe Charge-Temperatur, früh volle Leistung", "Dunkle Flecken, Fehlaromen"], "cup": "Brandig, wenig Süße"}, "options": ["Mehr Hitze geben, damit die Röstung kürzer und sauberer wird", "Profil mit sanfterer Wärmezufuhr für geringe Dichte anlegen", "Profil beibehalten, nur die Entwicklung deutlich verlängern", "Charge vergrößern und den Luftstrom deutlich drosseln"], "correct": 1, "explain": "Dichte Bohnen vertragen kräftige Hitze, Bohnen mit geringer Dichte neigen dabei zu Scorching und Fehlaromen. Ein erfahrener Röster passt die Wärmezufuhr der Dichte an.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "bohne"}, {"id": "r3-25", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du für das Ziel „hell und lebendig“?", "case": {"title": "Fall · Äthiopien, gewaschen, 2.100 m, sehr dicht", "facts": ["Sehr sanfte Wärmezufuhr", "Drop 15:30", "Röstfarbe hell"], "cup": "Flach, gedämpfte Säure, wenig Frucht"}, "options": ["Früh mehr Energie, zügiger zu heller Endtemperatur", "Noch sanfter rösten, damit die Säure erhalten bleibt", "Dunkler droppen, damit Säure und Frucht hervortreten", "Länger trocknen, Endtemperatur und Drop beibehalten"], "correct": 0, "explain": "Zu wenig Hitze bzw. zu langsames Rösten macht Kaffee gebacken, mit flacher Säure. Für dichte Bohnen empfiehlt Royal Coffee kräftigere Hitze und zügiges Rösten zu einer hellen Endtemperatur.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "kurve"}, {"id": "r3-26", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du am QC-Arbeitsplatz?", "case": {"title": "Fall · Qualitätslabor der Rösterei", "facts": ["Mühle in kleinem, geschlossenem Raum", "Keine Absaugung an der Mühle", "Messung zeigt Diacetyl über dem NIOSH-Richtwert von 5 ppb"], "cup": "Mitarbeiter mahlt täglich viele Proben"}, "options": ["Staubmaske beim Mahlen und Tür geschlossen halten", "Proben vorab mahlen und offen im Raum ausgasen lassen", "Weniger lüften, damit die Proben ihr Aroma behalten", "Lokale Absaugung an der Mühle und bessere Belüftung"], "correct": 3, "explain": "NIOSH empfiehlt lokale Absaugung an allen Mühlen. Mühlen können zusätzlich in einem getrennt belüfteten Raum stehen. Beim Mahlen entstehen besonders hohe Diacetyl-Spitzen.", "source": {"title": "NIOSH HHE 2016-0144-3305 – Coffee roasting and packaging facility", "url": "https://www.cdc.gov/niosh/hhe/reports/pdfs/2016-0144-3305.pdf"}, "img": "sack"}, {"id": "r3-27", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du bei der halben Charge?", "case": {"title": "Fall · Chargengröße halbiert", "facts": ["Bisher volle Chargen, jetzt 50 %", "Charge-Temperatur unverändert hoch", "Bohnenenden dunkel verbrannt"], "cup": "Rauchig, leicht verbrannt"}, "options": ["Charge-Temperatur beibehalten, mehr Luft im First Crack", "Charge-Temperatur für die kleinere Charge senken", "Später droppen, damit die Bohnen gleichmäßiger werden", "Trommeldrehzahl senken, damit die Bohnen ruhiger liegen"], "correct": 1, "explain": "Verbrannte Spitzen sind Tipping, meist durch eine zu heiße Startumgebung. Bei weniger Bohnen wirkt dieselbe Charge-Temperatur stärker, darum wird sie gesenkt.", "source": {"title": "Sweet Maria's – Glossar: Tipping", "url": "https://library.sweetmarias.com/glossary/tipping/"}, "img": "bohne"}, {"id": "r3-28", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du?", "case": {"title": "Fall · Kunde meldet Probleme beim Brühen", "facts": ["Barista muss sehr fein mahlen, Extraktion trotzdem niedrig", "Bohnen lassen sich schwer mit dem Fingernagel brechen", "Kurve unauffällig"], "cup": "Erdnuss, vegetal, herb"}, "options": ["Früher droppen, damit die Bohnen weniger spröde werden", "Kurve beibehalten und dem Kunden gröberes Mahlen empfehlen", "Mehr Entwicklung: etwas dunkler oder mit mehr Wärme rösten", "Mehr Ruhezeit vor dem Versand, damit die Extraktion steigt"], "correct": 2, "explain": "Zähe Bohnen, schwere Extraktion und Erdnussnoten sprechen für Unterentwicklung, die man an der Kurve allein oft nicht sieht. Abhilfe ist mehr Entwicklung.", "source": {"title": "Barista Hustle – Underdevelopment vs. Baking", "url": "https://www.baristahustle.com/?p=474557"}, "img": "bohne"}, {"id": "r3-29", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du an der Verpackung?", "case": {"title": "Fall · Großkunde will 6 Monate Haltbarkeit", "facts": ["Ventiltüte ohne Schutzgas", "Nach etwa 3 Monaten deutlich schal", "Lagerung bei Raumtemperatur"], "cup": "Oxidiert, flach"}, "options": ["Tüten mit Mikroperforation statt Ventil verwenden", "Heller rösten, damit der Kaffee langsamer altert", "Ventil entfernen und die Tüten fester verschließen", "Mit Stickstoff spülen und Barrierefolie verwenden"], "correct": 3, "explain": "In einer Studie hielt Röstkaffee mit Stickstoffspülung mindestens 6 Monate, ohne nur etwa 3. Weniger Restsauerstoff bremst die Oxidation.", "source": {"title": "Scielo – Café torrado e moído em embalagens com atmosfera de nitrogênio (Ciênc. Tecnol. Aliment.)", "url": "https://www.scielo.br/j/cta/a/CTZcCZjzvNfSLxFYSxWx84n/abstract/?lang=en"}, "img": "sack"}, {"id": "r3-30", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du vor dem Rösten?", "case": {"title": "Fall · Rohkaffee aus dem Gefrierlager", "facts": ["Liner direkt aus dem Gefrierraum geöffnet", "Sofort geröstet", "Erste Chargen trocknen sichtbar anders"], "cup": "Uneinheitlich zwischen den Chargen"}, "options": ["Im geschlossenen Liner ganz auf Raumtemperatur kommen lassen", "Gefroren rösten, dafür die Charge-Temperatur deutlich erhöhen", "Liner sofort öffnen, damit die Bohnen schneller auftauen", "Gefroren rösten, dafür die Trocknungsphase verkürzen"], "correct": 0, "explain": "Barista Hustle betont, dass Rohkaffee vor dem Rösten innen und außen eine gleichmäßige Temperatur haben soll. Geschlossen auftauen verhindert Kondenswasser an den Bohnen.", "source": {"title": "Barista Hustle – Storing Green Coffee", "url": "https://www.baristahustle.com/?p=437739"}, "img": "sack"}, {"id": "r3-31", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du an der Messung?", "case": {"title": "Fall · Profilröstung mit trägem Fühler", "facts": ["Geerdeter Bohnenfühler mit ca. 6 mm", "RoR reagiert spät auf Gasänderungen", "Röstige Noten trotz scheinbar glatter Kurve"], "cup": "Röstig, wenig Delikatesse"}, "options": ["Dickeren Fühler (ca. 8 mm), stärkere RoR-Glättung wählen", "Dünneren Fühler (max. ca. 3 mm), schnelle RoR-Einstellung", "Fühler weiter aus dem Bohnenbett ziehen, Glättung erhöhen", "Gleichen Fühler behalten, nur noch nach Farbe droppen"], "correct": 1, "explain": "Dicke Fühler verzögern die Messung und können einen Flick verdecken. Rao rät zu dünnen Fühlern und der schnellsten RoR-Einstellung, die die Sonde zulässt.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve"}, {"id": "r3-32", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du an der Durchführung?", "case": {"title": "Fall · Cupping mit neuem Team", "facts": ["Wasser sprudelnd kochend aufgegossen", "Nur 1 Tasse pro Probe", "Kruste nach 8 Minuten gebrochen"], "cup": "Bewertungen schwanken stark"}, "options": ["Ca. 100 °C, 3 Tassen pro Probe, Kruste nach 6 Minuten brechen", "Ca. 85 °C, 1 Tasse pro Probe, Kruste nach 4 Minuten brechen", "Ca. 93 °C, 5 Tassen pro Probe, Kruste nach 4 Minuten brechen", "Ca. 93 °C, 2 Tassen pro Probe, Kruste nach 10 Minuten brechen"], "correct": 2, "explain": "Das SCA-Protokoll nennt 92,2–94,4 °C, 5 Tassen pro Probe und 4 Minuten bis zum Brechen der Kruste. Mehrere Tassen zeigen auch Unterschiede zwischen den Tassen.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "sack"}, {"id": "r3-33", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du?", "case": {"title": "Fall · Brasilien, natural, geringe Dichte", "facts": ["Luftstrom im First Crack auf Maximum", "Charge-Temperatur normal", "Dunkle Bohnenspitzen"], "cup": "Leicht brandig im Abgang"}, "options": ["Luftstrom im First Crack reduzieren", "Luftstrom im First Crack weiter erhöhen", "Gas im First Crack deutlich erhöhen", "Später droppen, bis in den Second Crack"], "correct": 0, "explain": "Bei normaler Starthitze kommt der hohe Luftstrom als Ursache in Frage. Sweet Maria's nennt zu viel Luft, besonders im First Crack, als Auslöser für Tipping bei weniger dichten Bohnen.", "source": {"title": "Sweet Maria's – Blending Resources and Resourceful Blending", "url": "https://library.sweetmarias.com/blending-resources-and-resourceful-blending/"}, "img": "bohne"}, {"id": "a1-01", "mode": "anbau", "level": 1, "type": "mc", "q": "Zu welcher Pflanzenfamilie gehört die Kaffeepflanze?", "options": ["Nachtschattengewächse (Solanaceae)", "Lorbeergewächse (Lauraceae)", "Hülsenfrüchtler (Fabaceae)", "Rötegewächse (Rubiaceae)"], "correct": 3, "explain": "Coffea gehört zu den Rötegewächsen (Rubiaceae), einer großen, vor allem tropischen Pflanzenfamilie.", "source": {"title": "NParks Flora & Fauna Web – Coffea arabica", "url": "https://www.nparks.gov.sg/florafaunaweb/flora/4/8/4860"}, "img": "pflanze", "topic": "Botanik"}, {"id": "a1-02", "mode": "anbau", "level": 1, "type": "mc", "q": "Aus welchem Land stammt Coffea arabica ursprünglich – dort, wo bis heute die größte genetische Vielfalt der Art zu finden ist?", "options": ["Äthiopien", "Brasilien", "Jemen", "Indonesien"], "correct": 0, "explain": "Arabica ist in Äthiopien heimisch, wo die größte genetische Vielfalt der Art liegt. Von dort gelangten Samen in den Jemen, wo der Anbau begann.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "berg", "topic": "Herkunft"}, {"id": "a1-03", "mode": "anbau", "level": 1, "type": "mc", "q": "Wo liegt der sogenannte „Kaffeegürtel“ (Bean Belt), in dem Kaffee angebaut wird?", "options": ["Zwischen dem nördlichen Wendekreis und dem Polarkreis", "Zwischen dem 30. und dem 45. nördlichen Breitengrad", "Zwischen dem nördlichen und dem südlichen Wendekreis", "Zwischen dem südlichen Wendekreis und 45° südlicher Breite"], "correct": 2, "explain": "Kaffee wächst im Gebiet zwischen dem Wendekreis des Krebses und dem Wendekreis des Steinbocks – also in den Tropen.", "source": {"title": "Carbon Brief – Commodity profile: Coffee", "url": "https://interactive.carbonbrief.org/commodity-profile-coffee/"}, "img": "sonne", "topic": "Klima & Standort"}, {"id": "a1-04", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie viele Samen (spätere Kaffeebohnen) enthält eine normal entwickelte Kaffeekirsche?", "options": ["Einen", "Zwei", "Drei", "Vier"], "correct": 1, "explain": "Die Kaffeekirsche ist normalerweise zweisamig; reife Kirschen färben sich von grün über gelb zu tiefrot.", "source": {"title": "NC State Extension Plant Toolbox – Coffea arabica", "url": "https://plants.ces.ncsu.edu/plants/coffea-arabica/common-name/arabian-coffee/"}, "img": "kirsche", "topic": "Botanik"}, {"id": "a1-05", "mode": "anbau", "level": 1, "type": "mc", "q": "Was ist ein „Peaberry“ (Perlbohne)?", "options": ["Eine besonders große Bohne der Varietät Maragogipe", "Eine Kirsche, in der sich nur ein Samen entwickelt hat", "Eine Bohne, die vom Kirschenkäfer angebohrt wurde", "Eine unreif gepflückte Kirsche mit noch grüner Fruchthaut"], "correct": 1, "explain": "Beim Peaberry entwickelt sich nur einer der beiden Samen; der verbleibende ist rundlich statt flach.", "source": {"title": "Sweet Maria's Coffee Library – Arabica Coffee Cherry Cross Section", "url": "https://library.sweetmarias.com/arabica-coffee-cherry-cross-section/"}, "img": "kirsche", "topic": "Botanik"}, {"id": "a1-06", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Kaffeeart enthält im Rohkaffee typischerweise deutlich mehr Koffein?", "options": ["Arabica, etwa doppelt so viel wie Robusta", "Beide etwa gleich viel, der Unterschied ist gering", "Liberica, etwa dreimal so viel wie Arabica", "Robusta, etwa doppelt so viel wie Arabica"], "correct": 3, "explain": "Samen von C. canephora enthalten rund 2,5 % Koffein (Trockenmasse), Arabica etwa 1,2 % – also mehr als doppelt so viel.", "source": {"title": "Priolli et al. (2008), Genetics and Molecular Biology – Caffeine inheritance in C. arabica x C. canephora hybrids", "url": "https://old.scielo.br/j/gmb/a/v8zCVxyGtvDvwmK5JGhnjfg/?lang=en"}, "img": "kirsche", "topic": "Arten & Sorten"}, {"id": "a1-07", "mode": "anbau", "level": 1, "type": "mc", "q": "Was passiert bei der natürlichen Aufbereitung („Natural“ / Trockenaufbereitung)?", "options": ["Die ganze Kirsche wird mitsamt Fruchtfleisch getrocknet", "Das Fruchtfleisch wird entfernt und die Bohne gewaschen", "Die Kirsche wird entpulpt, der Fruchtschleim bleibt dran", "Die Bohne wird noch feucht geschält und dann getrocknet"], "correct": 0, "explain": "Bei Naturals trocknen die ganzen Kirschen in der Sonne; erst danach werden Haut und getrocknetes Fruchtfleisch maschinell entfernt.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a1-08", "mode": "anbau", "level": 1, "type": "mc", "q": "Warum heißt der „Honey Process“ so?", "options": ["Weil zur Fermentation etwas Honig zugegeben wird", "Weil der Kaffee in der Tasse stark nach Honig schmeckt", "Weil die Bohnen nach der Röstung honiggolden sind", "Weil der klebrige Fruchtschleim an der Bohne bleibt"], "correct": 3, "explain": "Beim Honey Process wird die Haut entfernt, ein Teil des klebrigen Fruchtschleims (Mucilage) bleibt beim Trocknen dran – Honig ist nicht im Spiel.", "source": {"title": "Sprudge – What Is Honey Processed Coffee?", "url": "https://sprudge.com/what-is-honey-processed-coffee-184876.html"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a1-09", "mode": "anbau", "level": 1, "type": "mc", "q": "Was bedeutet selektive Handernte (selective picking)?", "options": ["Alle Kirschen eines Zweigs werden auf einmal abgestreift", "Die Kirschen werden nach Varietät getrennt gepflückt", "Nur reife Kirschen werden in mehreren Durchgängen gepflückt", "Nur heruntergefallene Kirschen werden vom Boden aufgesammelt"], "correct": 2, "explain": "Beim selektiven Pflücken gehen die Pflücker alle 8–10 Tage erneut durch die Reihen und ernten nur die reifen Kirschen.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "kirsche", "topic": "Blüte & Ernte"}, {"id": "a1-10", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie lange dauert es nach dem Pflanzen ungefähr, bis ein Kaffeebaum erstmals Früchte trägt?", "options": ["Etwa 3–4 Jahre", "Etwa 1 Jahr", "Etwa 7–8 Jahre", "Etwa 10–12 Jahre"], "correct": 0, "explain": "Je nach Varietät tragen Kaffeebäume etwa 3–4 Jahre nach der Pflanzung erstmals Früchte.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "pflanze", "topic": "Blüte & Ernte"}, {"id": "a1-11", "mode": "anbau", "level": 1, "type": "mc", "q": "Welches Land ist mit großem Abstand der größte Kaffeeproduzent der Welt?", "options": ["Brasilien", "Kolumbien", "Äthiopien", "Vietnam"], "correct": 0, "explain": "Brasilien liefert laut USDA knapp 40 % der Weltproduktion und beeinflusst damit Angebot und Preise stark.", "source": {"title": "USDA FAS – Coffee: World Markets and Trade (Juli 2026)", "url": "https://apps.fas.usda.gov/psdonline/circulars/2026/07/coffee.pdf"}, "img": "berg", "topic": "Herkunft"}, {"id": "a1-12", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie sehen die Blüten der Arabica-Pflanze aus?", "options": ["Zartrosa, glockenförmig und süßlich duftend", "Gelblich, röhrenförmig und kaum duftend", "Weiß, sternförmig und jasminartig duftend", "Hellgrün, unscheinbar und geruchlos"], "correct": 2, "explain": "Arabica blüht weiß mit sternförmigen, stark duftenden Blüten, deren Duft an Jasmin erinnert; sie sitzen gebüschelt in den Blattachseln.", "source": {"title": "NC State Extension Plant Toolbox – Coffea arabica", "url": "https://plants.ces.ncsu.edu/plants/coffea-arabica/common-name/arabian-coffee/"}, "img": "bluete", "topic": "Botanik"}, {"id": "a1-13", "mode": "anbau", "level": 1, "type": "mc", "q": "Welcher botanische Artname steht hinter dem Handelsnamen „Robusta“?", "options": ["Coffea arabica", "Coffea liberica", "Coffea stenophylla", "Coffea canephora"], "correct": 3, "explain": "Robusta ist der Handelsname für Coffea canephora, die zweite große Kulturart neben Arabica.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "pflanze", "topic": "Arten & Sorten"}, {"id": "a1-14", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Kaffeeart stammt aus den Tieflandwäldern des Kongobeckens und wächst eher in warmen, tiefen Lagen?", "options": ["Eugenioides (C. eugenioides)", "Arabica (C. arabica)", "Robusta (C. canephora)", "Mauritiana (C. mauritiana)"], "correct": 2, "explain": "C. canephora stammt aus den Tieflandwäldern West- und Zentralafrikas, etwa dem Kongobecken; Arabica dagegen aus den Bergwäldern Äthiopiens.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "berg", "topic": "Klima & Standort"}, {"id": "a1-15", "mode": "anbau", "level": 1, "type": "mc", "q": "Woran erkennt man Kaffeerost an der Pflanze?", "options": ["An orangefarbenem Sporenpulver auf der Blattunterseite", "An schwarzen, eingesunkenen Flecken auf grünen Kirschen", "An weißem, mehligem Belag auf der Blattoberseite", "An braunen, runden Flecken mit hellem Rand auf Blättern"], "correct": 0, "explain": "Zuerst erscheinen kleine hellgelbe Flecken auf der Blattoberseite, dann bilden sich orange Sporenmassen auf der Blattunterseite.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge"}, {"id": "a1-16", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Kaffeeart macht laut ICO den größeren Teil der weltweiten Rohkaffee-Exporte aus?", "options": ["Robusta, rund 60 %", "Liberica, rund 55 %", "Robusta, rund 75 %", "Arabica, rund 60 %"], "correct": 3, "explain": "Arabica stellt rund 60 % der Rohkaffee-Exporte (ICO: 59,7–63 % in den letzten Erhebungen), Robusta den Großteil des Rests.", "source": {"title": "ICO – Coffee Market Report April 2025", "url": "https://www.ico.org/documents/cy2024-25/cmr-0425-e.pdf"}, "img": "kirsche", "topic": "Arten & Sorten"}, {"id": "a1-17", "mode": "anbau", "level": 1, "type": "mc", "q": "In welcher Sackgröße rechnet die Internationale Kaffeeorganisation (ICO) Produktion und Handel?", "options": ["30-kg-Säcke", "60-kg-Säcke", "50-kg-Säcke", "100-kg-Säcke"], "correct": 1, "explain": "Die ICO gibt Produktion, Exporte und Lagerbestände in „60-kg bags“ an – der klassische Jutesack ist die Standard-Statistikeinheit.", "source": {"title": "ICO – Coffee Market Report April 2025", "url": "https://www.ico.org/documents/cy2024-25/cmr-0425-e.pdf"}, "img": "kirsche", "topic": "Rohkaffee & Qualität"}, {"id": "a1-18", "mode": "anbau", "level": 1, "type": "mc", "q": "Was ist das „Pergament“ (Parchment) einer Kaffeebohne?", "options": ["Die rote Fruchthaut (Exokarp) der Kirsche", "Die Schleimschicht (Mesokarp) unter der Haut", "Die verholzte Hülle (Endokarp) um den Samen", "Das dünne Silberhäutchen direkt am Samen"], "correct": 2, "explain": "Die Fruchtwand besteht aus Haut (Exokarp), Fruchtfleisch (Mesokarp) und dem harten, verholzten Endokarp – dem Pergament.", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Botanik"}, {"id": "a1-19", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie heißt das dünne Häutchen, das direkt auf der Bohne sitzt und beim Rösten als „Chaff“ abfällt?", "options": ["Fruchtfleisch", "Pergamenthäutchen", "Silberhäutchen", "Fruchtschleim"], "correct": 2, "explain": "Das Silberhäutchen ist eine dünne Restschicht des Perisperms, die bei der Reife um die Bohne übrig bleibt.", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Botanik"}, {"id": "a1-20", "mode": "anbau", "level": 1, "type": "mc", "q": "Welches Wetterereignis kann Kaffeebäume nicht nur schädigen, sondern komplett absterben lassen?", "options": ["Hagel", "Starkregen", "Frost", "Dauerregen"], "correct": 2, "explain": "Arabica und Robusta sind sehr frostempfindlich; Frost schädigt den Baum leicht und kann ihn vollständig abtöten.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "sonne", "topic": "Klima & Standort"}, {"id": "a1-21", "mode": "anbau", "level": 1, "type": "mc", "q": "Die Varietät Geisha wurde durch Auktionsrekorde in Panama berühmt. Wo wurde sie ursprünglich gesammelt?", "options": ["In Jamaika", "Im Jemen", "In Äthiopien", "In Indonesien"], "correct": 2, "explain": "Geisha wurde in den 1930er-Jahren in äthiopischen Kaffeewäldern gesammelt und kam über Tansania und CATIE (Costa Rica) nach Panama.", "source": {"title": "World Coffee Research – Varietätenkatalog: Geisha (Panama)", "url": "https://varieties.worldcoffeeresearch.org/varieties/geisha-panama"}, "img": "bluete", "topic": "Arten & Sorten"}, {"id": "a1-22", "mode": "anbau", "level": 1, "type": "mc", "q": "Was ist Grundvoraussetzung für das Smithsonian-Siegel „Bird Friendly“?", "options": ["Fairtrade-Siegel plus Verzicht auf maschinelle Ernte", "Mindestpreis plus Anbau in Höhenlagen über 1.500 m", "Rainforest-Siegel plus Nistkästen auf jeder einzelnen Parzelle", "Bio-Zertifizierung plus vielfältiger Schattenbaumbestand"], "correct": 3, "explain": "Bird Friendly setzt eine Bio-Zertifizierung voraus; dazu kommen strenge Schattenkriterien, u. a. mindestens 40 % Kronendach und ein Hauptkronendach von mindestens 12 m.", "source": {"title": "Smithsonian Migratory Bird Center – Bird Friendly Coffee Norms", "url": "https://nationalzoo.si.edu/sites/default/files/documents/bf_norms_english_accessible.pdf"}, "img": "sonne", "topic": "Herkunft"}, {"id": "a1-23", "mode": "anbau", "level": 1, "type": "mc", "q": "Wozu dient der Fairtrade-Mindestpreis für Kaffee?", "options": ["Er legt fest, wie teuer eine Tasse im Café sein muss", "Er dient als Sicherheitsnetz bei stark fallendem Marktpreis", "Er garantiert dem Käufer eine bestimmte, geprüfte Tassenqualität", "Er gleicht Ernteausfälle nach Frost oder Dürre aus"], "correct": 1, "explain": "Der Mindestpreis wirkt als Untergrenze, wenn der Marktpreis fällt; zusätzlich gibt es die Fairtrade-Prämie, über deren Verwendung die Bauern gemeinsam entscheiden.", "source": {"title": "Fairtrade International – High coffee prices and Fairtrade value", "url": "https://www.fairtrade.net/en/get-involved/news/high-coffee-prices-and-fairtrade-value.html"}, "img": "berg", "topic": "Herkunft"}, {"id": "a1-24", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie entfernt ein optischer Farbsortierer fehlerhafte Rohkaffeebohnen?", "options": ["Mit einem gezielten Druckluftstoß", "Mit einem gezielten Wasserstrahl", "Mit einem Rüttelsieb nach Größe", "Mit einem Magnetfeld unter dem Band"], "correct": 0, "explain": "Die Bohnen fallen einzeln an Sensoren vorbei, die Defekte an der Farbe erkennen; ein kurzer Druckluftstoß schießt fehlerhafte Bohnen aus.", "source": {"title": "Coffee Review – Cleaning and Sorting", "url": "https://www.coffeereview.com/coffee-reference/from-crop-to-cup/processing/cleaning-and-sorting"}, "img": "kirsche", "topic": "Rohkaffee & Qualität"}, {"id": "a1-25", "mode": "anbau", "level": 1, "type": "mc", "q": "Was passiert beim „Strip Picking“?", "options": ["Nur die reifen Kirschen werden einzeln abgepflückt", "Die Blätter werden vor der Ernte vollständig vom Zweig gestreift", "Nur heruntergefallene Kirschen werden aufgesammelt", "Alle Kirschen eines Zweigs werden auf einmal abgestreift"], "correct": 3, "explain": "Beim Strip Picking werden alle Kirschen eines Zweigs in einem Zug abgestreift; im Gegensatz zur selektiven Ernte landen auch unreife Kirschen im Korb.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "kirsche", "topic": "Blüte & Ernte"}, {"id": "a1-26", "mode": "anbau", "level": 1, "type": "mc", "q": "In welchem Land setzen große Farmen auf flachen, riesigen Feldern häufig Erntemaschinen ein?", "options": ["Brasilien", "Jemen", "Ruanda", "Äthiopien"], "correct": 0, "explain": "In den meisten Ländern wird von Hand geerntet; in Brasilien mit flachem Gelände und großen Flächen nutzen größere Farmen auch Maschinen.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "kirsche", "topic": "Blüte & Ernte"}, {"id": "a1-27", "mode": "anbau", "level": 1, "type": "mc", "q": "Aus welcher Region stammt die wilde Kaffeeart Coffea liberica?", "options": ["Aus Westafrika", "Aus Südostasien", "Aus Madagaskar", "Aus Mittelamerika"], "correct": 0, "explain": "Wilde Liberica wächst nur in Waldgebieten weniger westafrikanischer Länder; angebaut wird sie heute vor allem in Malaysia, auf den Philippinen und in Liberia.", "source": {"title": "SCA 25 Magazine – Beyond Arabica and Robusta: Liberica and Excelsa", "url": "https://sca.coffee/sca-news/25/issue-25-insight-liberica-excelsa"}, "img": "pflanze", "topic": "Arten & Sorten"}, {"id": "a1-28", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie wächst Arabica in ihrer Heimat, den Bergwäldern Äthiopiens, von Natur aus?", "options": ["Als Kletterpflanze an den Stämmen und Ästen hoher Bäume", "Als Bodendecker auf feuchten, sonnigen Lichtungen", "Als Strauch im Unterholz, im Schatten höherer Bäume", "Als freistehender Baum in offener Grassavanne"], "correct": 2, "explain": "Arabica ist in tropischen Bergwäldern Äthiopiens heimisch und wuchs dort als Strauch im Unterholz.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "sonne", "topic": "Klima & Standort"}, {"id": "a1-29", "mode": "anbau", "level": 1, "type": "mc", "q": "Ab welcher Punktzahl galt ein Kaffee im klassischen 100-Punkte-Cupping-Schema der SCA als „Specialty“?", "options": ["Ab 80 Punkten", "Ab 70 Punkten", "Ab 75 Punkten", "Ab 85 Punkten"], "correct": 0, "explain": "Im klassischen SCA(A)-Bewertungsbogen galt ein Kaffee ab 80 Punkten als Specialty. Inzwischen setzt die SCA auf das neue Coffee Value Assessment (CVA).", "source": {"title": "Royal Coffee – Scoring Specialty Coffee: What Do the Numbers Mean?", "url": "https://royalcoffee.com/scoring-specialty-coffee-what-do-the-numbers-mean/"}, "img": "kirsche", "topic": "Rohkaffee & Qualität"}, {"id": "a1-30", "mode": "anbau", "level": 1, "type": "mc", "q": "Wofür steht die Bezeichnung „AA“ bei kenianischem Kaffee?", "options": ["Für die größte Bohnengröße", "Für die höchste Anbaulage", "Für die beste Cupping-Note", "Für die geringste Defektzahl"], "correct": 0, "explain": "Kenias Grades beruhen allein auf der Siebgröße: AA sind die größten Bohnen (Sieb 17/18), AB eine Stufe kleiner. Ein Geschmacksurteil ist das nicht.", "source": {"title": "TYPICA – Is Screen Size a Quality Indicator? Tips for Sourcing Kenyan Coffee", "url": "https://typica.coffee/en/https-typica-coffee-ja-screen-size-kenya/"}, "img": "kirsche", "topic": "Rohkaffee & Qualität"}, {"id": "a2-01", "mode": "anbau", "level": 2, "type": "mc", "q": "Wodurch wird Kaffeerost (Coffee Leaf Rust) verursacht?", "options": ["Durch das Bakterium Xylella fastidiosa", "Durch den Pilz Colletotrichum kahawae", "Durch den Pilz Hemileia vastatrix", "Durch den Pilz Fusarium xylarioides"], "correct": 2, "explain": "Kaffeerost ist eine Pilzkrankheit (Hemileia vastatrix). Sie führt zu Blattfall und kann in schweren Fällen 35 % bis über 75 % Ertragsverlust bringen.", "source": {"title": "World Coffee Research – Coffee leaf rust knows no borders (2025)", "url": "https://worldcoffeeresearch.org/news/2025/coffee-leaf-rust-knows-no-borders-neither-does-coffee-science"}, "img": "blatt", "topic": "Krankheiten & Schädlinge"}, {"id": "a2-02", "mode": "anbau", "level": 2, "type": "case", "q": "Du findest Kirschen mit einem winzigen Bohrloch am Blütenansatz; innen ist der Samen zerfressen. Wer steckt dahinter?", "options": ["Die Antestia-Wanze", "Die Kaffee-Blattminiermotte", "Der Kaffeestammbohrer", "Der Kaffeekirschenkäfer"], "correct": 3, "explain": "Das Weibchen des Kaffeekirschenkäfers bohrt sich meist am Blütenansatz in die Kirsche und legt Brutgänge an; die Larven fressen den Samen.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge"}, {"id": "a2-03", "mode": "anbau", "level": 2, "type": "mc", "q": "In welchem Bereich liegt die als ideal geltende Jahresmitteltemperatur für Arabica?", "options": ["Etwa 18–21 °C", "Etwa 13–16 °C", "Etwa 23–26 °C", "Etwa 27–30 °C"], "correct": 0, "explain": "Für Arabica gilt eine Jahresmitteltemperatur von etwa 18–21 °C als optimal; über 23 °C reifen die Früchte zu schnell, was oft Qualität kostet.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "sonne", "topic": "Klima & Standort"}, {"id": "a2-04", "mode": "anbau", "level": 2, "type": "case", "q": "Nach dem Rösten fallen einzelne auffallend helle Bohnen auf, sogenannte Quaker. Was steckt dahinter?", "options": ["Überfermentierte Samen mit abgebautem Zuckergehalt", "Beigemischte Robusta-Bohnen mit hellerer Röstfarbe", "Zu feuchte Bohnen, die in der Röstung nicht bräunen", "Unreife Samen, denen Zucker für die Bräunung fehlt"], "correct": 3, "explain": "Quaker sind unreife Samen ohne die passenden Zucker für die Maillard-Reaktion, deshalb bräunen sie kaum. Im Rohkaffee sind sie meist nicht zu erkennen.", "source": {"title": "Barista Hustle – The End of Quakers? (2022)", "url": "https://www.baristahustle.com/?p=410933"}, "img": "kirsche", "topic": "Rohkaffee & Qualität"}, {"id": "a2-05", "mode": "anbau", "level": 2, "type": "mc", "q": "Was löst bei Kaffee typischerweise die Hauptblüte aus?", "options": ["Eine längere Hitzeperiode", "Starker Rückschnitt der Zweige", "Regen nach einer Trockenphase", "Eine kräftige Stickstoffdüngung"], "correct": 2, "explain": "Kaffee braucht eine Phase mit Wassermangel und anschließenden Regen, damit die ruhenden Blütenknospen aufbrechen; eine Trockenzeit von 2–4 Monaten fördert die Blüte.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol.", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "bluete", "topic": "Blüte & Ernte"}, {"id": "a2-06", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie lange brauchen Arabica-Früchte ungefähr von der Blüte bis zur Reife?", "options": ["Etwa 2–3 Monate", "Etwa 12–15 Monate", "Etwa 18–24 Monate", "Etwa 6–9 Monate"], "correct": 3, "explain": "Arabica braucht je nach Lage und Quelle etwa 6–9 Monate bis zur Reife, Robusta (C. canephora) meist deutlich länger.", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Blüte & Ernte"}, {"id": "a2-07", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ist die Varietät Caturra?", "options": ["Eine natürliche Kreuzung aus Arabica und Robusta", "Eine natürliche Zwergmutation von Bourbon aus Brasilien", "Eine wilde Landrasse aus den Wäldern Äthiopiens", "Eine natürliche Zwergmutation von Typica von der Insel Java"], "correct": 1, "explain": "Caturra entstand als natürliche Mutation von Bourbon in Minas Gerais (Brasilien); ein einzelnes Gen macht die Pflanze kompakt.", "source": {"title": "World Coffee Research – Varietätenkatalog: Caturra", "url": "https://varieties.worldcoffeeresearch.org/varieties/caturra"}, "img": "pflanze", "topic": "Arten & Sorten"}, {"id": "a2-08", "mode": "anbau", "level": 2, "type": "mc", "q": "Aus welchen Eltern wurde die Varietät Catuaí gezüchtet?", "options": ["Typica × Bourbon", "Pacas × Maragogipe", "Timor-Hybrid × Villa Sarchi", "Mundo Novo × Caturra"], "correct": 3, "explain": "Catuaí ist eine Kreuzung aus dem ertragreichen Mundo Novo und dem kompakten Caturra, gezüchtet vom IAC in Campinas, Brasilien.", "source": {"title": "World Coffee Research – Varietätenkatalog: Catuai", "url": "https://varieties.worldcoffeeresearch.org/varieties/catuai"}, "img": "pflanze", "topic": "Arten & Sorten"}, {"id": "a2-09", "mode": "anbau", "level": 2, "type": "mc", "q": "Woher hat die Varietät Bourbon ihren Namen?", "options": ["Vom Händler, der sie als Erster nach Brasilien brachte", "Von der Insel Bourbon, dem heutigen La Réunion", "Von einer Plantage im Hochland des Jemen", "Vom Botaniker, der sie zuerst beschrieben hat"], "correct": 1, "explain": "Französische Missionare brachten die Pflanzen Anfang des 18. Jh. aus dem Jemen auf die Insel Bourbon (heute La Réunion), die der Varietät den Namen gab.", "source": {"title": "World Coffee Research – Varietätenkatalog: Bourbon", "url": "https://varieties.worldcoffeeresearch.org/varieties/bourbon"}, "img": "pflanze", "topic": "Arten & Sorten"}, {"id": "a2-10", "mode": "anbau", "level": 2, "type": "mc", "q": "Wozu dient die Fermentation bei der gewaschenen Aufbereitung (Washed)?", "options": ["Um den Koffeingehalt der Bohnen deutlich zu senken", "Um Bitterstoffe aus den Bohnen ins Waschwasser zu ziehen", "Um den Fruchtschleim zu lösen, damit er abwaschbar wird", "Um das Pergament zu erweichen, damit es abfällt"], "correct": 2, "explain": "Nach dem Entpulpen lösen Enzyme und Mikroorganismen den klebrigen Fruchtschleim, anschließend wird er abgewaschen und der Pergamentkaffee getrocknet.", "source": {"title": "Coffee Review – Processing Coffee: Fruit Removal and Drying", "url": "https://www.coffeereview.com/?p=5562"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a2-11", "mode": "anbau", "level": 2, "type": "case", "q": "Du kippst frisch geerntete Kirschen ins Wasserbecken; einige schwimmen oben. Was tust du?", "options": ["Behalten und zur besten Partie geben, sie sind am reifsten", "Abschöpfen und getrennt halten, da sie oft mangelhaft sind", "Untertauchen, bis sie absinken, und dann normal verarbeiten", "Mit den anderen mischen, da Schwimmen nichts aussagt"], "correct": 1, "explain": "Beim Floaten treiben vertrocknete, insektenbefallene, schlecht entwickelte und leichte Kirschen auf und werden abgetrennt; reife Kirschen sinken.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Aufbereitung"}, {"id": "a2-12", "mode": "anbau", "level": 2, "type": "mc", "q": "Auf welche Restfeuchte wird Pergamentkaffee üblicherweise getrocknet, damit er lagerstabil ist?", "options": ["Etwa 6–8 %", "Etwa 14–16 %", "Etwa 10–12 %", "Etwa 18–20 %"], "correct": 2, "explain": "Ziel ist ein stabiler Bereich von etwa 10–12 % Feuchte (Nassbasis); zu feuchter Kaffee ist nicht lagerstabil.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a2-13", "mode": "anbau", "level": 2, "type": "mc", "q": "Welche Honey-Stufe behält beim Trocknen am meisten Fruchtschleim (Mucilage) an der Bohne?", "options": ["White Honey", "Black Honey", "Yellow Honey", "Red Honey"], "correct": 1, "explain": "Je dunkler die Farbbezeichnung, desto mehr Mucilage bleibt beim Trocknen an der Bohne – Black Honey behält am meisten.", "source": {"title": "Sprudge – What Is Honey Processed Coffee?", "url": "https://sprudge.com/what-is-honey-processed-coffee-184876.html"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a2-14", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie wird die Kaffeekirsche botanisch eingeordnet?", "options": ["Als Kapselfrucht (Capsula)", "Als Steinfrucht (Drupe)", "Als Nussfrucht (Nux)", "Als Hülsenfrucht (Legumen)"], "correct": 1, "explain": "Die Kaffeekirsche ist eine Steinfrucht: fleischiges Mesokarp um ein verholztes Endokarp (das Pergament).", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Botanik"}, {"id": "a2-15", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie ist die brasilianische Varietät Mundo Novo entstanden?", "options": ["Als Kreuzung von Caturra und dem Timor-Hybrid", "Als natürliche Kreuzung von Typica und Bourbon", "Als natürliche Kreuzung von Arabica und Liberica", "Als natürliche Zwergmutation von Bourbon"], "correct": 1, "explain": "Mundo Novo ist eine natürliche Kreuzung aus Bourbon und Typica, entdeckt 1943 in São Paulo und vom IAC selektiert.", "source": {"title": "World Coffee Research – Varietätenkatalog: Mundo Novo", "url": "https://varieties.worldcoffeeresearch.org/varieties/mundo-novo"}, "img": "pflanze", "topic": "Arten & Sorten"}, {"id": "a2-16", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ist typisch für die Varietät Maragogipe?", "options": ["Gelbe Kirschen, als Mutation von Bourbon", "Sehr kleine Bohnen, als Zwergmutation von Bourbon", "Hohe Rostresistenz, als Kreuzung mit Robusta", "Sehr große Bohnen, als Mutation von Typica"], "correct": 3, "explain": "Maragogipe ist eine natürliche Typica-Mutation, 1870 nahe der brasilianischen Stadt Maragogipe entdeckt, mit sehr großen Bohnen.", "source": {"title": "World Coffee Research – Varietätenkatalog: Maragogipe", "url": "https://varieties.worldcoffeeresearch.org/varieties/maragogipe"}, "img": "kirsche", "topic": "Arten & Sorten"}, {"id": "a2-17", "mode": "anbau", "level": 2, "type": "mc", "q": "Welche Eigenschaft war das Hauptziel bei der Züchtung der kolumbianischen Varietät Castillo durch Cenicafé?", "options": ["Resistenz gegen Kaffeerost", "Resistenz gegen Frost", "Resistenz gegen Trockenheit", "Resistenz gegen den Kirschenkäfer"], "correct": 0, "explain": "Castillo geht auf Caturra × Timor-Hybrid zurück und wurde von Cenicafé gezielt auf Rostresistenz gezüchtet.", "source": {"title": "Duque-Orrego et al. (2005), Cenicafé 56(3) – Adopción de las variedades Castillo® resistentes a la roya", "url": "https://www.cenicafe.org/es/publications/arc056%2803%29197-215.pdf"}, "img": "blatt", "topic": "Arten & Sorten"}, {"id": "a2-18", "mode": "anbau", "level": 2, "type": "mc", "q": "Welches Land verlor im 19. Jahrhundert durch Kaffeerost seine führende Kaffeeproduktion und stieg auf Tee um?", "options": ["Ceylon (heute Sri Lanka)", "Goldküste (heute Ghana)", "Siam (heute Thailand)", "Burma (heute Myanmar)"], "correct": 0, "explain": "Ceylon war die führende Kaffeeregion, bis Rost ab 1869 die Plantagen unwirtschaftlich machte; die Pflanzer stiegen größtenteils auf Tee um.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge"}, {"id": "a2-19", "mode": "anbau", "level": 2, "type": "mc", "q": "Wo wurde Kaffeerost 1970 erstmals auf dem amerikanischen Kontinent entdeckt?", "options": ["In Bahia, Brasilien", "In Antioquia, Kolumbien", "In Chiapas, Mexiko", "In Matagalpa, Nicaragua"], "correct": 0, "explain": "1970 wurde Rost in Bahia (Brasilien) entdeckt; innerhalb von weniger als zehn Jahren breitete er sich über Süd- und Mittelamerika aus.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge"}, {"id": "a2-20", "mode": "anbau", "level": 2, "type": "mc", "q": "Was passiert bei der indischen Spezialität „Monsooned Malabar“?", "options": ["Kirschen bleiben während des Monsuns am Baum hängen und trocknen", "Rohkaffee wird in offenen Lagerhallen dem Monsunwind ausgesetzt", "Rohkaffee wird in Meerwasser gewaschen und anschließend getrocknet", "Kirschen werden nur in der Trockenzeit vor dem Monsun geerntet"], "correct": 1, "explain": "Der Rohkaffee nimmt in belüfteten Lagerhallen an der Malabarküste Feuchtigkeit aus den Monsunwinden auf; er quillt deutlich auf und wird blassgelb. Der Prozess dauert etwa 12–16 Wochen.", "source": {"title": "Coffee Board of India – GI-Antrag „Monsooned Malabar Arabica Coffee“", "url": "https://www.origin-gi.com/wp-content/uploads/2017/01/48-monsooned-malabar-arabica-coffee.pdf"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a2-21", "mode": "anbau", "level": 2, "type": "mc", "q": "Welche Jahresniederschlagsmenge gilt für Arabica als optimal?", "options": ["Etwa 500–800 mm", "Etwa 250–500 mm", "Etwa 1.200–1.800 mm", "Etwa 3.000–4.000 mm"], "correct": 2, "explain": "Für Arabica gelten etwa 1.200–1.800 mm Jahresniederschlag als optimal; Robusta verträgt sehr hohe Niederschläge über 2.000 mm besser.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "sonne", "topic": "Klima & Standort"}, {"id": "a2-22", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie nennt man das Sämlingsstadium, in dem die beiden runden Keimblätter entfaltet sind?", "options": ["Schmetterlingsstadium (Butterfly)", "Streichholzstadium (Matchstick)", "Soldatenstadium (Soldier)", "Rosettenstadium (Rosette)"], "correct": 0, "explain": "Nach dem Streichholzstadium (Matchstick) folgt das Keimblatt- bzw. „Butterfly“-Stadium; in diesen Stadien werden Sämlinge in Beutel umgepflanzt.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 2: Nursery practices", "url": "https://www.fao.org/4/ae939e/ae939e04.htm"}, "img": "pflanze", "topic": "Botanik"}, {"id": "a2-23", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ergab die Klimastudie von Bunn et al. (2015) für Arabica bis 2050?", "options": ["Die geeignete Fläche wächst um etwa die Hälfte", "Etwa die Hälfte der geeigneten Fläche geht verloren", "Etwa ein Zehntel der geeigneten Fläche geht verloren", "Die geeignete Fläche bleibt insgesamt etwa gleich"], "correct": 1, "explain": "Die Studie bestätigte, dass bis 2050 etwa die Hälfte der heute für Arabica geeigneten Flächen ungeeignet wird; die geeigneten Lagen wandern im Mittel über 300 m höher.", "source": {"title": "World Coffee Research – Climate change: Pinpointi
