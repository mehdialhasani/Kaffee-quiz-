ie Trommel gleichmäßiger heizt"], "correct": 2, "explain": "Brandflecken auf den flachen Seiten sind Scorching. Bleiben Charge-Temperatur und Füllmenge gleich, ist die zu langsame Trommel die naheliegende Ursache, die Bohnen liegen zu lange an der heißen Wand.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "st": 2}, {"id": "r2-30", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Was tust du mit dieser Partie?", "case": {"title": "Fall · Rohkaffee-Eingang", "facts": ["Wasseraktivität 0,68 aw", "Lieferung im Sommer, Lager warm", "Kaffee schmeckt bei Ankunft gut"], "cup": "Probe sauber und frisch"}, "options": ["Länger im Jutesack lagern, damit die Feuchte entweicht", "Zeitnah rösten, bis dahin kühl im hermetischen Liner lagern", "Als Reserve für das kommende Jahr im Lager einplanen", "Mit höherer Charge-Temperatur rösten, sonst normal lagern"], "correct": 1, "explain": "Über etwa 0,60 aw ist Rohkaffee weniger lagerstabil, steigt das Mikrobenrisiko, und er verliert schneller an Qualität. Kühl und hermetisch lagern und zügig rösten.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part I: Moisture Content and Water Activity", "url": "https://royalcoffee.com/green-coffee-analytics-relevance-to-roasters-buyers-and-producers-part-i-moisture-content-and-total-water-activity/"}, "img": "sack", "st": 2}, {"id": "r3-13", "mode": "roester", "level": 3, "type": "mc", "topic": "Ruhezeit & Lagerung", "q": "Wie beeinflusst der Röstgrad das Ausgasen ganzer Bohnen laut Smrke et al.?", "options": ["Hellere Röstungen gasen mehr und schneller aus", "Kein messbarer Unterschied zwischen Röstgraden", "Nur die Röstzeit zählt, nicht der Röstgrad", "Dunklere Röstungen gasen mehr und schneller aus"], "correct": 3, "explain": "Dunkle Röstungen gaben in der Studie ein Mehrfaches an Gas ab und schneller als helle. Der Röstgrad wirkte stärker als die Röstgeschwindigkeit.", "source": {"title": "Smrke et al. 2017 – Time-resolved gravimetric method to assess degassing of roasted coffee (ZHAW)", "url": "https://digitalcollection.zhaw.ch/bitstream/11475/12175/2/2017_Smrke-etal_Roasted-coffe-degassing-time-resolved-gravimetry.pdf"}, "img": "kurve", "st": 1}, {"id": "r3-14", "mode": "roester", "level": 3, "type": "mc", "topic": "Sicherheit", "q": "Was gilt für Diacetyl und 2,3-Pentandion in Röstereien?", "options": ["Sie entstehen beim Rösten, beim Mahlen ist die Belastung oft am höchsten", "Sie stammen aus Aromazusätzen, im Röstkaffee entstehen sie nicht", "Sie entstehen beim Rösten, zerfallen aber schon beim Abkühlen", "Sie entstehen im Rohkaffeelager und werden beim Rösten wieder zerstört"], "correct": 0, "explain": "Beide Stoffe kommen natürlich in Röstkaffee vor und werden teils zusätzlich in Aromen eingesetzt. Eingeatmet können sie Bronchiolitis obliterans auslösen, beim Mahlen wurden die höchsten Werte gemessen.", "source": {"title": "LeBouf et al. 2020, Frontiers in Public Health – Diacetyl, 2,3-Pentanedione in Coffee Roasting Facilities", "url": "https://www.frontiersin.org/articles/10.3389/fpubh.2020.561740/pdf"}, "img": "sack", "st": 9}, {"id": "r3-15", "mode": "roester", "level": 3, "type": "mc", "topic": "Wärme & Maschine", "q": "Warum empfiehlt Scott Rao dünne Fühler (nicht über ca. 3 mm) für den Bohnenfühler?", "options": ["Sie sind robuster und verbiegen sich im Bohnenbett nicht", "Sie reagieren schneller, RoR-Änderungen werden früher sichtbar", "Sie glätten die Kurve, sodass die RoR ruhiger aussieht", "Sie zeigen höhere Temperaturen und liefern damit realistischere Werte"], "correct": 1, "explain": "Dicke Fühler reagieren träge, die Kurve hinkt der Bohne hinterher. Rao rät, die thermische Verzögerung zu begrenzen, um z. B. einen Flick rechtzeitig zu erkennen.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "st": 5}, {"id": "r3-16", "mode": "roester", "level": 2, "type": "mc", "topic": "Wärme & Maschine", "q": "Wo sitzt laut Barista Hustle der ET-Fühler typischerweise?", "options": ["Im Rohkaffeetrichter über der Trommel", "Im Bohnenbett an der Trommelfront", "Im Luftstrom zwischen Trommel und Abluft", "Direkt über der Brennerflamme"], "correct": 2, "explain": "Die Spitze des BT-Fühlers gehört ins Bohnenbett, die des ET-Fühlers in den Luftstrom zwischen Trommel und Abluft. Empfohlen werden ungeerdete Thermoelemente Typ J oder K mit etwa 3 mm.", "source": {"title": "Barista Hustle – Roasting Science: Fühler-Platzierung (BT/ET)", "url": "https://www.baristahustle.com/?p=450912"}, "img": "trommel", "st": 5}, {"id": "r3-17", "mode": "roester", "level": 3, "type": "mc", "topic": "Wärme & Maschine", "q": "Was gilt laut Barista Hustle für Röster mit Luftrückführung (Rezirkulation)?", "options": ["Sie brauchen für dieselbe Menge weniger Wärmezufuhr", "Sie brauchen für dieselbe Menge deutlich mehr Wärmezufuhr", "Sie kommen ganz ohne Abluft oder Zyklon aus", "Sie eignen sich nur für kleine Probenröstungen"], "correct": 0, "explain": "Rezirkulierende Röster sind energieeffizienter und brauchen weniger Wärme für dieselbe Menge. Für die Kapazität ist sonst vor allem die Brennerleistung entscheidend.", "source": {"title": "Barista Hustle – Roasting Science RS 4.09: Batch Size", "url": "https://baristahustle.com/?p=432443"}, "img": "trommel", "st": 4}, {"id": "r3-18", "mode": "roester", "level": 3, "type": "mc", "topic": "Wärme & Maschine", "q": "Was sagt die vom Hersteller angegebene Röstkapazität laut Barista Hustle meist aus?", "options": ["Die optimale Chargengröße für Specialty-Röstungen", "Die Mindestmenge, damit der Bohnenfühler bedeckt ist", "Ein Richtwert, den man um etwa 20 % gefahrlos überschreiten kann", "Oft ein theoretisches Maximum, real röstet man kleiner"], "correct": 3, "explain": "Die Nennkapazität ist oft ein theoretisches Maximum, Profis rösten meist kleinere Chargen. Bei manchen Maschinen liegt die beste Maximalcharge nur bei etwa der Hälfte.", "source": {"title": "Barista Hustle – Roasting Science RS 4.09: Batch Size", "url": "https://baristahustle.com/?p=432443"}, "img": "trommel", "st": 2}, {"id": "r3-20", "mode": "roester", "level": 2, "type": "mc", "topic": "Cupping & Qualität", "q": "Welches Verhältnis Kaffee zu Wasser sieht das SCA-Cupping-Protokoll vor?", "options": ["8,25 g auf 150 ml (ca. 1:18)", "15 g auf 150 ml (ca. 1:10)", "10 g auf 250 ml (ca. 1:25)", "12 g auf 100 ml (ca. 1:8)"], "correct": 0, "explain": "Das Protokoll nennt 8,25 g ganze Bohnen auf 150 ml Wasser, etwa 1:18. Aufgegossen wird mit rund 93 °C.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "sack", "st": 3}, {"id": "r3-21", "mode": "roester", "level": 3, "type": "mc", "topic": "Rohkaffee", "q": "Was hilft laut Sweet Maria's am meisten, wenn man eine Blend vorgemischt (Pre-Blend) röstet?", "options": ["Eine etwas längere Zeit im First Crack, etwa 30–60 Sekunden", "Etwas mehr Luftstrom im First Crack, etwa eine Stufe höher", "Eine etwas längere Trocknungsphase, etwa 30–60 Sekunden", "Eine etwas höhere Charge-Temperatur, etwa 10–15 °C mehr"], "correct": 2, "explain": "Sweet Maria's nennt eine etwas längere Trocknung als Schlüssel für Pre-Blends und rät davon ab, die Zeit im First Crack zu strecken. Zu viel Luft im First Crack kann bei weniger dichten Bohnen Tipping fördern.", "source": {"title": "Sweet Maria's – Blending Resources and Resourceful Blending", "url": "https://library.sweetmarias.com/blending-resources-and-resourceful-blending/"}, "img": "kurve", "st": 5}, {"id": "r3-22", "mode": "roester", "level": 3, "type": "mc", "topic": "Chemie", "q": "Bei welcher Wasseraktivität laufen Maillard-Reaktionen laut Royal Coffee am schnellsten?", "options": ["Etwa 0,10–0,20", "Etwa 0,30–0,40", "Etwa 0,90–1,00", "Etwa 0,60–0,70"], "correct": 3, "explain": "Die Maillard-Rate steigt mit der Wasseraktivität, erreicht zwischen 0,60 und 0,70 ihr Maximum und sinkt darüber wieder. Deshalb ist aw auch für die Lagerung von Rohkaffee wichtig.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part I: Moisture Content and Water Activity", "url": "https://royalcoffee.com/green-coffee-analytics-relevance-to-roasters-buyers-and-producers-part-i-moisture-content-and-total-water-activity/"}, "img": "bohne", "st": 6}, {"id": "r3-23", "mode": "roester", "level": 3, "type": "mc", "topic": "Chemie", "q": "Warum lassen sich Acrylamid und Furan über den Röstgrad nicht gleichzeitig minimieren?", "options": ["Acrylamid steigt bei dunkler Röstung, Furane sinken", "Acrylamid sinkt bei dunkler Röstung, Furane steigen", "Acrylamid und Furane steigen beide bei dunkler Röstung", "Beide entstehen erst beim Mahlen, nicht beim Rösten"], "correct": 1, "explain": "Eine Studie zeigte: Acrylamid sinkt bei längerer, dunklerer Röstung wieder, Furane nehmen zu. Eine Veränderung des Röstgrads senkt also das eine und erhöht das andere.", "source": {"title": "Daily Coffee News – Study: Common coffee toxicants cannot be simultaneously reduced in roasting", "url": "https://dailycoffeenews.com/2023/09/28/study-common-coffee-toxicants-cannot-be-simultaneously-reduced-in-roasting"}, "img": "kurve", "st": 8}, {"id": "r3-24", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du für diese Partie?", "case": {"title": "Fall · Brasilien, natural, niedrige Dichte", "facts": ["Profil von einem sehr dichten Kenia übernommen", "Hohe Charge-Temperatur, früh volle Leistung", "Dunkle Flecken, Fehlaromen"], "cup": "Brandig, wenig Süße"}, "options": ["Mehr Hitze geben, damit die Röstung kürzer und sauberer wird", "Profil mit sanfterer Wärmezufuhr für geringe Dichte anlegen", "Profil beibehalten, nur die Entwicklung deutlich verlängern", "Charge vergrößern und den Luftstrom deutlich drosseln"], "correct": 1, "explain": "Dichte Bohnen vertragen kräftige Hitze, Bohnen mit geringer Dichte neigen dabei zu Scorching und Fehlaromen. Ein erfahrener Röster passt die Wärmezufuhr der Dichte an.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "bohne", "st": 5}, {"id": "r3-25", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du für das Ziel „hell und lebendig“?", "case": {"title": "Fall · Äthiopien, gewaschen, 2.100 m, sehr dicht", "facts": ["Sehr sanfte Wärmezufuhr", "Drop 15:30", "Röstfarbe hell"], "cup": "Flach, gedämpfte Säure, wenig Frucht"}, "options": ["Früh mehr Energie, zügiger zu heller Endtemperatur", "Noch sanfter rösten, damit die Säure erhalten bleibt", "Dunkler droppen, damit Säure und Frucht hervortreten", "Länger trocknen, Endtemperatur und Drop beibehalten"], "correct": 0, "explain": "Zu wenig Hitze bzw. zu langsames Rösten macht Kaffee gebacken, mit flacher Säure. Für dichte Bohnen empfiehlt Royal Coffee kräftigere Hitze und zügiges Rösten zu einer hellen Endtemperatur.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "kurve", "st": 5}, {"id": "r3-26", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du am QC-Arbeitsplatz?", "case": {"title": "Fall · Qualitätslabor der Rösterei", "facts": ["Mühle in kleinem, geschlossenem Raum", "Keine Absaugung an der Mühle", "Messung zeigt Diacetyl über dem NIOSH-Richtwert von 5 ppb"], "cup": "Mitarbeiter mahlt täglich viele Proben"}, "options": ["Staubmaske beim Mahlen und Tür geschlossen halten", "Proben vorab mahlen und offen im Raum ausgasen lassen", "Weniger lüften, damit die Proben ihr Aroma behalten", "Lokale Absaugung an der Mühle und bessere Belüftung"], "correct": 3, "explain": "NIOSH empfiehlt lokale Absaugung an allen Mühlen. Mühlen können zusätzlich in einem getrennt belüfteten Raum stehen. Beim Mahlen entstehen besonders hohe Diacetyl-Spitzen.", "source": {"title": "NIOSH HHE 2016-0144-3305 – Coffee roasting and packaging facility", "url": "https://www.cdc.gov/niosh/hhe/reports/pdfs/2016-0144-3305.pdf"}, "img": "sack", "st": 2}, {"id": "r3-27", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du bei der halben Charge?", "case": {"title": "Fall · Chargengröße halbiert", "facts": ["Bisher volle Chargen, jetzt 50 %", "Charge-Temperatur unverändert hoch", "Bohnenenden dunkel verbrannt"], "cup": "Rauchig, leicht verbrannt"}, "options": ["Charge-Temperatur beibehalten, mehr Luft im First Crack", "Charge-Temperatur für die kleinere Charge senken", "Später droppen, damit die Bohnen gleichmäßiger werden", "Trommeldrehzahl senken, damit die Bohnen ruhiger liegen"], "correct": 1, "explain": "Verbrannte Spitzen sind Tipping, meist durch eine zu heiße Startumgebung. Bei weniger Bohnen wirkt dieselbe Charge-Temperatur stärker, darum wird sie gesenkt.", "source": {"title": "Sweet Maria's – Glossar: Tipping", "url": "https://library.sweetmarias.com/glossary/tipping/"}, "img": "bohne", "st": 4}, {"id": "r3-28", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du?", "case": {"title": "Fall · Kunde meldet Probleme beim Brühen", "facts": ["Barista muss sehr fein mahlen, Extraktion trotzdem niedrig", "Bohnen lassen sich schwer mit dem Fingernagel brechen", "Kurve unauffällig"], "cup": "Erdnuss, vegetal, herb"}, "options": ["Früher droppen, damit die Bohnen weniger spröde werden", "Kurve beibehalten und dem Kunden gröberes Mahlen empfehlen", "Mehr Entwicklung: etwas dunkler oder mit mehr Wärme rösten", "Mehr Ruhezeit vor dem Versand, damit die Extraktion steigt"], "correct": 2, "explain": "Zähe Bohnen, schwere Extraktion und Erdnussnoten sprechen für Unterentwicklung, die man an der Kurve allein oft nicht sieht. Abhilfe ist mehr Entwicklung.", "source": {"title": "Barista Hustle – Underdevelopment vs. Baking", "url": "https://www.baristahustle.com/?p=474557"}, "img": "bohne", "st": 2}, {"id": "r3-29", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du an der Verpackung?", "case": {"title": "Fall · Großkunde will 6 Monate Haltbarkeit", "facts": ["Ventiltüte ohne Schutzgas", "Nach etwa 3 Monaten deutlich schal", "Lagerung bei Raumtemperatur"], "cup": "Oxidiert, flach"}, "options": ["Tüten mit Mikroperforation statt Ventil verwenden", "Heller rösten, damit der Kaffee langsamer altert", "Ventil entfernen und die Tüten fester verschließen", "Mit Stickstoff spülen und Barrierefolie verwenden"], "correct": 3, "explain": "In einer Studie hielt Röstkaffee mit Stickstoffspülung mindestens 6 Monate, ohne nur etwa 3. Weniger Restsauerstoff bremst die Oxidation.", "source": {"title": "Scielo – Café torrado e moído em embalagens com atmosfera de nitrogênio (Ciênc. Tecnol. Aliment.)", "url": "https://www.scielo.br/j/cta/a/CTZcCZjzvNfSLxFYSxWx84n/abstract/?lang=en"}, "img": "sack", "st": 2}, {"id": "r3-30", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du vor dem Rösten?", "case": {"title": "Fall · Rohkaffee aus dem Gefrierlager", "facts": ["Liner direkt aus dem Gefrierraum geöffnet", "Sofort geröstet", "Erste Chargen trocknen sichtbar anders"], "cup": "Uneinheitlich zwischen den Chargen"}, "options": ["Im geschlossenen Liner ganz auf Raumtemperatur kommen lassen", "Gefroren rösten, dafür die Charge-Temperatur deutlich erhöhen", "Liner sofort öffnen, damit die Bohnen schneller auftauen", "Gefroren rösten, dafür die Trocknungsphase verkürzen"], "correct": 0, "explain": "Barista Hustle betont, dass Rohkaffee vor dem Rösten innen und außen eine gleichmäßige Temperatur haben soll. Geschlossen auftauen verhindert Kondenswasser an den Bohnen.", "source": {"title": "Barista Hustle – Storing Green Coffee", "url": "https://www.baristahustle.com/?p=437739"}, "img": "sack", "st": 2}, {"id": "r3-31", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du an der Messung?", "case": {"title": "Fall · Profilröstung mit trägem Fühler", "facts": ["Geerdeter Bohnenfühler mit ca. 6 mm", "RoR reagiert spät auf Gasänderungen", "Röstige Noten trotz scheinbar glatter Kurve"], "cup": "Röstig, wenig Delikatesse"}, "options": ["Dickeren Fühler (ca. 8 mm), stärkere RoR-Glättung wählen", "Dünneren Fühler (max. ca. 3 mm), schnelle RoR-Einstellung", "Fühler weiter aus dem Bohnenbett ziehen, Glättung erhöhen", "Gleichen Fühler behalten, nur noch nach Farbe droppen"], "correct": 1, "explain": "Dicke Fühler verzögern die Messung und können einen Flick verdecken. Rao rät zu dünnen Fühlern und der schnellsten RoR-Einstellung, die die Sonde zulässt.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "st": 5}, {"id": "r3-32", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du an der Durchführung?", "case": {"title": "Fall · Cupping mit neuem Team", "facts": ["Wasser sprudelnd kochend aufgegossen", "Nur 1 Tasse pro Probe", "Kruste nach 8 Minuten gebrochen"], "cup": "Bewertungen schwanken stark"}, "options": ["Ca. 100 °C, 3 Tassen pro Probe, Kruste nach 6 Minuten brechen", "Ca. 85 °C, 1 Tasse pro Probe, Kruste nach 4 Minuten brechen", "Ca. 93 °C, 5 Tassen pro Probe, Kruste nach 4 Minuten brechen", "Ca. 93 °C, 2 Tassen pro Probe, Kruste nach 10 Minuten brechen"], "correct": 2, "explain": "Das SCA-Protokoll nennt 92,2–94,4 °C, 5 Tassen pro Probe und 4 Minuten bis zum Brechen der Kruste. Mehrere Tassen zeigen auch Unterschiede zwischen den Tassen.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "sack", "st": 2}, {"id": "r3-33", "mode": "roester", "level": 3, "type": "case", "topic": "Fallstudie", "q": "Was änderst du?", "case": {"title": "Fall · Brasilien, natural, geringe Dichte", "facts": ["Luftstrom im First Crack auf Maximum", "Charge-Temperatur normal", "Dunkle Bohnenspitzen"], "cup": "Leicht brandig im Abgang"}, "options": ["Luftstrom im First Crack reduzieren", "Luftstrom im First Crack weiter erhöhen", "Gas im First Crack deutlich erhöhen", "Später droppen, bis in den Second Crack"], "correct": 0, "explain": "Bei normaler Starthitze kommt der hohe Luftstrom als Ursache in Frage. Sweet Maria's nennt zu viel Luft, besonders im First Crack, als Auslöser für Tipping bei weniger dichten Bohnen.", "source": {"title": "Sweet Maria's – Blending Resources and Resourceful Blending", "url": "https://library.sweetmarias.com/blending-resources-and-resourceful-blending/"}, "img": "bohne", "st": 3}, {"id": "r2-31", "mode": "roester", "level": 1, "type": "mc", "topic": "Wärme & Maschine", "img": "trommel", "q": "Wie röstet ein Wirbelschichtröster (Fluid Bed)?", "options": ["Heiße Luft von unten hält die Bohnen in der Schwebe", "Eine beheizte Trommel wälzt die Bohnen langsam um", "Eine offene Flamme berührt die Bohnen in der Trommel", "Infrarotstrahler erhitzen die ruhenden Bohnen von oben"], "correct": 0, "explain": "Beim Fluid-Bed-Röster strömt heiße Luft durch ein Lochblech unter den Bohnen. Der Luftstrom ist so stark, dass die Bohnen schweben und umherwirbeln; die Wärme kommt fast nur über die Luft. Trommelröster wälzen die Bohnen dagegen in einer beheizten Trommel.", "source": {"title": "Wikipedia – Coffee roasting", "url": "https://en.wikipedia.org/wiki/Coffee_roasting"}, "st": 9}, {"id": "r1-101", "mode": "roester", "level": 1, "type": "mc", "q": "In welche drei Phasen teilt man eine Röstung üblicherweise ein?", "options": ["Vorheizen, Trocknung, Abkühlung", "Gelbphase, Second Crack, Ruhezeit", "Trocknung, Maillard-Phase, Entwicklung", "Ladephase, First Crack, Verpackung"], "correct": 2, "explain": "Royal Coffee nennt drei Röstphasen: Trocknung (vom Laden bis zum Gelbwerden), Maillard-Phase (bis etwa zum First Crack) und Entwicklung (vom First Crack bis zum Drop).", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "kurve", "topic": "Phasen & Crack", "st": 5}, {"id": "r1-102", "mode": "roester", "level": 1, "type": "mc", "q": "Wie riechen die Bohnen typischerweise in der Trocknungsphase?", "options": ["Rauchig und stechend", "Grasig und pflanzlich", "Schokoladig und süß", "Karamellig und nussig"], "correct": 1, "explain": "In der Trocknungsphase verdampft vor allem Wasser, die Bohnen werden heller und riechen grasig. Röstaromen wie Karamell oder Schokolade entstehen erst später.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "bohne", "topic": "Phasen & Crack", "st": 1}, {"id": "r1-103", "mode": "roester", "level": 1, "type": "mc", "q": "Wonach riecht es typischerweise, wenn der First Crack einsetzt?", "options": ["Nach Rauch und kalter Asche", "Nach Getreide und frischem Brot", "Nach Essig und vergorener Frucht", "Nach dunkler Schokolade und Öl"], "correct": 1, "explain": "Sweet Maria's beschreibt den Geruch im First Crack als getreidig, wie backendes Brot. Der Second Crack riecht dagegen deutlich stechender.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Phasen & Crack", "st": 4}, {"id": "r1-104", "mode": "roester", "level": 1, "type": "mc", "q": "Wofür dient der Probenstecher (Trier) am Trommelröster?", "options": ["Um die Bohnentemperatur direkt zu messen", "Um während der Röstung Proben zu ziehen", "Um Rohkaffee in die Trommel zu füllen", "Um Chaff aus der Trommel zu entfernen"], "correct": 1, "explain": "Der Trier ist ein Stab mit Griff in der Frontplatte. Mit ihm zieht man während der Röstung Bohnen heraus, um Farbe und Geruch zu prüfen.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 2}, {"id": "r1-105", "mode": "roester", "level": 1, "type": "mc", "q": "Was ist der Trichter (Hopper) an einem Röster?", "options": ["Der Auffangbehälter für Chaff unter dem Zyklon", "Das gelochte Sieb zum Abkühlen der Bohnen", "Das Rohr, das die Abluft nach draußen führt", "Der Behälter für den Rohkaffee über der Trommel"], "correct": 3, "explain": "Im Trichter wartet der Rohkaffee direkt über der Trommel auf das Laden. Beim Charge wird er in die heiße Trommel entleert.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 2}, {"id": "r1-106", "mode": "roester", "level": 1, "type": "mc", "q": "Wie kühlt ein Kühlsieb die gerösteten Bohnen ab?", "options": ["Feiner Wassernebel wird über die Bohnen gesprüht", "Ein Ventilator zieht Luft durch den gelochten Boden", "Gekühlte Metallplatten nehmen die Wärme auf", "Die Bohnen ruhen ohne Luftstrom bei Raumtemperatur"], "correct": 1, "explain": "Das Kühlsieb ist ein offenes, gelochtes Blech. Ein Ventilator saugt Raumluft durch das Bohnenbett, Rührarme bewegen die Bohnen für gleichmäßiges Abkühlen.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 6}, {"id": "r1-107", "mode": "roester", "level": 1, "type": "mc", "q": "Was bedeutet „Quenching“ beim Rösten?", "options": ["Den Rohkaffee vor dem Laden leicht anfeuchten", "Die fertige Charge mit etwas Wasser schnell kühlen", "Die Gaszufuhr kurz vor dem Drop ganz abstellen", "Einen Chaff-Brand im Zyklon mit Sand ersticken"], "correct": 1, "explain": "Beim Quenching wird eine fertige Charge mit Wasser schnell abgekühlt. Das Wasser verdampft dabei von der heißen Bohnenoberfläche.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 8}, {"id": "r1-108", "mode": "roester", "level": 1, "type": "mc", "q": "Was bedeutet „endotherm“ bei einer Röstreaktion?", "options": ["Die Reaktion setzt Wärme frei", "Die Reaktion nimmt Wärme auf", "Die Reaktion braucht keinen Sauerstoff", "Die Reaktion erzeugt vor allem Wasser"], "correct": 1, "explain": "Endotherme Reaktionen nehmen Wärme auf, der Röster muss also weiter Energie liefern. Exotherme Reaktionen setzen dagegen Wärme frei.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "bohne", "topic": "Chemie", "st": 7}, {"id": "r1-109", "mode": "roester", "level": 1, "type": "mc", "q": "Welche Form hat die typische Kurve der Bohnentemperatur?", "options": ["Eine Gerade, die gleichmäßig ansteigt", "Eine Glocke mit Spitze in der Mitte", "Eine Treppe mit Stufen bei jedem Crack", "Eine S-Form: erst Abfall, dann Anstieg"], "correct": 3, "explain": "Royal Coffee spricht von der S-Kurve: Nach dem Laden fällt die Bohnentemperatur, dann steigt sie wieder und verändert sich um den First Crack.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "kurve", "topic": "Phasen & Crack", "st": 7}, {"id": "r1-110", "mode": "roester", "level": 1, "type": "mc", "q": "Die Bohnentemperatur steigt in 30 Sekunden um 5 °C. Wie hoch ist die RoR pro Minute?", "options": ["5 °C pro Minute", "2,5 °C pro Minute", "10 °C pro Minute", "15 °C pro Minute"], "correct": 2, "explain": "Die RoR wird meist pro Minute angegeben. 5 °C in 30 Sekunden entsprechen also 10 °C pro Minute.", "source": {"title": "Cropster – Using Rate of Rise to Your Advantage in a Production Setting", "url": "https://www.cropster.com/blog-post/using-rate-of-rise-to-your-advantage-in-a-production-setting/"}, "img": "kurve", "topic": "Wärme & Maschine", "st": 4}, {"id": "r1-111", "mode": "roester", "level": 1, "type": "mc", "q": "Aus 20 kg Rohkaffee werden 17 kg Röstkaffee. Wie hoch ist der Röstverlust?", "options": ["15 %", "17 %", "3 %", "85 %"], "correct": 0, "explain": "Der Verlust beträgt 3 kg von 20 kg, also 15 %. Die 17 kg sind der Ertrag (Roast Yield), das entspricht 85 %.", "source": {"title": "Royal Coffee – Understanding Roast Yield and Loss", "url": "https://royalcoffee.com/understanding-roast-yield-and-loss/"}, "img": "sack", "topic": "Röstgrad", "st": 3}, {"id": "r1-112", "mode": "roester", "level": 1, "type": "mc", "q": "Was beschreibt eine „Full City“-Röstung nach Sweet Maria's?", "options": ["Eine Röstung bis kurz vor den Second Crack", "Eine Röstung, die mitten im First Crack endet", "Eine Röstung weit in den Second Crack hinein", "Eine Röstung, die schon vor dem First Crack endet"], "correct": 0, "explain": "Full City ist laut Sweet Maria's eine Röstung bis an die Schwelle des Second Crack, eine Stufe dunkler als City.", "source": {"title": "Sweet Maria's – Glossar: Full City Roast", "url": "https://library.sweetmarias.com/glossary/full-city/"}, "img": "crack", "topic": "Röstgrad", "st": 8}, {"id": "r1-113", "mode": "roester", "level": 1, "type": "mc", "q": "Womit beginnt nach Sweet Maria's die Vienna-Röstung?", "options": ["Mit dem Ende des First Crack", "Mit dem Gelbwerden der Bohnen", "Mit dem Ende des Second Crack", "Mit dem Beginn des Second Crack"], "correct": 3, "explain": "Die Vienna-Röstung beginnt mit dem Second Crack. Hier überdeckt der Röstcharakter zunehmend die Herkunft, für Espresso ist sie ein gängiger Röstgrad.", "source": {"title": "Sweet Maria's – Glossar: Vienna Roast", "url": "https://library.sweetmarias.com/glossary/vienna-roast/"}, "img": "crack", "topic": "Röstgrad", "st": 7}, {"id": "r1-114", "mode": "roester", "level": 1, "type": "mc", "q": "Nach wie vielen Minuten setzt der First Crack in vielen 5–12-kg-Trommelröstern etwa ein?", "options": ["Nach etwa 2–4 Minuten", "Nach etwa 18–22 Minuten", "Nach etwa 9–12 Minuten", "Nach etwa 30–35 Minuten"], "correct": 2, "explain": "Sweet Maria's nennt für viele Shop-Röster mit 5–12 kg etwa 9–12 Minuten bis zum First Crack. Kleine Heißluftgeräte sind deutlich schneller.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "kurve", "topic": "Phasen & Crack", "st": 7}, {"id": "r1-115", "mode": "roester", "level": 1, "type": "mc", "q": "Was passiert optisch mit der Bohne im First Crack?", "options": ["Sie wird größer, die Kerbe öffnet sich leicht", "Sie schrumpft, die Kerbe schließt sich fest", "Sie wird wieder grünlich und glänzt ölig", "Sie bleibt gleich groß und wird matt schwarz"], "correct": 0, "explain": "Im First Crack dehnt sich die Bohne aus, die Mittelkerbe öffnet sich etwas und die Kanten wirken runder. Dabei kann sich restliches Silberhäutchen lösen.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "bohne", "topic": "Phasen & Crack", "st": 5}, {"id": "r1-116", "mode": "roester", "level": 1, "type": "mc", "q": "Woran erkennt man den echten Beginn des First Crack?", "options": ["Am allerersten einzelnen Knacken in der Trommel", "An einer regelmäßigen Folge von Knackgeräuschen", "Am ersten sichtbaren Rauch aus dem Abluftrohr", "Am ersten Öltropfen auf der Bohnenoberfläche"], "correct": 1, "explain": "Sweet Maria's zählt erst eine regelmäßige Folge von Knacken als First Crack. Einzelne frühe Knacker können Ausreißer sein.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Phasen & Crack", "st": 6}, {"id": "r1-117", "mode": "roester", "level": 1, "type": "mc", "q": "Woran lässt sich die Röstfarbe nach Sweet Maria's leichter beurteilen?", "options": ["Am gemahlenen Kaffee", "An der heißen ganzen Bohne", "Am Chaff aus dem Zyklon", "An der Farbe des Rauchs"], "correct": 0, "explain": "Die Röstfarbe ist am Mahlgut leichter zu beurteilen als an der ganzen Bohne. Die Oberfläche der ganzen Bohne kann täuschen.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "bohne", "topic": "Röstgrad", "st": 4}, {"id": "r1-118", "mode": "roester", "level": 1, "type": "mc", "q": "Bei welchem Licht beurteilt man die Röstfarbe am besten?", "options": ["Bei warmweißem Licht einer Glühlampe", "Bei rotem Licht für stärkere Kontraste", "Bei UV-Licht, damit Öl sichtbar wird", "Bei Vollspektrumlicht, ähnlich Tageslicht"], "correct": 3, "explain": "Royal Coffee empfiehlt Vollspektrumlicht, das Tageslicht nachahmt. So wird die Röstfarbe nicht durch die Lichtfarbe verfälscht.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "bohne", "topic": "Röstgrad", "st": 5}, {"id": "r1-119", "mode": "roester", "level": 1, "type": "mc", "q": "Wie viel Kaffee röstet ein Probenröster laut Royal Coffee pro Probe etwa?", "options": ["Etwa 1 kg", "Etwa 10 g", "Etwa 100 g", "Etwa 5 kg"], "correct": 2, "explain": "Royal Coffee nennt für Probenröster etwa 100 g pro Röstung. Das reicht, um eine Partie zu cuppen und einzukaufen.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Cupping & Qualität", "st": 6}, {"id": "r1-120", "mode": "roester", "level": 1, "type": "mc", "q": "Ab welcher Cupping-Punktzahl gilt Kaffee nach SCA als Specialty?", "options": ["Ab 70 Punkten", "Ab 90 Punkten", "Ab 80 Punkten", "Ab 60 Punkten"], "correct": 2, "explain": "Auf der 100-Punkte-Skala gelten 80 Punkte und mehr als Specialty. 70–79,9 Punkte sind Commercial, ab 90 spricht man von „Super-Specialty“.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "sack", "topic": "Cupping & Qualität", "st": 3}, {"id": "r1-121", "mode": "roester", "level": 1, "type": "mc", "q": "Welche zwei Aufgaben hat der Luftstrom im Trommelröster?", "options": ["Bohnen abkühlen und die Trommel antreiben", "Rauch und Chaff abführen, Wärme übertragen", "Feuchte zuführen und das Gas verdünnen", "Die Flamme zünden und den Fühler reinigen"], "correct": 1, "explain": "Barista Hustle nennt zwei Funktionen: Der Luftstrom trägt Rauch und Chaff ab und bringt per Konvektion Wärme an die Bohnen.", "source": {"title": "Barista Hustle – Tuning Airflow in a Drum Coffee Roaster", "url": "https://www.baristahustle.com/?p=450903"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 8}, {"id": "r1-123", "mode": "roester", "level": 1, "type": "mc", "q": "Wann sollte der Chaff-Behälter laut Royal New York geleert werden?", "options": ["Während der Röstungen und am Tagesende", "Einmal im Monat bei der großen Wartung", "Nur bei der jährlichen Inspektion", "Erst wenn Funken aus dem Kamin fliegen"], "correct": 0, "explain": "Royal New York zählt das Leeren des Chaff-Behälters zur täglichen Routine, während der Röstungen und am Ende des Tages. Chaff kann einen Brand auslösen.", "source": {"title": "Royal New York – Roaster Cleaning and Maintenance", "url": "https://www.royalny.com/?p=137392"}, "img": "trommel", "topic": "Sicherheit", "st": 8}, {"id": "r1-124", "mode": "roester", "level": 1, "type": "mc", "q": "Was ist ein Peaberry?", "options": ["Eine sehr große Bohne der Sorte Maragogype", "Eine Bohne, die ohne Pergament trocknete", "Eine Bohne mit zwei flachen Seiten", "Ein einzelner, runder Samen in der Kirsche"], "correct": 3, "explain": "Normalerweise liegen zwei Samen mit den flachen Seiten aneinander in der Kirsche. Beim Peaberry entwickelt sich nur ein einzelner, runder Samen.", "source": {"title": "Sweet Maria's – Glossar: Peaberry", "url": "https://library.sweetmarias.com/glossary/peaberry/"}, "img": "bohne", "topic": "Rohkaffee", "st": 4}, {"id": "r1-125", "mode": "roester", "level": 1, "type": "mc", "q": "Was gibt die Siebgröße (Screen Size) beim Rohkaffee an?", "options": ["Die Größe der Bohnen", "Die Dichte der Bohnen", "Den Feuchtegehalt der Bohnen", "Die Anzahl der Defekte"], "correct": 0, "explain": "Die Siebgröße beschreibt, durch welches Lochsieb die Bohnen fallen oder auf welchem sie liegen bleiben. Siebgröße 18 entspricht etwa 7 mm.", "source": {"title": "FAO – Coffee grading and defect classification", "url": "https://www.fao.org/4/X6939E/X6939e13.htm"}, "img": "sack", "topic": "Rohkaffee", "st": 4}, {"id": "r1-126", "mode": "roester", "level": 1, "type": "mc", "q": "Was gehört laut Royal Coffee zur Qualitätskontrolle einer Röstung?", "options": ["Röstzeit, Chargenzahl, Gaspreis und Stromtarif", "Tütendesign, Etikett, Ladenpreis und Versand", "Trommelfarbe, Lagerort, Lieferant und Erntejahr", "Profiltreue, Röstverlust, Röstfarbe und Cupping"], "correct": 3, "explain": "Royal Coffee nennt als QC-Bausteine: Einhaltung des Profils, Röstverlust, Röstfarbe und Cupping. Zusammen zeigen sie, ob eine Röstung reproduzierbar gelungen ist.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "sack", "topic": "Cupping & Qualität", "st": 9}, {"id": "r1-127", "mode": "roester", "level": 1, "type": "mc", "q": "Was ist eine „Omni-Röstung“?", "options": ["Eine Röstung aus Kaffees aller Kontinente", "Eine Röstung ganz ohne Entwicklungsphase", "Eine Röstung für Filter und Espresso zugleich", "Eine Röstung nur für Cold Brew und Eiskaffee"], "correct": 2, "explain": "Eine Omni-Röstung soll für Filter und Espresso gleichermaßen funktionieren. Laut Perfect Daily Grind ist sie besonders bei Heimbrühern beliebt.", "source": {"title": "Perfect Daily Grind – Roasting for Filter and Espresso at Home (Royal Coffee)", "url": "https://perfectdailygrind.com/2020/09/roasting-for-filter-and-espresso-at-home-royal-coffee/"}, "img": "bohne", "topic": "Röstgrad", "st": 5}, {"id": "r1-128", "mode": "roester", "level": 1, "type": "mc", "q": "Wie lange sollte frisch gerösteter Kaffee laut Sweet Maria's mindestens ruhen?", "options": ["Etwa 10–15 Minuten", "Etwa 12–24 Stunden", "Etwa 3–4 Wochen", "Gar nicht, sofort brühen"], "correct": 1, "explain": "Sweet Maria's empfiehlt 12–24 Stunden Ruhezeit, für manche Espressokaffees bis zu 3–5 Tage. Frischer Kaffee gibt viel CO₂ ab, das die Extraktion stört.", "source": {"title": "Sweet Maria's – Glossar: Rest", "url": "https://library.sweetmarias.com/glossary/rest/"}, "img": "sack", "topic": "Ruhezeit & Lagerung", "st": 7}, {"id": "r1-129", "mode": "roester", "level": 1, "type": "mc", "q": "Was nimmt gegen Ende sehr dunkler Röstungen deutlich zu?", "options": ["Die Rauchentwicklung", "Die Restfeuchte", "Der Säuregehalt", "Die Bohnendichte"], "correct": 0, "explain": "Sehr dunkle Röstungen erzeugen am Ende deutlich mehr Rauch. Feuchte, Säure und Dichte nehmen dagegen weiter ab.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Phasen & Crack", "st": 3}, {"id": "r1-130", "mode": "roester", "level": 1, "type": "mc", "q": "Was passiert mit dem Herkunftscharakter bei sehr dunklen Röstungen?", "options": ["Er tritt besonders deutlich hervor", "Er bleibt vom Röstgrad unberührt", "Er wird vom Röstcharakter überdeckt", "Er wird fruchtiger und säuerlicher"], "correct": 2, "explain": "Laut Coffee Review sind die Unterschiede des Rohkaffees bei hellen bis mittleren Röstungen klar erkennbar. Bei sehr dunklen Röstungen dominieren bittere Röstnoten.", "source": {"title": "Coffee Review – Roast Definitions (Agtron)", "url": "https://www.coffeereview.com/roast-definitions/"}, "img": "bohne", "topic": "Röstgrad", "st": 5}, {"id": "r1-131", "mode": "roester", "level": 1, "type": "mc", "q": "Wie werden Filterkaffees laut Coffee Review im Vergleich zu Espresso oft geröstet?", "options": ["Eher heller", "Eher dunkler", "Immer gleich", "Deutlich öliger"], "correct": 0, "explain": "Kaffee für Pour-over und Batch Brew wird laut Coffee Review oft heller geröstet als Kaffee für Espresso oder French Press.", "source": {"title": "Coffee Review – Roast Definitions (Agtron)", "url": "https://www.coffeereview.com/roast-definitions/"}, "img": "bohne", "topic": "Röstgrad", "st": 3}, {"id": "r1-132", "mode": "roester", "level": 1, "type": "mc", "q": "Wofür dient die Luftklappe (Damper) am Röster?", "options": ["Sie regelt die Gaszufuhr zum Brenner", "Sie regelt die Stärke des Luftstroms", "Sie öffnet die Tür zum Kühlsieb", "Sie misst die Temperatur der Abluft"], "correct": 1, "explain": "Mit der Luftklappe stellt man den Luftstrom durch den Röster ein. Gas und Luft sind damit zwei getrennte Stellgrößen.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 4}, {"id": "r1-133", "mode": "roester", "level": 1, "type": "mc", "q": "Wie viel Koffein enthält Robusta im Vergleich zu Arabica etwa?", "options": ["Etwa halb so viel", "Etwa gleich viel", "Etwa zehnmal so viel", "Etwa doppelt so viel"], "correct": 3, "explain": "Robusta enthält etwa doppelt so viel Koffein wie Arabica. Sweet Maria's nennt Robusta als Blend-Zutat für mehr Körper und Crema.", "source": {"title": "Sweet Maria's – Glossar: Robusta", "url": "https://library.sweetmarias.com/glossary/robusta/"}, "img": "bohne", "topic": "Rohkaffee", "st": 3}, {"id": "r1-134", "mode": "roester", "level": 1, "type": "mc", "q": "Was ist ein Thermoelement (Thermocouple)?", "options": ["Ein Temperaturfühler aus zwei Metallen", "Ein Drucksensor in der Gasleitung", "Ein Feuchtemesser für Rohkaffee", "Ein Farbmessgerät für Mahlgut"], "correct": 0, "explain": "Ein Thermoelement besteht aus einer Verbindung zweier Metalle und erzeugt eine temperaturabhängige Spannung. Typ J und K sind an Röstern verbreitet.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "kurve", "topic": "Wärme & Maschine", "st": 4}, {"id": "r1-135", "mode": "roester", "level": 1, "type": "mc", "q": "Was ist eine Blend?", "options": ["Ein Kaffee von einer einzigen Farm", "Eine Röstung mit zugesetztem Aroma", "Ein entkoffeinierter Rohkaffee", "Eine Mischung aus zwei oder mehr Kaffees"], "correct": 3, "explain": "Eine Blend mischt zwei oder mehr Kaffees in festen Anteilen, um ein Geschmacksziel zu erreichen. Gemischt wird vor oder nach dem Rösten.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "sack", "topic": "Rohkaffee", "st": 1}, {"id": "r1-136", "mode": "roester", "level": 1, "type": "mc", "q": "Welcher Faktor beeinflusst den Röstverlust laut Royal Coffee am stärksten?", "options": ["Die Sackgröße", "Die Trommelfarbe", "Das Lieferland", "Der Röstgrad"], "correct": 3, "explain": "Royal Coffee nennt den Röstgrad als wahrscheinlich wichtigsten Faktor. Sehr helle Röstungen verlieren etwa 10 %, Röstungen weit über den Second Crack bis zu 25 %.", "source": {"title": "Royal Coffee – Understanding Roast Yield and Loss", "url": "https://royalcoffee.com/understanding-roast-yield-and-loss/"}, "img": "sack", "topic": "Röstgrad", "st": 6}, {"id": "r1-137", "mode": "roester", "level": 1, "type": "mc", "q": "Welche Schutzausrüstung empfiehlt Royal New York für Wartungsarbeiten am Röster?", "options": ["Schutzbrille, Hitzehandschuhe, Atemschutz", "Gehörschutz, Sicherheitsschuhe, Warnweste", "Kochschürze, Haarnetz, Einweghandschuhe", "Sonnenbrille, Sonnenhut, Sonnencreme"], "correct": 0, "explain": "Royal New York nennt Schutzbrille, hitzefeste Handschuhe und Atemschutz. Dazu kommt ein Lockout-Verfahren, damit die Elektrik beim Arbeiten stromlos bleibt.", "source": {"title": "Royal New York – Roaster Cleaning and Maintenance", "url": "https://www.royalny.com/?p=137392"}, "img": "trommel", "topic": "Sicherheit", "st": 10}, {"id": "r1-138", "mode": "roester", "level": 1, "type": "mc", "q": "Was bezeichnet „Batch“ in der Röstersprache?", "options": ["Die Gesamtmenge eines Röstages", "Die Kaffeemenge einer einzelnen Röstung", "Den Sack, in dem Rohkaffee geliefert wird", "Die Mischung mehrerer Herkünfte"], "correct": 1, "explain": "Ein Batch (Charge) ist die Menge Roh- oder Röstkaffee einer einzelnen Röstung.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 1}, {"id": "r1-139", "mode": "roester", "level": 1, "type": "mc", "q": "Was ist ein Röstprofil?", "options": ["Das Rezept einer Röstung mit Hitze und Zeiten", "Die Bewertung einer Röstung beim Cupping", "Das Etikett mit Herkunft und Röstdatum", "Die Liste aller Röster einer Rösterei"], "correct": 0, "explain": "Royal Coffee beschreibt das Röstprofil als Rezept: Wärmezufuhr, Luftstrom, Temperaturen, Phasenzeiten und Zielwerte. Die Röstkurve ist ein Teil davon.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "kurve", "topic": "Wärme & Maschine", "st": 1}, {"id": "r1-140", "mode": "roester", "level": 1, "type": "mc", "q": "Was bedeutet „Past Crop“ beim Rohkaffee?", "options": ["Kaffee aus der gerade laufenden Ernte", "Kaffee von besonders alten Pflanzen", "Älterer Kaffee aus einer früheren Ernte", "Kaffee, der zweimal geröstet wurde"], "correct": 2, "explain": "Past Crop ist Kaffee, der weder New Crop noch Current Crop ist. Cupper nutzen den Begriff auch für strohige, heuartige, verblasste Aromen gealterter Partien.", "source": {"title": "Sweet Maria's – Glossar: Past Crop", "url": "https://library.sweetmarias.com/glossary/past-crop/"}, "img": "sack", "topic": "Rohkaffee", "st": 7}, {"id": "r1-141", "mode": "roester", "level": 1, "type": "mc", "q": "Bis wann verliert die Bohne beim Rösten Wasser?", "options": ["Nur in der Trocknungsphase", "Nur nach dem First Crack", "Während der gesamten Röstung", "Erst im Kühlsieb nach dem Drop"], "correct": 2, "explain": "Obwohl der Anfang Trocknungsphase heißt, verliert die Bohne während der ganzen Röstung Wasser. Selbst dunkle Röstungen enthalten noch etwas Wasser.", "source": {"title": "Barista Hustle – Roasting Science RS 3.01: Moisture Levels During Roasting", "url": "https://www.baristahustle.com/?p=407661"}, "img": "bohne", "topic": "Phasen & Crack", "st": 4}, {"id": "r1-142", "mode": "roester", "level": 1, "type": "mc", "q": "Wie verändert sich die Struktur der Bohne im Lauf der Röstung?", "options": ["Sie wird dichter und zäher", "Sie wird weicher und feuchter", "Sie bleibt unverändert fest", "Sie wird poröser und spröder"], "correct": 3, "explain": "Die Bohnen dehnen sich während der ganzen Röstung aus und werden dabei poröser, schwächer und spröder.", "source": {"title": "Barista Hustle – Roasting Science RS 3.12: Recap and Glossary", "url": "https://www.baristahustle.com/?p=416661"}, "img": "bohne", "topic": "Phasen & Crack", "st": 4}, {"id": "r1-143", "mode": "roester", "level": 1, "type": "mc", "q": "Wann stellt NIOSH Atemschutzmasken (N95) zur freiwilligen Nutzung bereit?", "options": ["Beim Verkosten am Cupping-Tisch", "Beim Etikettieren von Kaffeetüten", "Beim Entleeren von Rohkaffeesäcken", "Beim Kassieren an der Ladentheke"], "correct": 2, "explain": "NIOSH empfiehlt N95-Masken beim Leeren von Jutesäcken in Silos, beim Reinigen der Chaff-Anlage und des Rohkaffeelagers. Dabei wird viel Staub aufgewirbelt.", "source": {"title": "NIOSH HHE 2016-0144-3305 – Coffee roasting and packaging facility", "url": "https://www.cdc.gov/niosh/hhe/reports/pdfs/2016-0144-3305.pdf"}, "img": "sack", "topic": "Sicherheit", "st": 7}, {"id": "r1-144", "mode": "roester", "level": 1, "type": "mc", "q": "First Crack bei 8:00, Drop bei 10:00. Wie lang ist die Development Time?", "options": ["8:00 Minuten", "2:00 Minuten", "10:00 Minuten", "18:00 Minuten"], "correct": 1, "explain": "Die Entwicklungsphase läuft vom First Crack bis zum Drop. Von 8:00 bis 10:00 sind das 2 Minuten.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "kurve", "topic": "Phasen & Crack", "st": 3}, {"id": "r1-145", "mode": "roester", "level": 1, "type": "mc", "q": "Welche Röstungen erhalten fruchtige Säuren wie Apfel- und Zitronensäure eher?", "options": ["Dunklere Röstungen", "Ölige Röstungen", "Hellere Röstungen", "Langsame Röstungen"], "correct": 2, "explain": "Royal Coffee schreibt, dass hellere Röstungen fruchtige Apfel- und Zitronensäure eher behalten. Dunkleres Rösten baut einen Teil der Säuren ab.", "source": {"title": "Royal Coffee – Understanding Coffee Acidity", "url": "https://royalcoffee.com/understanding-coffee-acidity-what-it-is-why-it-matters/"}, "img": "bohne", "topic": "Chemie", "st": 3}, {"id": "r1-146", "mode": "roester", "level": 1, "type": "mc", "q": "Was beurteilt man beim Cupping als Erstes?", "options": ["Die Säure der abgekühlten Tasse", "Den Duft des trockenen Mahlguts", "Den Körper bei warmer Tasse", "Die Süße bei kalter Tasse"], "correct": 1, "explain": "Zuerst riecht man am trockenen Mahlgut (Fragrance). Danach folgen Aroma beim Aufgießen, Kruste und Break, anschließend die Verkostung bei sinkender Temperatur.", "source": {"title": "Coffee Hunter / Mercanta – The Journey of a Green Coffee Sample", "url": "https://coffeehunter.com/knowledge-centre/from-the-lab-the-journey-of-a-green-coffee-sample/"}, "img": "sack", "topic": "Cupping & Qualität", "st": 4}, {"id": "r1-147", "mode": "roester", "level": 1, "type": "mc", "q": "Wie arbeitet ein Durchlaufröster (Continuous Roaster)?", "options": ["Kaffee wird in kleinen Chargen von Hand geröstet", "Kaffee schwebt im Luftstrom über einem Sieb", "Kaffee wandert per Schnecke durch die Trommel", "Kaffee liegt still auf einem beheizten Blech"], "correct": 2, "explain": "Beim Durchlaufröster läuft Rohkaffee an einem Ende hinein, wird von einer Schnecke durch die Trommel bewegt und kommt geröstet am anderen Ende heraus. Er ist für große Industriemengen gedacht.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 8}, {"id": "r1-148", "mode": "roester", "level": 1, "type": "mc", "q": "Wo entstehen laut Scott Rao die meisten Röster-Brände?", "options": ["Im Rohkaffeetrichter oben", "Im Kühlsieb nach dem Drop", "Im Zyklon bzw. Chaff-Sammler", "Im Gasanschluss des Brenners"], "correct": 2, "explain": "Rao schreibt, dass die meisten Röster-Brände im Zyklon entstehen. Dort sammelt sich brennbares Chaff in heißer Abluft.", "source": {"title": "Scott Rao – The Most Important Thing Few Roasters Bother to Do (Brandschutz)", "url": "https://scottrao.com/blog/fire"}, "img": "trommel", "topic": "Sicherheit", "st": 10}, {"id": "r1-149", "mode": "roester", "level": 1, "type": "mc", "q": "Was ist ein „Floater“ beim Rohkaffee?", "options": ["Eine besonders dichte Bohne aus großer Höhe", "Eine Bohne, die im Röster nach oben wandert", "Eine Bohne, die mit Pergament exportiert wird", "Eine hohle, leichte Bohne, die im Wasser schwimmt"], "correct": 3, "explain": "Beim Sortieren im Wasser schwimmen leichte, oft hohle Samen oben. Die dichten Sinker schmecken laut Royal Coffee meist besser und erzielen höhere Preise.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part IV: Density", "url": "https://royalcoffee.com/green-coffee-analytics-part-iv-density/"}, "img": "sack", "topic": "Rohkaffee", "st": 5}, {"id": "r1-150", "mode": "roester", "level": 1, "type": "mc", "q": "Wie wirkt sich Einfrieren laut einer Penn-State-Studie auf ganze Röstbohnen aus?", "options": ["Es erhält das Aroma, vor allem bei dunklen Röstungen", "Es zerstört das Aroma, vor allem bei hellen Röstungen", "Es hat auf das Aroma keinerlei messbaren Einfluss", "Es macht die Bohnen sauer und schnell ranzig"], "correct": 0, "explain": "In der Studie wurden Bohnen neun Wochen gefroren oder bei Raumtemperatur gelagert. Einfrieren erhielt Intensität und Angenehmheit des Aromas, besonders bei dunklen Röstungen.", "source": {"title": "Penn State – Research shows freezing beans can preserve aroma", "url": "https://www.psu.edu/news/research/story/wake-and-smell-coffee-research-shows-freezing-beans-can-preserve-aroma"}, "img": "sack", "topic": "Ruhezeit & Lagerung", "st": 9}, {"id": "r1-151", "mode": "roester", "level": 1, "type": "mc", "q": "Kann eine Blend gealterte, schwache Komponenten ausgleichen?", "options": ["Ja, wenn der Anteil unter der Hälfte liegt", "Ja, wenn die Blend dunkler geröstet wird", "Nein, schwache Zutaten bleiben schwach", "Ja, wenn man sie vor dem Rösten mischt"], "correct": 2, "explain": "Sweet Maria's schreibt: Blending rettet keinen alternden Kaffee („garbage in = garbage out“). Frische Komponenten halten die Blend auch länger auf der Karte.", "source": {"title": "Sweet Maria's – Blending Resources and Resourceful Blending", "url": "https://library.sweetmarias.com/blending-resources-and-resourceful-blending/"}, "img": "sack", "topic": "Rohkaffee", "st": 8}, {"id": "r1-152", "mode": "roester", "level": 1, "type": "mc", "q": "Was ist laut Sweet Maria's eine Melange?", "options": ["Eine Mischung aus Arabica und Robusta", "Ein Kaffee, in mehreren Röstgraden gemischt", "Ein Kaffee aus mehreren Farmen einer Region", "Eine Röstung mit Zusatz von Milchpulver"], "correct": 1, "explain": "Eine Melange ist laut Sweet Maria's eine Blend aus einem Kaffee, der in verschiedenen Stufen von hell bis dunkel geröstet wurde.", "source": {"title": "Sweet Maria's – Glossar: Melange", "url": "https://library.sweetmarias.com/glossary/melange/"}, "img": "bohne", "topic": "Röstgrad", "st": 7}, {"id": "r1-153", "mode": "roester", "level": 1, "type": "mc", "q": "Wie lange liegt der Second Crack in den meisten Röstern nach dem Ende des First Crack?", "options": ["Etwa 8 bis 12 Minuten", "Etwa 30 Sekunden bis 4 Minuten", "Er folgt ohne jede Pause sofort", "Etwa 20 bis 30 Minuten"], "correct": 1, "explain": "Sweet Maria's nennt für die meisten Röster etwa 30 Sekunden bis 4 Minuten zwischen dem Ende des First Crack und dem Second Crack. Sehr schnelle Röster lassen beide verschmelzen.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Phasen & Crack", "st": 7}, {"id": "r1-154", "mode": "roester", "level": 1, "type": "mc", "q": "Wofür dient das Schauglas (Sightglass) am Röster?", "options": ["Zum Ablesen des Gasdrucks", "Zum Befüllen mit Rohkaffee", "Zum Ablassen von Wasserdampf", "Für den Blick in die Röstkammer"], "correct": 3, "explain": "Durch das Schauglas sieht man in die Röstkammer, etwa um die Röstfarbe oder die Drehung der Trommel zu prüfen.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 1}, {"id": "r1-155", "mode": "roester", "level": 1, "type": "mc", "q": "Was beschreibt Coffee Review typischerweise für helle Röstungen?", "options": ["Leichteren Körper, mal gedämpft, mal zart-frisch", "Schweren Körper und bittersüße Röstnoten", "Öligen Glanz und Noten von verbranntem Holz", "Schwarze Oberfläche und dünnen Körper"], "correct": 0, "explain": "Helle Röstungen haben laut Coffee Review keinen Ölfilm und einen leichteren Körper, mal gedämpft, mal zart und frisch. Bittersüße Röstnoten und Öl kommen erst bei dunkleren Röstungen.", "source": {"title": "Coffee Review – Roast Definitions (Agtron)", "url": "https://www.coffeereview.com/roast-definitions/"}, "img": "bohne", "topic": "Röstgrad", "st": 8}, {"id": "r1-156", "mode": "roester", "level": 1, "type": "case", "q": "Was prüfst du zuerst?", "case": {"title": "Fall · Röstverlust plötzlich niedrig", "facts": ["Gleicher Kaffee, gleiches Profil", "Röstverlust 9 % statt sonst 14 %", "Röstfarbe wie immer"]}, "options": ["Ob die Tüten richtig etikettiert wurden", "Ob der Kunde richtig gemahlen hat", "Ob die Rohkaffee-Einwaage gestimmt hat", "Ob das Cupping-Wasser zu weich war"], "correct": 2, "explain": "Royal Coffee empfiehlt, Roh- und Röstgewicht jeder Charge zu wiegen. So fallen Fehler bei der Chargengröße auf. Bei gleicher Farbe ist eine falsche Einwaage die naheliegende Ursache.", "source": {"title": "Royal Coffee – Understanding Roast Yield and Loss", "url": "https://royalcoffee.com/understanding-roast-yield-and-loss/"}, "img": "sack", "topic": "Fallstudie", "st": 8}, {"id": "r1-157", "mode": "roester", "level": 1, "type": "case", "q": "Wie startest du künftig in den Röstag?", "case": {"title": "Fall · Erste Charge am Morgen", "facts": ["Röster nur 15 Minuten vorgeheizt", "Erste Charge läuft deutlich langsamer", "Folgechargen laufen normal"]}, "options": ["Erste Charge mit doppelter Menge starten", "Erste Charge ohne Luftstrom rösten", "Erste Charge einfach länger entwickeln", "Länger vorheizen, mindestens 30–60 Minuten"], "correct": 3, "explain": "Die erste Röstung des Tages weicht oft ab, weil die Maschine noch nicht durchgewärmt ist. Die Experten bei Cropster nennen mindestens 30 bzw. 45–60 Minuten Aufwärmzeit.", "source": {"title": "Cropster – Between Batch Protocol for Coffee Roasters", "url": "https://www.cropster.com/blog-post/between-batch-protocol-for-coffee-roasters-the-whats-whys-and-hows-from-experts/"}, "img": "trommel", "topic": "Fallstudie", "st": 9}, {"id": "r1-158", "mode": "roester", "level": 1, "type": "case", "q": "Wie stellst du den Luftstrom ein?", "case": {"title": "Fall · Neue Rösterei, Abluft gedrosselt", "facts": ["Luftklappe fast geschlossen", "Viel Rauch in der Trommel sichtbar", "Chaff bleibt teils bei den Bohnen"], "cup": "Rauchig, etwas schmutzig"}, "options": ["Gas erhöhen, damit der Rauch schneller verbrennt", "Trommeldrehzahl senken, damit weniger Chaff entsteht", "Luftstrom erhöhen, damit Rauch und Chaff abziehen", "Später droppen, damit sich der Rauch verflüchtigt"], "correct": 2, "explain": "Zu wenig Luftstrom lässt Rauch und Chaff in der Trommel. Laut Barista Hustle entstehen dadurch rauchige Aromen im Kaffee.", "source": {"title": "Barista Hustle – Tuning Airflow in a Drum Coffee Roaster", "url": "https://www.baristahustle.com/?p=450903"}, "img": "trommel", "topic": "Fallstudie", "st": 10}, {"id": "r1-159", "mode": "roester", "level": 1, "type": "case", "q": "Wann setzt du die First-Crack-Markierung?", "case": {"title": "Fall · Einzelnes Knacken bei 7:30", "facts": ["Ein einzelnes Knacken bei 7:30", "Röster markiert sofort den First Crack", "Regelmäßiges Knacken erst ab 8:40"]}, "options": ["First Crack beim ersten Rauch aus der Abluft setzen", "First Crack immer pauschal bei 8:00 setzen", "First Crack gar nicht mehr in der Kurve markieren", "First Crack erst beim regelmäßigen Knacken setzen"], "correct": 3, "explain": "Ein einzelner früher Knacker kann ein Ausreißer sein. Sweet Maria's zählt erst die regelmäßige Folge als First Crack. Eine zu frühe Markierung verfälscht zudem die Development Time.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Fallstudie", "st": 10}, {"id": "r1-160", "mode": "roester", "level": 1, "type": "case", "q": "Wie änderst du den Drop-Zeitpunkt?", "case": {"title": "Fall · Sehr helle Röstung", "facts": ["Drop vor dem ersten Knacken", "Bohnen hellbraun, Kerbe noch geschlossen"], "cup": "Getreidig, adstringierend, kaum süß"}, "options": ["Bis in den First Crack hinein rösten", "Noch früher droppen, um Säure zu halten", "Mit weniger Gas genauso früh droppen", "Nur die Ruhezeit auf zwei Wochen verlängern"], "correct": 0, "explain": "Wer vor dem First Crack stoppt, bekommt laut Sweet Maria's getreidige, teils adstringierende Tassen. Für Süße muss der Kaffee in den First Crack kommen.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Fallstudie", "st": 6}, {"id": "r1-161", "mode": "roester", "level": 1, "type": "case", "q": "Was bietest du dem Café an?", "case": {"title": "Fall · Café bestellt Filterkaffee", "facts": ["Café brüht Batch Brew", "Geliefert wurde die Espresso-Röstung des Hauses"], "cup": "Bitter, röstig, dunkel"}, "options": ["Die Espresso-Röstung noch dunkler", "Die gleiche Röstung, nur gröber gemahlen", "Eine eigene, hellere Filterröstung", "Die gleiche Röstung mit mehr Ruhezeit"], "correct": 2, "explain": "Eine Espresso-Röstung als Filter ergibt laut Sucafina meist bittere, röstige, dunkle Aromen. Für Filter wird meist heller geröstet.", "source": {"title": "Sucafina – Roasting (and Blending) for Espresso", "url": "https://sucafina.com/na/news/roasting-and-blending-for-espresso"}, "img": "bohne", "topic": "Fallstudie", "st": 6}, {"id": "r1-162", "mode": "roester", "level": 1, "type": "case", "q": "Woher kommen die Sack- und Strohnoten?", "case": {"title": "Fall · Alter Rohkaffee im Jutesack", "facts": ["Über ein Jahr im Jutesack ohne Liner", "Lager mit stark schwankender Temperatur"], "cup": "Nach Sack und Stroh, kaum Frucht"}, "options": ["Der Rohkaffee ist gealtert und „baggy“", "Die Röstung war zu kurz und zu hell", "Das Brühwasser war zu hart", "Die Bohnen wurden zu fein gemahlen"], "correct": 0, "explain": "„Baggy“ ist ein Lagerfehler: Zu lange gelagerter Kaffee nimmt den Geschmack seines Sacks auf. Schwankende Temperatur und Feuchte beschleunigen das.", "source": {"title": "Sweet Maria's – Glossar: Baggy", "url": "https://library.sweetmarias.com/glossary/baggy/"}, "img": "sack", "topic": "Fallstudie", "st": 8}, {"id": "r1-163", "mode": "roester", "level": 1, "type": "case", "q": "Wie röstest du die Proben künftig?", "case": {"title": "Fall · Einkauf vergleicht Rohkaffeeproben", "facts": ["Jede Probe einzeln mit vielen Gas- und Luftänderungen geröstet", "Proben am Tisch kaum vergleichbar"]}, "options": ["Jede Probe noch individueller nachregeln", "Alle Proben sehr dunkel rösten", "Nur die teuerste Probe ausführlich rösten", "Alle Proben gleich und mit wenig Eingriffen rösten"], "correct": 3, "explain": "Eine Probenröstung soll mit möglichst wenigen Eingriffen laufen, um die Qualität des Rohkaffees zu beurteilen. Gleiche Bedingungen machen Proben vergleichbar.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Fallstudie", "st": 9}, {"id": "r1-164", "mode": "roester", "level": 1, "type": "case", "q": "Wie erklärst du den höheren Röstverlust?", "case": {"title": "Fall · Feuchtere Partie", "facts": ["Neue Partie mit höherer Feuchte", "Gleicher Röstgrad wie bisher", "Röstverlust 1,5 Prozentpunkte höher"]}, "options": ["Die Waage ist sicher falsch kalibriert", "Die Röstung muss verbrannt sein", "Der Kaffee hat Öl verloren", "Mehr Wasser verdampft, das ist zu erwarten"], "correct": 3, "explain": "Royal Coffee fasst zusammen: Feuchte plus Röstgrad ergibt den Röstverlust. Mehr Wasser im Rohkaffee bedeutet mehr Verlust, obwohl die Röstung gleich ist.", "source": {"title": "Royal Coffee – Understanding Roast Yield and Loss", "url": "https://royalcoffee.com/understanding-roast-yield-and-loss/"}, "img": "sack", "topic": "Fallstudie", "st": 8}, {"id": "r1-165", "mode": "roester", "level": 1, "type": "case", "q": "Was ist nach Scott Rao das Problem beim sofortigen Drop?", "case": {"title": "Fall · Flammen in der Trommel", "facts": ["Flammen im Schauglas sichtbar", "Kollege will die Bohnen sofort ins Kühlsieb entleeren"]}, "options": ["Brennende Bohnen tragen den Brand ins Kühlsieb", "Die Bohnen verlieren dabei zu viel Gewicht", "Die Trommel kühlt dadurch zu langsam ab", "Das Kühlsieb ist danach zu kalt für die Bohnen"], "correct": 0, "explain": "Rao berichtet von einem Trommelbrand, bei dem die Tür geöffnet wurde: Brennende Bohnen fielen ins Kühlsieb, die Reinigung dauerte rund 12 Stunden. Er rät zu einer fest installierten Wasserleitung.", "source": {"title": "Scott Rao – The Most Important Thing Few Roasters Bother to Do (Brandschutz)", "url": "https://scottrao.com/blog/fire"}, "img": "trommel", "topic": "Fallstudie", "st": 10}, {"id": "r1-166", "mode": "roester", "level": 1, "type": "case", "q": "Was rätst du dem Kunden?", "case": {"title": "Fall · Kunde wünscht mehr Säure und Komplexität", "facts": ["Bisher mitteldunkle Röstung", "Langsames Profil mit langer Röstzeit"]}, "options": ["Dunkler und/oder langsamer rösten", "Heller und/oder schneller rösten", "Gleich rösten, nur länger lagern", "Gleich rösten, nur heißer brühen"], "correct": 1, "explain": "Royal Coffee empfiehlt für mehr Säure und Komplexität eine hellere und/oder schnellere Röstung. Für mehr Körper röstet man dunkler und/oder langsamer.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "kurve", "topic": "Fallstudie", "st": 10}, {"id": "r1-167", "mode": "roester", "level": 1, "type": "case", "q": "Welchen Einfluss übersiehst du bisher?", "case": {"title": "Fall · Winter und Sommer", "facts": ["Rösterei im Winter kühl, im Sommer warm", "Gleiches Profil, im Winter langsamere Röstungen"]}, "options": ["Raumbedingungen beeinflussen das Profil", "Der Rohkaffee ist im Winter schlechter", "Die Waage misst im Winter falsch", "Die Bohnen sind im Winter trockener"], "correct": 0, "explain": "Royal Coffee nennt Raumtemperatur und Luftfeuchte als unkontrollierte Einflussgrößen. In Daten von Sweet Maria's verschob die Lufttemperatur die Bohnenkurve deutlich.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "kurve", "topic": "Fallstudie", "st": 9}, {"id": "r1-168", "mode": "roester", "level": 1, "type": "case", "q": "Was ist der typische Zielkonflikt?", "case": {"title": "Fall · Robusta für die Espresso-Blend", "facts": ["Kunde wünscht mehr Crema und Körper", "Blend bisher 100 % Arabica"]}, "options": ["Mehr Säure und Frucht, aber weniger Crema", "Weniger Koffein, aber deutlich mehr Süße", "Hellere Farbe, aber kürzere Haltbarkeit", "Mehr Crema und Körper, aber holzig-bittere Noten"], "correct": 3, "explain": "Robusta bringt laut Sweet Maria's Körper und Crema, aber auch holzige, papierartige, bittere Noten. Der Anteil muss deshalb wohlüberlegt sein.", "source": {"title": "Sweet Maria's – Blending Resources and Resourceful Blending", "url": "https://library.sweetmarias.com/blending-resources-and-resourceful-blending/"}, "img": "bohne", "topic": "Fallstudie", "st": 9}, {"id": "r1-169", "mode": "roester", "level": 1, "type": "case", "q": "Welche Röstung lieferst du für den Espresso?", "case": {"title": "Fall · Helle Filterröstung als Espresso", "facts": ["Single Origin, sehr hell für Filter geröstet", "Als Espresso im Café eingesetzt"], "cup": "Sauer, adstringierend, dünn"}, "options": ["Für Espresso noch heller und kürzer rösten", "Für Espresso eine Röstung mit mehr Entwicklung", "Gleiche Röstung, nur mit mehr Ruhezeit", "Gleiche Röstung, nur mit kälterem Wasser"], "correct": 1, "explain": "Espresso braucht laut Sucafina einen größeren Anteil Entwicklung als Filter. Helle Filterröstungen können als Espresso sauer, adstringierend und unterentwickelt schmecken.", "source": {"title": "Sucafina – Roasting (and Blending) for Espresso", "url": "https://sucafina.com/na/news/roasting-and-blending-for-espresso"}, "img": "kurve", "topic": "Fallstudie", "st": 9}, {"id": "r2-101", "mode": "roester", "level": 2, "type": "mc", "q": "Welchen Bereich der Development Time Ratio empfiehlt Scott Rao für die meisten hellen bis mittleren Röstungen?", "options": ["Etwa 5–10 %", "Etwa 35–40 %", "Etwa 50–55 %", "Etwa 20–25 %"], "correct": 3, "explain": "Rao nennt 20–25 % für die meisten Röstgrade zwischen Ende First Crack und Beginn Second Crack. 18 seiner 20 besten Röstungen lagen in diesem Bereich – eine Faustregel, keine Garantie.", "source": {"title": "Scott Rao – Development Time Ratio", "url": "https://www.scottrao.com/blog/2016/8/25/development-time-ratio"}, "img": "kurve", "topic": "Phasen & Crack", "st": 5}, {"id": "r2-102", "mode": "roester", "level": 2, "type": "mc", "q": "First Crack bei 9:00, Drop bei 11:15. Wie hoch ist die Development Time Ratio?", "options": ["Etwa 20 %", "Etwa 12 %", "Etwa 25 %", "Etwa 33 %"], "correct": 0, "explain": "Die Entwicklung dauert 2:15 = 135 s, die Gesamtröstzeit 11:15 = 675 s. 135 / 675 ergibt 20 %.", "source": {"title": "Scott Rao – Development Time Ratio", "url": "https://www.scottrao.com/blog/2016/8/25/development-time-ratio"}, "img": "kurve", "topic": "Phasen & Crack", "st": 2}, {"id": "r2-103", "mode": "roester", "level": 2, "type": "mc", "q": "Welcher Anteil der Wärme erreicht die Bohnen im direkt beheizten Trommelröster etwa über Konduktion?", "options": ["Etwa drei Viertel", "Etwa ein Viertel", "Fast die gesamte Wärme", "Praktisch keine Wärme"], "correct": 1, "explain": "Barista Hustle nennt nach Clarke (1987) etwa 25 % Konduktion und 75 % Konvektion für eine typische direkt beheizte Trommel. Der Konduktionsanteil unterscheidet sie am stärksten von anderen Bauarten.", "source": {"title": "Barista Hustle – Roasting Science: Der direkt beheizte Trommelröster", "url": "https://www.baristahustle.com/?p=386252"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 10}, {"id": "r2-104", "mode": "roester", "level": 2, "type": "mc", "q": "Welche Rolle spielt Wärmestrahlung laut Barista Hustle in den meisten Röstern?", "options": ["Sie liefert den Großteil der Wärme", "Sie wirkt nur im Second Crack", "Sie ist meist vernachlässigbar", "Sie ersetzt die Konvektion ganz"], "correct": 2, "explain": "Strahlung ist in den meisten Röstern vernachlässigbar. Auch Infrarotbrenner heizen meist Luft und Trommel, die Wärme erreicht die Bohnen dann per Konduktion und Konvektion.", "source": {"title": "Barista Hustle – Roasting Science RS 4.03: Radiation in Roasting", "url": "https://www.baristahustle.com/?p=418151"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 6}, {"id": "r2-105", "mode": "roester", "level": 2, "type": "mc", "q": "Was bewirkt eine dickere oder doppelwandige Trommel?", "options": ["Mehr Konduktion, weniger Konvektion", "Mehr Strahlung, weniger Luftstrom", "Weniger Konduktion, mehr Konvektion", "Schnelleres Abkühlen nach dem Drop"], "correct": 2, "explain": "Dickere oder doppelwandige Trommeln senken laut Barista Hustle die Konduktion und erhöhen den Konvektionsanteil. Das verringert das Risiko, die Bohnenoberfläche zu verbrennen.", "source": {"title": "Barista Hustle – Roasting Science: Roaster Designs Recap", "url": "https://www.baristahustle.com/?p=396160"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 5}, {"id": "r2-106", "mode": "roester", "level": 2, "type": "mc", "q": "Welche Trommeldrehzahl braucht ein 1-kg-Röster im Vergleich zu einem 60-kg-Röster?", "options": ["Eine höhere, etwa 70–75 statt 40–44 U/min", "Eine niedrigere, etwa 40–44 statt 70–75 U/min", "Die gleiche, etwa 55 U/min bei beiden", "Eine höhere, etwa 120 statt 20 U/min"], "correct": 0, "explain": "Kleine Röster brauchen höhere Drehzahlen, große niedrigere. Barista Hustle nennt etwa 70–75 U/min für 1 kg und 40–44 U/min für 60 kg Trommelgröße.", "source": {"title": "Barista Hustle – Drum Speed (Trommeldrehzahl)", "url": "https://www.baristahustle.com/?p=442005"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 7}, {"id": "r2-107", "mode": "roester", "level": 2, "type": "mc", "q": "Was erschwert laut Barista Hustle die Röstkontrolle in vielen Fluid-Bed-Röstern?", "options": ["Die Bohnen berühren ständig die heiße Wand", "Die geschlossene Kammer erlaubt oft keinen Trier", "Der Luftstrom ist für Konvektion zu schwach", "Die Trommel dreht sich für Proben zu schnell"], "correct": 1, "explain": "Fluid-Bed-Röster brauchen eine abgedichtete Röstkammer. Das kann Probenstecher und das Hören des First Crack ausschließen, mit denen Trommelröster den Verlauf verfolgen.", "source": {"title": "Barista Hustle – Roasting Science: Der direkt beheizte Trommelröster", "url": "https://www.baristahustle.com/?p=386252"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 8}, {"id": "r2-108", "mode": "roester", "level": 2, "type": "mc", "q": "Was gilt für eine indirekt beheizte Trommel im Vergleich zur klassischen, schweren Trommel?", "options": ["Sie speichert mehr Wärme und reagiert träger", "Sie braucht für Konvektion keinen Luftstrom", "Sie speichert weniger Wärme und reagiert schneller", "Sie röstet nur über Kontakt zur heißen Wand"], "correct": 2, "explain": "Eine indirekt beheizte Trommel hat weniger Wärmespeicher und damit weniger Trägheit. Das macht sie reaktionsschnell, kann aber bei vielen Chargen hintereinander die Konstanz erschweren.", "source": {"title": "Barista Hustle – Roasting Science: Three Perspectives on Air Roasting", "url": "https://www.baristahustle.com/?p=394746"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 9}, {"id": "r2-109", "mode": "roester", "level": 2, "type": "mc", "q": "Warum lassen sich Heißluftröster laut Barista Hustle leichter automatisieren?", "options": ["Sie haben keinen Luftstrom, der stören könnte", "Sie rösten nur sehr kleine, einheitliche Chargen", "Sie hängen kaum von Restwärme in der Trommel ab", "Sie brauchen keinerlei Temperaturfühler"], "correct": 2, "explain": "Automatisierung ist bei Heißluftröstern einfacher, weil sie nicht auf gespeicherte Wärme der Trommel angewiesen sind. Bei Talormade rösten so zwei Personen rund 45 Tonnen im Jahr.", "source": {"title": "Barista Hustle – Roasting Science: Three Perspectives on Air Roasting II", "url": "https://www.baristahustle.com/?p=394750"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 8}, {"id": "r2-110", "mode": "roester", "level": 2, "type": "mc", "q": "Welchen Umgang mit dem Luftstrom empfiehlt Scott Rao für Trommelröster?", "options": ["Den Luftstrom jede Minute nachregeln", "Den Luftstrom nur im First Crack öffnen", "Eine Einstellung wählen und dabei bleiben", "Den Luftstrom mit dem Gas gegenläufig führen"], "correct": 2, "explain": "Rao rät: eine Luftstellung wählen und beibehalten. Luftänderungen wirken je nach Gasstellung unterschiedlich und machen ein Profil schwerer zu deuten.", "source": {"title": "Barista Hustle – Managing Airflow (Scott Rao)", "url": "https://www.baristahustle.com/?p=468661"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 3}, {"id": "r2-111", "mode": "roester", "level": 2, "type": "mc", "q": "Was ist der Vorteil eines katalytischen Nachverbrenners gegenüber einem thermischen?", "options": ["Er verbraucht weniger Brennstoff", "Er braucht keinerlei Wartung", "Er ersetzt den Zyklon komplett", "Er beschleunigt die Röstung"], "correct": 0, "explain": "Ein katalytischer Nachverbrenner oxidiert die Abluft mithilfe eines Katalysators und braucht dafür weniger Brennstoff als ein rein thermischer, der sehr heiß laufen muss.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Sicherheit", "st": 6}, {"id": "r2-112", "mode": "roester", "level": 2, "type": "mc", "q": "Wie ist ein Tangentialröster aufgebaut?", "options": ["Drehende Trommel ohne jede Paddel", "Offenes Sieb mit Luft von unten", "Zentrifuge mit seitlichem Brenner", "Feste Trommel, innen drehende Paddel"], "correct": 3, "explain": "Ein Tangentialröster ist eine Mischform: Die Trommel steht still, im Inneren drehen sich Flügel oder Paddel um eine waagerechte Achse und wälzen die Bohnen um.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 3}, {"id": "r2-113", "mode": "roester", "level": 2, "type": "mc", "q": "Was zeichnet einen Gebläsebrenner (Forced-Air Burner) aus?", "options": ["Er mischt Gas und Luft rein von selbst", "Er arbeitet ganz ohne Verbrennungsluft", "Er heizt nur mit elektrischem Strom", "Er regelt das Gas-Luft-Verhältnis aktiv"], "correct": 3, "explain": "Beim Gebläsebrenner drückt ein Gebläse Gas und Luft in einem kontrollierten Verhältnis zusammen, so verbrennt er bei allen Leistungen effizient. Atmosphärische Brenner mischen dagegen von selbst.", "source": {"title": "Barista Hustle – Roasting Science: Roaster Designs Recap", "url": "https://www.baristahustle.com/?p=396160"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 6}, {"id": "r2-114", "mode": "roester", "level": 2, "type": "mc", "q": "Welchen Feuchtebereich verlangt die ICO für Exportkaffee?", "options": ["8,0–12,5 %", "5,0–7,5 %", "13,0–16,5 %", "2,0–4,5 %"], "correct": 0, "explain": "Barista Hustle nennt die ICO-Vorgabe von 8,0–12,5 % Feuchte für Exportkaffee. Darüber verliert gelagerter Kaffee deutlich schneller an Qualität.", "source": {"title": "Barista Hustle – Roasting Science RS 2.02: Moisture Content", "url": "https://www.baristahustle.com/?p=399889"}, "img": "sack", "topic": "Rohkaffee", "st": 10}, {"id": "r2-115", "mode": "roester", "level": 2, "type": "mc", "q": "Welche Methode gilt als Referenz für die Feuchtemessung von Rohkaffee?", "options": ["Die Messung per Röstfarbmesser", "Das Wiegen vor und nach Lagerung", "Die Bestimmung über die Bohnendichte", "Die Trocknung im Ofen nach ISO"], "correct": 3, "explain": "Die internationale Standardmethode ist die Ofentrocknung nach ISO. Sie ist zeitaufwendig, dient aber zur Kalibrierung schneller Feuchtemessgeräte.", "source": {"title": "Barista Hustle – Roasting Science RS 2.02: Moisture Content", "url": "https://www.baristahustle.com/?p=399889"}, "img": "sack", "topic": "Rohkaffee", "st": 6}, {"id": "r2-116", "mode": "roester", "level": 2, "type": "mc", "q": "Was beschreibt die Wasseraktivität (aw) von Rohkaffee?", "options": ["Gesamtmenge Wasser in Prozent vom Bohnengewicht", "Wassermenge, die der Kaffee beim Brühen aufnimmt", "Geschwindigkeit, mit der der Röster Wasser verdampft", "Dampfdruck des Kaffees im Verhältnis zu reinem Wasser"], "correct": 3, "explain": "aw ist der Dampfdruck des Kaffees geteilt durch den von reinem Wasser, ein Wert zwischen 0 und 1. Anders als der Feuchtegehalt zeigt er, wie verfügbar und damit wie stabil das Wasser ist.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part I: Moisture Content and Water Activity", "url": "https://royalcoffee.com/green-coffee-analytics-relevance-to-roasters-buyers-and-producers-part-i-moisture-content-and-total-water-activity/"}, "img": "sack", "topic": "Rohkaffee", "st": 8}, {"id": "r2-117", "mode": "roester", "level": 2, "type": "mc", "q": "Wie hängen Feuchte und Dichte von Rohkaffee laut Royal Coffee zusammen?", "options": ["Feuchtere Partien sind deutlich dichter", "Die Feuchte hat keinen Einfluss auf die Dichte", "Feuchtere Partien sind weniger dicht", "Nur getrocknete Naturals ändern ihre Dichte"], "correct": 2, "explain": "Entgegen einer verbreiteten Annahme sind feuchtere Kaffees weniger dicht. In Royals Daten stieg die Dichte um etwa 0,04 g/ml je Prozentpunkt weniger Feuchte.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part IV: Density", "url": "https://royalcoffee.com/green-coffee-analytics-part-iv-density/"}, "img": "sack", "topic": "Rohkaffee", "st": 7}, {"id": "r2-118", "mode": "roester", "level": 2, "type": "mc", "q": "Welche Herkünfte messen laut Royal Coffee typischerweise eine eher geringe Dichte?", "options": ["Kenia und Äthiopien", "Kolumbien und Kenia", "Sumatra und Brasilien", "Äthiopien und Kolumbien"], "correct": 2, "explain": "Ostafrika und Kolumbien zeigen bei Royal oft sehr hohe Dichte, Sumatra und Brasilien eher geringe. Naturals sind zudem häufig weniger dicht als gewaschene Kaffees.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part IV: Density", "url": "https://royalcoffee.com/green-coffee-analytics-part-iv-density/"}, "img": "sack", "topic": "Rohkaffee", "st": 5}, {"id": "r2-119", "mode": "roester", "level": 2, "type": "mc", "q": "Welche Kaffees röstet man laut Royal Coffee als Faustregel am langsamsten und dunkelsten?", "options": ["Gewaschene Kaffees aus großer Höhe", "Naturals aus sehr großer Höhe", "Wet-hulled Kaffees aus niedrigen Lagen", "Honey-Kaffees aus mittlerer Höhe"], "correct": 2, "explain": "Royal New York nennt als Faustregel: gewaschene Hochland-Kaffees am schnellsten und hellsten, wet-hulled Kaffees aus niedrigen Lagen am langsamsten und dunkelsten. Naturals röstet man meist länger als Gewaschene.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "kurve", "topic": "Rohkaffee", "st": 6}, {"id": "r2-120", "mode": "roester", "level": 2, "type": "mc", "q": "Was unterscheidet die Karamellisierung von der Maillard-Reaktion?", "options": ["Sie läuft schon bei Raumtemperatur ab", "Sie betrifft nur Zucker, keine Aminosäuren", "Sie braucht Chlorogensäuren als Partner", "Sie erzeugt mehr fleischige Aromen"], "correct": 1, "explain": "Karamellisierung betrifft nur Zucker, ist langsamer und braucht höhere Temperaturen. Ohne Schwefel und Stickstoff aus Aminosäuren entstehen kaum fleischige Noten wie bei Maillard.", "source": {"title": "Sweet Maria's – Glossar: Caramelization", "url": "https://library.sweetmarias.com/glossary/caramelization/"}, "img": "bohne", "topic": "Chemie", "st": 1}, {"id": "r2-121", "mode": "roester", "level": 2, "type": "mc", "q": "Wie verändert sich der Geschmack von Zucker mit fortschreiten
