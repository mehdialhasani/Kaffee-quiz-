ng the world’s most vulnerable coffee zones (Bunn et al. 2015)", "url": "https://worldcoffeeresearch.org/news/2015/climate-change-pinpointing-the-worlds-most-vulnerable-coffee-zones"}, "img": "sonne", "topic": "Klima & Standort"}, {"id": "a2-24", "mode": "anbau", "level": 2, "type": "case", "q": "Deine Pflücker liefern die Kirschen abends ab, der Pulper läuft erst am nächsten Mittag. Was empfiehlt der TechnoServe-Leitfaden?", "options": ["Im Schatten lagern, dann sind auch 2–3 Tage problemlos", "Über Nacht in der Sonne liegen lassen, damit sie noch nachreifen", "Über Nacht in Wasser einweichen, damit sie frisch bleiben", "Binnen 6–8 Stunden entpulpen, sonst gären sie unkontrolliert"], "correct": 3, "explain": "Kirschen sollten innerhalb von 6–8 Stunden entpulpt werden; wartet man länger, beginnt Fermentation in der Frucht, die zu Defekten führen kann. Notfalls mit kaltem Wasser abspülen, um sie zu bremsen.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Aufbereitung"}, {"id": "a2-25", "mode": "anbau", "level": 2, "type": "case", "q": "Dein Pergamentkaffee liegt im Fermentationstank. Woran erkennst du, dass der Schleim gelöst ist?", "options": ["Er fühlt sich glitschig an, die Bohnen kleben aneinander", "Das Wasser im Tank wird klar, und die Bohnen schwimmen oben", "Er fühlt sich körnig an, ein Stock hinterlässt ein stabiles Loch", "Er riecht stechend nach Essig, und auf dem Tank steht heller Schaum"], "correct": 2, "explain": "Typische Zeichen: Das Pergament fühlt sich nicht mehr glitschig, sondern körnig an, und beim Stocktest fällt das Loch nicht mehr zusammen. Die Zeit allein ist nur ein grober Richtwert.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a2-26", "mode": "anbau", "level": 2, "type": "mc", "q": "Im Waschkanal wird Pergamentkaffee nach Dichte getrennt. Welcher Teil gilt als beste Qualität?", "options": ["Was oben schwimmt und ans Kanalende treibt", "Was halb schwebt und in der Kanalmitte landet", "Was am Rand kleben bleibt und abgestreift wird", "Was absinkt und am Kanalanfang liegen bleibt"], "correct": 3, "explain": "Dichtes Pergament (Parchment 1/Grade A) sinkt und bleibt am Kanalanfang; leichte „Lights“ schwimmen ans Ende und werden getrennt gehalten.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a2-27", "mode": "anbau", "level": 2, "type": "mc", "q": "Welcher dieser Rohkaffeefehler zählt nach SCAA-Klassifizierung zu den Primärdefekten?", "options": ["Eine teils schwarze Bohne (Partial Black)", "Eine muschelförmige Bohne (Shell)", "Eine leichte, schwimmende Bohne (Floater)", "Eine ganz schwarze Bohne (Full Black)"], "correct": 3, "explain": "Zu den Primärdefekten zählen u. a. Full Black, Full Sour, Pod/Cherry sowie Steine und Stöcke; in Specialty Grade ist kein einziger erlaubt.", "source": {"title": "Coffee Research Institute – SCAA Green Coffee Classification", "url": "https://coffeeresearch.org/coffee/scaaclass.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität"}, {"id": "a2-28", "mode": "anbau", "level": 2, "type": "mc", "q": "Wofür steht „SHB“ bei Kaffee aus Mittelamerika, etwa aus Costa Rica oder Guatemala?", "options": ["Super Honey Bean", "Strictly High Bourbon", "Strictly Hard Bean", "Selected Handpicked Bean"], "correct": 2, "explain": "SHB (Strictly Hard Bean) ist eine Klassifizierung nach Anbauhöhe; in höheren Lagen gewachsene Bohnen sind dichter. Gleichbedeutend wird SHG (Strictly High Grown) verwendet.", "source": {"title": "Sweet Maria's Coffee Library – Glossar: Strictly High Grown / Strictly Hard Bean", "url": "https://library.sweetmarias.com/glossary/strictly-high-grown/"}, "img": "berg", "topic": "Rohkaffee & Qualität"}, {"id": "a2-29", "mode": "anbau", "level": 2, "type": "mc", "q": "Was bedeutet der Zusatz „EP“ (European Preparation) auf einem Rohkaffeesack?", "options": ["Der Kaffee wurde für den EU-Markt bio-zertifiziert", "Der Kaffee wurde vor dem Export entkoffeiniert", "Der Kaffee wurde in einer europäischen Mühle geschält", "Der Kaffee wurde zusätzlich von Hand nachverlesen"], "correct": 3, "explain": "Von Hand nachgelesener, gereinigter Kaffee wird oft als „European Preparation“ bezeichnet; die besten Partien werden sogar zwei- bis dreimal verlesen.", "source": {"title": "Coffee Review – Cleaning and Sorting", "url": "https://www.coffeereview.com/coffee-reference/from-crop-to-cup/processing/cleaning-and-sorting"}, "img": "kirsche", "topic": "Rohkaffee & Qualität"}, {"id": "a2-30", "mode": "anbau", "level": 2, "type": "mc", "q": "Was kennzeichnet eine „anaerobe“ Fermentation von Kaffee?", "options": ["Er fermentiert in offenen Tanks unter ständigem, kräftigem Umrühren", "Er fermentiert ohne Mikroorganismen, nur durch Enzyme", "Er fermentiert in offenen Becken unter fließendem Wasser", "Er fermentiert in verschlossenen Behältern mit wenig Sauerstoff"], "correct": 3, "explain": "Der Kaffee fermentiert in verschlossenen Säcken oder Tanks; überschüssiges CO₂ entweicht über Ventile, Luft bleibt draußen. Bei Carbonic Maceration wird zusätzlich CO₂ eingeleitet.", "source": {"title": "Coffee Review – Anaerobically Processed Coffees", "url": "https://www.coffeereview.com/anaerobically-processed-coffees/"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a3-01", "mode": "anbau", "level": 3, "type": "mc", "q": "Aus welchen beiden Wildarten ist Coffea arabica durch natürliche Hybridisierung entstanden?", "options": ["C. canephora × C. eugenioides", "C. liberica × C. canephora", "C. stenophylla × C. eugenioides", "C. racemosa × C. liberica"], "correct": 0, "explain": "Arabica ist eine junge allotetraploide Art aus der Kreuzung zweier diploider Arten: C. canephora (C-Genom) und C. eugenioides (E-Genom).", "source": {"title": "CIRAD Agritrop – Sequence organisation at homeologous regions in the allotetraploid Coffea arabica", "url": "https://agritrop.cirad.fr/551242"}, "img": "pflanze", "topic": "Botanik"}, {"id": "a3-02", "mode": "anbau", "level": 3, "type": "mc", "q": "Was unterscheidet Arabica genetisch von allen anderen Coffea-Arten?", "options": ["Arabica ist diploid (22 Chromosomen) und selbststeril", "Arabica ist tetraploid (44 Chromosomen) und selbstfruchtbar", "Arabica ist tetraploid (44 Chromosomen) und selbststeril", "Arabica ist hexaploid (66 Chromosomen) und selbstbefruchtend"], "correct": 1, "explain": "Arabica ist die einzige tetraploide (2n=4x=44) und selbstfruchtbare Kaffeeart; die übrigen Arten sind diploid (2n=22) und meist selbstinkompatibel.", "source": {"title": "CIRAD Agritrop – Sequence organisation at homeologous regions in the allotetraploid Coffea arabica", "url": "https://agritrop.cirad.fr/551242"}, "img": "bluete", "topic": "Botanik"}, {"id": "a3-03", "mode": "anbau", "level": 3, "type": "mc", "q": "Was ist der Timor-Hybrid?", "options": ["Eine im Labor gentechnisch veränderte Arabica aus Indonesien", "Eine natürliche Zwergmutation von Typica von der Insel Timor", "Eine natürliche Arabica-Robusta-Kreuzung von der Insel Timor", "Eine gezielte Arabica-Liberica-Kreuzung von der Insel Java"], "correct": 2, "explain": "In den 1920er-Jahren kreuzten sich auf Timor eine Arabica- und eine Robusta-Pflanze; das Robusta-Erbgut brachte Rostresistenz und ist Basis von Catimoren und Sarchimoren.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "blatt", "topic": "Arten & Sorten"}, {"id": "a3-04", "mode": "anbau", "level": 3, "type": "mc", "q": "Was darf eine Rohkaffeeprobe nach der SCAA-Klassifizierung für „Specialty Grade“ NICHT enthalten?", "options": ["Bohnen mit 11 % Restfeuchte", "Einen einzigen Sekundärdefekt", "Bohnen aus Honey-Aufbereitung", "Einen einzigen Primärdefekt"], "correct": 3, "explain": "Specialty Grade erlaubt keine Primärdefekte, höchstens 5 Full Defects und keine Quaker; die Feuchte muss zwischen 9 und 13 % liegen.", "source": {"title": "Coffee Research Institute – SCAA Green Coffee Classification", "url": "https://coffeeresearch.org/coffee/scaaclass.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität"}, {"id": "a3-05", "mode": "anbau", "level": 3, "type": "mc", "q": "Aus welcher Kreuzung stammt Pacamara, und wo wurde sie gezüchtet?", "options": ["Pacas × Maragogipe, El Salvador", "Caturra × Catuaí, Brasilien", "Typica × SL28, Kenia", "Geisha × Bourbon, Panama"], "correct": 0, "explain": "Pacamara wurde vom salvadorianischen Kaffeeforschungsinstitut ISIC aus Pacas × Maragogipe gezüchtet und hat sehr große Bohnen.", "source": {"title": "World Coffee Research – Varietätenkatalog: Pacamara", "url": "https://varieties.worldcoffeeresearch.org/varieties/pacamara"}, "img": "kirsche", "topic": "Arten & Sorten"}, {"id": "a3-06", "mode": "anbau", "level": 3, "type": "case", "q": "Deine F1-Hybrid-Pflanzen (z. B. Centroamericano H1) tragen super. Kannst du aus ihren Samen gleichwertige Nachkommen ziehen?", "options": ["Ja, Arabica ist selbstfruchtbar, die Nachkommen sind identisch", "Nein, die Nachkommen spalten auf und sind nicht gleichwertig", "Ja, sofern die Mutterpflanzen im Schatten gewachsen sind", "Nein, F1-Hybride bilden grundsätzlich keine keimfähigen Samen"], "correct": 1, "explain": "Samen von F1-Hybriden sind nicht sortenecht: Die Eigenschaften spalten in der nächsten Generation auf (Segregation).", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "pflanze", "topic": "Arten & Sorten"}, {"id": "a3-07", "mode": "anbau", "level": 3, "type": "mc", "q": "Wo und woraus wurde die Varietät SL28 selektiert?", "options": ["In Kolumbien, aus der Varietät „Castillo“", "In Äthiopien, aus den Wildbeständen bei „Gesha“", "In Kenia, aus „Tanganyika Drought Resistant“", "In Indien, aus der dortigen Varietät „Kent“"], "correct": 2, "explain": "SL28 wurde 1935 an den Scott Agricultural Laboratories (Kenia) aus einem einzelnen Baum der Population „Tanganyika Drought Resistant“ ausgewählt; genetisch gehört sie zur Bourbon-Gruppe.", "source": {"title": "World Coffee Research – Varietätenkatalog: SL28", "url": "https://varieties.worldcoffeeresearch.org/varieties/sl28"}, "img": "pflanze", "topic": "Arten & Sorten"}, {"id": "a3-08", "mode": "anbau", "level": 3, "type": "mc", "q": "Was ist das Besondere an der Wet-Hulled-Aufbereitung (Giling Basah) in Indonesien?", "options": ["Das Pergament wird noch feucht entfernt, dann fertig getrocknet", "Die Kirschen werden ganz eingefroren und erst später geschält", "Die Bohnen werden in Meerwasser fermentiert und dann getrocknet", "Die Kirschen werden von Zibetkatzen gefressen und ausgeschieden"], "correct": 0, "explain": "Beim Giling Basah werden Schleim und Pergament entfernt, solange die Bohne noch sehr feucht ist; der Rohkaffee trocknet danach schnell weiter – passend zum feuchten Klima Sumatras.", "source": {"title": "Cafe Imports – Wet-Hulled (Giling Basah)", "url": "https://www.cafeimports.com/europe/blog/?p=37563"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a3-09", "mode": "anbau", "level": 3, "type": "case", "q": "Ein Kaffee aus der Region der Großen Seen (z. B. Ruanda) riecht gemahlen nach rohen, geschälten Kartoffeln. Womit hängt dieser Defekt zusammen?", "options": ["Mit Fraß durch den Kaffeekirschenkäfer", "Mit zu langer Fermentation im Tank", "Mit Befall durch den Kaffeerostpilz", "Mit Schäden durch die Antestia-Wanze"], "correct": 3, "explain": "Der Potato Taste Defect steht nach WCR klar im Zusammenhang mit Schäden durch die Antestia-Wanze; beteiligt sind Methoxypyrazine wie IPMP. Eine einzige Bohne kann eine Tasse prägen.", "source": {"title": "World Coffee Research – Potato Taste Defect: Impacts of the Antestia Bug (2023)", "url": "https://worldcoffeeresearch.org/download/a2a841cb-658e-4020-b70d-c38d3bc3f0c3"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge"}, {"id": "a3-10", "mode": "anbau", "level": 3, "type": "case", "q": "Ein Regenschauer hat deinen halbtrockenen Kaffee auf dem Trockenbett wieder durchnässt. Welches Risiko steigt vor allem?", "options": ["Das Koffein wird ausgewaschen und geht verloren", "Schimmel kann wachsen und Ochratoxin A bilden", "Der Zucker karamellisiert in der Sonne zu stark", "Die Bohnen werden durch Kälte rissig und brüchig"], "correct": 1, "explain": "Wiederbefeuchtung und langsames Trocknen begünstigen OTA-bildende Pilze wie Aspergillus; der Codex empfiehlt, Rückbefeuchtung zu vermeiden und unter 12,5 % Feuchte zu trocknen.", "source": {"title": "Codex Alimentarius CAC/RCP 69-2009 – Code of Practice for the Prevention and Reduction of Ochratoxin A in Coffee", "url": "https://www.gov.si/assets/organi-v-sestavi/UVHVVR/Varna-hrana/Onesnazevala-v-zivilih/OTA-kava-CAC-RCP-69-2009.pdf"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a3-11", "mode": "anbau", "level": 3, "type": "mc", "q": "Was zeigte eine Feldstudie in Costa Rica zu Schattenbäumen über Kaffee?", "options": ["Schatten beschleunigte die Reife und steigerte den Ertrag, verschlechterte aber die Tasse", "Schatten verzögerte die Reife und senkte den Ertrag, verbesserte aber die Qualität", "Schatten verzögerte die Reife und senkte die Qualität, steigerte aber den Ertrag", "Schatten beschleunigte die Reife und senkte den Ertrag, ohne die Qualität zu ändern"], "correct": 1, "explain": "In der Studie senkte Schatten die Produktivität um 18 %, verzögerte die Fruchtreife bis zu einem Monat und verbesserte Bohnengröße und Getränkequalität.", "source": {"title": "Vaast et al. (2006), J. Sci. Food Agric. – Fruit thinning and shade improve bean characteristics and beverage quality of coffee", "url": "https://agritrop.cirad.fr/530251"}, "img": "sonne", "topic": "Klima & Standort"}, {"id": "a3-12", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Pilzkrankheit befällt in Afrika speziell die grünen Arabica-Kirschen und kann große Ernteverluste verursachen?", "options": ["Coffee Berry Disease (Colletotrichum kahawae)", "Kaffeerost (Hemileia vastatrix)", "Ojo de Gallo (Mycena citricolor)", "Braunfleckenkrankheit (Cercospora coffeicola)"], "correct": 0, "explain": "Coffee Berry Disease (Colletotrichum kahawae) ist auf grüne Kirschen spezialisiert und kann unter günstigen Bedingungen 60–80 % der Ernte vernichten.", "source": {"title": "Mouen Bedimo et al. (2012), Crop Protection 31:125–131", "url": "https://publications.cirad.fr/une_notice.php?dk=562177"}, "img": "kirsche", "topic": "Krankheiten & Schädlinge"}, {"id": "a3-13", "mode": "anbau", "level": 3, "type": "mc", "q": "Warum gilt die wiederentdeckte Art Coffea stenophylla als Hoffnungsträger im Klimawandel?", "options": ["Sie verträgt gut 6 °C mehr Wärme und schmeckt Arabica-ähnlich", "Sie verträgt auch Nachtfrost gut und schmeckt Arabica-ähnlich", "Sie enthält kaum Koffein und ist resistent gegen Kaffeerost", "Sie trägt schon nach einem Jahr und liefert sehr hohe Erträge"], "correct": 0, "explain": "Stenophylla aus Westafrika gedeiht bei rund 24,9 °C Jahresmittel, etwa 6,2–6,8 °C mehr als Arabica; Verkostungsjurys beschrieben ihren Geschmack als Arabica-ähnlich (Davis et al. 2021).", "source": {"title": "CIRAD – Coffea stenophylla could help futureproof coffee (Davis et al. 2021, Nature Plants)", "url": "https://www.cirad.fr/en/press-area/press-releases/2021/coffea-stenophylla-coffee-climate-change"}, "img": "sonne", "topic": "Arten & Sorten"}, {"id": "a3-14", "mode": "anbau", "level": 3, "type": "mc", "q": "Welcher Anteil der wilden Kaffeearten gilt laut Kew-Studie (Davis et al. 2019) als vom Aussterben bedroht?", "options": ["Etwa 25 %", "Etwa 40 %", "Etwa 60 %", "Etwa 80 %"], "correct": 2, "explain": "Von 124 bekannten Wildkaffeearten sind 75 (rund 60 %) nach den Kriterien der Roten Liste der IUCN bedroht.", "source": {"title": "Mongabay – 60% of wild coffee species threatened with extinction (Davis et al. 2019, Science Advances)", "url": "https://news.mongabay.com/2019/01/coffee-in-trouble-60-of-wild-coffee-species-threatened-with-extinction/"}, "img": "pflanze", "topic": "Arten & Sorten"}, {"id": "a3-15", "mode": "anbau", "level": 3, "type": "mc", "q": "Aus welchem Gewebe besteht die eigentliche Kaffeebohne größtenteils?", "options": ["Aus der Fruchthaut (Exokarp)", "Aus dem Fruchtfleisch (Mesokarp)", "Aus dem Pergament (Endokarp)", "Aus dem Nährgewebe (Endosperm)"], "correct": 3, "explain": "Das Endosperm verdrängt während der Fruchtentwicklung das Perisperm und bildet die Bohne; der kleine Embryo sitzt darin, vom Perisperm bleibt nur das Silberhäutchen.", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Botanik"}, {"id": "a3-16", "mode": "anbau", "level": 3, "type": "case", "q": "Es ist schwül, aber regenlos, ohne Tau. Kann eine Rostspore auf einem trockenen Blatt jetzt keimen?", "options": ["Ja, eine hohe Luftfeuchte allein reicht zum Keimen aus", "Nein, die Sporen brauchen freies Wasser auf dem Blatt", "Ja, Rostsporen keimen gerade bei trockener Wärme", "Nein, die Sporen keimen nur bei Temperaturen unter 10 °C"], "correct": 1, "explain": "Rostsporen keimen nur in freiem Wasser auf dem Blatt; hohe Luftfeuchte allein genügt nicht.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge"}, {"id": "a3-17", "mode": "anbau", "level": 3, "type": "mc", "q": "Welcher Erreger verursacht die Tracheomykose (Coffee Wilt Disease), die in Uganda und im Kongo vor allem Robusta abtötet?", "options": ["Hypothenemus hampei", "Hemileia vastatrix", "Fusarium xylarioides", "Colletotrichum kahawae"], "correct": 2, "explain": "Die Welkekrankheit durch Fusarium xylarioides trat bei Erhebungen in Uganda, Tansania und DR Kongo nur an C. canephora auf, in Äthiopien nur an Arabica; befallene Bäume welken und sterben.", "source": {"title": "Oduor et al. (2005), ASIC – Surveys to establish the spread of coffee wilt disease in Africa", "url": "https://agritrop.cirad.fr/529389/"}, "img": "blatt", "topic": "Krankheiten & Schädlinge"}, {"id": "a3-18", "mode": "anbau", "level": 3, "type": "case", "q": "Nach der Ernte hängen noch überreife Kirschen am Baum und liegen am Boden. Was hilft am meisten gegen den Kirschenkäfer in der nächsten Saison?", "options": ["Restkirschen am Boden als Mulch liegen lassen", "Alle Restkirschen von Baum und Boden einsammeln", "Die Bäume nach der Ernte kräftig mit Stickstoff düngen", "Die Bäume nach der Ernte häufiger bewässern"], "correct": 1, "explain": "Restkirschen sind Brutstätten des Kirschenkäfers. Zur Feldhygiene gehört, nach der Ernte alle Kirschen von Baum und Boden zu entfernen.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge"}, {"id": "a3-19", "mode": "anbau", "level": 3, "type": "mc", "q": "Welcher Organismus wird biologisch gegen den Kaffeekirschenkäfer eingesetzt, etwa in Puerto Rico und Indonesien?", "options": ["Der Insektenpilz Beauveria bassiana", "Der Pflanzenpilz Colletotrichum kahawae", "Der Wurzelnematode Meloidogyne exigua", "Die Gärhefe Saccharomyces cerevisiae"], "correct": 0, "explain": "Sprays mit Beauveria bassiana sind Teil integrierter Programme gegen den Käfer; in Puerto Rico richtet sich die Ausbringung nach der Position des Käfers in der Frucht.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge"}, {"id": "a3-20", "mode": "anbau", "level": 3, "type": "case", "q": "Ein Farmer pflanzt einen ganzen Robusta-Hang mit nur einem einzigen Klon. Was ist das Problem?", "options": ["Keins, denn Robusta befruchtet sich zuverlässig selbst", "Robusta ist selbstinkompatibel und braucht verschiedene Klone", "Ein einzelner Klon bildet bei Robusta nur kleine Peaberries", "Robusta-Klone bilden kaum Wurzeln und wachsen am Hang nicht an"], "correct": 1, "explain": "C. canephora ist auf Fremdbestäubung angewiesen (gametophytische Selbstinkompatibilität). Ein Klon kann sich nicht selbst befruchten, daher braucht es kompatible Partner im Bestand.", "source": {"title": "Moraes et al. (2018), Genetics and Molecular Research – Gametophytic self-incompatibility of Coffea canephora clones", "url": "https://www.alice.cnptia.embrapa.br/handle/doc/1101580?locale=en"}, "img": "bluete", "topic": "Botanik"}, {"id": "a3-21", "mode": "anbau", "level": 3, "type": "mc", "q": "Warum folgt bei ungeschattetem Arabica auf ein Jahr mit sehr hoher Ernte oft ein schwaches Jahr?", "options": ["Weil Arabica von Natur aus nur alle zwei Jahre blüht", "Weil die Fruchtlast Blattbildung bremst und Zweige absterben lässt", "Weil die volle Sonne im Folgejahr die jungen Blütenknospen verbrennt", "Weil reiche Ernten im Folgejahr viel mehr Kirschenkäfer anlocken"], "correct": 1, "explain": "Starker Fruchtbehang ist bei ungeschattetem Arabica typisch; er schränkt Bildung und Erhalt der Blätter ein und führt zum Absterben von Zweigen – daraus entsteht die ausgeprägte Alternanz.", "source": {"title": "Chaves et al. (2012), Environmental and Experimental Botany 77:207–218", "url": "https://www.alice.cnptia.embrapa.br/alice/bitstream/doc/919316/1/ArtigoEnvironmentalandExperimentalBotany2012.pdf"}, "img": "pflanze", "topic": "Blüte & Ernte"}, {"id": "a3-22", "mode": "anbau", "level": 3, "type": "case", "q": "Du willst alte, erschöpfte Bäume durch Rückschnitt auf Kniehöhe (Stumping) verjüngen. Womit musst du rechnen?", "options": ["Mit einer Rekordernte schon in derselben Saison", "Mit dauerhaft halbiertem Ertrag in allen Folgejahren", "Mit dem Absterben der meisten Bäume binnen Wochen", "Mit Ernteausfall für ein, oft auch zwei Jahre"], "correct": 3, "explain": "Beim kompletten Stumping auf etwa 50 cm fällt die Ernte ein und oft zwei Jahre aus; das FAO-Handbuch empfiehlt deshalb gestaffelte Verjüngung über neue Triebe.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 5: Pruning and tree management", "url": "https://www.fao.org/3/ae939e/ae939e07.htm"}, "img": "pflanze", "topic": "Blüte & Ernte"}, {"id": "a3-23", "mode": "anbau", "level": 3, "type": "mc", "q": "Wogegen wurde die kenianische F1-Hybride Ruiru 11 vor allem gezüchtet?", "options": ["Gegen Trockenheit und starken Hitzestress", "Gegen Kirschenkäfer und Antestia-Wanze", "Gegen Coffee Berry Disease und Kaffeerost", "Gegen Kaffeewelke und Wurzelgallennematoden"], "correct": 2, "explain": "Ruiru 11 entstand nach der CBD-Epidemie von 1968 an der Forschungsstation Ruiru und wurde 1985 freigegeben; sie ist resistent gegen CBD und tolerant bis resistent gegen Rost.", "source": {"title": "World Coffee Research – Varietätenkatalog: Ruiru 11", "url": "https://varieties.worldcoffeeresearch.org/varieties/ruiru-11"}, "img": "blatt", "topic": "Arten & Sorten"}, {"id": "a3-24", "mode": "anbau", "level": 3, "type": "mc", "q": "Warum spricht man bei Arabica in Lateinamerika von einem genetischen Flaschenhals?", "options": ["Weil er fast nur auf Wildpflanzen aus den Bergwäldern Kolumbiens beruht", "Weil er auf einer frühen Kreuzung mit Robusta aus dem Kongo beruht", "Weil er auf wenigen Typica- und Bourbon-Linien aus dem Jemen beruht", "Weil er nur auf Saatgut aus wenigen staatlichen Samenbanken beruht"], "correct": 2, "explain": "Wenige aus dem Jemen mitgenommene Bäume bilden die Basis der meisten Arabica-Produktion; in Brasilien gehen laut WCR 97,55 % der Sorten auf Typica und Bourbon zurück.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "pflanze", "topic": "Arten & Sorten"}, {"id": "a3-25", "mode": "anbau", "level": 3, "type": "mc", "q": "Von welcher Pflanze stammen die Typica-Bestände ab, die später Amerika besiedelten?", "options": ["Von einem Baum, der 1706 von Java nach Amsterdam kam", "Von Wildpflanzen, die 1720 aus Äthiopien nach Paris kamen", "Von Samen, die 1750 aus dem Jemen nach Brasilien kamen", "Von Stecklingen, die 1690 von Ceylon nach Lissabon kamen"], "correct": 0, "explain": "1706 kam eine einzelne Typica-Pflanze von Java in den Botanischen Garten Amsterdam; von ihr stammt die Typica ab, die später nach Amerika gelangte.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "pflanze", "topic": "Herkunft"}, {"id": "a3-26", "mode": "anbau", "level": 3, "type": "case", "q": "Mittags in der prallen Sonne misst du auf dem Trockenbett sehr heißen Pergamentkaffee. Was tust du?", "options": ["Dünn ausbreiten und weiter in der prallen Sonne trocknen lassen", "Sofort schälen, damit er im Lager schneller abkühlt", "Mit Wasser besprühen, damit er unter ca. 35 °C bleibt", "Zusammenschieben und abdecken, damit er unter ca. 35 °C bleibt"], "correct": 3, "explain": "Der TechnoServe-Leitfaden empfiehlt, den Kaffee in der heißesten Tageszeit zusammenzuschieben und abzudecken; das Pergament sollte 35 °C nicht überschreiten.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a3-27", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie entfernt ein mechanischer Entschleimer (Demucilager) den Fruchtschleim?", "options": ["Durch kurzes Erhitzen der Bohnen in kochend heißem Wasser", "Durch Reibung der Bohnen aneinander, mit wenig Wasser", "Durch Zugabe von Natronlauge in einem Spültank", "Durch Ultraschallwellen in einem Salzwasserbad"], "correct": 1, "explain": "Der Schleim wird durch Reibung der Bohnen aneinander entfernt, allein oder kombiniert mit Fermentation; moderne Geräte brauchen nur etwa 0,5–1 m³ Wasser pro Tonne nassem Pergament.", "source": {"title": "SCA 25 Magazine – The Impact of Mucilage Removers on Coffee Sustainability and Quality", "url": "https://sca.coffee/sca-news/25-magazine/issue-6/english/water-saving-demucilagers"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a3-28", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Mikroorganismen vermehrten sich in einer klassischen Studie zur Kaffee-Nassfermentation am stärksten?", "options": ["Schimmelpilze (Penicillium)", "Milchsäurebakterien und Hefen", "Cyanobakterien und Grünalgen", "Aspergillus- und Fusarium-Pilze"], "correct": 1, "explain": "Avallone et al. (2001) beobachteten die stärkste Zunahme bei Milchsäurebakterien (v. a. Leuconostoc mesenteroides) und Hefen.", "source": {"title": "Avallone et al. (2001), Current Microbiology – Microbiological and biochemical study of coffee fermentation", "url": "https://agritrop.cirad.fr/526386"}, "img": "trocknung", "topic": "Aufbereitung"}, {"id": "a3-29", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie groß ist die Standardprobe für die Defektzählung nach der SCAA-Rohkaffeeklassifizierung?", "options": ["100 g geschälter Rohkaffee", "300 g geschälter Rohkaffee", "500 g geschälter Rohkaffee", "1 kg geschälter Rohkaffee"], "correct": 1, "explain": "Ausgangspunkt sind 300 g geschälter Rohkaffee; Specialty Grade erlaubt darin höchstens 5 Full Defects.", "source": {"title": "Coffee Research Institute – SCAA Green Coffee Classification", "url": "https://coffeeresearch.org/coffee/scaaclass.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität"}, {"id": "a3-30", "mode": "anbau", "level": 3, "type": "mc", "q": "Was zeigte eine Studie in „Science“ (Wright et al. 2013) über Koffein im Nektar von Kaffeeblüten?", "options": ["Koffein im Nektar verbessert das Duftgedächtnis von Honigbienen", "Koffein im Nektar schreckt Honigbienen von den Blüten ab", "Koffein im Nektar schädigt das Gedächtnis von Honigbienen", "Koffein im Nektar lockt vor allem Hummeln statt der Honigbienen an"], "correct": 0, "explain": "Kaffee- und Zitrusblüten enthalten Koffein im Nektar; Bienen mit koffeinhaltiger Zuckerlösung erinnerten sich etwa dreimal so häufig an den Blütenduft.", "source": {"title": "Newcastle University – Bees get a buzz from caffeine (Wright et al. 2013, Science)", "url": "https://www.ncl.ac.uk/press/articles/archive/2013/03/beesgetabuzzfromcaffeine.html"}, "img": "bluete", "topic": "Botanik"}]</script>

function home(){const a=QZR(),ow=openWrong().length;S.prac=false;S.calm=false;S.cdone=[];S.cn=0;a.classList.remove('calm');
 a.innerHTML=`<div class="eb"><i></i>Zum Üben</div><h1>Kaffee-Quiz</h1><p class="s">Drei Bereiche, drei Stufen, je ${N} zufällige Fragen aus ${Q.length}. Fragen, die du noch nicht hattest, kommen zuerst. Nach jeder Antwort siehst du Erklärung und Quelle.</p>

function calm(f){S.calm=true;S.prac=S.daily=false;if(f!==undefined)S.cf=f;S.cf=S.cf||'all';S.cdone=S.cdone||[];S.cn=S.cn||0;
 const P=Q.filter(q=>(S.cf==='all'||q.mode===S.cf)&&!S.cdone.includes(q.id));if(!P.length){S.cdone=[];return calm()}
 prep(pick(P,1))}

 <div class="qc"><div class="qart ${md.c}">${ICON[q.img]||ART[S.mode]}</div><div class="qb"><div class="qm">${S.calm?`${md.n} · ${LV[FIX[q.mode]?S.lv:q.level-1]}`:`${S.prac?'Fehler üben · ':''}${md.n} · ${LV[FIX[q.mode]?S.lv:q.level-1]} · Frage ${S.i+1} von ${S.list.length}`}${nw?'<span class="nw">neu</span>':''}</div>
 ${q.case?`<div class="case"><b>${esc(q.case.title)}</b><div class="f">${(q.case.facts||[]).map(f=>`<span>${esc(f)}</span>`).join('')}</div>${q.case.cup?`<q>${esc(q.case.cup)}</q>`:''}</div>`:''}
 <p class="qq">${esc(q.q)}</p><div class="opts">${q.o.map((o,i)=>`<button class="op" data-o="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div><div id="ex"></div></div></div>${S.calm&&S.cn?`<div class="cn">${S.cn} Fragen in Ruhe beantwortet</div>`:''}`;a.classList.toggle('calm',!!S.calm)}
function answer(i,el){if(S.ans!==null)return;const q=S.list[S.i],ok=q.o[i].ok;S.ans=i;S.res[S.i]=ok;const d=qs(q.id);d.s++;ok?d.c++:d.w++;d.last=Date.now();d.lw=ok?0:1;if(ok&&!S.calm)DB.xp=xp()+XPL[q.level-1];save();if(!S.calm)fx(ok);if(S.calm){S.cn++;S.cdone.push(q.id)}
 QZR().querySelectorAll('.op').forEach((b,k)=>{if(q.o[k].ok)b.classList.add('ok');else if(k===i)b.classList.add('bad');else b.classList.add('dim')});
 if(ok&&!RM&&!S.calm)burst(el);
 QZR().querySelector('#ex').innerHTML=`<div class="ex"><b>${ok?'Richtig!':'Nicht ganz.'}</b>${esc(q.explain)}${q.source&&q.source.url?`<br><a href="${esc(q.source.url)}" target="_blank" rel="noopener">Quelle: ${esc(q.source.title)} ↗</a>`:''}</div><button class="go${S.calm?' sec':''}" data-a="next">${S.calm?'Nächste Frage':S.i+1<S.list.length?'Weiter':'Ergebnis'}</button>`;
 const p=QZR().querySelectorAll('.prog i')[S.i];if(p){p.classList.remove('cur');p.classList.add(ok?'ok':'bad')}}
function burst(el){const r=el.getBoundingClientRect();for(let k=0;k<14;k++){const d=document.createElement('i');d.className='qz-dot';const a=Math.random()*6.283,s=40+Math.random()*50;d.style.cssText=`left:${r.left+r.width*.12}px;top:${r.top+r.height/2+scrollY}px;background:${['#2f8f5b','#e8a23e','#c88a52','#7cc0e8'][k%4]};--dx:${Math.cos(a)*s}px;--dy:${Math.sin(a)*s}px;position:absolute`;document.body.appendChild(d);setTimeout(()=>d.remove(),950)}}
function end(){const a=QZR(),n=S.res.filter(Boolean).length,t=S.list.length,p=n/t,bOld=S.prac?0:best(S.mode,S.lv);const gained=S.list.reduce((s,q,i)=>s+(S.res[i]?XPL[q.level-1]:0),0);if(S.daily)DB.daily=today();if(!S.prac){DB.hist.push({t:Date.now(),m:S.mode,l:S.daily?-1:S.lv,n,of:t,ids:S.list.map(q=>q.id),wr:S.list.filter((q,i)=>!S.res[i]).map(q=>q.id)});save()}const C=2*Math.PI*70;
 const msg=p===1?'Perfekt!':p>=.8?'Sehr stark':p>=.5?'Gut gemacht':'Weiter üben';
 a.innerHTML=`<div class="top"><button class="x" data-a="home" aria-label="Zurück">×</button><div class="prog">${S.res.map(r=>`<i class="${r?'ok':'bad'}"></i>`).join('')}</div></div>
 <div class="end"><div class="ring"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="70" fill="none" stroke="var(--fill)" stroke-width="12"/><circle id="rg" cx="80" cy="80" r="70" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.9,.3,1)"/></svg><b><span>${n}<small>von ${t}</small></span></b></div>
 <h2>${msg}</h2><p>${S.daily?'Tagesrunde':S.prac?`Fehler üben · ${openWrong().length} offen`:`${MODES.find(m=>m.k===S.mode).n} · ${LV[S.lv]}${n>bOld&&rounds(S.mode,S.lv).length>1?' · neuer Bestwert':''}`}</p>
 ${gained?`<div class="gain">+${gained} Punkte · Level ${lvl(xp()).l}</div>`:''}<div class="row2"><button class="go" data-a="again">${S.daily?'Neue Runde':S.prac?'Weiter üben':'Neue Runde'}</button><button class="go sec" data-a="stats">Auswertung</button></div><button class="go sec" data-a="home">Zur Übersicht</button>
 <div class="rv">${S.list.map((q,i)=>`<div><i class="${S.res[i]?'ok':'bad'}"></i><span>${esc(q.q)}<br><small style="color:var(--muted)">${esc(q.o.find(o=>o.ok).t)}</small></span></div>`).join('')}</div></div>`;

function stats(){const a=QZR(),H=DB.hist,tot=H.reduce((s,h)=>s+h.of,0),ok=H.reduce((s,h)=>s+h.n,0),seen=Q.filter(q=>DB.q[q.id]&&DB.q[q.id].s).length;
 const mode=m=>{const L=[0,1,2].map(l=>{const R=rounds(m.k,l),of=R.reduce((s,h)=>s+h.of,0),n=R.reduce((s,h)=>s+h.n,0);return {l,R:R.length,p:pct(n,of),b:best(m.k,l),of}});
  const P=Q.filter(q=>q.mode===m.k);return `<div class="sm"><div class="hd"><b>${m.n}</b><small>${P.filter(q=>DB.q[q.id]&&DB.q[q.id].s).length} von ${P.length} Fragen gesehen</small></div>${L.map(x=>`<div class="br"><span class="lb">${LV[x.l]}<small>${x.R?`${x.R} Runde${x.R>1?'n':''} · Best ${x.b}`:'noch nicht gespielt'}</small></span><span class="bar"><i data-w="${x.p}"></i></span><span class="v">${x.of?x.p+' %':'–'}</span></div>`).join('')}</div>`};
 const T={};for(const q of Q){const d=DB.q[q.id];if(!d||!d.s)continue;const k=q.mode+'|'+(q.topic||'Allgemein');(T[k]=T[k]||{m:q.mode,t:q.topic||'Allgemein',c:0,s:0}).c+=d.c;T[k].s+=d.c+d.w}
 const weak=Object.values(T).filter(x=>x.s>=3).map(x=>Object.assign(x,{p:pct(x.c,x.s)})).filter(x=>x.p<80).sort((a,b)=>a.p-b.p).slice(0,5);
 const last=H.slice(-20);

 ${H.length?`<div class="kp"><div><b>${H.length}</b><small>Runden</small></div><div><b>${pct(ok,tot)} %</b><small>richtig</small></div><div><b>${seen}</b><small>von ${Q.length} gesehen</small></div></div>
 <h3>Verlauf</h3><div class="spark">${last.map(h=>`<i style="height:${Math.max(6,pct(h.n,h.of))}%" title="${h.n}/${h.of}"></i>`).join('')}</div>

 <h3>Abzeichen</h3><div class="bd">${BADGES.map(([k,n,f,c])=>`<div class="${f(H)?'on':''}">${BICON(c)}${n}</div>`).join('')}</div>
 <h3>Einstellungen</h3><div class="sw"><span>Töne und Vibration<small>Kurzes Signal bei jeder Antwort</small></span><button class="tg ${DB.fx?'on':''}" data-a="fx" aria-label="Töne und Vibration"></button></div>
 <button class="rs" data-a="reset">Ergebnisse zurücksetzen</button>`:'<div class="empty">Noch keine Runde gespielt. Nach jeder Runde siehst du hier deine Quote je Bereich und Stufe, deinen Verlauf und die Themen, bei denen sich Üben lohnt. Gespeichert wird nur auf diesem Gerät.</div>'}</div>`;

QZR().addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.cf){calm(b.dataset.cf);return}if(b.dataset.lv){S.lv=+b.dataset.lv;home();return}if(b.dataset.m){start(b.dataset.m);return}if(b.dataset.o!==undefined){answer(+b.dataset.o,b);return}
 const ac=b.dataset.a;if(ac==='home')home();else if(ac==='next'&&S.calm){calm();QZTOP()}else if(ac==='calm')calm('all');else if(ac==='next'){S.i++;if(S.i<S.list.length)question();else end();QZTOP()}else if(ac==='again'){if(S.prac){if(openWrong().length)practice();else home()}else if(S.daily)home();else start(S.mode)}else if(ac==='daily')daily();else if(ac==='fx'){DB.fx=!DB.fx;save();b.classList.toggle('on',!!DB.fx);if(DB.fx)fx(true)}else if(ac==='stats')stats();else if(ac==='prac')practice();else if(ac==='reset'){if(confirm('Alle Quiz-Ergebnisse auf diesem Gerät löschen?')){DB={hist:[],q:{},fx:DB.fx};save();try{for(const m of MODES)for(let l=0;l<3;l++)localStorage.removeItem('quiz-best-'+m.k+'-'+l)}catch(e){}stats()}}});
home();
