l und steht auf fast jedem Rohkaffeevertrag. Der FOB-Preis ist nicht der Preis, den Farmer erhalten.", "source": {"title": "Daily Coffee News – A Guide to FOB", "url": "https://dailycoffeenews.com/2020/05/20/more-into-coffee-than-international-shipping-heres-a-guide-to-fob-for-you"}, "img": "berg", "topic": "Handel & Preise", "st": 4}, {"id": "a2-148", "mode": "anbau", "level": 2, "type": "mc", "q": "In welcher Höhe wächst wilder Arabica in den Bergwäldern Äthiopiens?", "options": ["Etwa 200–800 m", "Etwa 800–1.200 m", "Etwa 3.000–4.000 m", "Etwa 1.600–2.800 m"], "correct": 3, "explain": "Arabica ist in äthiopischen Wäldern auf 1.600–2.800 m heimisch, mit einem Jahresmittel um 20 °C und einer Trockenzeit von drei bis vier Monaten.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "berg", "topic": "Klima & Standort", "st": 6}, {"id": "a2-149", "mode": "anbau", "level": 2, "type": "mc", "q": "Was passiert laut FAO-Handbuch mit Arabica bei Temperaturen über 30 °C?", "options": ["Die Kirschen reifen besonders aromatisch", "Die Pflanze blüht verstärkt und gleichmäßig", "Die Pflanze bildet mehr Koffein in Blättern", "Die Pflanze ist gestresst, die Fotosynthese stoppt"], "correct": 3, "explain": "Ideal sind tagsüber etwa 20–24 °C; über 30 °C ist Arabica gestresst und die Fotosynthese kommt zum Erliegen.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 1: Coffee plant & site selection", "url": "https://www.fao.org/4/ae939e/ae939e03.htm"}, "img": "sonne", "topic": "Klima & Standort", "st": 9}, {"id": "a2-150", "mode": "anbau", "level": 2, "type": "case", "q": "Was droht dieser Arabica-Parzelle während der Hitzewelle vor allem?", "case": {"title": "Fall · Blüte im Tiefland", "facts": ["Trockenzeit gut vier Monate lang", "Hitzewelle genau zur Blüte", "Arabica auf rund 900 m"]}, "options": ["Die Blüten werden doppelt so groß", "Die Kirschen reifen ohne Samen", "Die Pflanze blüht zweimal so lang", "Die Blüten werden abgeworfen"], "correct": 3, "explain": "Hohe Temperaturen in der Blüte, besonders bei langer Trockenzeit, können zum Abwurf der Blüten führen.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "bluete", "topic": "Blüte & Ernte", "st": 5}, {"id": "a2-151", "mode": "anbau", "level": 2, "type": "mc", "q": "Was lösten zwei schwere Fröste in Südbrasilien Mitte der 1990er-Jahre aus?", "options": ["Die Kaffeepreise fielen auf ein Rekordtief", "Brasilien stieg komplett auf Robusta um", "Die Kaffeepreise stiegen etwa um das Dreifache", "Die ICO verbot vorübergehend Exporte"], "correct": 2, "explain": "Laut DaMatta & Ramalho ließen zwei schwere Fröste in Südbrasilien Mitte der 1990er die Kaffeepreise ungefähr verdreifachen.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "sonne", "topic": "Klima & Standort", "st": 9}, {"id": "a2-152", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ist die optimale Jahresmitteltemperatur für Robusta?", "options": ["Etwa 22–26 °C", "Etwa 14–17 °C", "Etwa 18–20 °C", "Etwa 30–34 °C"], "correct": 0, "explain": "Robusta bevorzugt etwa 22–26 °C (andere Autoren nennen bis 30 °C), Arabica dagegen etwa 18–21 °C.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "sonne", "topic": "Klima & Standort", "st": 6}, {"id": "a2-153", "mode": "anbau", "level": 2, "type": "mc", "q": "Wann sollen Schattenbäume laut FAO-Handbuch gepflanzt werden?", "options": ["Am selben Tag wie der Kaffee", "Etwa ein Jahr vor dem Kaffee", "Etwa ein Jahr nach dem Kaffee", "Erst nach der ersten Ernte"], "correct": 1, "explain": "Schattenbäume werden ein Jahr vor dem Kaffee gepflanzt, nicht gleichzeitig oder danach – so schützen sie die jungen Kaffeepflanzen von Anfang an.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 3: Field management & planting trees", "url": "https://www.fao.org/4/ae939e/ae939e05.htm"}, "img": "sonne", "topic": "Boden & Pflege", "st": 4}, {"id": "a2-154", "mode": "anbau", "level": 2, "type": "case", "q": "Ein Farmer will einen Hang mit rund 25 % Gefälle neu bepflanzen. Wie sollte er pflanzen?", "case": {"title": "Fall · Steile Parzelle", "facts": ["Gefälle rund 25 %", "Starkregen in der Regenzeit", "Reihen sollen 2 m Abstand haben"]}, "options": ["In geraden Reihen hangabwärts", "Ohne Reihen, möglichst dicht verteilt", "Nur am unteren Drittel des Hangs", "Entlang der Höhenlinien (Konturpflanzung)"], "correct": 3, "explain": "Über 15 % Gefälle wird entlang der Höhenlinien gepflanzt; dafür markiert man die Pflanzlöcher mit einem A-Rahmen. Das untere Hangdrittel ist kälter und teils staunass.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 3: Field management & planting trees", "url": "https://www.fao.org/4/ae939e/ae939e05.htm"}, "img": "berg", "topic": "Boden & Pflege", "st": 5}, {"id": "a2-155", "mode": "anbau", "level": 2, "type": "mc", "q": "Welcher Nährstoff ist besonders für Fruchtqualität, Wasserhaushalt und Krankheitsresistenz wichtig?", "options": ["Stickstoff (N)", "Bor (B)", "Kalium (K)", "Eisen (Fe)"], "correct": 2, "explain": "Laut FAO steuert Kalium Fruchtqualität, Wasserhaushalt und Krankheitsresistenz; Stickstoff vor allem Wachstum und Fotosynthese, Bor Blüte und Fruchtansatz.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 4: Plant nutrition & fertiliser management", "url": "https://www.fao.org/4/ae939e/ae939e06.htm"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 3}, {"id": "a2-156", "mode": "anbau", "level": 2, "type": "mc", "q": "An welchem Holz bilden sich bei Arabica die Blüten?", "options": ["Nur am alten, dicken Hauptstamm", "An einjährigem, leicht verholztem Holz", "Nur an ganz frischen, grünen Trieben", "Direkt an den oberen Wurzeln"], "correct": 1, "explain": "Die weißen Blüten sitzen in kleinen Büscheln an den Knoten von einjährigem, leicht verholztem Holz.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 1: Coffee plant & site selection", "url": "https://www.fao.org/4/ae939e/ae939e03.htm"}, "img": "bluete", "topic": "Botanik", "st": 7}, {"id": "a2-157", "mode": "anbau", "level": 2, "type": "mc", "q": "Was passiert, wenn man einen waagrechten Seitenzweig (plagiotrop) am Stamm abschneidet?", "options": ["Es wachsen sofort zwei neue Seitenzweige nach", "Der Stamm stirbt oberhalb der Schnittstelle ab", "An diesem Knoten wächst kein neuer Seitenzweig", "Es bildet sich an dieser Stelle eine Blüte"], "correct": 2, "explain": "Primäre Seitenzweige regenerieren am selben Knoten nicht. Sekundäre Zweige können dagegen an den Primärzweigen nachwachsen.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 1: Coffee plant & site selection", "url": "https://www.fao.org/4/ae939e/ae939e03.htm"}, "img": "pflanze", "topic": "Botanik", "st": 9}, {"id": "a2-158", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie lange bleibt Kaffeesaatgut ohne kühle, feuchte Lagerung keimfähig?", "options": ["Etwa drei Tage", "Etwa drei Jahre", "Etwa drei Monate", "Etwa zehn Jahre"], "correct": 2, "explain": "Saatgut verliert ohne kühle, feuchte Lagerung innerhalb von etwa drei Monaten seine Keimfähigkeit; die Samenfeuchte darf nicht unter 10 % fallen.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 2: Nursery practices", "url": "https://www.fao.org/4/ae939e/ae939e04.htm"}, "img": "pflanze", "topic": "Botanik", "st": 6}, {"id": "a2-159", "mode": "anbau", "level": 2, "type": "case", "q": "Junge Bäume im zweiten Jahr setzen schon Früchte an. Was empfiehlt das FAO-Handbuch?", "case": {"title": "Fall · Junge Pflanzung", "facts": ["Bäume im zweiten Standjahr", "Erste Blüten und kleine Kirschen", "Ziel: kräftiger Einzelstamm"]}, "options": ["Die Früchte entfernen, sobald sie erscheinen", "Die Früchte ausreifen lassen und ernten", "Nur die Hälfte der Früchte stehen lassen", "Die Bäume stärker beschatten und abwarten"], "correct": 0, "explain": "In den ersten beiden Jahren werden alle Früchte entfernt, damit der junge Baum Kraft in Wachstum steckt; ab dem dritten Jahr darf er tragen.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 5: Pruning and tree management", "url": "https://www.fao.org/4/ae939e/ae939e07.htm"}, "img": "kirsche", "topic": "Boden & Pflege", "st": 10}, {"id": "a2-160", "mode": "anbau", "level": 2, "type": "case", "q": "In der Baumschule zeigen Sämlinge braune Flecken mit rotbraunem Rand. Was sind die üblichen Ursachen?", "case": {"title": "Fall · Baumschule", "facts": ["Erde ständig nass", "Beutel dicht an dicht", "Seit Wochen kaum gedüngt"]}, "options": ["Zu trockene Luft und zu viel Kalium", "Nässe, falscher Schatten, Mangel an N und K", "Zu viel Kupfer und zu kühle Nächte", "Der Kirschenkäfer im Saatgut"], "correct": 1, "explain": "Das ist Cercospora (Braunaugenflecken), die häufigste Baumschulkrankheit und ein Zeichen schlechter Pflege: nasse Erde, zu viel oder zu wenig Schatten, wenig Luft, Mangel an Stickstoff und Kalium.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 9: Pests and diseases", "url": "https://www.fao.org/4/ae939e/ae939e0b.htm"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 10}, {"id": "a2-161", "mode": "anbau", "level": 2, "type": "case", "q": "Im Saatbeet fallen ganze Flecken frisch gekeimter Sämlinge mit weichen, faulen Stängeln um. Was ist die wahrscheinlichste Ursache?", "case": {"title": "Fall · Saatbeet", "facts": ["Erde aus alten Beuteln wiederverwendet", "Täglich kräftig gegossen", "Samen dicht an dicht gesät"]}, "options": ["Kaffeerost an den Keimblättern", "Fraß durch den Kirschenkäfer", "Kaliummangel im Saatgut", "Umfallkrankheit durch Bodenpilze"], "correct": 3, "explain": "Typisch für die Umfallkrankheit (Damping-off, z. B. Pythium): begünstigt durch alte Erde, Übergießen, zu viel Schatten und zu dichte Saat. Abhilfe: frische Erde, weniger gießen, weiter säen.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 9: Pests and diseases", "url": "https://www.fao.org/4/ae939e/ae939e0b.htm"}, "img": "pflanze", "topic": "Krankheiten & Schädlinge", "st": 10}, {"id": "a2-162", "mode": "anbau", "level": 2, "type": "case", "q": "Nach einer Spritzung mit einem breit wirkenden Insektizid explodieren die Schmierläuse. Warum?", "case": {"title": "Fall · Trockenzeit", "facts": ["Breitbandspritzung vor drei Wochen", "Weiße Wachskolonien an Trieben", "Viele Ameisen am Stamm"]}, "options": ["Schmierläuse ernähren sich vom Insektizid", "Das Mittel hat den Boden zu sauer gemacht", "Schmierläuse vermehren sich nur bei Nässe", "Das Mittel hat ihre natürlichen Feinde getötet"], "correct": 3, "explain": "Schwere Schmierlaus-Ausbrüche folgen oft auf hochgiftige Organophosphat-Spritzungen, die Nützlinge wie Marienkäfer und Schlupfwespen töten; meist reicht biologische Kontrolle.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 9: Pests and diseases", "url": "https://www.fao.org/4/ae939e/ae939e0b.htm"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 5}, {"id": "a2-163", "mode": "anbau", "level": 2, "type": "case", "q": "Auf einer Fläche mit Wurzelgallen-Nematoden soll neu gepflanzt werden. Was ist eine bewährte Lösung?", "case": {"title": "Fall · Neupflanzung", "facts": ["Alte Bäume hatten gelbe Blätter", "Wurzeln mit sichtbaren Knoten (Gallen)", "Gewünscht: Arabica in guter Qualität"]}, "options": ["Arabica auf Robusta-Unterlage wie Nemaya pfropfen", "Die Pflanzen nur noch mit Kupfer besprühen", "Ausschließlich Typica-Sämlinge setzen", "Den Boden jedes Jahr umpflügen"], "correct": 0, "explain": "Auf die nematodenresistente Robusta-Unterlage Nemaya lässt sich jede Arabica-Varietät pfropfen. Laut WCR hat das Pfropfen keinen Einfluss auf die Tassenqualität.", "source": {"title": "World Coffee Research – Varietätenkatalog: Nemaya", "url": "https://varieties.worldcoffeeresearch.org/varieties/nemaya"}, "img": "pflanze", "topic": "Krankheiten & Schädlinge", "st": 10}, {"id": "a2-164", "mode": "anbau", "level": 2, "type": "case", "q": "Du kaufst Honduras HG mit Differential +20 c/lb. Der C-Preis steht bei 200 c/lb. Was kostet der Kaffee?", "case": {"title": "Fall · Einkauf", "facts": ["Herkunft Honduras, High Grown", "Differential +20 c/lb", "C-Preis bei Fixierung 200 c/lb"]}, "options": ["2,00 US-$ je Pfund", "1,80 US-$ je Pfund", "4,00 US-$ je Pfund", "2,20 US-$ je Pfund"], "correct": 3, "explain": "Preis = Börsenpreis + Differential: 200 c/lb + 20 c/lb = 220 c/lb, also 2,20 US-$/lb. Fiele der Markt auf 180, kostete derselbe Kaffee 2,00 US-$/lb.", "source": {"title": "Sucafina – The Silent Power of Differentials", "url": "https://sucafina.com/na/news/the-silent-power-of-differentials"}, "img": "berg", "topic": "Handel & Preise", "st": 9}, {"id": "a2-165", "mode": "anbau", "level": 2, "type": "case", "q": "Abwasser der Nassmühle fließt in den Bach. Was empfiehlt TechnoServe?", "case": {"title": "Fall · Nassmühle", "facts": ["Mühle direkt am Bach", "Abwasser ungeklärt eingeleitet", "Beschwerden der Nachbarn"]}, "options": ["Mit Kupfersulfat versetzen und einleiten", "In Becken mindestens 30 m vom Gewässer halten", "Nachts einleiten, wenn der Bach kühl ist", "Mit Fruchtfleisch mischen und ausbringen"], "correct": 1, "explain": "Ungeklärtes Abwasser gehört in Becken mindestens 30 m von Gewässern entfernt; ein Vetiver-Feuchtgebiet filtert es. Eingeleitet wird erst nach Prüfung gegen die Grenzwerte.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Aufbereitung", "st": 10}, {"id": "a2-166", "mode": "anbau", "level": 2, "type": "mc", "q": "Warum lagern manche Produzenten Rohkaffee bewusst als „Aged Coffee“?", "options": ["Für mehr Frische, Säure und florale Noten", "Um den Koffeingehalt auf null zu senken", "Weil der Kaffee dadurch schneller röstet", "Für Erdigkeit, Körper und sehr wenig Säure"], "correct": 3, "explain": "Gealterter Kaffee ist nicht alter Kaffee: Er hat viel Körper, sehr wenig Säure und oft wilde, erdige Noten – gefragt etwa für Espresso. Gealtert wird z. B. in Sumatra bis zu 2–3 Jahre.", "source": {"title": "Sweet Maria's Coffee Library – Glossar: Aged Coffee", "url": "https://library.sweetmarias.com/glossary/aged-coffee/"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 4}, {"id": "a2-167", "mode": "anbau", "level": 2, "type": "mc", "q": "Welchen Vorteil hat Honey gegenüber Natural laut Sprudge?", "options": ["Deutlich kürzere Erntezeit", "Höherer Koffeingehalt", "Kein Pergament mehr nötig", "Weniger anfällig für Schimmel"], "correct": 3, "explain": "Honey verzeiht beim Fermentieren mehr und ist weniger schimmelanfällig als Natural. Je nach Stufe schmeckt er eher nach Washed oder eher nach Natural.", "source": {"title": "Sprudge – What Is Honey Processed Coffee?", "url": "https://sprudge.com/what-is-honey-processed-coffee-184876.html"}, "img": "trocknung", "topic": "Aufbereitung", "st": 3}, {"id": "a2-168", "mode": "anbau", "level": 2, "type": "mc", "q": "Warum ist Wet Hulling für Kleinbauern in Sumatra praktisch?", "options": ["Sie brauchen dafür keine Erntehelfer", "Sie verkaufen ihn früh und noch feucht", "Sie sparen sich das Entpulpen völlig", "Sie können ihn jahrelang lagern"], "correct": 1, "explain": "Kleinbauern verkaufen entpulpten, noch sehr feuchten Kaffee an Sammler oder Annahmestellen – das gibt Flexibilität in abgelegenen Regionen mit feuchtem Klima.", "source": {"title": "Cafe Imports – Wet-Hulled (Giling Basah)", "url": "https://www.cafeimports.com/europe/blog/?p=37563"}, "img": "kirsche", "topic": "Aufbereitung", "st": 4}, {"id": "a3-101", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie alt ist Coffea arabica laut der Genomstudie von 2024 (Nature Genetics) ungefähr?", "options": ["Rund 10.000 Jahre", "Rund 610.000 Jahre oder älter", "Rund 60.000 Jahre", "Rund 6 Millionen Jahre"], "correct": 1, "explain": "Die Studie datiert die natürliche Kreuzung von C. canephora und C. eugenioides in äthiopischen Wäldern auf über 600.000 Jahre, wahrscheinlich 610.000 bis 1 Mio. Jahre.", "source": {"title": "University at Buffalo – Newly sequenced genome reveals coffee’s prehistoric origin story (2024, Nature Genetics)", "url": "https://www.buffalo.edu/news/releases/2024/04/newly-sequenced-genome-reveals-coffees-prehistoric-origin-story.html"}, "img": "pflanze", "topic": "Botanik", "st": 7}, {"id": "a3-102", "mode": "anbau", "level": 3, "type": "mc", "q": "Woher stammen laut Genomstudie 2024 die Vorfahren der kultivierten Arabica-Linien?", "options": ["Östlich des Grabenbruchs, nahe Bab al-Mandab", "Westlich des Grabenbruchs, aus den Kaffa-Wäldern", "Aus dem Kongobecken in Zentralafrika", "Aus dem Hochland von Madagaskar"], "correct": 0, "explain": "Wilde Arabica stammt von der Westseite des Großen Grabenbruchs, kultivierte Linien von der Ostseite nahe der Meerenge Bab al-Mandab – der Weg in den Jemen.", "source": {"title": "University at Buffalo – Newly sequenced genome reveals coffee’s prehistoric origin story (2024, Nature Genetics)", "url": "https://www.buffalo.edu/news/releases/2024/04/newly-sequenced-genome-reveals-coffees-prehistoric-origin-story.html"}, "img": "pflanze", "topic": "Botanik", "st": 9}, {"id": "a3-103", "mode": "anbau", "level": 3, "type": "mc", "q": "Zu welchen genetischen Gruppen gehören SL28 und SL34 nach aktuellen DNA-Tests?", "options": ["SL28 zu Typica, SL34 zu Bourbon", "Beide zu den Catimoren", "SL28 zu Bourbon, SL34 zu Typica", "Beide zu äthiopischen Landrassen"], "correct": 2, "explain": "SL28 wurde aus „Tanganyika Drought Resistant“ selektiert und ist Bourbon-verwandt. SL34 galt als „French Mission“-Abkömmling, gehört genetisch aber zur Typica-Gruppe.", "source": {"title": "World Coffee Research – Varietätenkatalog: SL34", "url": "https://varieties.worldcoffeeresearch.org/varieties/sl34"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 3}, {"id": "a3-104", "mode": "anbau", "level": 3, "type": "mc", "q": "Was ergab das DNA-Fingerprinting bei der Varietät „Java“?", "options": ["Sie ist eine Typica-Mutation von der Insel Java", "Sie ist eine Kreuzung mit Robusta aus Timor", "Sie ist eine äthiopische Landrasse, keine Typica", "Sie ist eine Bourbon-Mutation aus Brasilien"], "correct": 2, "explain": "Java galt lange als Typica-Selektion. Marker zeigen aber, dass sie aus der äthiopischen Landrassen-Population „Abysinia“ stammt; die Niederländer brachten sie im 19. Jh. nach Java.", "source": {"title": "World Coffee Research – Varietätenkatalog: Java", "url": "https://varieties.worldcoffeeresearch.org/varieties/java"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 4}, {"id": "a3-105", "mode": "anbau", "level": 3, "type": "mc", "q": "Was bedeutet „introgressiert“ bei Varietäten im WCR-Katalog?", "options": ["Arabica aus reiner Selbstbestäubung einer Linie", "Arabica mit eingekreuztem Erbgut einer anderen Art", "Arabica, die nur über Stecklinge vermehrt wird", "Arabica, die im Labor gentechnisch verändert ist"], "correct": 1, "explain": "Introgressierte Varietäten tragen Gene einer anderen Art, meist Robusta über den Timor-Hybrid (Catimore, Sarchimore). Sie bringen Resistenzen, galten aber traditionell als schwächer in der Tasse.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "blatt", "topic": "Arten & Sorten", "st": 9}, {"id": "a3-106", "mode": "anbau", "level": 3, "type": "mc", "q": "Warum erwartet WCR, dass die meisten rostresistenten Varietäten ihre Resistenz mittelfristig verlieren?", "options": ["Sie werden fast alle nur über Samen vermehrt", "Sie werden fast alle in voller Sonne gepflanzt", "Sie haben fast alle den Timor-Hybrid als Elternteil", "Sie stammen fast alle aus dem Jemen"], "correct": 2, "explain": "Weil die meisten resistenten Sorten ihre Resistenz vom Timor-Hybrid haben, kann ein Rostrassen-Durchbruch viele zugleich treffen – wie schon bei Lempira (Honduras) und Costa Rica 95.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "blatt", "topic": "Arten & Sorten", "st": 5}, {"id": "a3-107", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche dieser Varietäten gehört zur Gruppe der Sarchimore (Villa Sarchi × Timor-Hybrid)?", "options": ["Costa Rica 95", "Castillo", "Obatã Red", "Ruiru 11"], "correct": 2, "explain": "Obatã Red stammt aus Timor-Hybrid 832/2 × Villa Sarchi CIFC 971/10 (IAC, Brasilien, 2000). Costa Rica 95 ist ein Catimor (× Caturra), Castillo geht auf Caturra × Timor-Hybrid zurück, Ruiru 11 ist eine F1-Hybride.", "source": {"title": "World Coffee Research – Varietätenkatalog: Obatã Red", "url": "https://varieties.worldcoffeeresearch.org/varieties/obata-red"}, "img": "blatt", "topic": "Arten & Sorten", "st": 6}, {"id": "a3-108", "mode": "anbau", "level": 3, "type": "mc", "q": "Was ist laut Sweet Maria's ein typisches Problem von Catimoren in der Praxis?", "options": ["Sie tragen sich in 5–10 Jahren leicht „aus“", "Sie tragen erst nach 10–12 Jahren", "Sie wachsen nur oberhalb von 2.000 m", "Sie bilden fast nur Peaberries aus"], "correct": 0, "explain": "Catimore sind sehr ertragreich, neigen aber zu Überbehang, brauchen viel Dünger und können sich in 5–10 Jahren erschöpfen.", "source": {"title": "Sweet Maria's Coffee Library – Glossar: Catimor", "url": "https://library.sweetmarias.com/glossary/catimor/"}, "img": "blatt", "topic": "Arten & Sorten", "st": 4}, {"id": "a3-109", "mode": "anbau", "level": 3, "type": "mc", "q": "Für welche Standorte empfiehlt WCR die Catimor-Varietät Costa Rica 95 besonders?", "options": ["Höchste Lagen mit starkem Wind", "Kühle Lagen mit Frostgefahr", "Warme Lagen und saure Böden", "Kalkreiche Böden mit hohem pH"], "correct": 2, "explain": "Costa Rica 95 gilt als ertragreich und angepasst an die wärmsten Zonen und saure Böden, auch mit viel Aluminium. Gegen Rost ist sie in Costa Rica inzwischen anfällig.", "source": {"title": "World Coffee Research – Varietätenkatalog: Costa Rica 95", "url": "https://varieties.worldcoffeeresearch.org/varieties/costa-rica-95"}, "img": "sonne", "topic": "Arten & Sorten", "st": 7}, {"id": "a3-110", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie wird die F1-Hybride Ruiru 11 erzeugt?", "options": ["Mutterpflanzen sind männlich steril", "Sie wird aus eigenem Saatgut gezogen", "Mutterpflanzen werden von Hand bestäubt", "Sie wird im Labor aus Gewebe geklont"], "correct": 2, "explain": "Catimor-Mutterpflanzen werden von Hand mit Pollen der männlichen Elternlinie bestäubt; das begrenzt die Saatgutmenge. Starmaya löst das Problem über männliche Sterilität.", "source": {"title": "World Coffee Research – Varietätenkatalog: Ruiru 11", "url": "https://varieties.worldcoffeeresearch.org/varieties/ruiru-11"}, "img": "blatt", "topic": "Arten & Sorten", "st": 3}, {"id": "a3-111", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Eltern brachten Ruiru 11 vor allem die Resistenz gegen Coffee Berry Disease?", "options": ["SL28, SL34 und Bourbon", "Rume Sudan, Timor-Hybrid-Linien und K7", "Typica, Geisha und Java", "Caturra, Pacas und Villa Sarchi"], "correct": 1, "explain": "Die männliche Elternlinie ist eine komplexe Mehrfachkreuzung: CBD-Resistenz stammt aus Rume Sudan, Timor-Hybrid-Linien und K7, die Tassenqualität aus N39, SL28, SL34 und Bourbon.", "source": {"title": "World Coffee Research – Varietätenkatalog: Ruiru 11", "url": "https://varieties.worldcoffeeresearch.org/varieties/ruiru-11"}, "img": "kirsche", "topic": "Arten & Sorten", "st": 10}, {"id": "a3-112", "mode": "anbau", "level": 3, "type": "mc", "q": "Was unterscheidet die kenianische Varietät Batian (2010) vor allem von Ruiru 11?", "options": ["Batian ist eine F1, Ruiru 11 nicht", "Batian ist anfällig für CBD", "Batian stammt aus reinem SL28", "Batian wächst hoch, Ruiru 11 kompakt"], "correct": 3, "explain": "Batian ist eine hochwüchsige, CBD-resistente Kompositsorte aus F5-Einzelbaumselektionen; Ruiru 11 ist eine kompakte F1-Hybride. Hoher Wuchs und Resistenz machen Batian für Kleinbauern attraktiv.", "source": {"title": "World Coffee Research – Varietätenkatalog: Batian", "url": "https://varieties.worldcoffeeresearch.org/varieties/batian"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 8}, {"id": "a3-113", "mode": "anbau", "level": 3, "type": "mc", "q": "Warum kann Starmaya als F1-Hybride über Samen vermehrt werden?", "options": ["Sie ist eine reine Selbstbestäuberin", "Ihre Mutterlinie ist männlich steril", "Sie bildet Samen ohne Befruchtung", "Sie wird nur mit Robusta gekreuzt"], "correct": 1, "explain": "Starmaya entsteht aus Marsellesa × einem männlich sterilen äthiopisch-sudanesischen Mutanten. Weil die sterile Pflanze keinen eigenen Pollen bildet, ist ihr Saatgut zwangsläufig hybrid.", "source": {"title": "World Coffee Research – Varietätenkatalog: Starmaya", "url": "https://varieties.worldcoffeeresearch.org/varieties/starmaya"}, "img": "blatt", "topic": "Arten & Sorten", "st": 3}, {"id": "a3-114", "mode": "anbau", "level": 3, "type": "mc", "q": "Aus welchen Eltern stammt die F1-Hybride Centroamericano?", "options": ["Caturra × Timor-Hybrid 832/1", "SL28 × Geisha T2722", "T5296 × Rume Sudan", "Mundo Novo × Caturra"], "correct": 2, "explain": "Centroamericano (H1) kreuzt den rostresistenten Sarchimor T5296 mit der Landrasse Rume Sudan; Züchter waren CIRAD, PROMECAFE und CATIE, Freigabe 2010.", "source": {"title": "World Coffee Research – Varietätenkatalog: Centroamericano", "url": "https://varieties.worldcoffeeresearch.org/varieties/centroamericano"}, "img": "blatt", "topic": "Arten & Sorten", "st": 6}, {"id": "a3-115", "mode": "anbau", "level": 3, "type": "case", "q": "Du planst Centroamericano im Agroforstsystem. Worauf ist laut WCR bei der Pflege besonders zu achten?", "case": {"title": "Fall · Sortenwahl", "facts": ["Kleinbauer, Agroforstsystem", "Ziel: Rostresistenz und mehr Ertrag", "Setzlinge aus zertifizierter Baumschule"]}, "options": ["Wurzeln gezielt ernähren, Stickstoffüberschuss meiden", "Gar nicht düngen, die Hybride ist genügsam", "Ohne Schatten pflanzen, sonst fällt der Ertrag", "Jedes Jahr auf Kniehöhe zurückschneiden"], "correct": 0, "explain": "Centroamericano bringt 22–47 % mehr Ertrag als Standardsorten und ist rostresistent, hat aber einen sehr hohen Nährstoffbedarf; die Wurzeln müssen gut ernährt werden, zu viel Stickstoff ist zu vermeiden.", "source": {"title": "World Coffee Research – Varietätenkatalog: Centroamericano", "url": "https://varieties.worldcoffeeresearch.org/varieties/centroamericano"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 10}, {"id": "a3-116", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Nematoden-Eigenschaft hat die honduranische Varietät Parainema?", "options": ["Resistent gegen alle Nematoden einschließlich Pratylenchus", "Hoch anfällig für alle Nematoden, aber rostresistent", "Resistent gegen einige Meloidogyne, nicht gegen Pratylenchus", "Nematodenresistent nur auf Robusta-Unterlage"], "correct": 2, "explain": "Parainema (IHCAFE, 2004, Sarchimor aus T5296) ist hoch rostresistent und resistent gegen einige Meloidogyne-Arten, aber nicht gegen Pratylenchus.", "source": {"title": "World Coffee Research – Varietätenkatalog: Parainema", "url": "https://varieties.worldcoffeeresearch.org/varieties/parainema"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 9}, {"id": "a3-117", "mode": "anbau", "level": 3, "type": "mc", "q": "Warum gibt WCR die optimale Anbauhöhe einer Varietät je nach Breitengrad an?", "options": ["Mit Abstand zum Äquator steigt die nötige Höhe", "Mit Abstand zum Äquator sinkt die nötige Höhe", "Weil die Luft am Äquator weniger Sauerstoff hat", "Weil die Tageslänge die Röstung beeinflusst"], "correct": 1, "explain": "Für „hohe“ Lagen nennt WCR bei Typica etwa über 1.600 m nahe dem Äquator, über 1.300 m bei 5–15° und über 1.000 m jenseits von 15° Breite – weiter vom Äquator ist es in gleicher Höhe kühler.", "source": {"title": "World Coffee Research – Varietätenkatalog: Typica", "url": "https://varieties.worldcoffeeresearch.org/varieties/typica"}, "img": "berg", "topic": "Klima & Standort", "st": 9}, {"id": "a3-118", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie wird Excelsa nach einer neuen Genomstudie botanisch eingeordnet?", "options": ["Als eigene Art, Coffea dewevrei", "Als Varietät von Coffea arabica", "Als Hybride aus Liberica × Robusta", "Als Unterart von Coffea canephora"], "correct": 0, "explain": "Lange galt Excelsa als C. liberica var. dewevrei. Die Studie stellte sie als eigene Art C. dewevrei wieder her; zum Liberica-Komplex gehört zudem C. klainei.", "source": {"title": "SCA 25 Magazine – Beyond Arabica and Robusta: Liberica and Excelsa", "url": "https://sca.coffee/sca-news/25/issue-25-insight-liberica-excelsa"}, "img": "kirsche", "topic": "Arten & Sorten", "st": 3}, {"id": "a3-119", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Krankheit vernichtete ab den 1940er-Jahren die Excelsa-Plantagen der Zentralafrikanischen Republik?", "options": ["Der Kaffeerost (Hemileia vastatrix)", "Die Coffee Berry Disease", "Die Kaffeewelke (Coffee Wilt Disease)", "Der Wurzelgallennematode"], "correct": 2, "explain": "Die Excelsa-Plantagen mit 10.000–20.000 ha wurden ab den frühen 1940ern durch die Kaffeewelke verwüstet; auch die Liberica-Produktion war Anfang des 20. Jh. eingebrochen.", "source": {"title": "SCA 25 Magazine – Beyond Arabica and Robusta: Liberica and Excelsa", "url": "https://sca.coffee/sca-news/25/issue-25-insight-liberica-excelsa"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 8}, {"id": "a3-120", "mode": "anbau", "level": 3, "type": "mc", "q": "Wo und wann wurde Coffea stenophylla nach über 60 Jahren wieder in der Wildnis gefunden?", "options": ["2005 in Äthiopien", "2018 in Sierra Leone", "1999 in Madagaskar", "2021 auf La Réunion"], "correct": 1, "explain": "Stenophylla war seit 1954 in der Wildnis nicht mehr gesehen worden. Im Dezember 2018 fanden Aaron Davis und Jeremy Haggar in Sierra Leone eine gesunde Population; die Art wächst unter 400 m.", "source": {"title": "CIRAD – Coffea stenophylla could help futureproof coffee (Davis et al. 2021, Nature Plants)", "url": "https://www.cirad.fr/en/press-area/press-releases/2021/coffea-stenophylla-coffee-climate-change"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 1}, {"id": "a3-121", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Eigenschaften bringt Conilon in natürliche Kreuzungen mit Robusta in Rondônia ein?", "options": ["Größere Früchte und späte Reife", "Mehr Krankheitsresistenz und Blattgröße", "Niedrigeren Wuchs und Trockenheitstoleranz", "Selbstfruchtbarkeit und Frosthärte"], "correct": 2, "explain": "Conilon wächst strauchig, blüht früh und verträgt Trockenheit; Robusta wächst aufrecht mit größeren Früchten und Blättern, reift spät und ist resistenter.", "source": {"title": "Embrapa – Amazonian Robustas (Robustas Amazônicos)", "url": "https://www.alice.cnptia.embrapa.br/alice/bitstream/doc/1160418/1/AMAZON-ROBUSTAS.pdf"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 9}, {"id": "a3-122", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Herkunft erhielt 2021 als Robusta eine geschützte Ursprungsbezeichnung (DO) in Brasilien?", "options": ["Cerrado Mineiro", "Matas de Rondônia", "Alta Mogiana", "Sul de Minas"], "correct": 1, "explain": "Im Juni 2021 erhielten C.-canephora-Kaffees aus 15 Gemeinden Rondônias als „Matas de Rondônia“ die DO; die übrigen Regionen sind Arabica-Gebiete in Minas Gerais und São Paulo.", "source": {"title": "Embrapa – Amazonian Robustas (Robustas Amazônicos)", "url": "https://www.alice.cnptia.embrapa.br/alice/bitstream/doc/1160418/1/AMAZON-ROBUSTAS.pdf"}, "img": "berg", "topic": "Herkunft", "st": 6}, {"id": "a3-123", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie gelangt der Kaffeerostpilz ins Blatt?", "options": ["Nur über Spaltöffnungen der Blattunterseite", "Über Wunden an der Blattoberseite", "Über die Wurzeln mit dem Bodenwasser", "Über Fraßlöcher des Kirschenkäfers"], "correct": 0, "explain": "Rost infiziert ausschließlich über die Stomata der Blattunterseite – deshalb sitzen dort auch die orangen Sporenlager.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 3}, {"id": "a3-124", "mode": "anbau", "level": 3, "type": "mc", "q": "In welchem Temperaturbereich infiziert der Kaffeerost, und wo liegt das Optimum?", "options": ["Etwa 15–28 °C, Optimum um 22 °C", "Etwa 5–15 °C, Optimum um 10 °C", "Etwa 25–40 °C, Optimum um 33 °C", "Etwa 0–20 °C, Optimum um 12 °C"], "correct": 0, "explain": "Infektion ist zwischen etwa 15 °C (Minimum) und 28 °C (Maximum) möglich, optimal bei 22 °C – zusätzlich braucht der Pilz 24–48 Stunden freies Wasser.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 8}, {"id": "a3-125", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie lange dauert es nach einer Rostinfektion etwa, bis neue Sporenlager entstehen?", "options": ["Etwa 10–14 Tage", "Etwa 1–2 Tage", "Etwa 2–3 Monate", "Etwa ein Jahr"], "correct": 0, "explain": "Die Latenzzeit liegt bei 10–14 Tagen; eine Läsion bildet danach über 3–5 Monate vier bis sechs Sporenschübe mit rund 300.000 Sporen.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 6}, {"id": "a3-126", "mode": "anbau", "level": 3, "type": "case", "q": "Auf dieser Farm nimmt der Rostbefall Jahr für Jahr zu. Was trägt laut APS dazu bei?", "case": {"title": "Fall · Düngeplan", "facts": ["Seit Jahren viel Kalidünger", "Kaum Stickstoff und Phosphor", "Dichter Bestand, kaum Rückschnitt"]}, "options": ["Der Mangel an Kalium bei viel N und P", "Der Kaliumüberschuss bei wenig N und P", "Die Düngung spielt beim Rost keine Rolle", "Die fehlende Kupferdüngung im Boden"], "correct": 1, "explain": "Stickstoff und Phosphor verringern die Anfälligkeit, ein Kaliumüberschuss erhöht sie. Rückschnitt, Unkrautkontrolle und weitere Abstände verbessern zudem die Luftzirkulation.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 5}, {"id": "a3-127", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie viele Rassen von Hemileia vastatrix und Resistenzgene kennt man laut APS?", "options": ["Zwei Rassen, ein einziges Resistenzgen", "Rund 10 Rassen, 40 Resistenzgene", "Über 40 Rassen, neun Resistenzgene", "Über 400 Rassen, keine Resistenzgene"], "correct": 2, "explain": "Es wurden mehr als 40 Rostrassen und neun Resistenzgene beschrieben – Letztere stammen überwiegend aus C. canephora und C. liberica.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 10}, {"id": "a3-128", "mode": "anbau", "level": 3, "type": "case", "q": "Was war laut Avelino ein Haupttreiber der Rostepidemie 2012–13, etwa in Nicaragua?", "case": {"title": "Fall · Mittelamerika 2012", "facts": ["Niedrige Kaffeepreise", "Fungizide bekannt, aber teuer", "Mehr Regen im ersten Halbjahr"]}, "options": ["Niedrige Preise führten zu vernachlässigter Pflege", "Ein neuer, eingeschleppter Pilz aus Asien", "Ein plötzlicher Frost in allen Höhenlagen", "Eine Ernte, die komplett maschinell erfolgte"], "correct": 0, "explain": "Avelino spricht von „ökonomischen Epidemien“: Farmer wussten, wie man Rost bekämpft, konnten sich die Maßnahmen bei niedrigen Preisen aber nicht leisten. Hinzu kamen ein geringer Tagestemperaturbereich und mehr Regen.", "source": {"title": "Avelino (2016), CIRAD Agritrop – The coffee rust crisis in Central America", "url": "https://agritrop.cirad.fr/580046"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 10}, {"id": "a3-129", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie paaren sich Kaffeekirschenkäfer überwiegend?", "options": ["Paarung findet im Flug über dem Bestand statt", "Paarung erfolgt im Boden unter dem Baum", "Weibchen vermehren sich ohne Männchen", "Geschwister paaren sich in der Kirsche"], "correct": 3, "explain": "Fast alle Paarungen finden zwischen Geschwistern in der Frucht statt; die Männchen sterben dort, befruchtete Weibchen fliegen zu neuen Kirschen. Das Geschlechterverhältnis ist stark weiblich.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 3}, {"id": "a3-130", "mode": "anbau", "level": 3, "type": "mc", "q": "Was hilft dem Kaffeekirschenkäfer, das Koffein im Samen zu vertragen?", "options": ["Darmbakterien der Gattung Pseudomonas", "Ein dicker Panzer aus Chitin", "Eine Symbiose mit dem Rostpilz", "Eine Diät nur aus Fruchtfleisch"], "correct": 0, "explain": "Der Käfer ist das einzige bekannte Insekt, das seinen ganzen Lebenszyklus im Kaffeesamen durchläuft – vermutlich dank Pseudomonas-Bakterien im Darm, die Koffein abbauen.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 7}, {"id": "a3-131", "mode": "anbau", "level": 3, "type": "mc", "q": "Ab wann nach der Blüte besiedeln Kaffeekirschenkäfer die Früchte bevorzugt?", "options": ["Nach etwa 10–20 Tagen", "Nach etwa 300–350 Tagen", "Nach etwa 120–150 Tagen", "Erst nach der Ernte am Boden"], "correct": 2, "explain": "Weibchen besiedeln die Früchte etwa 120–150 Tage nach der Blüte, wenn der Samen rund 20 % Trockenmasse erreicht hat.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 7}, {"id": "a3-132", "mode": "anbau", "level": 3, "type": "case", "q": "Was erwarten Modelle bei einer Erwärmung um 1–2 °C für den Kaffeekirschenkäfer?", "case": {"title": "Fall · Äthiopisches Hochland", "facts": ["Erwärmung 1979–2005 um 0,39–0,65 °C", "Bisher wenig Befall in hohen Lagen", "Planung für die nächsten 20 Jahre"]}, "options": ["Weniger Generationen pro Jahr", "Mehr Generationen pro Jahr", "Keine Wirkung auf den Käfer", "Ein Aussterben in den Tropen"], "correct": 1, "explain": "Je nach Klima bildet der Käfer 2 bis 13 Generationen pro Jahr. Schon 1–2 °C mehr verkürzen die Entwicklung; über 2 °C verschiebt sich auch sein Höhen- und Breitenbereich.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 4}, {"id": "a3-133", "mode": "anbau", "level": 3, "type": "case", "q": "Im Lager mit Pergament (rund 15 % Feuchte) vermehren sich Kirschenkäfer weiter. Was stoppt das?", "case": {"title": "Fall · Pergamentlager", "facts": ["Pergament nur auf rund 15 % getrocknet", "Lebende Käfer in einzelnen Bohnen", "Export erst in zwei Monaten"]}, "options": ["Säcke dicht stapeln und warm lagern", "Pergament kurz in Wasser einweichen", "Sorgfältig auf etwa 12 % Feuchte trocknen", "Den Kaffee mit Kupfer bestäuben"], "correct": 2, "explain": "Laut FAO-Handbuch stoppt sorgfältiges Trocknen von Kirschen oder Pergament auf 12 % Feuchte die Vermehrung des Käfers.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 9: Pests and diseases", "url": "https://www.fao.org/4/ae939e/ae939e0b.htm"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 5}, {"id": "a3-134", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie viele Kirschen kann ein Blattpaar laut FAO-Handbuch etwa bis zur Reife versorgen?", "options": ["Etwa 1–2 Kirschen", "Etwa 15–20 Kirschen", "Etwa 50 Kirschen", "Etwa 5–6 Kirschen"], "correct": 3, "explain": "Ein Blattpaar trägt etwa fünf bis sechs Kirschen. Hängen zu viele Früchte an zu wenig Laub, folgen Blattfall, Wurzel- und Zweigsterben; kompakte Catimore sind besonders gefährdet.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 9: Pests and diseases", "url": "https://www.fao.org/4/ae939e/ae939e0b.htm"}, "img": "blatt", "topic": "Boden & Pflege", "st": 6}, {"id": "a3-135", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie unterscheidet sich der Saccharosegehalt reifer Bohnen von Arabica und Robusta?", "options": ["Robusta enthält deutlich mehr Saccharose", "Arabica enthält deutlich mehr Saccharose", "Beide enthalten praktisch gleich viel", "Beide enthalten gar keine Saccharose"], "correct": 1, "explain": "De Castro & Marraccini nennen rund 9,4 % Saccharose (Trockenmasse) bei Arabica gegenüber rund 6 % bei Robusta; ältere Werte liegen für Robusta noch niedriger.", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Botanik", "st": 4}, {"id": "a3-136", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie hoch ist der Ölgehalt im Rohkaffee von Arabica im Vergleich zu Robusta etwa?", "options": ["Arabica rund 5 %, Robusta rund 15 %", "Beide rund 1 % der Trockenmasse", "Arabica rund 15 %, Robusta rund 10 %", "Arabica rund 40 %, Robusta rund 30 %"], "correct": 2, "explain": "Öl macht bei Arabica etwa 15 %, bei Robusta etwa 10 % der Trockenmasse aus; Cafestol und Kahweol stellen zusammen rund 10 % des Kaffeeöls.", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Botanik", "st": 4}, {"id": "a3-137", "mode": "anbau", "level": 3, "type": "mc", "q": "Womit lässt sich die Reife von Kaffeekirschen synchronisieren, wenn 10–20 % gefärbt sind?", "options": ["Mit Kupfer, das die Haut verfärbt", "Mit Ethephon, das Ethylen freisetzt", "Mit Harnstoff über die Blätter", "Mit Kalk, der den pH anhebt"], "correct": 1, "explain": "Ethephon setzt Ethylen frei; die Kaffeefrucht zeigt in der Endphase ein klimakterisches Muster, bei dem Ethylenbildung und Reife zusammenfallen.", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 8}, {"id": "a3-138", "mode": "anbau", "level": 3, "type": "mc", "q": "Bei welcher Temperatur keimt Arabica-Saatgut am besten, und wie lange dauert es dann?", "options": ["Bei 17 °C, etwa 3 Wochen", "Bei 30–32 °C, etwa 3 Wochen", "Bei 35–40 °C, etwa 3 Tage", "Bei 10–12 °C, etwa 3 Monate"], "correct": 1, "explain": "Optimal sind 30–32 °C mit etwa drei Wochen Keimdauer; bei 17 °C dauert es rund drei Monate, über 35 °C wird die Keimung gehemmt.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "pflanze", "topic": "Botanik", "st": 7}, {"id": "a3-139", "mode": "anbau", "level": 3, "type": "mc", "q": "Ab welchen Temperaturen bekommt Robusta laut DaMatta & Ramalho Probleme?", "options": ["Erst unter etwa −5 °C", "Erst unter etwa 0 °C", "Erst bei etwa 18–20 °C", "Schon bei etwa 8–10 °C"], "correct": 3, "explain": "Robusta übersteht gelegentlich unter 7 °C, Probleme beginnen aber bei 8–10 °C; längere Phasen um 15 °C schaden, unter 5–6 °C werden Blätter und Früchte stark geschädigt.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "sonne", "topic": "Klima & Standort", "st": 7}, {"id": "a3-140", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Zonen verlieren laut Bunn et al. (2015) bis 2050 am meisten Arabica-Eignung?", "options": ["Heiße, trockene Zonen mit langer Trockenzeit", "Äquatornahe Zonen mit konstanten Temperaturen", "Kühle, feuchte Hochlagen in Ostafrika", "Hochlagen in Kolumbien und Ecuador"], "correct": 0, "explain": "In heiß-trockenen Zonen, etwa in Teilen Brasiliens, Indiens und Mittelamerikas, werden fast 80 % der Flächen ungeeignet. Äquatornahe, kühle Zonen verlieren am wenigsten, aber immer noch rund ein Drittel.", "source": {"title": "World Coffee Research – Climate change: Pinpointing the world’s most vulnerable coffee zones (Bunn et al. 2015)", "url": "https://worldcoffeeresearch.org/news/2015/climate-change-pinpointing-the-worlds-most-vulnerable-coffee-zones"}, "img": "sonne", "topic": "Klima & Standort", "st": 9}, {"id": "a3-141", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Mikroorganismen begünstigt eine sauerstoffarme (anaerobe) Fermentation laut Coffee Review?", "options": ["Hefen mit alkoholischen Noten", "Schimmelpilze mit erdigen Noten", "Algen mit grasigen Noten", "Bakterien mit milchsauren Noten"], "correct": 3, "explain": "Sauerstoffreiche Fermentation fördert Hefen (fruchtige, alkoholartige Noten), sauerstoffarme unterdrückt sie und fördert Bakterien – mit Joghurt-, Käse- oder Sauerkrautnoten.", "source": {"title": "Coffee Review – Anaerobically Processed Coffees", "url": "https://www.coffeereview.com/anaerobically-processed-coffees/"}, "img": "trocknung", "topic": "Aufbereitung", "st": 4}, {"id": "a3-142", "mode": "anbau", "level": 3, "type": "mc", "q": "Was bedeutet „ASD“ bei anaerob fermentierten Naturals?", "options": ["Trocknung in Säcken direkt auf dem Boden", "Trocknung ausschließlich im Trommeltrockner", "Fermentation unter Zugabe von Fruchtsaft", "Bewusst verlangsamte Trocknung über 60 Tage"], "correct": 3, "explain": "ASD steht für „anaerobic slow-dry“: Nach der anaeroben Phase wird die Trocknung bewusst auf 60 Tage oder mehr gestreckt.", "source": {"title": "Coffee Review – Anaerobically Processed Coffees", "url": "https://www.coffeereview.com/anaerobically-processed-coffees/"}, "img": "trocknung", "topic": "Aufbereitung", "st": 4}, {"id": "a3-143", "mode": "anbau", "level": 3, "type": "mc", "q": "Bei welcher Feuchte wird beim Giling Basah (Wet Hulling) das Pergament entfernt?", "options": ["Bei etwa 10–12 %", "Bei etwa 18–20 %", "Bei etwa 60–70 %", "Bei etwa 35–50 %"], "correct": 3, "explain": "Beim Wet Hulling wird bei 35–50 % Feuchte geschält statt wie üblich bei 10–12 %. Danach trocknet der Rohkaffee etwa 12–15 Tage auf Planen bis rund 11 % Exportfeuchte.", "source": {"title": "Cafe Imports – Wet-Hulled (Giling Basah)", "url": "https://www.cafeimports.com/europe/blog/?p=37563"}, "img": "trocknung", "topic": "Aufbereitung", "st": 2}, {"id": "a3-144", "mode": "anbau", "level": 3, "type": "mc", "q": "In welchem Temperaturbereich sollte die Masse im Fermentationstank laut TechnoServe liegen?", "options": ["Etwa 20–25 °C", "Etwa 10–15 °C", "Etwa 30–35 °C", "Etwa 40–45 °C"], "correct": 0, "explain": "TechnoServe empfiehlt 20–25 °C; über 40 °C beginnen die Mikroorganismen abzusterben.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 6}, {"id": "a3-145", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie verändert sich der pH-Wert typischerweise während der Fermentation?", "options": ["Er sinkt von etwa 6 auf etwa 4", "Er steigt von etwa 4 auf etwa 8", "Er bleibt konstant bei etwa 7", "Er sinkt von etwa 9 auf etwa 8"], "correct": 0, "explain": "Die Fermentation startet meist bei pH 5–6,5 und fällt um etwa 2–2,5 Punkte. TechnoServe rät, den pH nur zusammen mit Gefühl und Geruch zu nutzen.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 3}, {"id": "a3-146", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie stark sinkt die Feuchte des Pergaments beim „Skin Drying“ direkt nach dem Waschen?", "options": ["Von etwa 30 % auf etwa 12 %", "Von etwa 60 % auf etwa 45 %", "Von etwa 90 % auf etwa 20 %", "Von etwa 45 % auf etwa 40 %"], "correct": 1, "explain": "Auf den Vortrocknungstischen (höchstens etwa 5 cm Schicht) sinkt die Feuchte von rund 60 % auf 45 %; hier werden auch weiße, beschädigte Bohnen aussortiert.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 7}, {"id": "a3-147", "mode": "anbau", "level": 3, "type": "case", "q": "Bei der Pulper-Kontrolle sind 4 von 50 Bohnen angeschnitten. Was ist zu tun?", "case": {"title": "Fall · Scheibenpulper", "facts": ["Stichprobe: 50 Bohnen", "4 angeschnittene, 1 unentpulpte Kirsche", "Durchsatz rund 1.000 kg Kirschen pro Stunde"]}, "options": ["Nichts, bis etwa 20 % Bruch ist das normal", "Mehr Kirschen gleichzeitig in den Trichter geben", "Den Kaffee zum Ausgleich länger fermentieren", "Spalt Scheibe–Messer mit 4-mm-Lehre neu einstellen"], "correct": 3, "explain": "8 % beschädigte Bohnen liegen über dem Ziel von unter 5 % (höchstens 2 von 50). TechnoServe nennt 4 mm Spalt zwischen Scheibe und Messer und 8–10 mm zur Chop-Platte.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Aufbereitung", "st": 5}, {"id": "a3-148", "mode": "anbau", "level": 3, "type": "case", "q": "Ein Microlot von 300 kg Kirschen soll entschleimt werden. Was spricht laut TechnoServe dagegen?", "case": {"title": "Fall · Microlot", "facts": ["300 kg Kirschen einer Parzelle", "Entschleimer mit hoher Kapazität vorhanden", "Fermentationstank frei"]}, "options": ["Entschleimer arbeiten nur mit Natural", "Entschleimer brauchen 1 t Wasser je kg", "Entschleimer zerstören Peaberries", "Unter 500 kg lohnt der Entschleimer kaum"], "correct": 3, "explain": "Mechanische Entschleimer müssen nahe der Volllast laufen; Lose unter 500 kg rechtfertigen sie oft nicht, und die ersten 15 kg müssen nochmals durchlaufen.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Aufbereitung", "st": 9}, {"id": "a3-149", "mode": "anbau", "level": 3, "type": "case", "q": "Wie viel trockenes Pergament fasst 1 m² Trockentisch etwa, und wie viel Fläche braucht eine Charge von 2.000 kg?", "case": {"title": "Fall · Trockenkapazität planen", "facts": ["Charge: 2.000 kg trockenes Pergament", "Erhöhte Tische, 1,8 m breit", "Schicht 5–7 cm"]}, "options": ["10–12 kg/m², also etwa 17–20 m²", "1–2 kg/m², also etwa 1.000–2.000 m²", "10–12 kg/m², also etwa 170–200 m²", "40–50 kg/m², also etwa 40–50 m²"], "correct": 2, "explain": "TechnoServe rechnet mit 10–12 kg trockenem Pergament (12–15 kg nass) je m²: 2.000 kg ÷ 10–12 kg/m² ≈ 170–200 m².", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 10}, {"id": "a3-150", "mode": "anbau", "level": 3, "type": "case", "q": "Deine Mühle nimmt 3.500 kg Kirschen an. Wie viel exportfähigen Rohkaffee erwartest du etwa?", "case": {"title": "Fall · Ausbeute", "facts": ["Annahme: 3.500 kg reife Kirschen", "Gewaschene Aufbereitung", "Verkauf als Export-Grade"]}, "options": ["Etwa 700 kg", "Etwa 1.200 kg", "Etwa 500 kg", "Etwa 250 kg"], "correct": 2, "explain": "Faustregeln: 5 kg Kirschen ergeben 1 kg Pergament, 7 kg Kirschen 1 kg exportfähigen Rohkaffee. 3.500 ÷ 7 ≈ 500 kg; 700 kg wäre das Pergament.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 8}, {"id": "a3-151", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Ziele nennt TechnoServe für die Dichtesortierung im Waschkanal zur Haupternte?", "options": ["Mindestens 50 % Grade A, unter 20 % Grade C", "Genau ein Drittel je Grade A, B und C", "Mindestens 99 % Grade C, kein Grade A", "Mindestens 90 % Grade A, unter 2 % Grade C"], "correct": 3, "explain": "Im Waschkanal sinkt dichtes Pergament (Grade A), leichtere Bohnen sind Grade B, schwimmende „Lights“ Grade C. Ziel: mindestens 90 % A und unter 2 % C.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 9}, {"id": "a3-152", "mode": "anbau", "level": 3, "type": "case", "q": "Eine 300-g-Probe enthält 1 Full Black, 10 gebrochene Bohnen und 5 Floater. Welcher SCAA-Grad ist möglich?", "case": {"title": "Fall · Defektzählung", "facts": ["300 g geschälter Rohkaffee", "1 Full Black, 10 Broken, 5 Floater", "Keine Quaker, Feuchte 11 %"]}, "options": ["Specialty Grade", "Exchange Grade", "Below Standard", "Premium Grade"], "correct": 3, "explain": "1 Full Black = 1 Defekt, 10 Bruch = 2, 5 Floater = 1, zusammen 4 Full Defects. Specialty erlaubt zwar bis zu 5, aber keinen Primärdefekt – der Full Black führt zu Premium (bis 8, Primärdefekte erlaubt).", "source": {"title": "Coffee Research Institute – SCAA Green Coffee Classification", "url": "https://coffeeresearch.org/coffee/scaaclass.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 8}, {"id": "a3-153", "mode": "anbau", "level": 3, "type": "mc", "q": "Was verlangt die SCAA-Klassifizierung für Exchange Grade neben 9–23 Full Defects?", "options": ["Mind. 90 % über Sieb 18, kein Bruch", "Mind. 10 % Peaberries, max. 5 % Floater", "Nur Bohnen aus über 1.500 m Höhe", "Mind. 50 % über Sieb 15, max. 5 % unter Sieb 14"], "correct": 3, "explain": "Exchange Grade: 9–23 Full Defects, mindestens 50 Gewichtsprozent über Sieb 15, höchstens 5 % unter Sieb 14, keine Tassenfehler und bis zu 5 Quaker.", "source": {"title": "Coffee Research Institute – SCAA Green Coffee Classification", "url": "https://coffeeresearch.org/coffee/scaaclass.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 8}, {"id": "a3-154", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie viele Quaker erlaubt die SCAA-Klassifizierung im Premium Grade?", "options": ["Keinen einzigen", "Bis zu 3", "Bis zu 10", "Bis zu 25"], "correct": 1, "explain": "Specialty Grade erlaubt keinen Quaker, Premium bis zu 3, Exchange bis zu 5.", "source": {"title": "Coffee Research Institute – SCAA Green Coffee Classification", "url": "https://coffeeresearch.org/coffee/scaaclass.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 6}, {"id": "a3-155", "mode": "anbau", "level": 3, "type": "case", "q": "Ein Arabica-Los hat 95 Defekte je 300 g und 11 % Feuchte. Was gilt nach ICO-Resolution 407?", "case": {"title": "Fall · Exportlos", "facts": ["Arabica, 300-g-Probe", "95 Defekte gezählt", "Feuchte 11 %"]}, "options": ["Kein ICO-Ursprungszeugnis – Grenze sind 86 Defekte", "Zeugnis möglich – für Arabica gelten 150 Defekte", "Zeugnis möglich – nur die Feuchte zählt", "Kein Zeugnis – Grenze sind 23 Defekte"], "correct": 0, "explain": "Resolution 407 erlaubt höchstens 86 Defekte je 300 g bei Arabica und 150 bei Robusta, die Feuchte muss zwischen 8 und 12,5 % liegen; sonst gibt es kein ICO-Ursprungszeugnis.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 8: Quality and export standards", "url": "https://www.fao.org/4/ae939e/ae939e0a.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 10}, {"id": "a3-156", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie groß ist der Lochdurchmesser von Sieb 18 ungefähr?", "options": ["Etwa 1,8 mm", "Etwa 4,5 mm", "Etwa 7,1 mm", "Etwa 18 mm"], "correct": 2, "explain": "Siebgrößen zählen in 1/64 Zoll: 18/64 Zoll × 25,4 mm ≈ 7,1 mm. Sieb 15 entspricht entsprechend rund 6 mm.", "source": {"title": "Perfect Daily Grind – Simplifying green coffee grading (2022)", "url": "https://perfectdailygrind.com/2022/07/simplifying-green-coffee-grading/"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 10}, {"id": "a3-157", "mode": "anbau", "level": 3, "type": "case", "q": "Du kannst von derselben Station Kenya AA oder AB kaufen. Was spricht laut TYPICA-QC für AB?", "case": {"title": "Fall · Kenia-Einkauf", "facts": ["Gleiche Factory, gleiche Ernte", "AA: Sieb 17/18, AB: Sieb 16/17", "Budget begrenzt"]}, "options": ["Deutlich höhere Punktzahl als bei AA", "AB ist die einzige gewaschene Qualität", "AB hat garantiert keine Primärdefekte", "Ähnliche Tasse, meist rund 0,50 $ günstiger"], "correct": 3, "explain": "AA und AB derselben Station unterscheiden sich im TYPICA-Cupping meist um höchstens etwa 0,25 Punkte, AB ist aber oft rund 0,50 US-$ FOB günstiger. Die Grades beruhen nur auf der Siebgröße.", "source": {"title": "TYPICA – Is Screen Size a Quality Indicator? Tips for Sourcing Kenyan Coffee", "url": "https://typica.coffee/en/?p=14677"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 10}, {"id": "a3-158", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Herkünfte bekommen im Coffee-C-Kontrakt einen Aufschlag von 1.000 Punkten?", "options": ["Kolumbien, Costa Rica und Kenia", "Brasilien, Vietnam und Indien", "Mexiko, Peru und Honduras", "Ruanda, Burundi und Venezuela"], "correct": 0, "explain": "Kolumbien, Costa Rica und Kenia sind mit 1.000 Punkten Prämie lieferbar, Guatemala mit 500. Mexiko, Peru oder Honduras gelten als Par, Brasilien liegt 600 Punkte darunter.", "source": {"title": "ICE – Coffee C Futures: Contract Specifications", "url": "https://www.ice.com/api/productguide/spec/15/pdf"}, "img": "berg", "topic": "Handel & Preise", "st": 8}, {"id": "a3-159", "mode": "anbau", "level": 3, "type": "mc", "q": "Ein Coffee-C-Kontrakt steht bei 250 c/lb. Welchem Warenwert entspricht ein Kontrakt?", "options": ["Rund 93.750 US-$", "Rund 37.500 US-$", "Rund 9.375 US-$", "Rund 150.000 US-$"], "correct": 0, "explain": "Ein Kontrakt umfasst 37.500 lb (gut 280 Säcke à 60 kg): 37.500 × 2,50 US-$ = 93.750 US-$.", "source": {"title": "ICE – Coffee C Futures: Contract Specifications", "url": "https://www.ice.com/api/productguide/spec/15/pdf"}, "img": "berg", "topic": "Handel & Preise", "st": 10}, {"id": "a3-160", "mode": "anbau", "level": 3, "type": "mc", "q": "Wofür steht die Klausel „PTBF“ bei Rohkaffee-Kontrakten?", "options": ["Der Preis wird erst nach dem Cupping verhandelt", "Der Kaffee wird erst nach dem Rösten bezahlt", "Der Preis richtet sich allein nach dem Fairtrade-Minimum", "Das Differential steht, der Börsenpreis wird später fixiert"], "correct": 3, "explain": "„Price to be fixed“: Käufer und Verkäufer einigen sich auf Herkunft, Qualität und Differential; der Börsenanteil wird zu einem späteren Zeitpunkt fixiert.", "source": {"title": "Sucafina – The Silent Power of Differentials", "url": "https://sucafina.com/na/news/the-silent-power-of-differentials"}, "img": "berg", "topic": "Handel & Preise", "st": 5}, {"id": "a3-161", "mode": "anbau", "level": 3, "type": "mc", "q": "Wann können Differentials auch für börsenlieferbare Qualitäten negativ werden?", "options": ["Bei Überangebot am Markt", "Bei sehr knapper Ernte", "Bei besonders hoher Qualität", "Bei steigender Nachfrage"], "correct": 0, "explain": "Bei Überangebot fallen Differentials lieferbarer Qualitäten unter „Level“; Händler kaufen dann mit negativem Differential und liefern an die Börse. Physisch beliefert werden aber unter 1 % der Futures.", "source": {"title": "Sucafina – The Silent Power of Differentials", "url": "https://sucafina.com/na/news/the-silent-power-of-differentials"}, "img": "berg", "topic": "Handel & Preise", "st": 3}, {"id": "a3-162", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie verhielten sich laut Specialty Coffee Transaction Guide 2024 die Medianpreise nach Qualität?", "options": ["84+ Punkte rund 2,93 $/lb, 80–83,9 rund 4,18 $/lb", "Beide Gruppen lagen bei rund 3,48 $/lb", "84+ Punkte rund 4,18 $/lb, 80–83,9 rund 2,93 $/lb", "84+ Punkte rund 9,00 $/lb, 80–83,9 rund 1,00 $/lb"], "correct": 2, "explain": "In den Erntejahren 2021/22–2023/24 lag der FOB-Median für 84+ Punkte bei 4,18 US-$/lb, für 80–83,9 Punkte bei 2,93 US-$/lb; über alle Verträge bei 3,48 US-$/lb.", "source": {"title": "Daily Coffee News – The 2024 Specialty Coffee Transaction Guide Is Here", "url": "https://dailycoffeenews.com/2025/02/18/the-2024-specialty-coffee-transaction-guide-is-here"}, "img": "berg", "topic": "Handel & Preise", "st": 9}, {"id": "a3-163", "mode": "anbau", "level": 3, "type": "case", "q": "Bio-Fairtrade, gewaschener Arabica, Marktpreis 1,50 $/lb. Was erhält die Kooperative mindestens inkl. Prämie?", "case": {"title": "Fall · Kooperative", "facts": ["Fairtrade und Bio zertifiziert", "Gewaschener Arabica", "Marktpreis 1,50 US-$/lb"]}, "options": ["2,40 US-$ je Pfund", "2,20 US-$ je Pfund", "2,00 US-$ je Pfund", "1,90 US-$ je Pfund"], "correct": 0, "explain": "Mindestpreis 1,80 (über dem Markt) + Bio-Aufschlag 0,40 = 2,20 US-$/lb, dazu 0,20 Fairtrade-Prämie = 2,40 US-$/lb FOB.", "source": {"title": "Fairtrade International – Coffee Price Announcement (30.03.2023)", "url": "https://files.fairtrade.net/standards/2023-03-30_Coffee-Price-Announcement_EN.pdf"}, "img": "berg", "topic": "Handel & Preise", "st": 9}, {"id": "a3-164", "mode": "anbau", "level": 3, "type": "mc", "q": "Was verlangt die EUDR zur Geolokalisierung bei Anbauflächen über 4 Hektar?", "options": ["Ein Punkt pro Gemeinde", "Nur die Postadresse der Farm", "Ein Luftbild ohne Koordinaten", "Polygone der Flächengrenzen"], "correct": 3, "explain": "Für jede Lieferung sind die Koordinaten aller Anbauflächen anzugeben; Flächen über 4 ha brauchen Polygone, kleinere einen Punkt.", "source": {"title": "Rainforest Alliance – EUDR Webinar (Okt. 2023)", "url": "https://www.rainforest-alliance.org/wp-content/uploads/2023/10/EUDR-External-Webinar-11Oct2023.pdf"}, "img": "sonne", "topic": "Herkunft", "st": 7}, {"id": "a3-165", "mode": "anbau", "level": 3, "type": "case", "q": "Eine Farm will Bird Friendly werden; ihr Schatten besteht fast nur aus Grevillea robusta. Reicht das?", "case": {"title": "Fall · Zertifizierung", "facts": ["Bio-zertifizierte Farm", "Schatten: fast nur Grevillea robusta", "Kronendach etwa 45 %"]}, "options": ["Ja, jede Baumart zählt, wenn 40 % Schatten bestehen", "Nein, Grevillea ist als Hauptbaumart unzulässig", "Ja, sofern die Bäume mindestens 5 m hoch sind", "Nein, Bird Friendly verbietet Schattenbäume"], "correct": 1, "explain": "Die Hauptbaumart muss heimisch sein und darf höchstens 60 % stellen; Gliricidia, Grevillea, Erythrina, Albizzia und Pinus sind als Rückgrat ausgeschlossen. Die übrigen 40 % brauchen mindestens 10 Arten.", "source": {"title": "Smithsonian Migratory Bird Center – Bird Friendly Coffee Norms", "url": "https://nationalzoo.si.edu/sites/default/files/documents/bf_norms_english_accessible.pdf"}, "img": "sonne", "topic": "Herkunft", "st": 5}, {"id": "a3-166", "mode": "anbau", "level": 3, "type": "mc", "q": "Welcher Nährstoff wird pro Tonne geernteten Rohkaffees laut FAO am stärksten entzogen?", "options": ["Kalium (rund 53 kg)", "Stickstoff (rund 4 kg)", "Phosphor (rund 50 kg)", "Magnesium (rund 60 kg)"], "correct": 0, "explain": "Für rund 6 t Kirschen (1 t Rohkaffee) müssen in Indien etwa 40 kg N, 2,2 kg P und 53 kg K ersetzt werden – Kalium ist der größte Posten.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 4: Plant nutrition & fertiliser management", "url": "https://www.fao.org/4/ae939e/ae939e06.htm"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 7}, {"id": "a3-167", "mode": "anbau", "level": 3, "type": "mc", "q": "Welches Mangelsymptom passt laut FAO zu Zinkmangel?", "options": ["Gelbe Blattränder an alten Blättern", "Bronzene, nach unten gewölbte Blätter", "Leuchtend gelbe Flecken nur am Stamm", "Schmale, riemenförmige junge Blätter"], "correct": 3, "explain": "Zinkmangel zeigt sich an schmalen, riemenförmigen Blättern und kurzen Internodien. Kalium-Mangel vergilbt vom Rand alter Blätter, Calcium-Mangel macht junge Blätter bronzen und gewölbt.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 4: Plant nutrition & fertiliser management", "url": "https://www.fao.org/4/ae939e/ae939e06.htm"}, "img": "blatt", "topic": "Boden & Pflege", "st": 8}, {"id": "a3-168", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Blätter werden laut FAO für eine Blattanalyse beprobt?", "options": ["Die ältesten Blätter am Stammgrund", "Das 3. oder 4. Blattpaar ab der Triebspitze", "Nur bereits abgefallene Blätter", "Das erste, noch eingerollte Blattpaar"], "correct": 1, "explain": "Beprobt wird das dritte oder vierte Blattpaar eines aktiv wachsenden Zweigs, vor der Blüte und am besten morgens – mindestens 40 Bäume und 100 Blätter je Mischprobe.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 4: Plant nutrition & fertiliser management", "url": "https://www.fao.org/4/ae939e/ae939e06.htm"}, "img": "blatt", "topic": "Boden & Pflege", "st": 8}, {"id": "a3-169", "mode": "anbau", "level": 3, "type": "case", "q": "Für 1 ha mit 2 × 1,5 m Abstand und 75 % Keimrate: Wie viel Saatgut (3.000 Samen/kg) brauchst du?", "case": {"title": "Fall · Baumschulplanung", "facts": ["Pflanzabstand 2 × 1,5 m", "Keimrate 75 %", "3.000 Samen je kg"]}, "options": ["Etwa 1,1 kg (rund 3.300 Samen)", "Etwa 4,4 kg (rund 13.300 Samen)", "Etwa 0,5 kg (rund 1.500 Samen)", "Etwa 1,5 kg (rund 4.400 Samen)"], "correct": 3, "explain": "2 × 1,5 m ergibt 3.333 Pflanzen/ha. Bei 75 % Keimung braucht man 3.333 ÷ 0,75 ≈ 4.444 Samen, bei 3.000 Samen je kg also knapp 1,5 kg.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 2: Nursery practices", "url": "https://www.fao.org/4/ae939e/ae939e04.htm"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 10}, {"id": "a3-170", "mode": "anbau", "level": 3, "type": "case", "q": "Ein Farmer kann sich keinen kompletten Ernteausfall leisten, will aber alte Bäume verjüngen. Was empfiehlt das FAO-Handbuch?", "case": {"title": "Fall · Verjüngung", "facts": ["Bäume 7 Jahre alt, Ertrag sinkt", "Familie lebt vom jährlichen Kaffee-Einkommen", "Dichte, ältere Pflanzung"]}, "options": ["Alle Bäume auf einmal auf Kniehöhe absägen", "Eine Seite jetzt, die andere zwei Jahre später", "Die Bäume ab sofort deutlich stärker düngen", "Alle Seitenzweige im selben Jahr entfernen"], "correct": 1, "explain": "Beim seitlichen Rückschnitt wird eine Baumseite entfernt und ein neuer Trieb aus 30–45 cm Höhe gezogen; die andere Seite folgt zwei Jahre später. Über zwei Jahre gehen so rund 50 % der Ernte verloren, statt der ganzen.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 5: Pruning and tree management", "url": "https://www.fao.org/4/ae939e/ae939e07.htm"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 6}, {"id": "a3-171", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Länder zählt die ICO neben Kolumbien zur Gruppe „Colombian Milds“?", "options": ["Brasilien und Äthiopien", "Kenia und Tansania", "Vietnam und Indonesien", "Honduras und Guatemala"], "correct": 1, "explain": "Colombian Milds sind gewaschene Kaffees aus Kolumbien, Kenia und Tansania. Natural-Kaffees aus Brasilien und Äthiopien laufen unter Brazilian Naturals.", "source": {"title": "TYPICA – Ethiopia: origin information", "url": "https://typica.coffee/en/ethiopia/"}, "img": "berg", "topic": "Handel & Preise", "st": 7}]</script>
<script>window.QZ_FIX={roester:[2,2,3]};(function(){
const QZR=()=>document.getElementById('qzapp'),QZTOP=()=>(window.QZ_TOP||(()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})))();

const LQ=(m,l)=>{const f=FIX[m];return f?(Array.isArray(f)?f[l-1]:f):l};const FXN=m=>typeof FIX[m]==='number';
const MODES=[{k:'barista',n:'Barista',t:'Espresso, Milch, Wasser, Extraktion',c:'m-barista'},{k:'roester',n:'Röster',t:'Phasen, Crack, echte Röstfälle',c:'m-roester'},{k:'anbau',n:'Pflanze & Anbau',t:'Botanik, Sorten, Klima, Aufbereitung',c:'m-anbau'}];

const N=10,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
/* Speicher: Verlauf + Wissen je Frage (nur auf diesem Gerät) */
const KEY='quiz-v1';let DB=load();
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!d||typeof d!=='object')d={};d.hist=Array.isArray(d.hist)?d.hist:[];d.q=d.q&&typeof d.q==='object'?d.q:{};d.st=d.st&&typeof d.st==='object'?d.st:{};d.so=d.so&&typeof d.so==='object'?d.so:{};return d}

function oldBest(m,l){try{return +localStorage.getItem('quiz-best-'+m+'-'+l)||0}catch(e){return 0}}
const rounds=(m,l)=>DB.hist.filter(h=>h.m===m&&(l===undefined||h.l===l));
