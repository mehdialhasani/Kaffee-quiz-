c": "Filter", "st": 10}, {"id": "b3-134", "mode": "barista", "level": 3, "type": "mc", "q": "Welcher Aromastoff steht für rauchig-aschige Noten langer Röstungen?", "options": ["2,3-Butandion (ein Keton)", "3-Methylbutanal (ein Aldehyd)", "Furaneol (ein Furanon)", "Guajakol (ein Phenol)"], "correct": 3, "explain": "Phenole wie Guajakol riechen rauchig und aschig und entstehen bei längeren Röstungen aus freien Phenolsäuren.", "source": {"title": "Perfect Daily Grind – What Creates Coffee Aroma? Understanding The Chemistry", "url": "https://perfectdailygrind.com/2019/08/what-creates-coffee-aroma-understanding-the-chemistry/"}, "img": "bohne", "topic": "Sensorik", "st": 3}, {"id": "b3-135", "mode": "barista", "level": 3, "type": "mc", "q": "Warum erscheint das buttrige 2,3-Butandion früh in der Extraktion?", "options": ["Es ist unpolar und löst sich nur in Öl", "Es ist stark polar und löst sich schnell", "Es entsteht erst beim Kontakt mit Wasser", "Es bildet sich erst beim Abkühlen der Tasse"], "correct": 1, "explain": "Die Polarität bestimmt die Extraktion: Das stark polare 2,3-Butandion löst sich zuerst, das weniger polare β-Damascenon braucht länger.", "source": {"title": "Perfect Daily Grind – What Creates Coffee Aroma? Understanding The Chemistry", "url": "https://perfectdailygrind.com/2019/08/what-creates-coffee-aroma-understanding-the-chemistry/"}, "img": "tasse", "topic": "Sensorik", "st": 8}, {"id": "b3-136", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Reaktion baut Aminosäuren beim Rösten zu Aldehyden ab?", "options": ["Karamellisierung", "Autoxidation", "Strecker-Abbau", "Hydrolyse"], "correct": 2, "explain": "Beim Strecker-Abbau werden Aminosäuren zu Aldehyden wie dem fruchtig-süßen 3-Methylbutanal abgebaut.", "source": {"title": "Perfect Daily Grind – What Creates Coffee Aroma? Understanding The Chemistry", "url": "https://perfectdailygrind.com/2019/08/what-creates-coffee-aroma-understanding-the-chemistry/"}, "img": "bohne", "topic": "Sensorik", "st": 3}, {"id": "b3-137", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Stoffgruppe liefert nussige bis verbrannte Röstnoten?", "options": ["Phenole", "Pyrazine", "Ketone", "Ester"], "correct": 1, "explain": "Pyrazine riechen je nach Verbindung nussig (2,3-Dimethylpyrazin) oder verbrannt (2-Ethyl-3-methylpyrazin).", "source": {"title": "Perfect Daily Grind – What Creates Coffee Aroma? Understanding The Chemistry", "url": "https://perfectdailygrind.com/2019/08/what-creates-coffee-aroma-understanding-the-chemistry/"}, "img": "bohne", "topic": "Sensorik", "st": 1}, {"id": "b3-138", "mode": "barista", "level": 3, "type": "mc", "q": "Was bedeutet eine breite Lücke zwischen zwei Feldern nahe der Mitte des SCA-Aromarads?", "options": ["Die Attribute sind fast identisch", "Die Attribute sind eher wenig verwandt", "Die Attribute sind Fehlaromen", "Die Attribute sind besonders häufig"], "correct": 1, "explain": "Verbundene Felder galten den Testern als eng verwandt, Lücken als weniger verwandt – je breiter die Lücke nahe der Mitte, desto schwächer die Beziehung.", "source": {"title": "SCA – How to Use the Coffee Taster's Flavor Wheel in Eight Steps", "url": "https://sca.coffee/sca-news/how-to-use-the-flavor-wheel-in-eight-steps-ab2hy"}, "img": "rad", "topic": "Sensorik", "st": 8}, {"id": "b3-139", "mode": "barista", "level": 3, "type": "mc", "q": "Wie viele Geschmacks-, Aroma- und Textur-Attribute beschreibt das WCR Sensory Lexicon?", "options": ["36", "250", "1.000", "110"], "correct": 3, "explain": "Das Lexikon von World Coffee Research, der Kansas State University und der SCAA umfasst 110 Attribute mit Definition und Referenz.", "source": {"title": "Perfect Daily Grind – The evolution of the Coffee Taster's Flavor Wheel", "url": "https://perfectdailygrind.com/2021/05/the-evolution-of-the-coffee-tasters-flavor-wheel/"}, "img": "rad", "topic": "Sensorik", "st": 9}, {"id": "b3-140", "mode": "barista", "level": 3, "type": "mc", "q": "Woraus bestand das erste Aromarad der SCAA von 1995?", "options": ["Aus einem Fehler- und einem Aromen-Teilrad", "Aus einem einzigen Rad nur mit Früchten", "Aus drei Rädern für die drei Röstgrade", "Aus einem Rad nur für Espresso-Aromen"], "correct": 0, "explain": "Das Original hatte zwei Teilräder: „Taints & Faults“ (Fehler) und „Tastes & Aromas“; heute gibt es ein Rad plus Lexikon.", "source": {"title": "Perfect Daily Grind – The evolution of the Coffee Taster's Flavor Wheel", "url": "https://perfectdailygrind.com/2021/05/the-evolution-of-the-coffee-tasters-flavor-wheel/"}, "img": "rad", "topic": "Sensorik", "st": 10}, {"id": "b3-141", "mode": "barista", "level": 3, "type": "mc", "q": "Was erfasst die deskriptive Bewertung (SCA-103) im CVA-System?", "options": ["Den Gesamteindruck der Qualität", "Die Röstfarbe und die Partikelgröße", "Den Preis und die Herkunft der Probe", "Intensitäten und Deskriptoren der Attribute"], "correct": 3, "explain": "SCA-103 erfasst Attribute mit Intensitäten und Beschreibungen; SCA-104 (affektiv) bewertet den Qualitätseindruck, SCA-102 regelt Probenvorbereitung.", "source": {"title": "SCA – SCA Officially Adopts CVA Descriptive and Affective Assessments", "url": "https://sca.coffee/sca-news/sca-new-cva-cupping-standards-7ga28"}, "img": "tasse", "topic": "Sensorik", "st": 8}, {"id": "b3-142", "mode": "barista", "level": 3, "type": "mc", "q": "Wie viele Punkte entfielen auf dem klassischen SCA-Formular auf Süße, Gleichmäßigkeit und Clean Cup?", "options": ["Zusammen 10 Punkte", "Zusammen 50 Punkte", "Zusammen 70 Punkte", "Zusammen 30 Punkte"], "correct": 3, "explain": "Laut Kaffeemacher entfallen 70 Punkte auf qualitative Attribute und 30 auf Süße, Gleichmäßigkeit und Clean Cup; das CVA ersetzt das System.", "source": {"title": "Kaffeemacher – Was ist Kaffee? 30 Dinge, die du wissen solltest", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/what-is-coffee"}, "img": "tasse", "topic": "Sensorik", "st": 7}, {"id": "b3-143", "mode": "barista", "level": 3, "type": "mc", "q": "Wo liegt die Süße nach der UC-Davis-Forschung zum Brewing Control Chart am höchsten?", "options": ["Bei hohem TDS und hoher Extraktion", "Bei hohem TDS und niedriger Extraktion", "Bei niedrigem TDS und hoher Extraktion", "Bei niedrigem TDS und niedriger Extraktion"], "correct": 3, "explain": "Süße erreicht ihr Maximum bei niedrigem TDS und niedriger Extraktion, Bitterkeit bei hohen Werten beider; Beeren- und Zitrusnoten bei hohem TDS und niedriger Extraktion.", "source": {"title": "SCA – Coffee Decoded: The Science of Dialing-In", "url": "https://sca.coffee/sca-news/coffee-decoded-14-dialling-in"}, "img": "tasse", "topic": "Extraktion", "st": 4}, {"id": "b3-144", "mode": "barista", "level": 3, "type": "mc", "q": "Wo finden sich nach der UC-Davis-Forschung teeartige Noten im Brewing Control Chart?", "options": ["Bei hohem TDS und niedriger Extraktion", "Bei hohem TDS und hoher Extraktion", "Bei niedrigem TDS und hoher Extraktion", "Bei niedrigem TDS und niedriger Extraktion"], "correct": 2, "explain": "Teeartige Aromen treten bei niedrigem TDS und hoher Extraktion auf – etwa bei langen, verdünnten Brühungen.", "source": {"title": "SCA – Coffee Decoded: The Science of Dialing-In", "url": "https://sca.coffee/sca-news/coffee-decoded-14-dialling-in"}, "img": "tasse", "topic": "Extraktion", "st": 4}, {"id": "b3-145", "mode": "barista", "level": 3, "type": "mc", "q": "Was kombiniert das neue Sensory and Consumer Brewing Control Chart der UC Davis?", "options": ["TDS und Extraktion mit Sensorik- und Konsumdaten", "Röstgrad und Mahlgrad mit Daten zum Verkaufspreis", "Wasserhärte und pH-Wert mit der Kesseltemperatur", "Bohnenart und Anbauhöhe mit dem Koffeingehalt"], "correct": 0, "explain": "Das Diagramm aktualisiert Lockharts Chart von 1957: Es verbindet TDS und Extraktion mit Daten aus Verkostungspanels und Konsumententests.", "source": {"title": "UC Davis – Coffee Center Contributes Research to New Brewing Control Chart", "url": "https://engineering.ucdavis.edu/news/uc-davis-coffee-center-contributes-research-new-brewing-control-chart"}, "img": "tasse", "topic": "Standards", "st": 9}, {"id": "b3-146", "mode": "barista", "level": 3, "type": "mc", "q": "Wie stark verlängert sich die Haltbarkeit laut Labuza et al. bei nur 0,5 % Sauerstoff in der Verpackung?", "options": ["Etwa um das 2-Fache", "Etwa um das 20-Fache", "Etwa um das 200-Fache", "Gar nicht messbar"], "correct": 1, "explain": "Sauerstoff ist der Hauptfeind von Röstkaffee: Auf 0,5 % Sauerstoff reduziert, verlängerte sich die Haltbarkeit etwa 20-fach.", "source": {"title": "SCA – What is the Shelf Life of Roasted Coffee? A Literature Review on Coffee Staling", "url": "https://sca.coffee/sca-news/2012/02/15/what-is-the-shelf-life-of-roasted-coffee-a-literature-review-on-coffee-staling-bjcx7"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 10}, {"id": "b3-147", "mode": "barista", "level": 3, "type": "mc", "q": "Welche sensorische Haltbarkeit fanden Alves et al. für stickstoffgespülten Kaffee?", "options": ["Etwa drei statt sechs Monate", "Etwa zwei Jahre statt sechs Monate", "Etwa zwei Wochen statt ein Monat", "Etwa sechs statt drei Monate"], "correct": 3, "explain": "Stickstoffgespülter Kaffee hielt sensorisch etwa sechs Monate, ungespülter nur etwa drei.", "source": {"title": "SCA – What is the Shelf Life of Roasted Coffee? A Literature Review on Coffee Staling", "url": "https://sca.coffee/sca-news/2012/02/15/what-is-the-shelf-life-of-roasted-coffee-a-literature-review-on-coffee-staling-bjcx7"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 7}, {"id": "b3-148", "mode": "barista", "level": 3, "type": "mc", "q": "Was bedeutet ein Q10-Wert von 1,5 für das Entgasen ganzer Bohnen?", "options": ["Pro 10 °C weniger entgasen sie 1,5-mal schneller", "Nach 10 Tagen sind 1,5 % des CO₂ entwichen", "Ab 10 °C enthält die Bohne 1,5 % weniger CO₂", "Pro 10 °C mehr entgasen sie etwa 1,5-mal schneller"], "correct": 3, "explain": "Q10 beschreibt die Beschleunigung pro 10 °C Temperaturanstieg; für gemahlenen Kaffee lag der Wert laut Labuza et al. etwa doppelt so hoch.", "source": {"title": "SCA – What is the Shelf Life of Roasted Coffee? A Literature Review on Coffee Staling", "url": "https://sca.coffee/sca-news/2012/02/15/what-is-the-shelf-life-of-roasted-coffee-a-literature-review-on-coffee-staling-bjcx7"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 10}, {"id": "b3-149", "mode": "barista", "level": 3, "type": "mc", "q": "Wie definiert die Lebensmittelwissenschaft das Ende der Haltbarkeit meist?", "options": ["Wenn der Kaffee gesundheitsschädlich wird", "Wenn das gesamte CO₂ entwichen ist", "Wenn über 50 % der Verkoster ablehnen", "Wenn das aufgedruckte Datum erreicht ist"], "correct": 2, "explain": "Üblich ist der Punkt, an dem über 50 % der Verkoster ablehnen; da Kaffee kein Sicherheitsrisiko hat, entscheidet die sensorische Akzeptanz.", "source": {"title": "SCA – What is the Shelf Life of Roasted Coffee? A Literature Review on Coffee Staling", "url": "https://sca.coffee/sca-news/2012/02/15/what-is-the-shelf-life-of-roasted-coffee-a-literature-review-on-coffee-staling-bjcx7"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 8}, {"id": "b3-150", "mode": "barista", "level": 3, "type": "mc", "q": "Warum wird Röstkaffee auch mit der Zeit ranzig?", "options": ["Sein Koffein zerfällt zu Fettsäuren", "Seine Stärke vergärt zu Alkohol", "Seine Lipide (rund 15 %) oxidieren", "Sein CO₂ bildet Kohlensäure"], "correct": 2, "explain": "Lipide machen etwa 15 % der Trockenmasse von geröstetem Arabica aus; ihr Abbau führt zu Ranzigkeit – beschleunigt durch Feuchte, Sauerstoff, Wärme und Oberfläche.", "source": {"title": "SCA – What is the Shelf Life of Roasted Coffee? A Literature Review on Coffee Staling", "url": "https://sca.coffee/sca-news/2012/02/15/what-is-the-shelf-life-of-roasted-coffee-a-literature-review-on-coffee-staling-bjcx7"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 1}, {"id": "b3-151", "mode": "barista", "level": 3, "type": "mc", "q": "Ab welchen Bedingungen wird CO₂ für die Entkoffeinierung überkritisch?", "options": ["Über etwa 100 °C und 1 bar", "Unter etwa 0 °C und 10 bar", "Über etwa 300 °C und 500 bar", "Über etwa 31 °C und 73,8 bar"], "correct": 3, "explain": "Oberhalb von etwa 31 °C und 73,8 bar wird CO₂ überkritisch und löst Koffein; Industrieanlagen arbeiten mit 250–300 bar und 60–80 °C.", "source": {"title": "Kaffeemacher – Wie wird Kaffee entkoffeiniert? Vier Verfahren im Vergleich", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/decaffeination-process"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 10}, {"id": "b3-152", "mode": "barista", "level": 3, "type": "mc", "q": "Wann wurde das erste Entkoffeinierungsverfahren (Kaffee HAG) patentiert?", "options": ["1820", "1950", "1970", "1906"], "correct": 3, "explain": "Das Patent wurde am 4. Mai 1906 angemeldet (Meyer, Roselius, Wimmer); im selben Jahr wurde Kaffee HAG gegründet. Ludwig Roselius gilt oft fälschlich als alleiniger Erfinder.", "source": {"title": "Kaffeemacher – Wie wird Kaffee entkoffeiniert? Vier Verfahren im Vergleich", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/decaffeination-process"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 9}, {"id": "b3-153", "mode": "barista", "level": 3, "type": "mc", "q": "Wie viel Koffein darf entkoffeinierter Röstkaffee in Deutschland höchstens enthalten?", "options": ["0,01 % (0,1 g/kg)", "1,0 % (10 g/kg)", "0,3 % (3 g/kg)", "0,1 % (1 g/kg)"], "correct": 3, "explain": "Die deutsche Kaffeeverordnung setzt 1 g/kg (0,1 %) für Röstkaffee; der EU-weite Wert von 0,3 % gilt nur für lösliche Kaffee-Extrakte.", "source": {"title": "Kaffeemacher – Wie wird Kaffee entkoffeiniert? Vier Verfahren im Vergleich", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/decaffeination-process"}, "img": "bohne", "topic": "Standards", "st": 6}, {"id": "b3-154", "mode": "barista", "level": 3, "type": "mc", "q": "Wie heißt der Effekt, bei dem im Milchschaum große Blasen auf Kosten kleiner wachsen?", "options": ["Maillard-Reaktion", "Ostwald-Reifung", "Strecker-Abbau", "Leidenfrost-Effekt"], "correct": 1, "explain": "Bei der Ostwald-Reifung ziehen größere Blasen über Druckunterschiede kleinere an; das ist kaum zu verhindern und lässt Schaum nach einigen Minuten zerfallen.", "source": {"title": "Perfect Daily Grind – Why does milk foam disintegrate?", "url": "https://perfectdailygrind.com/2021/01/why-does-milk-foam-disintegrate/"}, "img": "milch", "topic": "Milch", "st": 7}, {"id": "b3-155", "mode": "barista", "level": 3, "type": "mc", "q": "Warum zerfällt Milchschaum auf sehr frisch geröstetem, dunklem Espresso schneller?", "options": ["Mehr CO₂ diffundiert und lässt Blasen verschmelzen", "Mehr Säure lässt das Milcheiweiß sofort ausflocken", "Mehr Fett im Espresso löst die Proteine auf", "Mehr Hitze im Espresso kocht die Milch nach"], "correct": 0, "explain": "Dunkle Röstungen und sehr frischer Kaffee enthalten mehr CO₂, das schnell diffundiert und Blasen zusammenwachsen lässt; empfohlen wird Kaffee etwa eine Woche nach der Röstung.", "source": {"title": "Perfect Daily Grind – Why does milk foam disintegrate?", "url": "https://perfectdailygrind.com/2021/01/why-does-milk-foam-disintegrate/"}, "img": "milch", "topic": "Milch", "st": 5}, {"id": "b3-156", "mode": "barista", "level": 3, "type": "mc", "q": "Wann leidet der Schaum von nicht homogenisierter Milch besonders?", "options": ["Wenn sie direkt aus dem Kühlschrank kommt", "Wenn sie über 55 °C erhitzt wird", "Wenn sie zwischen 10 und 30 °C geschäumt wird", "Wenn sie vorher kurz geschüttelt wird"], "correct": 2, "explain": "Zwischen 10 und 30 °C können die großen Fettkügelchen nicht homogenisierter Milch beim Schäumen beschädigt werden und den Schaum destabilisieren.", "source": {"title": "Perfect Daily Grind – Why does milk foam disintegrate?", "url": "https://perfectdailygrind.com/2021/01/why-does-milk-foam-disintegrate/"}, "img": "milch", "topic": "Milch", "st": 8}, {"id": "b3-157", "mode": "barista", "level": 3, "type": "mc", "q": "Wie viel Milch sieht das Istituto Nazionale Espresso Italiano für einen Cappuccino vor?", "options": ["Etwa 50 ml Milch auf 50 ml Espresso", "Etwa 200 ml Milch auf 25 ml Espresso", "Etwa 25 ml Milch auf 100 ml Espresso", "Etwa 100 ml Milch auf 25 ml Espresso"], "correct": 3, "explain": "Der INEI-Cappuccino besteht aus 25 ml Espresso und 100 ml mit Dampf aufgeschäumter Milch, mit leicht gewölbtem weißem Schaum und braunem Rand.", "source": {"title": "Perfect Daily Grind – What Is a Cappuccino & How Has It Developed Over Time?", "url": "https://perfectdailygrind.com/2020/03/what-is-a-cappuccino-how-has-it-developed-over-time/"}, "img": "milch", "topic": "Standards", "st": 4}, {"id": "b3-158", "mode": "barista", "level": 3, "type": "mc", "q": "Was änderte die World Barista Championship 2016 beim Cappuccino?", "options": ["Statt fester 150 ml die Wunschgröße des Baristas", "Statt Einfach- nun ein doppelter Espresso", "Statt 1 cm nun mindestens 3 cm Schaum", "Statt Kuhmilch nun freie Milchwahl"], "correct": 0, "explain": "2016 ersetzte die WBC das feste Volumen von 150 ml durch die vom Barista bevorzugte Menge; der einfache Espresso und mindestens 1 cm Schaum blieben.", "source": {"title": "Perfect Daily Grind – What Is a Cappuccino & How Has It Developed Over Time?", "url": "https://perfectdailygrind.com/2020/03/what-is-a-cappuccino-how-has-it-developed-over-time/"}, "img": "milch", "topic": "Standards", "st": 8}, {"id": "b3-159", "mode": "barista", "level": 3, "type": "mc", "q": "Was verursacht laut Barista Hustle blasse „Schneckenspuren“ in der Latte Art?", "options": ["Gießen über braunem Grund zu nah an der Oberfläche", "Gießen aus mehr als 10 cm mit zu hohem Fluss", "Zu kalte Milch und ein zu großes Kännchen", "Zu heiße Tassen direkt von der Maschine"], "correct": 0, "explain": "Blasse Linien entstehen, wenn man über einfarbig braunem Grund gießt oder unter 5 cm am Tassenrand kreist; Vortexing in der ersten Hälfte schafft Kontrast.", "source": {"title": "Barista Hustle – Latte Art Faults", "url": "https://www.baristahustle.com/lesson/la-5-03-latte-art-faults/"}, "img": "milch", "topic": "Milch", "st": 5}, {"id": "b3-160", "mode": "barista", "level": 3, "type": "mc", "q": "Wie schmeckt das untere linke Feld des Espresso Compass (niedrige Extraktion, niedrige Stärke)?", "options": ["Süß, rund und sehr intensiv", "Nur sauer, aber sehr stark", "Nur bitter, aber sehr süß", "Bitter, sauer und dünn zugleich"], "correct": 3, "explain": "Bei niedriger, ungleichmäßiger Extraktion liegen Über- und Unterextraktion nah beieinander: Das untere linke Feld schmeckt bitter, sauer und schwach zugleich.", "source": {"title": "Barista Hustle – The Espresso Compass", "url": "https://www.baristahustle.com/the-espresso-compass/"}, "img": "espresso", "topic": "Extraktion", "st": 2}, {"id": "b3-161", "mode": "barista", "level": 3, "type": "mc", "q": "Was beschreibt der Langelier-Sättigungsindex (LSI)?", "options": ["Ob Wasser Kalk ablagert oder löst", "Wie viel Chlor im Wasser gelöst ist", "Wie stark Wasser elektrisch leitet", "Wie viel Natrium das Wasser enthält"], "correct": 0, "explain": "Der LSI beschreibt das Gleichgewicht, bei dem sich Kalk etwa so schnell löst, wie er sich bildet – im Espressokessel kann sich ein solcher Zustand einstellen.", "source": {"title": "Barista Hustle – Water Hardness", "url": "https://www.baristahustle.com/water-hardness/"}, "img": "wasser", "topic": "Wasser", "st": 7}, {"id": "b3-162", "mode": "barista", "level": 3, "type": "case", "q": "Wie richtest du die Wasseraufbereitung ein?", "options": ["Umkehrosmose mit viel Verschnitt des Rohwassers", "Nur einen Aktivkohlefilter vor die Maschine", "Umkehrosmose ohne Verschnitt, dann remineralisieren", "Nur einen Enthärter mit Natrium-Austausch"], "correct": 2, "explain": "Bei hohem Chlorid rät Espresso Parts zu Umkehrosmose ohne Verschnitt und anschließender Remineralisierung – Verschnitt würde Chlorid wieder einbringen.", "source": {"title": "Espresso Parts – Water Chemistry: Hardness, Chloride, Scale and RO Water", "url": "https://www.espressoparts.com/blogs/news/how-water-chemistry-affects-espresso-machines-hardness-chloride-scale-and-ro-water"}, "img": "wasser", "topic": "Wasser", "case": {"title": "Fall · Chloridreiches Wasser", "facts": ["Leitungswasser mit rund 80 ppm Chlorid", "Neue Dualboiler-Maschine mit Edelstahlkessel", "Hersteller verlangt höchstens 15 ppm Chlorid"]}, "st": 5}, {"id": "b3-163", "mode": "barista", "level": 3, "type": "case", "q": "Wie viel Puffer-Konzentrat gibst du für 1 L Brühwasser dazu?", "options": ["Etwa 40 g", "Etwa 4 g", "Etwa 400 g", "Etwa 0,4 g"], "correct": 0, "explain": "Für 40 ppm KH in 1 L braucht man 40/1.000 des 1.000-ppm-Konzentrats, also etwa 40 g; Barista Hustle nutzt im SCA-Rezept 40,1 g Puffer.", "source": {"title": "Barista Hustle – Barista Water Recipes", "url": "https://www.baristahustle.com/diy-water-recipes-redux/"}, "img": "wasser", "topic": "Wasser", "case": {"title": "Fall · Eigenes Brühwasser", "facts": ["Puffer-Konzentrat: 1,68 g Natron pro Liter ergibt etwa 1.000 ppm KH", "Ziel: etwa 40 ppm Alkalinität", "Rest wird mit destilliertem Wasser aufgefüllt"]}, "st": 10}, {"id": "b3-164", "mode": "barista", "level": 3, "type": "case", "q": "Was ist der sinnvollste nächste Schritt?", "options": ["Weniger Getränk ziehen bei gleichem Mahlgrad", "Mehr Getränk ziehen oder feiner mahlen", "Gröber mahlen und Dosis deutlich erhöhen", "Brühtemperatur um 10 °C senken"], "correct": 1, "explain": "Extraktion = 9 % × 34 g ÷ 18 g = 17 % – unterextrahiert, passend zu sauer und kurzem Abgang. Mehr Yield oder feinerer Mahlgrad erhöhen die Extraktion.", "source": {"title": "Perfect Daily Grind – A Guide To Dialling In Espresso", "url": "https://perfectdailygrind.com/2020/07/a-guide-to-dialling-in-espresso/"}, "img": "espresso", "topic": "Extraktion", "case": {"title": "Fall · Refraktometer am Tresen", "facts": ["18 g in, 34 g out in 23 Sekunden", "Gemessen: 9,0 % TDS", "Tasse: sauer, wenig Süße, kurzer Abgang"]}, "st": 2}, {"id": "b3-165", "mode": "barista", "level": 3, "type": "case", "q": "Wie bewertest du den Brew?", "options": ["Rund 14,5 % – deutlich unterextrahiert", "Rund 18,9 % – im klassischen Idealbereich", "Rund 25,0 % – deutlich überextrahiert", "Rund 1,4 % – exakt die Getränkestärke"], "correct": 1, "explain": "Extraktion = 1,40 % × 270 g ÷ 20 g ≈ 18,9 %; zusammen mit 1,40 % TDS liegt der Brew im klassischen Bereich von 18–22 %.", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "filter", "topic": "Extraktion", "case": {"title": "Fall · Batch-Probe", "facts": ["20 g Kaffee, 270 g Getränk in der Tasse", "Refraktometer: 1,40 % TDS", "Tasse süß, sauber, ausgewogen"]}, "st": 4}, {"id": "b3-166", "mode": "barista", "level": 3, "type": "case", "q": "Wie gehst du vor?", "options": ["Barista-Haferdrink, höchstens um 60 °C dampfen", "Normalen Mandeldrink auf 70 °C dampfen", "Sojadrink kochen, damit er stabil wird", "Kokosdrink ohne Stabilisator auf 75 °C"], "correct": 0, "explain": "Säure lässt Pflanzendrinks ausflocken; Barista-Editionen enthalten Stabilisatoren. Hafer funktioniert um 60 °C am besten, Soja und Mandel nur bis etwa 55 °C.", "source": {"title": "Perfect Daily Grind – Why more baristas are focusing on milk temperature", "url": "https://perfectdailygrind.com/2026/02/more-baristas-focusing-on-milk-temperature-coffee-shops/"}, "img": "milch", "topic": "Milch", "case": {"title": "Fall · Heller Espresso, Pflanzendrink", "facts": ["Sehr hell gerösteter, säurebetonter Espresso", "Gast möchte einen pflanzlichen Flat White", "Bisher flockt der Drink in der Tasse aus"]}, "st": 4}, {"id": "b3-167", "mode": "barista", "level": 3, "type": "case", "q": "Was verursacht den früh hellen, sauer-bitteren Shot am ehesten?", "options": ["Zu grober Mahlgrad für diese Dosis", "Zu niedrige Brühtemperatur der Gruppe", "Zu alter Kaffee mit wenig CO₂", "Ungleichmäßige Verteilung im Puck (Channeling)"], "correct": 3, "explain": "Frühes Blonding, mehrere Strahlen und eine zugleich saure und bittere Tasse sind typische Channeling-Zeichen – bei passender Zeit liegt die Ursache eher in Verteilung und Tampen als im Mahlgrad.", "source": {"title": "Perfect Daily Grind – What is channeling and how does it affect espresso extraction?", "url": "https://perfectdailygrind.com/2022/03/what-is-channeling-espresso-extraction/"}, "img": "espresso", "topic": "Espresso", "case": {"title": "Fall · Früh hell", "facts": ["18 g in, 36 g out in 27 Sekunden", "Nackter Siebträger: mehrere Strahlen, früh hell", "Tasse schmeckt sauer und bitter zugleich"]}, "st": 2}, {"id": "b3-168", "mode": "barista", "level": 3, "type": "case", "q": "Wie lagerst du ihn am sinnvollsten?", "options": ["Offen in der Röstertüte im Regal", "Im Kühlschrank im Glas lagern", "Gemahlen in einer Dose aufbewahren", "Portionsweise vakuumiert einfrieren"], "correct": 3, "explain": "Im Barista-Hustle-Test hielt vakuumiert eingefrorener Kaffee über ein Jahr mit nur kleinen Unterschieden. Portionen vermeiden wiederholtes Auftauen und Kondenswasser.", "source": {"title": "Barista Hustle – A Year in the Deep Freeze", "url": "https://www.baristahustle.com/a-year-in-the-deep-freeze/"}, "img": "bohne", "topic": "Bohne & Lagerung", "case": {"title": "Fall · Seltener Kaffee", "facts": ["2 kg eines seltenen Geisha-Lots", "Wird nur gelegentlich als Special angeboten", "Soll über mehrere Monate gut bleiben"]}, "st": 2}, {"id": "b3-169", "mode": "barista", "level": 3, "type": "mc", "q": "Ein Softdrink hat pH 3, Kaffee etwa pH 5. Wie viel saurer ist der Softdrink?", "options": ["Etwa 100-mal", "Etwa 2-mal", "Etwa 10-mal", "Etwa 1.000-mal"], "correct": 0, "explain": "Die pH-Skala ist logarithmisch: Zwei pH-Stufen bedeuten den Faktor 100.", "source": {"title": "Kaffeemacher – Säure im Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/acidity-in-coffee"}, "img": "tasse", "topic": "Sensorik", "st": 3}, {"id": "b3-170", "mode": "barista", "level": 3, "type": "mc", "q": "Welche zwei Salze nutzt Barista Hustle für eigene Brühwasser-Rezepte?", "options": ["Kochsalz und Zucker", "Bittersalz und Natron", "Kalkstein und Gips", "Kaliumchlorid und Essig"], "correct": 1, "explain": "Natron (Natriumhydrogencarbonat) liefert den Puffer (KH), Bittersalz (Magnesiumsulfat) die Härte (GH) – beides in destilliertem oder deionisiertem Wasser gelöst.", "source": {"title": "Barista Hustle – Barista Water Recipes", "url": "https://www.baristahustle.com/diy-water-recipes-redux/"}, "img": "wasser", "topic": "Wasser", "st": 3}, {"id": "b3-171", "mode": "barista", "level": 3, "type": "mc", "q": "Was wird beim Ethylacetat-Verfahren („Sugarcane Process“) als Lösungsmittel genutzt?", "options": ["Ein Saftkonzentrat aus Zuckerrohr", "Kohlendioxid unter sehr hohem Druck", "Aktivkohle in heißem Wasser gelöst", "Ein Ester, der auch in Zuckerrohr steckt"], "correct": 3, "explain": "Ethylacetat kommt natürlich in Zuckerrohr und Früchten vor; es löst wie Dichlormethan das Koffein, ist aber etwas weniger selektiv.", "source": {"title": "Kaffeemacher – Wie wird Kaffee entkoffeiniert? Vier Verfahren im Vergleich", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/decaffeination-process"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 8}, {"id": "b3-172", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Kaffees hatten in der CoffeeMind-Studie (2023) den niedrigsten pH und die meiste Zitronensäure?", "options": ["Die kenianischen gewaschenen Kaffees", "Die brasilianischen Pulped Naturals", "Der bolivianische gewaschene Kaffee", "Alle fünf Kaffees genau gleich"], "correct": 1, "explain": "Die Brasilianer hatten den niedrigsten pH und die meiste Zitronensäure; die Kenianer weniger Zitronensäure und einen höheren pH – obwohl Kenia oft als besonders sauer gilt.", "source": {"title": "Barista Hustle – What We Taste When We Taste Acidity", "url": "https://www.baristahustle.com/what-we-taste-when-we-taste-acidity/"}, "img": "tasse", "topic": "Sensorik", "st": 10}, {"id": "b3-173", "mode": "barista", "level": 3, "type": "mc", "q": "Woher stammt ein deutlicher Essigsäure-Geschmack im Kaffee häufig?", "options": ["Aus zu weichem Wasser beim Brühen", "Aus unkontrollierter Fermentation", "Aus einer zu kurzen Mahldauer", "Aus zu niedrigem Druck beim Brühen"], "correct": 1, "explain": "Essigsäure ist in hohen Konzentrationen sehr unangenehm und hängt mit unkontrollierter Fermentation zusammen; in kleinen Mengen kann sie fruchtig wirken.", "source": {"title": "Kaffeemacher – Säure im Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/acidity-in-coffee"}, "img": "tasse", "topic": "Sensorik", "st": 4}, {"id": "r1-01", "mode": "roester", "level": 1, "type": "mc", "q": "Was treibt den First Crack hauptsächlich an?", "options": ["Kaffeeöl, das im Zellinneren zu sieden beginnt", "Zucker, der schmilzt und die Zellwände sprengt", "Wasserdampf, der im Inneren Druck aufbaut", "Zellulose, die sich in der Hitze ruckartig dehnt"], "correct": 2, "explain": "Das in der Bohne gebundene Wasser wird zu Dampf und baut Druck auf, bis die Zellstruktur hörbar aufbricht. Wasserdampf ist dabei der Haupttreiber, wenn auch nicht der einzige Faktor.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Phasen & Crack", "st": 5}, {"id": "r1-02", "mode": "roester", "level": 1, "type": "mc", "q": "Bei welcher Bohnentemperatur beginnt der First Crack ungefähr?", "options": ["Um 100 °C", "Um 150 °C", "Um 200 °C", "Um 230 °C"], "correct": 2, "explain": "Sweet Maria's nennt rund 395–405 °F (etwa 202–207 °C) als Richtwert. Die genaue Anzeige hängt von Röster und Fühlerposition ab. Der genaue Wert hängt von Röster und Messfühler ab.", "source": {"title": "Sweet Maria's – First Crack, Second Crack and Bean Changes", "url": "https://library.sweetmarias.com/coffee-class-first-crack-second-crack-and-bean-changes-in-the-roast/"}, "img": "crack", "topic": "Phasen & Crack", "st": 3}, {"id": "r1-03", "mode": "roester", "level": 1, "type": "mc", "q": "Wie verändert sich die Farbe der Bohnen im Lauf der Röstung?", "options": ["Grün → gelb → braun", "Grün → rot → schwarz", "Gelb → grün → braun", "Grün → braun → gelb"], "correct": 0, "explain": "Während der Trocknung wird die Bohne von grün über gelb zu braun. Das Gelbwerden markiert grob das Ende der Trocknungsphase.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "bohne", "topic": "Phasen & Crack", "st": 1}, {"id": "r1-04", "mode": "roester", "level": 1, "type": "mc", "q": "Wie viel Gewicht verliert Kaffee bei hellen bis mittleren Specialty-Röstungen typischerweise?", "options": ["Etwa 4–7 %", "Etwa 11–16 %", "Etwa 25–30 %", "Etwa 35–40 %"], "correct": 1, "explain": "Je nach Röstgrad und Ausgangsfeuchte liegt der Verlust insgesamt bei etwa 11–24 %. Specialty-Röster arbeiten meist hell bis mittel und rechnen mit 11–16 %.", "source": {"title": "Barista Hustle – How to Roast Coffee (Gewichtsverlust)", "url": "https://baristahustle.com/?p=453522"}, "img": "sack", "topic": "Röstgrad", "st": 6}, {"id": "r1-05", "mode": "roester", "level": 1, "type": "mc", "q": "Woher kommt der größte Teil des Gewichtsverlusts beim Rösten?", "options": ["Von abgelöstem Chaff", "Von entweichendem CO₂", "Von verbrennenden Zuckern", "Von verdampfendem Wasser"], "correct": 3, "explain": "Den Großteil macht verdampfendes Wasser aus. Der Rest ist hauptsächlich CO₂ und Wasser, die bei chemischen Reaktionen entstehen.", "source": {"title": "Barista Hustle – How to Roast Coffee (Gewichtsverlust)", "url": "https://baristahustle.com/?p=453522"}, "img": "bohne", "topic": "Chemie", "st": 1}, {"id": "r1-06", "mode": "roester", "level": 1, "type": "mc", "q": "Was ist „Chaff“ beim Rösten?", "options": ["Die Rußschicht, die sich im Abluftrohr ablagert", "Das Silberhäutchen, das sich von der Bohne löst", "Bruchstücke, die im First Crack von Bohnen abplatzen", "Staub, der beim Einfüllen des Rohkaffees aufsteigt"], "correct": 1, "explain": "Chaff ist das papierartige Silberhäutchen, das sich während der Röstung löst. Naturkaffees haben deutlich mehr davon.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "trommel", "topic": "Phasen & Crack", "st": 2}, {"id": "r1-07", "mode": "roester", "level": 1, "type": "mc", "q": "Welcher Feuchtegehalt gilt laut SCA als Standard für Rohkaffee?", "options": ["6–8 %", "10–12 %", "14–16 %", "18–20 %"], "correct": 1, "explain": "Die SCA nennt 10–12 % Feuchte als Standard für Rohkaffee. Trocknere oder feuchtere Partien verhalten sich im Röster anders.", "source": {"title": "Cropster – Green grading coffee (SCA-Feuchtestandard)", "url": "https://www.cropster.com/blog-post/green-grading-coffee/"}, "img": "sack", "topic": "Rohkaffee", "st": 6}, {"id": "r1-08", "mode": "roester", "level": 1, "type": "mc", "q": "Was löst den Second Crack aus?", "options": ["Restwasser, das im Bohnenkern erst jetzt verdampft", "Saccharose, die schmilzt und die Zellwände sprengt", "Gasdruck, vor allem CO₂, in der spröden Bohnenstruktur", "Öl, das aus dem Bohneninneren an die Oberfläche drängt"], "correct": 2, "explain": "Beim Second Crack baut sich Gasdruck auf, vor allem CO₂. Die inzwischen spröde Zellstruktur hält ihm nicht mehr stand. Er liegt etwa bei 440–455 °F (ca. 227–235 °C).", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Phasen & Crack", "st": 6}, {"id": "r1-09", "mode": "roester", "level": 1, "type": "mc", "q": "Welche drei Arten der Wärmeübertragung wirken beim Rösten?", "options": ["Konduktion, Konvektion, Strahlung", "Kondensation, Verdunstung, Sublimation", "Oxidation, Reduktion, Fermentation", "Kompression, Expansion, Reibung"], "correct": 0, "explain": "Die Bohnen nehmen Wärme durch Kontakt (Konduktion), über heiße Luft (Konvektion) und durch Strahlung auf. Im Trommelröster dominiert laut Quelle die Konvektion.", "source": {"title": "Oil Slick Coffee – Heat Transfer Methods in Roasting", "url": "https://oilslickcoffee.com/roasting/heat-transfer-methods/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 7}, {"id": "r1-10", "mode": "roester", "level": 1, "type": "mc", "q": "Was bedeutet beim Agtron-Wert eine höhere Zahl?", "options": ["Eine dunklere Röstung", "Eine längere Röstzeit", "Eine höhere Dichte", "Eine hellere Röstung"], "correct": 3, "explain": "Auf der Agtron-Skala stehen höhere Werte für hellere Röstungen. Sehr helle Bohnen liegen bei etwa 70 (ganz) bzw. 95 (gemahlen), sehr dunkle bei etwa 25 bzw. 30.", "source": {"title": "Coffee Review – Roast Definitions (Agtron)", "url": "https://www.coffeereview.com/roast-definitions/"}, "img": "bohne", "topic": "Röstgrad", "st": 3}, {"id": "r1-11", "mode": "roester", "level": 1, "type": "mc", "q": "Was bezeichnet die „Development Time“ (Entwicklungszeit)?", "options": ["Die Zeit vom Einfüllen bis zum Gelbwerden", "Die Zeit vom First Crack bis zum Drop", "Die Zeit vom Gelbwerden bis zum First Crack", "Die Zeit vom Einfüllen bis zum Drop"], "correct": 1, "explain": "Die Development Time ist die Phase vom First Crack bis zum Drop. Ihr Anteil an der Gesamtröstzeit heißt Development Time Ratio (DTR).", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://www.royalny.com/?p=165626"}, "img": "kurve", "topic": "Phasen & Crack", "st": 5}, {"id": "r1-12", "mode": "roester", "level": 1, "type": "case", "q": "Die Röstung sollte mittel werden. Was änderst du bei der nächsten Charge?", "case": {"title": "Fall · Brasilien, natural, Ziel: mittlere Röstung", "facts": ["Drop deutlich nach Beginn des Second Crack", "Bohnen glänzen ölig", "Gewichtsverlust 19 %"], "cup": "Rauchig, aschig, bitter, kaum Süße"}, "options": ["Länger entwickeln, um mehr Süße aufzubauen", "Im Second Crack mehr Gas geben, um Zeit zu sparen", "Früher droppen, noch vor dem Second Crack", "Mehr Luftstrom, Drop-Zeitpunkt beibehalten"], "correct": 2, "explain": "Eine ölige Oberfläche und ein Drop im Second Crack zeigen eine dunkle Röstung. 19 % Gewichtsverlust liegen klar über den 11–16 % heller bis mittlerer Röstungen. Wer früher droppt, vor dem Second Crack, kommt zur gewünschten mittleren Röstung.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Fallstudie", "st": 10}, {"id": "r2-01", "mode": "roester", "level": 2, "type": "mc", "q": "Welche Stoffe reagieren bei der Maillard-Reaktion miteinander?", "options": ["Reduzierende Zucker und Aminosäuren", "Saccharose und Chlorogensäuren", "Koffein und organische Säuren", "Triglyceride und lösliche Polysaccharide"], "correct": 0, "explain": "Bei der Maillard-Reaktion reagieren reduzierende Zucker mit Aminosäuren. Dabei entstehen Bräunung und viele Aromastoffe.", "source": {"title": "Sweet Maria's – Roasting Chemistry and Profile Roasting (PDF)", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Roasting-Chemistry-and-Profile-Roasting.pdf"}, "img": "bohne", "topic": "Chemie", "st": 1}, {"id": "r2-02", "mode": "roester", "level": 2, "type": "mc", "q": "Was passiert mit den Chlorogensäuren beim Rösten?", "options": ["Sie bleiben weitgehend stabil, wie das Koffein", "Sie reichern sich an, je dunkler, desto mehr", "Sie werden abgebaut, aber nur bei hellen Röstungen", "Sie werden stark abgebaut, je dunkler, desto mehr"], "correct": 3, "explain": "Chlorogensäuren werden beim Rösten stark abgebaut, bei dunkler Röstung um bis zu rund 90 %. Dabei entstehen unter anderem bittere Lactone und Phenole.", "source": {"title": "Ludwig et al. 2014, Food & Function – Caffeine and chlorogenic acid contents", "url": "https://pubs.rsc.org/en/content/articlehtml/2014/fo/c4fo00290c"}, "img": "bohne", "topic": "Chemie", "st": 1}, {"id": "r2-03", "mode": "roester", "level": 2, "type": "mc", "q": "Wie verändert sich der Koffeingehalt der Bohne beim Rösten?", "options": ["Er sinkt mit dunkler Röstung deutlich", "Er bleibt im Verlauf weitgehend stabil", "Er steigt mit dem Röstgrad deutlich an", "Er halbiert sich bis zum First Crack"], "correct": 1, "explain": "Koffein ist beim Rösten weitgehend stabil, während Chlorogensäuren abnehmen. Darum steigt das Verhältnis Koffein zu Chlorogensäure mit dem Röstgrad.", "source": {"title": "Ludwig et al. 2014, Food & Function – Caffeine and chlorogenic acid contents", "url": "https://pubs.rsc.org/en/content/articlehtml/2014/fo/c4fo00290c"}, "img": "bohne", "topic": "Chemie", "st": 1}, {"id": "r2-04", "mode": "roester", "level": 2, "type": "mc", "q": "Was passiert mit der Saccharose im Rohkaffee beim Rösten?", "options": ["Sie bleibt größtenteils erhalten", "Sie wird etwa zur Hälfte abgebaut", "Sie wird fast vollständig abgebaut", "Sie nimmt durch den Abbau von Stärke zu"], "correct": 2, "explain": "Untersuchungen zeigen, dass schon bei mittleren Röstungen rund 96–98 % der Saccharose abgebaut sind. Dafür sorgen Karamellisierung und Maillard-Reaktionen.", "source": {"title": "Potravinarstvo – The effect of coffee beans roasting on its chemical composition", "url": "https://potravinarstvo.com/journal1/index.php/potravinarstvo/article/view/1062"}, "img": "bohne", "topic": "Chemie", "st": 1}, {"id": "r2-05", "mode": "roester", "level": 2, "type": "mc", "q": "Was ist der „Turning Point“ auf der Röstkurve?", "options": ["Der Tiefpunkt der Bohnentemperatur nach dem Einfüllen", "Der Moment, in dem die Bohnen gelb zu werden beginnen", "Der Wechsel von endothermer zu exothermer Reaktion", "Der Moment, in dem der Brenner erstmals gedrosselt wird"], "correct": 0, "explain": "Nach dem Einfüllen der kalten Bohnen fällt die Fühlertemperatur zunächst. Der Turning Point ist der Moment, ab dem sie wieder steigt. Er hängt von Charge-Temperatur, Brennerleistung, Chargengröße und Vorheizen ab.", "source": {"title": "Loring – Roast Profile (Turn Around Point)", "url": "https://loring.com/helpfiles/RA/RoastProfile.html"}, "img": "kurve", "topic": "Phasen & Crack", "st": 1}, {"id": "r2-06", "mode": "roester", "level": 2, "type": "mc", "q": "Was sind „Quakers“?", "options": ["Bohnen, deren Spitzen im Röster verbrennen", "Bohnen, die im First Crack laut aufplatzen", "Bohnen, die durch Insektenfraß kleine Löcher haben", "Unreife Bohnen, die beim Rösten hell bleiben"], "correct": 3, "explain": "Quakers sind unreife, unterentwickelte Kaffeesamen, die beim Rösten nicht richtig bräunen und hell bleiben.", "source": {"title": "Sweet Maria's – Glossar: Quakers", "url": "https://library.sweetmarias.com/glossary/quakers/"}, "img": "bohne", "topic": "Rohkaffee", "st": 1}, {"id": "r2-07", "mode": "roester", "level": 1, "type": "mc", "q": "Was misst die Rate of Rise (RoR)?", "options": ["Wie schnell die Abluft die Trommel verlässt", "Wie schnell die Bohnentemperatur steigt", "Wie schnell die Bohnen an Gewicht verlieren", "Wie schnell der Brenner Wärme nachliefert"], "correct": 1, "explain": "Die RoR zeigt, wie schnell die Bohnentemperatur steigt. Sie wird meist in Grad pro Minute angegeben und hilft, den Verlauf einer Röstung zu steuern.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "topic": "Wärme & Maschine", "st": 5}, {"id": "r2-08", "mode": "roester", "level": 2, "type": "mc", "q": "Wie lagert man Specialty-Rohkaffee am besten bis zur Röstung?", "options": ["Offen im Jutesack, damit Restfeuchte entweichen kann", "Im Kühlraum, Liner geöffnet für bessere Luftzirkulation", "Verschlossen im Hermetik-Liner, kühl und temperaturstabil", "Im warmen Röstraum, damit er vor dem Rösten gut vortemperiert"], "correct": 2, "explain": "Den Liner bis zur Röstung geschlossen lassen. Kühle, stabile Temperaturen bremsen die Alterung und verhindern Kondenswasser im Liner.", "source": {"title": "Barista Hustle – Storing Green Coffee", "url": "https://www.baristahustle.com/?p=437739"}, "img": "sack", "topic": "Rohkaffee", "st": 2}, {"id": "r2-09", "mode": "roester", "level": 2, "type": "case", "q": "Was änderst du bei der nächsten Charge?", "case": {"title": "Fall · Kolumbien, gewaschen, 1.700 m", "facts": ["Drop 10:30", "Entwicklung 0:50 (8 %)", "Gewichtsverlust 12,0 %"], "cup": "Grasig, rohe Erdnuss, vegetal-säuerlich"}, "options": ["Entwicklung verlängern oder etwas mehr Wärme einbringen", "Charge-Temperatur senken und Entwicklung verkürzen", "Früher droppen und den Luftstrom deutlich erhöhen", "Trommeldrehzahl erhöhen und den Drop-Zeitpunkt beibehalten"], "correct": 0, "explain": "Grasige, erdnussartige und vegetale Noten sind typisch für Unterentwicklung. Abhilfe schafft eine etwas dunklere Röstung oder eine Kurve, die mehr Wärme in die Bohne bringt, also mehr Entwicklung.", "source": {"title": "Barista Hustle – Underdevelopment vs. Baking", "url": "https://www.baristahustle.com/?p=474557"}, "img": "kurve", "topic": "Fallstudie", "st": 4}, {"id": "r2-10", "mode": "roester", "level": 2, "type": "case", "q": "Die Bohnenspitzen sind angesengt. Was änderst du?", "case": {"title": "Fall · Äthiopien, natural", "facts": ["Charge-Temperatur deutlich höher als üblich", "Volle Brennerleistung direkt ab Einfüllen", "Dunkle Brandstellen an den Bohnenenden"], "cup": "Leicht verbrannt, aschig im Abgang"}, "options": ["Später droppen, damit sich die Farbe besser angleicht", "Luftstrom drosseln, damit die Wärme gleichmäßiger wirkt", "Trommeldrehzahl senken, damit die Bohnen ruhiger liegen", "Niedrigere Charge-Temperatur und weniger Gas zu Beginn"], "correct": 3, "explain": "Dunkle Spitzen sind „Tipping“. Ursache ist meist eine zu heiße Startumgebung (Charge-Temperatur zu hoch), auch eine überfüllte Trommel oder zu wenig Luftstrom kommen in Frage. Erste Maßnahme: weniger Starthitze.", "source": {"title": "Sweet Maria's – Glossar: Tipping", "url": "https://library.sweetmarias.com/glossary/tipping/"}, "img": "bohne", "topic": "Fallstudie", "st": 4}, {"id": "r2-11", "mode": "roester", "level": 2, "type": "case", "q": "Was änderst du bei der nächsten Charge?", "case": {"title": "Fall · Honduras, gewaschen", "facts": ["Drop 14:30", "RoR fällt nach First Crack auf ~0 und stagniert", "Entwicklung 3:40 (25 %)"], "cup": "Flach, dumpf, kaum Süße, leicht pappig"}, "options": ["Gas nach First Crack weiter senken, um die Entwicklung zu strecken", "Energie so führen, dass die RoR nach First Crack nicht stockt", "Früher droppen und die RoR weiter auf null fallen lassen", "Charge-Temperatur senken, damit der Start sanfter verläuft"], "correct": 1, "explain": "Eine stockende Röstung, bei der die RoR auf null oder darunter fällt, erzeugt laut Rao gebackene, flache Aromen und lässt die Süße verschwinden. Die Energie sollte so geführt werden, dass die Temperatur bis zum Drop weiter steigt.", "source": {"title": "Daily Coffee News – Baked Beans (Scott Rao)", "url": "https://dailycoffeenews.com/2019/02/13/baked-beans-observations-on-water-content-during-roasting"}, "img": "kurve", "topic": "Fallstudie", "st": 10}, {"id": "r2-12", "mode": "roester", "level": 2, "type": "case", "q": "Die Röstung ist in Ordnung. Was änderst du vor dem Verkauf?", "case": {"title": "Fall · Espresso-Röstung, 1 Tag alt", "facts": ["Röstung sauber, Kurve unauffällig", "Espresso 24 h nach dem Rösten", "Sehr viel großblasige Crema"], "cup": "Unruhiger Durchlauf, scharf, wenig klar"}, "options": ["Etwas dunkler rösten, damit die Crema feiner wird", "Bohnen direkt nach dem Abkühlen einfrieren und versenden", "Bohnen länger ruhen lassen, damit mehr CO₂ entweicht", "Feiner mahlen lassen, damit der Durchlauf ruhiger wird"], "correct": 2, "explain": "Frisch geröstete Bohnen enthalten viel CO₂, das beim Mahlen und Brühen freigesetzt wird und Crema und Durchfluss beeinflusst. Eine längere Ruhezeit lässt mehr Gas entweichen.", "source": {"title": "SCA Podcast #81 – The Science of Coffee Freshness (Samo Smrke)", "url": "https://sca.coffee/sca-news/podcast/81/the-science-of-coffee-freshness-samo-smrke-expo-lectures-2019"}, "img": "kurve", "topic": "Fallstudie", "st": 2}, {"id": "r3-02", "mode": "roester", "level": 3, "type": "mc", "q": "Was meint Scott Rao mit einem „Flick“?", "options": ["Einen kurzen Gasstoß direkt nach dem Einfüllen", "Einen plötzlichen Einbruch der RoR nach First Crack", "Das erste vereinzelte Knacken vor dem First Crack", "Einen erneuten Anstieg der RoR spät in der Röstung"], "correct": 3, "explain": "Ein Flick ist laut Rao eine Beschleunigung der Bohnen-RoR gegen Ende der Röstung. Er bringt verkohlte, röstige Noten und nimmt Delikatesse, auch bei heller Farbe.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "topic": "Röstfehler", "st": 1}, {"id": "r3-03", "mode": "roester", "level": 2, "type": "mc", "q": "Welches gefährliche Gas geben frisch geröstete und gemahlene Bohnen ab?", "options": ["Schwefeldioxid (neben CO₂)", "Kohlenmonoxid (neben CO₂)", "Stickoxide (neben CO₂)", "Ammoniak (neben CO₂)"], "correct": 1, "explain": "Geröstete Bohnen gasen CO und CO₂ aus, beim Mahlen besonders stark. NIOSH maß an Mühlen CO-Spitzen über 200 ppm. Lüftung und abgedeckte Behälter sind deshalb wichtig.", "source": {"title": "NIOSH HHE 2016-0144-3305 – Coffee roasting and packaging facility", "url": "https://www.cdc.gov/niosh/hhe/reports/pdfs/2016-0144-3305.pdf"}, "img": "sack", "topic": "Sicherheit", "st": 1}, {"id": "r3-04", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du?", "case": {"title": "Fall · Kenia, gewaschen, 1.800 m", "facts": ["Drop 9:40", "Entwicklung 1:05 (11 %)", "Gewichtsverlust 11,8 %"], "cup": "Hell und saftig, aber grüne Tomate und Erdnuss im Abgang"}, "options": ["Charge-Temperatur erhöhen und entsprechend früher droppen", "Früher droppen, damit die Saftigkeit erhalten bleibt", "Entwicklung verlängern, Energie nach First Crack sanft halten", "Trommeldrehzahl senken, damit mehr Kontaktwärme in die Bohne geht"], "correct": 2, "explain": "Erdnuss und vegetale Noten wie grüne Tomate zeigen Unterentwicklung. Ein erfahrener Röster verlängert die Entwicklung leicht und hält die Energie nach dem First Crack so, dass die RoR sanft weiterfällt, ohne zu stocken.", "source": {"title": "Barista Hustle – Underdevelopment vs. Baking", "url": "https://www.baristahustle.com/?p=474557"}, "img": "kurve", "topic": "Fallstudie", "st": 5}, {"id": "r3-05", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du?", "case": {"title": "Fall · Panama, gewaschen, helle Filterröstung", "facts": ["Gas während des First Crack erhöht", "RoR steigt nach First Crack wieder an", "Drop 11:20, helle Farbe"], "cup": "Verkohlte Note trotz heller Farbe, wenig Delikatesse"}, "options": ["Kein Gas im First Crack nachlegen, ET-RoR vorher beobachten", "Gas im First Crack erhöhen, damit die RoR nicht zu stark abfällt", "Luftstrom im First Crack schließen, um Wärme zu halten", "Charge-Temperatur senken, Gasführung im First Crack gleich"], "correct": 0, "explain": "Das Profil zeigt einen Flick. Rao rät, im klassischen Trommelröster während des First Crack keine Hitze nachzulegen und auf eine zu schnell steigende ET-RoR als Frühwarnung zu achten.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "topic": "Fallstudie", "st": 5}, {"id": "r3-07", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du?", "case": {"title": "Fall · Brasilien, natural, niedrige Lage", "facts": ["Trommel mit ca. 110 % der Nennkapazität befüllt", "Hohe Charge-Temperatur", "Dunkle Brandflecken auf den flachen Seiten"], "cup": "Aschig, rauchig, bitter"}, "options": ["Füllmenge erhöhen, damit sich die Hitze besser verteilt", "Füllmenge auf Nennkapazität reduzieren und Starthitze senken", "Entwicklung verlängern und die Trommeldrehzahl deutlich senken", "Abluft drosseln und die Charge-Temperatur beibehalten"], "correct": 1, "explain": "Brandflecken auf den flachen Seiten sind Scorching bzw. Facing. Typische Ursachen sind zu heiße Starttemperaturen, eine überladene Trommel oder zu wenig Luftstrom. Natural-Kaffees aus niedrigen Lagen sind besonders anfällig.", "source": {"title": "Sweet Maria's – Glossar: Scorching", "url": "https://library.sweetmarias.com/glossary/scorching/"}, "img": "bohne", "topic": "Fallstudie", "st": 4}, {"id": "r3-09", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du für das Ziel „hell“?", "case": {"title": "Fall · Äthiopien, gewaschen, Ziel: helle Filterröstung", "facts": ["Drop 12:50, kurz vor dem Second Crack", "Gewichtsverlust 17,5 %", "Entwicklung 2:40 (21 %)"], "cup": "Röstig, bittersüß, kaum Frucht und Säure"}, "options": ["Früher droppen, bei niedrigerer Endtemperatur", "Später droppen, um mehr Süße zu entwickeln", "Gas im Second Crack erhöhen, Drop unverändert", "Charge-Temperatur erhöhen, Drop-Temperatur gleich"], "correct": 0, "explain": "17,5 % Gewichtsverlust und ein Drop knapp vor dem Second Crack sprechen für eine eher mittlere bis dunkle Röstung. Helle bis mittlere Röstungen liegen meist bei 11–16 %. Früher droppen bringt die Röstung zurück ins Ziel.", "source": {"title": "Barista Hustle – How to Roast Coffee (Gewichtsverlust)", "url": "https://baristahustle.com/?p=453522"}, "img": "kurve", "topic": "Fallstudie", "st": 1}, {"id": "r3-10", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du, um das SCA-Protokoll einzuhalten?", "case": {"title": "Fall · Probenröstung für SCA-Cupping", "facts": ["Röstzeit 5:30", "Agtron ca. 75", "Gecuppt 2 Stunden nach der Röstung"], "cup": "Grasig, unausgewogen, schwer zu bewerten"}, "options": ["5–6 Min. rösten, Agtron ca. 75 (±1), 2–4 h nach Röstung cuppen", "12–15 Min. rösten, Agtron ca. 55 (±1), sofort nach Röstung cuppen", "8–12 Min. rösten, Agtron ca. 48 (±1), 2–3 Tage nach Röstung cuppen", "8–12 Min. rösten, Agtron ca. 63 (±1), 8–24 h nach Röstung cuppen"], "correct": 3, "explain": "Das SCA-Protokoll verlangt 8–12 Minuten Röstzeit, Agtron „Gourmet“ 63 ±1 und ein Cupping 8–24 Stunden nach der Röstung.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "kurve", "topic": "Fallstudie", "st": 6}, {"id": "r3-11", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du?", "case": {"title": "Fall · El Salvador, Bourbon", "facts": ["Gas am Ende stark reduziert, um Zeit zu strecken", "Entwicklung 3:30 bei Drop 11:00 (32 %)", "RoR vor Drop nahe null"], "cup": "Flach, dumpf, Süße fehlt"}, "options": ["Gas am Ende noch weiter senken, um die Entwicklung zu verlängern", "Nicht strecken, mit fallender, positiver RoR zügig droppen", "Im Second Crack Gas nachlegen, Entwicklung beibehalten", "Charge-Temperatur senken, Gasführung am Ende gleich"], "correct": 1, "explain": "Rao warnt, dass ein absichtlich verlängertes Röstende meist gebackene Aromen erzeugt. Fällt die RoR auf null, stockt die Röstung und die Süße verschwindet.", "source": {"title": "Daily Coffee News – Baked Beans (Scott Rao)", "url": "https://dailycoffeenews.com/2019/02/13/baked-beans-observations-on-water-content-during-roasting"}, "img": "kurve", "topic": "Fallstudie", "st": 4}, {"id": "r3-12", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du?", "case": {"title": "Fall · Röstbetrieb, Sicherheit", "facts": ["Abluftrohr seit Monaten nicht gereinigt", "Chaff-Reste im Zyklon und am Rohr", "Luftstrom merklich schwächer"], "cup": "Röstungen laufen träger, gelegentlich Funkenflug am Rohr"}, "options": ["Mehr Gas geben, um den schwachen Luftstrom auszugleichen", "Ventilator höher stellen, um die Ablagerungen auszugleichen", "Feste Reinigungsintervalle für Zyklon und Abluftrohr einführen", "Abluftklappe weiter schließen, damit weniger Funken austreten"], "correct": 2, "explain": "Chaff und Kreosot sind leicht entzündlich und verengen bei Ablagerung den Luftweg. Regelmäßige Reinigung von Zyklon und Abluft senkt das Brandrisiko und stellt den Luftstrom wieder her.", "source": {"title": "Barista Hustle – Chaff, Creosote und Abluft", "url": "https://www.baristahustle.com/?p=421062"}, "img": "trommel", "topic": "Fallstudie", "st": 2}, {"id": "r1-13", "mode": "roester", "level": 1, "type": "mc", "topic": "Phasen & Crack", "q": "Wie unterscheidet sich der Second Crack vom First Crack im Klang?", "options": ["Er ist ein lauteres, tieferes Knallen", "Er ist ein feineres, schnelleres Knistern", "Er ist ein dumpfes, langsameres Poppen", "Er ist ein gleichmäßiges, leises Zischen"], "correct": 1, "explain": "Der First Crack ist ein popcornartiges Knallen, der Second Crack ein feineres Knistern, wie Milch auf Reis-Crispies. Manche Natural-Kaffees knacken im First Crack allerdings sehr leise.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "st": 5}, {"id": "r1-14", "mode": "roester", "level": 1, "type": "mc", "topic": "Phasen & Crack", "q": "Was passiert beim Rösten mit Volumen und Dichte der Bohne?", "options": ["Volumen sinkt, Dichte steigt", "Volumen bleibt, Dichte sinkt", "Volumen nimmt zu, Dichte nimmt ab", "Volumen und Dichte steigen beide"], "correct": 2, "explain": "Die Bohne dehnt sich durch Gas- und Dampfdruck aus. In einer Studie wuchs das Volumen von Arabica je nach Röstgrad um etwa 40–70 %, die Dichte sank deutlich.", "source": {"title": "Bicho et al. 2012, Ciência e Tecnologia de Alimentos – Use of colour parameters for roasted coffee assessment", "url": "https://www.redalyc.org/pdf/3959/395940113004.pdf"}, "img": "bohne", "st": 1}, {"id": "r1-15", "mode": "roester", "level": 1, "type": "mc", "topic": "Wärme & Maschine", "q": "Was bedeutet „Drop“ in der Röstersprache?", "options": ["Das Entleeren der Bohnen am Ende der Röstung", "Der Temperaturabfall nach dem Einfüllen", "Das Absenken der Gaszufuhr vor dem First Crack", "Das Ablassen des Chaffs aus dem Zyklon"], "correct": 0, "explain": "Mit dem Drop werden die gerösteten Bohnen aus der Maschine entlassen. Damit endet die Röstung, danach folgt das Abkühlen.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "st": 2}, {"id": "r1-16", "mode": "roester", "level": 1, "type": "mc", "topic": "Wärme & Maschine", "q": "Was bedeutet „Charge“ beim Rösten?", "options": ["Das Vorheizen der leeren Trommel vor dem ersten Start", "Das Entleeren der Bohnen ins Kühlsieb am Ende", "Die Gaszufuhr während der ersten Röstminuten", "Das Einfüllen des Rohkaffees zum Start der Röstung"], "correct": 3, "explain": "Charge meint das Laden des Rohkaffees in Trichter oder Trommel und damit den Start der Röstung. Die Trommeltemperatur in diesem Moment heißt Charge-Temperatur.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "st": 2}, {"id": "r1-17", "mode": "roester", "level": 1, "type": "mc", "topic": "Wärme & Maschine", "q": "Warum werden die Bohnen nach dem Drop möglichst schnell abgekühlt?", "options": ["Damit das CO₂ in der Bohne gebunden bleibt", "Damit die Röstreaktionen schnell stoppen", "Damit sich das Chaff leichter absieben lässt", "Damit die Bohnen Feuchte aus der Luft aufnehmen"], "correct": 1, "explain": "Heiße Bohnen rösten weiter und können gebacken schmecken. Barista Hustle nennt als Ziel, die Bohnen in weniger als 4 Minuten unter 40 °C zu bringen.", "source": {"title": "Barista Hustle – Roasting Science RS 4.13: Cooling", "url": "https://baristahustle.com/?p=465630"}, "img": "trommel", "st": 2}, {"id": "r1-18", "mode": "roester", "level": 1, "type": "mc", "topic": "Wärme & Maschine", "q": "Wofür dient der Zyklon an einem Trommelröster?", "options": ["Er führt heiße Abluft zurück in die Trommel", "Er kühlt die Bohnen nach dem Drop mit Luft ab", "Er trennt Chaff und Partikel aus der Abluft", "Er erzeugt den Unterdruck für den Luftstrom"], "correct": 2, "explain": "Der Zyklon lässt die Abluft kreisen und scheidet dabei Chaff und größere Partikel ab, laut Barista Hustle etwa 96–99 %. Sie landen im Chaff-Behälter darunter.", "source": {"title": "Barista Hustle – Chaff, Creosote und Abluft", "url": "https://www.baristahustle.com/?p=421062"}, "img": "trommel", "st": 2}, {"id": "r1-19", "mode": "roester", "level": 1, "type": "mc", "topic": "Ruhezeit & Lagerung", "q": "Wozu dient das Einwegventil an Kaffeetüten?", "options": ["Es lässt CO₂ hinaus, aber keinen Sauerstoff hinein", "Es lässt Stickstoff hinein und hält das Aroma drin", "Es gleicht den Luftdruck in beide Richtungen aus", "Es lässt Feuchte hinaus, aber kein CO₂ hinein"], "correct": 0, "explain": "Frisch gerösteter Kaffee gast CO₂ aus, das eine dichte Tüte aufblähen oder platzen lassen kann. Das Ventil öffnet bei Überdruck und schließt wieder, damit kein Sauerstoff eindringt.", "source": {"title": "Plitek – One-Way Degassing Systems", "url": "https://www.plitek.com/resources/technical-resources/one-way-degassing-systems"}, "img": "sack", "st": 2}, {"id": "r1-20", "mode": "roester", "level": 1, "type": "mc", "topic": "Ruhezeit & Lagerung", "q": "Welches Gas geben frisch geröstete Bohnen beim Ausgasen hauptsächlich ab?", "options": ["Sauerstoff (O₂)", "Stickstoff (N₂)", "Methan (CH₄)", "Kohlendioxid (CO₂)"], "correct": 3, "explain": "Beim Rösten entsteht viel CO₂, das in den Tagen danach entweicht, anfangs besonders schnell. In geringerer Menge entweicht auch Kohlenmonoxid.", "source": {"title": "Plitek – One-Way Degassing Systems", "url": "https://www.plitek.com/resources/technical-resources/one-way-degassing-systems"}, "img": "sack", "st": 1}, {"id": "r1-21", "mode": "roester", "level": 1, "type": "mc", "topic": "Ruhezeit & Lagerung", "q": "Wie wirkt sich das Mahlen auf das Ausgasen von geröstetem Kaffee aus?", "options": ["Es verlangsamt das Ausgasen deutlich", "Es beschleunigt das Ausgasen stark", "Es beeinflusst das Ausgasen kaum", "Es stoppt das Ausgasen weitgehend"], "correct": 1, "explain": "In einer Studie von Smrke et al. entwich bis zu 75 % des eingeschlossenen Gases schon während und kurz nach dem Mahlen. Darum altert gemahlener Kaffee schneller.", "source": {"title": "Smrke et al. 2017 – Time-resolved gravimetric method to assess degassing of roasted coffee (ZHAW)", "url": "https://digitalcollection.zhaw.ch/bitstream/11475/12175/2/2017_Smrke-etal_Roasted-coffe-degassing-time-resolved-gravimetry.pdf"}, "img": "bohne", "st": 2}, {"id": "r1-22", "mode": "roester", "level": 1, "type": "mc", "topic": "Röstgrad", "q": "Bei welchen Röstungen zeigt sich typischerweise Öl auf der Bohnenoberfläche?", "options": ["Bei hellen bis mittleren Röstungen", "Bei sehr hellen, kaum entwickelten Filterröstungen", "Bei mitteldunklen bis sehr dunklen Röstungen", "Bei allen Röstgraden etwa gleich stark"], "correct": 2, "explain": "Laut Coffee Review bleiben helle und mittlere Röstungen trocken. Ab mitteldunkel können Öltröpfchen erscheinen, sehr dunkle Röstungen glänzen ölig.", "source": {"title": "Coffee Review – Roast Definitions (Agtron)", "url": "https://www.coffeereview.com/roast-definitions/"}, "img": "bohne", "st": 3}, {"id": "r1-23", "mode": "roester", "level": 1, "type": "mc", "topic": "Röstgrad", "q": "Wann wird eine „City“-Röstung nach Sweet Maria's typischerweise beendet?", "options": ["Gegen Ende des First Crack oder kurz danach", "Mit den ersten Knacken des Second Crack", "Kurz bevor der First Crack überhaupt einsetzt", "Mitten im Second Crack, wenn Öl austritt"], "correct": 0, "explain": "Sweet Maria's beschreibt City als frühesten gut trinkbaren Röstgrad. Gedroppt wird meist beim letzten hörbaren First-Crack-Knacken oder kurz danach, vor dem Second Crack.", "source": {"title": "Sweet Maria's – Glossar: City Roast", "url": "https://library.sweetmarias.com/glossary/city-roast/"}, "img": "crack", "st": 9}, {"id": "r1-24", "mode": "roester", "level": 1, "type": "mc", "topic": "Röstgrad", "q": "Was misst ein Farbmessgerät wie ein Agtron?", "options": ["Die Restfeuchte von Bohnen oder Mahlgut", "Die Dichte von Bohnen oder Mahlgut", "Den Ölgehalt von Bohnen oder Mahlgut", "Die Röstfarbe von Bohnen oder Mahlgut"], "correct": 3, "explain": "Röstfarbmesser sind Spektrophotometer, Agtron ist eine bekannte Marke. Sie machen den Röstgrad objektiv vergleichbar, auch wenn Geräte untereinander kalibriert werden müssen.", "source": {"title": "Coffee Review – Agtron Numerology", "url": "https://www.coffeereview.com/agtron-numerology/"}, "img": "bohne", "st": 1}, {"id": "r1-25", "mode": "roester", "level": 1, "type": "mc", "topic": "Cupping & Qualität", "q": "Wofür nutzt man einen Probenröster (Sample Roaster)?", "options": ["Um während der Röstung Bohnen zu entnehmen", "Um kleine Mengen für das Cupping zu rösten", "Um Rohkaffee vor dem Rösten vorzutrocknen", "Um sehr dunkle Espressoröstungen zu machen"], "correct": 1, "explain": "Probenröster sind kleine, oft mehrtrommelige Maschinen. Sie rösten gerade genug Kaffee, um eine Partie ein- oder zweimal zu cuppen.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "st": 2}, {"id": "r1-26", "mode": "roester", "level": 1, "type": "mc", "topic": "Chemie", "q": "Wie viel Restfeuchte enthält frisch gerösteter Kaffee typischerweise?", "options": ["Etwa 1–3 %", "Etwa 10–12 %", "Etwa 5–7 %", "Unter 0,1 %"], "correct": 0, "explain": "Barista Hustle nennt für Röstkaffee rund 1–3 % Feuchte, je nach Kaffee und Röstung. Rohkaffee startet bei etwa 10–12 %.", "source": {"title": "Barista Hustle – Roasting Science: Feuchte im Rohkaffee", "url": "https://www.baristahustle.com/?p=407661"}, "img": "bohne", "st": 6}, {"id": "r1-27", "mode": "roester", "level": 1, "type": "mc", "topic": "Sicherheit", "q": "Wofür wird ein Afterburner (Nachverbrenner) an einer Rösterei eingesetzt?", "options": ["Um die Trommel zwischen den Chargen nachzuheizen", "Um das Chaff im Zyklon rückstandsfrei zu verbrennen", "Um Rauch und Schadstoffe in der Abluft zu verbrennen", "Um den Luftstrom durch die Trommel zu verstärken"], "correct": 2, "explain": "Afterburner, thermisch oder katalytisch, zerstören Rauch und flüchtige organische Verbindungen in der Abluft. Thermische Anlagen laufen laut Royal Coffee bei rund 700 °C (1.300 °F).", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "st": 9}, {"id": "r1-29", "mode": "roester", "level": 1, "type": "case", "topic": "Fallstudie", "q": "Was änderst du beim nächsten Cupping?", "case": {"title": "Fall · Cupping im Röstbetrieb", "facts": ["Proben morgens für den ganzen Tag vorgemahlen", "Mahlgut offen auf dem Tisch", "Cupping erst am Nachmittag"], "cup": "Alle Proben wirken flach und aromaarm"}, "options": ["Feiner mahlen und das Verhältnis Kaffee zu Wasser erhöhen", "Proben etwas dunkler rösten, damit sie mehr Körper haben", "Direkt vor dem Cupping mahlen oder das Mahlgut abdecken", "Mit heißerem Wasser aufgießen, um mehr zu extrahieren"], "correct": 2, "explain": "Gemahlener Kaffee verliert sehr schnell Gas und Aromen. Das SCA-Protokoll verlangt, unmittelbar vor dem Cupping zu mahlen oder vorgemahlene Proben abzudecken.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "sack", "st": 10}, {"id": "r1-30", "mode": "roester", "level": 1, "type": "case", "topic": "Fallstudie", "q": "Ein Mitarbeiter klagt über Kopfschmerzen. Was änderst du?", "case": {"title": "Fall · Lager für Röstkaffee", "facts": ["Offene Behälter mit frisch gerösteten Bohnen", "Mitarbeiter beugt sich zum Befüllen tief in die Behälter", "Kein CO-Melder im Raum"], "cup": "Kopfschmerzen und Schwindel nach der Schicht"}, "options": ["Behälter abdecken, nicht hineinbeugen, CO-Melder installieren", "Deckel nur nachts schließen, Rauchmelder an der Decke montieren", "Staubmaske tragen, Fenster schließen, Behälter offen lassen", "Größere Behälter wählen, Raum wärmer halten, Luft befeuchten"], "correct": 0, "explain": "Röstkaffee gast Kohlenmonoxid aus. NIOSH empfiehlt, Behälter abzudecken, Arbeiten mit dem Kopf in Bohnenbehältern zu minimieren und CO-Melder mit Alarm bei 200 ppm aufzustellen. Bei Beschwerden gehört das auch ärztlich abgeklärt.", "source": {"title": "NIOSH HHE 2016-0144-3305 – Coffee roasting and packaging facility", "url": "https://www.cdc.gov/niosh/hhe/reports/pdfs/2016-0144-3305.pdf"}, "img": "sack", "st": 10}, {"id": "r2-13", "mode": "roester", "level": 2, "type": "mc", "topic": "Chemie", "q": "Ab etwa welcher Bohnentemperatur setzen die Maillard-Reaktionen beim Rösten deutlich ein?", "options": ["Um 100 °C", "Um 200 °C", "Um 150 °C", "Um 230 °C"], "correct": 2, "explain": "Royal Coffee nennt rund 302 °F, also etwa 150 °C, als Beginn der Maillard-Phase. Dann wechseln die Bohnen sichtbar von gelb zu braun.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "bohne", "st": 2}, {"id": "r2-14", "mode": "roester", "level": 2, "type": "mc", "topic": "Chemie", "q": "Was beschreibt der Strecker-Abbau beim Rösten?", "options": ["Koffein zerfällt in der Röstwärme schrittweise zu Theobromin und CO₂", "Aminosäuren reagieren mit Carbonylverbindungen zu Aldehyden und CO₂", "Saccharose wird in der Hitze zu Glukose und Fruktose gespalten", "Chlorogensäuren zerfallen in der Hitze zu Chinasäure und Kaffeesäure"], "correct": 1, "explain": "Beim Strecker-Abbau reagiert eine Aminosäure mit einer Carbonylverbindung, es entstehen CO₂ und ein Aldehyd oder Keton. Er hängt eng mit den Maillard-Reaktionen zusammen und liefert wichtige Aromastoffe.", "source": {"title": "Sweet Maria's – Glossar: Strecker Degradation", "url": "https://library.sweetmarias.com/glossary/strecker-degradation/"}, "img": "bohne", "st": 9}, {"id": "r2-16", "mode": "roester", "level": 2, "type": "mc", "topic": "Chemie", "q": "Was passiert mit dem Trigonellin im Rohkaffee beim Rösten?", "options": ["Es wird teilweise abgebaut, unter anderem zu N-Methylpyridinium", "Es wird vollständig abgebaut, unter anderem zu Koffein und Wasser", "Es bleibt weitgehend stabil, ähnlich wie das Koffein", "Es reichert sich an, weil es aus Chlorogensäuren entsteht"], "correct": 0, "explain": "Geröstete Bohnen enthalten etwa nur noch die Hälfte des Trigonellins. Das Abbauprodukt N-Methylpyridinium nimmt mit dem Röstgrad zu.", "source": {"title": "Votavová et al. 2009, Czech J. Food Sci. – Trigonelline degradation products upon coffee roasting", "url": "https://www.agriculturejournals.cz/pdfs/cjf/2009/10/120.pdf"}, "img": "bohne", "st": 9}, {"id": "r2-17", "mode": "roester", "level": 2, "type": "mc", "topic": "Chemie", "q": "Wie verhält sich Acrylamid im Verlauf der Röstung?", "options": ["Es bildet sich langsam und steigt bis zur dunkelsten Röstung an", "Es entsteht vor allem in der Trocknungsphase und bleibt danach stabil", "Es bildet sich schnell beim Bräunen und sinkt bei dunklerer Röstung", "Es bildet sich erst im Second Crack und steigt danach stark an"], "correct": 2, "explain": "In der Bräunungsphase bildet sich Acrylamid schnell und wird bei längerer, dunklerer Röstung wieder abgebaut. Furane dagegen nehmen mit dem Röstgrad zu.", "source": {"title": "Daily Coffee News – Study: Common coffee toxicants cannot be simultaneously reduced in roasting", "url": "https://dailycoffeenews.com/2023/09/28/study-common-coffee-toxicants-cannot-be-simultaneously-reduced-in-roasting"}, "img": "kurve", "st": 10}, {"id": "r2-18", "mode": "roester", "level": 2, "type": "mc", "topic": "Rohkaffee", "q": "Ab welcher Wasseraktivität (aw) steigt bei Rohkaffee das Risiko für Schimmel und Mikroben?", "options": ["Ab etwa 0,30", "Ab etwa 0,60", "Ab etwa 0,90", "Ab etwa 0,15"], "correct": 1, "explain": "Unter etwa 0,60 aw wachsen kaum Mikroorganismen, darüber steigt das Risiko. Royal Coffee nennt Werte nahe 0,60 als guten Kompromiss für Rohkaffee.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part I: Moisture Content and Water Activity", "url": "https://royalcoffee.com/green-coffee-analytics-relevance-to-roasters-buyers-and-producers-part-i-moisture-content-and-total-water-activity/"}, "img": "sack", "st": 10}, {"id": "r2-19", "mode": "roester", "level": 2, "type": "mc", "topic": "Rohkaffee", "q": "Was gilt laut Royal Coffee für Rohkaffee mit hoher Dichte?", "options": ["Er neigt bei hoher Hitze besonders zu Scorching", "Er braucht eine längere, sanftere Trocknungsphase", "Er sollte grundsätzlich dunkler geröstet werden", "Er nimmt Wärme effizient auf und verträgt mehr Hitze"], "correct": 3, "explain": "Dichte Bohnen nehmen Wärme gut auf und leiten sie weiter, sie vertragen eine kräftigere Wärmezufuhr. Bohnen mit geringer Dichte neigen dabei eher zu Scorching und Fehlaromen.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "sack", "st": 3}, {"id": "r2-20", "mode": "roester", "level": 2, "type": "mc", "topic": "Wärme & Maschine", "q": "Was messen ET und BT an einem Röster?", "options": ["ET die Trommelwand, BT die Bohnen im Kühlsieb", "ET die Luft- bzw. Ablufttemperatur, BT das Bohnenbett", "ET die Brennerflamme, BT die Temperatur im Trichter", "ET das Bohnenbett, BT die Luft- bzw. Ablufttemperatur"], "correct": 1, "explain": "BT (Bean Temperature) kommt vom Fühler im Bohnenbett. ET (Environmental Temperature) misst meist die Luft- bzw. Abluft­temperatur, also die konvektive Wärme.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "kurve", "st": 1}, {"id": "r2-21", "mode": "roester", "level": 2, "type": "mc", "topic": "Röstfehler", "q": "Welchen Röstfehler kann eine zu langsame Trommeldrehzahl begünstigen?", "options": ["Quakers (helle Bohnen)", "Baking (flach, gebacken)", "Scorching (Brandflecken)", "Unterentwicklung (grasig)"], "correct": 2, "explain": "Dreht die Trommel zu langsam, liegen die Bohnen zu lange an der heißen Trommelwand. Royal Coffee nennt eine langsame Trommel als eine Ursache für Scorching.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "st": 3}, {"id": "r2-22", "mode": "roester", "level": 2, "type": "mc", "topic": "Röstgrad", "q": "Wie unterscheiden sich Agtron-Werte von ganzer Bohne und Mahlgut typischerweise?", "options": ["Gemahlen meist höher, Abstand bei hellen Röstungen größer", "Gemahlen meist höher, Abstand bei dunklen Röstungen größer", "Ganze Bohne meist höher, Abstand bei hellen Röstungen größer", "Gemahlen meist niedriger, Abstand bei dunklen Röstungen größer"], "correct": 0, "explain": "Coffee Review nennt als Beispiel etwa 70 ganz und 95 gemahlen bei sehr hellen Röstungen. Je dunkler die Röstung, desto kleiner wird der Abstand.", "source": {"title": "Coffee Review – Agtron Numerology", "url": "https://www.coffeereview.com/agtron-numerology/"}, "img": "bohne", "st": 10}, {"id": "r2-23", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Was änderst du bei dieser Partie?", "case": {"title": "Fall · Neue Ernte, 12,8 % Feuchte", "facts": ["Gleiches Profil wie bei der Vorgängerpartie mit 10,5 %", "Gleiche Drop-Temperatur", "Farbe ungleichmäßig"], "cup": "Weniger entwickelt, leicht grasig"}, "options": ["Höhere Charge-Temperatur, kürzere Trocknungsphase", "Früher droppen, Drop-Temperatur leicht senken", "Sanftere Anfangshitze, längere Trocknungsphase", "Mehr Luftstrom ab Start, kürzere Entwicklung"], "correct": 2, "explain": "Feuchtere Bohnen brauchen mehr Zeit und Energie für eine gleichmäßige Röstung. Royal Coffee empfiehlt geringere Anfangshitze, um die Trocknung zu verlängern.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "kurve", "st": 9}, {"id": "r2-24", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Die Röstung wirkt optisch mittel. Was änderst du?", "case": {"title": "Fall · Entkoffeinierter Kaffee", "facts": ["Drop rein nach Bohnenfarbe", "Kaum hörbarer First Crack", "Ziel: mittlere Röstung"], "cup": "Grasig, unterentwickelt"}, "options": ["Nicht nur nach Farbe droppen, Decaf sieht dunkler aus als er ist", "Früher droppen, weil Decaf nach dem Drop nachdunkelt", "Charge-Temperatur stark erhöhen, den Drop weiter nach Farbe setzen", "Mehr Luftstrom geben, damit der First Crack hörbarer wird"], "correct": 0, "explain": "Decaf wirkt bei gleichem Röstgrad dunkler und knackt oft leise. Sweet Maria's rät, damit zu rechnen, damit man ihn nicht unterentwickelt. Bohnentemperatur und Gewichtsverlust helfen zusätzlich beim Drop.", "source": {"title": "Sweet Maria's – Closeup on Roasting Decaf Coffee", "url": "https://library.sweetmarias.com/closeup-on-roasting-decaf-coffee/"}, "img": "bohne", "st": 5}, {"id": "r2-25", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Die BT-Kurve ist unbrauchbar. Was änderst du?", "case": {"title": "Fall · Sehr kleine Charge", "facts": ["Charge bei ca. 20 % der Nennkapazität", "BT springt bei jeder Gas- oder Luftänderung", "Fühlerspitze ragt sichtbar aus dem Bohnenbett"], "cup": "Röstungen schwer reproduzierbar"}, "options": ["RoR-Glättung erhöhen, damit die Kurve ruhiger wird", "Charge so groß wählen, dass der Fühler ganz bedeckt ist", "Höhere Charge-Temperatur, damit der Fühler schneller reagiert", "Gas stärker variieren, um die Reaktion besser zu sehen"], "correct": 1, "explain": "Bei sehr kleinen Chargen ist der Bohnenfühler nicht ganz bedeckt und misst vor allem heiße Luft. Barista Hustle nennt seine Lage als Untergrenze für die Chargengröße.", "source": {"title": "Barista Hustle – Roasting Science RS 4.09: Batch Size", "url": "https://baristahustle.com/?p=432443"}, "img": "kurve", "st": 4}, {"id": "r2-26", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Was änderst du?", "case": {"title": "Fall · Volle Trommel, schwacher Brenner", "facts": ["Charge auf 100 % der Herstellerangabe", "Brenner schon früh auf Maximum", "Drop erst nach 18:30"], "cup": "Flach, gebacken, kaum Süße"}, "options": ["Charge-Temperatur senken, damit die Röstung sanfter wird", "Das Ende strecken, damit sich mehr Süße entwickelt", "Trommeldrehzahl senken, damit die Bohnen mehr Kontakt haben", "Chargengröße verkleinern, damit die Röstung kürzer wird"], "correct": 3, "explain": "Die Herstellerkapazität ist oft ein theoretisches Maximum. Ist die Charge zu groß für den Brenner, dauert die Röstung zu lange und schmeckt flach und gebacken.", "source": {"title": "Barista Hustle – Roasting Science RS 4.09: Batch Size", "url": "https://baristahustle.com/?p=432443"}, "img": "trommel", "st": 4}, {"id": "r2-27", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Die Blend röstet ungleichmäßig. Was änderst du?", "case": {"title": "Fall · Espresso-Blend, gemeinsam geröstet", "facts": ["Kenia, gewaschen, sehr dicht", "Brasilien, natural, geringe Dichte", "Brasilien-Anteil zeigt dunkle Spitzen, Kenia wirkt hell"], "cup": "Teils röstig, teils grün-säuerlich"}, "options": ["Komponenten getrennt rösten und danach mischen", "Mehr Luftstrom im First Crack einsetzen", "Charge-Temperatur erhöhen, damit Kenia aufholt", "Später droppen, bis auch Kenia dunkel genug ist"], "correct": 0, "explain": "Unterschiedliche Größe, Dichte und Feuchte können im Pre-Blend die Gleichmäßigkeit stören. Getrennt rösten gibt Kontrolle über jede Komponente. Alternativ hilft eine etwas längere Trocknung.", "source": {"title": "Sweet Maria's – Blending Resources and Resourceful Blending", "url": "https://library.sweetmarias.com/blending-resources-and-resourceful-blending/"}, "img": "bohne", "st": 2}, {"id": "r2-28", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Was änderst du an der Verpackung?", "case": {"title": "Fall · Röstung bleibt zum Ausgasen offen stehen", "facts": ["Bohnen 2 Tage offen in Kisten", "Danach in Tüten ohne Ventil", "Röstung selbst sauber"], "cup": "Schnell schal und flach"}, "options": ["Länger offen ausgasen, dann in Tüten ohne Ventil", "Nach dem Abkühlen zügig in Ventiltüten verpacken", "Noch warm in Tüten ohne Ventil einschweißen", "In Tüten mit kleinen Lüftungslöchern verpacken"], "correct": 1, "explain": "Wer offen ausgasen lässt, setzt den Kaffee Sauerstoff aus und verliert Frische und Aroma. Mit Einwegventil kann man zügig verpacken: CO₂ entweicht, Sauerstoff bleibt draußen.", "source": {"title": "Plitek – One-Way Degassing Systems", "url": "https://www.plitek.com/resources/technical-resources/one-way-degassing-systems"}, "img": "sack", "st": 2}, {"id": "r2-29", "mode": "roester", "level": 2, "type": "case", "topic": "Fallstudie", "q": "Was änderst du?", "case": {"title": "Fall · Nach Wartung, Trommel dreht langsamer", "facts": ["Trommeldrehzahl deutlich unter Herstellerwert", "Charge-Temperatur und Füllmenge wie immer", "Dunkle Brandflecken auf den flachen Seiten"], "cup": "Aschig, wenig Süße"}, "options": ["Füllmenge erhöhen, damit die Bohnen dichter liegen", "Entwicklung verlängern, damit die Süße zurückkommt", "Trommeldrehzahl wieder auf den empfohlenen Wert stellen", "Abluft drosseln, damit d
