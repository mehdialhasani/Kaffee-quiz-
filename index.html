der Karamellisierung?", "options": ["Süßer, milder und völlig ohne Aroma", "Weniger süß, säuerlich-bitter, mehr Aroma", "Gleich süß, nur mit dunklerer Farbe", "Salziger und mit stärkerem Körper"], "correct": 1, "explain": "Eine Zuckerlösung schmeckt anfangs süß ohne Aroma. Mit der Karamellisierung wird sie säuerlich und leicht bitter, das Aroma wird reicher. Je länger, desto weniger süß.", "source": {"title": "Sweet Maria's – Glossar: Caramelization", "url": "https://library.sweetmarias.com/glossary/caramelization/"}, "img": "bohne", "topic": "Chemie", "st": 6}, {"id": "r2-122", "mode": "roester", "level": 2, "type": "mc", "q": "Welche Rolle spielen Melanoidine im Röstkaffee?", "options": ["Sie liefern den Großteil des Koffeins", "Sie sorgen für die fruchtige Säure", "Sie schützen das Öl vor Oxidation", "Sie geben Farbe und tragen zur Crema bei"], "correct": 3, "explain": "Melanoidine entstehen bei der Maillard-Reaktion. Laut Sweet Maria's geben sie dem Kaffee seine Farbe und tragen zur Crema beim Espresso bei.", "source": {"title": "Sweet Maria's – Glossar: Maillard", "url": "https://library.sweetmarias.com/glossary/maillard/"}, "img": "bohne", "topic": "Chemie", "st": 3}, {"id": "r2-123", "mode": "roester", "level": 2, "type": "mc", "q": "Was bezeichnet Pyrolyse beim Rösten?", "options": ["Aufnahme von Feuchte aus der Luft", "Abbau von Stoffen durch Mikroben", "Chemische Zersetzung durch Hitze", "Reaktion von Öl mit Luftsauerstoff"], "correct": 2, "explain": "Pyrolyse ist die chemische Zersetzung eines Stoffes durch Erhitzen. Sie bewirkt unter anderem Karamellisierung und CO₂-Freisetzung. Extreme Pyrolyse bis zur Verkohlung heißt Karbonisierung.", "source": {"title": "Sweet Maria's – Glossar: Pyrolysis", "url": "https://library.sweetmarias.com/glossary/pyrolysis/"}, "img": "crack", "topic": "Chemie", "st": 1}, {"id": "r2-124", "mode": "roester", "level": 2, "type": "mc", "q": "Welche Säure wird laut Royal Coffee beim Rösten im Gegensatz zu anderen kaum abgebaut?", "options": ["Essigsäure", "Zitronensäure", "Apfelsäure", "Chlorogensäure"], "correct": 0, "explain": "Royal Coffee schreibt, dass Essigsäure beim Rösten nicht abgebaut wird wie andere organische Säuren. Sie entsteht unter anderem beim Zuckerabbau.", "source": {"title": "Royal Coffee – Understanding Coffee Acidity", "url": "https://royalcoffee.com/understanding-coffee-acidity-what-it-is-why-it-matters/"}, "img": "bohne", "topic": "Chemie", "st": 5}, {"id": "r2-125", "mode": "roester", "level": 2, "type": "mc", "q": "Welchen Agtron-Bereich ordnet Coffee Review einer mittleren Röstung (Medium) zu?", "options": ["60–70", "80–90", "40–50", "25–35"], "correct": 0, "explain": "Coffee Review nutzt den Mittelwert aus ganzer Bohne und Mahlgut: Medium liegt bei 60–70, Medium-Light bei 70–80, Medium-Dark bei 50–60.", "source": {"title": "Coffee Review – Roast Definitions (Agtron)", "url": "https://www.coffeereview.com/roast-definitions/"}, "img": "bohne", "topic": "Röstgrad", "st": 5}, {"id": "r2-126", "mode": "roester", "level": 2, "type": "mc", "q": "Wann misst Coffee Review die Agtron-Werte der Proben?", "options": ["Erst nach der Verkostung", "Vor der Verkostung als Hinweis", "Nur bei auffälligen Proben", "Während der Röstung im Trier"], "correct": 0, "explain": "Die Röstfarbe soll die Sensorik nicht beeinflussen. Deshalb misst Coffee Review die Agtron-Werte erst nach der Verkostung, um Eindrücke aus der Tasse zu bestätigen.", "source": {"title": "Coffee Review – Agtron Numerology", "url": "https://www.coffeereview.com/agtron-numerology/"}, "img": "bohne", "topic": "Cupping & Qualität", "st": 5}, {"id": "r2-127", "mode": "roester", "level": 2, "type": "mc", "q": "Wie sieht wet-hulled Rohkaffee (Giling Basah) typischerweise aus?", "options": ["Dunkel opalgrün mit wenig Silberhaut", "Hellgelb mit viel anhaftendem Pergament", "Bläulich-grau mit dicker Fruchthaut", "Weißlich mit vielen hohlen Floatern"], "correct": 0, "explain": "Sweet Maria's beschreibt wet-hulled Kaffee als dunkel opalgrün mit wenig Silberhäutchen. In der Tasse ist er meist säurearm, erdig und körperreich.", "source": {"title": "Sweet Maria's – Glossar: Wet-Hulled", "url": "https://library.sweetmarias.com/glossary/wet-hulled/"}, "img": "bohne", "topic": "Rohkaffee", "st": 6}, {"id": "r2-128", "mode": "roester", "level": 2, "type": "mc", "q": "Welchen Anteil am Gewicht frisch gerösteten Kaffees macht CO₂ etwa aus?", "options": ["Etwa 10–12 %", "Etwa 1–2 %", "Etwa 0,01 %", "Etwa 20–25 %"], "correct": 1, "explain": "Smrke et al. nennen etwa 1–2 % des Gewichts frisch gerösteten Kaffees als CO₂. Ein Großteil davon entweicht in den Tagen und Wochen nach der Röstung.", "source": {"title": "Smrke et al. 2017 – Time-resolved gravimetric method to assess degassing of roasted coffee (ZHAW)", "url": "https://digitalcollection.zhaw.ch/bitstream/11475/12175/2/2017_Smrke-etal_Roasted-coffe-degassing-time-resolved-gravimetry.pdf"}, "img": "sack", "topic": "Ruhezeit & Lagerung", "st": 2}, {"id": "r2-129", "mode": "roester", "level": 2, "type": "mc", "q": "Warum sollte man laut Scott Rao bei steigender BT chargen statt bei fallender?", "options": ["Um die Röstung künstlich zu verlängern", "Um die Trommel nicht unnötig zu belasten", "Um mehr Chaff aus der Trommel zu lösen", "Um die Kurve optisch zu glätten"], "correct": 1, "explain": "In Raos Between-Batch-Protokoll wird nach dem Tiefpunkt Gas gegeben, sodass die BT in etwa 60–90 Sekunden die Charge-Temperatur erreicht. Geladen wird bei steigender Temperatur, um die Trommel nicht zu stressen.", "source": {"title": "Cropster – Between Batch Protocol for Coffee Roasters", "url": "https://www.cropster.com/blog-post/between-batch-protocol-for-coffee-roasters-the-whats-whys-and-hows-from-experts/"}, "img": "kurve", "topic": "Wärme & Maschine", "st": 6}, {"id": "r2-130", "mode": "roester", "level": 2, "type": "mc", "q": "Was ist der Zweck eines Between-Batch-Protokolls?", "options": ["Die Röstzeit jeder Charge möglichst verkürzen", "Jede Charge unter gleichen Startbedingungen beginnen", "Den Röster zwischen Chargen ganz abzuschalten", "Jede Charge mit anderer Temperatur zu starten"], "correct": 1, "explain": "Das Protokoll setzt die Wärmeenergie des Rösters nach jeder Charge zurück, damit die nächste unter gleichen Bedingungen startet. Laut Rao reicht dafür gleiche Temperatur allein nicht, auch die Pause muss passen.", "source": {"title": "Cropster – Between Batch Protocol for Coffee Roasters", "url": "https://www.cropster.com/blog-post/between-batch-protocol-for-coffee-roasters-the-whats-whys-and-hows-from-experts/"}, "img": "kurve", "topic": "Wärme & Maschine", "st": 3}, {"id": "r2-131", "mode": "roester", "level": 2, "type": "mc", "q": "Welche Brandschutz-Nachrüstung empfiehlt Scott Rao für Trommelröster?", "options": ["Wasserleitungen mit Düse an Front und Zyklon", "Einen Sandeimer neben dem Kühlsieb", "Eine zweite Abluftklappe am Kamin", "Einen Rauchmelder direkt über dem Trichter"], "correct": 0, "explain": "Rao empfiehlt, Wasserleitungen mit Absperrventil und Sprühdüse in Frontplatte und Zyklon einzubauen. Das kostet einmalig rund 300 US$. Die Düsen sollte man täglich freispülen.", "source": {"title": "Scott Rao – The Most Important Thing Few Roasters Bother to Do (Brandschutz)", "url": "https://scottrao.com/blog/fire"}, "img": "trommel", "topic": "Sicherheit", "st": 6}, {"id": "r2-132", "mode": "roester", "level": 2, "type": "mc", "q": "Wie oft sollte das Abluftsystem laut Royal New York gründlich gereinigt werden?", "options": ["Nach jeder Charge", "Etwa vierteljährlich", "Etwa alle fünf Jahre", "Nur nach einem Brand"], "correct": 1, "explain": "Royal New York nennt eine vierteljährliche Reinigung des Abluftsystems mit Kaminbürsten und Schabern, dazu eine professionelle Inspektion. Täglich wird der Chaff-Behälter geleert.", "source": {"title": "Royal New York – Roaster Cleaning and Maintenance", "url": "https://www.royalny.com/?p=137392"}, "img": "trommel", "topic": "Sicherheit", "st": 10}, {"id": "r2-133", "mode": "roester", "level": 2, "type": "mc", "q": "Womit beginnt Sweet Maria's eine klassische Espresso-Blend?", "options": ["Mit fast der Hälfte säurearmem Süd- oder Mittelamerikaner", "Mit fast der Hälfte Kenia für eine kräftige Säure", "Mit fast der Hälfte Robusta für viel Crema", "Mit fast der Hälfte Sumatra für schweren Körper"], "correct": 0, "explain": "Für ein klassisches Espresso-Profil empfiehlt Sweet Maria's als Basis fast zur Hälfte einen säurearmen, körperreichen Süd- oder Mittelamerikaner. Der Rest sind Highlight-Kaffees.", "source": {"title": "Sweet Maria's – Blending Resources and Resourceful Blending", "url": "https://library.sweetmarias.com/blending-resources-and-resourceful-blending/"}, "img": "sack", "topic": "Rohkaffee", "st": 8}, {"id": "r2-134", "mode": "roester", "level": 2, "type": "mc", "q": "In welcher Reihenfolge empfiehlt Scott Rao, Tasse und Röstkurve zu bewerten?", "options": ["Erst blind cuppen, dann die Kurven ansehen", "Erst die Kurven ansehen, dann gezielt cuppen", "Nur die Kurven bewerten, Cupping weglassen", "Kurven und Tasse immer gleichzeitig ansehen"], "correct": 0, "explain": "Rao rät, immer blind zu cuppen und Notizen zu machen. Erst danach vergleicht man die Ergebnisse mit den RoR-Kurven, damit die Kurve die Bewertung nicht beeinflusst.", "source": {"title": "Scott Rao – What is Baked Coffee?", "url": "https://scottrao.com/blog/2018/2/24/what-is-baked-coffee-most-pros-dont-know"}, "img": "kurve", "topic": "Cupping & Qualität", "st": 3}, {"id": "r2-135", "mode": "roester", "level": 2, "type": "mc", "q": "Was setzt die Maillard-Reaktion laut Barista Hustle in der Bohne voraus?", "options": ["Die Bohne muss vollständig trocken sein", "Es muss noch etwas Feuchte vorhanden sein", "Der Second Crack muss begonnen haben", "Die Chlorogensäuren müssen abgebaut sein"], "correct": 1, "explain": "Maillard-Reaktionen können nur ablaufen, solange noch etwas Feuchte vorhanden ist. Die Farbänderung am Ende der Trocknungsphase geht auf sie zurück.", "source": {"title": "Barista Hustle – Roasting Science RS 3.01: Moisture Levels During Roasting", "url": "https://www.baristahustle.com/?p=407661"}, "img": "bohne", "topic": "Chemie", "st": 7}, {"id": "r2-136", "mode": "roester", "level": 2, "type": "mc", "q": "Du brauchst 1,0 kg Röstkaffee und rechnest mit 15 % Röstverlust. Wie viel Rohkaffee wiegst du ein?", "options": ["Etwa 1,15 kg", "Etwa 1,05 kg", "Etwa 0,85 kg", "Etwa 1,18 kg"], "correct": 3, "explain": "Bei 15 % Verlust bleiben 85 % übrig. 1,0 kg / 0,85 ergibt etwa 1,18 kg Rohkaffee. Einfach 15 % aufzuschlagen (1,15 kg) reicht nicht.", "source": {"title": "Royal Coffee – Understanding Roast Yield and Loss", "url": "https://royalcoffee.com/understanding-roast-yield-and-loss/"}, "img": "sack", "topic": "Röstgrad", "st": 2}, {"id": "r2-137", "mode": "roester", "level": 2, "type": "mc", "q": "Wie viel Röstkaffee verbraucht die Qualitätskontrolle bei Royal Coffee etwa pro Charge?", "options": ["Etwa 20 g", "Etwa 2 kg", "Etwa 200 g", "Etwa 5 g"], "correct": 2, "explain": "Royal nennt etwa 100 g für die Colortrack-Messung und etwa 100 g fürs Cupping. Bei kleinen Chargen erhöhen diese rund 200 g den Gesamtverlust spürbar.", "source": {"title": "Royal Coffee – Understanding Roast Yield and Loss", "url": "https://royalcoffee.com/understanding-roast-yield-and-loss/"}, "img": "sack", "topic": "Cupping & Qualität", "st": 10}, {"id": "r2-138", "mode": "roester", "level": 2, "type": "mc", "q": "Mit welchem Ziel wurde laut Perfect Daily Grind früher bei Espresso-Röstungen „gebacken“?", "options": ["Um die Säure zu dämpfen", "Um mehr Frucht zu erhalten", "Um die Röstzeit zu verkürzen", "Um mehr Koffein zu bilden"], "correct": 0, "explain": "Früher ließ man die RoR bei Espresso-Röstungen stocken, um die Säure zu dämpfen. Evan Gilman von Royal nennt gebackene Aromen heute einen sensorischen Röstfehler.", "source": {"title": "Perfect Daily Grind – Roasting for Filter and Espresso at Home (Royal Coffee)", "url": "https://perfectdailygrind.com/2020/09/roasting-for-filter-and-espresso-at-home-royal-coffee/"}, "img": "kurve", "topic": "Röstfehler", "st": 5}, {"id": "r2-139", "mode": "roester", "level": 2, "type": "mc", "q": "Was unterscheidet einen RTD-Fühler von einem Thermoelement?", "options": ["Er misst über die Spannung zweier Metalle", "Er misst die Temperatur berührungslos per Infrarot", "Er misst über einen temperaturabhängigen Widerstand", "Er misst über die Ausdehnung einer Flüssigkeit"], "correct": 2, "explain": "Ein RTD (Widerstandsthermometer) nutzt einen Draht, dessen elektrischer Widerstand sich vorhersagbar mit der Temperatur ändert. Ein Thermoelement erzeugt dagegen eine Spannung an einer Metallverbindung.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "kurve", "topic": "Wärme & Maschine", "st": 8}, {"id": "r2-140", "mode": "roester", "level": 2, "type": "mc", "q": "Welche Rohkaffee-Eigenschaft beeinflusst laut Barista Hustle das Röstverhalten wohl am stärksten?", "options": ["Die Bohnenfarbe", "Die Sackgröße", "Das Pflückdatum", "Der Feuchtegehalt"], "correct": 3, "explain": "Von allen Bohneneigenschaften hat die Feuchte wohl den größten Einfluss. Sie bestimmt, wie schnell Wärme in die Bohne gelangt und wie viel Energie die Röstung braucht.", "source": {"title": "Barista Hustle – Roasting Science RS 3.01: Moisture Levels During Roasting", "url": "https://www.baristahustle.com/?p=407661"}, "img": "sack", "topic": "Rohkaffee", "st": 3}, {"id": "r2-141", "mode": "roester", "level": 2, "type": "mc", "q": "Wie lange sollte die Pause zwischen zwei Chargen laut Rob Hoos (Cropster) in der Regel höchstens dauern?", "options": ["Unter 5 Minuten", "Etwa 15–20 Minuten", "Mindestens 30 Minuten", "Über eine Stunde"], "correct": 0, "explain": "Hoos rät zu weniger als 5 Minuten zwischen den Chargen. Länger nur beim Wechsel von einer sehr großen zu einer sehr kleinen Charge.", "source": {"title": "Cropster – Between Batch Protocol for Coffee Roasters", "url": "https://www.cropster.com/blog-post/between-batch-protocol-for-coffee-roasters-the-whats-whys-and-hows-from-experts/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 5}, {"id": "r2-142", "mode": "roester", "level": 2, "type": "mc", "q": "Wie fährt man einen Trommelröster am Tagesende laut Cropster-Experten herunter?", "options": ["Gas aus, Luftstrom sofort abstellen", "Gas aus, Luftstrom weiterlaufen lassen", "Gas an, Trommeltür weit öffnen", "Alles sofort aus, Tür geschlossen"], "correct": 1, "explain": "Gas abschalten und die Luft weiterlaufen lassen. Ein Loring braucht etwa 10 Minuten, ein Probat 30–40 Minuten. Zu kurzes Abkühlen kann Bauteile schneller verschleißen.", "source": {"title": "Cropster – Between Batch Protocol for Coffee Roasters", "url": "https://www.cropster.com/blog-post/between-batch-protocol-for-coffee-roasters-the-whats-whys-and-hows-from-experts/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 6}, {"id": "r2-143", "mode": "roester", "level": 2, "type": "mc", "q": "Wie misst man die frei geschüttete Dichte von Rohkaffee?", "options": ["Bohnen in Wasser legen und nur die Floater zählen", "Messzylinder füllen, Kaffee wiegen, durch Volumen teilen", "Bohnen rösten und den Gewichtsverlust vergleichen", "Bohnen mahlen und den Siebrückstand bestimmen"], "correct": 1, "explain": "Man füllt ein Gefäß bis zu einem festen Volumen, wiegt den Kaffee und teilt das Gewicht durch das Volumen. Die ISO empfiehlt diese Methode, weil sie dem Setzen im Sack entspricht.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part IV: Density", "url": "https://royalcoffee.com/green-coffee-analytics-part-iv-density/"}, "img": "sack", "topic": "Rohkaffee", "st": 8}, {"id": "r2-144", "mode": "roester", "level": 2, "type": "mc", "q": "Was gilt laut Scott Rao für die Ziel-DTR, wenn der Brenner im Verhältnis zur Charge sehr stark ist?", "options": ["Das DTR-Ziel sollte eher niedriger liegen", "Das DTR-Ziel sollte deutlich höher liegen", "Die DTR spielt dann keinerlei Rolle mehr", "Die DTR muss dann exakt 25 % betragen"], "correct": 0, "explain": "Rao schreibt, dass bei hoher Brennerleistung im Verhältnis zur Chargengröße das DTR-Ziel sinken sollte. Als Beispiel nennt er etwa 15 % für 10 kg in einem Probat UG22.", "source": {"title": "Scott Rao – Development Time Ratio", "url": "https://www.scottrao.com/blog/2016/8/25/development-time-ratio"}, "img": "kurve", "topic": "Phasen & Crack", "st": 8}, {"id": "r2-145", "mode": "roester", "level": 2, "type": "case", "q": "Wie passt du Luft und Gas an?", "case": {"title": "Fall · Viel Luft, viel Gas", "facts": ["Luftklappe weit offen", "Brenner läuft dauerhaft sehr hoch", "Kein Rauch in der Trommel"], "cup": "Röstig, wenig Delikatesse"}, "options": ["Luftstrom weiter öffnen, Gas noch höher stellen", "Luftstrom senken, damit weniger Gas nötig ist", "Trommeldrehzahl senken, Gas unverändert", "Charge-Temperatur erhöhen, Luft unverändert"], "correct": 1, "explain": "Zu viel Luft zieht Wärme ab, also muss mehr Gas nachgelegt werden. Im direkt beheizten Röster wird die Trommel dadurch heißer, mehr Konduktion bringt röstige Noten. Ideal ist gerade genug Luft für Rauch und Chaff.", "source": {"title": "Barista Hustle – Tuning Airflow in a Drum Coffee Roaster", "url": "https://www.baristahustle.com/?p=450903"}, "img": "trommel", "topic": "Fallstudie", "st": 9}, {"id": "r2-146", "mode": "roester", "level": 2, "type": "case", "q": "Wie sorgst du für gleiche Startbedingungen?", "case": {"title": "Fall · Chargen am Produktionstag", "facts": ["Pause zwischen Chargen mal 2, mal 9 Minuten", "Charge-Temperatur jeweils gleich", "Kurven der Chargen weichen deutlich ab"]}, "options": ["Charge-Temperatur je Charge frei nach Gefühl wählen", "Festes Protokoll mit gleicher Pause und gleichem Ablauf", "Zwischen den Chargen den Röster ganz abschalten", "Abweichungen nur am Ende über die Drop-Zeit ausgleichen"], "correct": 1, "explain": "Gleiche Temperatur beim Laden reicht nicht: Laut Rao kann die gespeicherte Wärme trotzdem abweichen. Ein Between-Batch-Protokoll mit gleichem Ablauf und Mindestpause sorgt für gleiche Startbedingungen.", "source": {"title": "Cropster – Between Batch Protocol for Coffee Roasters", "url": "https://www.cropster.com/blog-post/between-batch-protocol-for-coffee-roasters-the-whats-whys-and-hows-from-experts/"}, "img": "kurve", "topic": "Fallstudie", "st": 4}, {"id": "r2-147", "mode": "roester", "level": 2, "type": "case", "q": "Wie kühlst du zwischen den Chargen richtig ab?", "case": {"title": "Fall · Tür offen zum Abkühlen", "facts": ["Nach dem Drop bleibt die Trommeltür offen", "So soll die BT schneller sinken", "Startwerte der nächsten Charge wirken unplausibel"]}, "options": ["Tür noch weiter öffnen, damit es schneller geht", "Den Bohnenfühler während der Pause herausziehen", "Die nächste Charge einfach früher laden", "Tür sofort schließen, Abkühlen über Gas und Pause steuern"], "correct": 3, "explain": "Cooper (Cropster) rät davon ab, die Tür zum Kühlen zu öffnen, das liefert irreführende Fühlerwerte. Rao schließt die Tür direkt nach dem Drop und senkt die Energie über das Gas.", "source": {"title": "Cropster – Between Batch Protocol for Coffee Roasters", "url": "https://www.cropster.com/blog-post/between-batch-protocol-for-coffee-roasters-the-whats-whys-and-hows-from-experts/"}, "img": "trommel", "topic": "Fallstudie", "st": 4}, {"id": "r2-148", "mode": "roester", "level": 2, "type": "case", "q": "Woran orientierst du dich beim Drop?", "case": {"title": "Fall · Äthiopien, natural", "facts": ["Bohnen wirken früh dunkel", "Zielröstung: hell bis mittel", "Bisher nach Farbe gedroppt"], "cup": "Teils unterentwickelt, getreidig"}, "options": ["Noch früher droppen, sobald es dunkel wirkt", "Nur nach dem Klang, Temperatur ignorieren", "Mehr an Temperatur und Zeit als an der Farbe", "Allein nach der Farbe der ganzen Bohne"], "correct": 2, "explain": "Honey- und Natural-Kaffees können laut Sweet Maria's bei gleichem Röstgrad dunkler aussehen, weil die Frucht beim Trocknen am Samen bleibt. Wer nur nach Farbe droppt, riskiert Unterentwicklung.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "bohne", "topic": "Fallstudie", "st": 9}, {"id": "r2-149", "mode": "roester", "level": 2, "type": "case", "q": "Wie passt du das Profil an diese Partie an?", "case": {"title": "Fall · Sumatra, wet-hulled, niedrige Lage", "facts": ["Profil von einem gewaschenen Hochland-Kenia übernommen", "Schnell und sehr hell gedroppt"], "cup": "Dünn, krautig, unausgewogen"}, "options": ["Noch schneller und heller rösten", "Mehr Starthitze, gleicher Drop", "Gleiches Profil, länger ruhen lassen", "Langsamer und etwas dunkler rösten"], "correct": 3, "explain": "Royal New York nennt als Faustregel: Gewaschene Hochlandkaffees röstet man am schnellsten und hellsten, wet-hulled Kaffees aus niedrigen Lagen am langsamsten und dunkelsten.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "kurve", "topic": "Fallstudie", "st": 7}, {"id": "r2-150", "mode": "roester", "level": 2, "type": "case", "q": "Wie passt du die Wärmezufuhr an?", "case": {"title": "Fall · Sehr große Bohnen", "facts": ["Großbohnige Partie (Maragogype)", "Aggressive Wärmezufuhr wie bei kleinen Bohnen", "Außen dunkel, Mahlgut deutlich heller"], "cup": "Röstig und zugleich grün"}, "options": ["Noch kräftigere Hitze, früher Drop", "Mehr Luftstrom, gleiche Wärmezufuhr", "Höhere Drehzahl, gleiche Wärmezufuhr", "Sanftere Hitze über längere Zeit"], "correct": 3, "explain": "Bei großen Bohnen braucht die Wärme länger bis in den Kern. Royal New York empfiehlt sanftere Hitze über längere Zeit, kleine Bohnen vertragen aggressiveres Rösten.", "source": {"title": "Royal New York – How to use Roast Profile Guides (Dichte & Feuchte)", "url": "https://www.royalny.com/?p=139569"}, "img": "bohne", "topic": "Fallstudie", "st": 7}, {"id": "r2-151", "mode": "roester", "level": 2, "type": "case", "q": "Wie bewertest du den Befund?", "case": {"title": "Fall · Burundi, gewaschen", "facts": ["Einzelne Tassen riechen stark nach roher Kartoffel", "Die anderen Tassen sind sauber", "Röstung unauffällig"]}, "options": ["Unterentwicklung durch einen zu frühen Drop", "Baking durch eine stockende RoR", "Scorching durch eine zu langsame Trommel", "Kartoffeldefekt im Rohkaffee, kein Röstfehler"], "correct": 3, "explain": "Der Kartoffeldefekt betrifft Kaffees aus Ruanda, Burundi und der Region um den Kivusee. Er tritt in einzelnen Bohnen auf und ist erst nach dem Rösten erkennbar.", "source": {"title": "Sweet Maria's – Glossar: Potato Defect", "url": "https://library.sweetmarias.com/glossary/potato-defect/"}, "img": "bohne", "topic": "Fallstudie", "st": 8}, {"id": "r2-152", "mode": "roester", "level": 2, "type": "case", "q": "Wie ordnest du den Röstverlust ein?", "case": {"title": "Fall · Decaf, Ziel: mittel", "facts": ["Röstverlust 18 %", "Bohnen sehen sehr dunkel aus", "Kaum hörbarer First Crack"]}, "options": ["Für Decaf ist das eine sehr helle Röstung", "Der Verlust sagt bei Decaf nichts aus", "Für Decaf ist das eher schon dunkel", "Decaf verliert immer genau 18 %"], "correct": 2, "explain": "Decaf verliert laut Sweet Maria's in der Regel weniger Gewicht als normaler Kaffee. 18 % wären für Decaf schon recht dunkel, auch wenn die Bohnen ohnehin dunkler aussehen.", "source": {"title": "Sweet Maria's – Closeup on Roasting Decaf Coffee", "url": "https://library.sweetmarias.com/closeup-on-roasting-decaf-coffee/"}, "img": "sack", "topic": "Fallstudie", "st": 7}, {"id": "r2-153", "mode": "roester", "level": 2, "type": "case", "q": "Wie lang und wie hell röstest du den Robusta?", "case": {"title": "Fall · Robusta für Espresso", "facts": ["Robusta extrem hell und schnell geröstet", "Drop direkt nach Beginn des First Crack"], "cup": "Grün, scharf, unangenehm"}, "options": ["Länger rösten, nicht superhell droppen", "Noch heller und schneller rösten", "Nur mehr Luftstrom, gleicher Drop", "Gleiche Röstung, nur länger ruhen"], "correct": 0, "explain": "Sweet Maria's rät bei Robusta zu einer längeren Röstung und warnt vor superhellen Röstungen.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "kurve", "topic": "Fallstudie", "st": 7}, {"id": "r2-154", "mode": "roester", "level": 2, "type": "case", "q": "Wie änderst du den Sumatra-Anteil?", "case": {"title": "Fall · Espresso-Blend mit 35 % Sumatra", "facts": ["Sumatra soll Körper und Würze bringen", "Die anderen Komponenten gehen unter"], "cup": "Schwer, erdig, eintönig"}, "options": ["Sumatra-Anteil auf etwa 50 % erhöhen", "Sumatra dunkler rösten, Anteil gleich", "Sumatra-Anteil auf höchstens etwa 20 % senken", "Eine weitere erdige Komponente ergänzen"], "correct": 2, "explain": "Sumatra und andere Indonesier haben schweren, teils öligen Körper. Laut Sweet Maria's überdecken mehr als etwa 20 % die anderen Komponenten.", "source": {"title": "Sweet Maria's – Blending Resources and Resourceful Blending", "url": "https://library.sweetmarias.com/blending-resources-and-resourceful-blending/"}, "img": "sack", "topic": "Fallstudie", "st": 8}, {"id": "r2-155", "mode": "roester", "level": 2, "type": "case", "q": "Wie viele Komponenten empfiehlst du?", "case": {"title": "Fall · Neue Hausblend", "facts": ["Sechs Komponenten geplant", "Bei zwei ist unklar, was sie beitragen"]}, "options": ["Auf 2–3 Komponenten mit klarer Rolle reduzieren", "Weitere Komponenten ergänzen, bis es passt", "Alle sechs gleich dunkel rösten und mischen", "Die zwei unklaren Kaffees doppelt dosieren"], "correct": 0, "explain": "Joseph Oosten (Sucafina) erreicht nach eigener Erfahrung fast immer das Ziel mit 2–3 Komponenten. Ab vier Komponenten sollte man fragen, was jede beiträgt und ob sie nötig ist.", "source": {"title": "Sucafina – Roasting (and Blending) for Espresso", "url": "https://sucafina.com/na/news/roasting-and-blending-for-espresso"}, "img": "sack", "topic": "Fallstudie", "st": 4}, {"id": "r2-156", "mode": "roester", "level": 2, "type": "case", "q": "Wann bewertest du Süße und Clean Cup?", "case": {"title": "Fall · Cupping, Süße bewertet", "facts": ["Süße und Clean Cup direkt nach dem Break bewertet", "Tassen noch sehr heiß"], "cup": "Bewertungen schwanken"}, "options": ["Süße schon beim Aufgießen am Duft", "Alles bei möglichst heißer Tasse", "Süße und Clean Cup erst bei kühler Tasse", "Süße nur in der ersten Minute"], "correct": 2, "explain": "Mercanta bewertet heiß (etwa 70 °C) Flavour und Abgang, warm (etwa 60 °C) Säure, Körper und Balance, kühl (etwa 40 °C) Gleichmäßigkeit, Clean Cup und Süße.", "source": {"title": "Coffee Hunter / Mercanta – The Journey of a Green Coffee Sample", "url": "https://coffeehunter.com/knowledge-centre/from-the-lab-the-journey-of-a-green-coffee-sample/"}, "img": "sack", "topic": "Fallstudie", "st": 3}, {"id": "r2-157", "mode": "roester", "level": 2, "type": "case", "q": "Welches Wasser nutzt du fürs Cupping?", "case": {"title": "Fall · Cupping-Wasser", "facts": ["Leitungswasser mit etwa 400 ppm TDS", "Proben wirken flach und kalkig"]}, "options": ["Destilliertes Wasser mit 0 ppm nutzen", "Wasser mit etwa 150 ppm TDS nutzen", "Wasser mit etwa 600 ppm TDS nutzen", "Das Wasser nur heißer aufgießen"], "correct": 1, "explain": "Das SCA-Protokoll nennt 150 ppm TDS als ideal und 75–250 ppm als akzeptabel. 400 ppm liegen deutlich darüber.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "sack", "topic": "Fallstudie", "st": 7}, {"id": "r2-158", "mode": "roester", "level": 2, "type": "case", "q": "Wann misst du die Röstfarbe?", "case": {"title": "Fall · Röstfarbe direkt nach dem Drop", "facts": ["Probe noch warm aus dem Kühlsieb gemessen", "Werte schwanken stark zwischen Chargen"]}, "options": ["Nach 30 Min. bis 4 h bei Raumtemperatur messen", "Direkt im Trier während der Röstung messen", "Erst 2–3 Wochen nach der Röstung messen", "Die Probe vor dem Messen im Ofen erwärmen"], "correct": 0, "explain": "Das SCA-Protokoll misst die Röstfarbe am Mahlgut bei Raumtemperatur, 30 Minuten bis 4 Stunden nach der Röstung. So sind Werte vergleichbar.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "bohne", "topic": "Fallstudie", "st": 4}, {"id": "r2-159", "mode": "roester", "level": 2, "type": "case", "q": "Was kann der Temperaturanstieg bedeuten?", "case": {"title": "Fall · Chaff-Sammler wird heiß", "facts": ["Temperatur am Chaff-Sammler wird mitgeloggt", "Sonst stabil, jetzt deutlich über dem Normalbereich"]}, "options": ["Ein Zeichen für besonders gute Entwicklung", "Der Fühler ist einfach verschmutzt", "Ein Brand könnte bevorstehen, sofort prüfen", "Die Charge war zu klein für die Trommel"], "correct": 2, "explain": "Rao rät, die Zyklontemperatur zu loggen und einen Alarm zu setzen. Sie ist beim Rösten meist stabil. Ein Anstieg außerhalb des Normalbereichs kann einen drohenden Brand anzeigen.", "source": {"title": "Scott Rao – The Most Important Thing Few Roasters Bother to Do (Brandschutz)", "url": "https://scottrao.com/blog/fire"}, "img": "trommel", "topic": "Fallstudie", "st": 4}, {"id": "r2-160", "mode": "roester", "level": 2, "type": "case", "q": "Woran orientierst du dich, wenn der First Crack kaum hörbar ist?", "case": {"title": "Fall · Natural aus großer Höhe", "facts": ["Trocken aufbereitet, hoch gewachsen", "First Crack kaum hörbar", "Röster wartet aufs Knacken, Drop zu dunkel"]}, "options": ["Nur am Klang, also weiter auf lautes Knacken warten", "An der Rauchmenge aus dem Abluftrohr allein", "An Temperatur, Zeit und Farbe statt nur am Klang", "An der Drehzahl der Trommel im Moment des Drops"], "correct": 2, "explain": "Manche trocken aufbereiteten Hochlandkaffees knacken laut Sweet Maria's nur leise und kurz, einige kaum hörbar. Wer nur auf den Klang wartet, röstet sie leicht zu dunkel.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Fallstudie", "st": 10}, {"id": "r2-161", "mode": "roester", "level": 2, "type": "case", "q": "Wie stufst du die Probe ein?", "case": {"title": "Fall · Green Grading", "facts": ["Eine vollständig schwarze Bohne gefunden", "Sonst nur drei Bruchbohnen", "Cupping sauber"]}, "options": ["Nicht Specialty Grade, da ein Primärdefekt vorliegt", "Specialty Grade, weil unter 5 Defekten", "Specialty Grade, weil das Cupping sauber ist", "Nicht bewertbar, weil Bruch nie zählt"], "correct": 0, "explain": "Specialty Grade erlaubt keine Primärdefekte und höchstens 5 volle Defekte. Eine ganz schwarze Bohne ist ein Primärdefekt, also reicht es nicht für Specialty Grade.", "source": {"title": "FAO – Coffee grading and defect classification", "url": "https://www.fao.org/4/X6939E/X6939e13.htm"}, "img": "sack", "topic": "Fallstudie", "st": 10}, {"id": "r2-162", "mode": "roester", "level": 2, "type": "case", "q": "Woran richtest du das Profil aus?", "case": {"title": "Fall · Profil vom Partnerröster", "facts": ["Kurve eines anderen Röstertyps exakt nachgefahren", "Andere Fühlerdicke als im Original", "Tasse trifft das Ziel nicht"]}, "options": ["Die Kurve noch exakter Grad für Grad nachfahren", "Phasenzeiten und Endfarbe angleichen, nicht die Kurve", "Den Fühler entfernen und nach Gefühl rösten", "Nur die Gesamtzeit angleichen, Farbe egal"], "correct": 1, "explain": "Laut Cropster sind Kurven verschiedener Maschinen wegen unterschiedlicher Fühler nicht vergleichbar. Entscheidend sind gleiche Phasenzeiten und gleiche Endfarbe.", "source": {"title": "Cropster – Using Rate of Rise to Your Advantage in a Production Setting", "url": "https://www.cropster.com/blog-post/using-rate-of-rise-to-your-advantage-in-a-production-setting/"}, "img": "kurve", "topic": "Fallstudie", "st": 9}, {"id": "r2-163", "mode": "roester", "level": 2, "type": "case", "q": "Wie erklärst du den Unterschied?", "case": {"title": "Fall · Gleiche Farbe, anderer Geschmack", "facts": ["Zwei Röstungen mit gleichem Agtron-Wert", "Eine in 10 Minuten, eine in 18 Minuten geröstet"], "cup": "Deutlich verschiedene Aromen"}, "options": ["Der Farbmesser ist sicher defekt", "Die Tassen wurden falsch vorbereitet", "Das kann bei gleicher Farbe nicht sein", "Gleiche Farbe heißt nicht gleiche Chemie"], "correct": 3, "explain": "Kaffee lässt sich auf sehr verschiedenen Wegen auf dieselbe Farbe rösten. Gleiche Farbe bedeutet laut Sweet Maria's nicht gleiche Chemie. Schnelle und langsame Röstungen schmecken unterschiedlich.", "source": {"title": "Sweet Maria's – Roasting Chemistry and Profile Roasting (PDF)", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Roasting-Chemistry-and-Profile-Roasting.pdf"}, "img": "kurve", "topic": "Fallstudie", "st": 7}, {"id": "r2-164", "mode": "roester", "level": 2, "type": "case", "q": "Wie lagerst du dieses Microlot?", "case": {"title": "Fall · Sehr teures Microlot", "facts": ["Preis weit über 18 US$ pro kg", "Röstungen über zwei Jahre verteilt geplant"]}, "options": ["Offen im Jutesack ohne Liner lagern", "Im warmen Röstraum neben dem Röster", "Alles sofort rösten und so lagern", "Einfrieren, um die Qualität zu halten"], "correct": 3, "explain": "George Howell friert besondere Partien über 8 US$/lb (18 US$/kg) ein. Laut Barista Hustle lässt sich die Haltbarkeit so bis zu 6 Jahre ohne merklichen Verlust verlängern, Einfrieren kostet aber Energie.", "source": {"title": "Barista Hustle – Storing Green Coffee", "url": "https://www.baristahustle.com/?p=437739"}, "img": "sack", "topic": "Fallstudie", "st": 7}, {"id": "r2-165", "mode": "roester", "level": 2, "type": "case", "q": "Wie bremst du die Röstung im Fluid Bed?", "case": {"title": "Fall · Fluid-Bed-Röster, Röstung zu schnell", "facts": ["Röster will den Luftstrom senken, um zu bremsen", "Bohnen fallen dann nicht mehr in Schwebe"]}, "options": ["Luftstrom senken, bis die Bohnen liegen", "Die Charge vergrößern, die Luft gleich", "Die Bohnen zwischendurch herausnehmen", "Luft lassen, über die Lufttemperatur steuern"], "correct": 3, "explain": "Im Fluid-Bed-Röster bestimmt die Fluidisierung den Luftstrom. Er lässt sich nicht einfach senken. Gesteuert wird über die Temperatur der einströmenden Luft.", "source": {"title": "Barista Hustle – Roasting Science: Pros and Cons of Fluid-Bed Roasting", "url": "https://www.baristahustle.com/?p=392996"}, "img": "trommel", "topic": "Fallstudie", "st": 4}, {"id": "r2-166", "mode": "roester", "level": 2, "type": "case", "q": "Welche Drehzahl stellst du ein?", "case": {"title": "Fall · 15-kg-Röster, 10-kg-Charge", "facts": ["Röster mit 15 kg Nennkapazität", "Geplant sind 10-kg-Chargen"]}, "options": ["Die Empfehlung für 10 kg, etwa 56–60 U/min", "Die Empfehlung für 15 kg, etwa 50–54 U/min", "Die Empfehlung für 5 kg, etwa 60–70 U/min", "Die Empfehlung für 30 kg, etwa 46–50 U/min"], "correct": 1, "explain": "Die optimale Drehzahl hängt laut Barista Hustle von der Trommelgröße ab, nicht von der Chargengröße. Für eine 15-kg-Trommel nennt Barista Hustle etwa 50–54 U/min.", "source": {"title": "Barista Hustle – Drum Speed (Trommeldrehzahl)", "url": "https://www.baristahustle.com/?p=442005"}, "img": "trommel", "topic": "Fallstudie", "st": 9}, {"id": "r2-167", "mode": "roester", "level": 2, "type": "case", "q": "Was verursacht die Krater?", "case": {"title": "Fall · Krater auf den Bohnen", "facts": ["Runde, scheibenförmige Abplatzungen an der Oberfläche", "Partie schlecht getrocknet", "Sehr hohe Starthitze"]}, "options": ["Zu langsame Trommel und überfüllte Trommel", "Insektenfraß im Ursprungsland", "Zu lange Ruhezeit nach der Röstung", "Eingeschlossene Feuchte oder Gas bei zu viel Hitze"], "correct": 3, "explain": "Royal Coffee nennt solche Krater Blowouts. Sie entstehen, wenn eingeschlossene Feuchte oder Gas nach zu viel Hitze austritt, oder bei schlecht getrocknetem Rohkaffee.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "bohne", "topic": "Fallstudie", "st": 8}, {"id": "r2-168", "mode": "roester", "level": 2, "type": "case", "q": "Wie stimmst du die Röstgrade der Komponenten ab?", "case": {"title": "Fall · Espresso-Blend, getrennt geröstet", "facts": ["Eine Komponente City, eine Full City+", "Danach gemischt"], "cup": "Unruhig als Espresso, Mahlgut sehr uneinheitlich"}, "options": ["Den Unterschied der Röstgrade noch vergrößern", "Die Blend fein mahlen und länger ruhen lassen", "Die hellere Komponente ganz weglassen", "Komponenten auf ähnlichere Röstgrade bringen"], "correct": 3, "explain": "Kleine Röstunterschiede funktionieren laut Sweet Maria's als Espresso. Große Unterschiede wie City zu Full City+ ergeben uneinheitliches Mahlgut und passen eher zu Filter.", "source": {"title": "Sweet Maria's – Blending Resources and Resourceful Blending", "url": "https://library.sweetmarias.com/blending-resources-and-resourceful-blending/"}, "img": "bohne", "topic": "Fallstudie", "st": 9}, {"id": "r2-169", "mode": "roester", "level": 2, "type": "case", "q": "Wie deutest du den lauten First Crack?", "case": {"title": "Fall · Neue Partie, lauter First Crack", "facts": ["First Crack deutlich lauter als üblich", "Partie aus niedriger Lage, schon länger im Lager"]}, "options": ["Hinweis auf besonders frische, sehr dichte Bohnen", "Hinweis auf ältere, trockenere oder weniger dichte Bohnen", "Hinweis auf zu wenig Luftstrom in der Trommel", "Hinweis auf einen defekten Bohnenfühler"], "correct": 1, "explain": "Ein lauter First Crack kann laut Sweet Maria's auf älteren oder trockeneren Kaffee hinweisen, oder auf weniger dichte, oft tiefer gewachsene Bohnen.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Fallstudie", "st": 9}, {"id": "r3-101", "mode": "roester", "level": 3, "type": "mc", "q": "Ab welcher Bohnentemperatur wurde Kaffee in einer DSC-Messung (Abdul Ghani et al. 2015) exotherm?", "options": ["Ab etwa 100 °C", "Ab etwa 165 °C", "Ab etwa 230 °C", "Ab etwa 130 °C"], "correct": 1, "explain": "In der Messung wurde der Kaffee ab etwa 165 °C exotherm, mit einem Maximum bei etwa 210 °C. Andere Schätzungen nennen etwa 140–190 °C.", "source": {"title": "Barista Hustle – Roasting Science: Exothermy and Endothermy", "url": "https://www.baristahustle.com/?p=414943"}, "img": "kurve", "topic": "Chemie", "st": 6}, {"id": "r3-102", "mode": "roester", "level": 3, "type": "mc", "q": "Wie stark veränderte die Berücksichtigung exothermer Reaktionen in einem Röstmodell die End-Bohnentemperatur?", "options": ["Um weniger als 5 °C", "Um etwa 20–30 °C", "Um etwa 50 °C", "Um mehr als 80 °C"], "correct": 0, "explain": "Im Modell von Abdul Ghani et al. (2019) änderte die Exothermie die Endtemperatur um weniger als 5 °C. Die Autoren schließen, dass sie die Röstkurve nur wenig prägt.", "source": {"title": "Barista Hustle – Roasting Science: Exothermy and Endothermy", "url": "https://www.baristahustle.com/?p=414943"}, "img": "kurve", "topic": "Chemie", "st": 10}, {"id": "r3-103", "mode": "roester", "level": 3, "type": "mc", "q": "Worauf gehen Plateau, Crash und Flick in der Kurve laut Barista Hustle am ehesten zurück?", "options": ["Auf exotherme Zuckerreaktionen", "Auf Schwankungen im Gasdruck", "Auf Änderungen der Wasserverdampfung", "Auf Strahlung der Trommelwand"], "correct": 2, "explain": "Exotherme Reaktionen beeinflussen die Kurve laut Barista Hustle wohl nur wenig. Plateau, Crash und Flick spiegeln am ehesten Veränderungen in der Wasserverdampfung wider.", "source": {"title": "Barista Hustle – Roasting Science RS 3.12: Recap and Glossary", "url": "https://www.baristahustle.com/?p=416661"}, "img": "kurve", "topic": "Wärme & Maschine", "st": 3}, {"id": "r3-104", "mode": "roester", "level": 3, "type": "mc", "q": "Welche Rolle spielt der Glasübergang im Modell von Fadai et al. (2019) beim First Crack?", "options": ["Die ganze Bohne wird zugleich glashart und starr", "Er tritt erst gegen Ende des Second Crack auf", "Feuchter Kern gummiartig, trockene Hülle spröde", "Hülle wird gummiartig, Kern bleibt völlig starr"], "correct": 2, "explain": "Mehr Feuchte senkt die Glasübergangstemperatur. Der feuchte Kern wird gummiartig und dehnt sich unter Dampfdruck, die trockene Außenschicht ist spröde und hält dagegen. Diese Spannung könnte den First Crack auslösen.", "source": {"title": "Barista Hustle – Roasting Science: First Crack and Second Crack", "url": "https://www.baristahustle.com/?p=413043"}, "img": "crack", "topic": "Phasen & Crack", "st": 7}, {"id": "r3-105", "mode": "roester", "level": 3, "type": "mc", "q": "Wie hoch kann der Dampfdruck im Inneren der Bohne laut Bonnländer et al. steigen?", "options": ["Auf etwa 1 bar", "Auf etwa 25 bar", "Auf etwa 250 bar", "Auf etwa 3 bar"], "correct": 1, "explain": "Über 100 °C steigt der Dampfdruck in der Bohne auf bis zu etwa 25 bar. Der hohe Druck hebt den Siedepunkt des Wassers, ähnlich wie im Kessel einer Espressomaschine.", "source": {"title": "Barista Hustle – Roasting Science: The Evaporation Front", "url": "https://www.baristahustle.com/?p=409922"}, "img": "crack", "topic": "Phasen & Crack", "st": 10}, {"id": "r3-106", "mode": "roester", "level": 3, "type": "mc", "q": "Wie viel Energie braucht das Verdampfen von Wasser im Vergleich zum Erhitzen von 0 auf 100 °C?", "options": ["Etwa die Hälfte", "Etwa gleich viel", "Etwa das Fünffache", "Etwa das Fünfzigfache"], "correct": 2, "explain": "Die Verdampfungswärme ist etwa fünfmal so groß wie die Energie, um Wasser von 0 auf 100 °C zu erhitzen. An der Verdampfungsfront fließt darum viel Energie ins Verdampfen statt in Temperaturanstieg.", "source": {"title": "Barista Hustle – Roasting Science: The Evaporation Front", "url": "https://www.baristahustle.com/?p=409922"}, "img": "bohne", "topic": "Wärme & Maschine", "st": 1}, {"id": "r3-107", "mode": "roester", "level": 3, "type": "mc", "q": "Wie viel Wasser gab eine Trommelröstung in James Davisons Abluftmessung insgesamt ab?", "options": ["Etwa 4 %, ausschließlich freies Bohnenwasser", "Etwa 30 %, vor allem aus dem Kaffeeöl", "Etwa 16 %, teils erst beim Rösten gebildet", "Etwa 1 %, fast nur in der Trocknungsphase"], "correct": 2, "explain": "Davison maß etwa 16 % des Rohgewichts als abgegebenes Wasser, ein erheblicher Teil entstand erst durch Reaktionen. Am First Crack zeigte sich eine deutliche Verdampfungsspitze.", "source": {"title": "Barista Hustle – Roasting Science: The Evaporation Front", "url": "https://www.baristahustle.com/?p=409922"}, "img": "kurve", "topic": "Chemie", "st": 10}, {"id": "r3-108", "mode": "roester", "level": 3, "type": "mc", "q": "Warum erwärmt sich die Bohnenmitte laut Barista Hustle langsamer als die Oberfläche?", "options": ["Die trockene, poröse Außenschicht isoliert", "Die feuchte Mitte reflektiert die Wärme", "Die Silberhaut leitet Wärme nach außen ab", "Das Öl im Kern kühlt die Mitte aktiv"], "correct": 0, "explain": "Die trockene Außenschicht leitet Wärme schlecht, gasgefüllte Poren isolieren zusätzlich. An der Verdampfungsfront geht viel Energie ins Verdampfen. So entsteht ein Temperaturgefälle von außen nach innen.", "source": {"title": "Barista Hustle – Roasting Science: The Evaporation Front", "url": "https://www.baristahustle.com/?p=409922"}, "img": "bohne", "topic": "Wärme & Maschine", "st": 1}, {"id": "r3-109", "mode": "roester", "level": 3, "type": "mc", "q": "Wie wirkt sich höhere Feuchte auf die spezifische Wärmekapazität von Rohkaffee aus?", "options": ["Sie sinkt, die Bohne erwärmt sich leichter", "Sie bleibt unabhängig von der Feuchte gleich", "Sie steigt, die Bohne braucht mehr Energie pro Grad", "Sie steigt nur bei Robusta, nicht bei Arabica"], "correct": 2, "explain": "Wasser hat eine hohe spezifische Wärme, mehr Feuchte erhöht also die des Rohkaffees. Schätzungen reichen von etwa 1,0 bis 1,9 kJ kg⁻¹ K⁻¹.", "source": {"title": "Barista Hustle – Roasting Science RS 4.05: Specific Heat and Conductivity", "url": "https://baristahustle.com/?p=419890"}, "img": "bohne", "topic": "Wärme & Maschine", "st": 3}, {"id": "r3-110", "mode": "roester", "level": 3, "type": "mc", "q": "Was fasst die „effektive spezifische Wärme“ einer Bohne beim Rösten zusammen?", "options": ["Nur die Wärmeleitfähigkeit der Silberhaut", "Nur die Strahlungswärme der Trommelwand", "Materialwärme plus Verdampfung und Reaktionen", "Nur die Temperatur der einströmenden Luft"], "correct": 2, "explain": "Exo- und endotherme Vorgänge lassen sich beim Rösten nicht getrennt messen. Die effektive spezifische Wärme bündelt Materialwärme, Verdampfung und Reaktionswärme in einem Wert.", "source": {"title": "Barista Hustle – Roasting Science RS 4.05: Specific Heat and Conductivity", "url": "https://baristahustle.com/?p=419890"}, "img": "bohne", "topic": "Wärme & Maschine", "st": 7}, {"id": "r3-111", "mode": "roester", "level": 3, "type": "mc", "q": "Bei welcher DTR tritt der Flick in typischen 10–14-Minuten-Trommelröstungen laut Rao meist auf?", "options": ["Bei etwa 3–5 % DTR", "Bei etwa 30–35 % DTR", "Direkt am Turning Point", "Bei etwa 16–17 % DTR"], "correct": 3, "explain": "Rao beobachtet den Flick meist bei etwa 16–17 % DTR, gemessen mit seinem ET-RoR-Trick für den First Crack. Früh im First Crack gedroppte Chargen flicken dagegen selten.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "topic": "Röstfehler", "st": 7}, {"id": "r3-112", "mode": "roester", "level": 3, "type": "mc", "q": "Warum ist ein Flick durch steigende Trommeltemperatur laut Rao besonders schädlich?", "options": ["Die Bohnen verlieren dabei schlagartig ihr ganzes CO₂", "Der Bohnenfühler zeigt dann viel zu niedrige Werte", "Die Bohnen werden dabei innen dunkler als außen", "Die heiße Wand dunkelt vor allem die äußeren Schichten"], "correct": 3, "explain": "Eine heißere Trommeloberfläche dunkelt nur die äußeren Schichten nach, die Röstung wird uneinheitlich. Geflickte Röstungen ergaben bei Rao mehr Feinanteil in der dunkelsten Farbe.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "topic": "Röstfehler", "st": 8}, {"id": "r3-113", "mode": "roester", "level": 3, "type": "mc", "q": "Warum crasht die RoR laut Rao oft rund um den First Crack?", "options": ["Der Brenner regelt im First Crack automatisch ab", "Die Bohnen geben kühlere Feuchte aus dem Kern ab", "Die Trommel dreht im First Crack deutlich langsamer", "Das Chaff verstopft dann den Bohnenfühler"], "correct": 1, "explain": "Rund um den First Crack setzen die Bohnen Feuchte aus dem Kern frei. Diese kühlere Feuchte kann die RoR-Kurve schnell fallen lassen.", "source": {"title": "Scott Rao – What is Baked Coffee?", "url": "https://scottrao.com/blog/2018/2/24/what-is-baked-coffee-most-pros-dont-know"}, "img": "kurve", "topic": "Röstfehler", "st": 3}, {"id": "r3-114", "mode": "roester", "level": 3, "type": "mc", "q": "Coffee Review notiert Agtron 55/66. Welcher Röstgrad ergibt sich daraus?", "options": ["Light (Mittelwert über 80)", "Dark (Mittelwert unter 50)", "Medium (Mittelwert 60,5)", "Medium-Dark (nur 55 zählt)"], "correct": 2, "explain": "Die erste Zahl ist die ganze Bohne, die zweite das Mahlgut. Coffee Review mittelt beide: (55 + 66) / 2 = 60,5, das liegt im Medium-Bereich 60–70.", "source": {"title": "Coffee Review – Roast Definitions (Agtron)", "url": "https://www.coffeereview.com/roast-definitions/"}, "img": "bohne", "topic": "Röstgrad", "st": 6}, {"id": "r3-115", "mode": "roester", "level": 3, "type": "mc", "q": "Welche frei geschüttete Dichte gilt bei Royal Coffee als Faustregel für „dicht“?", "options": ["Über etwa 0,69 g/ml", "Unter etwa 0,50 g/ml", "Über etwa 1,20 g/ml", "Genau 1,00 g/ml"], "correct": 0, "explain": "Royals Faustregel: etwa 0,64 g/ml ist eher gering, etwa 0,67 g/ml durchschnittlich, über 0,69 g/ml dicht.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part IV: Density", "url": "https://royalcoffee.com/green-coffee-analytics-part-iv-density/"}, "img": "sack", "topic": "Rohkaffee", "st": 6}, {"id": "r3-116", "mode": "roester", "level": 3, "type": "mc", "q": "Warum liegt die Verdrängungsdichte von Rohkaffee über 1 g/ml, die frei geschüttete nur bei etwa 0,65–0,7 g/ml?", "options": ["Beim Verdrängen saugt die Bohne Wasser auf", "Frei geschüttet verliert die Bohne Feuchte", "Die Schüttung enthält Luft zwischen den Bohnen", "Die Verdrängung misst nur die Silberhaut"], "correct": 2, "explain": "Die Verdrängung misst das Volumen der Bohnen selbst, darum sinkt Rohkaffee im Wasser. Frei geschüttet zählt die Luft zwischen den Bohnen mit, wie im Sack. Die ISO empfiehlt diese Methode.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part IV: Density", "url": "https://royalcoffee.com/green-coffee-analytics-part-iv-density/"}, "img": "sack", "topic": "Rohkaffee", "st": 1}, {"id": "r3-117", "mode": "roester", "level": 3, "type": "mc", "q": "Wie unterscheiden sich Arabica und Robusta im Gehalt an Oligosacchariden (v. a. Saccharose)?", "options": ["Arabica etwa 3–7 %, Robusta etwa 6–9 %", "Arabica etwa 6–9 %, Robusta etwa 3–7 %", "Beide etwa gleich, rund 15–20 %", "Beide sehr gering, unter 0,5 %"], "correct": 1, "explain": "Barista Hustle nennt für Oligosaccharide etwa 6–9 % (Arabica) und 3–7 % (Robusta) der Trockenmasse, davon über 90 % Saccharose. Zucker sind wichtige Aromavorstufen.", "source": {"title": "Barista Hustle – Roasting Science RS 2.01: Green Bean Composition", "url": "https://www.baristahustle.com/?p=398140"}, "img": "bohne", "topic": "Chemie", "st": 7}, {"id": "r3-118", "mode": "roester", "level": 3, "type": "mc", "q": "Wie unterscheiden sich Arabica und Robusta laut Literaturwerten im Trigonellin-Gehalt?", "options": ["Arabica enthält mehr, etwa 0,8–1,1 %", "Robusta enthält etwa doppelt so viel", "Beide enthalten genau gleich viel", "Nur Robusta enthält Trigonellin"], "correct": 0, "explain": "Votavová et al. zitieren 7,9–10,6 g/kg für Arabica und 6,6–6,8 g/kg für Robusta. Arabica enthält also mehr Trigonellin.", "source": {"title": "Votavová et al. 2009, Czech J. Food Sci. – Trigonelline degradation products upon coffee roasting", "url": "https://www.agriculturejournals.cz/pdfs/cjf/2009/10/120.pdf"}, "img": "bohne", "topic": "Chemie", "st": 7}, {"id": "r3-119", "mode": "roester", "level": 3, "type": "mc", "q": "Aus welchen Vorstufen entsteht Acrylamid beim Rösten?", "options": ["Koffein und Chlorogensäure", "Triglyceride und Wasser", "Reduzierende Zucker und Asparagin", "Trigonellin und Saccharose"], "correct": 2, "explain": "Acrylamid bildet sich aus reduzierenden Zuckern und der Aminosäure Asparagin. Seine Konzentration erreicht mitten in der Röstung ein Maximum und nimmt danach ab.", "source": {"title": "Sweet Maria's – Roasting Chemistry and Profile Roasting (PDF)", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Roasting-Chemistry-and-Profile-Roasting.pdf"}, "img": "bohne", "topic": "Chemie", "st": 1}, {"id": "r3-120", "mode": "roester", "level": 3, "type": "mc", "q": "Wie entstehen Pyrazine beim Rösten?", "options": ["Durch den Abbau von Koffein in der Hitze", "Über Maillard-Reaktionen aus α-Aminoketonen", "Durch Oxidation des Kaffeeöls an der Luft", "Durch Zerfall von Zellulose im Second Crack"], "correct": 1, "explain": "Pyrazine entstehen über Maillard-Reaktionen durch Kondensation von α-Aminoketonen. Sie tragen nussige, röstige Aromen bei.", "source": {"title": "Sweet Maria's – Roasting Chemistry and Profile Roasting (PDF)", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Roasting-Chemistry-and-Profile-Roasting.pdf"}, "img": "bohne", "topic": "Chemie", "st": 3}, {"id": "r3-121", "mode": "roester", "level": 3, "type": "mc", "q": "Woraus entstehen phenolische Röststoffe wie Guajakol?", "options": ["Aus dem Abbau von Trigonellin", "Aus dem Abbau von Asparagin", "Aus dem Abbau von Chlorogensäuren", "Aus dem Abbau von Koffein"], "correct": 2, "explain": "Beim Abbau der Chlorogensäuren entstehen Phenole wie Guajakol, außerdem Chinasäure und bittere Lactone.", "source": {"title": "Sweet Maria's – Roasting Chemistry and Profile Roasting (PDF)", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Roasting-Chemistry-and-Profile-Roasting.pdf"}, "img": "bohne", "topic": "Chemie", "st": 2}, {"id": "r3-122", "mode": "roester", "level": 3, "type": "mc", "q": "Woraus entstehen Pyridine im Röstkaffee?", "options": ["Aus dem Abbau von Saccharose", "Aus dem Abbau von Trigonellin", "Aus dem Abbau von Cellulose", "Aus dem Abbau von Lipiden"], "correct": 1, "explain": "Sweet Maria's führt Pyridine auf den Abbau von Trigonellin zurück. Trigonellin wird beim Rösten etwa zur Hälfte abgebaut.", "source": {"title": "Sweet Maria's – Roasting Chemistry and Profile Roasting (PDF)", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Roasting-Chemistry-and-Profile-Roasting.pdf"}, "img": "bohne", "topic": "Chemie", "st": 2}, {"id": "r3-123", "mode": "roester", "level": 3, "type": "mc", "q": "Warum verändert eine heißere, kürzere Röstung bei gleicher Farbe das Aromaprofil?", "options": ["Reaktionen reagieren unterschiedlich stark auf Temperatur", "Alle Reaktionen beschleunigen sich genau gleich stark", "Hitze stoppt die Maillard-Reaktion vollständig", "Die Farbe misst nur Aroma, nicht die Chemie"], "correct": 0, "explain": "Nach Arrhenius steigen Reaktionsraten mit der Temperatur, aber je nach Aktivierungsenergie unterschiedlich stark. Darum verschiebt sich das Verhältnis der Produkte zwischen HTST- und LTLT-Röstungen.", "source": {"title": "Sweet Maria's – Roasting Chemistry and Profile Roasting (PDF)", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Roasting-Chemistry-and-Profile-Roasting.pdf"}, "img": "kurve", "topic": "Chemie", "st": 4}, {"id": "r3-124", "mode": "roester", "level": 3, "type": "mc", "q": "Welcher EU-Richtwert (Benchmark) für Acrylamid gilt für Röstkaffee?", "options": ["400 µg/kg", "850 µg/kg", "40 µg/kg", "4.000 µg/kg"], "correct": 0, "explain": "Die Verordnung (EU) 2017/2158 setzt 400 µg/kg für Röstkaffee und 850 µg/kg für Instantkaffee. Richtwerte messen, wie gut Minderungsmaßnahmen greifen.", "source": {"title": "Food Standards Agency – Acrylamide Survey 2023 (PDF)", "url": "https://www.food.gov.uk/sites/default/files/media/document/Acrylamide%20FSIS%202023%20-%20Clean%20%26%20Cleared.pdf"}, "img": "sack", "topic": "Chemie", "st": 10}, {"id": "r3-125", "mode": "roester", "level": 3, "type": "mc", "q": "Wie setzte sich das beim Mahlen ganzer Bohnen freigesetzte Gas laut Clarke & McRae zusammen?", "options": ["Etwa 87 % CO₂, 7 % CO, 5 % N₂", "Etwa 87 % N₂, 7 % CO₂, 5 % O₂", "Etwa 50 % CO₂, 50 % Wasserdampf", "Etwa 95 % O₂, 5 % CO₂"], "correct": 0, "explain": "Smrke et al. zitieren 87 % CO₂, 7,3 % CO und 5,3 % N₂. Der CO-Anteil erklärt, warum Mahlbereiche bei der CO-Überwachung wichtig sind.", "source": {"title": "Smrke et al. 2017 – Time-resolved gravimetric method to assess degassing of roasted coffee (ZHAW)", "url": "https://digitalcollection.zhaw.ch/bitstream/11475/12175/2/2017_Smrke-etal_Roasted-coffe-degassing-time-resolved-gravimetry.pdf"}, "img": "sack", "topic": "Sicherheit", "st": 10}, {"id": "r3-126", "mode": "roester", "level": 3, "type": "mc", "q": "Wie viele Between-Batch-Protokolle braucht man laut Rao bei zwei Chargengrößen?", "options": ["Eines", "Drei", "Zwei", "Vier"], "correct": 1, "explain": "Rao empfiehlt für jede Chargengröße ein eigenes Between-Batch-Protokoll und nennt für zwei Größen ausdrücklich drei, weil auch der Wechsel zwischen den Größen ein eigenes Vorgehen braucht.", "source": {"title": "Cropster – Between Batch Protocol for Coffee Roasters", "url": "https://www.cropster.com/blog-post/between-batch-protocol-for-coffee-roasters-the-whats-whys-and-hows-from-experts/"}, "img": "kurve", "topic": "Wärme & Maschine", "st": 6}, {"id": "r3-127", "mode": "roester", "level": 3, "type": "mc", "q": "Warum übertragen Fluid-Bed-Röster laut Goldfine (1944) Wärme so effizient?", "options": ["Hoher Luftstrom bläst die isolierende Luftschicht weg", "Die Bohnen liegen dauerhaft auf heißem Metall", "Die Luft ist dort feuchter und leitet besser", "Infrarotstrahlung trifft direkt auf die Bohnen"], "correct": 0, "explain": "Ein hoher Luftstrom entfernt die Grenzschicht aus Luft um jede Bohne, die sonst isolieren würde. Zusammen mit kurzer Kontaktzeit an Oberflächen erlaubt das sehr schnelle Röstungen.", "source": {"title": "Barista Hustle – Roasting Science: Pros and Cons of Fluid-Bed Roasting", "url": "https://www.baristahustle.com/?p=392996"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 7}, {"id": "r3-128", "mode": "roester", "level": 3, "type": "mc", "q": "Wie beschreibt Talor Browne den Unterschied zwischen Probat- und Diedrich-Trommel?", "options": ["Probat stabil und träge, Diedrich reaktiver mit Scorching-Risiko", "Probat reaktiver mit Scorching-Risiko, Diedrich stabil und träge", "Beide reagieren gleich, nur die Brenner sind verschieden", "Beide sind Heißluftröster ohne nennenswerte Konduktion"], "correct": 0, "explain": "Die große Wärmemasse der Probat-Trommel gibt eine stabile Umgebung, bestimmt aber den Röstplan. Die dünnere Diedrich-Trommel mit starken Brennern reagiert schneller, riskiert aber Scorching.", "source": {"title": "Barista Hustle – Roasting Science: Three Perspectives on Air Roasting", "url": "https://www.baristahustle.com/?p=394746"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 9}, {"id": "r3-129", "mode": "roester", "level": 3, "type": "mc", "q": "Welche Verbindungen mit karamelliger, leicht verbrannter Note entstehen laut Sweet Maria's bei der Karamellisierung?", "options": ["Phenole wie Guajakol", "Alkaloide wie Koffein", "Diketone wie Diacetyl", "Furane wie Furfural"], "correct": 3, "explain": "Bei der Karamellisierung, die etwa bei 150–180 °C beginnt, spaltet Zucker Wasser ab und bildet Furfuryl-Verbindungen. Diese Furane schmecken karamellig, leicht verbrannt und etwas fleischig.", "source": {"title": "Sweet Maria's – Glossar: Caramelization", "url": "https://library.sweetmarias.com/glossary/caramelization/"}, "img": "bohne", "topic": "Chemie", "st": 7}, {"id": "r3-130", "mode": "roester", "level": 3, "type": "mc", "q": "Welche Chargen flicken laut Rao nur selten?", "options": ["Früh im First Crack gedroppte Chargen", "Bis in den Second Crack geröstete Chargen", "Chargen mit Gaserhöhung im First Crack", "Chargen mit sehr frühem RoR-Crash"], "correct": 0, "explain": "Früh im First Crack gedroppte Chargen flicken laut Rao selten. Dunklere Röstungen brauchen Flick-Management, ein früher Crash und mehr Gas im First Crack fördern den Flick.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "topic": "Röstfehler", "st": 3}, {"id": "r3-131", "mode": "roester", "level": 3, "type": "mc", "q": "Wie hilft schnelles Abkühlen laut De Monte et al. zusätzlich dem Aroma?", "options": ["Kalte Luft bindet zusätzliche Aromastoffe", "Die Bohne nimmt dabei gezielt Wasser auf", "Der Innendruck sinkt und die Poren schließen sich", "Das Chaff legt sich als Schutzschicht darüber"], "correct": 2, "explain": "Abkühlen senkt laut De Monte et al. den Druck in der Bohne und schließt ihre Poren, das hält Aroma zurück. Zudem verdampfen Aromastoffe bei hoher Temperatur schneller.", "source": {"title": "Barista Hustle – Roasting Science RS 4.13: Cooling", "url": "https://baristahustle.com/?p=465630"}, "img": "trommel", "topic": "Ruhezeit & Lagerung", "st": 1}, {"id": "r3-132", "mode": "roester", "level": 3, "type": "mc", "q": "Was zeigte Royals Vergleich derselben Partie in GrainPro und in Jute?", "options": ["Jute trockener und dichter (11,4 vs. 12,1 %)", "GrainPro trockener und dichter (11,4 vs. 12,1 %)", "Kein Unterschied in Feuchte und Dichte", "GrainPro feuchter, aber deutlich dichter"], "correct": 1, "explain": "Im GrainPro-Beutel lag die Feuchte bei 11,4 %, im Jutesack bei 12,1 %. Die frei geschüttete Dichte war in GrainPro höher (0,673 vs. 0,659 g/ml). Der Test war klein.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part IV: Density", "url": "https://royalcoffee.com/green-coffee-analytics-part-iv-density/"}, "img": "sack", "topic": "Rohkaffee", "st": 7}, {"id": "r3-133", "mode": "roester", "level": 3, "type": "mc", "q": "Warum braucht ein langer, schmaler 15-kg-Joper eine höhere Drehzahl als ein flacherer Probat UG-15?", "options": ["Joper-Röster haben grundsätzlich schwächere Brenner", "Längere Trommeln fassen mehr Kaffee pro Charge", "Die optimale Drehzahl hängt vom Trommeldurchmesser ab", "Schmale Trommeln brauchen weniger Luftstrom"], "correct": 2, "explain": "Hersteller nutzen unterschiedliche Trommelproportionen. Bei gleicher Kapazität kann der Durchmesser variieren, und die optimale Drehzahl richtet sich nach dem Durchmesser.", "source": {"title": "Barista Hustle – Drum Speed (Trommeldrehzahl)", "url": "https://www.baristahustle.com/?p=442005"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 8}, {"id": "r3-134", "mode": "roester", "level": 3, "type": "mc", "q": "Wie zählt das Brasil-/New-York-System eine Bohne mit mehreren Defekten?", "options": ["Alle Defekte werden einzeln addiert", "Sie zählt pauschal als fünf volle Defekte", "Sie wird beim Grading gar nicht gewertet", "Nur der am höchsten gewichtete Defekt zählt"], "correct": 3, "explain": "Im Brasil-System zählt bei mehreren Defekten an einer Bohne nur der mit dem höchsten Gewicht.", "source": {"title": "FAO – Coffee grading and defect classification", "url": "https://www.fao.org/4/X6939E/X6939e13.htm"}, "img": "sack", "topic": "Rohkaffee", "st": 7}, {"id": "r3-135", "mode": "roester", "level": 3, "type": "mc", "q": "Wie viele volle Defekte erlaubt die SCAA-Klasse „Exchange Grade“ in 300 g?", "options": ["0–5", "9–23", "24–86", "Über 86"], "correct": 1, "explain": "SCAA-Klassen: Specialty bis 5, Premium bis 8, Exchange 9–23 volle Defekte. 24–86 gilt als Below Standard, darüber Off Grade.", "source": {"title": "FAO – Coffee grading and defect classification", "url": "https://www.fao.org/4/X6939E/X6939e13.htm"}, "img": "sack", "topic": "Cupping & Qualität", "st": 9}, {"id": "r3-136", "mode": "roester", "level": 3, "type": "mc", "q": "Woraus entsteht Schwefelwasserstoff (H₂S) beim Rösten?", "options": ["Aus Koffein oder Trigonellin", "Aus Saccharose oder Glukose", "Aus Cystein oder Methionin", "Aus Chinasäure oder Kaffeesäure"], "correct": 2, "explain": "Sweet Maria's führt H₂S auf die schwefelhaltigen Aminosäuren Cystein und Methionin zurück. Schwefelverbindungen prägen viele Röstaromen.", "source": {"title": "Sweet Maria's – Roasting Chemistry and Profile Roasting (PDF)", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Roasting-Chemistry-and-Profile-Roasting.pdf"}, "img": "bohne", "topic": "Chemie", "st": 6}, {"id": "r3-137", "mode": "roester", "level": 3, "type": "mc", "q": "Aus welchen Vorstufen entsteht das Röstaroma 2-Furfurylthiol (Furfurylmercaptan)?", "options": ["Aus Abbauprodukten von Koffein", "Aus Abbauprodukten von Pentosen", "Aus Abbauprodukten von Lipiden", "Aus Abbauprodukten von Cellulose"], "correct": 1, "explain": "Beim Abbau von Pentosen entstehen Furfural und Furfurylalkohol. Daraus bildet sich die schwefelhaltige Schlüsselverbindung 2-Furfurylthiol.", "source": {"title": "Sweet Maria's – Roasting Chemistry and Profile Roasting (PDF)", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Roasting-Chemistry-and-Profile-Roasting.pdf"}, "img": "bohne", "topic": "Chemie", "st": 10}, {"id": "r3-138", "mode": "roester", "level": 3, "type": "mc", "q": "Welche Röstfehler treten in Heißluftröstern laut Barista Hustle deutlich seltener auf?", "options": ["Unterentwicklung bei sehr hellen Röstungen", "Oberflächenverbrennungen wie Scorching und Tipping", "Quakers aus unreifen, hellen Bohnen", "Baggy-Noten aus zu lange gelagerten Säcken"], "correct": 1, "explain": "Heißluftröster übertragen fast alle Wärme per Konvektion. Oberflächenverbrennungen sind seltener, Jorge Verdú berichtet, nie Scorching oder Tipping gehabt zu haben.", "source": {"title": "Barista Hustle – Roasting Science: Three Perspectives on Air Roasting", "url": "https://www.baristahustle.com/?p=394746"}, "img": "trommel", "topic": "Röstfehler", "st": 3}, {"id": "r3-139", "mode": "roester", "level": 3, "type": "mc", "q": "Welchen NIOSH-Richtwert (REL) gibt es für 2,3-Pentandion über eine Schicht?", "options": ["93 ppm", "0,9 ppb", "930 ppb", "9,3 ppb"], "correct": 3, "explain": "NIOSH empfiehlt für 2,3-Pentandion 9,3 ppb als Schichtmittelwert und 31 ppb für 15 Minuten. Für Diacetyl gelten 5 ppb bzw. 25 ppb.", "source": {"title": "LeBouf et al. 2020, Frontiers in Public Health – Diacetyl, 2,3-Pentanedione in Coffee Roasting Facilities", "url": "https://www.frontiersin.org/articles/10.3389/fpubh.2020.561740/pdf"}, "img": "sack", "topic": "Sicherheit", "st": 10}, {"id": "r3-140", "mode": "roester", "level": 3, "type": "mc", "q": "Was ist der Drum Gap und warum ist er wichtig?", "options": ["Spalt Trommel–Frontplatte, Fehlstellung stört oder schadet", "Abstand Brenner–Trommel, bestimmt allein die Röstfarbe", "Luftspalt im Zyklon, regelt die Chaff-Abscheidung", "Lücke im Kühlsieb, lässt kleine Bohnen durchfallen"], "correct": 0, "explain": "Der Drum Gap ist der präzise eingestellte Spalt zwischen Trommel und Frontplatte. Ist er falsch ausgerichtet, kann das den Betrieb stören oder zu Schäden führen.", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://royalcoffee.com/roast-glossary/"}, "img": "trommel", "topic": "Wärme & Maschine", "st": 1}, {"id": "r3-141", "mode": "roester", "level": 3, "type": "mc", "q": "Was beeinflusst laut Royal Coffee die Messwerte von Wasseraktivitätsmessgeräten?", "options": ["Nur die Siebgröße der Bohnenprobe", "Nur die Farbe des grünen Rohkaffees", "Nur die Höhenlage der Anbaufläche", "Temperatur und Luftfeuchte der Umgebung"], "correct": 3, "explain": "Die Zuverlässigkeit hängt vom Gerätetyp ab, und Temperatur, relative Luftfeuchte und andere Umgebungsbedingungen beeinflussen die Werte. Messbedingungen sollten deshalb gleich bleiben.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part I: Moisture Content and Water Activity", "url": "https://royalcoffee.com/green-coffee-analytics-relevance-to-roasters-buyers-and-producers-part-i-moisture-content-and-total-water-activity/"}, "img": "sack", "topic": "Rohkaffee", "st": 10}, {"id": "r3-142", "mode": "roester", "level": 3, "type": "mc", "q": "Welchen 15-Minuten-Richtwert (STEL) nennt NIOSH für Diacetyl?", "options": ["5 ppm", "250 ppb", "2,5 ppb", "25 ppb"], "correct": 3, "explain": "Für Diacetyl gelten bei NIOSH 5 ppb als Schichtmittelwert und 25 ppb für 15 Minuten. In einer Rösterei wurde der STEL beim Rösten und Verpacken überschritten.", "source": {"title": "NIOSH HHE 2016-0144-3305 – Coffee roasting and packaging facility", "url": "https://www.cdc.gov/niosh/hhe/reports/pdfs/2016-0144-3305.pdf"}, "img": "sack", "topic": "Sicherheit", "st": 9}, {"id": "r3-143", "mode": "roester", "level": 3, "type": "case", "q": "Was ist die beste Maßnahme?", "case": {"title": "Fall · Dunkle Espresso-Röstung", "facts": ["RoR bricht kurz nach Beginn des First Crack stark ein", "Danach steigt die RoR wieder an", "Drop spät, kurz vor dem Second Crack"], "cup": "Röstig, verkohlt, wenig süß"}, "options": ["Im First Crack mehr Gas geben, um den Einbruch auszugleichen", "Noch später droppen, damit sich die Röstnoten verteilen", "Die RoR-Glättung erhöhen, damit der Anstieg verschwindet", "Energie so führen, dass die RoR früh im First Crack nicht einbricht"], "correct": 3, "explain": "Rao nennt einen RoR-Crash früh im First Crack als möglichen Auslöser des Flicks. Dunkle Röstungen brauchen Flick-Management, mehr Gas im First Crack wäre die schädlichste Ursache.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "topic": "Fallstudie", "st": 9}, {"id": "r3-144", "mode": "roester", "level": 3, "type": "case", "q": "Welcher Kurvenfehler erklärt die Tasse laut Rao?", "case": {"title": "Fall · Kolumbien, gewaschen", "facts": ["RoR fällt um den First Crack schlagartig von 12 auf 3 °C/min", "Danach bis zum Drop knapp positiv", "Farbe und Entwicklungszeit im Ziel"], "cup": "Heiß ordentlich, abkühlend hohl, flach, wenig süß"}, "options": ["Eine zu hohe Development Time Ratio", "Ein zu dünner, schneller Bohnenfühler", "Der starke RoR-Crash, also Baking", "Eine etwas zu niedrige Trommeldrehzahl"], "correct": 2, "explain": "Laut Rao entsteht gebackener Kaffee vor allem durch einen ausgeprägten RoR-Crash, also eine drastische Änderung der Steigung. Typisch: hohl, flach, weniger süß, oft erst beim Abkühlen auffällig.", "source": {"title": "Scott Rao – What is Baked Coffee?", "url": "https://scottrao.com/blog/2018/2/24/what-is-baked-coffee-most-pros-dont-know"}, "img": "kurve", "topic": "Fallstudie", "st": 3}, {"id": "r3-145", "mode": "roester", "level": 3, "type": "case", "q": "Wie stellst du Messintervall und RoR ein?", "case": {"title": "Fall · Kurven wirken auffallend glatt", "facts": ["RoR-Deltaspanne 60 Sekunden", "Zusätzliche Kurvenglättung aktiviert", "Tasse wirkt gebacken, Kurve zeigt keinen Crash"]}, "options": ["1-s-Intervall, Deltaspanne max. 15 s, ohne Extra-Glättung", "Deltaspanne auf 120 s erhöhen und stärker glätten", "Messintervall auf 30 s verlängern, Glättung lassen", "RoR ausblenden und nur die BT-Kurve betrachten"], "correct": 0, "explain": "Rao empfiehlt ein Messintervall von einer Sekunde, eine RoR-Deltaspanne von höchstens 15 Sekunden und keine zusätzliche Glättung. Sonst bleiben Crashs in der Kurve unsichtbar.", "source": {"title": "Scott Rao – What is Baked Coffee?", "url": "https://scottrao.com/blog/2018/2/24/what-is-baked-coffee-most-pros-dont-know"}, "img": "kurve", "topic": "Fallstudie", "st": 9}, {"id": "r3-146", "mode": "roester", "level": 3, "type": "case", "q": "Was steuerst du nach dem First Crack zusätzlich?", "case": {"title": "Fall · Zwei Röstungen mit 20 % DTR", "facts": ["Röstung A: nach First Crack +11 °C bis Drop", "Röstung B: nach First Crack +17 °C bis Drop", "Gleiche Gesamtzeit"], "cup": "B deutlich röstiger, A heller und säurebetont"}, "options": ["Die DTR allein reicht, die Temperatur ist egal", "Nach First Crack auch den Temperaturanstieg steuern", "Röstung B einfach mit höherer DTR wiederholen", "Nur nach Gesamtzeit droppen, Temperatur ignorieren"], "correct": 1, "explain": "Cropster rät, nach dem First Crack auch die Gradzahl des Anstiegs zu verfolgen, nicht nur den Entwicklungsanteil. Ein Anstieg um 20 °F und einer um 30 °F können beide 20 % DTR haben.", "source": {"title": "Cropster – Using Rate of Rise to Your Advantage in a Production Setting", "url": "https://www.cropster.com/blog-post/using-rate-of-rise-to-your-advantage-in-a-production-setting/"}, "img": "kurve", "topic": "Fallstudie", "st": 8}, {"id": "r3-147", "mode": "roester", "level": 3, "type": "case", "q": "Wie hättest du auf den BT-Sprung reagieren sollen?", "case": {"title": "Fall · BT-RoR springt vor dem First Crack", "facts": ["BT-RoR steigt kurz vor dem First Crack sprunghaft", "ET-RoR fällt weiter ruhig", "Röster nimmt Gas stark zurück, Endtemperatur kommt spät"], "cup": "Flach, leicht gebacken"}, "options": ["Das Gas noch früher und stärker zurücknehmen", "Den Luftstrom ganz schließen, um Wärme zu halten", "Die Trommeldrehzahl erhöhen, um die RoR zu glätten", "Den BT-Sprung bei fallender ET-RoR ignorieren"], "correct": 3, "explain": "Die Abluft-RoR zeigt die Wärmeenergie des Rösters unabhängig vom Bohnenfühler. Springt die BT-RoR vor dem First Crack, während die ET-RoR fällt, ignoriert Anne (Cropster) den Sprung, um nicht überzukorrigieren.", "source": {"title": "Cropster – Using Rate of Rise to Your Advantage in a Production Setting", "url": "https://www.cropster.com/blog-post/using-rate-of-rise-to-your-advantage-in-a-production-setting/"}, "img": "kurve", "topic": "Fallstudie", "st": 4}, {"id": "r3-148", "mode": "roester", "level": 3, "type": "case", "q": "Wie bewertest du die Röstung trotz passender DTR?", "case": {"title": "Fall · DTR im Lehrbuchbereich", "facts": ["DTR 21 %", "Drop knapp nach Ende des First Crack bei niedriger Endtemperatur", "Röstzeit 9:30"], "cup": "Grasig, wenig Körper"}, "options": ["DTR ist ideal, also liegt der Fehler im Rohkaffee", "DTR ist zu hoch, deshalb fehlt der Körper", "DTR ist ideal, also muss die Mühle falsch sein", "DTR allein garantiert keine Entwicklung, mehr entwickeln"], "correct": 3, "explain": "Rao nennt die DTR nur einen von vielen Indikatoren. Auch bei 20 % kann eine schlecht entwickelte Röstung Körper vermissen lassen. Grasige Noten zeigen Unterentwicklung.", "source": {"title": "Scott Rao – Development Time Ratio", "url": "https://www.scottrao.com/blog/2016/8/25/development-time-ratio"}, "img": "kurve", "topic": "Fallstudie", "st": 4}, {"id": "r3-149", "mode": "roester", "level": 3, "type": "case", "q": "Wie führst du die Energie bei dieser dichten Partie?", "case": {"title": "Fall · Kenia, sehr dicht (0,72 g/ml)", "facts": ["Moderate Charge-Temperatur, mittleres Gas", "RoR stockt in später Maillard-Phase vor dem First Crack"], "cup": "Flach, gedämpfte Säure"}, "options": ["Kalte Trommel, volles Gas, nach Farbumschlag weniger Energie", "Gleiche Energie, dafür die Entwicklung deutlich strecken", "Heiße Trommel, sanfte Flamme, nach Farbumschlag mehr Energie", "Kleinere Charge, Luft schließen und später droppen"], "correct": 2, "explain": "Dichte Kaffees stocken laut Royal in der späten Maillard-Phase und vor dem First Crack und brauchen extra Wärme. Royal lädt mit heißer Trommel und kleiner Flamme und erhöht nach dem Farbumschlag die Hitze.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part IV: Density", "url": "https://royalcoffee.com/green-coffee-analytics-part-iv-density/"}, "img": "kurve", "topic": "Fallstudie", "st": 9}, {"id": "r3-150", "mode": "roester", "level": 3, "type": "case", "q": "Welche Chargengröße ist realistisch?", "case": {"title": "Fall · Neuer Röster, Brenner 115.000 kJ/h", "facts": ["Single-Pass-Trommelröster ohne Rezirkulation", "Geplant sind 12-kg-Chargen", "Faustregel nach Rao: mind. 11.500 kJ/h pro kg Rohkaffee"]}, "options": ["Etwa 12 kg", "Etwa 15 kg", "Etwa 10 kg", "Etwa 5 kg"], "correct": 2, "explain": "115.000 / 11.500 ergibt etwa 10 kg. Für 12 kg wären etwa 138.000 kJ/h nötig. Ist der Brenner zu klein, dauern Röstungen zu lange und schmecken flach oder gebacken.", "source": {"title": "Barista Hustle – Roasting Science RS 4.09: Batch Size", "url": "https://baristahustle.com/?p=432443"}, "img": "trommel", "topic": "Fallstudie", "st": 6}, {"id": "r3-151", "mode": "roester", "level": 3, "type": "case", "q": "Welchen Tiefpunkt wählst du vor der kleinen Charge?", "case": {"title": "Fall · Wechsel auf kleinere Charge", "facts": ["Bisher 12 kg, nächste Charge 6 kg", "Übliche BBP: Tiefpunkt 20 °C unter Charge-Temperatur", "Kleine Chargen liefen bisher zu schnell"]}, "options": ["Etwas höher, etwa 10 °C über dem Üblichen", "Genau wie sonst, 20 °C unter der Charge-Temperatur", "Keinen, direkt nach dem Drop wieder laden", "Deutlich tiefer, etwa 40 °C unter dem Üblichen"], "correct": 3, "explain": "Rao empfiehlt vor einer größeren Charge einen etwa 10 °C höheren, vor einer kleineren einen etwa 40 °C tieferen Tiefpunkt. So kann die überschüssige Wärme abklingen.", "source": {"title": "Cropster – Between Batch Protocol for Coffee Roasters", "url": "https://www.cropster.com/blog-post/between-batch-protocol-for-coffee-roasters-the-whats-whys-and-hows-from-experts/"}, "img": "kurve", "topic": "Fallstudie", "st": 8}, {"id": "r3-152", "mode": "roester", "level": 3, "type": "case", "q": "Wie passt du den Tiefpunkt an?", "case": {"title": "Fall · Tiefpunkt nach 1:30 erreicht", "facts": ["Gas nach dem Drop aus, Tür geschlossen", "Tiefpunkt (20 °C unter Charge) schon nach 1:30 erreicht"]}, "options": ["Sofort laden, solange die Temperatur noch fällt", "Die Tür öffnen, damit es noch schneller geht", "Den Tiefpunkt höher legen, damit die Pause kürzer wird", "Tieferen Tiefpunkt wählen, damit die Pause 3–4 Min. dauert"], "correct": 3, "explain": "Rao nennt 3–4 Minuten bis zum Tiefpunkt. Wird er schneller erreicht, wählt man einen tieferen Tiefpunkt. Kurze Pausen können gleiche Temperaturen, aber unterschiedliche gespeicherte Wärme bedeuten.", "source": {"title": "Cropster – Between Batch Protocol for Coffee Roasters", "url": "https://www.cropster.com/blog-post/between-batch-protocol-for-coffee-roasters-the-whats-whys-and-hows-from-experts/"}, "img": "kurve", "topic": "Fallstudie", "st": 8}, {"id": "r3-153", "mode": "roester", "level": 3, "type": "case", "q": "Wann ist der Röster laut Cooper bereit?", "case": {"title": "Fall · Morgendliches Aufheizen", "facts": ["Nach 20 Minuten: BT 190 °C, ET 240 °C", "Erste Charge soll sofort starten"]}, "options": ["Sobald die BT die Charge-Temperatur erstmals erreicht", "Sobald die ET mindestens 50 °C über der BT liegt", "Sofort nach dem Zünden, wenn die Flamme stabil ist", "Wenn BT und ET nur noch etwa 10 °C auseinanderliegen"], "correct": 3, "explain": "Cooper nennt mindestens 30 Minuten Aufheizen, bereit ist der Röster, wenn Bohnen- und Ablufttemperatur nur noch etwa 10 °C auseinanderliegen. Dann ist auch das Material durchgewärmt.", "source": {"title": "Cropster – Between Batch Protocol for Coffee Roasters", "url": "https://www.cropster.com/blog-post/between-batch-protocol-for-coffee-roasters-the-whats-whys-and-hows-from-experts/"}, "img": "trommel", "topic": "Fallstudie", "st": 8}, {"id": "r3-154", "mode": "roester", "level": 3, "type": "case", "q": "Wie erklärst du die gegensätzliche Wirkung?", "case": {"title": "Fall · Luft auf, RoR mal hoch, mal runter", "facts": ["Bei hohem Gas: Luft auf, RoR steigt", "Bei sehr niedrigem Gas: Luft auf, RoR sinkt"]}, "options": ["Der Fühler ist defekt und misst die Luft falsch", "Bei viel Gas bringt mehr Luft Wärme, bei wenig Gas kühlt sie", "Luft wirkt immer kühlend, die Messung täuscht", "Luft wirkt immer wärmend, nur die Trommel bremst"], "correct": 1, "explain": "Laut Barista Hustle drückt mehr Luft bei hohem Gas mehr Wärme in den Röster, BT- und ET-RoR steigen. Bei sehr niedrigem Gas kann mehr Luft den Röster kühlen und die RoR senken.", "source": {"title": "Barista Hustle – Managing Airflow (Scott Rao)", "url": "https://www.baristahustle.com/?p=468661"}, "img": "kurve", "topic": "Fallstudie", "st": 9}, {"id": "r3-155", "mode": "roester", "level": 3, "type": "case", "q": "Wie bewertest du das Nachlegen von Gas?", "case": {"title": "Fall · Indirekt beheizte Trommel, Kenia", "facts": ["Röstung droht vor dem First Crack zu stocken", "Röster legt kurz vor dem First Crack Gas nach", "Kollege zitiert Raos Regel gegen Gas um den First Crack"], "cup": "Gut entwickelt, keine röstigen Noten"}, "options": ["Regeln für direkt befeuerte Trommeln gelten hier nicht 1:1", "Raos Regel gilt überall, die Tasse täuscht hier", "Gas um den First Crack ist auf jeder Maschine ideal", "Die Bauart des Rösters spielt für das Profil keine Rolle"], "correct": 0, "explain": "Jorge Verdú hob auf einem indirekt beheizten Röster vor dem First Crack di
