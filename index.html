ect": 3, "explain": "Langsam und bitter deutet auf Überextraktion: Gröber mahlen beschleunigt den Durchfluss.", "source": {"title": "Seattle Coffee Gear – How to Dial In Espresso Grind Size", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-dial-in-espresso-grind-size"}, "img": "espresso", "topic": "Mahlgrad", "st": 1}, {"id": "b1-05", "mode": "barista", "level": 1, "type": "mc", "q": "Woraus entsteht die Crema auf dem Espresso hauptsächlich?", "options": ["Aus Luft, die die Pumpe ins Brühwasser drückt", "Aus Wasserdampf, der beim Brühen kondensiert", "Aus CO₂, das unter Druck im Wasser gelöst wird", "Aus Stärke, die beim Brühen im Puck aufquillt"], "correct": 2, "explain": "Der Brühdruck löst mehr CO₂ aus der Röstung im Wasser; beim Austritt bildet es feine, stabile Bläschen – die Crema.", "source": {"title": "Perfect Daily Grind – Crema: How It's Formed", "url": "https://perfectdailygrind.com/2020/04/crema-how-its-formed-what-it-tells-us-how-to-learn-from-it/"}, "img": "crema", "topic": "Espresso", "st": 8}, {"id": "b1-06", "mode": "barista", "level": 1, "type": "mc", "q": "Welche Kaffeeart enthält im Schnitt deutlich mehr Koffein?", "options": ["Arabica", "Robusta", "Liberica", "Excelsa"], "correct": 1, "explain": "Robusta (Coffea canephora) enthält etwa doppelt so viel Koffein wie Arabica (ca. 2–4,5 % vs. 1,1–1,7 %).", "source": {"title": "Sweet Maria's – Robusta Coffee", "url": "https://library.sweetmarias.com/robusta-coffee/"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 1}, {"id": "b1-07", "mode": "barista", "level": 1, "type": "mc", "q": "Wie lagerst du Kaffeebohnen am besten?", "options": ["Im Klarglas, luftdicht, hell im Regal", "Offen in der Tüte, im Kühlschrank", "Luftdurchlässig, damit Bohnen atmen", "Luftdicht, lichtdicht, kühl und dunkel"], "correct": 3, "explain": "Luft, Licht und Wärme schaden dem Aroma – daher luftdicht in einem undurchsichtigen Behälter an einem kühlen, dunklen Ort.", "source": {"title": "NCA – Storage and Shelf Life", "url": "https://www.aboutcoffee.org/beans/storage-and-shelf-life/"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 1}, {"id": "b1-08", "mode": "barista", "level": 1, "type": "mc", "q": "Warum mahlt man Kaffee erst kurz vor dem Brühen?", "options": ["Weil gemahlener Kaffee Aroma und CO₂ schneller verliert", "Weil ganze Bohnen ihr Aroma deutlich schneller verlieren", "Weil frisch gemahlener Kaffee mehr Koffein löst", "Weil Kaffeemehl erst nach dem Mahlen CO₂ bildet"], "correct": 0, "explain": "Laut SCA geht das CO₂, das ganze Bohnen über Wochen abgeben, nach dem Mahlen in Minuten verloren – danach setzt Oxidation ein.", "source": {"title": "SCA – Coffee Decoded: What is freshly roasted coffee?", "url": "https://sca.coffee/sca-news/coffee-decoded-9-fresh-coffee"}, "img": "muehle", "topic": "Bohne & Lagerung", "st": 2}, {"id": "b1-09", "mode": "barista", "level": 1, "type": "mc", "q": "Was passiert beim „Bloom“ zu Beginn eines Handfilters?", "options": ["Luft aus dem Papierfilter entweicht", "Kaffeeöle steigen als Schaum nach oben", "Kohlendioxid aus der Röstung entweicht", "Wasserdampf aus dem Kaffeemehl entweicht"], "correct": 2, "explain": "Beim Vorbenetzen entweicht das CO₂ aus der Röstung – das Kaffeebett „blüht“ auf. Frischer Kaffee bloomt stärker.", "source": {"title": "Perfect Daily Grind – Why Should Your Coffee Bloom?", "url": "https://perfectdailygrind.com/2017/01/why-should-your-coffee-bloom-a-video-experiment/"}, "img": "filter", "topic": "Filter", "st": 4}, {"id": "b1-10", "mode": "barista", "level": 1, "type": "mc", "q": "Welche Temperatur gilt als angenehme Serviertemperatur für Milchgetränke?", "options": ["Etwa 30–35 °C", "Etwa 55–60 °C", "Etwa 75–80 °C", "Etwa 90–95 °C"], "correct": 1, "explain": "Barista Hustle nennt 55–60 °C als angenehme Serviertemperatur; über 70 °C verbrüht man sich die Zunge.", "source": {"title": "Barista Hustle – Temperature Targets", "url": "https://www.baristahustle.com/lesson/b1-4-03-temperature-targets/"}, "img": "milch", "topic": "Milch", "st": 2}, {"id": "b1-11", "mode": "barista", "level": 1, "type": "case", "q": "Nach dem Aufschäumen klebt Milch an der Dampflanze. Was tust du?", "options": ["Am Abend gründlich einweichen und dann schrubben", "Erst abkühlen lassen, dann trocken abreiben", "Kurz Dampf ablassen, Abwischen erst abends", "Sofort feucht abwischen und kurz Dampf ablassen"], "correct": 3, "explain": "Warm lässt sich Milch leicht abwischen; kurzes Ablassen (Purgen) drückt Milchreste aus dem Inneren der Lanze.", "source": {"title": "Seattle Coffee Gear – How to Clean Your Steam Wand", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-clean-steam-wand"}, "img": "milch", "topic": "Pflege", "st": 5}, {"id": "b1-12", "mode": "barista", "level": 2, "type": "mc", "q": "Welche Brühtemperatur verlangt der SCA-Standard für zertifizierte Filterkaffeemaschinen?", "options": ["90–96 °C", "70–76 °C", "80–86 °C", "97–100 °C"], "correct": 0, "explain": "Laut SCA-Standard 310 muss das Kaffeebett früh im Brühvorgang 90–96 °C erreichen und dort bleiben.", "source": {"title": "SCA Standard 310-2021 Home Coffee Brewers", "url": "https://sca.coffee/s/SCA_Standard_310-2021.pdf"}, "img": "filter", "topic": "Standards", "st": 10}, {"id": "b1-13", "mode": "barista", "level": 1, "type": "mc", "q": "Wer hat die AeroPress erfunden?", "options": ["Peter Schlumbohm", "Alan Adler", "Alfonso Bialetti", "Achille Gaggia"], "correct": 1, "explain": "Alan Adler, auch Erfinder der Aerobie-Wurfscheibe, stellte die AeroPress im November 2005 vor.", "source": {"title": "AeroPress – About AeroPress & Alan Adler", "url": "https://aeropress.com/about/"}, "img": "filter", "topic": "Filter", "st": 5}, {"id": "b1-14", "mode": "barista", "level": 1, "type": "mc", "q": "Wofür steht die „60“ im Namen des Hario V60?", "options": ["Für 60 Sekunden Brühzeit", "Für 60 g Kaffee pro Liter", "Für den 60°-Winkel des Kegels", "Für 60 °C Wassertemperatur"], "correct": 2, "explain": "Der Name beschreibt die V-Form des konischen Filters mit einem Winkel von 60°.", "source": {"title": "HARIO – The origin of the V60", "url": "https://global.hario.com/sp_v60series.html"}, "img": "filter", "topic": "Filter", "st": 9}, {"id": "b1-15", "mode": "barista", "level": 1, "type": "mc", "q": "Was ist typisch für den Kalita-Wave-Handfilter?", "options": ["Flacher Boden mit drei kleinen Löchern", "Spitzer 60°-Kegel mit einem großen Loch", "Metallsieb mit feinem Edelstahlgewebe", "Kegel mit Stopp-Ventil am Auslauf"], "correct": 0, "explain": "Der Kalita Wave hat einen flachen Boden mit drei kleinen Löchern, die den Durchfluss begrenzen.", "source": {"title": "Seattle Coffee Gear – Kalita Wave Product Guide", "url": "https://www.seattlecoffeegear.com/pages/product-resources/kalita-wave-glass-dripper-product-guide"}, "img": "filter", "topic": "Filter", "st": 7}, {"id": "b1-16", "mode": "barista", "level": 1, "type": "mc", "q": "Wer entwarf die Chemex-Karaffe?", "options": ["Der Ingenieur Alan Adler", "Der Barista Achille Gaggia", "Der Designer Alfonso Bialetti", "Der Chemiker Peter Schlumbohm"], "correct": 3, "explain": "Der Chemiker und Erfinder Dr. Peter Schlumbohm entwarf und patentierte die Chemex 1941.", "source": {"title": "CHEMEX – About CHEMEX (History)", "url": "https://www.chemexcoffeemaker.com/gallery/album/history"}, "img": "filter", "topic": "Filter", "st": 6}, {"id": "b1-17", "mode": "barista", "level": 1, "type": "mc", "q": "Was unterscheidet Cold Brew von Eiskaffee?", "options": ["Cold Brew ist Filterkaffee mit Eiswürfeln", "Cold Brew zieht stundenlang kalt oder zimmerwarm", "Cold Brew wird heiß gebrüht und schnell gekühlt", "Cold Brew wird kurz kalt unter Druck extrahiert"], "correct": 1, "explain": "Cold Brew zieht mit kühlem oder zimmerwarmem Wasser, oft rund 12 Stunden oder länger; Eiskaffee wird heiß gebrüht und dann gekühlt.", "source": {"title": "NCA – Cold Brew Coffee", "url": "https://www.aboutcoffee.org/brewing/cold-brew-coffee/"}, "img": "filter", "topic": "Filter", "st": 2}, {"id": "b1-18", "mode": "barista", "level": 1, "type": "mc", "q": "Warum spült man einen Papierfilter vor dem Brühen mit heißem Wasser?", "options": ["Um den Filter zu sterilisieren", "Um Kalk aus dem Papier zu lösen", "Um Papiergeschmack zu vermeiden", "Damit das Papier reißfester wird"], "correct": 2, "explain": "Papierfilter können einen unangenehmen, papierigen Geschmack abgeben; Spülen (Wasser wegschütten) verhindert das.", "source": {"title": "NCA – Pour-over Coffee", "url": "https://www.aboutcoffee.org/brewing/pour-over-coffee/"}, "img": "filter", "topic": "Filter", "st": 2}, {"id": "b1-19", "mode": "barista", "level": 1, "type": "mc", "q": "Was lässt ein Metallfilter im Vergleich zum Papierfilter stärker durch?", "options": ["Kaffeeöle und feine Schwebstoffe", "Gelöste Mineralien aus dem Wasser", "Mehr gelöstes Koffein und Zucker", "Mehr Kohlensäure und Sauerstoff"], "correct": 0, "explain": "Papier hält mehr Öl zurück und gibt eine klarere Tasse; Metall lässt mehr Öl und Sediment durch – die Tasse wirkt intensiver.", "source": {"title": "NCA – Pour-over Coffee", "url": "https://www.aboutcoffee.org/brewing/pour-over-coffee/"}, "img": "filter", "topic": "Filter", "st": 4}, {"id": "b1-20", "mode": "barista", "level": 1, "type": "mc", "q": "Was enthält meist mehr Koffein pro Portion?", "options": ["Ein einfacher Espresso (ca. 30 ml)", "Ein kurzer Ristretto (ca. 20 ml)", "Ein Becher Filterkaffee (ca. 240 ml)", "Ein Espresso macchiato (ca. 40 ml)"], "correct": 2, "explain": "Laut Mayo Clinic: Espresso (30 ml) ca. 63 mg, Filterkaffee (237 ml) ca. 96 mg – Espresso ist konzentrierter, aber die Portion kleiner.", "source": {"title": "Mayo Clinic – Caffeine content for coffee, tea, soda and more", "url": "https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/in-depth/caffeine/art-20049372"}, "img": "espresso", "topic": "Espresso", "st": 3}, {"id": "b1-21", "mode": "barista", "level": 1, "type": "mc", "q": "Ist entkoffeinierter Kaffee völlig koffeinfrei?", "options": ["Ja, das Koffein wird vollständig entfernt", "Nein, er enthält noch geringe Restmengen", "Nein, er enthält etwa die Hälfte des Koffeins", "Ja, sofern er nach EU-Norm deklariert ist"], "correct": 1, "explain": "Entkoffeinierter Kaffee enthält nur noch sehr wenig Koffein, ist aber nicht völlig frei davon.", "source": {"title": "Mayo Clinic – Caffeine content for coffee, tea, soda and more", "url": "https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/in-depth/caffeine/art-20049372"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 2}, {"id": "b1-22", "mode": "barista", "level": 1, "type": "mc", "q": "Was kennzeichnet einen Ristretto im Vergleich zum normalen Espresso?", "options": ["Mehr Getränk bei gleicher Dosis", "Gleiche Getränkemenge, halbe Dosis", "Gleiche Getränkemenge bei höherem Druck", "Weniger Getränk bei gleicher Dosis"], "correct": 3, "explain": "Ristretto heißt „beschränkt“: ein kürzerer, konzentrierterer Bezug, typischerweise etwa 1:1 bis 1:2 (Kaffee zu Getränk).", "source": {"title": "La Marzocco Home – Brew Ratios Around the World", "url": "https://home.lamarzoccousa.com/brew-ratios-around-world/"}, "img": "espresso", "topic": "Espresso", "st": 4}, {"id": "b1-23", "mode": "barista", "level": 1, "type": "mc", "q": "Was ist ein Lungo?", "options": ["Ein Espresso, mit heißem Wasser aufgegossen", "Ein Espresso mit doppelter Menge Kaffeemehl", "Ein Espresso mit mehr durchgelaufenem Wasser", "Ein Espresso mit einem Schuss Milchschaum"], "correct": 2, "explain": "Lungo heißt „lang“: gleiche Dosis, aber mehr Wasser läuft durch – weniger intensiv als ein Espresso.", "source": {"title": "Coffee Circle – Espresso, Lungo, Ristretto", "url": "https://www.coffeecircle.com/en/b/difference-espresso-lungo-ristretto"}, "img": "espresso", "topic": "Espresso", "st": 4}, {"id": "b1-24", "mode": "barista", "level": 1, "type": "mc", "q": "Wozu tampert man das Kaffeemehl im Siebträger?", "options": ["Für ein ebenes Kaffeebett ohne Luftnester", "Um die Kaffeeöle vorab freizupressen", "Um möglichst viel Mehl ins Sieb zu pressen", "Um das Kaffeemehl am Sieb vorzuwärmen"], "correct": 0, "explain": "Tampen verdichtet den Puck ohne Lufteinschlüsse, damit das Wasser gleichmäßig Widerstand findet; wichtig ist vor allem, eben zu tampen.", "source": {"title": "Prima Coffee – The Art and Science of Tamping", "url": "https://prima-coffee.com/blog/the-art-and-science-of-tamping/"}, "img": "tamper", "topic": "Espresso", "st": 2}, {"id": "b1-25", "mode": "barista", "level": 1, "type": "case", "q": "Du willst Milch aufschäumen. Was tust du direkt vorher mit der Dampflanze?", "options": ["Kurz in die Milch halten zum Vorwärmen", "Kurz in kaltes Wasser tauchen zum Abkühlen", "Mit Reiniger einsprühen und abwischen", "Kurz Dampf ablassen gegen Kondenswasser"], "correct": 3, "explain": "Im Ruhezustand kondensiert Dampf zu Wasser in der Lanze; kurzes Purgen in Tuch oder Abtropfschale entfernt es.", "source": {"title": "Clive Coffee – Steam Wand That Won’t Make Strong Steam", "url": "https://clivecoffee.com/blogs/learn/how-to-fix-a-steam-wand-that-wont-make-strong-steam"}, "img": "milch", "topic": "Milch", "st": 5}, {"id": "b1-26", "mode": "barista", "level": 1, "type": "mc", "q": "Woran erkennst du gut aufgeschäumten Mikroschaum?", "options": ["Steif und fest, sodass ein Löffel stehen bleibt", "Glänzend wie nasse Farbe, ohne sichtbare Blasen", "Getrennte Schichten aus Milch und festem Schaum", "Matt und dicht, mit feinen sichtbaren Bläschen"], "correct": 1, "explain": "Guter Mikroschaum glänzt, zeigt keine sichtbaren Blasen und fließt als eine homogene, cremige Masse.", "source": {"title": "Clive Coffee – How to Steam Glossy Microfoam", "url": "https://clivecoffee.com/blogs/learn/how-to-steam-glossy-microfoam-instead-of-foamy-milk"}, "img": "milch", "topic": "Milch", "st": 5}, {"id": "b1-27", "mode": "barista", "level": 1, "type": "mc", "q": "Mit welchem Muster beginnen viele Baristas beim Latte-Art-Lernen?", "options": ["Schwan", "Tulpe", "Herz", "Rosetta"], "correct": 2, "explain": "Das Herz gilt als typisches Einstiegsmuster und schult Milchfluss, Tassenhaltung und Gießkontrolle; danach folgen Tulpe und Rosetta.", "source": {"title": "Dalla Corte – Starting Your Latte Art Journey: 3 Patterns", "url": "https://dallacorte.com/magazine-starting-your-latte-art-journey-try-these-3-patterns-n-1123.html"}, "img": "milch", "topic": "Milch", "st": 1}, {"id": "b1-28", "mode": "barista", "level": 1, "type": "mc", "q": "Warum nimmt man zum Aufschäumen Milch direkt aus dem Kühlschrank?", "options": ["Mehr Süße, weil kalte Milch Zucker bindet", "Mehr Schaum, weil warme Milch nicht schäumt", "Weniger Kalk, weil die Lanze kühler bleibt", "Mehr Zeit, bevor die Milch zu heiß wird"], "correct": 3, "explain": "Kalte Milch verlängert das Zeitfenster zum Lufteinziehen und Texturieren, bevor sie überhitzt.", "source": {"title": "Clive Coffee – How to Steam Glossy Microfoam", "url": "https://clivecoffee.com/blogs/learn/how-to-steam-glossy-microfoam-instead-of-foamy-milk"}, "img": "milch", "topic": "Milch", "st": 5}, {"id": "b1-29", "mode": "barista", "level": 1, "type": "mc", "q": "Wozu dient das Einwegventil in einer Kaffeetüte?", "options": ["CO₂ entweicht, Außenluft kommt nicht hinein", "Sauerstoff kommt hinein, Aroma bleibt drin", "Duft entweicht, damit man daran riechen kann", "Feuchtigkeit entweicht, Aroma bleibt drin"], "correct": 0, "explain": "Frisch gerösteter Kaffee gast CO₂ aus; das Ventil lässt es entweichen, damit die Tüte nicht platzt, und hält Außenluft draußen.", "source": {"title": "Plitek – Coffee Valves", "url": "https://www.plitek.com/applications/coffee-valves/"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 4}, {"id": "b1-30", "mode": "barista", "level": 1, "type": "mc", "q": "Welcher Zucker kommt natürlicherweise in Kuhmilch vor?", "options": ["Saccharose (Haushaltszucker)", "Laktose (Milchzucker)", "Fruktose (Fruchtzucker)", "Maltose (Malzzucker)"], "correct": 1, "explain": "Der natürliche Zucker der Milch ist Laktose; laktosefreie Milch entsteht, indem das Enzym Laktase ihn spaltet.", "source": {"title": "Arla – Why is lactose-free milk sweeter?", "url": "https://www.arla.com/articles/why-is-lactose-free-milk-sweeter-than-regular-milk-and-what-do-enzymes-have-to-do-with-it/"}, "img": "milch", "topic": "Milch", "st": 1}, {"id": "b2-01", "mode": "barista", "level": 2, "type": "mc", "q": "Welches Brühverhältnis legt der SCA-Standard für Filterkaffeemaschinen zugrunde?", "options": ["15 g Kaffee pro kg Wasser", "30 g Kaffee pro kg Wasser", "55 g Kaffee pro kg Wasser", "120 g Kaffee pro kg Wasser"], "correct": 2, "explain": "Der SCA-Standard 310 verwendet 55 g Kaffee pro 1 kg Frischwasser als Standard-Brühverhältnis.", "source": {"title": "SCA Standard 310-2021 Home Coffee Brewers", "url": "https://sca.coffee/s/SCA_Standard_310-2021.pdf"}, "img": "filter", "topic": "Standards", "st": 7}, {"id": "b2-02", "mode": "barista", "level": 2, "type": "mc", "q": "Welche Extraktionsausbeute gilt im klassischen Brewing Control Chart als ideal?", "options": ["8–10 %", "12–14 %", "28–32 %", "18–22 %"], "correct": 3, "explain": "Das Brewing Control Chart (Lockhart, 1957) nennt 18–22 % Extraktion als Idealbereich für Filterkaffee.", "source": {"title": "Barista Hustle – Towards a Common Coffee Control Chart", "url": "https://www.baristahustle.com/towards-a-common-coffee-control-chart/"}, "img": "filter", "topic": "Extraktion", "st": 6}, {"id": "b2-03", "mode": "barista", "level": 2, "type": "mc", "q": "Was misst ein Refraktometer im Kaffee?", "options": ["Den Brechungsindex, daraus folgt der TDS-Wert", "Die Lichtabsorption, daraus folgt der Röstgrad", "Die Leitfähigkeit, daraus folgt die Wasserhärte", "Den pH-Wert, daraus folgt die Säure der Tasse"], "correct": 0, "explain": "Das Refraktometer misst den Brechungsindex; daraus ergibt sich der Anteil gelöster Feststoffe (TDS).", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "tasse", "topic": "Extraktion", "st": 4}, {"id": "b2-04", "mode": "barista", "level": 2, "type": "mc", "q": "Was stimmt über die Crema?", "options": ["Dicke Crema zeigt sicher einen guten Shot", "Schöne Crema beweist keinen guten Geschmack", "Crema entsteht vor allem bei altem Kaffee", "Robusta bildet weniger Crema als Arabica"], "correct": 1, "explain": "Auch ein schlechter, dunkel gerösteter Kaffee kann dichte Crema haben – über den Geschmack entscheidet die Tasse.", "source": {"title": "Perfect Daily Grind – Crema: How It's Formed", "url": "https://perfectdailygrind.com/2020/04/crema-how-its-formed-what-it-tells-us-how-to-learn-from-it/"}, "img": "crema", "topic": "Espresso", "st": 1}, {"id": "b2-05", "mode": "barista", "level": 2, "type": "case", "q": "Am nackten Siebträger spritzt ein heller, wässriger Strahl seitlich heraus. Was tust du?", "options": ["Mehl gleichmäßig verteilen, gerade tampern", "Shot servieren, seitliche Strahlen sind normal", "Brühdruck erhöhen, damit das Bett hält", "Mehr Wasser nachlaufen lassen zum Ausgleich"], "correct": 0, "explain": "Das ist Channeling: Wasser sucht den Weg des geringsten Widerstands. Ursachen sind v. a. ungleichmäßige Verteilung und schiefes Tampern; stark gechannelte Shots neu machen.", "source": {"title": "Barista Hustle – Channelling", "url": "https://www.baristahustle.com/lesson/b1-3-02-channelling/"}, "img": "tamper", "topic": "Espresso", "st": 5}, {"id": "b2-06", "mode": "barista", "level": 2, "type": "mc", "q": "Welches Bauteil braucht eine Siebträgermaschine, damit sie mit Blindsieb rückgespült werden darf?", "options": ["Ein Überdruckventil (OPV)", "Ein 3-Wege-Magnetventil", "Einen zweiten Kessel", "Eine Rotationspumpe"], "correct": 1, "explain": "Nur Maschinen mit 3-Wege-Magnetventil dürfen rückgespült werden – ohne dieses Ventil kann Backflushing die Maschine beschädigen.", "source": {"title": "Seattle Coffee Gear – How to Backflush Your Espresso Machine", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-backflush-espresso-machine"}, "img": "espresso", "topic": "Pflege", "st": 8}, {"id": "b2-07", "mode": "barista", "level": 2, "type": "mc", "q": "Womit backflushst du, um Kaffeeöle aus der Brühgruppe zu lösen?", "options": ["Mit Essigessenz aus dem Haushalt", "Mit Entkalker für Espressomaschinen", "Mit Reiniger für Espressomaschinen", "Mit Spülmittel und heißem Wasser"], "correct": 2, "explain": "Für Kaffeeöle nimmt man einen Espressomaschinen-Reiniger (z. B. Cafiza); Entkalker und Essig sind dafür nicht gedacht.", "source": {"title": "Seattle Coffee Gear – How to Backflush Your Espresso Machine", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-backflush-espresso-machine"}, "img": "espresso", "topic": "Pflege", "st": 1}, {"id": "b2-08", "mode": "barista", "level": 2, "type": "mc", "q": "Woraus besteht Kalk in der Espressomaschine hauptsächlich?", "options": ["Aus Calcium- und Magnesiumchlorid", "Aus Natrium- und Kaliumcarbonat", "Aus Kieselsäure und Eisenoxid", "Aus Calcium- und Magnesiumcarbonat"], "correct": 3, "explain": "Beim Erhitzen reagieren Calcium und Magnesium mit Hydrogencarbonat zu Kalk (Calcium- und Magnesiumcarbonat).", "source": {"title": "Barista Hustle – Water Hardness", "url": "https://www.baristahustle.com/water-hardness/"}, "img": "wasser", "topic": "Wasser", "st": 8}, {"id": "b2-09", "mode": "barista", "level": 2, "type": "mc", "q": "Was bewirkt eine zu hohe Alkalinität (Karbonathärte) im Brühwasser?", "options": ["Er schmeckt flach, weil Säuren abgepuffert werden", "Er schmeckt saurer, weil mehr Säuren gelöst werden", "Er schmeckt bitterer, weil mehr Koffein gelöst wird", "Er schmeckt süßer, weil Zucker besser gelöst wird"], "correct": 0, "explain": "Alkalinität neutralisiert die Säuren im Kaffee – zu viel davon lässt ihn flach schmecken.", "source": {"title": "Barista Hustle – Water Hardness", "url": "https://www.baristahustle.com/water-hardness/"}, "img": "wasser", "topic": "Wasser", "st": 5}, {"id": "b2-10", "mode": "barista", "level": 2, "type": "case", "q": "Deine aufgeschäumte Milch hat große, grobe Blasen. Was tust du?", "options": ["Länger Luft ziehen, bis die Milch fast kocht", "Aufklopfen, schwenken, künftig kürzer Luft ziehen", "Weiter dampfen, bis sich die Blasen auflösen", "Kalte Milch nachgießen und neu Luft ziehen"], "correct": 1, "explain": "Grobe Blasen entstehen meist durch zu viel Luft oder zu schwachen Wirbel. Aufklopfen entfernt Blasen; Luft nur früh und kurz ziehen, dann rollen.", "source": {"title": "Clive Coffee – How to Steam Glossy Microfoam", "url": "https://clivecoffee.com/blogs/learn/how-to-steam-glossy-microfoam-instead-of-foamy-milk"}, "img": "milch", "topic": "Milch", "st": 2}, {"id": "b2-11", "mode": "barista", "level": 2, "type": "mc", "q": "Welcher Gesamtmineralgehalt (TDS) ist der SCA-Zielwert für Brühwasser?", "options": ["0 mg/L", "500 mg/L", "1.000 mg/L", "150 mg/L"], "correct": 3, "explain": "Der SCA-Wasserstandard nennt 150 mg/L als Ziel, akzeptabel sind 75–250 mg/L.", "source": {"title": "Prima Coffee – Testing Your Water (SCA-Wasserstandard)", "url": "https://prima-coffee.com/blog/testing-your-water/"}, "img": "wasser", "topic": "Wasser", "st": 10}, {"id": "b2-12", "mode": "barista", "level": 2, "type": "mc", "q": "Mit welchem Brühdruck wird ein Espresso laut Istituto Nazionale Espresso Italiano zubereitet?", "options": ["Etwa 1 bar", "Etwa 3 bar", "Etwa 9 bar", "Etwa 30 bar"], "correct": 2, "explain": "Das INEI gibt 9 bar (±1 bar) als Brühdruck für einen zertifizierten Espresso Italiano an.", "source": {"title": "Manufactum – Guten Espresso erkennen (INEI-Kriterien)", "url": "https://www.manufactum.com/good-espresso-recognize-c200599/"}, "img": "espresso", "topic": "Standards", "st": 3}, {"id": "b2-13", "mode": "barista", "level": 2, "type": "mc", "q": "18 g Kaffee ergeben 45 g Espresso (1:2,5). Wie nennt man das in der gängigen Brew-Ratio-Einteilung?", "options": ["Ristretto", "Normale", "Lungo", "Allongé"], "correct": 1, "explain": "Übliche Einteilung: Ristretto etwa 1:1–1:2, Normale 1:2–1:3, Lungo 1:3–1:4.", "source": {"title": "La Marzocco Home – Brew Ratios Around the World", "url": "https://home.lamarzoccousa.com/brew-ratios-around-world/"}, "img": "espresso", "topic": "Espresso", "st": 7}, {"id": "b2-14", "mode": "barista", "level": 1, "type": "mc", "q": "Was beschreibt die Brew Ratio beim Espresso?", "options": ["Brühdruck zu Brühzeit in Sekunden", "Gewicht Getränk zu Brühzeit in Sekunden", "Gelöste Stoffe zu Gewicht Getränk", "Gewicht Kaffeemehl zu Gewicht Getränk"], "correct": 3, "explain": "Die Brew Ratio vergleicht das Gewicht des Kaffeemehls mit dem Gewicht des Espressos in der Tasse, z. B. 18 g zu 36 g = 1:2.", "source": {"title": "La Marzocco Home – Brew Ratios Around the World", "url": "https://home.lamarzoccousa.com/brew-ratios-around-world/"}, "img": "espresso", "topic": "Espresso", "st": 10}, {"id": "b2-15", "mode": "barista", "level": 2, "type": "mc", "q": "Welcher Anteil des Kuhmilcheiweißes ist Kasein?", "options": ["Etwa 20 %", "Etwa 50 %", "Etwa 80 %", "Etwa 99 %"], "correct": 2, "explain": "Rund 80 % des Milcheiweißes sind Kasein, etwa 20 % Molkenproteine.", "source": {"title": "Agriland – Dairy Proteins: Whey & Casein", "url": "https://www.agriland.co.uk/farming-news/know-dairy-products-dairy-proteins-whey-casein/"}, "img": "milch", "topic": "Milch", "st": 6}, {"id": "b2-16", "mode": "barista", "level": 2, "type": "mc", "q": "Wie unterscheidet sich der Schaum von Magermilch und Vollmilch typischerweise?", "options": ["Magermilch: steif und stabil; Vollmilch: cremig", "Magermilch: cremig und stabil; Vollmilch: steif", "Magermilch: schäumt kaum; Vollmilch: steif", "Magermilch: grobblasig; Vollmilch: steif und fest"], "correct": 0, "explain": "Fett wirkt schaumdestabilisierend: Magermilch ergibt den stabilsten, steifsten Schaum, Vollmilch einen cremigeren, samtigeren.", "source": {"title": "Clive Coffee – The Science Behind Perfect Steamed Milk", "url": "https://clivecoffee.com/blogs/learn/the-science-behind-perfect-steamed-milk"}, "img": "milch", "topic": "Milch", "st": 5}, {"id": "b2-17", "mode": "barista", "level": 2, "type": "mc", "q": "Warum schmeckt laktosefreie Milch süßer als normale Milch?", "options": ["Weil der Milch etwas Fruktose zugesetzt wird", "Weil Laktose in Glukose und Galaktose gespalten wird", "Weil Laktose zu süßerer Saccharose umgebaut wird", "Weil Laktose bei der Herstellung karamellisiert wird"], "correct": 1, "explain": "Das Enzym Laktase spaltet Laktose in Glukose und Galaktose, die süßer schmecken – ganz ohne Zuckerzusatz.", "source": {"title": "Arla – Why is lactose-free milk sweeter?", "url": "https://www.arla.com/articles/why-is-lactose-free-milk-sweeter-than-regular-milk-and-what-do-enzymes-have-to-do-with-it/"}, "img": "milch", "topic": "Milch", "st": 5}, {"id": "b2-18", "mode": "barista", "level": 2, "type": "mc", "q": "Welche Ionen bilden die Gesamthärte (GH) des Wassers?", "options": ["Natrium und Kalium", "Chlorid und Sulfat", "Eisen und Kupfer", "Calcium und Magnesium"], "correct": 3, "explain": "Die Gesamthärte ist die Summe von Calcium und Magnesium im Wasser.", "source": {"title": "Barista Hustle – Water Hardness", "url": "https://www.baristahustle.com/water-hardness/"}, "img": "wasser", "topic": "Wasser", "st": 7}, {"id": "b2-19", "mode": "barista", "level": 2, "type": "case", "q": "Du brühst mit reinem Osmosewasser fast ohne Mineralien. Der Kaffee schmeckt flach. Was tust du?", "options": ["Wasser remineralisieren, z. B. per Kartusche", "Wasser zusätzlich durch Aktivkohle filtern lassen", "Wasser vorher länger abkochen lassen", "Eine Prise Kochsalz in die Tasse geben"], "correct": 0, "explain": "Vollständig entmineralisiertes Wasser ist für Kaffee nicht ideal; der SCA-Standard empfiehlt 75–250 mg/L gelöste Mineralien, Ziel 150 mg/L.", "source": {"title": "Espresso Parts – Water Chemistry: Hardness, Chloride, Scale and RO Water", "url": "https://www.espressoparts.com/blogs/news/how-water-chemistry-affects-espresso-machines-hardness-chloride-scale-and-ro-water"}, "img": "wasser", "topic": "Wasser", "st": 5}, {"id": "b2-20", "mode": "barista", "level": 2, "type": "mc", "q": "Was bedeutet „Retention“ bei einer Kaffeemühle?", "options": ["Die Drehzahl, mit der das Mahlwerk beim Mahlen läuft", "Kaffeemehl, das nach dem Mahlen in der Mühle bleibt", "Die Zeit, bis die Mahlscheiben stumpf werden", "Der Anteil feinster Partikel im fertigen Mahlgut"], "correct": 1, "explain": "Retention ist das Kaffeemehl, das nach dem Mahlen in der Mühle hängen bleibt und beim nächsten Mahlen mit herauskommt.", "source": {"title": "Barista Magazine – Grind Retention: Why Is It Important?", "url": "https://baristamagazine.com/grind-retention-why-is-it-important"}, "img": "muehle", "topic": "Mahlgrad", "st": 4}, {"id": "b2-21", "mode": "barista", "level": 2, "type": "case", "q": "Du hast den Mahlgrad deutlich verstellt. Was tust du vor dem nächsten Shot?", "options": ["Dosis erhöhen und sofort einen Shot ziehen", "Die Mühle ausschalten und abkühlen lassen", "Etwas Kaffee durchmahlen und verwerfen", "Den ersten Shot einfach länger laufen lassen"], "correct": 2, "explain": "In der Mühle verbliebenes Kaffeemehl hat noch die alte Mahlgröße; ein kleiner Spülgang (Purge) entfernt es.", "source": {"title": "Barista Magazine – Grind Retention: Why Is It Important?", "url": "https://baristamagazine.com/grind-retention-why-is-it-important"}, "img": "muehle", "topic": "Mahlgrad", "st": 2}, {"id": "b2-22", "mode": "barista", "level": 2, "type": "mc", "q": "Warum gilt Kaffee aus der Mokkakanne (Bialetti) nicht als Espresso?", "options": ["Brühtemperatur nur etwa 70 °C statt rund 93 °C", "Mahlgrad deutlich feiner als beim Espresso", "Brühzeit nur etwa 5 s statt rund 25 s", "Brühdruck nur etwa 1–2 bar statt rund 9 bar"], "correct": 3, "explain": "Die Mokkakanne extrahiert mit etwa 1–2 bar Dampfdruck; Espresso-Standards verlangen rund 9 bar.", "source": {"title": "Wikipedia – Moka pot (u. a. Navarini et al. 2009)", "url": "https://en.wikipedia.org/wiki/Moka_pot"}, "img": "espresso", "topic": "Espresso", "st": 2}, {"id": "b2-23", "mode": "barista", "level": 2, "type": "mc", "q": "Wie wird traditioneller türkischer Kaffee zubereitet?", "options": ["Mittelfein, kurz aufgekocht, durch Stofffilter gegossen", "Sehr fein, langsam im Kännchen erhitzt, ungefiltert", "Grob, lange im Kännchen gezogen, durch ein Sieb gegossen", "Sehr fein, mit Dampfdruck im Kännchen durchgedrückt"], "correct": 1, "explain": "Laut UNESCO wird pulverfein gemahlener Kaffee mit kaltem Wasser (und Zucker) im Kännchen langsam erhitzt; seit 2013 immaterielles Kulturerbe.", "source": {"title": "UNESCO – Turkish coffee culture and tradition", "url": "https://ich.unesco.org/en/RL/turkish-coffee-culture-and-tradition-00645"}, "img": "tasse", "topic": "Filter", "st": 3}, {"id": "b2-24", "mode": "barista", "level": 2, "type": "mc", "q": "Wozu dient die Präinfusion bei einer Siebträgermaschine?", "options": ["Sanft benetzen, damit sich Wasser gleichmäßig verteilt", "Brühgruppe vorheizen, damit die Temperatur stabil ist", "Puck nachverdichten, damit das Tampen entfällt", "Druck vorab erhöhen, damit mehr Crema entsteht"], "correct": 0, "explain": "Die kurze Benetzung mit niedrigem Druck verteilt das Wasser gleichmäßig im Kaffeebett und reduziert Channeling.", "source": {"title": "Clive Coffee – What is Pre-Infusion?", "url": "https://clivecoffee.com/blogs/learn/what-is-pre-infusion"}, "img": "espresso", "topic": "Espresso", "st": 3}, {"id": "b2-25", "mode": "barista", "level": 2, "type": "mc", "q": "Womit entkalkst du eine Siebträgermaschine?", "options": ["Mit Backflush-Reiniger für Kaffeeöle", "Mit Backpulver und heißem Wasser", "Mit Entkalker für Espressomaschinen", "Mit Essigessenz aus dem Supermarkt"], "correct": 2, "explain": "Empfohlen ist ein Entkalker für Espressomaschinen; Essig und Haushaltsentkalker können Rückstände hinterlassen und Dichtungen schädigen.", "source": {"title": "Seattle Coffee Gear – How to Descale Your Espresso Machine", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-descale-espresso-machine"}, "img": "wasser", "topic": "Pflege", "st": 1}, {"id": "b2-26", "mode": "barista", "level": 2, "type": "mc", "q": "Bis zu welcher täglichen Koffeinmenge sieht die EFSA für gesunde Erwachsene keine Bedenken?", "options": ["100 mg", "400 mg", "1.000 mg", "2.000 mg"], "correct": 1, "explain": "Laut EFSA sind bis zu 400 mg über den Tag verteilt und Einzeldosen bis 200 mg für gesunde Erwachsene unbedenklich (Schwangere: bis 200 mg/Tag).", "source": {"title": "EFSA explains: Caffeine", "url": "https://www.efsa.europa.eu/sites/default/files/corporate_publications/files/efsaexplainscaffeine150527.pdf"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 6}, {"id": "b2-27", "mode": "barista", "level": 2, "type": "mc", "q": "Was bewertest du beim Cupping als Erstes?", "options": ["Den Geschmack beim Schlürfen (Flavor)", "Den Nachgeschmack im Mund (Aftertaste)", "Das Aroma der nassen Kruste (Aroma)", "Den Duft des trockenen Mehls (Fragrance)"], "correct": 3, "explain": "Zuerst riecht man am trockenen Mehl, dann wird aufgegossen, nach etwa 4 Minuten die Kruste gebrochen und später geschlürft.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik", "st": 1}, {"id": "b2-28", "mode": "barista", "level": 2, "type": "mc", "q": "Warum schlürft man beim Cupping laut vom Löffel?", "options": ["Um die Säure mit Sauerstoff abzuschwächen", "Um ihn belüftet über den Gaumen zu verteilen", "Um Bitterstoffe an der Zungenspitze zu meiden", "Um den Kaffee nur vorne im Mund zu schmecken"], "correct": 1, "explain": "Schlürfen verteilt den Kaffee mit Luft über den Gaumen und kühlt ihn – so nimmt man feinere Aromen wahr.", "source": {"title": "Seattle Coffee Gear – How to Taste Coffee Like a Pro", "url": "https://www.seattlecoffeegear.com/blogs/scg-blog/how-to-taste-coffee-like-a-pro-and-an-intro-to-cupping"}, "img": "tasse", "topic": "Sensorik", "st": 2}, {"id": "b2-29", "mode": "barista", "level": 2, "type": "mc", "q": "Wie beeinflussen viele Feinanteile (Fines) einen Espresso?", "options": ["Sie füllen Lücken im Puck und bremsen den Fluss", "Sie lockern den Puck und beschleunigen den Fluss", "Sie lösen sich auf und senken die Extraktion", "Sie sammeln sich oben und schützen vor Channeling"], "correct": 0, "explain": "Fines (Partikel unter ca. 100 µm) erhöhen den Widerstand im Puck und extrahieren schnell – zu viele fördern Bitterkeit.", "source": {"title": "Kaffeemacher – Coffee Particle Distribution", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/coffee-particle-distribution"}, "img": "muehle", "topic": "Mahlgrad", "st": 5}, {"id": "b2-30", "mode": "barista", "level": 2, "type": "mc", "q": "Welches Brühprinzip kombiniert die AeroPress?", "options": ["Perkolation, dann Abtropfen durch Metallsieb", "Kaltextraktion, dann Filtern durch Stoff", "Dampfdruck, dann Filtern durch Metallsieb", "Immersion, dann Pressen durch Papierfilter"], "correct": 3, "explain": "Der Kaffee zieht zunächst im Wasser (Immersion), dann drückt man ihn mit dem Kolben durch einen Papier-Mikrofilter.", "source": {"title": "AeroPress – How AeroPress Works", "url": "https://aeropress.com/pages/how-it-works"}, "img": "filter", "topic": "Filter", "st": 2}, {"id": "b3-01", "mode": "barista", "level": 3, "type": "mc", "q": "18 g Kaffee ergeben 36 g Espresso mit 10 % TDS. Wie hoch ist die Extraktionsausbeute?", "options": ["10 %", "18 %", "20 %", "36 %"], "correct": 2, "explain": "Extraktion = TDS × Getränkegewicht ÷ Dosis = 10 % × 36 g ÷ 18 g = 20 %.", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "espresso", "topic": "Extraktion", "st": 2}, {"id": "b3-02", "mode": "barista", "level": 3, "type": "mc", "q": "15 g Kaffee ergeben 250 g Filterkaffee mit 1,30 % TDS. Wie hoch ist die Extraktion (gerundet)?", "options": ["19,5 %", "21,7 %", "13,0 %", "25,0 %"], "correct": 1, "explain": "1,30 % × 250 g ÷ 15 g ≈ 21,7 % – im klassischen Idealbereich von 18–22 %.", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "filter", "topic": "Extraktion", "st": 6}, {"id": "b3-03", "mode": "barista", "level": 3, "type": "mc", "q": "Gleiche Dosis, aber du lässt mehr Espresso in die Tasse laufen. Was passiert typischerweise?", "options": ["Stärke und Extraktion steigen", "Stärke und Extraktion sinken", "Stärke steigt, Extraktion sinkt", "Stärke sinkt, Extraktion steigt"], "correct": 3, "explain": "Laut Espresso Compass macht mehr Getränkemenge den Espresso zugleich schwächer und höher extrahiert.", "source": {"title": "Barista Hustle – The Espresso Compass", "url": "https://www.baristahustle.com/the-espresso-compass/"}, "img": "espresso", "topic": "Extraktion", "st": 2}, {"id": "b3-04", "mode": "barista", "level": 3, "type": "mc", "q": "SCA-Studie: Filterkaffee mit 87, 90 und 93 °C gebrüht, gleicher TDS und gleiche Extraktion. Ergebnis?", "options": ["Die Proben waren nicht unterscheidbar", "93 °C wurde klar am besten bewertet", "87 °C wurde deutlich süßer bewertet", "90 °C wurde als ausgewogenste bewertet"], "correct": 0, "explain": "Temperatur beeinflusst, wie schnell extrahiert wird – bei gleichem TDS und gleicher Extraktion waren die Tassen nicht unterscheidbar.", "source": {"title": "SCA – Brewing Temperature and the Sensory Profile of Brewed Coffee", "url": "https://sca.coffee/sca-news/read/just-published-brewing-temperature-and-the-sensory-profile-of-brewed-coffee-37dt6"}, "img": "filter", "topic": "Extraktion", "st": 4}, {"id": "b3-05", "mode": "barista", "level": 3, "type": "mc", "q": "Worauf basiert das überarbeitete SCA Coffee Taster's Flavor Wheel?", "options": ["Auf dem Espresso-Standard des INEI", "Auf dem Cupping-Bogen der SCAA", "Auf dem Brewing Control Chart", "Auf dem Sensory Lexicon des WCR"], "correct": 3, "explain": "Das WCR Sensory Lexicon ist die Grundlage des überarbeiteten Aromarads – die erste Neugestaltung seit rund 20 Jahren.", "source": {"title": "World Coffee Research – Sensory Lexicon", "url": "https://worldcoffeeresearch.org/resources/sensory-lexicon"}, "img": "rad", "topic": "Sensorik", "st": 7}, {"id": "b3-06", "mode": "barista", "level": 3, "type": "mc", "q": "Welches Verhältnis Kaffee zu Wasser gilt beim SCA-Cupping?", "options": ["8,25 g auf 150 ml", "12,5 g auf 100 ml", "4,75 g auf 250 ml", "16,5 g auf 150 ml"], "correct": 0, "explain": "Beim SCA-Cupping werden 8,25 g Kaffee auf 150 ml Wasser verwendet (ca. 0,055 g/ml).", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik", "st": 3}, {"id": "b3-07", "mode": "barista", "level": 3, "type": "mc", "q": "Wann wird beim SCA-Cupping standardmäßig die Kruste gebrochen?", "options": ["Nach etwa 30 Sekunden", "Nach etwa 4 Minuten", "Nach etwa 15 Minuten", "Nach etwa 30 Minuten"], "correct": 1, "explain": "Nach dem Aufgießen mit ca. 93 °C heißem Wasser zieht der Kaffee etwa 4 Minuten, dann wird die Kruste gebrochen.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik", "st": 1}, {"id": "b3-08", "mode": "barista", "level": 3, "type": "mc", "q": "Ab welcher Punktzahl gilt Kaffee auf der klassischen 100-Punkte-Skala der SCA als Specialty?", "options": ["60 Punkte", "70 Punkte", "90 Punkte", "80 Punkte"], "correct": 3, "explain": "Nach dem klassischen SCA-Cupping-Bogen gilt Kaffee ab 80 Punkten als Specialty Coffee.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik", "st": 1}, {"id": "b3-09", "mode": "barista", "level": 3, "type": "mc", "q": "Welcher Chlorgehalt ist im SCA-Wasserstandard als Ziel angegeben?", "options": ["0 mg/L", "10 mg/L", "50 mg/L", "100 mg/L"], "correct": 0, "explain": "Chlor soll im Brühwasser gar nicht vorhanden sein – Ziel ist 0 mg/L.", "source": {"title": "Prima Coffee – Testing Your Water (SCA-Wasserstandard)", "url": "https://prima-coffee.com/blog/testing-your-water/"}, "img": "wasser", "topic": "Wasser", "st": 5}, {"id": "b3-10", "mode": "barista", "level": 3, "type": "mc", "q": "Warum muss das Tuch für die Dampflanze sauber sein, obwohl die Milch erhitzt wird?", "options": ["Weil sich Keime in heißer Milch besonders schnell vermehren", "Weil 55–60 °C weit unter der Pasteurisierung liegen", "Weil Keime erst beim Kochen ab 100 °C sterben", "Weil das Tuch Kalkreste auf die Dampflanze überträgt"], "correct": 1, "explain": "Übliche Milchtemperaturen (55–60 °C) liegen weit unter der Pasteurisierung (≥72 °C für 15 s) und töten Erreger nicht ab; das Wischtuch ist eine typische Kontaminationsquelle.", "source": {"title": "Barista Hustle – Hygiene", "url": "https://www.baristahustle.com/lesson/la-5-05-hygiene/"}, "img": "milch", "topic": "Pflege", "st": 2}, {"id": "b3-11", "mode": "barista", "level": 3, "type": "mc", "q": "Wie viel Kaffeemehl sieht das INEI für einen zertifizierten Espresso Italiano vor?", "options": ["Etwa 3 g", "Etwa 14 g", "Etwa 7 g", "Etwa 21 g"], "correct": 2, "explain": "Das INEI verlangt 7 g (±0,5 g) für etwa 25 ml in der Tasse.", "source": {"title": "Manufactum – Guten Espresso erkennen (INEI-Kriterien)", "url": "https://www.manufactum.com/good-espresso-recognize-c200599/"}, "img": "espresso", "topic": "Standards", "st": 5}, {"id": "b3-12", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Getränkestärke (TDS) gilt im klassischen Brewing Control Chart als ideal für Filterkaffee?", "options": ["0,55–0,75 %", "2,15–2,35 %", "1,15–1,35 %", "3,15–3,35 %"], "correct": 2, "explain": "Laut Lockharts Brewing Control Chart liegt der ideale Filterkaffee bei 1,15–1,35 % TDS.", "source": {"title": "Barista Hustle – Towards a Common Coffee Control Chart", "url": "https://www.baristahustle.com/towards-a-common-coffee-control-chart/"}, "img": "filter", "topic": "Extraktion", "st": 3}, {"id": "b3-13", "mode": "barista", "level": 3, "type": "mc", "q": "Wie viel mg/L Calciumcarbonat (CaCO₃) entspricht etwa 1 °dH (deutsche Härte)?", "options": ["Etwa 1,8 mg/L", "Etwa 178 mg/L", "Etwa 17,8 mg/L", "Etwa 0,18 mg/L"], "correct": 2, "explain": "1 °dH ist definiert als 10 mg CaO pro Liter, das entspricht rund 17,8 mg/L CaCO₃.", "source": {"title": "Wikipedia – Degrees of general hardness (dGH)", "url": "https://en.wikipedia.org/wiki/DGH"}, "img": "wasser", "topic": "Wasser", "st": 9}, {"id": "b3-14", "mode": "barista", "level": 3, "type": "mc", "q": "Welcher Zielwert für die Gesamtalkalinität steht im SCA-Wasserstandard?", "options": ["Etwa 40 mg/L", "Etwa 10 mg/L", "Etwa 150 mg/L", "Etwa 400 mg/L"], "correct": 0, "explain": "Der SCA-Standard nennt 40 mg/L Alkalinität als Ziel („at or near 40 mg/L“).", "source": {"title": "Prima Coffee – Testing Your Water (SCA-Wasserstandard)", "url": "https://prima-coffee.com/blog/testing-your-water/"}, "img": "wasser", "topic": "Wasser", "st": 9}, {"id": "b3-15", "mode": "barista", "level": 3, "type": "mc", "q": "Welchen pH-Wert nennt der SCA-Wasserstandard als Ziel?", "options": ["pH 4,5", "pH 5,5", "pH 9,0", "pH 7,0"], "correct": 3, "explain": "Ziel ist neutrales Wasser mit pH 7; akzeptiert werden 6,5–7,5.", "source": {"title": "Prima Coffee – Testing Your Water (SCA-Wasserstandard)", "url": "https://prima-coffee.com/blog/testing-your-water/"}, "img": "wasser", "topic": "Wasser", "st": 5}, {"id": "b3-16", "mode": "barista", "level": 3, "type": "mc", "q": "Warum enthält papiergefilterter Kaffee kaum Cafestol, French-Press-Kaffee dagegen viel?", "options": ["Cafestol entsteht erst durch den Druck des Kolbens", "Papier hält die Diterpene wie Cafestol zurück", "Cafestol verdampft beim langsamen Handaufguss", "French Press brüht heißer und löst mehr Cafestol"], "correct": 1, "explain": "Papier hält die fettlöslichen Diterpene zurück; ungefilterter Kaffee (French Press, türkisch) enthält am meisten – regelmäßig getrunken kann er das Serumcholesterin erhöhen.", "source": {"title": "Wikipedia – Cafestol (Zhang et al. 2012; Urgert & Katan 1997)", "url": "https://en.wikipedia.org/wiki/Cafestol"}, "img": "filter", "topic": "Filter", "st": 5}, {"id": "b3-17", "mode": "barista", "level": 3, "type": "mc", "q": "Was bedeutet eine „bimodale“ Partikelverteilung beim Espressomahlgut?", "options": ["Eine einzige Spitze ohne nennenswerten Feinanteil", "Zwei Mahlstufen, die nacheinander gemahlen werden", "Zwei Größenspitzen: Feinanteil und Hauptanteil", "Gleichmäßig breite Verteilung ohne klare Spitze"], "correct": 2, "explain": "Espresso-Mahlgut zeigt meist zwei „Peaks“: einen Feinanteil (oft ca. 30–70 µm) und einen Hauptpeak mit dem Großteil des Mahlguts.", "source": {"title": "Kaffeemacher – Coffee Particle Distribution", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/coffee-particle-distribution"}, "img": "muehle", "topic": "Mahlgrad", "st": 5}, {"id": "b3-18", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Organisation vergibt die Q-Arabica-Grader-Lizenz?", "options": ["Coffee Quality Institute (CQI)", "World Coffee Research (WCR)", "International Coffee Organization (ICO)", "Istituto Nazionale Espresso Italiano (INEI)"], "correct": 0, "explain": "Das Coffee Quality Institute betreibt das Q-Programm; die Lizenz gilt 3 Jahre und muss dann per Kalibrierung erneuert werden.", "source": {"title": "Coffee Quality Institute – Who is a Q Grader?", "url": "https://www.coffeeinstitute.org/who-is-a-q-grader"}, "img": "tasse", "topic": "Sensorik", "st": 2}, {"id": "b3-19", "mode": "barista", "level": 3, "type": "mc", "q": "Wie entstand die heutige Specialty Coffee Association (SCA)?", "options": ["Durch Ausgliederung aus der ICO 1963", "Durch Umbenennung der SCAA 2012", "Durch Abspaltung vom INEI 1998", "Durch Fusion von SCAA und SCAE 2017"], "correct": 3, "explain": "Die SCA entstand 2017 aus der Vereinigung der amerikanischen (SCAA) und der europäischen (SCAE) Specialty Coffee Association.", "source": {"title": "SCA – About", "url": "https://sca.coffee/about"}, "img": "tasse", "topic": "Standards", "st": 1}, {"id": "b3-20", "mode": "barista", "level": 3, "type": "mc", "q": "Was löste die SCA mit dem Coffee Value Assessment (CVA) ab?", "options": ["Den Espresso-Italiano-Standard des INEI", "Cupping-Protokoll und -Formular von 2004", "Den Wasserstandard der SCA für Brühwasser", "Das Brewing Control Chart von 1957"], "correct": 1, "explain": "Die SCA übernahm 2024 die CVA-Standards (u. a. deskriptive und affektive Bewertung) als Ersatz für Protokoll und Formular von 2004.", "source": {"title": "SCA – SCA Officially Adopts CVA as New Cupping Standards", "url": "https://sca.coffee/sca-news/sca-new-cva-cupping-standards"}, "img": "tasse", "topic": "Sensorik", "st": 8}, {"id": "b3-21", "mode": "barista", "level": 3, "type": "mc", "q": "Wie fein wird laut SCA-Cupping-Protokoll gemahlen?", "options": ["90–95 % passieren ein US-Sieb Nr. 50", "50–55 % passieren ein US-Sieb Nr. 20", "70–75 % passieren ein US-Sieb Nr. 20", "70–75 % passieren ein US-Sieb Nr. 40"], "correct": 2, "explain": "Vorgabe: 70–75 % des Mahlguts passieren ein US-Standardsieb Nr. 20 – etwas gröber als für Filterkaffee.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik", "st": 7}, {"id": "b3-22", "mode": "barista", "level": 3, "type": "mc", "q": "Wie viele Tassen pro Probe sieht das SCA-Standard-Cupping vor?", "options": ["1 Tasse", "5 Tassen", "10 Tassen", "20 Tassen"], "correct": 1, "explain": "Für ein SCA-Standard-Cupping werden 5 Tassen pro Probe angesetzt, um auch die Gleichmäßigkeit zu prüfen.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik", "st": 1}, {"id": "b3-23", "mode": "barista", "level": 3, "type": "mc", "q": "Wann soll eine Probe für das SCA-Cupping geröstet worden sein?", "options": ["36–48 Stunden vor dem Cupping", "3–5 Tage vor dem Cupping", "2–4 Wochen vor dem Cupping", "8–24 Stunden vor dem Cupping"], "correct": 3, "explain": "Das Protokoll sieht eine Röstdauer von 8–12 Minuten vor, 8–24 Stunden vor dem Cupping.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik", "st": 7}, {"id": "b3-24", "mode": "barista", "level": 3, "type": "mc", "q": "Woher hat die Faema-Brühgruppe E61 ihren Namen?", "options": ["Von der totalen Sonnenfinsternis 1961", "Von der Weltausstellung in Turin 1961", "Von der Gruppentemperatur von 61 °C", "Vom Gründungsjahr der Firma Faema 1961"], "correct": 0, "explain": "Ernesto Valente benannte die 1961 vorgestellte Gruppe nach der in Italien sichtbaren Sonnenfinsternis jenes Jahres.", "source": {"title": "Kaffeemacher – Die Faema E61 Brühgruppe", "url": "https://kaffeemacher.ch/en/blogs/kaffeewissen/faema-e61-bruehgruppe"}, "img": "espresso", "topic": "Espresso", "st": 1}, {"id": "b3-25", "mode": "barista", "level": 3, "type": "mc", "q": "Wie hält die E61-Brühgruppe ihre Temperatur?", "options": ["Heizstab: ein eigenes Element heizt die Gruppe", "Umwälzpumpe: Kesselwasser wird durchgepumpt", "Gasbrenner: eine Flamme heizt die Gruppe direkt", "Thermosiphon: Kesselwasser zirkuliert ohne Pumpe"], "correct": 3, "explain": "Heißes Wasser steigt vom Kessel durch ein Rohr in die schwere Messinggruppe und fließt abgekühlt zurück – ein Thermosiphon-Kreislauf.", "source": {"title": "Kaffeemacher – Die Faema E61 Brühgruppe", "url": "https://kaffeemacher.ch/en/blogs/kaffeewissen/faema-e61-bruehgruppe"}, "img": "espresso", "topic": "Espresso", "st": 4}, {"id": "b3-26", "mode": "barista", "level": 2, "type": "mc", "q": "Wie funktioniert eine Zweikreiser-Maschine (Wärmetauscher, HX)?", "options": ["Zwei getrennte Kessel für Brühen und Dampf", "Zwei Thermoblöcke, je einer für Brühen und Dampf", "Ein Dampfkessel, durch den ein Brührohr läuft", "Ein Brühkessel, durch den ein Dampfrohr läuft"], "correct": 2, "explain": "Beim HX gibt es einen Kessel; das Brühwasser wird in einem durch den Dampfkessel geführten Rohr erhitzt. Getrennte Kessel hat die Dualboiler-Maschine.", "source": {"title": "Seattle Coffee Gear – Heat Exchangers vs. Dual Boilers", "url": "https://www.seattlecoffeegear.com/blogs/scg-blog/heat-exchangers-vs-dual-boilers"}, "img": "espresso", "topic": "Espresso", "st": 9}, {"id": "b3-27", "mode": "barista", "level": 3, "type": "mc", "q": "Wer erhielt 1884 in Turin ein frühes Patent für eine dampfbetriebene Kaffeemaschine?", "options": ["Achille Gaggia", "Angelo Moriondo", "Alfonso Bialetti", "Ernesto Valente"], "correct": 1, "explain": "Angelo Moriondo aus Turin patentierte 1884 eine Dampfmaschine zur schnellen Kaffeezubereitung – ein Vorläufer der Espressomaschine.", "source": {"title": "Smithsonian Magazine – The Long History of the Espresso Machine", "url": "https://www.smithsonianmag.com/arts-culture/the-long-history-of-the-espresso-machine-126012814/"}, "img": "espresso", "topic": "Espresso", "st": 3}, {"id": "b3-28", "mode": "barista", "level": 3, "type": "mc", "q": "Mit welcher Entwicklung kam die Crema auf den Espresso?", "options": ["Mit Bialettis Aluminium-Mokkakanne von 1933", "Mit Moriondos Dampf-Kaffeemaschine von 1884", "Mit Gaggias Hochdruck-Hebelmaschine nach 1945", "Mit Faemas Pumpen-Brühgruppe E61 von 1961"], "correct": 2, "explain": "Laut Smithsonian kam die Crema erst mit Gaggias Hochdruck-Hebelmaschine; Gaggia soll den Schaum „caffè crema“ genannt haben.", "source": {"title": "Smithsonian Magazine – The Long History of the Espresso Machine", "url": "https://www.smithsonianmag.com/arts-culture/the-long-history-of-the-espresso-machine-126012814/"}, "img": "crema", "topic": "Espresso", "st": 4}, {"id": "b3-29", "mode": "barista", "level": 2, "type": "mc", "q": "Welche tägliche Koffeinmenge hält die EFSA für Schwangere für unbedenklich?", "options": ["Bis 200 mg pro Tag", "Bis 400 mg pro Tag", "Bis 600 mg pro Tag", "Bis 100 mg pro Tag"], "correct": 0, "explain": "Laut EFSA gelten für Schwangere und Stillende bis 200 mg Koffein pro Tag aus allen Quellen als unbedenklich für das Kind.", "source": {"title": "EFSA explains: Caffeine", "url": "https://www.efsa.europa.eu/sites/default/files/corporate_publications/files/efsaexplainscaffeine150527.pdf"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 10}, {"id": "b3-30", "mode": "barista", "level": 2, "type": "mc", "q": "Welche mittlere Halbwertszeit von Koffein nennt die EFSA für gesunde Erwachsene?", "options": ["Etwa 1 Stunde", "Etwa 4 Stunden", "Etwa 12 Stunden", "Etwa 24 Stunden"], "correct": 1, "explain": "Im Mittel baut der Körper die Hälfte des Koffeins in rund 4 Stunden ab – je nach Person 2 bis 8 Stunden.", "source": {"title": "EFSA explains: Caffeine", "url": "https://www.efsa.europa.eu/sites/default/files/corporate_publications/files/efsaexplainscaffeine150527.pdf"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 10}, {"id": "b2-31", "mode": "barista", "level": 2, "type": "mc", "topic": "Espresso", "img": "espresso", "q": "Am Ende des Bezugs zischt es kurz, und etwas Wasser läuft in die Tropfschale. Was passiert da?", "options": ["Das 3-Wege-Ventil baut den Druck in der Brühgruppe ab", "Das Überdruckventil leert den zu vollen Dampfkessel", "Die Pumpe spült die Brühgruppe automatisch nach", "Der Kessel lässt beim Nachheizen Dampf nach unten ab"], "correct": 0, "explain": "Das 3-Wege-Magnetventil entlastet nach dem Bezug den Druck über dem Kaffeebett und leitet Restwasser in die Tropfschale. Darum kannst du den Siebträger gleich ausspannen, und Rückspülen wird erst so möglich.", "source": {"title": "Seattle Coffee Gear – How to Backflush Your Espresso Machine", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-backflush-espresso-machine"}, "st": 10}, {"id": "b2-32", "mode": "barista", "level": 2, "type": "mc", "topic": "Wasser", "img": "wasser", "q": "Du brühst in Boulder (rund 1.650 m hoch) Filterkaffee mit dem Wasserkocher. Was ist anders als auf Meereshöhe?", "options": ["Das Wasser kocht schon bei etwa 94 bis 95 °C", "Das Wasser kocht erst bei etwa 104 bis 105 °C", "Das Wasser kocht wie überall genau bei 100 °C", "Das Wasser kocht schon bei etwa 80 bis 82 °C"], "correct": 0, "explain": "Der niedrigere Luftdruck senkt den Siedepunkt, in Boulder auf etwa 94,5 °C. Heißer wird das Wasser im offenen Kocher nicht. Das kann zu sauren, dünnen Tassen führen; feiner mahlen oder länger brühen gleicht aus.", "source": {"title": "Sean Elvidge – Brewing the Perfect Coffee at Altitude", "url": "https://seanelvidge.com/articles/2025/Brewing_coffee_at_altitude/"}, "st": 10}, {"id": "b2-33", "mode": "barista", "level": 2, "type": "mc", "topic": "Espresso", "img": "espresso", "q": "Was unterscheidet eine Thermoblock-Maschine von einer Kesselmaschine?", "options": ["Sie erhitzt das Wasser erst beim Durchfließen", "Sie hält das Brühwasser in zwei Kesseln bereit", "Sie erhitzt das Brühwasser im Dampfkessel mit", "Sie brüht ohne Pumpe, allein mit Dampfdruck"], "correct": 0, "explain": "Im Thermoblock fließt das Wasser durch ein dünnes Rohr in einem stark beheizten Block und wird erst bei Bedarf erhitzt. Er ist oft in einer Minute brühbereit, tut sich aber schwer, gleichzeitig zu brühen und zu dampfen. Ein Kessel hält gleichmäßig erhitztes Wasser bereit.", "source": {"title": "Seattle Coffee Gear – Thermoblock vs. Boiler Espresso Machines", "url": "https://www.seattlecoffeegear.com/blogs/scg-blog/thermoblock-vs-boiler-espresso-machines"}, "st": 10}, {"id": "b1-101", "mode": "barista", "level": 1, "type": "mc", "q": "Woher stammt der Cortado ursprünglich?", "options": ["Aus Australien", "Aus Österreich", "Aus Neuseeland", "Aus Spanien"], "correct": 3, "explain": "Der Cortado kommt aus Spanien, vermutlich aus dem Baskenland. „Cortado“ heißt „geschnitten“ – die Milch schneidet die Intensität des Espressos.", "source": {"title": "Perfect Daily Grind – What Is a Cortado?", "url": "https://perfectdailygrind.com/2020/03/what-is-a-cortado/"}, "img": "milch", "topic": "Getränke", "st": 9}, {"id": "b1-102", "mode": "barista", "level": 1, "type": "mc", "q": "Um welche Herkunft des Flat White streiten sich zwei Länder?", "options": ["Italien und Frankreich", "Spanien und Portugal", "Australien und Neuseeland", "USA und Kanada"], "correct": 2, "explain": "Ob der Flat White in Australien oder Neuseeland erfunden wurde, ist umstritten – beide Länder haben Anwärter auf die Erfindung.", "source": {"title": "Perfect Daily Grind – What is a flat white & where did it come from?", "url": "https://perfectdailygrind.com/2022/06/what-is-a-flat-white/"}, "img": "milch", "topic": "Getränke", "st": 3}, {"id": "b1-103", "mode": "barista", "level": 1, "type": "mc", "q": "Woher hat der Cappuccino seinen Namen?", "options": ["Von der Kutte der Kapuzinermönche", "Von der Kapuze aus Milchschaum", "Vom italienischen Wort für „Tasse“", "Vom Erfinder Giovanni Capuccini"], "correct": 0, "explain": "Der Name geht auf die Kapuziner zurück: Im Wien des 19. Jahrhunderts mischte man Kaffee mit Milch oder Sahne, bis die Farbe der Mönchskutte entsprach („Kapuziner“).", "source": {"title": "Perfect Daily Grind – What Is a Cappuccino & How Has It Developed Over Time?", "url": "https://perfectdailygrind.com/2020/03/what-is-a-cappuccino-how-has-it-developed-over-time/"}, "img": "milch", "topic": "Getränke", "st": 3}, {"id": "b1-104", "mode": "barista", "level": 1, "type": "mc", "q": "Was ist ein Espresso macchiato?", "options": ["Viel heiße Milch mit einem Schuss Espresso", "Espresso mit gleich viel heißem Wasser", "Espresso mit Sahnehaube und Kakao", "Espresso mit etwas Milchschaum obenauf"], "correct": 3, "explain": "Beim Espresso macchiato („befleckt“) kommt nur wenig Milchschaum auf den Espresso. Der Latte macchiato ist dagegen groß und sehr milchig.", "source": {"title": "Perfect Daily Grind – Microfoam: How much should each milk-based coffee drink have?", "url": "https://perfectdailygrind.com/2024/01/microfoam-milk-coffee-latte-art/"}, "img": "milch", "topic": "Getränke", "st": 1}, {"id": "b1-105", "mode": "barista", "level": 1, "type": "mc", "q": "Welches dieser Getränke ist in der Regel das größte und milchigste?", "options": ["Cappuccino", "Flat White", "Latte", "Cortado"], "correct": 2, "explain": "Ein Latte ist größer als ein Cappuccino (oft um 240 ml) und hat ein höheres Verhältnis von Milch zu Espresso; Cortado und Macchiato sind am kleinsten.", "source": {"title": "Perfect Daily Grind – What Is a Cappuccino & How Has It Developed Over Time?", "url": "https://perfectdailygrind.com/2020/03/what-is-a-cappuccino-how-has-it-developed-over-time/"}, "img": "milch", "topic": "Getränke", "st": 1}, {"id": "b1-106", "mode": "barista", "level": 1, "type": "mc", "q": "Wie viel Milchschaum hat ein Cappuccino nach SCA- und WBC-Definition mindestens?", "options": ["Etwa 1 cm", "Etwa 2 mm", "Etwa 4 cm", "Etwa 6 cm"], "correct": 0, "explain": "Nach SCA und World Barista Championship hat ein Cappuccino mindestens 1 cm Schaumhöhe, senkrecht gemessen.", "source": {"title": "Perfect Daily Grind – What Is a Cappuccino & How Has It Developed Over Time?", "url": "https://perfectdailygrind.com/2020/03/what-is-a-cappuccino-how-has-it-developed-over-time/"}, "img": "milch", "topic": "Getränke", "st": 9}, {"id": "b1-107", "mode": "barista", "level": 1, "type": "mc", "q": "Wie reinigst du eine Mokkakanne aus Aluminium?", "options": ["Mit Spülmittel in der Spülmaschine", "Nur mit Wasser, ohne Spülmittel", "Mit Scheuermilch und Stahlwolle", "Mit Essigessenz nach jedem Brühen"], "correct": 1, "explain": "Aluminiumkannen reinigt man nur mit Wasser: Spülmittel kann das Aluminium angreifen, die Spülmaschine ist tabu, sofern der Hersteller sie nicht erlaubt.", "source": {"title": "Kaffeemacher – Espressokocher (Mokka-Kanne): Anleitung und Tipps", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/espressokocher-mokka-kanne"}, "img": "filter", "topic": "Filter", "st": 6}, {"id": "b1-108", "mode": "barista", "level": 1, "type": "mc", "q": "Wie schmeckt Flash Brew im Vergleich zu Cold Brew typischerweise?", "options": ["Heller, mit mehr Säure und Aroma", "Dunkler, mit mehr Bitterkeit und Körper", "Gleich, nur mit mehr Koffein", "Süßer, mit weniger Aroma und Säure"], "correct": 0, "explain": "Flash Brew wird heiß extrahiert und behält mehr Säure, Helligkeit und Aromatik; Cold Brew gilt als weicher und süßer.", "source": {"title": "Perfect Daily Grind – What is flash brew coffee?", "url": "https://perfectdailygrind.com/2022/03/what-is-flash-brew-coffee/"}, "img": "filter", "topic": "Filter", "st": 7}, {"id": "b1-109", "mode": "barista", "level": 1, "type": "mc", "q": "Welcher Mahlgrad passt zu Cold Brew?", "options": ["Sehr fein, etwa wie für Espresso", "Mittelfein, etwa wie für die Mokkakanne", "Pulverfein, etwa wie für türkischen Mokka", "Grob, etwa wie für die French Press"], "correct": 3, "explain": "Cold Brew zieht sehr lange; dafür empfiehlt Kaffeemacher einen groben Mahlgrad wie bei der French Press. Zu fein macht ihn bitter und trüb.", "source": {"title": "Kaffeemacher – Cold Brew selber machen: Anleitung & Verhältnis", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/cold-brew"}, "img": "muehle", "topic": "Mahlgrad", "st": 3}, {"id": "b1-110", "mode": "barista", "level": 1, "type": "mc", "q": "Bis wohin füllst du den Wasserkessel einer Mokkakanne?", "options": ["Bis knapp über das Sicherheitsventil", "Knapp unter das Sicherheitsventil", "Bis zum oberen Rand des Kessels", "Genau bis zur Hälfte des Kessels"], "correct": 1, "explain": "Das Wasser soll knapp unter dem Sicherheitsventil stehen. Darüber kann die Kanne schlecht funktionieren, und Wasser kann sich mit dem Kaffeemehl mischen.", "source": {"title": "Bialetti – The Moka valve: a tiny component of remarkable importance", "url": "https://www.bialetti.com/it_en/inspiration/post/the-moka-valve-a-tiny-component-of-remarkable-importance"}, "img": "filter", "topic": "Filter", "st": 6}, {"id": "b1-111", "mode": "barista", "level": 1, "type": "mc", "q": "Wie füllst du das Kaffeemehl in den Trichter einer Mokkakanne?", "options": ["Locker einfüllen, nicht festdrücken", "Kräftig andrücken wie beim Espresso", "Halb füllen und dann leicht anpressen", "Mit Tamper fest und schräg andrücken"], "correct": 0, "explain": "Bei der Mokkakanne wird nicht getampt: Festdrücken erhöht den Druck und macht den Kaffee bitter. Das Sieb wird locker gefüllt und nur abgestrichen.", "source": {"title": "Kaffeemacher – Espressokocher (Mokka-Kanne): Anleitung und Tipps", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/espressokocher-mokka-kanne"}, "img": "tamper", "topic": "Filter", "st": 8}, {"id": "b1-112", "mode": "barista", "level": 1, "type": "case", "q": "Wann nimmst du die Mokkakanne vom Herd?", "options": ["Erst wenn kein Kaffee mehr nachläuft", "Sobald das Wasser im Kessel kocht", "Sobald es zu blubbern und zischen beginnt", "Nach genau fünf Minuten auf voller Hitze"], "correct": 2, "explain": "Sobald der Kaffee zu sprudeln und zu zischen beginnt, kommt die Kanne vom Herd – danach drückt nur noch Dampf durch und löst Bitterstoffe.", "source": {"title": "Kaffeemacher – Espressokocher (Mokka-Kanne): Anleitung und Tipps", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/espressokocher-mokka-kanne"}, "img": "filter", "topic": "Filter", "case": {"title": "Fall · Mokka am Herd", "facts": ["Kanne auf voller Hitze", "Kaffee steigt gleichmäßig ins Oberteil", "Die Tasse soll nicht bitter werden"]}, "st": 5}, {"id": "b1-113", "mode": "barista", "level": 1, "type": "mc", "q": "Warum funktioniert die klassische Aluminium-Mokkakanne nicht auf Induktion?", "options": ["Weil Aluminium bei Induktion schmilzt", "Weil Aluminium nicht magnetisch ist", "Weil der Boden zu dick für Induktion ist", "Weil Induktion nicht heiß genug wird"], "correct": 1, "explain": "Induktion braucht einen ferromagnetischen Boden. Aluminium ist das nicht – dafür gibt es Kannen aus Edelstahl oder mit magnetischem Boden.", "source": {"title": "Kaffeemacher – Espressokocher (Mokka-Kanne): Anleitung und Tipps", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/espressokocher-mokka-kanne"}, "img": "filter", "topic": "Filter", "st": 4}, {"id": "b1-114", "mode": "barista", "level": 1, "type": "mc", "q": "Was passiert, wenn der Kaffee nach dem Pressen in der French Press bleibt?", "options": ["Er wird mit der Zeit süßer", "Er wird mit der Zeit klarer", "Er behält genau seinen Geschmack", "Er wird mit der Zeit bitter"], "correct": 3, "explain": "Laut NCA sollte man French-Press-Kaffee nach dem Herunterdrücken sofort servieren oder umfüllen – bleibt er auf dem Satz, wird er bitter.", "source": {"title": "NCA – French Press Coffee", "url": "https://www.aboutcoffee.org/brewing/french-press-coffee/"}, "img": "filter", "topic": "Filter", "st": 2}, {"id": "b1-115", "mode": "barista", "level": 1, "type": "mc", "q": "Wie viel Wasser nimmst du laut NCA für den Bloom beim Handfilter?", "options": ["Etwa die Hälfte des Kaffeegewichts", "Etwa das Zehnfache des Kaffeegewichts", "Etwa das Doppelte des Kaffeegewichts", "Genau so viel wie das Kaffeegewicht"], "correct": 2, "explain": "Für den Bloom gießt man etwa die doppelte Kaffeemenge an Wasser auf (z. B. 30 g Wasser für 15 g Kaffee) und wartet 30–45 Sekunden.", "source": {"title": "NCA – Pour-over Coffee", "url": "https://www.aboutcoffee.org/brewing/pour-over-coffee/"}, "img": "filter", "topic": "Filter", "st": 8}, {"id": "b1-116", "mode": "barista", "level": 1, "type": "mc", "q": "Welches Brühverhältnis ist ein gängiger Startpunkt für Handfilter?", "options": ["Etwa 1:16", "Etwa 1:2", "Etwa 1:5", "Etwa 1:40"], "correct": 0, "explain": "Gängig sind etwa 1:13 bis 1:17; Kaffeemacher empfiehlt rund 6 g Kaffee pro 100 ml Wasser, das Standardrezept 18 g auf 300 g.", "source": {"title": "Kaffeemacher – Filterkaffee zubereiten", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/filter-coffee-brewing"}, "img": "filter", "topic": "Filter", "st": 5}, {"id": "b1-117", "mode": "barista", "level": 1, "type": "mc", "q": "Für welche Zubereitung mahlst du am feinsten?", "options": ["Mokkakanne", "Handfilter V60", "Siebträger-Espresso", "French Press"], "correct": 2, "explain": "Espresso braucht den feinsten Mahlgrad dieser vier; die Mokkakanne etwas gröber, der Handfilter mittel, die French Press grob.", "source": {"title": "Kaffeemacher – Espressokocher (Mokka-Kanne): Anleitung und Tipps", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/espressokocher-mokka-kanne"}, "img": "muehle", "topic": "Mahlgrad", "st": 1}, {"id": "b1-118", "mode": "barista", "level": 1, "type": "mc", "q": "In welcher Zeitspanne läuft ein klassischer Espresso meist durch?", "options": ["Etwa 5–10 Sekunden", "Etwa 20–30 Sekunden", "Etwa 60–90 Sekunden", "Etwa 3–4 Minuten"], "correct": 1, "explain": "Die NCA nennt 20–30 Sekunden Kontaktzeit für einen Espresso; viele Cafés liegen bei rund 25–32 Sekunden.", "source": {"title": "NCA – Espresso", "url": "https://www.aboutcoffee.org/brewing/espresso/"}, "img": "espresso", "topic": "Espresso", "st": 3}, {"id": "b1-119", "mode": "barista", "level": 1, "type": "mc", "q": "Du dosierst 18 g Kaffee. Welche Espressomenge ist ein gängiger Startpunkt?", "options": ["Etwa 36 g in der Tasse", "Etwa 9 g in der Tasse", "Etwa 90 g in der Tasse", "Etwa 180 g in der Tasse"], "correct": 0, "explain": "Als Ausgangspunkt gilt ein Verhältnis von 1:2 – also 18 g Kaffeemehl zu 36 g Espresso.", "source": {"title": "Perfect Daily Grind – A Guide To Dialling In Espresso", "url": "https://perfectdailygrind.com/2020/07/a-guide-to-dialling-in-espresso/"}, "img": "espresso", "topic": "Espresso", "st": 3}, {"id": "b1-120", "mode": "barista", "level": 1, "type": "mc", "q": "Was ist der typische Nachteil einer Einkreiser-Maschine mit einem Kessel?", "options": ["Sie kann nur mit Kapseln betrieben werden", "Sie erreicht nie einen Druck von 9 bar", "Brühen und Dampfen geht nicht gleichzeitig", "Sie braucht zwingend einen Festwasseranschluss"], "correct": 2, "explain": "Ein Einkreiser hat einen Kessel mit zwei Thermostaten; du musst zwischen Brühen und Dampfen wechseln und warten, bis die Temperatur passt.", "source": {"title": "Clive Coffee – How Do Espresso Machines Work?", "url": "https://clivecoffee.com/blogs/learn/how-do-espresso-machines-work"}, "img": "espresso", "topic": "Espresso", "st": 8}, {"id": "b1-121", "mode": "barista", "level": 1, "type": "mc", "q": "Wie voll füllst du das Milchkännchen vor dem Aufschäumen etwa?", "options": ["Zu etwa einem Drittel bis zur Hälfte", "Bis knapp unter den oberen Rand", "Nur so, dass der Boden bedeckt ist", "Zu etwa drei Vierteln der Höhe"], "correct": 0, "explain": "Empfohlen ist ein Kännchen eine Nummer größer als das Getränk, zu etwa einem Drittel bis zur Hälfte gefüllt – so bleibt Platz für Volumen und Wirbel.", "source": {"title": "Perfect Daily Grind – Why does milk foam disintegrate?", "url": "https://perfectdailygrind.com/2021/01/why-does-milk-foam-disintegrate/"}, "img": "milch", "topic": "Milch", "st": 6}, {"id": "b1-122", "mode": "barista", "level": 1, "type": "mc", "q": "Welcher Ausguss am Milchkännchen eignet sich am besten für feine Latte Art?", "options": ["Breiter, runder Ausguss", "Gerader Ausguss ohne Lippe", "Ausguss mit Siebeinsatz", "Spitz zulaufender Ausguss"], "correct": 3, "explain": "Ein spitzer Ausguss erlaubt feine Linien und klare Rosettas; ein breiter, runder ist gutmütiger für Herzen, begrenzt aber Details.", "source": {"title": "Clive Coffee – Best Milk Pitcher for Latte Art at Home", "url": "https://clivecoffee.com/blogs/learn/best-milk-pitcher-for-latte-art-at-home-size-material-clive"}, "img": "milch", "topic": "Milch", "st": 6}, {"id": "b1-123", "mode": "barista", "level": 1, "type": "case", "q": "Ein Kollege will die übrige Milch für das nächste Getränk nochmal aufdampfen. Was sagst du?", "options": ["Kein Problem – sie schäumt dann sogar besser", "Nicht nochmal dampfen – Textur und Hygiene leiden", "Kein Problem – kurz kalte Milch dazugießen", "Nur nochmal dampfen, wenn sie unter 40 °C ist"], "correct": 1, "explain": "Milch lässt sich nicht beliebig oft erhitzen: Die Textur leidet und es kann gesundheitlich riskant werden. Darum die Milch vorher passend abmessen.", "source": {"title": "Perfect Daily Grind – Reducing Your Coffee Shop's Milk Waste", "url": "https://perfectdailygrind.com/2020/07/reducing-your-coffee-shops-milk-waste/"}, "img": "milch", "topic": "Milch", "case": {"title": "Fall · Restmilch", "facts": ["Im Kännchen sind noch 80 ml gedampfte Milch", "Der nächste Cappuccino ist bestellt", "Die Milch ist inzwischen lauwarm"]}, "st": 9}, {"id": "b1-124", "mode": "barista", "level": 1, "type": "mc", "q": "Was zeichnet die Barista-Editionen von Pflanzendrinks aus?", "options": ["Ein deutlich höherer Koffeingehalt", "Ein höherer Anteil an Milchzucker", "Eine längere Haltbarkeit ohne Kühlung", "Stabilisatoren gegen Ausflocken im Kaffee"], "correct": 3, "explain": "Die Säure im Kaffee lässt Pflanzendrinks leicht ausflocken. Barista-Editionen enthalten Stabilisatoren wie Dikaliumphosphat, oft auch zugesetztes Öl für die Textur.", "source": {"title": "Perfect Daily Grind – A Guide To Working With Plant Milks", "url": "https://perfectdailygrind.com/2020/08/a-guide-to-working-with-plant-milks/"}, "img": "milch", "topic": "Milch", "st": 7}, {"id": "b1-125", "mode": "barista", "level": 1, "type": "mc", "q": "Woraus besteht Kuhmilch zum allergrößten Teil?", "options": ["Aus Fett, rund 40 %", "Aus Eiweiß, rund 30 %", "Aus Milchzucker, rund 25 %", "Aus Wasser, rund 87 %"], "correct": 3, "explain": "Kuhmilch besteht im Mittel zu etwa 87,5 % aus Wasser; Fett (ca. 3,9 %), Eiweiß (ca. 3,4 %) und Laktose (ca. 4,8 %) machen nur wenige Prozent aus.", "source": {"title": "Clive Coffee – The Science Behind Perfect Steamed Milk", "url": "https://clivecoffee.com/blogs/learn/the-science-behind-perfect-steamed-milk"}, "img": "milch", "topic": "Milch", "st": 2}, {"id": "b1-126", "mode": "barista", "level": 1, "type": "mc", "q": "Welcher Milchbestandteil baut den Schaum vor allem auf und stabilisiert ihn?", "options": ["Das Milchfett", "Der Milchzucker", "Die Mineralstoffe", "Das Milcheiweiß"], "correct": 3, "explain": "Proteine entfalten sich beim Erwärmen und legen sich um die Luftbläschen – sie bilden und stabilisieren den Schaum.", "source": {"title": "Clive Coffee – The Science Behind Perfect Steamed Milk", "url": "https://clivecoffee.com/blogs/learn/the-science-behind-perfect-steamed-milk"}, "img": "milch", "topic": "Milch", "st": 6}, {"id": "b1-127", "mode": "barista", "level": 1, "type": "mc", "q": "Warum wird Milch mit der Zeit sauer?", "options": ["Bakterien bauen Laktose zu Milchsäure um", "Das Milchfett oxidiert zu Essigsäure", "Das Eiweiß zerfällt zu Zitronensäure", "Kohlensäure aus der Luft löst sich darin"], "correct": 0, "explain": "Frische Milch schmeckt durch Laktose leicht süß. Mit der Zeit wandeln Bakterien Laktose in Milchsäure um – die Milch wird sauer.", "source": {"title": "Clive Coffee – The Science Behind Perfect Steamed Milk", "url": "https://clivecoffee.com/blogs/learn/the-science-behind-perfect-steamed-milk"}, "img": "milch", "topic": "Milch", "st": 4}, {"id": "b1-128", "mode": "barista", "level": 1, "type": "mc", "q": "Wo hältst du die Spitze der Dampflanze, um Luft in die Milch zu ziehen?", "options": ["Tief am Boden des Kännchens", "Einige Zentimeter über der Milch", "Knapp unter der Milchoberfläche", "Direkt an der Kännchenwand unten"], "correct": 2, "explain": "Knapp an der Oberfläche faltet die Lanze Luft ein. Ragt sie zu weit heraus, entstehen große Blasen; ganz eingetaucht heizt sie nur.", "source": {"title": "Clive Coffee – The Science Behind Perfect Steamed Milk", "url": "https://clivecoffee.com/blogs/learn/the-science-behind-perfect-steamed-milk"}, "img": "milch", "topic": "Milch", "st": 7}, {"id": "b1-129", "mode": "barista", "level": 1, "type": "mc", "q": "Was bewirkt eine ganz tief eingetauchte Dampflanze?", "options": ["Sie erzeugt besonders feinen Schaum", "Sie erzeugt besonders viel groben Schaum", "Sie erhitzt die Milch, schäumt aber kaum", "Sie kühlt die Milch beim Rühren ab"], "correct": 2, "explain": "Ist die Spitze vollständig eingetaucht, kommt Wärme, aber keine Luft in die Milch – das ist die Phase nach dem Lufteinziehen.", "source": {"title": "Clive Coffee – The Science Behind Perfect Steamed Milk", "url": "https://clivecoffee.com/blogs/learn/the-science-behind-perfect-steamed-milk"}, "img": "milch", "topic": "Milch", "st": 7}, {"id": "b1-130", "mode": "barista", "level": 1, "type": "mc", "q": "Wie benutzt du das SCA Coffee Taster's Flavor Wheel?", "options": ["Von außen nach innen, vom Feinen ins Grobe", "Nur den äußersten Ring, der Rest ist Deko", "Von innen nach außen, vom Groben ins Feine", "Im Uhrzeigersinn, Feld für Feld der Reihe nach"], "correct": 2, "explain": "Allgemeine Begriffe stehen innen, nach außen werden sie spezifischer. Man kann in jedem Ring aufhören – weiter außen ist die Beschreibung genauer.", "source": {"title": "SCA – How to Use the Coffee Taster's Flavor Wheel in Eight Steps", "url": "https://sca.coffee/sca-news/how-to-use-the-flavor-wheel-in-eight-steps-ab2hy"}, "img": "rad", "topic": "Sensorik", "st": 8}, {"id": "b1-131", "mode": "barista", "level": 1, "type": "mc", "q": "Was ist der Unterschied zwischen Geschmack und Flavor?", "options": ["Flavor ist nur der Geruch der Bohnen", "Geschmack ist nur der Nachgeschmack", "Flavor ist Geschmack plus Aroma der Nase", "Beide Begriffe meinen genau dasselbe"], "correct": 2, "explain": "Die Zunge erkennt nur Grundgeschmäcker wie süß, sauer, salzig und bitter; erst zusammen mit dem Aroma über die Nase entsteht der Flavor.", "source": {"title": "Perfect Daily Grind – What Creates Coffee Aroma? Understanding The Chemistry", "url": "https://perfectdailygrind.com/2019/08/what-creates-coffee-aroma-understanding-the-chemistry/"}, "img": "tasse", "topic": "Sensorik", "st": 7}, {"id": "b1-132", "mode": "barista", "level": 1, "type": "mc", "q": "Welcher dieser Begriffe ist eine der fünf Grundgeschmacksarten?", "options": ["Umami", "Fruchtig", "Nussig", "Rauchig"], "correct": 0, "explain": "Grundgeschmacksarten sind süß, sauer, salzig, bitter und umami. Fruchtig, nussig oder rauchig sind Aromen, die über die Nase wahrgenommen werden.", "source": {"title": "Perfect Daily Grind – Coffee Cupping: How to Use Solutions to Improve Your Palate", "url": "https://perfectdailygrind.com/2018/03/coffee-cupping-how-to-use-solutions-to-improve-your-palate/"}, "img": "tasse", "topic": "Sensorik", "st": 2}, {"id": "b1-133", "mode": "barista", "level": 1, "type": "mc", "q": "Wie verändert eine längere, dunklere Röstung die Säure im Kaffee?", "options": ["Die organischen Säuren nehmen zu", "Die organischen Säuren nehmen ab", "Die Säuren bleiben völlig gleich", "Es entstehen vor allem neue Fruchtsäuren"], "correct": 1, "explain": "Längere Röstzeiten und höhere Endtemperaturen bauen organische Säuren ab – dunkle Röstungen schmecken deshalb weniger säuerlich.", "source": {"title": "Kaffeemacher – Säure im Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/acidity-in-coffee"}, "img": "bohne", "topic": "Sensorik", "st": 7}, {"id": "b1-134", "mode": "barista", "level": 1, "type": "mc", "q": "Wie viel Prozent einer Tasse Filterkaffee sind etwa Wasser?", "options": ["Etwa 75 %", "Etwa 98,5 %", "Etwa 90 %", "Etwa 60 %"], "correct": 1, "explain": "Filterkaffee besteht zu etwa 98,5 % aus Wasser und nur zu rund 1,5 % aus gelösten Kaffeestoffen – die Wasserqualität prägt die Tasse stark.", "source": {"title": "Kaffeemacher – Extraktion und Stärke von Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/extraction-strength-coffee"}, "img": "filter", "topic": "Extraktion", "st": 9}, {"id": "b1-135", "mode": "barista", "level": 1, "type": "case", "q": "Wann hörst du beim Pressen auf?", "options": ["Erst wenn der Kolben ganz fest sitzt", "Nach genau fünf Sekunden Pressen", "Sobald der erste Tropfen kommt", "Beim ersten leisen Zischen"], "correct": 3, "explain": "Das Zischen zeigt, dass nur noch Luft statt Kaffee durchgedrückt wird – dort stoppt man. Gepresst wird ruhig über etwa 20–30 Sekunden.", "source": {"title": "Kaffeemacher – AeroPress Guide: Standardrezept, Inverted & Bypass", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/aeropress-guide"}, "img": "filter", "topic": "Filter", "case": {"title": "Fall · AeroPress", "facts": ["16 g Kaffee, 200 ml Wasser, 90 °C", "60 Sekunden gezogen", "Du drückst den Kolben gleichmäßig herunter"]}, "st": 4}, {"id": "b1-136", "mode": "barista", "level": 1, "type": "case", "q": "Was tust du beim nächsten Aufguss?", "options": ["Etwas gröber mahlen", "Etwas feiner mahlen", "Mehr Kaffee nehmen", "Kälteres Wasser nehmen"], "correct": 0, "explain": "Kaffeemacher rät: Steigt das Bett während des Aufgusses über die Mitte des Filters, etwas gröber mahlen – feiner Mahlgrad bremst den Durchfluss.", "source": {"title": "Kaffeemac
