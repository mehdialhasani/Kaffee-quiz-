<script type="application/json" id="qzdata">[{"id": "b1-01", "mode": "barista", "level": 1, "type": "mc", "q": "Welcher Mahlgrad passt zur French Press?", "options": ["Pulverfein wie Mehl", "Fein wie Tafelsalz", "Grob wie Steinsalz", "Mittelfein wie Sand"], "correct": 2, "explain": "Die French Press zieht rund 4 Minuten im vollen Kontakt – dafür empfiehlt sich ein grober Mahlgrad.", "source": {"title": "NCA – French Press Coffee", "url": "https://www.aboutcoffee.org/brewing/french-press-coffee/"}, "img": "muehle", "topic": "Mahlgrad"}, {"id": "b1-02", "mode": "barista", "level": 1, "type": "mc", "q": "Welche Mühlenart liefert einen gleichmäßigeren Mahlgrad?", "options": ["Mühle mit Mahlscheiben oder Mahlkegeln", "Mühle mit rotierendem Schlagmesser", "Mühle mit Doppelmesser im Pulsbetrieb", "Mühle mit schnell drehendem Propeller"], "correct": 0, "explain": "Mahlwerke mit Scheiben oder Kegeln (Burr) mahlen deutlich gleichmäßiger als Schlagmesser, die die Bohnen nur zerschlagen.", "source": {"title": "NCA – Espresso", "url": "https://www.aboutcoffee.org/brewing/espresso/"}, "img": "muehle", "topic": "Mahlgrad"}, {"id": "b1-03", "mode": "barista", "level": 1, "type": "case", "q": "Dein Espresso läuft sehr schnell durch und schmeckt sauer und dünn. Was tust du?", "options": ["Gröber mahlen", "Feiner mahlen", "Dosis senken", "Kürzer beziehen"], "correct": 1, "explain": "Zu schnell und sauer heißt unterextrahiert: Ein feinerer Mahlgrad bremst den Durchfluss und erhöht die Extraktion.", "source": {"title": "Seattle Coffee Gear – How to Dial In Espresso Grind Size", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-dial-in-espresso-grind-size"}, "img": "espresso", "topic": "Mahlgrad"}, {"id": "b1-04", "mode": "barista", "level": 1, "type": "case", "q": "Dein Espresso tropft sehr langsam und schmeckt bitter, trocken und hart. Was tust du?", "options": ["Feiner mahlen", "Fester tampern", "Länger beziehen", "Gröber mahlen"], "correct": 3, "explain": "Langsam und bitter deutet auf Überextraktion: Gröber mahlen beschleunigt den Durchfluss.", "source": {"title": "Seattle Coffee Gear – How to Dial In Espresso Grind Size", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-dial-in-espresso-grind-size"}, "img": "espresso", "topic": "Mahlgrad"}, {"id": "b1-05", "mode": "barista", "level": 1, "type": "mc", "q": "Woraus entsteht die Crema auf dem Espresso hauptsächlich?", "options": ["Aus Luft, die die Pumpe ins Brühwasser drückt", "Aus Wasserdampf, der beim Brühen kondensiert", "Aus CO₂, das unter Druck im Wasser gelöst wird", "Aus Stärke, die beim Brühen im Puck aufquillt"], "correct": 2, "explain": "Der Brühdruck löst mehr CO₂ aus der Röstung im Wasser; beim Austritt bildet es feine, stabile Bläschen – die Crema.", "source": {"title": "Perfect Daily Grind – Crema: How It's Formed", "url": "https://perfectdailygrind.com/2020/04/crema-how-its-formed-what-it-tells-us-how-to-learn-from-it/"}, "img": "crema", "topic": "Espresso"}, {"id": "b1-06", "mode": "barista", "level": 1, "type": "mc", "q": "Welche Kaffeeart enthält im Schnitt deutlich mehr Koffein?", "options": ["Arabica", "Robusta", "Liberica", "Excelsa"], "correct": 1, "explain": "Robusta (Coffea canephora) enthält etwa doppelt so viel Koffein wie Arabica (ca. 2–4,5 % vs. 1,1–1,7 %).", "source": {"title": "Sweet Maria's – Robusta Coffee", "url": "https://library.sweetmarias.com/robusta-coffee/"}, "img": "bohne", "topic": "Bohne & Lagerung"}, {"id": "b1-07", "mode": "barista", "level": 1, "type": "mc", "q": "Wie lagerst du Kaffeebohnen am besten?", "options": ["Im Klarglas, luftdicht, hell im Regal", "Offen in der Tüte, im Kühlschrank", "Luftdurchlässig, damit Bohnen atmen", "Luftdicht, lichtdicht, kühl und dunkel"], "correct": 3, "explain": "Luft, Licht und Wärme schaden dem Aroma – daher luftdicht in einem undurchsichtigen Behälter an einem kühlen, dunklen Ort.", "source": {"title": "NCA – Storage and Shelf Life", "url": "https://www.aboutcoffee.org/beans/storage-and-shelf-life/"}, "img": "bohne", "topic": "Bohne & Lagerung"}, {"id": "b1-08", "mode": "barista", "level": 1, "type": "mc", "q": "Warum mahlt man Kaffee erst kurz vor dem Brühen?", "options": ["Weil gemahlener Kaffee Aroma und CO₂ schneller verliert", "Weil ganze Bohnen ihr Aroma deutlich schneller verlieren", "Weil frisch gemahlener Kaffee mehr Koffein löst", "Weil Kaffeemehl erst nach dem Mahlen CO₂ bildet"], "correct": 0, "explain": "Laut SCA geht das CO₂, das ganze Bohnen über Wochen abgeben, nach dem Mahlen in Minuten verloren – danach setzt Oxidation ein.", "source": {"title": "SCA – Coffee Decoded: What is freshly roasted coffee?", "url": "https://sca.coffee/sca-news/coffee-decoded-9-fresh-coffee"}, "img": "muehle", "topic": "Bohne & Lagerung"}, {"id": "b1-09", "mode": "barista", "level": 1, "type": "mc", "q": "Was passiert beim „Bloom“ zu Beginn eines Handfilters?", "options": ["Luft aus dem Papierfilter entweicht", "Kaffeeöle steigen als Schaum nach oben", "Kohlendioxid aus der Röstung entweicht", "Wasserdampf aus dem Kaffeemehl entweicht"], "correct": 2, "explain": "Beim Vorbenetzen entweicht das CO₂ aus der Röstung – das Kaffeebett „blüht“ auf. Frischer Kaffee bloomt stärker.", "source": {"title": "Perfect Daily Grind – Why Should Your Coffee Bloom?", "url": "https://perfectdailygrind.com/2017/01/why-should-your-coffee-bloom-a-video-experiment/"}, "img": "filter", "topic": "Filter"}, {"id": "b1-10", "mode": "barista", "level": 1, "type": "mc", "q": "Welche Temperatur gilt als angenehme Serviertemperatur für Milchgetränke?", "options": ["Etwa 30–35 °C", "Etwa 55–60 °C", "Etwa 75–80 °C", "Etwa 90–95 °C"], "correct": 1, "explain": "Barista Hustle nennt 55–60 °C als angenehme Serviertemperatur; über 70 °C verbrüht man sich die Zunge.", "source": {"title": "Barista Hustle – Temperature Targets", "url": "https://www.baristahustle.com/lesson/b1-4-03-temperature-targets/"}, "img": "milch", "topic": "Milch"}, {"id": "b1-11", "mode": "barista", "level": 1, "type": "case", "q": "Nach dem Aufschäumen klebt Milch an der Dampflanze. Was tust du?", "options": ["Am Abend gründlich einweichen und dann schrubben", "Erst abkühlen lassen, dann trocken abreiben", "Kurz Dampf ablassen, Abwischen erst abends", "Sofort feucht abwischen und kurz Dampf ablassen"], "correct": 3, "explain": "Warm lässt sich Milch leicht abwischen; kurzes Ablassen (Purgen) drückt Milchreste aus dem Inneren der Lanze.", "source": {"title": "Seattle Coffee Gear – How to Clean Your Steam Wand", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-clean-steam-wand"}, "img": "milch", "topic": "Pflege"}, {"id": "b1-12", "mode": "barista", "level": 1, "type": "mc", "q": "Welche Brühtemperatur verlangt der SCA-Standard für zertifizierte Filterkaffeemaschinen?", "options": ["90–96 °C", "70–76 °C", "80–86 °C", "97–100 °C"], "correct": 0, "explain": "Laut SCA-Standard 310 muss das Kaffeebett früh im Brühvorgang 90–96 °C erreichen und dort bleiben.", "source": {"title": "SCA Standard 310-2021 Home Coffee Brewers", "url": "https://sca.coffee/s/SCA_Standard_310-2021.pdf"}, "img": "filter", "topic": "Standards"}, {"id": "b1-13", "mode": "barista", "level": 1, "type": "mc", "q": "Wer hat die AeroPress erfunden?", "options": ["Peter Schlumbohm", "Alan Adler", "Alfonso Bialetti", "Achille Gaggia"], "correct": 1, "explain": "Alan Adler, auch Erfinder der Aerobie-Wurfscheibe, stellte die AeroPress im November 2005 vor.", "source": {"title": "AeroPress – About AeroPress & Alan Adler", "url": "https://aeropress.com/about/"}, "img": "filter", "topic": "Filter"}, {"id": "b1-14", "mode": "barista", "level": 1, "type": "mc", "q": "Wofür steht die „60“ im Namen des Hario V60?", "options": ["Für 60 Sekunden Brühzeit", "Für 60 g Kaffee pro Liter", "Für den 60°-Winkel des Kegels", "Für 60 °C Wassertemperatur"], "correct": 2, "explain": "Der Name beschreibt die V-Form des konischen Filters mit einem Winkel von 60°.", "source": {"title": "HARIO – The origin of the V60", "url": "https://global.hario.com/sp_v60series.html"}, "img": "filter", "topic": "Filter"}, {"id": "b1-15", "mode": "barista", "level": 1, "type": "mc", "q": "Was ist typisch für den Kalita-Wave-Handfilter?", "options": ["Flacher Boden mit drei kleinen Löchern", "Spitzer 60°-Kegel mit einem großen Loch", "Metallsieb mit feinem Edelstahlgewebe", "Kegel mit Stopp-Ventil am Auslauf"], "correct": 0, "explain": "Der Kalita Wave hat einen flachen Boden mit drei kleinen Löchern, die den Durchfluss begrenzen.", "source": {"title": "Seattle Coffee Gear – Kalita Wave Product Guide", "url": "https://www.seattlecoffeegear.com/pages/product-resources/kalita-wave-glass-dripper-product-guide"}, "img": "filter", "topic": "Filter"}, {"id": "b1-16", "mode": "barista", "level": 1, "type": "mc", "q": "Wer entwarf die Chemex-Karaffe?", "options": ["Der Ingenieur Alan Adler", "Der Barista Achille Gaggia", "Der Designer Alfonso Bialetti", "Der Chemiker Peter Schlumbohm"], "correct": 3, "explain": "Der Chemiker und Erfinder Dr. Peter Schlumbohm entwarf und patentierte die Chemex 1941.", "source": {"title": "CHEMEX – About CHEMEX (History)", "url": "https://www.chemexcoffeemaker.com/gallery/album/history"}, "img": "filter", "topic": "Filter"}, {"id": "b1-17", "mode": "barista", "level": 1, "type": "mc", "q": "Was unterscheidet Cold Brew von Eiskaffee?", "options": ["Cold Brew ist Filterkaffee mit Eiswürfeln", "Cold Brew zieht stundenlang kalt oder zimmerwarm", "Cold Brew wird heiß gebrüht und schnell gekühlt", "Cold Brew wird kurz kalt unter Druck extrahiert"], "correct": 1, "explain": "Cold Brew zieht mit kühlem oder zimmerwarmem Wasser, oft rund 12 Stunden oder länger; Eiskaffee wird heiß gebrüht und dann gekühlt.", "source": {"title": "NCA – Cold Brew Coffee", "url": "https://www.aboutcoffee.org/brewing/cold-brew-coffee/"}, "img": "filter", "topic": "Filter"}, {"id": "b1-18", "mode": "barista", "level": 1, "type": "mc", "q": "Warum spült man einen Papierfilter vor dem Brühen mit heißem Wasser?", "options": ["Um den Filter zu sterilisieren", "Um Kalk aus dem Papier zu lösen", "Um Papiergeschmack zu vermeiden", "Damit das Papier reißfester wird"], "correct": 2, "explain": "Papierfilter können einen unangenehmen, papierigen Geschmack abgeben; Spülen (Wasser wegschütten) verhindert das.", "source": {"title": "NCA – Pour-over Coffee", "url": "https://www.aboutcoffee.org/brewing/pour-over-coffee/"}, "img": "filter", "topic": "Filter"}, {"id": "b1-19", "mode": "barista", "level": 1, "type": "mc", "q": "Was lässt ein Metallfilter im Vergleich zum Papierfilter stärker durch?", "options": ["Kaffeeöle und feine Schwebstoffe", "Gelöste Mineralien aus dem Wasser", "Mehr gelöstes Koffein und Zucker", "Mehr Kohlensäure und Sauerstoff"], "correct": 0, "explain": "Papier hält mehr Öl zurück und gibt eine klarere Tasse; Metall lässt mehr Öl und Sediment durch – die Tasse wirkt intensiver.", "source": {"title": "NCA – Pour-over Coffee", "url": "https://www.aboutcoffee.org/brewing/pour-over-coffee/"}, "img": "filter", "topic": "Filter"}, {"id": "b1-20", "mode": "barista", "level": 1, "type": "mc", "q": "Was enthält meist mehr Koffein pro Portion?", "options": ["Ein einfacher Espresso (ca. 30 ml)", "Ein kurzer Ristretto (ca. 20 ml)", "Ein Becher Filterkaffee (ca. 240 ml)", "Ein Espresso macchiato (ca. 40 ml)"], "correct": 2, "explain": "Laut Mayo Clinic: Espresso (30 ml) ca. 63 mg, Filterkaffee (237 ml) ca. 96 mg – Espresso ist konzentrierter, aber die Portion kleiner.", "source": {"title": "Mayo Clinic – Caffeine content for coffee, tea, soda and more", "url": "https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/in-depth/caffeine/art-20049372"}, "img": "espresso", "topic": "Espresso"}, {"id": "b1-21", "mode": "barista", "level": 1, "type": "mc", "q": "Ist entkoffeinierter Kaffee völlig koffeinfrei?", "options": ["Ja, das Koffein wird vollständig entfernt", "Nein, er enthält noch geringe Restmengen", "Nein, er enthält etwa die Hälfte des Koffeins", "Ja, sofern er nach EU-Norm deklariert ist"], "correct": 1, "explain": "Entkoffeinierter Kaffee enthält nur noch sehr wenig Koffein, ist aber nicht völlig frei davon.", "source": {"title": "Mayo Clinic – Caffeine content for coffee, tea, soda and more", "url": "https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/in-depth/caffeine/art-20049372"}, "img": "bohne", "topic": "Bohne & Lagerung"}, {"id": "b1-22", "mode": "barista", "level": 1, "type": "mc", "q": "Was kennzeichnet einen Ristretto im Vergleich zum normalen Espresso?", "options": ["Mehr Getränk bei gleicher Dosis", "Gleiche Getränkemenge, halbe Dosis", "Gleiche Getränkemenge bei höherem Druck", "Weniger Getränk bei gleicher Dosis"], "correct": 3, "explain": "Ristretto heißt „beschränkt“: ein kürzerer, konzentrierterer Bezug, typischerweise etwa 1:1 bis 1:2 (Kaffee zu Getränk).", "source": {"title": "La Marzocco Home – Brew Ratios Around the World", "url": "https://home.lamarzoccousa.com/brew-ratios-around-world/"}, "img": "espresso", "topic": "Espresso"}, {"id": "b1-23", "mode": "barista", "level": 1, "type": "mc", "q": "Was ist ein Lungo?", "options": ["Ein Espresso, mit heißem Wasser aufgegossen", "Ein Espresso mit doppelter Menge Kaffeemehl", "Ein Espresso mit mehr durchgelaufenem Wasser", "Ein Espresso mit einem Schuss Milchschaum"], "correct": 2, "explain": "Lungo heißt „lang“: gleiche Dosis, aber mehr Wasser läuft durch – weniger intensiv als ein Espresso.", "source": {"title": "Coffee Circle – Espresso, Lungo, Ristretto", "url": "https://www.coffeecircle.com/en/b/difference-espresso-lungo-ristretto"}, "img": "espresso", "topic": "Espresso"}, {"id": "b1-24", "mode": "barista", "level": 1, "type": "mc", "q": "Wozu tampert man das Kaffeemehl im Siebträger?", "options": ["Für ein ebenes Kaffeebett ohne Luftnester", "Um die Kaffeeöle vorab freizupressen", "Um möglichst viel Mehl ins Sieb zu pressen", "Um das Kaffeemehl am Sieb vorzuwärmen"], "correct": 0, "explain": "Tampen verdichtet den Puck ohne Lufteinschlüsse, damit das Wasser gleichmäßig Widerstand findet; wichtig ist vor allem, eben zu tampen.", "source": {"title": "Prima Coffee – The Art and Science of Tamping", "url": "https://prima-coffee.com/blog/the-art-and-science-of-tamping/"}, "img": "tamper", "topic": "Espresso"}, {"id": "b1-25", "mode": "barista", "level": 1, "type": "case", "q": "Du willst Milch aufschäumen. Was tust du direkt vorher mit der Dampflanze?", "options": ["Kurz in die Milch halten zum Vorwärmen", "Kurz in kaltes Wasser tauchen zum Abkühlen", "Mit Reiniger einsprühen und abwischen", "Kurz Dampf ablassen gegen Kondenswasser"], "correct": 3, "explain": "Im Ruhezustand kondensiert Dampf zu Wasser in der Lanze; kurzes Purgen in Tuch oder Abtropfschale entfernt es.", "source": {"title": "Clive Coffee – Steam Wand That Won’t Make Strong Steam", "url": "https://clivecoffee.com/blogs/learn/how-to-fix-a-steam-wand-that-wont-make-strong-steam"}, "img": "milch", "topic": "Milch"}, {"id": "b1-26", "mode": "barista", "level": 1, "type": "mc", "q": "Woran erkennst du gut aufgeschäumten Mikroschaum?", "options": ["Steif und fest, sodass ein Löffel stehen bleibt", "Glänzend wie nasse Farbe, ohne sichtbare Blasen", "Getrennte Schichten aus Milch und festem Schaum", "Matt und dicht, mit feinen sichtbaren Bläschen"], "correct": 1, "explain": "Guter Mikroschaum glänzt, zeigt keine sichtbaren Blasen und fließt als eine homogene, cremige Masse.", "source": {"title": "Clive Coffee – How to Steam Glossy Microfoam", "url": "https://clivecoffee.com/blogs/learn/how-to-steam-glossy-microfoam-instead-of-foamy-milk"}, "img": "milch", "topic": "Milch"}, {"id": "b1-27", "mode": "barista", "level": 1, "type": "mc", "q": "Mit welchem Muster beginnen viele Baristas beim Latte-Art-Lernen?", "options": ["Schwan", "Tulpe", "Herz", "Rosetta"], "correct": 2, "explain": "Das Herz gilt als typisches Einstiegsmuster und schult Milchfluss, Tassenhaltung und Gießkontrolle; danach folgen Tulpe und Rosetta.", "source": {"title": "Dalla Corte – Starting Your Latte Art Journey: 3 Patterns", "url": "https://dallacorte.com/magazine-starting-your-latte-art-journey-try-these-3-patterns-n-1123.html"}, "img": "milch", "topic": "Milch"}, {"id": "b1-28", "mode": "barista", "level": 1, "type": "mc", "q": "Warum nimmt man zum Aufschäumen Milch direkt aus dem Kühlschrank?", "options": ["Mehr Süße, weil kalte Milch Zucker bindet", "Mehr Schaum, weil warme Milch nicht schäumt", "Weniger Kalk, weil die Lanze kühler bleibt", "Mehr Zeit, bevor die Milch zu heiß wird"], "correct": 3, "explain": "Kalte Milch verlängert das Zeitfenster zum Lufteinziehen und Texturieren, bevor sie überhitzt.", "source": {"title": "Clive Coffee – How to Steam Glossy Microfoam", "url": "https://clivecoffee.com/blogs/learn/how-to-steam-glossy-microfoam-instead-of-foamy-milk"}, "img": "milch", "topic": "Milch"}, {"id": "b1-29", "mode": "barista", "level": 1, "type": "mc", "q": "Wozu dient das Einwegventil in einer Kaffeetüte?", "options": ["CO₂ entweicht, Außenluft kommt nicht hinein", "Sauerstoff kommt hinein, Aroma bleibt drin", "Duft entweicht, damit man daran riechen kann", "Feuchtigkeit entweicht, Aroma bleibt drin"], "correct": 0, "explain": "Frisch gerösteter Kaffee gast CO₂ aus; das Ventil lässt es entweichen, damit die Tüte nicht platzt, und hält Außenluft draußen.", "source": {"title": "Plitek – Coffee Valves", "url": "https://www.plitek.com/applications/coffee-valves/"}, "img": "bohne", "topic": "Bohne & Lagerung"}, {"id": "b1-30", "mode": "barista", "level": 1, "type": "mc", "q": "Welcher Zucker kommt natürlicherweise in Kuhmilch vor?", "options": ["Saccharose (Haushaltszucker)", "Laktose (Milchzucker)", "Fruktose (Fruchtzucker)", "Maltose (Malzzucker)"], "correct": 1, "explain": "Der natürliche Zucker der Milch ist Laktose; laktosefreie Milch entsteht, indem das Enzym Laktase ihn spaltet.", "source": {"title": "Arla – Why is lactose-free milk sweeter?", "url": "https://www.arla.com/articles/why-is-lactose-free-milk-sweeter-than-regular-milk-and-what-do-enzymes-have-to-do-with-it/"}, "img": "milch", "topic": "Milch"}, {"id": "b2-01", "mode": "barista", "level": 2, "type": "mc", "q": "Welches Brühverhältnis legt der SCA-Standard für Filterkaffeemaschinen zugrunde?", "options": ["15 g Kaffee pro kg Wasser", "30 g Kaffee pro kg Wasser", "55 g Kaffee pro kg Wasser", "120 g Kaffee pro kg Wasser"], "correct": 2, "explain": "Der SCA-Standard 310 verwendet 55 g Kaffee pro 1 kg Frischwasser als Standard-Brühverhältnis.", "source": {"title": "SCA Standard 310-2021 Home Coffee Brewers", "url": "https://sca.coffee/s/SCA_Standard_310-2021.pdf"}, "img": "filter", "topic": "Standards"}, {"id": "b2-02", "mode": "barista", "level": 2, "type": "mc", "q": "Welche Extraktionsausbeute gilt im klassischen Brewing Control Chart als ideal?", "options": ["8–10 %", "12–14 %", "28–32 %", "18–22 %"], "correct": 3, "explain": "Das Brewing Control Chart (Lockhart, 1957) nennt 18–22 % Extraktion als Idealbereich für Filterkaffee.", "source": {"title": "Barista Hustle – Towards a Common Coffee Control Chart", "url": "https://www.baristahustle.com/towards-a-common-coffee-control-chart/"}, "img": "filter", "topic": "Extraktion"}, {"id": "b2-03", "mode": "barista", "level": 2, "type": "mc", "q": "Was misst ein Refraktometer im Kaffee?", "options": ["Den Brechungsindex, daraus folgt der TDS-Wert", "Die Lichtabsorption, daraus folgt der Röstgrad", "Die Leitfähigkeit, daraus folgt die Wasserhärte", "Den pH-Wert, daraus folgt die Säure der Tasse"], "correct": 0, "explain": "Das Refraktometer misst den Brechungsindex; daraus ergibt sich der Anteil gelöster Feststoffe (TDS).", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "tasse", "topic": "Extraktion"}, {"id": "b2-04", "mode": "barista", "level": 2, "type": "mc", "q": "Was stimmt über die Crema?", "options": ["Dicke Crema zeigt sicher einen guten Shot", "Schöne Crema beweist keinen guten Geschmack", "Crema entsteht vor allem bei altem Kaffee", "Robusta bildet weniger Crema als Arabica"], "correct": 1, "explain": "Auch ein schlechter, dunkel gerösteter Kaffee kann dichte Crema haben – über den Geschmack entscheidet die Tasse.", "source": {"title": "Perfect Daily Grind – Crema: How It's Formed", "url": "https://perfectdailygrind.com/2020/04/crema-how-its-formed-what-it-tells-us-how-to-learn-from-it/"}, "img": "crema", "topic": "Espresso"}, {"id": "b2-05", "mode": "barista", "level": 2, "type": "case", "q": "Am nackten Siebträger spritzt ein heller, wässriger Strahl seitlich heraus. Was tust du?", "options": ["Mehl gleichmäßig verteilen, gerade tampern", "Shot servieren, seitliche Strahlen sind normal", "Brühdruck erhöhen, damit das Bett hält", "Mehr Wasser nachlaufen lassen zum Ausgleich"], "correct": 0, "explain": "Das ist Channeling: Wasser sucht den Weg des geringsten Widerstands. Ursachen sind v. a. ungleichmäßige Verteilung und schiefes Tampern; stark gechannelte Shots neu machen.", "source": {"title": "Barista Hustle – Channelling", "url": "https://www.baristahustle.com/lesson/b1-3-02-channelling/"}, "img": "tamper", "topic": "Espresso"}, {"id": "b2-06", "mode": "barista", "level": 2, "type": "mc", "q": "Welches Bauteil braucht eine Siebträgermaschine, damit sie mit Blindsieb rückgespült werden darf?", "options": ["Ein Überdruckventil (OPV)", "Ein 3-Wege-Magnetventil", "Einen zweiten Kessel", "Eine Rotationspumpe"], "correct": 1, "explain": "Nur Maschinen mit 3-Wege-Magnetventil dürfen rückgespült werden – ohne dieses Ventil kann Backflushing die Maschine beschädigen.", "source": {"title": "Seattle Coffee Gear – How to Backflush Your Espresso Machine", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-backflush-espresso-machine"}, "img": "espresso", "topic": "Pflege"}, {"id": "b2-07", "mode": "barista", "level": 2, "type": "mc", "q": "Womit backflushst du, um Kaffeeöle aus der Brühgruppe zu lösen?", "options": ["Mit Essigessenz aus dem Haushalt", "Mit Entkalker für Espressomaschinen", "Mit Reiniger für Espressomaschinen", "Mit Spülmittel und heißem Wasser"], "correct": 2, "explain": "Für Kaffeeöle nimmt man einen Espressomaschinen-Reiniger (z. B. Cafiza); Entkalker und Essig sind dafür nicht gedacht.", "source": {"title": "Seattle Coffee Gear – How to Backflush Your Espresso Machine", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-backflush-espresso-machine"}, "img": "espresso", "topic": "Pflege"}, {"id": "b2-08", "mode": "barista", "level": 2, "type": "mc", "q": "Woraus besteht Kalk in der Espressomaschine hauptsächlich?", "options": ["Aus Calcium- und Magnesiumchlorid", "Aus Natrium- und Kaliumcarbonat", "Aus Kieselsäure und Eisenoxid", "Aus Calcium- und Magnesiumcarbonat"], "correct": 3, "explain": "Beim Erhitzen reagieren Calcium und Magnesium mit Hydrogencarbonat zu Kalk (Calcium- und Magnesiumcarbonat).", "source": {"title": "Barista Hustle – Water Hardness", "url": "https://www.baristahustle.com/water-hardness/"}, "img": "wasser", "topic": "Wasser"}, {"id": "b2-09", "mode": "barista", "level": 2, "type": "mc", "q": "Was bewirkt eine zu hohe Alkalinität (Karbonathärte) im Brühwasser?", "options": ["Er schmeckt flach, weil Säuren abgepuffert werden", "Er schmeckt saurer, weil mehr Säuren gelöst werden", "Er schmeckt bitterer, weil mehr Koffein gelöst wird", "Er schmeckt süßer, weil Zucker besser gelöst wird"], "correct": 0, "explain": "Alkalinität neutralisiert die Säuren im Kaffee – zu viel davon lässt ihn flach schmecken.", "source": {"title": "Barista Hustle – Water Hardness", "url": "https://www.baristahustle.com/water-hardness/"}, "img": "wasser", "topic": "Wasser"}, {"id": "b2-10", "mode": "barista", "level": 2, "type": "case", "q": "Deine aufgeschäumte Milch hat große, grobe Blasen. Was tust du?", "options": ["Länger Luft ziehen, bis die Milch fast kocht", "Aufklopfen, schwenken, künftig kürzer Luft ziehen", "Weiter dampfen, bis sich die Blasen auflösen", "Kalte Milch nachgießen und neu Luft ziehen"], "correct": 1, "explain": "Grobe Blasen entstehen meist durch zu viel Luft oder zu schwachen Wirbel. Aufklopfen entfernt Blasen; Luft nur früh und kurz ziehen, dann rollen.", "source": {"title": "Clive Coffee – How to Steam Glossy Microfoam", "url": "https://clivecoffee.com/blogs/learn/how-to-steam-glossy-microfoam-instead-of-foamy-milk"}, "img": "milch", "topic": "Milch"}, {"id": "b2-11", "mode": "barista", "level": 2, "type": "mc", "q": "Welcher Gesamtmineralgehalt (TDS) ist der SCA-Zielwert für Brühwasser?", "options": ["0 mg/L", "500 mg/L", "1.000 mg/L", "150 mg/L"], "correct": 3, "explain": "Der SCA-Wasserstandard nennt 150 mg/L als Ziel, akzeptabel sind 75–250 mg/L.", "source": {"title": "Prima Coffee – Testing Your Water (SCA-Wasserstandard)", "url": "https://prima-coffee.com/blog/testing-your-water/"}, "img": "wasser", "topic": "Wasser"}, {"id": "b2-12", "mode": "barista", "level": 2, "type": "mc", "q": "Mit welchem Brühdruck wird ein Espresso laut Istituto Nazionale Espresso Italiano zubereitet?", "options": ["Etwa 1 bar", "Etwa 3 bar", "Etwa 9 bar", "Etwa 30 bar"], "correct": 2, "explain": "Das INEI gibt 9 bar (±1 bar) als Brühdruck für einen zertifizierten Espresso Italiano an.", "source": {"title": "Manufactum – Guten Espresso erkennen (INEI-Kriterien)", "url": "https://www.manufactum.com/good-espresso-recognize-c200599/"}, "img": "espresso", "topic": "Standards"}, {"id": "b2-13", "mode": "barista", "level": 2, "type": "mc", "q": "18 g Kaffee ergeben 45 g Espresso (1:2,5). Wie nennt man das in der gängigen Brew-Ratio-Einteilung?", "options": ["Ristretto", "Normale", "Lungo", "Allongé"], "correct": 1, "explain": "Übliche Einteilung: Ristretto etwa 1:1–1:2, Normale 1:2–1:3, Lungo 1:3–1:4.", "source": {"title": "La Marzocco Home – Brew Ratios Around the World", "url": "https://home.lamarzoccousa.com/brew-ratios-around-world/"}, "img": "espresso", "topic": "Espresso"}, {"id": "b2-14", "mode": "barista", "level": 2, "type": "mc", "q": "Was beschreibt die Brew Ratio beim Espresso?", "options": ["Brühdruck zu Brühzeit in Sekunden", "Gewicht Getränk zu Brühzeit in Sekunden", "Gelöste Stoffe zu Gewicht Getränk", "Gewicht Kaffeemehl zu Gewicht Getränk"], "correct": 3, "explain": "Die Brew Ratio vergleicht das Gewicht des Kaffeemehls mit dem Gewicht des Espressos in der Tasse, z. B. 18 g zu 36 g = 1:2.", "source": {"title": "La Marzocco Home – Brew Ratios Around the World", "url": "https://home.lamarzoccousa.com/brew-ratios-around-world/"}, "img": "espresso", "topic": "Espresso"}, {"id": "b2-15", "mode": "barista", "level": 2, "type": "mc", "q": "Welcher Anteil des Kuhmilcheiweißes ist Kasein?", "options": ["Etwa 20 %", "Etwa 50 %", "Etwa 80 %", "Etwa 99 %"], "correct": 2, "explain": "Rund 80 % des Milcheiweißes sind Kasein, etwa 20 % Molkenproteine.", "source": {"title": "Agriland – Dairy Proteins: Whey & Casein", "url": "https://www.agriland.co.uk/farming-news/know-dairy-products-dairy-proteins-whey-casein/"}, "img": "milch", "topic": "Milch"}, {"id": "b2-16", "mode": "barista", "level": 2, "type": "mc", "q": "Wie unterscheidet sich der Schaum von Magermilch und Vollmilch typischerweise?", "options": ["Magermilch: steif und stabil; Vollmilch: cremig", "Magermilch: cremig und stabil; Vollmilch: steif", "Magermilch: schäumt kaum; Vollmilch: steif", "Magermilch: grobblasig; Vollmilch: steif und fest"], "correct": 0, "explain": "Fett wirkt schaumdestabilisierend: Magermilch ergibt den stabilsten, steifsten Schaum, Vollmilch einen cremigeren, samtigeren.", "source": {"title": "Clive Coffee – The Science Behind Perfect Steamed Milk", "url": "https://clivecoffee.com/blogs/learn/the-science-behind-perfect-steamed-milk"}, "img": "milch", "topic": "Milch"}, {"id": "b2-17", "mode": "barista", "level": 2, "type": "mc", "q": "Warum schmeckt laktosefreie Milch süßer als normale Milch?", "options": ["Weil der Milch etwas Fruktose zugesetzt wird", "Weil Laktose in Glukose und Galaktose gespalten wird", "Weil Laktose zu süßerer Saccharose umgebaut wird", "Weil Laktose bei der Herstellung karamellisiert wird"], "correct": 1, "explain": "Das Enzym Laktase spaltet Laktose in Glukose und Galaktose, die süßer schmecken – ganz ohne Zuckerzusatz.", "source": {"title": "Arla – Why is lactose-free milk sweeter?", "url": "https://www.arla.com/articles/why-is-lactose-free-milk-sweeter-than-regular-milk-and-what-do-enzymes-have-to-do-with-it/"}, "img": "milch", "topic": "Milch"}, {"id": "b2-18", "mode": "barista", "level": 2, "type": "mc", "q": "Welche Ionen bilden die Gesamthärte (GH) des Wassers?", "options": ["Natrium und Kalium", "Chlorid und Sulfat", "Eisen und Kupfer", "Calcium und Magnesium"], "correct": 3, "explain": "Die Gesamthärte ist die Summe von Calcium und Magnesium im Wasser.", "source": {"title": "Barista Hustle – Water Hardness", "url": "https://www.baristahustle.com/water-hardness/"}, "img": "wasser", "topic": "Wasser"}, {"id": "b2-19", "mode": "barista", "level": 2, "type": "case", "q": "Du brühst mit reinem Osmosewasser fast ohne Mineralien. Der Kaffee schmeckt flach. Was tust du?", "options": ["Wasser remineralisieren, z. B. per Kartusche", "Wasser zusätzlich durch Aktivkohle filtern lassen", "Wasser vorher länger abkochen lassen", "Eine Prise Kochsalz in die Tasse geben"], "correct": 0, "explain": "Vollständig entmineralisiertes Wasser ist für Kaffee nicht ideal; der SCA-Standard empfiehlt 75–250 mg/L gelöste Mineralien, Ziel 150 mg/L.", "source": {"title": "Espresso Parts – Water Chemistry: Hardness, Chloride, Scale and RO Water", "url": "https://www.espressoparts.com/blogs/news/how-water-chemistry-affects-espresso-machines-hardness-chloride-scale-and-ro-water"}, "img": "wasser", "topic": "Wasser"}, {"id": "b2-20", "mode": "barista", "level": 2, "type": "mc", "q": "Was bedeutet „Retention“ bei einer Kaffeemühle?", "options": ["Die Drehzahl, mit der das Mahlwerk beim Mahlen läuft", "Kaffeemehl, das nach dem Mahlen in der Mühle bleibt", "Die Zeit, bis die Mahlscheiben stumpf werden", "Der Anteil feinster Partikel im fertigen Mahlgut"], "correct": 1, "explain": "Retention ist das Kaffeemehl, das nach dem Mahlen in der Mühle hängen bleibt und beim nächsten Mahlen mit herauskommt.", "source": {"title": "Barista Magazine – Grind Retention: Why Is It Important?", "url": "https://baristamagazine.com/grind-retention-why-is-it-important"}, "img": "muehle", "topic": "Mahlgrad"}, {"id": "b2-21", "mode": "barista", "level": 2, "type": "case", "q": "Du hast den Mahlgrad deutlich verstellt. Was tust du vor dem nächsten Shot?", "options": ["Dosis erhöhen und sofort einen Shot ziehen", "Die Mühle ausschalten und abkühlen lassen", "Etwas Kaffee durchmahlen und verwerfen", "Den ersten Shot einfach länger laufen lassen"], "correct": 2, "explain": "In der Mühle verbliebenes Kaffeemehl hat noch die alte Mahlgröße; ein kleiner Spülgang (Purge) entfernt es.", "source": {"title": "Barista Magazine – Grind Retention: Why Is It Important?", "url": "https://baristamagazine.com/grind-retention-why-is-it-important"}, "img": "muehle", "topic": "Mahlgrad"}, {"id": "b2-22", "mode": "barista", "level": 2, "type": "mc", "q": "Warum gilt Kaffee aus der Mokkakanne (Bialetti) nicht als Espresso?", "options": ["Brühtemperatur nur etwa 70 °C statt rund 93 °C", "Mahlgrad deutlich feiner als beim Espresso", "Brühzeit nur etwa 5 s statt rund 25 s", "Brühdruck nur etwa 1–2 bar statt rund 9 bar"], "correct": 3, "explain": "Die Mokkakanne extrahiert mit etwa 1–2 bar Dampfdruck; Espresso-Standards verlangen rund 9 bar.", "source": {"title": "Wikipedia – Moka pot (u. a. Navarini et al. 2009)", "url": "https://en.wikipedia.org/wiki/Moka_pot"}, "img": "espresso", "topic": "Espresso"}, {"id": "b2-23", "mode": "barista", "level": 2, "type": "mc", "q": "Wie wird traditioneller türkischer Kaffee zubereitet?", "options": ["Mittelfein, kurz aufgekocht, durch Stofffilter gegossen", "Sehr fein, langsam im Kännchen erhitzt, ungefiltert", "Grob, lange im Kännchen gezogen, durch ein Sieb gegossen", "Sehr fein, mit Dampfdruck im Kännchen durchgedrückt"], "correct": 1, "explain": "Laut UNESCO wird pulverfein gemahlener Kaffee mit kaltem Wasser (und Zucker) im Kännchen langsam erhitzt; seit 2013 immaterielles Kulturerbe.", "source": {"title": "UNESCO – Turkish coffee culture and tradition", "url": "https://ich.unesco.org/en/RL/turkish-coffee-culture-and-tradition-00645"}, "img": "tasse", "topic": "Filter"}, {"id": "b2-24", "mode": "barista", "level": 2, "type": "mc", "q": "Wozu dient die Präinfusion bei einer Siebträgermaschine?", "options": ["Sanft benetzen, damit sich Wasser gleichmäßig verteilt", "Brühgruppe vorheizen, damit die Temperatur stabil ist", "Puck nachverdichten, damit das Tampen entfällt", "Druck vorab erhöhen, damit mehr Crema entsteht"], "correct": 0, "explain": "Die kurze Benetzung mit niedrigem Druck verteilt das Wasser gleichmäßig im Kaffeebett und reduziert Channeling.", "source": {"title": "Clive Coffee – What is Pre-Infusion?", "url": "https://clivecoffee.com/blogs/learn/what-is-pre-infusion"}, "img": "espresso", "topic": "Espresso"}, {"id": "b2-25", "mode": "barista", "level": 2, "type": "mc", "q": "Womit entkalkst du eine Siebträgermaschine?", "options": ["Mit Backflush-Reiniger für Kaffeeöle", "Mit Backpulver und heißem Wasser", "Mit Entkalker für Espressomaschinen", "Mit Essigessenz aus dem Supermarkt"], "correct": 2, "explain": "Empfohlen ist ein Entkalker für Espressomaschinen; Essig und Haushaltsentkalker können Rückstände hinterlassen und Dichtungen schädigen.", "source": {"title": "Seattle Coffee Gear – How to Descale Your Espresso Machine", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/how-to-descale-espresso-machine"}, "img": "wasser", "topic": "Pflege"}, {"id": "b2-26", "mode": "barista", "level": 2, "type": "mc", "q": "Bis zu welcher täglichen Koffeinmenge sieht die EFSA für gesunde Erwachsene keine Bedenken?", "options": ["100 mg", "400 mg", "1.000 mg", "2.000 mg"], "correct": 1, "explain": "Laut EFSA sind bis zu 400 mg über den Tag verteilt und Einzeldosen bis 200 mg für gesunde Erwachsene unbedenklich (Schwangere: bis 200 mg/Tag).", "source": {"title": "EFSA explains: Caffeine", "url": "https://www.efsa.europa.eu/sites/default/files/corporate_publications/files/efsaexplainscaffeine150527.pdf"}, "img": "bohne", "topic": "Bohne & Lagerung"}, {"id": "b2-27", "mode": "barista", "level": 2, "type": "mc", "q": "Was bewertest du beim Cupping als Erstes?", "options": ["Den Geschmack beim Schlürfen (Flavor)", "Den Nachgeschmack im Mund (Aftertaste)", "Das Aroma der nassen Kruste (Aroma)", "Den Duft des trockenen Mehls (Fragrance)"], "correct": 3, "explain": "Zuerst riecht man am trockenen Mehl, dann wird aufgegossen, nach etwa 4 Minuten die Kruste gebrochen und später geschlürft.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik"}, {"id": "b2-28", "mode": "barista", "level": 2, "type": "mc", "q": "Warum schlürft man beim Cupping laut vom Löffel?", "options": ["Um die Säure mit Sauerstoff abzuschwächen", "Um ihn belüftet über den Gaumen zu verteilen", "Um Bitterstoffe an der Zungenspitze zu meiden", "Um den Kaffee nur vorne im Mund zu schmecken"], "correct": 1, "explain": "Schlürfen verteilt den Kaffee mit Luft über den Gaumen und kühlt ihn – so nimmt man feinere Aromen wahr.", "source": {"title": "Seattle Coffee Gear – How to Taste Coffee Like a Pro", "url": "https://www.seattlecoffeegear.com/blogs/scg-blog/how-to-taste-coffee-like-a-pro-and-an-intro-to-cupping"}, "img": "tasse", "topic": "Sensorik"}, {"id": "b2-29", "mode": "barista", "level": 2, "type": "mc", "q": "Wie beeinflussen viele Feinanteile (Fines) einen Espresso?", "options": ["Sie füllen Lücken im Puck und bremsen den Fluss", "Sie lockern den Puck und beschleunigen den Fluss", "Sie lösen sich auf und senken die Extraktion", "Sie sammeln sich oben und schützen vor Channeling"], "correct": 0, "explain": "Fines (Partikel unter ca. 100 µm) erhöhen den Widerstand im Puck und extrahieren schnell – zu viele fördern Bitterkeit.", "source": {"title": "Kaffeemacher – Coffee Particle Distribution", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/coffee-particle-distribution"}, "img": "muehle", "topic": "Mahlgrad"}, {"id": "b2-30", "mode": "barista", "level": 2, "type": "mc", "q": "Welches Brühprinzip kombiniert die AeroPress?", "options": ["Perkolation, dann Abtropfen durch Metallsieb", "Kaltextraktion, dann Filtern durch Stoff", "Dampfdruck, dann Filtern durch Metallsieb", "Immersion, dann Pressen durch Papierfilter"], "correct": 3, "explain": "Der Kaffee zieht zunächst im Wasser (Immersion), dann drückt man ihn mit dem Kolben durch einen Papier-Mikrofilter.", "source": {"title": "AeroPress – How AeroPress Works", "url": "https://aeropress.com/pages/how-it-works"}, "img": "filter", "topic": "Filter"}, {"id": "b3-01", "mode": "barista", "level": 3, "type": "mc", "q": "18 g Kaffee ergeben 36 g Espresso mit 10 % TDS. Wie hoch ist die Extraktionsausbeute?", "options": ["10 %", "18 %", "20 %", "36 %"], "correct": 2, "explain": "Extraktion = TDS × Getränkegewicht ÷ Dosis = 10 % × 36 g ÷ 18 g = 20 %.", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "espresso", "topic": "Extraktion"}, {"id": "b3-02", "mode": "barista", "level": 3, "type": "mc", "q": "15 g Kaffee ergeben 250 g Filterkaffee mit 1,30 % TDS. Wie hoch ist die Extraktion (gerundet)?", "options": ["19,5 %", "21,7 %", "13,0 %", "25,0 %"], "correct": 1, "explain": "1,30 % × 250 g ÷ 15 g ≈ 21,7 % – im klassischen Idealbereich von 18–22 %.", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "filter", "topic": "Extraktion"}, {"id": "b3-03", "mode": "barista", "level": 3, "type": "mc", "q": "Gleiche Dosis, aber du lässt mehr Espresso in die Tasse laufen. Was passiert typischerweise?", "options": ["Stärke und Extraktion steigen", "Stärke und Extraktion sinken", "Stärke steigt, Extraktion sinkt", "Stärke sinkt, Extraktion steigt"], "correct": 3, "explain": "Laut Espresso Compass macht mehr Getränkemenge den Espresso zugleich schwächer und höher extrahiert.", "source": {"title": "Barista Hustle – The Espresso Compass", "url": "https://www.baristahustle.com/the-espresso-compass/"}, "img": "espresso", "topic": "Extraktion"}, {"id": "b3-04", "mode": "barista", "level": 3, "type": "mc", "q": "SCA-Studie: Filterkaffee mit 87, 90 und 93 °C gebrüht, gleicher TDS und gleiche Extraktion. Ergebnis?", "options": ["Die Proben waren nicht unterscheidbar", "93 °C wurde klar am besten bewertet", "87 °C wurde deutlich süßer bewertet", "90 °C wurde als ausgewogenste bewertet"], "correct": 0, "explain": "Temperatur beeinflusst, wie schnell extrahiert wird – bei gleichem TDS und gleicher Extraktion waren die Tassen nicht unterscheidbar.", "source": {"title": "SCA – Brewing Temperature and the Sensory Profile of Brewed Coffee", "url": "https://sca.coffee/sca-news/read/just-published-brewing-temperature-and-the-sensory-profile-of-brewed-coffee-37dt6"}, "img": "filter", "topic": "Extraktion"}, {"id": "b3-05", "mode": "barista", "level": 3, "type": "mc", "q": "Worauf basiert das überarbeitete SCA Coffee Taster's Flavor Wheel?", "options": ["Auf dem Espresso-Standard des INEI", "Auf dem Cupping-Bogen der SCAA", "Auf dem Brewing Control Chart", "Auf dem Sensory Lexicon des WCR"], "correct": 3, "explain": "Das WCR Sensory Lexicon ist die Grundlage des überarbeiteten Aromarads – die erste Neugestaltung seit rund 20 Jahren.", "source": {"title": "World Coffee Research – Sensory Lexicon", "url": "https://worldcoffeeresearch.org/resources/sensory-lexicon"}, "img": "rad", "topic": "Sensorik"}, {"id": "b3-06", "mode": "barista", "level": 3, "type": "mc", "q": "Welches Verhältnis Kaffee zu Wasser gilt beim SCA-Cupping?", "options": ["8,25 g auf 150 ml", "12,5 g auf 100 ml", "4,75 g auf 250 ml", "16,5 g auf 150 ml"], "correct": 0, "explain": "Beim SCA-Cupping werden 8,25 g Kaffee auf 150 ml Wasser verwendet (ca. 0,055 g/ml).", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik"}, {"id": "b3-07", "mode": "barista", "level": 3, "type": "mc", "q": "Wann wird beim SCA-Cupping standardmäßig die Kruste gebrochen?", "options": ["Nach etwa 30 Sekunden", "Nach etwa 4 Minuten", "Nach etwa 15 Minuten", "Nach etwa 30 Minuten"], "correct": 1, "explain": "Nach dem Aufgießen mit ca. 93 °C heißem Wasser zieht der Kaffee etwa 4 Minuten, dann wird die Kruste gebrochen.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik"}, {"id": "b3-08", "mode": "barista", "level": 3, "type": "mc", "q": "Ab welcher Punktzahl gilt Kaffee auf der klassischen 100-Punkte-Skala der SCA als Specialty?", "options": ["60 Punkte", "70 Punkte", "90 Punkte", "80 Punkte"], "correct": 3, "explain": "Nach dem klassischen SCA-Cupping-Bogen gilt Kaffee ab 80 Punkten als Specialty Coffee.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik"}, {"id": "b3-09", "mode": "barista", "level": 3, "type": "mc", "q": "Welcher Chlorgehalt ist im SCA-Wasserstandard als Ziel angegeben?", "options": ["0 mg/L", "10 mg/L", "50 mg/L", "100 mg/L"], "correct": 0, "explain": "Chlor soll im Brühwasser gar nicht vorhanden sein – Ziel ist 0 mg/L.", "source": {"title": "Prima Coffee – Testing Your Water (SCA-Wasserstandard)", "url": "https://prima-coffee.com/blog/testing-your-water/"}, "img": "wasser", "topic": "Wasser"}, {"id": "b3-10", "mode": "barista", "level": 3, "type": "mc", "q": "Warum muss das Tuch für die Dampflanze sauber sein, obwohl die Milch erhitzt wird?", "options": ["Weil sich Keime in heißer Milch besonders schnell vermehren", "Weil 55–60 °C weit unter der Pasteurisierung liegen", "Weil Keime erst beim Kochen ab 100 °C sterben", "Weil das Tuch Kalkreste auf die Dampflanze überträgt"], "correct": 1, "explain": "Übliche Milchtemperaturen (55–60 °C) liegen weit unter der Pasteurisierung (≥72 °C für 15 s) und töten Erreger nicht ab; das Wischtuch ist eine typische Kontaminationsquelle.", "source": {"title": "Barista Hustle – Hygiene", "url": "https://www.baristahustle.com/lesson/la-5-05-hygiene/"}, "img": "milch", "topic": "Pflege"}, {"id": "b3-11", "mode": "barista", "level": 3, "type": "mc", "q": "Wie viel Kaffeemehl sieht das INEI für einen zertifizierten Espresso Italiano vor?", "options": ["Etwa 3 g", "Etwa 14 g", "Etwa 7 g", "Etwa 21 g"], "correct": 2, "explain": "Das INEI verlangt 7 g (±0,5 g) für etwa 25 ml in der Tasse.", "source": {"title": "Manufactum – Guten Espresso erkennen (INEI-Kriterien)", "url": "https://www.manufactum.com/good-espresso-recognize-c200599/"}, "img": "espresso", "topic": "Standards"}, {"id": "b3-12", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Getränkestärke (TDS) gilt im klassischen Brewing Control Chart als ideal für Filterkaffee?", "options": ["0,55–0,75 %", "2,15–2,35 %", "1,15–1,35 %", "3,15–3,35 %"], "correct": 2, "explain": "Laut Lockharts Brewing Control Chart liegt der ideale Filterkaffee bei 1,15–1,35 % TDS.", "source": {"title": "Barista Hustle – Towards a Common Coffee Control Chart", "url": "https://www.baristahustle.com/towards-a-common-coffee-control-chart/"}, "img": "filter", "topic": "Extraktion"}, {"id": "b3-13", "mode": "barista", "level": 3, "type": "mc", "q": "Wie viel mg/L Calciumcarbonat (CaCO₃) entspricht etwa 1 °dH (deutsche Härte)?", "options": ["Etwa 1,8 mg/L", "Etwa 178 mg/L", "Etwa 17,8 mg/L", "Etwa 0,18 mg/L"], "correct": 2, "explain": "1 °dH ist definiert als 10 mg CaO pro Liter, das entspricht rund 17,8 mg/L CaCO₃.", "source": {"title": "Wikipedia – Degrees of general hardness (dGH)", "url": "https://en.wikipedia.org/wiki/DGH"}, "img": "wasser", "topic": "Wasser"}, {"id": "b3-14", "mode": "barista", "level": 3, "type": "mc", "q": "Welcher Zielwert für die Gesamtalkalinität steht im SCA-Wasserstandard?", "options": ["Etwa 40 mg/L", "Etwa 10 mg/L", "Etwa 150 mg/L", "Etwa 400 mg/L"], "correct": 0, "explain": "Der SCA-Standard nennt 40 mg/L Alkalinität als Ziel („at or near 40 mg/L“).", "source": {"title": "Prima Coffee – Testing Your Water (SCA-Wasserstandard)", "url": "https://prima-coffee.com/blog/testing-your-water/"}, "img": "wasser", "topic": "Wasser"}, {"id": "b3-15", "mode": "barista", "level": 3, "type": "mc", "q": "Welchen pH-Wert nennt der SCA-Wasserstandard als Ziel?", "options": ["pH 4,5", "pH 5,5", "pH 9,0", "pH 7,0"], "correct": 3, "explain": "Ziel ist neutrales Wasser mit pH 7; akzeptiert werden 6,5–7,5.", "source": {"title": "Prima Coffee – Testing Your Water (SCA-Wasserstandard)", "url": "https://prima-coffee.com/blog/testing-your-water/"}, "img": "wasser", "topic": "Wasser"}, {"id": "b3-16", "mode": "barista", "level": 3, "type": "mc", "q": "Warum enthält papiergefilterter Kaffee kaum Cafestol, French-Press-Kaffee dagegen viel?", "options": ["Cafestol entsteht erst durch den Druck des Kolbens", "Papier hält die Diterpene wie Cafestol zurück", "Cafestol verdampft beim langsamen Handaufguss", "French Press brüht heißer und löst mehr Cafestol"], "correct": 1, "explain": "Papier hält die fettlöslichen Diterpene zurück; ungefilterter Kaffee (French Press, türkisch) enthält am meisten – regelmäßig getrunken kann er das Serumcholesterin erhöhen.", "source": {"title": "Wikipedia – Cafestol (Zhang et al. 2012; Urgert & Katan 1997)", "url": "https://en.wikipedia.org/wiki/Cafestol"}, "img": "filter", "topic": "Filter"}, {"id": "b3-17", "mode": "barista", "level": 3, "type": "mc", "q": "Was bedeutet eine „bimodale“ Partikelverteilung beim Espressomahlgut?", "options": ["Eine einzige Spitze ohne nennenswerten Feinanteil", "Zwei Mahlstufen, die nacheinander gemahlen werden", "Zwei Größenspitzen: Feinanteil und Hauptanteil", "Gleichmäßig breite Verteilung ohne klare Spitze"], "correct": 2, "explain": "Espresso-Mahlgut zeigt meist zwei „Peaks“: einen Feinanteil (oft ca. 30–70 µm) und einen Hauptpeak mit dem Großteil des Mahlguts.", "source": {"title": "Kaffeemacher – Coffee Particle Distribution", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/coffee-particle-distribution"}, "img": "muehle", "topic": "Mahlgrad"}, {"id": "b3-18", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Organisation vergibt die Q-Arabica-Grader-Lizenz?", "options": ["Coffee Quality Institute (CQI)", "World Coffee Research (WCR)", "International Coffee Organization (ICO)", "Istituto Nazionale Espresso Italiano (INEI)"], "correct": 0, "explain": "Das Coffee Quality Institute betreibt das Q-Programm; die Lizenz gilt 3 Jahre und muss dann per Kalibrierung erneuert werden.", "source": {"title": "Coffee Quality Institute – Who is a Q Grader?", "url": "https://www.coffeeinstitute.org/who-is-a-q-grader"}, "img": "tasse", "topic": "Sensorik"}, {"id": "b3-19", "mode": "barista", "level": 3, "type": "mc", "q": "Wie entstand die heutige Specialty Coffee Association (SCA)?", "options": ["Durch Ausgliederung aus der ICO 1963", "Durch Umbenennung der SCAA 2012", "Durch Abspaltung vom INEI 1998", "Durch Fusion von SCAA und SCAE 2017"], "correct": 3, "explain": "Die SCA entstand 2017 aus der Vereinigung der amerikanischen (SCAA) und der europäischen (SCAE) Specialty Coffee Association.", "source": {"title": "SCA – About", "url": "https://sca.coffee/about"}, "img": "tasse", "topic": "Standards"}, {"id": "b3-20", "mode": "barista", "level": 3, "type": "mc", "q": "Was löste die SCA mit dem Coffee Value Assessment (CVA) ab?", "options": ["Den Espresso-Italiano-Standard des INEI", "Cupping-Protokoll und -Formular von 2004", "Den Wasserstandard der SCA für Brühwasser", "Das Brewing Control Chart von 1957"], "correct": 1, "explain": "Die SCA übernahm 2024 die CVA-Standards (u. a. deskriptive und affektive Bewertung) als Ersatz für Protokoll und Formular von 2004.", "source": {"title": "SCA – SCA Officially Adopts CVA as New Cupping Standards", "url": "https://sca.coffee/sca-news/sca-new-cva-cupping-standards"}, "img": "tasse", "topic": "Sensorik"}, {"id": "b3-21", "mode": "barista", "level": 3, "type": "mc", "q": "Wie fein wird laut SCA-Cupping-Protokoll gemahlen?", "options": ["90–95 % passieren ein US-Sieb Nr. 50", "50–55 % passieren ein US-Sieb Nr. 20", "70–75 % passieren ein US-Sieb Nr. 20", "70–75 % passieren ein US-Sieb Nr. 40"], "correct": 2, "explain": "Vorgabe: 70–75 % des Mahlguts passieren ein US-Standardsieb Nr. 20 – etwas gröber als für Filterkaffee.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik"}, {"id": "b3-22", "mode": "barista", "level": 3, "type": "mc", "q": "Wie viele Tassen pro Probe sieht das SCA-Standard-Cupping vor?", "options": ["1 Tasse", "5 Tassen", "10 Tassen", "20 Tassen"], "correct": 1, "explain": "Für ein SCA-Standard-Cupping werden 5 Tassen pro Probe angesetzt, um auch die Gleichmäßigkeit zu prüfen.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik"}, {"id": "b3-23", "mode": "barista", "level": 3, "type": "mc", "q": "Wann soll eine Probe für das SCA-Cupping geröstet worden sein?", "options": ["36–48 Stunden vor dem Cupping", "3–5 Tage vor dem Cupping", "2–4 Wochen vor dem Cupping", "8–24 Stunden vor dem Cupping"], "correct": 3, "explain": "Das Protokoll sieht eine Röstdauer von 8–12 Minuten vor, 8–24 Stunden vor dem Cupping.", "source": {"title": "Royal Coffee – Cupping Protocols & Procedures (SCA-basiert)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "tasse", "topic": "Sensorik"}, {"id": "b3-24", "mode": "barista", "level": 3, "type": "mc", "q": "Woher hat die Faema-Brühgruppe E61 ihren Namen?", "options": ["Von der totalen Sonnenfinsternis 1961", "Von der Weltausstellung in Turin 1961", "Von der Gruppentemperatur von 61 °C", "Vom Gründungsjahr der Firma Faema 1961"], "correct": 0, "explain": "Ernesto Valente benannte die 1961 vorgestellte Gruppe nach der in Italien sichtbaren Sonnenfinsternis jenes Jahres.", "source": {"title": "Kaffeemacher – Die Faema E61 Brühgruppe", "url": "https://kaffeemacher.ch/en/blogs/kaffeewissen/faema-e61-bruehgruppe"}, "img": "espresso", "topic": "Espresso"}, {"id": "b3-25", "mode": "barista", "level": 3, "type": "mc", "q": "Wie hält die E61-Brühgruppe ihre Temperatur?", "options": ["Heizstab: ein eigenes Element heizt die Gruppe", "Umwälzpumpe: Kesselwasser wird durchgepumpt", "Gasbrenner: eine Flamme heizt die Gruppe direkt", "Thermosiphon: Kesselwasser zirkuliert ohne Pumpe"], "correct": 3, "explain": "Heißes Wasser steigt vom Kessel durch ein Rohr in die schwere Messinggruppe und fließt abgekühlt zurück – ein Thermosiphon-Kreislauf.", "source": {"title": "Kaffeemacher – Die Faema E61 Brühgruppe", "url": "https://kaffeemacher.ch/en/blogs/kaffeewissen/faema-e61-bruehgruppe"}, "img": "espresso", "topic": "Espresso"}, {"id": "b3-26", "mode": "barista", "level": 3, "type": "mc", "q": "Wie funktioniert eine Zweikreiser-Maschine (Wärmetauscher, HX)?", "options": ["Zwei getrennte Kessel für Brühen und Dampf", "Zwei Thermoblöcke, je einer für Brühen und Dampf", "Ein Dampfkessel, durch den ein Brührohr läuft", "Ein Brühkessel, durch den ein Dampfrohr läuft"], "correct": 2, "explain": "Beim HX gibt es einen Kessel; das Brühwasser wird in einem durch den Dampfkessel geführten Rohr erhitzt. Getrennte Kessel hat die Dualboiler-Maschine.", "source": {"title": "Seattle Coffee Gear – Heat Exchangers vs. Dual Boilers", "url": "https://www.seattlecoffeegear.com/blogs/scg-blog/heat-exchangers-vs-dual-boilers"}, "img": "espresso", "topic": "Espresso"}, {"id": "b3-27", "mode": "barista", "level": 3, "type": "mc", "q": "Wer erhielt 1884 in Turin ein frühes Patent für eine dampfbetriebene Kaffeemaschine?", "options": ["Achille Gaggia", "Angelo Moriondo", "Alfonso Bialetti", "Ernesto Valente"], "correct": 1, "explain": "Angelo Moriondo aus Turin patentierte 1884 eine Dampfmaschine zur schnellen Kaffeezubereitung – ein Vorläufer der Espressomaschine.", "source": {"title": "Smithsonian Magazine – The Long History of the Espresso Machine", "url": "https://www.smithsonianmag.com/arts-culture/the-long-history-of-the-espresso-machine-126012814/"}, "img": "espresso", "topic": "Espresso"}, {"id": "b3-28", "mode": "barista", "level": 3, "type": "mc", "q": "Mit welcher Entwicklung kam die Crema auf den Espresso?", "options": ["Mit Bialettis Aluminium-Mokkakanne von 1933", "Mit Moriondos Dampf-Kaffeemaschine von 1884", "Mit Gaggias Hochdruck-Hebelmaschine nach 1945", "Mit Faemas Pumpen-Brühgruppe E61 von 1961"], "correct": 2, "explain": "Laut Smithsonian kam die Crema erst mit Gaggias Hochdruck-Hebelmaschine; Gaggia soll den Schaum „caffè crema“ genannt haben.", "source": {"title": "Smithsonian Magazine – The Long History of the Espresso Machine", "url": "https://www.smithsonianmag.com/arts-culture/the-long-history-of-the-espresso-machine-126012814/"}, "img": "crema", "topic": "Espresso"}, {"id": "b3-29", "mode": "barista", "level": 3, "type": "mc", "q": "Welche tägliche Koffeinmenge hält die EFSA für Schwangere für unbedenklich?", "options": ["Bis 200 mg pro Tag", "Bis 400 mg pro Tag", "Bis 600 mg pro Tag", "Bis 100 mg pro Tag"], "correct": 0, "explain": "Laut EFSA gelten für Schwangere und Stillende bis 200 mg Koffein pro Tag aus allen Quellen als unbedenklich für das Kind.", "source": {"title": "EFSA explains: Caffeine", "url": "https://www.efsa.europa.eu/sites/default/files/corporate_publications/files/efsaexplainscaffeine150527.pdf"}, "img": "bohne", "topic": "Bohne & Lagerung"}, {"id": "b3-30", "mode": "barista", "level": 3, "type": "mc", "q": "Welche mittlere Halbwertszeit von Koffein nennt die EFSA für gesunde Erwachsene?", "options": ["Etwa 1 Stunde", "Etwa 4 Stunden", "Etwa 12 Stunden", "Etwa 24 Stunden"], "correct": 1, "explain": "Im Mittel baut der Körper die Hälfte des Koffeins in rund 4 Stunden ab – je nach Person 2 bis 8 Stunden.", "source": {"title": "EFSA explains: Caffeine", "url": "https://www.efsa.europa.eu/sites/default/files/corporate_publications/files/efsaexplainscaffeine150527.pdf"}, "img": "bohne", "topic": "Bohne & Lagerung"}, {"id": "r1-01", "mode": "roester", "level": 1, "type": "mc", "q": "Was treibt den First Crack hauptsächlich an?", "options": ["Kaffeeöl, das im Zellinneren zu sieden beginnt", "Zucker, der schmilzt und die Zellwände sprengt", "Wasserdampf, der im Inneren Druck aufbaut", "Zellulose, die sich in der Hitze ruckartig dehnt"], "correct": 2, "explain": "Das in der Bohne gebundene Wasser wird zu Dampf und baut Druck auf, bis die Zellstruktur hörbar aufbricht. Wasserdampf ist dabei der Haupttreiber, wenn auch nicht der einzige Faktor.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Phasen & Crack"}, {"id": "r1-02", "mode": "roester", "level": 1, "type": "mc", "q": "Bei welcher Bohnentemperatur beginnt der First Crack ungefähr?", "options": ["Um 100 °C", "Um 150 °C", "Um 200 °C", "Um 230 °C"], "correct": 2, "explain": "Sweet Maria's nennt rund 395–405 °F (etwa 202–207 °C) als Richtwert. Die genaue Anzeige hängt von Röster und Fühlerposition ab. Der genaue Wert hängt von Röster und Messfühler ab.", "source": {"title": "Sweet Maria's – First Crack, Second Crack and Bean Changes", "url": "https://library.sweetmarias.com/coffee-class-first-crack-second-crack-and-bean-changes-in-the-roast/"}, "img": "crack", "topic": "Phasen & Crack"}, {"id": "r1-03", "mode": "roester", "level": 1, "type": "mc", "q": "Wie verändert sich die Farbe der Bohnen im Lauf der Röstung?", "options": ["Grün → gelb → braun", "Grün → rot → schwarz", "Gelb → grün → braun", "Grün → braun → gelb"], "correct": 0, "explain": "Während der Trocknung wird die Bohne von grün über gelb zu braun. Das Gelbwerden markiert grob das Ende der Trocknungsphase.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "bohne", "topic": "Phasen & Crack"}, {"id": "r1-04", "mode": "roester", "level": 1, "type": "mc", "q": "Wie viel Gewicht verliert Kaffee bei hellen bis mittleren Specialty-Röstungen typischerweise?", "options": ["Etwa 4–7 %", "Etwa 11–16 %", "Etwa 25–30 %", "Etwa 35–40 %"], "correct": 1, "explain": "Je nach Röstgrad und Ausgangsfeuchte liegt der Verlust insgesamt bei etwa 11–24 %. Specialty-Röster arbeiten meist hell bis mittel und rechnen mit 11–16 %.", "source": {"title": "Barista Hustle – How to Roast Coffee (Gewichtsverlust)", "url": "https://baristahustle.com/?p=453522"}, "img": "sack", "topic": "Röstgrad"}, {"id": "r1-05", "mode": "roester", "level": 1, "type": "mc", "q": "Woher kommt der größte Teil des Gewichtsverlusts beim Rösten?", "options": ["Von abgelöstem Chaff", "Von entweichendem CO₂", "Von verbrennenden Zuckern", "Von verdampfendem Wasser"], "correct": 3, "explain": "Den Großteil macht verdampfendes Wasser aus. Der Rest ist hauptsächlich CO₂ und Wasser, die bei chemischen Reaktionen entstehen.", "source": {"title": "Barista Hustle – How to Roast Coffee (Gewichtsverlust)", "url": "https://baristahustle.com/?p=453522"}, "img": "bohne", "topic": "Chemie"}, {"id": "r1-06", "mode": "roester", "level": 1, "type": "mc", "q": "Was ist „Chaff“ beim Rösten?", "options": ["Die Rußschicht, die sich im Abluftrohr ablagert", "Das Silberhäutchen, das sich von der Bohne löst", "Bruchstücke, die im First Crack von Bohnen abplatzen", "Staub, der beim Einfüllen des Rohkaffees aufsteigt"], "correct": 1, "explain": "Chaff ist das papierartige Silberhäutchen, das sich während der Röstung löst. Naturkaffees haben deutlich mehr davon.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "trommel", "topic": "Phasen & Crack"}, {"id": "r1-07", "mode": "roester", "level": 1, "type": "mc", "q": "Welcher Feuchtegehalt gilt laut SCA als Standard für Rohkaffee?", "options": ["6–8 %", "10–12 %", "14–16 %", "18–20 %"], "correct": 1, "explain": "Die SCA nennt 10–12 % Feuchte als Standard für Rohkaffee. Trocknere oder feuchtere Partien verhalten sich im Röster anders.", "source": {"title": "Cropster – Green grading coffee (SCA-Feuchtestandard)", "url": "https://www.cropster.com/blog-post/green-grading-coffee/"}, "img": "sack", "topic": "Rohkaffee"}, {"id": "r1-08", "mode": "roester", "level": 1, "type": "mc", "q": "Was löst den Second Crack aus?", "options": ["Restwasser, das im Bohnenkern erst jetzt verdampft", "Saccharose, die schmilzt und die Zellwände sprengt", "Gasdruck, vor allem CO₂, in der spröden Bohnenstruktur", "Öl, das aus dem Bohneninneren an die Oberfläche drängt"], "correct": 2, "explain": "Beim Second Crack baut sich Gasdruck auf, vor allem CO₂. Die inzwischen spröde Zellstruktur hält ihm nicht mehr stand. Er liegt etwa bei 440–455 °F (ca. 227–235 °C).", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Phasen & Crack"}, {"id": "r1-09", "mode": "roester", "level": 1, "type": "mc", "q": "Welche drei Arten der Wärmeübertragung wirken beim Rösten?", "options": ["Konduktion, Konvektion, Strahlung", "Kondensation, Verdunstung, Sublimation", "Oxidation, Reduktion, Fermentation", "Kompression, Expansion, Reibung"], "correct": 0, "explain": "Die Bohnen nehmen Wärme durch Kontakt (Konduktion), über heiße Luft (Konvektion) und durch Strahlung auf. Im Trommelröster dominiert laut Quelle die Konvektion.", "source": {"title": "Oil Slick Coffee – Heat Transfer Methods in Roasting", "url": "https://oilslickcoffee.com/roasting/heat-transfer-methods/"}, "img": "trommel", "topic": "Wärme & Maschine"}, {"id": "r1-10", "mode": "roester", "level": 1, "type": "mc", "q": "Was bedeutet beim Agtron-Wert eine höhere Zahl?", "options": ["Eine dunklere Röstung", "Eine längere Röstzeit", "Eine höhere Dichte", "Eine hellere Röstung"], "correct": 3, "explain": "Auf der Agtron-Skala stehen höhere Werte für hellere Röstungen. Sehr helle Bohnen liegen bei etwa 70 (ganz) bzw. 95 (gemahlen), sehr dunkle bei etwa 25 bzw. 30.", "source": {"title": "Coffee Review – Roast Definitions (Agtron)", "url": "https://www.coffeereview.com/roast-definitions/"}, "img": "bohne", "topic": "Röstgrad"}, {"id": "r1-11", "mode": "roester", "level": 1, "type": "mc", "q": "Was bezeichnet die „Development Time“ (Entwicklungszeit)?", "options": ["Die Zeit vom Einfüllen bis zum Gelbwerden", "Die Zeit vom First Crack bis zum Drop", "Die Zeit vom Gelbwerden bis zum First Crack", "Die Zeit vom Einfüllen bis zum Drop"], "correct": 1, "explain": "Die Development Time ist die Phase vom First Crack bis zum Drop. Ihr Anteil an der Gesamtröstzeit heißt Development Time Ratio (DTR).", "source": {"title": "Royal Coffee – Coffee Roasting Glossary", "url": "https://www.royalny.com/?p=165626"}, "img": "kurve", "topic": "Phasen & Crack"}, {"id": "r1-12", "mode": "roester", "level": 1, "type": "case", "q": "Die Röstung sollte mittel werden. Was änderst du bei der nächsten Charge?", "case": {"title": "Fall · Brasilien, natural, Ziel: mittlere Röstung", "facts": ["Drop deutlich nach Beginn des Second Crack", "Bohnen glänzen ölig", "Gewichtsverlust 19 %"], "cup": "Rauchig, aschig, bitter, kaum Süße"}, "options": ["Länger entwickeln, um mehr Süße aufzubauen", "Im Second Crack mehr Gas geben, um Zeit zu sparen", "Früher droppen, noch vor dem Second Crack", "Mehr Luftstrom, Drop-Zeitpunkt beibehalten"], "correct": 2, "explain": "Eine ölige Oberfläche und ein Drop im Second Crack zeigen eine dunkle Röstung. 19 % Gewichtsverlust liegen klar über den 11–16 % heller bis mittlerer Röstungen. Wer früher droppt, vor dem Second Crack, kommt zur gewünschten mittleren Röstung.", "source": {"title": "Sweet Maria's – First Crack FAQ", "url": "https://library.sweetmarias.com/first-crack-faq-what-is-first-crack-what-is-second-crack/"}, "img": "crack", "topic": "Fallstudie"}, {"id": "r2-01", "mode": "roester", "level": 2, "type": "mc", "q": "Welche Stoffe reagieren bei der Maillard-Reaktion miteinander?", "options": ["Reduzierende Zucker und Aminosäuren", "Saccharose und Chlorogensäuren", "Koffein und organische Säuren", "Triglyceride und lösliche Polysaccharide"], "correct": 0, "explain": "Bei der Maillard-Reaktion reagieren reduzierende Zucker mit Aminosäuren. Dabei entstehen Bräunung und viele Aromastoffe.", "source": {"title": "Sweet Maria's – Roasting Chemistry and Profile Roasting (PDF)", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Roasting-Chemistry-and-Profile-Roasting.pdf"}, "img": "bohne", "topic": "Chemie"}, {"id": "r2-02", "mode": "roester", "level": 2, "type": "mc", "q": "Was passiert mit den Chlorogensäuren beim Rösten?", "options": ["Sie bleiben weitgehend stabil, wie das Koffein", "Sie reichern sich an, je dunkler, desto mehr", "Sie werden abgebaut, aber nur bei hellen Röstungen", "Sie werden stark abgebaut, je dunkler, desto mehr"], "correct": 3, "explain": "Chlorogensäuren werden beim Rösten stark abgebaut, bei dunkler Röstung um bis zu rund 90 %. Dabei entstehen unter anderem bittere Lactone und Phenole.", "source": {"title": "Ludwig et al. 2014, Food & Function – Caffeine and chlorogenic acid contents", "url": "https://pubs.rsc.org/en/content/articlehtml/2014/fo/c4fo00290c"}, "img": "bohne", "topic": "Chemie"}, {"id": "r2-03", "mode": "roester", "level": 2, "type": "mc", "q": "Wie verändert sich der Koffeingehalt der Bohne beim Rösten?", "options": ["Er sinkt mit dunkler Röstung deutlich", "Er bleibt im Verlauf weitgehend stabil", "Er steigt mit dem Röstgrad deutlich an", "Er halbiert sich bis zum First Crack"], "correct": 1, "explain": "Koffein ist beim Rösten weitgehend stabil, während Chlorogensäuren abnehmen. Darum steigt das Verhältnis Koffein zu Chlorogensäure mit dem Röstgrad.", "source": {"title": "Ludwig et al. 2014, Food & Function – Caffeine and chlorogenic acid contents", "url": "https://pubs.rsc.org/en/content/articlehtml/2014/fo/c4fo00290c"}, "img": "bohne", "topic": "Chemie"}, {"id": "r2-04", "mode": "roester", "level": 2, "type": "mc", "q": "Was passiert mit der Saccharose im Rohkaffee beim Rösten?", "options": ["Sie bleibt größtenteils erhalten", "Sie wird etwa zur Hälfte abgebaut", "Sie wird fast vollständig abgebaut", "Sie nimmt durch den Abbau von Stärke zu"], "correct": 2, "explain": "Untersuchungen zeigen, dass schon bei mittleren Röstungen rund 96–98 % der Saccharose abgebaut sind. Dafür sorgen Karamellisierung und Maillard-Reaktionen.", "source": {"title": "Potravinarstvo – The effect of coffee beans roasting on its chemical composition", "url": "https://potravinarstvo.com/journal1/index.php/potravinarstvo/article/view/1062"}, "img": "bohne", "topic": "Chemie"}, {"id": "r2-05", "mode": "roester", "level": 2, "type": "mc", "q": "Was ist der „Turning Point“ auf der Röstkurve?", "options": ["Der Tiefpunkt der Bohnentemperatur nach dem Einfüllen", "Der Moment, in dem die Bohnen gelb zu werden beginnen", "Der Wechsel von endothermer zu exothermer Reaktion", "Der Moment, in dem der Brenner erstmals gedrosselt wird"], "correct": 0, "explain": "Nach dem Einfüllen der kalten Bohnen fällt die Fühlertemperatur zunächst. Der Turning Point ist der Moment, ab dem sie wieder steigt. Er hängt von Charge-Temperatur, Brennerleistung, Chargengröße und Vorheizen ab.", "source": {"title": "Loring – Roast Profile (Turn Around Point)", "url": "https://loring.com/helpfiles/RA/RoastProfile.html"}, "img": "kurve", "topic": "Phasen & Crack"}, {"id": "r2-06", "mode": "roester", "level": 2, "type": "mc", "q": "Was sind „Quakers“?", "options": ["Bohnen, deren Spitzen im Röster verbrennen", "Bohnen, die im First Crack laut aufplatzen", "Bohnen, die durch Insektenfraß kleine Löcher haben", "Unreife Bohnen, die beim Rösten hell bleiben"], "correct": 3, "explain": "Quakers sind unreife, unterentwickelte Kaffeesamen, die beim Rösten nicht richtig bräunen und hell bleiben.", "source": {"title": "Sweet Maria's – Glossar: Quakers", "url": "https://library.sweetmarias.com/glossary/quakers/"}, "img": "bohne", "topic": "Rohkaffee"}, {"id": "r2-07", "mode": "roester", "level": 2, "type": "mc", "q": "Was misst die Rate of Rise (RoR)?", "options": ["Wie schnell die Abluft die Trommel verlässt", "Wie schnell die Bohnentemperatur steigt", "Wie schnell die Bohnen an Gewicht verlieren", "Wie schnell der Brenner Wärme nachliefert"], "correct": 1, "explain": "Die RoR zeigt, wie schnell die Bohnentemperatur steigt. Sie wird meist in Grad pro Minute angegeben und hilft, den Verlauf einer Röstung zu steuern.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "topic": "Wärme & Maschine"}, {"id": "r2-08", "mode": "roester", "level": 2, "type": "mc", "q": "Wie lagert man Specialty-Rohkaffee am besten bis zur Röstung?", "options": ["Offen im Jutesack, damit Restfeuchte entweichen kann", "Im Kühlraum, Liner geöffnet für bessere Luftzirkulation", "Verschlossen im Hermetik-Liner, kühl und temperaturstabil", "Im warmen Röstraum, damit er vor dem Rösten gut vortemperiert"], "correct": 2, "explain": "Den Liner bis zur Röstung geschlossen lassen. Kühle, stabile Temperaturen bremsen die Alterung und verhindern Kondenswasser im Liner.", "source": {"title": "Barista Hustle – Storing Green Coffee", "url": "https://www.baristahustle.com/?p=437739"}, "img": "sack", "topic": "Rohkaffee"}, {"id": "r2-09", "mode": "roester", "level": 2, "type": "case", "q": "Was änderst du bei der nächsten Charge?", "case": {"title": "Fall · Kolumbien, gewaschen, 1.700 m", "facts": ["Drop 10:30", "Entwicklung 0:50 (8 %)", "Gewichtsverlust 12,0 %"], "cup": "Grasig, rohe Erdnuss, vegetal-säuerlich"}, "options": ["Entwicklung verlängern oder etwas mehr Wärme einbringen", "Charge-Temperatur senken und Entwicklung verkürzen", "Früher droppen und den Luftstrom deutlich erhöhen", "Trommeldrehzahl erhöhen und den Drop-Zeitpunkt beibehalten"], "correct": 0, "explain": "Grasige, erdnussartige und vegetale Noten sind typisch für Unterentwicklung. Abhilfe schafft eine etwas dunklere Röstung oder eine Kurve, die mehr Wärme in die Bohne bringt, also mehr Entwicklung.", "source": {"title": "Barista Hustle – Underdevelopment vs. Baking", "url": "https://www.baristahustle.com/?p=474557"}, "img": "kurve", "topic": "Fallstudie"}, {"id": "r2-10", "mode": "roester", "level": 2, "type": "case", "q": "Die Bohnenspitzen sind angesengt. Was änderst du?", "case": {"title": "Fall · Äthiopien, natural", "facts": ["Charge-Temperatur deutlich höher als üblich", "Volle Brennerleistung direkt ab Einfüllen", "Dunkle Brandstellen an den Bohnenenden"], "cup": "Leicht verbrannt, aschig im Abgang"}, "options": ["Später droppen, damit sich die Farbe besser angleicht", "Luftstrom drosseln, damit die Wärme gleichmäßiger wirkt", "Trommeldrehzahl senken, damit die Bohnen ruhiger liegen", "Niedrigere Charge-Temperatur und weniger Gas zu Beginn"], "correct": 3, "explain": "Dunkle Spitzen sind „Tipping“. Ursache ist meist eine zu heiße Startumgebung (Charge-Temperatur zu hoch), auch eine überfüllte Trommel oder zu wenig Luftstrom kommen in Frage. Erste Maßnahme: weniger Starthitze.", "source": {"title": "Sweet Maria's – Glossar: Tipping", "url": "https://library.sweetmarias.com/glossary/tipping/"}, "img": "bohne", "topic": "Fallstudie"}, {"id": "r2-11", "mode": "roester", "level": 2, "type": "case", "q": "Was änderst du bei der nächsten Charge?", "case": {"title": "Fall · Honduras, gewaschen", "facts": ["Drop 14:30", "RoR fällt nach First Crack auf ~0 und stagniert", "Entwicklung 3:40 (25 %)"], "cup": "Flach, dumpf, kaum Süße, leicht pappig"}, "options": ["Gas nach First Crack weiter senken, um die Entwicklung zu strecken", "Energie so führen, dass die RoR nach First Crack nicht stockt", "Früher droppen und die RoR weiter auf null fallen lassen", "Charge-Temperatur senken, damit der Start sanfter verläuft"], "correct": 1, "explain": "Eine stockende Röstung, bei der die RoR auf null oder darunter fällt, erzeugt laut Rao gebackene, flache Aromen und lässt die Süße verschwinden. Die Energie sollte so geführt werden, dass die Temperatur bis zum Drop weiter steigt.", "source": {"title": "Daily Coffee News – Baked Beans (Scott Rao)", "url": "https://dailycoffeenews.com/2019/02/13/baked-beans-observations-on-water-content-during-roasting"}, "img": "kurve", "topic": "Fallstudie"}, {"id": "r2-12", "mode": "roester", "level": 2, "type": "case", "q": "Die Röstung ist in Ordnung. Was änderst du vor dem Verkauf?", "case": {"title": "Fall · Espresso-Röstung, 1 Tag alt", "facts": ["Röstung sauber, Kurve unauffällig", "Espresso 24 h nach dem Rösten", "Sehr viel großblasige Crema"], "cup": "Unruhiger Durchlauf, scharf, wenig klar"}, "options": ["Etwas dunkler rösten, damit die Crema feiner wird", "Bohnen direkt nach dem Abkühlen einfrieren und versenden", "Bohnen länger ruhen lassen, damit mehr CO₂ entweicht", "Feiner mahlen lassen, damit der Durchlauf ruhiger wird"], "correct": 2, "explain": "Frisch geröstete Bohnen enthalten viel CO₂, das beim Mahlen und Brühen freigesetzt wird und Crema und Durchfluss beeinflusst. Eine längere Ruhezeit lässt mehr Gas entweichen.", "source": {"title": "SCA Podcast #81 – The Science of Coffee Freshness (Samo Smrke)", "url": "https://sca.coffee/sca-news/podcast/81/the-science-of-coffee-freshness-samo-smrke-expo-lectures-2019"}, "img": "kurve", "topic": "Fallstudie"}, {"id": "r3-02", "mode": "roester", "level": 3, "type": "mc", "q": "Was meint Scott Rao mit einem „Flick“?", "options": ["Einen kurzen Gasstoß direkt nach dem Einfüllen", "Einen plötzlichen Einbruch der RoR nach First Crack", "Das erste vereinzelte Knacken vor dem First Crack", "Einen erneuten Anstieg der RoR spät in der Röstung"], "correct": 3, "explain": "Ein Flick ist laut Rao eine Beschleunigung der Bohnen-RoR gegen Ende der Röstung. Er bringt verkohlte, röstige Noten und nimmt Delikatesse, auch bei heller Farbe.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "topic": "Röstfehler"}, {"id": "r3-03", "mode": "roester", "level": 3, "type": "mc", "q": "Welches gefährliche Gas geben frisch geröstete und gemahlene Bohnen ab?", "options": ["Schwefeldioxid (neben CO₂)", "Kohlenmonoxid (neben CO₂)", "Stickoxide (neben CO₂)", "Ammoniak (neben CO₂)"], "correct": 1, "explain": "Geröstete Bohnen gasen CO und CO₂ aus, beim Mahlen besonders stark. NIOSH maß an Mühlen CO-Spitzen über 200 ppm. Lüftung und abgedeckte Behälter sind deshalb wichtig.", "source": {"title": "NIOSH HHE 2016-0144-3305 – Coffee roasting and packaging facility", "url": "https://www.cdc.gov/niosh/hhe/reports/pdfs/2016-0144-3305.pdf"}, "img": "sack", "topic": "Sicherheit"}, {"id": "r3-04", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du?", "case": {"title": "Fall · Kenia, gewaschen, 1.800 m", "facts": ["Drop 9:40", "Entwicklung 1:05 (11 %)", "Gewichtsverlust 11,8 %"], "cup": "Hell und saftig, aber grüne Tomate und Erdnuss im Abgang"}, "options": ["Charge-Temperatur erhöhen und entsprechend früher droppen", "Früher droppen, damit die Saftigkeit erhalten bleibt", "Entwicklung verlängern, Energie nach First Crack sanft halten", "Trommeldrehzahl senken, damit mehr Kontaktwärme in die Bohne geht"], "correct": 2, "explain": "Erdnuss und vegetale Noten wie grüne Tomate zeigen Unterentwicklung. Ein erfahrener Röster verlängert die Entwicklung leicht und hält die Energie nach dem First Crack so, dass die RoR sanft weiterfällt, ohne zu stocken.", "source": {"title": "Barista Hustle – Underdevelopment vs. Baking", "url": "https://www.baristahustle.com/?p=474557"}, "img": "kurve", "topic": "Fallstudie"}, {"id": "r3-05", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du?", "case": {"title": "Fall · Panama, gewaschen, helle Filterröstung", "facts": ["Gas während des First Crack erhöht", "RoR steigt nach First Crack wieder an", "Drop 11:20, helle Farbe"], "cup": "Verkohlte Note trotz heller Farbe, wenig Delikatesse"}, "options": ["Kein Gas im First Crack nachlegen, ET-RoR vorher beobachten", "Gas im First Crack erhöhen, damit die RoR nicht zu stark abfällt", "Luftstrom im First Crack schließen, um Wärme zu halten", "Charge-Temperatur senken, Gasführung im First Crack gleich"], "correct": 0, "explain": "Das Profil zeigt einen Flick. Rao rät, im klassischen Trommelröster während des First Crack keine Hitze nachzulegen und auf eine zu schnell steigende ET-RoR als Frühwarnung zu achten.", "source": {"title": "Cropster / Scott Rao – The Flick (2021)", "url": "https://www.cropster.com/blog-post/the-flick-updated-for-2021/"}, "img": "kurve", "topic": "Fallstudie"}, {"id": "r3-07", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du?", "case": {"title": "Fall · Brasilien, natural, niedrige Lage", "facts": ["Trommel mit ca. 110 % der Nennkapazität befüllt", "Hohe Charge-Temperatur", "Dunkle Brandflecken auf den flachen Seiten"], "cup": "Aschig, rauchig, bitter"}, "options": ["Füllmenge erhöhen, damit sich die Hitze besser verteilt", "Füllmenge auf Nennkapazität reduzieren und Starthitze senken", "Entwicklung verlängern und die Trommeldrehzahl deutlich senken", "Abluft drosseln und die Charge-Temperatur beibehalten"], "correct": 1, "explain": "Brandflecken auf den flachen Seiten sind Scorching bzw. Facing. Typische Ursachen sind zu heiße Starttemperaturen, eine überladene Trommel oder zu wenig Luftstrom. Natural-Kaffees aus niedrigen Lagen sind besonders anfällig.", "source": {"title": "Sweet Maria's – Glossar: Scorching", "url": "https://library.sweetmarias.com/glossary/scorching/"}, "img": "bohne", "topic": "Fallstudie"}, {"id": "r3-09", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du für das Ziel „hell“?", "case": {"title": "Fall · Äthiopien, gewaschen, Ziel: helle Filterröstung", "facts": ["Drop 12:50, kurz vor dem Second Crack", "Gewichtsverlust 17,5 %", "Entwicklung 2:40 (21 %)"], "cup": "Röstig, bittersüß, kaum Frucht und Säure"}, "options": ["Früher droppen, bei niedrigerer Endtemperatur", "Später droppen, um mehr Süße zu entwickeln", "Gas im Second Crack erhöhen, Drop unverändert", "Charge-Temperatur erhöhen, Drop-Temperatur gleich"], "correct": 0, "explain": "17,5 % Gewichtsverlust und ein Drop knapp vor dem Second Crack sprechen für eine eher mittlere bis dunkle Röstung. Helle bis mittlere Röstungen liegen meist bei 11–16 %. Früher droppen bringt die Röstung zurück ins Ziel.", "source": {"title": "Barista Hustle – How to Roast Coffee (Gewichtsverlust)", "url": "https://baristahustle.com/?p=453522"}, "img": "kurve", "topic": "Fallstudie"}, {"id": "r3-10", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du, um das SCA-Protokoll einzuhalten?", "case": {"title": "Fall · Probenröstung für SCA-Cupping", "facts": ["Röstzeit 5:30", "Agtron ca. 75", "Gecuppt 2 Stunden nach der Röstung"], "cup": "Grasig, unausgewogen, schwer zu bewerten"}, "options": ["5–6 Min. rösten, Agtron ca. 75 (±1), 2–4 h nach Röstung cuppen", "12–15 Min. rösten, Agtron ca. 55 (±1), sofort nach Röstung cuppen", "8–12 Min. rösten, Agtron ca. 48 (±1), 2–3 Tage nach Röstung cuppen", "8–12 Min. rösten, Agtron ca. 63 (±1), 8–24 h nach Röstung cuppen"], "correct": 3, "explain": "Das SCA-Protokoll verlangt 8–12 Minuten Röstzeit, Agtron „Gourmet“ 63 ±1 und ein Cupping 8–24 Stunden nach der Röstung.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "kurve", "topic": "Fallstudie"}, {"id": "r3-11", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du?", "case": {"title": "Fall · El Salvador, Bourbon", "facts": ["Gas am Ende stark reduziert, um Zeit zu strecken", "Entwicklung 3:30 bei Drop 11:00 (32 %)", "RoR vor Drop nahe null"], "cup": "Flach, dumpf, Süße fehlt"}, "options": ["Gas am Ende noch weiter senken, um die Entwicklung zu verlängern", "Nicht strecken, mit fallender, positiver RoR zügig droppen", "Im Second Crack Gas nachlegen, Entwicklung beibehalten", "Charge-Temperatur senken, Gasführung am Ende gleich"], "correct": 1, "explain": "Rao warnt, dass ein absichtlich verlängertes Röstende meist gebackene Aromen erzeugt. Fällt die RoR auf null, stockt die Röstung und die Süße verschwindet.", "source": {"title": "Daily Coffee News – Baked Beans (Scott Rao)", "url": "https://dailycoffeenews.com/2019/02/13/baked-beans-observations-on-water-content-during-roasting"}, "img": "kurve", "topic": "Fallstudie"}, {"id": "r3-12", "mode": "roester", "level": 3, "type": "case", "q": "Was änderst du?", "case": {"title": "Fall · Röstbetrieb, Sicherheit", "facts": ["Abluftrohr seit Monaten nicht gereinigt", "Chaff-Reste
