e Leistung an und vermied so einen Stall, ohne röstige Noten. Rao meinte, auf einem Probat würde das wohl röstig schmecken.", "source": {"title": "Barista Hustle – Roasting Science: Three Perspectives on Air Roasting", "url": "https://www.baristahustle.com/?p=394746"}, "img": "trommel", "topic": "Fallstudie", "st": 9}, {"id": "r3-156", "mode": "roester", "level": 3, "type": "case", "q": "Wie bewertest du die CO-Werte?", "case": {"title": "Fall · CO-Messung am Röster", "facts": ["Schichtmittelwert CO etwa 12 ppm", "Kurzzeitspitzen am Röster bis etwa 260 ppm", "Röster hält das für unkritisch"]}, "options": ["Unkritisch, weil der Mittelwert unter 35 ppm liegt", "Nur der Mittelwert zählt, Spitzen sind unwichtig", "Mittelwert unter 35 ppm, Spitzen aber über 200 ppm", "Unkritisch, weil beim Rösten kein CO entsteht"], "correct": 2, "explain": "NIOSH nennt 35 ppm als Schichtmittelwert (REL) und 200 ppm als Obergrenze (Ceiling). In der Studie lagen die Mittelwerte darunter, Spitzen am Röster aber bei 203 und 267 ppm.", "source": {"title": "NIOSH HHE 2016-0144-3305 – Coffee roasting and packaging facility", "url": "https://www.cdc.gov/niosh/hhe/reports/pdfs/2016-0144-3305.pdf"}, "img": "trommel", "topic": "Fallstudie", "st": 8}, {"id": "r3-157", "mode": "roester", "level": 3, "type": "case", "q": "Wie viele volle Defekte ergeben sich, und welche Klasse ist möglich?", "case": {"title": "Fall · Green Grading nach SCAA", "facts": ["10 Bruchbohnen", "5 Floater", "5 Muschelbohnen (Shells)", "Keine Primärdefekte, Cupping sauber"]}, "options": ["20 volle Defekte, nur Exchange Grade", "4 volle Defekte, höchstens Premium", "10 volle Defekte, Below Standard", "4 volle Defekte, Specialty Grade möglich"], "correct": 3, "explain": "Nach SCAA entsprechen 5 Bruchbohnen, 5 Floater und 5 Shells je einem vollen Defekt: 2 + 1 + 1 = 4. Specialty Grade erlaubt bis 5 volle Defekte ohne Primärdefekte.", "source": {"title": "FAO – Coffee grading and defect classification", "url": "https://www.fao.org/4/X6939E/X6939e13.htm"}, "img": "sack", "topic": "Fallstudie", "st": 10}, {"id": "r3-158", "mode": "roester", "level": 3, "type": "case", "q": "Wie hoch ist das Schimmelrisiko?", "case": {"title": "Fall · Partie mit 0,80 aw", "facts": ["Messung beim Wareneingang: 0,80 aw", "Feuchte über 13 %", "Leicht muffiger Geruch"]}, "options": ["Hoch: Mykotoxinbildner sind ab etwa 0,78 aw möglich", "Gering: Schimmel wächst erst ab etwa 0,95 aw", "Gering: aw sagt über Schimmel nichts aus", "Mittel: nur Hefen, aber keine Schimmelpilze"], "correct": 0, "explain": "Laut Royal (AquaLab) beginnen Schimmel und Hefen ab etwa 0,61 aw, die Untergrenze für mykotoxinbildende Schimmel liegt bei 0,78 aw. Ochratoxin-Bildner sind dabei besonders kritisch.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part I: Moisture Content and Water Activity", "url": "https://royalcoffee.com/green-coffee-analytics-relevance-to-roasters-buyers-and-producers-part-i-moisture-content-and-total-water-activity/"}, "img": "sack", "topic": "Fallstudie", "st": 7}, {"id": "r3-159", "mode": "roester", "level": 3, "type": "case", "q": "Wie passt du die Ruhezeit an?", "case": {"title": "Fall · Schnellere Espresso-Röstung", "facts": ["Neues Profil 2 Minuten kürzer, gleiche Röstfarbe", "Gleiche Ruhezeit wie bisher"], "cup": "Espresso schäumt stärker, läuft unruhig"}, "options": ["Mehr Gas bei schneller Röstung, länger ruhen", "Weniger Gas bei schneller Röstung, kürzer ruhen", "Röstzeit ändert das Ausgasen gar nicht", "Gleiche Farbe heißt gleiche Gasmenge"], "correct": 0, "explain": "Smrke et al. fanden bei gleichem Röstgrad: Je schneller geröstet, desto mehr Gas wurde abgegeben, bei dunkler Röstung etwa 8,5 mg/g (langsam) gegenüber 11,9 mg/g (schnell).", "source": {"title": "Smrke et al. 2017 – Time-resolved gravimetric method to assess degassing of roasted coffee (ZHAW)", "url": "https://digitalcollection.zhaw.ch/bitstream/11475/12175/2/2017_Smrke-etal_Roasted-coffe-degassing-time-resolved-gravimetry.pdf"}, "img": "kurve", "topic": "Fallstudie", "st": 3}, {"id": "r3-160", "mode": "roester", "level": 3, "type": "case", "q": "Wie korrigierst du den Mahlgrad?", "case": {"title": "Fall · Cupping-Mahlgrad", "facts": ["Nur etwa 45 % des Mahlguts fallen durch Sieb #20", "Tassen wirken dünn und unterextrahiert"]}, "options": ["Gröber mahlen, bis 20–25 % durch Sieb #20 fallen", "Mahlgrad lassen, dafür 12 g statt 8,25 g nehmen", "Mahlgrad lassen, dafür 8 Minuten ziehen lassen", "Feiner mahlen, bis 70–75 % durch Sieb #20 fallen"], "correct": 3, "explain": "Das SCA-Protokoll verlangt, dass 70–75 % des Mahlguts durch ein US-Sieb #20 fallen. Dosis und Ziehzeit sind ebenfalls festgelegt und kein Ausgleich.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "sack", "topic": "Fallstudie", "st": 1}, {"id": "r3-161", "mode": "roester", "level": 3, "type": "case", "q": "Wie liegt die Probe im Vergleich zum SCA-Ziel?", "case": {"title": "Fall · Probenröstung im Labor", "facts": ["Farbmessgerät zeigt auf der Commercial-Skala 63", "Ziel laut SCA: Agtron Gourmet 63"]}, "options": ["Zu hell: Gourmet 63 entspricht etwa Commercial 48", "Genau im Ziel, beide Skalen sind identisch", "Zu dunkel: Gourmet 63 entspricht etwa Commercial 75", "Nicht bewertbar, Skalen sind nicht vergleichbar"], "correct": 0, "explain": "Das SCA-Protokoll nennt als Probenfarbe Agtron Gourmet 63 bzw. Agtron Commercial 48 (je ±1). Commercial 63 ist also deutlich heller als das Ziel.", "source": {"title": "SCA Cupping Protocols (via Royal Coffee, PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2025/03/14132346/Cupping-Protocols-Procedures.pdf"}, "img": "bohne", "topic": "Fallstudie", "st": 10}, {"id": "r3-162", "mode": "roester", "level": 3, "type": "case", "q": "Wie hoch ist der Gesamtverlust bis zur verkaufbaren Menge?", "case": {"title": "Fall · Kleine Chargen im Shop-Röster", "facts": ["Charge 2,5 kg Rohkaffee", "Röstverlust 13 %", "QC (Farbe und Cupping) braucht 200 g"]}, "options": ["Etwa 13 %", "Etwa 15 %", "Etwa 21 %", "Etwa 8 %"], "correct": 2, "explain": "2,5 kg × 0,87 = 2,175 kg Röstkaffee, minus 0,2 kg QC = 1,975 kg. Das sind etwa 21 % Gesamtverlust. Royal zeigt: Bei kleinen Chargen fällt der QC-Anteil stark ins Gewicht.", "source": {"title": "Royal Coffee – Understanding Roast Yield and Loss", "url": "https://royalcoffee.com/understanding-roast-yield-and-loss/"}, "img": "sack", "topic": "Fallstudie", "st": 6}, {"id": "r3-163", "mode": "roester", "level": 3, "type": "case", "q": "Wie schätzt du den späten Crash ein?", "case": {"title": "Fall · Sehr helle Nordic-Röstung", "facts": ["RoR fällt erst in den letzten 30 Sekunden vor dem Drop deutlich", "Sonst glatter, fallender Verlauf"]}, "options": ["Späte Crashs backen meist weniger, blind cuppen", "Jeder Crash backt die Röstung gleich stark", "Ein später Crash zeigt immer einen Flick an", "Späte Crashs kommen nur von defekten Fühlern"], "correct": 0, "explain": "Rao beobachtet Crashs häufig in den letzten 30 Sekunden, diese schmecken meist weniger gebacken als frühere. Ob es stört, klärt am besten ein Blind-Cupping.", "source": {"title": "Scott Rao – What is Baked Coffee?", "url": "https://scottrao.com/blog/2018/2/24/what-is-baked-coffee-most-pros-dont-know"}, "img": "kurve", "topic": "Fallstudie", "st": 3}, {"id": "r3-164", "mode": "roester", "level": 3, "type": "case", "q": "Welche Einstufung nach SCAA ist möglich?", "case": {"title": "Fall · Probenröstung, 100 g", "facts": ["Zwei Quakers in der Röstprobe", "Rohkaffee mit 3 vollen Defekten, keine Primärdefekte"]}, "options": ["Specialty: bis zu 5 Quakers sind dort erlaubt", "Nicht Specialty: dort sind keine Quakers erlaubt", "Specialty: Quakers zählen beim Grading nicht", "Below Standard: schon ein Quaker reicht dafür"], "correct": 1, "explain": "Specialty Grade verlangt null Quakers. Premium erlaubt bis 3 Quakers und bis 8 volle Defekte, die Probe passt also eher dorthin.", "source": {"title": "FAO – Coffee grading and defect classification", "url": "https://www.fao.org/4/X6939E/X6939e13.htm"}, "img": "bohne", "topic": "Fallstudie", "st": 8}, {"id": "r3-165", "mode": "roester", "level": 3, "type": "case", "q": "Was erklärt die Entwicklung am ehesten?", "case": {"title": "Fall · Partie seit 14 Monaten im Lager", "facts": ["aw 0,64", "Süße und Frische lassen von Röstung zu Röstung nach"], "cup": "Flach, leicht strohig"}, "options": ["Zunehmende Dichte, die mehr Röstenergie verlangt", "Alterung, u. a. Saccharose-Hydrolyse, bei hoher aw schneller", "Neubildung von Chlorogensäuren während der Lagerung", "Stetiger Anstieg des Koffeingehalts im Lager"], "correct": 1, "explain": "Royal (AquaLab) verbindet „Past Crop“-Geschmack teils mit der Hydrolyse von Saccharose zu Glukose. Eine höhere aw kann diese Aktivität anzeigen, über 0,60 altert Kaffee schneller.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part I: Moisture Content and Water Activity", "url": "https://royalcoffee.com/green-coffee-analytics-relevance-to-roasters-buyers-and-producers-part-i-moisture-content-and-total-water-activity/"}, "img": "sack", "topic": "Fallstudie", "st": 8}, {"id": "r3-166", "mode": "roester", "level": 3, "type": "case", "q": "Wie stabilisierst du die Rohkaffeetemperatur?", "case": {"title": "Fall · Lager ohne Klimatisierung", "facts": ["Rohkaffeelager mit großen Tag-Nacht-Schwankungen", "Röstungen derselben Partie schwanken", "Vollklimatisierung zu teuer"]}, "options": ["Ein temperiertes Zwischenlager bis zur Röstung", "Liner öffnen, damit sich die Partie anpasst", "Partien direkt neben dem heißen Röster lagern", "Partien grundsätzlich gefroren rösten"], "correct": 0, "explain": "Ist Klimatisierung des ganzen Lagers nicht möglich, empfiehlt Barista Hustle einen Zwischenraum („Mikroklima“) bis zur Röstung. Der Rohkaffee soll innen und außen gleich temperiert sein.", "source": {"title": "Barista Hustle – Storing Green Coffee", "url": "https://www.baristahustle.com/?p=437739"}, "img": "sack", "topic": "Fallstudie", "st": 4}, {"id": "r3-167", "mode": "roester", "level": 3, "type": "case", "q": "Was bedeutet die Überschreitung des Richtwerts?", "case": {"title": "Fall · Acrylamid-Befund", "facts": ["Laborwert Röstkaffee: 450 µg/kg", "Wert liegt über dem EU-Richtwert"]}, "options": ["Sofortiger Rückruf wegen akuter Gesundheitsgefahr", "Keine Bedeutung, Richtwerte gelten nur für Instant", "Kaffee darf nur noch als Instantkaffee verkauft werden", "Anlass, Minderungsmaßnahmen zu prüfen, keine sichere Gefahr"], "correct": 3, "explain": "Richtwerte zeigen, wie gut Minderungsmaßnahmen greifen. Laut Food Standards Agency bedeutet eine Überschreitung nicht zwingend ein Gesundheitsrisiko, die Behörde prüft aber, welche Maßnahmen ergriffen wurden.", "source": {"title": "Food Standards Agency – Acrylamide Survey 2023 (PDF)", "url": "https://www.food.gov.uk/sites/default/files/media/document/Acrylamide%20FSIS%202023%20-%20Clean%20%26%20Cleared.pdf"}, "img": "sack", "topic": "Fallstudie", "st": 9}, {"id": "r3-168", "mode": "roester", "level": 3, "type": "case", "q": "Was erwartest du und was tust du?", "case": {"title": "Fall · Neue Linie für aromatisierte Kaffees", "facts": ["Aromen werden in der Produktionshalle zugegeben", "Gleiche Halle wie Mahlen und Verpacken"]}, "options": ["Weniger Diacetyl, da Aromen die Röststoffe binden", "Keine Änderung, Diacetyl stammt nur aus der Röstung", "Mehr CO₂, daher nur einen CO₂-Melder ergänzen", "Mehr Diacetyl, Aromatisierung abtrennen und absaugen"], "correct": 3, "explain": "In Betrieben mit aromatisiertem Kaffee lagen Diacetyl und 2,3-Pentandion deutlich höher, am Aromatisierplatz am höchsten. Empfohlen werden lokale Absaugung und das Abtrennen von Aromatisieren, Mahlen und Verpacken.", "source": {"title": "LeBouf et al. 2020, Frontiers in Public Health – Diacetyl, 2,3-Pentanedione in Coffee Roasting Facilities", "url": "https://www.frontiersin.org/articles/10.3389/fpubh.2020.561740/pdf"}, "img": "sack", "topic": "Fallstudie", "st": 4}, {"id": "r3-169", "mode": "roester", "level": 3, "type": "case", "q": "Wie viel weniger Röstkaffee liefert Partie B?", "case": {"title": "Fall · Einkauf vergleicht zwei Partien", "facts": ["Gleicher Preis pro kg Rohkaffee", "Partie B verliert beim gleichen Röstgrad etwa 4 Prozentpunkte mehr", "Einkauf: je 1.000 kg"]}, "options": ["Etwa 40 kg", "Etwa 4 kg", "Etwa 400 kg", "Etwa 140 kg"], "correct": 0, "explain": "4 Prozentpunkte von 1.000 kg sind 40 kg weniger Röstkaffee. Royal rechnet ein ähnliches Beispiel: Ein feuchterer Sumatra verliert beim gleichen Röstgrad rund 4 % mehr als ein Kenia.", "source": {"title": "Royal Coffee – Understanding Roast Yield and Loss", "url": "https://royalcoffee.com/understanding-roast-yield-and-loss/"}, "img": "sack", "topic": "Fallstudie", "st": 6}, {"id": "r3-170", "mode": "roester", "level": 3, "type": "case", "q": "Welcher Fehler liegt eher vor?", "case": {"title": "Fall · Unterentwickelt oder gebacken?", "facts": ["RoR crasht im First Crack und läuft danach flach", "Bohnen brechen leicht", "Mahlgrad und Extraktion normal"], "cup": "Hohl, pappig, strohig"}, "options": ["Unterentwicklung im Kern", "Gebackene Röstung (Baking)", "Scorching an der Trommel", "Tipping an den Spitzen"], "correct": 1, "explain": "Barista Hustle beschreibt Baking als RoR-Crash im First Crack mit flacher Kurve danach, mit hohlen, pappigen oder strohigen Noten. Unterentwickelte Bohnen sind zäh, schwer zu extrahieren und schmecken grasig.", "source": {"title": "Barista Hustle – Underdevelopment vs. Baking", "url": "https://www.baristahustle.com/?p=474557"}, "img": "kurve", "topic": "Fallstudie", "st": 2}, {"id": "r3-171", "mode": "roester", "level": 3, "type": "case", "q": "Wie löst du das Kühlproblem?", "case": {"title": "Fall · Chargen verdoppelt", "facts": ["Chargengröße von 6 auf 12 kg erhöht", "Gleiches Kühlsieb, gleicher Ventilator", "Bohnen brauchen jetzt deutlich über 4 Minuten unter 40 °C"], "cup": "Weniger Süße und Aroma"}, "options": ["Bohnen länger im Röster lassen, damit sie gleichmäßig kühlen", "Chargengröße lassen, dafür etwas später droppen", "Kühlsieb abdecken, damit das Aroma drinbleibt", "Kühlleistung erhöhen, Luftmenge muss mit der Menge wachsen"], "correct": 3, "explain": "Für schnelles Kühlen nennt Barista Hustle etwa 4 m³ Luft pro kg Kaffee. Mehr Kaffee braucht also mehr Luft, sonst gehen Süße und Aroma verloren.", "source": {"title": "Barista Hustle – Roasting Science RS 4.13: Cooling", "url": "https://baristahustle.com/?p=465630"}, "img": "trommel", "topic": "Fallstudie", "st": 4}, {"id": "r3-172", "mode": "roester", "level": 3, "type": "case", "q": "Warum ist das Mahlgut so viel heller?", "case": {"title": "Fall · Sehr schnelle Röstung", "facts": ["Drop nach 7:30 bei hoher Lufttemperatur", "Bohne außen mittel, Mahlgut deutlich heller"], "cup": "Röstig und zugleich grün"}, "options": ["Bei schnellen Röstungen wird der Kern heißer als außen", "Bei schnellen, heißen Röstungen hinkt der Kern stärker nach", "Die Röstzeit hat auf Kern und Oberfläche keinen Einfluss", "Das Mahlgut wirkt immer heller, das ist kein Hinweis"], "correct": 1, "explain": "Schenker (2000) maß mit Fühlern in der Bohne: Der Unterschied zwischen Kern und Bohnenbett war bei schnellen, heißen Röstungen größer. Bei langsamer Röstung holte der Kern etwa zur Hälfte auf.", "source": {"title": "Barista Hustle – Roasting Science: The Evaporation Front", "url": "https://www.baristahustle.com/?p=409922"}, "img": "bohne", "topic": "Fallstudie", "st": 5}, {"id": "r3-173", "mode": "roester", "level": 3, "type": "case", "q": "Was hat diese Partie wahrscheinlich geschädigt?", "case": {"title": "Fall · Sehr trockene Partie", "facts": ["Feuchte 8,3 %, aw 0,42", "Bohnen blass, viele Bruchstücke"], "cup": "Flach, holzig"}, "options": ["Zu kurze Lagerung, die sich durch Ruhe von selbst behebt", "Übertrocknung, die Farbe und Geschmack dauerhaft schädigt", "Zu hohe Dichte, die einfach mehr Röstenergie verlangt", "Zu viel Saccharose, die beim Rösten karamellisiert"], "correct": 1, "explain": "Übertrocknung kann Farbe und Geschmack dauerhaft schädigen. Pergamentkaffee unter 9–10 % bricht leichter beim Schälen. Die ICO verlangt für Export mindestens 8,0 % Feuchte.", "source": {"title": "Barista Hustle – Roasting Science RS 2.02: Moisture Content", "url": "https://www.baristahustle.com/?p=399889"}, "img": "sack", "topic": "Fallstudie", "st": 5}, {"id": "r3-174", "mode": "roester", "level": 3, "type": "case", "q": "Wo ist bei dieser Partie etwas schiefgelaufen?", "case": {"title": "Fall · Viele leichte Bohnen in der Partie", "facts": ["Auffällig viele hohle, leichte Bohnen und Bruch", "Röstbild sehr ungleichmäßig", "Mühle mit wechselnder Sortierqualität"]}, "options": ["Zu hohe Trommeldrehzahl beim Rösten in der Rösterei", "Schlecht eingestellte Dichtesortierung in der Trockenmühle", "Zu lange Ruhezeit nach dem Rösten vor dem Versand", "Zu kalkhaltiges Wasser beim Cupping der Probe"], "correct": 1, "explain": "In der Trockenmühle trennen vibrierende, schräge Dichtetische leichte Bohnen, Bruch und Schalen ab. Schlecht kalibrierte Tische führen laut Royal zu hohen Defektzahlen, schlechterer Tasse und Röstproblemen.", "source": {"title": "Royal Coffee – Green Coffee Analytics Part IV: Density", "url": "https://royalcoffee.com/green-coffee-analytics-part-iv-density/"}, "img": "sack", "topic": "Fallstudie", "st": 5}, {"id": "a1-01", "mode": "anbau", "level": 1, "type": "mc", "q": "Zu welcher Pflanzenfamilie gehört die Kaffeepflanze?", "options": ["Nachtschattengewächse (Solanaceae)", "Lorbeergewächse (Lauraceae)", "Hülsenfrüchtler (Fabaceae)", "Rötegewächse (Rubiaceae)"], "correct": 3, "explain": "Coffea gehört zu den Rötegewächsen (Rubiaceae), einer großen, vor allem tropischen Pflanzenfamilie.", "source": {"title": "NParks Flora & Fauna Web – Coffea arabica", "url": "https://www.nparks.gov.sg/florafaunaweb/flora/4/8/4860"}, "img": "pflanze", "topic": "Botanik", "st": 4}, {"id": "a1-02", "mode": "anbau", "level": 1, "type": "mc", "q": "Aus welchem Land stammt Coffea arabica ursprünglich – dort, wo bis heute die größte genetische Vielfalt der Art zu finden ist?", "options": ["Äthiopien", "Brasilien", "Jemen", "Indonesien"], "correct": 0, "explain": "Arabica ist in Äthiopien heimisch, wo die größte genetische Vielfalt der Art liegt. Von dort gelangten Samen in den Jemen, wo der Anbau begann.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "berg", "topic": "Herkunft", "st": 1}, {"id": "a1-03", "mode": "anbau", "level": 1, "type": "mc", "q": "Wo liegt der sogenannte „Kaffeegürtel“ (Bean Belt), in dem Kaffee angebaut wird?", "options": ["Zwischen dem nördlichen Wendekreis und dem Polarkreis", "Zwischen dem 30. und dem 45. nördlichen Breitengrad", "Zwischen dem nördlichen und dem südlichen Wendekreis", "Zwischen dem südlichen Wendekreis und 45° südlicher Breite"], "correct": 2, "explain": "Kaffee wächst im Gebiet zwischen dem Wendekreis des Krebses und dem Wendekreis des Steinbocks – also in den Tropen.", "source": {"title": "Carbon Brief – Commodity profile: Coffee", "url": "https://interactive.carbonbrief.org/commodity-profile-coffee/"}, "img": "sonne", "topic": "Klima & Standort", "st": 2}, {"id": "a1-04", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie viele Samen (spätere Kaffeebohnen) enthält eine normal entwickelte Kaffeekirsche?", "options": ["Einen", "Zwei", "Drei", "Vier"], "correct": 1, "explain": "Die Kaffeekirsche ist normalerweise zweisamig; reife Kirschen färben sich von grün über gelb zu tiefrot.", "source": {"title": "NC State Extension Plant Toolbox – Coffea arabica", "url": "https://plants.ces.ncsu.edu/plants/coffea-arabica/common-name/arabian-coffee/"}, "img": "kirsche", "topic": "Botanik", "st": 1}, {"id": "a1-05", "mode": "anbau", "level": 1, "type": "mc", "q": "Was ist ein „Peaberry“ (Perlbohne)?", "options": ["Eine besonders große Bohne der Varietät Maragogipe", "Eine Kirsche, in der sich nur ein Samen entwickelt hat", "Eine Bohne, die vom Kirschenkäfer angebohrt wurde", "Eine unreif gepflückte Kirsche mit noch grüner Fruchthaut"], "correct": 1, "explain": "Beim Peaberry entwickelt sich nur einer der beiden Samen; der verbleibende ist rundlich statt flach.", "source": {"title": "Sweet Maria's Coffee Library – Arabica Coffee Cherry Cross Section", "url": "https://library.sweetmarias.com/arabica-coffee-cherry-cross-section/"}, "img": "kirsche", "topic": "Botanik", "st": 6}, {"id": "a1-06", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Kaffeeart enthält im Rohkaffee typischerweise deutlich mehr Koffein?", "options": ["Arabica, etwa doppelt so viel wie Robusta", "Beide etwa gleich viel, der Unterschied ist gering", "Liberica, etwa dreimal so viel wie Arabica", "Robusta, etwa doppelt so viel wie Arabica"], "correct": 3, "explain": "Samen von C. canephora enthalten rund 2,5 % Koffein (Trockenmasse), Arabica etwa 1,2 % – also mehr als doppelt so viel.", "source": {"title": "Priolli et al. (2008), Genetics and Molecular Biology – Caffeine inheritance in C. arabica x C. canephora hybrids", "url": "https://old.scielo.br/j/gmb/a/v8zCVxyGtvDvwmK5JGhnjfg/?lang=en"}, "img": "kirsche", "topic": "Arten & Sorten", "st": 2}, {"id": "a1-07", "mode": "anbau", "level": 1, "type": "mc", "q": "Was passiert bei der natürlichen Aufbereitung („Natural“ / Trockenaufbereitung)?", "options": ["Die ganze Kirsche wird mitsamt Fruchtfleisch getrocknet", "Das Fruchtfleisch wird entfernt und die Bohne gewaschen", "Die Kirsche wird entpulpt, der Fruchtschleim bleibt dran", "Die Bohne wird noch feucht geschält und dann getrocknet"], "correct": 0, "explain": "Bei Naturals trocknen die ganzen Kirschen in der Sonne; erst danach werden Haut und getrocknetes Fruchtfleisch maschinell entfernt.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "trocknung", "topic": "Aufbereitung", "st": 2}, {"id": "a1-08", "mode": "anbau", "level": 1, "type": "mc", "q": "Warum heißt der „Honey Process“ so?", "options": ["Weil zur Fermentation etwas Honig zugegeben wird", "Weil der Kaffee in der Tasse stark nach Honig schmeckt", "Weil die Bohnen nach der Röstung honiggolden sind", "Weil der klebrige Fruchtschleim an der Bohne bleibt"], "correct": 3, "explain": "Beim Honey Process wird die Haut entfernt, ein Teil des klebrigen Fruchtschleims (Mucilage) bleibt beim Trocknen dran – Honig ist nicht im Spiel.", "source": {"title": "Sprudge – What Is Honey Processed Coffee?", "url": "https://sprudge.com/what-is-honey-processed-coffee-184876.html"}, "img": "trocknung", "topic": "Aufbereitung", "st": 6}, {"id": "a1-09", "mode": "anbau", "level": 1, "type": "mc", "q": "Was bedeutet selektive Handernte (selective picking)?", "options": ["Alle Kirschen eines Zweigs werden auf einmal abgestreift", "Die Kirschen werden nach Varietät getrennt gepflückt", "Nur reife Kirschen werden in mehreren Durchgängen gepflückt", "Nur heruntergefallene Kirschen werden vom Boden aufgesammelt"], "correct": 2, "explain": "Beim selektiven Pflücken gehen die Pflücker alle 8–10 Tage erneut durch die Reihen und ernten nur die reifen Kirschen.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 2}, {"id": "a1-10", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie lange dauert es nach dem Pflanzen ungefähr, bis ein Kaffeebaum erstmals Früchte trägt?", "options": ["Etwa 3–4 Jahre", "Etwa 1 Jahr", "Etwa 7–8 Jahre", "Etwa 10–12 Jahre"], "correct": 0, "explain": "Je nach Varietät tragen Kaffeebäume etwa 3–4 Jahre nach der Pflanzung erstmals Früchte.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "pflanze", "topic": "Blüte & Ernte", "st": 4}, {"id": "a1-11", "mode": "anbau", "level": 1, "type": "mc", "q": "Welches Land ist mit großem Abstand der größte Kaffeeproduzent der Welt?", "options": ["Brasilien", "Kolumbien", "Äthiopien", "Vietnam"], "correct": 0, "explain": "Brasilien liefert laut USDA knapp 40 % der Weltproduktion und beeinflusst damit Angebot und Preise stark.", "source": {"title": "USDA FAS – Coffee: World Markets and Trade (Juli 2026)", "url": "https://apps.fas.usda.gov/psdonline/circulars/2026/07/coffee.pdf"}, "img": "berg", "topic": "Herkunft", "st": 1}, {"id": "a1-12", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie sehen die Blüten der Arabica-Pflanze aus?", "options": ["Zartrosa, glockenförmig und süßlich duftend", "Gelblich, röhrenförmig und kaum duftend", "Weiß, sternförmig und jasminartig duftend", "Hellgrün, unscheinbar und geruchlos"], "correct": 2, "explain": "Arabica blüht weiß mit sternförmigen, stark duftenden Blüten, deren Duft an Jasmin erinnert; sie sitzen gebüschelt in den Blattachseln.", "source": {"title": "NC State Extension Plant Toolbox – Coffea arabica", "url": "https://plants.ces.ncsu.edu/plants/coffea-arabica/common-name/arabian-coffee/"}, "img": "bluete", "topic": "Botanik", "st": 2}, {"id": "a1-13", "mode": "anbau", "level": 1, "type": "mc", "q": "Welcher botanische Artname steht hinter dem Handelsnamen „Robusta“?", "options": ["Coffea arabica", "Coffea liberica", "Coffea stenophylla", "Coffea canephora"], "correct": 3, "explain": "Robusta ist der Handelsname für Coffea canephora, die zweite große Kulturart neben Arabica.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 3}, {"id": "a1-14", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Kaffeeart stammt aus den Tieflandwäldern des Kongobeckens und wächst eher in warmen, tiefen Lagen?", "options": ["Eugenioides (C. eugenioides)", "Arabica (C. arabica)", "Robusta (C. canephora)", "Mauritiana (C. mauritiana)"], "correct": 2, "explain": "C. canephora stammt aus den Tieflandwäldern West- und Zentralafrikas, etwa dem Kongobecken; Arabica dagegen aus den Bergwäldern Äthiopiens.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "berg", "topic": "Klima & Standort", "st": 5}, {"id": "a1-15", "mode": "anbau", "level": 1, "type": "mc", "q": "Woran erkennt man Kaffeerost an der Pflanze?", "options": ["An orangefarbenem Sporenpulver auf der Blattunterseite", "An schwarzen, eingesunkenen Flecken auf grünen Kirschen", "An weißem, mehligem Belag auf der Blattoberseite", "An braunen, runden Flecken mit hellem Rand auf Blättern"], "correct": 0, "explain": "Zuerst erscheinen kleine hellgelbe Flecken auf der Blattoberseite, dann bilden sich orange Sporenmassen auf der Blattunterseite.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 6}, {"id": "a1-16", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Kaffeeart macht laut ICO den größeren Teil der weltweiten Rohkaffee-Exporte aus?", "options": ["Robusta, rund 60 %", "Liberica, rund 55 %", "Robusta, rund 75 %", "Arabica, rund 60 %"], "correct": 3, "explain": "Arabica stellt rund 60 % der Rohkaffee-Exporte (ICO: 59,7–63 % in den letzten Erhebungen), Robusta den Großteil des Rests.", "source": {"title": "ICO – Coffee Market Report April 2025", "url": "https://www.ico.org/documents/cy2024-25/cmr-0425-e.pdf"}, "img": "kirsche", "topic": "Arten & Sorten", "st": 4}, {"id": "a1-17", "mode": "anbau", "level": 1, "type": "mc", "q": "In welcher Sackgröße rechnet die Internationale Kaffeeorganisation (ICO) Produktion und Handel?", "options": ["30-kg-Säcke", "60-kg-Säcke", "50-kg-Säcke", "100-kg-Säcke"], "correct": 1, "explain": "Die ICO gibt Produktion, Exporte und Lagerbestände in „60-kg bags“ an – der klassische Jutesack ist die Standard-Statistikeinheit.", "source": {"title": "ICO – Coffee Market Report April 2025", "url": "https://www.ico.org/documents/cy2024-25/cmr-0425-e.pdf"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 3}, {"id": "a1-18", "mode": "anbau", "level": 1, "type": "mc", "q": "Was ist das „Pergament“ (Parchment) einer Kaffeebohne?", "options": ["Die rote Fruchthaut (Exokarp) der Kirsche", "Die Schleimschicht (Mesokarp) unter der Haut", "Die verholzte Hülle (Endokarp) um den Samen", "Das dünne Silberhäutchen direkt am Samen"], "correct": 2, "explain": "Die Fruchtwand besteht aus Haut (Exokarp), Fruchtfleisch (Mesokarp) und dem harten, verholzten Endokarp – dem Pergament.", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Botanik", "st": 6}, {"id": "a1-19", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie heißt das dünne Häutchen, das direkt auf der Bohne sitzt und beim Rösten als „Chaff“ abfällt?", "options": ["Fruchtfleisch", "Pergamenthäutchen", "Silberhäutchen", "Fruchtschleim"], "correct": 2, "explain": "Das Silberhäutchen ist eine dünne Restschicht des Perisperms, die bei der Reife um die Bohne übrig bleibt.", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Botanik", "st": 4}, {"id": "a1-20", "mode": "anbau", "level": 1, "type": "mc", "q": "Welches Wetterereignis kann Kaffeebäume nicht nur schädigen, sondern komplett absterben lassen?", "options": ["Hagel", "Starkregen", "Frost", "Dauerregen"], "correct": 2, "explain": "Arabica und Robusta sind sehr frostempfindlich; Frost schädigt den Baum leicht und kann ihn vollständig abtöten.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "sonne", "topic": "Klima & Standort", "st": 1}, {"id": "a1-21", "mode": "anbau", "level": 1, "type": "mc", "q": "Die Varietät Geisha wurde durch Auktionsrekorde in Panama berühmt. Wo wurde sie ursprünglich gesammelt?", "options": ["In Jamaika", "Im Jemen", "In Äthiopien", "In Indonesien"], "correct": 2, "explain": "Geisha wurde in den 1930er-Jahren in äthiopischen Kaffeewäldern gesammelt und kam über Tansania und CATIE (Costa Rica) nach Panama.", "source": {"title": "World Coffee Research – Varietätenkatalog: Geisha (Panama)", "url": "https://varieties.worldcoffeeresearch.org/varieties/geisha-panama"}, "img": "bluete", "topic": "Arten & Sorten", "st": 4}, {"id": "a1-22", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ist Grundvoraussetzung für das Smithsonian-Siegel „Bird Friendly“?", "options": ["Fairtrade-Siegel plus Verzicht auf maschinelle Ernte", "Mindestpreis plus Anbau in Höhenlagen über 1.500 m", "Rainforest-Siegel plus Nistkästen auf jeder einzelnen Parzelle", "Bio-Zertifizierung plus vielfältiger Schattenbaumbestand"], "correct": 3, "explain": "Bird Friendly setzt eine Bio-Zertifizierung voraus; dazu kommen strenge Schattenkriterien, u. a. mindestens 40 % Kronendach und ein Hauptkronendach von mindestens 12 m.", "source": {"title": "Smithsonian Migratory Bird Center – Bird Friendly Coffee Norms", "url": "https://nationalzoo.si.edu/sites/default/files/documents/bf_norms_english_accessible.pdf"}, "img": "sonne", "topic": "Herkunft", "st": 6}, {"id": "a1-23", "mode": "anbau", "level": 1, "type": "mc", "q": "Wozu dient der Fairtrade-Mindestpreis für Kaffee?", "options": ["Er legt fest, wie teuer eine Tasse im Café sein muss", "Er dient als Sicherheitsnetz bei stark fallendem Marktpreis", "Er garantiert dem Käufer eine bestimmte, geprüfte Tassenqualität", "Er gleicht Ernteausfälle nach Frost oder Dürre aus"], "correct": 1, "explain": "Der Mindestpreis wirkt als Untergrenze, wenn der Marktpreis fällt; zusätzlich gibt es die Fairtrade-Prämie, über deren Verwendung die Bauern gemeinsam entscheiden.", "source": {"title": "Fairtrade International – High coffee prices and Fairtrade value", "url": "https://www.fairtrade.net/en/get-involved/news/high-coffee-prices-and-fairtrade-value.html"}, "img": "berg", "topic": "Herkunft", "st": 10}, {"id": "a1-24", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie entfernt ein optischer Farbsortierer fehlerhafte Rohkaffeebohnen?", "options": ["Mit einem gezielten Druckluftstoß", "Mit einem gezielten Wasserstrahl", "Mit einem Rüttelsieb nach Größe", "Mit einem Magnetfeld unter dem Band"], "correct": 0, "explain": "Die Bohnen fallen einzeln an Sensoren vorbei, die Defekte an der Farbe erkennen; ein kurzer Druckluftstoß schießt fehlerhafte Bohnen aus.", "source": {"title": "Coffee Review – Cleaning and Sorting", "url": "https://www.coffeereview.com/coffee-reference/from-crop-to-cup/processing/cleaning-and-sorting"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 10}, {"id": "a1-25", "mode": "anbau", "level": 1, "type": "mc", "q": "Was passiert beim „Strip Picking“?", "options": ["Nur die reifen Kirschen werden einzeln abgepflückt", "Die Blätter werden vor der Ernte vollständig vom Zweig gestreift", "Nur heruntergefallene Kirschen werden aufgesammelt", "Alle Kirschen eines Zweigs werden auf einmal abgestreift"], "correct": 3, "explain": "Beim Strip Picking werden alle Kirschen eines Zweigs in einem Zug abgestreift; im Gegensatz zur selektiven Ernte landen auch unreife Kirschen im Korb.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 6}, {"id": "a1-26", "mode": "anbau", "level": 1, "type": "mc", "q": "In welchem Land setzen große Farmen auf flachen, riesigen Feldern häufig Erntemaschinen ein?", "options": ["Brasilien", "Jemen", "Ruanda", "Äthiopien"], "correct": 0, "explain": "In den meisten Ländern wird von Hand geerntet; in Brasilien mit flachem Gelände und großen Flächen nutzen größere Farmen auch Maschinen.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 3}, {"id": "a1-27", "mode": "anbau", "level": 1, "type": "mc", "q": "Aus welcher Region stammt die wilde Kaffeeart Coffea liberica?", "options": ["Aus Westafrika", "Aus Südostasien", "Aus Madagaskar", "Aus Mittelamerika"], "correct": 0, "explain": "Wilde Liberica wächst nur in Waldgebieten weniger westafrikanischer Länder; angebaut wird sie heute vor allem in Malaysia, auf den Philippinen und in Liberia.", "source": {"title": "SCA 25 Magazine – Beyond Arabica and Robusta: Liberica and Excelsa", "url": "https://sca.coffee/sca-news/25/issue-25-insight-liberica-excelsa"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 8}, {"id": "a1-28", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie wächst Arabica in ihrer Heimat, den Bergwäldern Äthiopiens, von Natur aus?", "options": ["Als Kletterpflanze an den Stämmen und Ästen hoher Bäume", "Als Bodendecker auf feuchten, sonnigen Lichtungen", "Als Strauch im Unterholz, im Schatten höherer Bäume", "Als freistehender Baum in offener Grassavanne"], "correct": 2, "explain": "Arabica ist in tropischen Bergwäldern Äthiopiens heimisch und wuchs dort als Strauch im Unterholz.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "sonne", "topic": "Klima & Standort", "st": 7}, {"id": "a1-29", "mode": "anbau", "level": 1, "type": "mc", "q": "Ab welcher Punktzahl galt ein Kaffee im klassischen 100-Punkte-Cupping-Schema der SCA als „Specialty“?", "options": ["Ab 80 Punkten", "Ab 70 Punkten", "Ab 75 Punkten", "Ab 85 Punkten"], "correct": 0, "explain": "Im klassischen SCA(A)-Bewertungsbogen galt ein Kaffee ab 80 Punkten als Specialty. Inzwischen setzt die SCA auf das neue Coffee Value Assessment (CVA).", "source": {"title": "Royal Coffee – Scoring Specialty Coffee: What Do the Numbers Mean?", "url": "https://royalcoffee.com/scoring-specialty-coffee-what-do-the-numbers-mean/"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 9}, {"id": "a1-30", "mode": "anbau", "level": 1, "type": "mc", "q": "Wofür steht die Bezeichnung „AA“ bei kenianischem Kaffee?", "options": ["Für die größte Bohnengröße", "Für die höchste Anbaulage", "Für die beste Cupping-Note", "Für die geringste Defektzahl"], "correct": 0, "explain": "Kenias Grades beruhen allein auf der Siebgröße: AA sind die größten Bohnen (Sieb 17/18), AB eine Stufe kleiner. Ein Geschmacksurteil ist das nicht.", "source": {"title": "TYPICA – Is Screen Size a Quality Indicator? Tips for Sourcing Kenyan Coffee", "url": "https://typica.coffee/en/https-typica-coffee-ja-screen-size-kenya/"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 4}, {"id": "a2-01", "mode": "anbau", "level": 2, "type": "mc", "q": "Wodurch wird Kaffeerost (Coffee Leaf Rust) verursacht?", "options": ["Durch das Bakterium Xylella fastidiosa", "Durch den Pilz Colletotrichum kahawae", "Durch den Pilz Hemileia vastatrix", "Durch den Pilz Fusarium xylarioides"], "correct": 2, "explain": "Kaffeerost ist eine Pilzkrankheit (Hemileia vastatrix). Sie führt zu Blattfall und kann in schweren Fällen 35 % bis über 75 % Ertragsverlust bringen.", "source": {"title": "World Coffee Research – Coffee leaf rust knows no borders (2025)", "url": "https://worldcoffeeresearch.org/news/2025/coffee-leaf-rust-knows-no-borders-neither-does-coffee-science"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 1}, {"id": "a2-02", "mode": "anbau", "level": 2, "type": "case", "q": "Du findest Kirschen mit einem winzigen Bohrloch am Blütenansatz; innen ist der Samen zerfressen. Wer steckt dahinter?", "options": ["Die Antestia-Wanze", "Die Kaffee-Blattminiermotte", "Der Kaffeestammbohrer", "Der Kaffeekirschenkäfer"], "correct": 3, "explain": "Das Weibchen des Kaffeekirschenkäfers bohrt sich meist am Blütenansatz in die Kirsche und legt Brutgänge an; die Larven fressen den Samen.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 2}, {"id": "a2-03", "mode": "anbau", "level": 2, "type": "mc", "q": "In welchem Bereich liegt die als ideal geltende Jahresmitteltemperatur für Arabica?", "options": ["Etwa 18–21 °C", "Etwa 13–16 °C", "Etwa 23–26 °C", "Etwa 27–30 °C"], "correct": 0, "explain": "Für Arabica gilt eine Jahresmitteltemperatur von etwa 18–21 °C als optimal; über 23 °C reifen die Früchte zu schnell, was oft Qualität kostet.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "sonne", "topic": "Klima & Standort", "st": 1}, {"id": "a2-04", "mode": "anbau", "level": 2, "type": "case", "q": "Nach dem Rösten fallen einzelne auffallend helle Bohnen auf, sogenannte Quaker. Was steckt dahinter?", "options": ["Überfermentierte Samen mit abgebautem Zuckergehalt", "Beigemischte Robusta-Bohnen mit hellerer Röstfarbe", "Zu feuchte Bohnen, die in der Röstung nicht bräunen", "Unreife Samen, denen Zucker für die Bräunung fehlt"], "correct": 3, "explain": "Quaker sind unreife Samen ohne die passenden Zucker für die Maillard-Reaktion, deshalb bräunen sie kaum. Im Rohkaffee sind sie meist nicht zu erkennen.", "source": {"title": "Barista Hustle – The End of Quakers? (2022)", "url": "https://www.baristahustle.com/?p=410933"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 2}, {"id": "a2-05", "mode": "anbau", "level": 2, "type": "mc", "q": "Was löst bei Kaffee typischerweise die Hauptblüte aus?", "options": ["Eine längere Hitzeperiode", "Starker Rückschnitt der Zweige", "Regen nach einer Trockenphase", "Eine kräftige Stickstoffdüngung"], "correct": 2, "explain": "Kaffee braucht eine Phase mit Wassermangel und anschließenden Regen, damit die ruhenden Blütenknospen aufbrechen; eine Trockenzeit von 2–4 Monaten fördert die Blüte.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol.", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "bluete", "topic": "Blüte & Ernte", "st": 1}, {"id": "a2-06", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie lange brauchen Arabica-Früchte ungefähr von der Blüte bis zur Reife?", "options": ["Etwa 2–3 Monate", "Etwa 12–15 Monate", "Etwa 18–24 Monate", "Etwa 6–9 Monate"], "correct": 3, "explain": "Arabica braucht je nach Lage und Quelle etwa 6–9 Monate bis zur Reife, Robusta (C. canephora) meist deutlich länger.", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 1}, {"id": "a2-07", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ist die Varietät Caturra?", "options": ["Eine natürliche Kreuzung aus Arabica und Robusta", "Eine natürliche Zwergmutation von Bourbon aus Brasilien", "Eine wilde Landrasse aus den Wäldern Äthiopiens", "Eine natürliche Zwergmutation von Typica von der Insel Java"], "correct": 1, "explain": "Caturra entstand als natürliche Mutation von Bourbon in Minas Gerais (Brasilien); ein einzelnes Gen macht die Pflanze kompakt.", "source": {"title": "World Coffee Research – Varietätenkatalog: Caturra", "url": "https://varieties.worldcoffeeresearch.org/varieties/caturra"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 5}, {"id": "a2-08", "mode": "anbau", "level": 2, "type": "mc", "q": "Aus welchen Eltern wurde die Varietät Catuaí gezüchtet?", "options": ["Typica × Bourbon", "Pacas × Maragogipe", "Timor-Hybrid × Villa Sarchi", "Mundo Novo × Caturra"], "correct": 3, "explain": "Catuaí ist eine Kreuzung aus dem ertragreichen Mundo Novo und dem kompakten Caturra, gezüchtet vom IAC in Campinas, Brasilien.", "source": {"title": "World Coffee Research – Varietätenkatalog: Catuai", "url": "https://varieties.worldcoffeeresearch.org/varieties/catuai"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 3}, {"id": "a2-09", "mode": "anbau", "level": 2, "type": "mc", "q": "Woher hat die Varietät Bourbon ihren Namen?", "options": ["Vom Händler, der sie als Erster nach Brasilien brachte", "Von der Insel Bourbon, dem heutigen La Réunion", "Von einer Plantage im Hochland des Jemen", "Vom Botaniker, der sie zuerst beschrieben hat"], "correct": 1, "explain": "Französische Missionare brachten die Pflanzen Anfang des 18. Jh. aus dem Jemen auf die Insel Bourbon (heute La Réunion), die der Varietät den Namen gab.", "source": {"title": "World Coffee Research – Varietätenkatalog: Bourbon", "url": "https://varieties.worldcoffeeresearch.org/varieties/bourbon"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 2}, {"id": "a2-10", "mode": "anbau", "level": 2, "type": "mc", "q": "Wozu dient die Fermentation bei der gewaschenen Aufbereitung (Washed)?", "options": ["Um den Koffeingehalt der Bohnen deutlich zu senken", "Um Bitterstoffe aus den Bohnen ins Waschwasser zu ziehen", "Um den Fruchtschleim zu lösen, damit er abwaschbar wird", "Um das Pergament zu erweichen, damit es abfällt"], "correct": 2, "explain": "Nach dem Entpulpen lösen Enzyme und Mikroorganismen den klebrigen Fruchtschleim, anschließend wird er abgewaschen und der Pergamentkaffee getrocknet.", "source": {"title": "Coffee Review – Processing Coffee: Fruit Removal and Drying", "url": "https://www.coffeereview.com/?p=5562"}, "img": "trocknung", "topic": "Aufbereitung", "st": 2}, {"id": "a2-11", "mode": "anbau", "level": 2, "type": "case", "q": "Du kippst frisch geerntete Kirschen ins Wasserbecken; einige schwimmen oben. Was tust du?", "options": ["Behalten und zur besten Partie geben, sie sind am reifsten", "Abschöpfen und getrennt halten, da sie oft mangelhaft sind", "Untertauchen, bis sie absinken, und dann normal verarbeiten", "Mit den anderen mischen, da Schwimmen nichts aussagt"], "correct": 1, "explain": "Beim Floaten treiben vertrocknete, insektenbefallene, schlecht entwickelte und leichte Kirschen auf und werden abgetrennt; reife Kirschen sinken.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Aufbereitung", "st": 2}, {"id": "a2-12", "mode": "anbau", "level": 2, "type": "mc", "q": "Auf welche Restfeuchte wird Pergamentkaffee üblicherweise getrocknet, damit er lagerstabil ist?", "options": ["Etwa 6–8 %", "Etwa 14–16 %", "Etwa 10–12 %", "Etwa 18–20 %"], "correct": 2, "explain": "Ziel ist ein stabiler Bereich von etwa 10–12 % Feuchte (Nassbasis); zu feuchter Kaffee ist nicht lagerstabil.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 1}, {"id": "a2-13", "mode": "anbau", "level": 2, "type": "mc", "q": "Welche Honey-Stufe behält beim Trocknen am meisten Fruchtschleim (Mucilage) an der Bohne?", "options": ["White Honey", "Black Honey", "Yellow Honey", "Red Honey"], "correct": 1, "explain": "Je dunkler die Farbbezeichnung, desto mehr Mucilage bleibt beim Trocknen an der Bohne – Black Honey behält am meisten.", "source": {"title": "Sprudge – What Is Honey Processed Coffee?", "url": "https://sprudge.com/what-is-honey-processed-coffee-184876.html"}, "img": "trocknung", "topic": "Aufbereitung", "st": 1}, {"id": "a2-14", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie wird die Kaffeekirsche botanisch eingeordnet?", "options": ["Als Kapselfrucht (Capsula)", "Als Steinfrucht (Drupe)", "Als Nussfrucht (Nux)", "Als Hülsenfrucht (Legumen)"], "correct": 1, "explain": "Die Kaffeekirsche ist eine Steinfrucht: fleischiges Mesokarp um ein verholztes Endokarp (das Pergament).", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Botanik", "st": 1}, {"id": "a2-15", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie ist die brasilianische Varietät Mundo Novo entstanden?", "options": ["Als Kreuzung von Caturra und dem Timor-Hybrid", "Als natürliche Kreuzung von Typica und Bourbon", "Als natürliche Kreuzung von Arabica und Liberica", "Als natürliche Zwergmutation von Bourbon"], "correct": 1, "explain": "Mundo Novo ist eine natürliche Kreuzung aus Bourbon und Typica, entdeckt 1943 in São Paulo und vom IAC selektiert.", "source": {"title": "World Coffee Research – Varietätenkatalog: Mundo Novo", "url": "https://varieties.worldcoffeeresearch.org/varieties/mundo-novo"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 4}, {"id": "a2-16", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ist typisch für die Varietät Maragogipe?", "options": ["Gelbe Kirschen, als Mutation von Bourbon", "Sehr kleine Bohnen, als Zwergmutation von Bourbon", "Hohe Rostresistenz, als Kreuzung mit Robusta", "Sehr große Bohnen, als Mutation von Typica"], "correct": 3, "explain": "Maragogipe ist eine natürliche Typica-Mutation, 1870 nahe der brasilianischen Stadt Maragogipe entdeckt, mit sehr großen Bohnen.", "source": {"title": "World Coffee Research – Varietätenkatalog: Maragogipe", "url": "https://varieties.worldcoffeeresearch.org/varieties/maragogipe"}, "img": "kirsche", "topic": "Arten & Sorten", "st": 4}, {"id": "a2-17", "mode": "anbau", "level": 2, "type": "mc", "q": "Welche Eigenschaft war das Hauptziel bei der Züchtung der kolumbianischen Varietät Castillo durch Cenicafé?", "options": ["Resistenz gegen Kaffeerost", "Resistenz gegen Frost", "Resistenz gegen Trockenheit", "Resistenz gegen den Kirschenkäfer"], "correct": 0, "explain": "Castillo geht auf Caturra × Timor-Hybrid zurück und wurde von Cenicafé gezielt auf Rostresistenz gezüchtet.", "source": {"title": "Duque-Orrego et al. (2005), Cenicafé 56(3) – Adopción de las variedades Castillo® resistentes a la roya", "url": "https://www.cenicafe.org/es/publications/arc056%2803%29197-215.pdf"}, "img": "blatt", "topic": "Arten & Sorten", "st": 2}, {"id": "a2-18", "mode": "anbau", "level": 2, "type": "mc", "q": "Welches Land verlor im 19. Jahrhundert durch Kaffeerost seine führende Kaffeeproduktion und stieg auf Tee um?", "options": ["Ceylon (heute Sri Lanka)", "Goldküste (heute Ghana)", "Siam (heute Thailand)", "Burma (heute Myanmar)"], "correct": 0, "explain": "Ceylon war die führende Kaffeeregion, bis Rost ab 1869 die Plantagen unwirtschaftlich machte; die Pflanzer stiegen größtenteils auf Tee um.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 2}, {"id": "a2-19", "mode": "anbau", "level": 2, "type": "mc", "q": "Wo wurde Kaffeerost 1970 erstmals auf dem amerikanischen Kontinent entdeckt?", "options": ["In Bahia, Brasilien", "In Antioquia, Kolumbien", "In Chiapas, Mexiko", "In Matagalpa, Nicaragua"], "correct": 0, "explain": "1970 wurde Rost in Bahia (Brasilien) entdeckt; innerhalb von weniger als zehn Jahren breitete er sich über Süd- und Mittelamerika aus.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 3}, {"id": "a2-20", "mode": "anbau", "level": 2, "type": "mc", "q": "Was passiert bei der indischen Spezialität „Monsooned Malabar“?", "options": ["Kirschen bleiben während des Monsuns am Baum hängen und trocknen", "Rohkaffee wird in offenen Lagerhallen dem Monsunwind ausgesetzt", "Rohkaffee wird in Meerwasser gewaschen und anschließend getrocknet", "Kirschen werden nur in der Trockenzeit vor dem Monsun geerntet"], "correct": 1, "explain": "Der Rohkaffee nimmt in belüfteten Lagerhallen an der Malabarküste Feuchtigkeit aus den Monsunwinden auf; er quillt deutlich auf und wird blassgelb. Der Prozess dauert etwa 12–16 Wochen.", "source": {"title": "Coffee Board of India – GI-Antrag „Monsooned Malabar Arabica Coffee“", "url": "https://www.origin-gi.com/wp-content/uploads/2017/01/48-monsooned-malabar-arabica-coffee.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 5}, {"id": "a2-21", "mode": "anbau", "level": 2, "type": "mc", "q": "Welche Jahresniederschlagsmenge gilt für Arabica als optimal?", "options": ["Etwa 500–800 mm", "Etwa 250–500 mm", "Etwa 1.200–1.800 mm", "Etwa 3.000–4.000 mm"], "correct": 2, "explain": "Für Arabica gelten etwa 1.200–1.800 mm Jahresniederschlag als optimal; Robusta verträgt sehr hohe Niederschläge über 2.000 mm besser.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "sonne", "topic": "Klima & Standort", "st": 3}, {"id": "a2-22", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie nennt man das Sämlingsstadium, in dem die beiden runden Keimblätter entfaltet sind?", "options": ["Schmetterlingsstadium (Butterfly)", "Streichholzstadium (Matchstick)", "Soldatenstadium (Soldier)", "Rosettenstadium (Rosette)"], "correct": 0, "explain": "Nach dem Streichholzstadium (Matchstick) folgt das Keimblatt- bzw. „Butterfly“-Stadium; in diesen Stadien werden Sämlinge in Beutel umgepflanzt.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 2: Nursery practices", "url": "https://www.fao.org/4/ae939e/ae939e04.htm"}, "img": "pflanze", "topic": "Botanik", "st": 8}, {"id": "a2-23", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ergab die Klimastudie von Bunn et al. (2015) für Arabica bis 2050?", "options": ["Die geeignete Fläche wächst um etwa die Hälfte", "Etwa die Hälfte der geeigneten Fläche geht verloren", "Etwa ein Zehntel der geeigneten Fläche geht verloren", "Die geeignete Fläche bleibt insgesamt etwa gleich"], "correct": 1, "explain": "Die Studie bestätigte, dass bis 2050 etwa die Hälfte der heute für Arabica geeigneten Flächen ungeeignet wird; die geeigneten Lagen wandern im Mittel über 300 m höher.", "source": {"title": "World Coffee Research – Climate change: Pinpointing the world’s most vulnerable coffee zones (Bunn et al. 2015)", "url": "https://worldcoffeeresearch.org/news/2015/climate-change-pinpointing-the-worlds-most-vulnerable-coffee-zones"}, "img": "sonne", "topic": "Klima & Standort", "st": 2}, {"id": "a2-24", "mode": "anbau", "level": 2, "type": "case", "q": "Deine Pflücker liefern die Kirschen abends ab, der Pulper läuft erst am nächsten Mittag. Was empfiehlt der TechnoServe-Leitfaden?", "options": ["Im Schatten lagern, dann sind auch 2–3 Tage problemlos", "Über Nacht in der Sonne liegen lassen, damit sie noch nachreifen", "Über Nacht in Wasser einweichen, damit sie frisch bleiben", "Binnen 6–8 Stunden entpulpen, sonst gären sie unkontrolliert"], "correct": 3, "explain": "Kirschen sollten innerhalb von 6–8 Stunden entpulpt werden; wartet man länger, beginnt Fermentation in der Frucht, die zu Defekten führen kann. Notfalls mit kaltem Wasser abspülen, um sie zu bremsen.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Aufbereitung", "st": 6}, {"id": "a2-25", "mode": "anbau", "level": 2, "type": "case", "q": "Dein Pergamentkaffee liegt im Fermentationstank. Woran erkennst du, dass der Schleim gelöst ist?", "options": ["Er fühlt sich glitschig an, die Bohnen kleben aneinander", "Das Wasser im Tank wird klar, und die Bohnen schwimmen oben", "Er fühlt sich körnig an, ein Stock hinterlässt ein stabiles Loch", "Er riecht stechend nach Essig, und auf dem Tank steht heller Schaum"], "correct": 2, "explain": "Typische Zeichen: Das Pergament fühlt sich nicht mehr glitschig, sondern körnig an, und beim Stocktest fällt das Loch nicht mehr zusammen. Die Zeit allein ist nur ein grober Richtwert.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 5}, {"id": "a2-26", "mode": "anbau", "level": 2, "type": "mc", "q": "Im Waschkanal wird Pergamentkaffee nach Dichte getrennt. Welcher Teil gilt als beste Qualität?", "options": ["Was oben schwimmt und ans Kanalende treibt", "Was halb schwebt und in der Kanalmitte landet", "Was am Rand kleben bleibt und abgestreift wird", "Was absinkt und am Kanalanfang liegen bleibt"], "correct": 3, "explain": "Dichtes Pergament (Parchment 1/Grade A) sinkt und bleibt am Kanalanfang; leichte „Lights“ schwimmen ans Ende und werden getrennt gehalten.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 5}, {"id": "a2-27", "mode": "anbau", "level": 3, "type": "mc", "q": "Welcher dieser Rohkaffeefehler zählt nach SCAA-Klassifizierung zu den Primärdefekten?", "options": ["Eine teils schwarze Bohne (Partial Black)", "Eine muschelförmige Bohne (Shell)", "Eine leichte, schwimmende Bohne (Floater)", "Eine ganz schwarze Bohne (Full Black)"], "correct": 3, "explain": "Zu den Primärdefekten zählen u. a. Full Black, Full Sour, Pod/Cherry sowie Steine und Stöcke; in Specialty Grade ist kein einziger erlaubt.", "source": {"title": "Coffee Research Institute – SCAA Green Coffee Classification", "url": "https://coffeeresearch.org/coffee/scaaclass.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 1}, {"id": "a2-28", "mode": "anbau", "level": 2, "type": "mc", "q": "Wofür steht „SHB“ bei Kaffee aus Mittelamerika, etwa aus Costa Rica oder Guatemala?", "options": ["Super Honey Bean", "Strictly High Bourbon", "Strictly Hard Bean", "Selected Handpicked Bean"], "correct": 2, "explain": "SHB (Strictly Hard Bean) ist eine Klassifizierung nach Anbauhöhe; in höheren Lagen gewachsene Bohnen sind dichter. Gleichbedeutend wird SHG (Strictly High Grown) verwendet.", "source": {"title": "Sweet Maria's Coffee Library – Glossar: Strictly High Grown / Strictly Hard Bean", "url": "https://library.sweetmarias.com/glossary/strictly-high-grown/"}, "img": "berg", "topic": "Rohkaffee & Qualität", "st": 1}, {"id": "a2-29", "mode": "anbau", "level": 2, "type": "mc", "q": "Was bedeutet der Zusatz „EP“ (European Preparation) auf einem Rohkaffeesack?", "options": ["Der Kaffee wurde für den EU-Markt bio-zertifiziert", "Der Kaffee wurde vor dem Export entkoffeiniert", "Der Kaffee wurde in einer europäischen Mühle geschält", "Der Kaffee wurde zusätzlich von Hand nachverlesen"], "correct": 3, "explain": "Von Hand nachgelesener, gereinigter Kaffee wird oft als „European Preparation“ bezeichnet; die besten Partien werden sogar zwei- bis dreimal verlesen.", "source": {"title": "Coffee Review – Cleaning and Sorting", "url": "https://www.coffeereview.com/coffee-reference/from-crop-to-cup/processing/cleaning-and-sorting"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 2}, {"id": "a2-30", "mode": "anbau", "level": 2, "type": "mc", "q": "Was kennzeichnet eine „anaerobe“ Fermentation von Kaffee?", "options": ["Er fermentiert in offenen Tanks unter ständigem, kräftigem Umrühren", "Er fermentiert ohne Mikroorganismen, nur durch Enzyme", "Er fermentiert in offenen Becken unter fließendem Wasser", "Er fermentiert in verschlossenen Behältern mit wenig Sauerstoff"], "correct": 3, "explain": "Der Kaffee fermentiert in verschlossenen Säcken oder Tanks; überschüssiges CO₂ entweicht über Ventile, Luft bleibt draußen. Bei Carbonic Maceration wird zusätzlich CO₂ eingeleitet.", "source": {"title": "Coffee Review – Anaerobically Processed Coffees", "url": "https://www.coffeereview.com/anaerobically-processed-coffees/"}, "img": "trocknung", "topic": "Aufbereitung", "st": 2}, {"id": "a3-01", "mode": "anbau", "level": 3, "type": "mc", "q": "Aus welchen beiden Wildarten ist Coffea arabica durch natürliche Hybridisierung entstanden?", "options": ["C. canephora × C. eugenioides", "C. liberica × C. canephora", "C. stenophylla × C. eugenioides", "C. racemosa × C. liberica"], "correct": 0, "explain": "Arabica ist eine junge allotetraploide Art aus der Kreuzung zweier diploider Arten: C. canephora (C-Genom) und C. eugenioides (E-Genom).", "source": {"title": "CIRAD Agritrop – Sequence organisation at homeologous regions in the allotetraploid Coffea arabica", "url": "https://agritrop.cirad.fr/551242"}, "img": "pflanze", "topic": "Botanik", "st": 1}, {"id": "a3-02", "mode": "anbau", "level": 3, "type": "mc", "q": "Was unterscheidet Arabica genetisch von allen anderen Coffea-Arten?", "options": ["Arabica ist diploid (22 Chromosomen) und selbststeril", "Arabica ist tetraploid (44 Chromosomen) und selbstfruchtbar", "Arabica ist tetraploid (44 Chromosomen) und selbststeril", "Arabica ist hexaploid (66 Chromosomen) und selbstbefruchtend"], "correct": 1, "explain": "Arabica ist die einzige tetraploide (2n=4x=44) und selbstfruchtbare Kaffeeart; die übrigen Arten sind diploid (2n=22) und meist selbstinkompatibel.", "source": {"title": "CIRAD Agritrop – Sequence organisation at homeologous regions in the allotetraploid Coffea arabica", "url": "https://agritrop.cirad.fr/551242"}, "img": "bluete", "topic": "Botanik", "st": 5}, {"id": "a3-03", "mode": "anbau", "level": 3, "type": "mc", "q": "Was ist der Timor-Hybrid?", "options": ["Eine im Labor gentechnisch veränderte Arabica aus Indonesien", "Eine natürliche Zwergmutation von Typica von der Insel Timor", "Eine natürliche Arabica-Robusta-Kreuzung von der Insel Timor", "Eine gezielte Arabica-Liberica-Kreuzung von der Insel Java"], "correct": 2, "explain": "In den 1920er-Jahren kreuzten sich auf Timor eine Arabica- und eine Robusta-Pflanze; das Robusta-Erbgut brachte Rostresistenz und ist Basis von Catimoren und Sarchimoren.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "blatt", "topic": "Arten & Sorten", "st": 1}, {"id": "a3-04", "mode": "anbau", "level": 3, "type": "mc", "q": "Was darf eine Rohkaffeeprobe nach der SCAA-Klassifizierung für „Specialty Grade“ NICHT enthalten?", "options": ["Bohnen mit 11 % Restfeuchte", "Einen einzigen Sekundärdefekt", "Bohnen aus Honey-Aufbereitung", "Einen einzigen Primärdefekt"], "correct": 3, "explain": "Specialty Grade erlaubt keine Primärdefekte, höchstens 5 Full Defects und keine Quaker; die Feuchte muss zwischen 9 und 13 % liegen.", "source": {"title": "Coffee Research Institute – SCAA Green Coffee Classification", "url": "https://coffeeresearch.org/coffee/scaaclass.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 1}, {"id": "a3-05", "mode": "anbau", "level": 3, "type": "mc", "q": "Aus welcher Kreuzung stammt Pacamara, und wo wurde sie gezüchtet?", "options": ["Pacas × Maragogipe, El Salvador", "Caturra × Catuaí, Brasilien", "Typica × SL28, Kenia", "Geisha × Bourbon, Panama"], "correct": 0, "explain": "Pacamara wurde vom salvadorianischen Kaffeeforschungsinstitut ISIC aus Pacas × Maragogipe gezüchtet und hat sehr große Bohnen.", "source": {"title": "World Coffee Research – Varietätenkatalog: Pacamara", "url": "https://varieties.worldcoffeeresearch.org/varieties/pacamara"}, "img": "kirsche", "topic": "Arten & Sorten", "st": 2}, {"id": "a3-06", "mode": "anbau", "level": 3, "type": "case", "q": "Deine F1-Hybrid-Pflanzen (z. B. Centroamericano H1) tragen super. Kannst du aus ihren Samen gleichwertige Nachkommen ziehen?", "options": ["Ja, Arabica ist selbstfruchtbar, die Nachkommen sind identisch", "Nein, die Nachkommen spalten auf und sind nicht gleichwertig", "Ja, sofern die Mutterpflanzen im Schatten gewachsen sind", "Nein, F1-Hybride bilden grundsätzlich keine keimfähigen Samen"], "correct": 1, "explain": "Samen von F1-Hybriden sind nicht sortenecht: Die Eigenschaften spalten in der nächsten Generation auf (Segregation).", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 2}, {"id": "a3-07", "mode": "anbau", "level": 3, "type": "mc", "q": "Wo und woraus wurde die Varietät SL28 selektiert?", "options": ["In Kolumbien, aus der Varietät „Castillo“", "In Äthiopien, aus den Wildbeständen bei „Gesha“", "In Kenia, aus „Tanganyika Drought Resistant“", "In Indien, aus der dortigen Varietät „Kent“"], "correct": 2, "explain": "SL28 wurde 1935 an den Scott Agricultural Laboratories (Kenia) aus einem einzelnen Baum der Population „Tanganyika Drought Resistant“ ausgewählt; genetisch gehört sie zur Bourbon-Gruppe.", "source": {"title": "World Coffee Research – Varietätenkatalog: SL28", "url": "https://varieties.worldcoffeeresearch.org/varieties/sl28"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 4}, {"id": "a3-08", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ist das Besondere an der Wet-Hulled-Aufbereitung (Giling Basah) in Indonesien?", "options": ["Das Pergament wird noch feucht entfernt, dann fertig getrocknet", "Die Kirschen werden ganz eingefroren und erst später geschält", "Die Bohnen werden in Meerwasser fermentiert und dann getrocknet", "Die Kirschen werden von Zibetkatzen gefressen und ausgeschieden"], "correct": 0, "explain": "Beim Giling Basah werden Schleim und Pergament entfernt, solange die Bohne noch sehr feucht ist; der Rohkaffee trocknet danach schnell weiter – passend zum feuchten Klima Sumatras.", "source": {"title": "Cafe Imports – Wet-Hulled (Giling Basah)", "url": "https://www.cafeimports.com/europe/blog/?p=37563"}, "img": "trocknung", "topic": "Aufbereitung", "st": 5}, {"id": "a3-09", "mode": "anbau", "level": 3, "type": "case", "q": "Ein Kaffee aus der Region der Großen Seen (z. B. Ruanda) riecht gemahlen nach rohen, geschälten Kartoffeln. Womit hängt dieser Defekt zusammen?", "options": ["Mit Fraß durch den Kaffeekirschenkäfer", "Mit zu langer Fermentation im Tank", "Mit Befall durch den Kaffeerostpilz", "Mit Schäden durch die Antestia-Wanze"], "correct": 3, "explain": "Der Potato Taste Defect steht nach WCR klar im Zusammenhang mit Schäden durch die Antestia-Wanze; beteiligt sind Methoxypyrazine wie IPMP. Eine einzige Bohne kann eine Tasse prägen.", "source": {"title": "World Coffee Research – Potato Taste Defect: Impacts of the Antestia Bug (2023)", "url": "https://worldcoffeeresearch.org/download/a2a841cb-658e-4020-b70d-c38d3bc3f0c3"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 5}, {"id": "a3-10", "mode": "anbau", "level": 3, "type": "case", "q": "Ein Regenschauer hat deinen halbtrockenen Kaffee auf dem Trockenbett wieder durchnässt. Welches Risiko steigt vor allem?", "options": ["Das Koffein wird ausgewaschen und geht verloren", "Schimmel kann wachsen und Ochratoxin A bilden", "Der Zucker karamellisiert in der Sonne zu stark", "Die Bohnen werden durch Kälte rissig und brüchig"], "correct": 1, "explain": "Wiederbefeuchtung und langsames Trocknen begünstigen OTA-bildende Pilze wie Aspergillus; der Codex empfiehlt, Rückbefeuchtung zu vermeiden und unter 12,5 % Feuchte zu trocknen.", "source": {"title": "Codex Alimentarius CAC/RCP 69-2009 – Code of Practice for the Prevention and Reduction of Ochratoxin A in Coffee", "url": "https://www.gov.si/assets/organi-v-sestavi/UVHVVR/Varna-hrana/Onesnazevala-v-zivilih/OTA-kava-CAC-RCP-69-2009.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 2}, {"id": "a3-11", "mode": "anbau", "level": 3, "type": "mc", "q": "Was zeigte eine Feldstudie in Costa Rica zu Schattenbäumen über Kaffee?", "options": ["Schatten beschleunigte die Reife und steigerte den Ertrag, verschlechterte aber die Tasse", "Schatten verzögerte die Reife und senkte den Ertrag, verbesserte aber die Qualität", "Schatten verzögerte die Reife und senkte die Qualität, steigerte aber den Ertrag", "Schatten beschleunigte die Reife und senkte den Ertrag, ohne die Qualität zu ändern"], "correct": 1, "explain": "In der Studie senkte Schatten die Produktivität um 18 %, verzögerte die Fruchtreife bis zu einem Monat und verbesserte Bohnengröße und Getränkequalität.", "source": {"title": "Vaast et al. (2006), J. Sci. Food Agric. – Fruit thinning and shade improve bean characteristics and beverage quality of coffee", "url": "https://agritrop.cirad.fr/530251"}, "img": "sonne", "topic": "Klima & Standort", "st": 6}, {"id": "a3-12", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Pilzkrankheit befällt in Afrika speziell die grünen Arabica-Kirschen und kann große Ernteverluste verursachen?", "options": ["Coffee Berry Disease (Colletotrichum kahawae)", "Kaffeerost (Hemileia vastatrix)", "Ojo de Gallo (Mycena citricolor)", "Braunfleckenkrankheit (Cercospora coffeicola)"], "correct": 0, "explain": "Coffee Berry Disease (Colletotrichum kahawae) ist auf grüne Kirschen spezialisiert und kann unter günstigen Bedingungen 60–80 % der Ernte vernichten.", "source": {"title": "Mouen Bedimo et al. (2012), Crop Protection 31:125–131", "url": "https://publications.cirad.fr/une_notice.php?dk=562177"}, "img": "kirsche", "topic": "Krankheiten & Schädlinge", "st": 1}, {"id": "a3-13", "mode": "anbau", "level": 3, "type": "mc", "q": "Warum gilt die wiederentdeckte Art Coffea stenophylla als Hoffnungsträger im Klimawandel?", "options": ["Sie verträgt gut 6 °C mehr Wärme und schmeckt Arabica-ähnlich", "Sie verträgt auch Nachtfrost gut und schmeckt Arabica-ähnlich", "Sie enthält kaum Koffein und ist resistent gegen Kaffeerost", "Sie trägt schon nach einem Jahr und liefert sehr hohe Erträge"], "correct": 0, "explain": "Stenophylla aus Westafrika gedeiht bei rund 24,9 °C Jahresmittel, etwa 6,2–6,8 °C mehr als Arabica; Verkostungsjurys beschrieben ihren Geschmack als Arabica-ähnlich (Davis et al. 2021).", "source": {"title": "CIRAD – Coffea stenophylla could help futureproof coffee (Davis et al. 2021, Nature Plants)", "url": "https://www.cirad.fr/en/press-area/press-releases/2021/coffea-stenophylla-coffee-climate-change"}, "img": "sonne", "topic": "Arten & Sorten", "st": 2}, {"id": "a3-14", "mode": "anbau", "level": 3, "type": "mc", "q": "Welcher Anteil der wilden Kaffeearten gilt laut Kew-Studie (Davis et al. 2019) als vom Aussterben bedroht?", "options": ["Etwa 25 %", "Etwa 40 %", "Etwa 60 %", "Etwa 80 %"], "correct": 2, "explain": "Von 124 bekannten Wildkaffeearten sind 75 (rund 60 %) nach den Kriterien der Roten Liste der IUCN bedroht.", "source": {"title": "Mongabay – 60% of wild coffee species threatened with extinction (Davis et al. 2019, Science Advances)", "url": "https://news.mongabay.com/2019/01/coffee-in-trouble-60-of-wild-coffee-species-threatened-with-extinction/"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 1}, {"id": "a3-15", "mode": "anbau", "level": 3, "type": "mc", "q": "Aus welchem Gewebe besteht die eigentliche Kaffeebohne größtenteils?", "options": ["Aus der Fruchthaut (Exokarp)", "Aus dem Fruchtfleisch (Mesokarp)", "Aus dem Pergament (Endokarp)", "Aus dem Nährgewebe (Endosperm)"], "correct": 3, "explain": "Das Endosperm verdrängt während der Fruchtentwicklung das Perisperm und bildet die Bohne; der kleine Embryo sitzt darin, vom Perisperm bleibt nur das Silberhäutchen.", "source": {"title": "De Castro & Marraccini (2006), Braz. J. Plant Physiol. – Cytology, biochemistry and molecular changes during coffee fruit development", "url": "https://library.sweetmarias.com/wp-content/uploads/2020/08/Cytology-biochemistry-and-molecular-changes-during-coffee-fruit-development.pdf"}, "img": "kirsche", "topic": "Botanik", "st": 1}, {"id": "a3-16", "mode": "anbau", "level": 3, "type": "case", "q": "Es ist schwül, aber regenlos, ohne Tau. Kann eine Rostspore auf einem trockenen Blatt jetzt keimen?", "options": ["Ja, eine hohe Luftfeuchte allein reicht zum Keimen aus", "Nein, die Sporen brauchen freies Wasser auf dem Blatt", "Ja, Rostsporen keimen gerade bei trockener Wärme", "Nein, die Sporen keimen nur bei Temperaturen unter 10 °C"], "correct": 1, "explain": "Rostsporen keimen nur in freiem Wasser auf dem Blatt; hohe Luftfeuchte allein genügt nicht.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 2}, {"id": "a3-17", "mode": "anbau", "level": 3, "type": "mc", "q": "Welcher Erreger verursacht die Tracheomykose (Coffee Wilt Disease), die in Uganda und im Kongo vor allem Robusta abtötet?", "options": ["Hypothenemus hampei", "Hemileia vastatrix", "Fusarium xylarioides", "Colletotrichum kahawae"], "correct": 2, "explain": "Die Welkekrankheit durch Fusarium xylarioides trat bei Erhebungen in Uganda, Tansania und DR Kongo nur an C. canephora auf, in Äthiopien nur an Arabica; befallene Bäume welken und sterben.", "source": {"title": "Oduor et al. (2005), ASIC – Surveys to establish the spread of coffee wilt disease in Africa", "url": "https://agritrop.cirad.fr/529389/"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 3}, {"id": "a3-18", "mode": "anbau", "level": 3, "type": "case", "q": "Nach der Ernte hängen noch überreife Kirschen am Baum und liegen am Boden. Was hilft am meisten gegen den Kirschenkäfer in der nächsten Saison?", "options": ["Restkirschen am Boden als Mulch liegen lassen", "Alle Restkirschen von Baum und Boden einsammeln", "Die Bäume nach der Ernte kräftig mit Stickstoff düngen", "Die Bäume nach der Ernte häufiger bewässern"], "correct": 1, "explain": "Restkirschen sind Brutstätten des Kirschenkäfers. Zur Feldhygiene gehört, nach der Ernte alle Kirschen von Baum und Boden zu entfernen.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 2}, {"id": "a3-19", "mode": "anbau", "level": 3, "type": "mc", "q": "Welcher Organismus wird biologisch gegen den Kaffeekirschenkäfer eingesetzt, etwa in Puerto Rico und Indonesien?", "options": ["Der Insektenpilz Beauveria bassiana", "Der Pflanzenpilz Colletotrichum kahawae", "Der Wurzelnematode Meloidogyne exigua", "Die Gärhefe Saccharomyces cerevisiae"], "correct": 0, "explain": "Sprays mit Beauveria bassiana sind Teil integrierter Programme gegen den Käfer; in Puerto Rico richtet sich die Ausbringung nach der Position des Käfers in der Frucht.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 4}, {"id": "a3-20", "mode": "anbau", "level": 3, "type": "case", "q": "Ein Farmer pflanzt einen ganzen Robusta-Hang mit nur einem einzigen Klon. Was ist das Problem?", "options": ["Keins, denn Robusta befruchtet sich zuverlässig selbst", "Robusta ist selbstinkompatibel und braucht verschiedene Klone", "Ein einzelner Klon bildet bei Robusta nur kleine Peaberries", "Robusta-Klone bilden kaum Wurzeln und wachsen am Hang nicht an"], "correct": 1, "explain": "C. canephora ist auf Fremdbestäubung angewiesen (gametophytische Selbstinkompatibilität). Ein Klon kann sich nicht selbst befruchten, daher braucht es kompatible Partner im Bestand.", "source": {"title": "Moraes et al. (2018), Genetics and Molecular Research – Gametophytic self-incompatibility of Coffea canephora clones", "url": "https://www.alice.cnptia.embrapa.br/handle/doc/1101580?locale=en"}, "img": "bluete", "topic": "Botanik", "st": 2}, {"id": "a3-21", "mode": "anbau", "level": 3, "type": "mc", "q": "Warum folgt bei ungeschattetem Arabica auf ein Jahr mit sehr hoher Ernte oft ein schwaches Jahr?", "options": ["Weil Arabica von Natur aus nur alle zwei Jahre blüht", "Weil die Fruchtlast Blattbildung bremst und Zweige absterben lässt", "Weil die volle Sonne im Folgejahr die jungen Blütenknospen verbrennt", "Weil reiche Ernten im Folgejahr viel mehr Kirschenkäfer anlocken"], "correct": 1, "explain": "Starker Fruchtbehang ist bei ungeschattetem Arabica typisch; er schränkt Bildung und Erhalt der Blätter ein und führt zum Absterben von Zweigen – daraus entsteht die ausgeprägte Alternanz.", "source": {"title": "Chaves et al. (2012), Environmental and Experimental Botany 77:207–218", "url": "https://www.alice.cnptia.embrapa.br/alice/bitstream/doc/919316/1/ArtigoEnvironmentalandExperimentalBotany2012.pdf"}, "img": "pflanze", "topic": "Blüte & Ernte", "st": 2}, {"id": "a3-22", "mode": "anbau", "level": 3, "type": "case", "q": "Du willst alte, erschöpfte Bäume durch Rückschnitt auf Kniehöhe (Stumping) verjüngen. Womit musst du rechnen?", "options": ["Mit einer Rekordernte schon in derselben Saison", "Mit dauerhaft halbiertem Ertrag in allen Folgejahren", "Mit dem Absterben der meisten Bäume binnen Wochen", "Mit Ernteausfall für ein, oft auch zwei Jahre"], "correct": 3, "explain": "Beim kompletten Stumping auf etwa 50 cm fällt die Ernte ein und oft zwei Jahre aus; das FAO-Handbuch empfiehlt deshalb gestaffelte Verjüngung über neue Triebe.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 5: Pruning and tree management", "url": "https://www.fao.org/3/ae939e/ae939e07.htm"}, "img": "pflanze", "topic": "Blüte & Ernte", "st": 1}, {"id": "a3-23", "mode": "anbau", "level": 3, "type": "mc", "q": "Wogegen wurde die kenianische F1-Hybride Ruiru 11 vor allem gezüchtet?", "options": ["Gegen Trockenheit und starken Hitzestress", "Gegen Kirschenkäfer und Antestia-Wanze", "Gegen Coffee Berry Disease und Kaffeerost", "Gegen Kaffeewelke und Wurzelgallennematoden"], "correct": 2, "explain": "Ruiru 11 entstand nach der CBD-Epidemie von 1968 an der Forschungsstation Ruiru und wurde 1985 freigegeben; sie ist resistent gegen CBD und tolerant bis resistent gegen Rost.", "source": {"title": "World Coffee Research – Varietätenkatalog: Ruiru 11", "url": "https://varieties.worldcoffeeresearch.org/varieties/ruiru-11"}, "img": "blatt", "topic": "Arten & Sorten", "st": 1}, {"id": "a3-24", "mode": "anbau", "level": 3, "type": "mc", "q": "Warum spricht man bei Arabica in Lateinamerika von einem genetischen Flaschenhals?", "options": ["Weil er fast nur auf Wildpflanzen aus den Bergwäldern Kolumbiens beruht", "Weil er auf einer frühen Kreuzung mit Robusta aus dem Kongo beruht", "Weil er auf wenigen Typica- und Bourbon-Linien aus dem Jemen beruht", "Weil er nur auf Saatgut aus wenigen staatlichen Samenbanken beruht"], "correct": 2, "explain": "Wenige aus dem Jemen mitgenommene Bäume bilden die Basis der meisten Arabica-Produktion; in Brasilien gehen laut WCR 97,55 % der Sorten auf Typica und Bourbon zurück.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 6}, {"id": "a3-25", "mode": "anbau", "level": 3, "type": "mc", "q": "Von welcher Pflanze stammen die Typica-Bestände ab, die später Amerika besiedelten?", "options": ["Von einem Baum, der 1706 von Java nach Amsterdam kam", "Von Wildpflanzen, die 1720 aus Äthiopien nach Paris kamen", "Von Samen, die 1750 aus dem Jemen nach Brasilien kamen", "Von Stecklingen, die 1690 von Ceylon nach Lissabon kamen"], "correct": 0, "explain": "1706 kam eine einzelne Typica-Pflanze von Java in den Botanischen Garten Amsterdam; von ihr stammt die Typica ab, die später nach Amerika gelangte.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "pflanze", "topic": "Herkunft", "st": 5}, {"id": "a3-26", "mode": "anbau", "level": 3, "type": "case", "q": "Mittags in der prallen Sonne misst du auf dem Trockenbett sehr heißen Pergamentkaffee. Was tust du?", "options": ["Dünn ausbreiten und weiter in der prallen Sonne trocknen lassen", "Sofort schälen, damit er im Lager schneller abkühlt", "Mit Wasser besprühen, damit er unter ca. 35 °C bleibt", "Zusammenschieben und abdecken, damit er unter ca. 35 °C bleibt"], "correct": 3, "explain": "Der TechnoServe-Leitfaden empfiehlt, den Kaffee in der heißesten Tageszeit zusammenzuschieben und abzudecken; das Pergament sollte 35 °C nicht überschreiten.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "to
