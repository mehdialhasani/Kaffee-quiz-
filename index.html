her – Filterkaffee zubereiten", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/filter-coffee-brewing"}, "img": "filter", "topic": "Filter", "case": {"title": "Fall · Volles Filterbett", "facts": ["V60, 18 g Kaffee auf 300 g Wasser", "Das Bett steigt beim Aufgießen über die Filtermitte", "Durchlauf dauert über 4 Minuten"]}, "st": 3}, {"id": "b1-137", "mode": "barista", "level": 1, "type": "mc", "q": "Welches Wasser empfiehlt die NCA für die Kaffeezubereitung nicht?", "options": ["Frisches, kaltes Leitungswasser", "Destilliertes oder enthärtetes Wasser", "Gefiltertes, kaltes Leitungswasser", "Frisches, kaltes Quellwasser"], "correct": 1, "explain": "Die NCA rät zu kaltem, möglichst gefiltertem Wasser und von destilliertem oder enthärtetem Wasser ab – Kaffee braucht ein gewisses Maß an Mineralien.", "source": {"title": "NCA – Espresso", "url": "https://www.aboutcoffee.org/brewing/espresso/"}, "img": "wasser", "topic": "Wasser", "st": 10}, {"id": "b1-138", "mode": "barista", "level": 1, "type": "mc", "q": "Was beschreibt die Extraktion (Extraktionsausbeute)?", "options": ["Den Anteil gelöster Stoffe im Getränk", "Die Zeit, die das Wasser im Kaffee steht", "Die Wassermenge pro Gramm Kaffeemehl", "Den Anteil des Kaffeemehls, der gelöst wurde"], "correct": 3, "explain": "Extraktion ist der Anteil des Kaffeemehls, der in Lösung geht. Der Anteil gelöster Stoffe im Getränk ist dagegen die Stärke (TDS).", "source": {"title": "Kaffeemacher – Extraktion und Stärke von Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/extraction-strength-coffee"}, "img": "tasse", "topic": "Extraktion", "st": 8}, {"id": "b1-139", "mode": "barista", "level": 1, "type": "mc", "q": "Was bedeutet eine stufenlose Mahlgradverstellung?", "options": ["Der Mahlgrad lässt sich beliebig fein einstellen", "Die Mühle stellt den Mahlgrad selbst ein", "Der Mahlgrad hat genau zehn feste Rasten", "Die Mühle mahlt nur einen einzigen Mahlgrad"], "correct": 0, "explain": "Stufenlose Mühlen haben keine festen Rasten, sondern lassen sich beliebig fein verstellen – genauer, aber für Einsteiger etwas gewöhnungsbedürftig.", "source": {"title": "Clive Coffee – How to Choose an Espresso Grinder", "url": "https://clivecoffee.com/blogs/learn/how-to-choose-a-grinder"}, "img": "muehle", "topic": "Mahlgrad", "st": 8}, {"id": "b1-140", "mode": "barista", "level": 1, "type": "mc", "q": "Was versteht man unter „Single Dosing“ an der Mühle?", "options": ["Die Mühle mahlt nur einmal pro Tag", "Jede Dosis wird vor dem Mahlen abgewogen", "Die Mühle hat nur eine einzige Stufe", "Jede Dosis wird erst nach dem Mahlen gewogen"], "correct": 1, "explain": "Beim Single Dosing wiegt man die Bohnen für jeden Bezug vorher ab und mahlt sie komplett durch. Das erleichtert Sortenwechsel und spart Kaffee.", "source": {"title": "Clive Coffee – How to Choose an Espresso Grinder", "url": "https://clivecoffee.com/blogs/learn/how-to-choose-a-grinder"}, "img": "muehle", "topic": "Mahlgrad", "st": 8}, {"id": "b1-141", "mode": "barista", "level": 1, "type": "mc", "q": "Worauf achtest du bei der Wahl eines Tampers zuerst?", "options": ["Er passt genau zum Durchmesser des Siebs", "Er ist möglichst schwer und lang", "Er hat einen gewölbten Boden", "Er ist kleiner als das Sieb"], "correct": 0, "explain": "Der Tamper sollte zum Siebdurchmesser passen und sich im Sieb gerade noch drehen lassen – sonst bleibt am Rand lockeres Mehl.", "source": {"title": "Perfect Daily Grind – What is channeling and how does it affect espresso extraction?", "url": "https://perfectdailygrind.com/2022/03/what-is-channeling-espresso-extraction/"}, "img": "tamper", "topic": "Espresso", "st": 3}, {"id": "b1-142", "mode": "barista", "level": 1, "type": "mc", "q": "Wie gehst du beim Einstellen eines Espressos vor?", "options": ["Immer nur eine Größe auf einmal ändern", "Mahlgrad und Dosis gleichzeitig ändern", "Alle Werte zufällig ausprobieren", "Erst die Maschine neu entkalken"], "correct": 0, "explain": "Beim Dialing-in ändert man jeweils nur einen Parameter – sonst weiß man nicht, welche Änderung den Geschmack verschoben hat.", "source": {"title": "Perfect Daily Grind – A Guide To Dialling In Espresso", "url": "https://perfectdailygrind.com/2020/07/a-guide-to-dialling-in-espresso/"}, "img": "espresso", "topic": "Espresso", "st": 4}, {"id": "b1-143", "mode": "barista", "level": 1, "type": "mc", "q": "Was zeigt dir ein Siebträger ohne Auslauf (nackter Siebträger)?", "options": ["Wie heiß das Brühwasser genau ist", "Wie viel Koffein im Espresso ist", "Wie gleichmäßig der Kaffee fließt", "Wie hoch der Brühdruck genau ist"], "correct": 2, "explain": "Am nackten Siebträger sieht man den Fluss direkt am Sieb – Lücken, mehrere Strahlen oder schräge Spritzer verraten Channeling.", "source": {"title": "Perfect Daily Grind – What is channeling and how does it affect espresso extraction?", "url": "https://perfectdailygrind.com/2022/03/what-is-channeling-espresso-extraction/"}, "img": "espresso", "topic": "Espresso", "st": 7}, {"id": "b1-144", "mode": "barista", "level": 1, "type": "mc", "q": "Welche Zubereitung braucht nach der Röstung meist mehr Ruhezeit?", "options": ["Handfilter", "Espresso", "French Press", "AeroPress"], "correct": 1, "explain": "Für Handfilter und French Press reichen oft wenige Tage, für Espresso empfiehlt z. B. Onyx 5–7 Tage, Wettbewerbskaffees oft 10–21 Tage.", "source": {"title": "Perfect Daily Grind – Coffee Degassing: What Does It Mean For Brewers & Roasters?", "url": "https://perfectdailygrind.com/2019/01/why-does-coffee-degas-what-does-it-mean-for-brewers-roasters/"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 6}, {"id": "b1-145", "mode": "barista", "level": 1, "type": "case", "q": "Der Kaffee blubbert stark, die Extraktion wirkt unruhig. Was tust du?", "options": ["Mit kochendem Wasser direkt brühen", "Kaffee noch einige Tage ruhen lassen", "Kaffee sofort einfrieren und auftauen", "Den Kaffee deutlich gröber mahlen"], "correct": 1, "explain": "Sehr frischer Kaffee gibt noch viel CO₂ ab; die Gasbläschen stören den Kontakt von Wasser und Mehl und sorgen für ungleichmäßige Extraktion. Ein paar Tage Ruhe helfen.", "source": {"title": "Perfect Daily Grind – Coffee Degassing: What Does It Mean For Brewers & Roasters?", "url": "https://perfectdailygrind.com/2019/01/why-does-coffee-degas-what-does-it-mean-for-brewers-roasters/"}, "img": "bohne", "topic": "Bohne & Lagerung", "case": {"title": "Fall · Zu frisch", "facts": ["Röstung von gestern", "Sehr starker Bloom mit vielen Blasen", "Tasse schmeckt unausgewogen"]}, "st": 9}, {"id": "b1-146", "mode": "barista", "level": 1, "type": "mc", "q": "Wie frierst du Kaffeebohnen sinnvoll ein?", "options": ["Offen in der Tüte, bei Bedarf antauen lassen", "Luftdicht und in Portionen, Kondenswasser meiden", "Im Glas, täglich heraus und wieder hinein", "Lose im Gefrierfach, damit sie atmen können"], "correct": 1, "explain": "Die NCA rät zu wirklich luftdichten Behältern, nur so viel zu entnehmen wie nötig und den Rest zurückzustellen, bevor sich Kondenswasser bildet.", "source": {"title": "NCA – Storage and Shelf Life", "url": "https://www.aboutcoffee.org/beans/storage-and-shelf-life/"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 8}, {"id": "b1-147", "mode": "barista", "level": 1, "type": "mc", "q": "Warum ist der Kühlschrank kein guter Ort für Kaffeebohnen?", "options": ["Die Bohnen verlieren dort Koffein", "Die Bohnen keimen in der Kälte", "Das Licht im Kühlschrank schadet", "Feuchtigkeit kann kondensieren"], "correct": 3, "explain": "Im Kühlschrank kann sich Kondenswasser an den Bohnen bilden; Kaffeemacher rät ganz davon ab und empfiehlt Raumtemperatur, dunkel und verschlossen.", "source": {"title": "NCA – Storage and Shelf Life", "url": "https://www.aboutcoffee.org/beans/storage-and-shelf-life/"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 2}, {"id": "b1-148", "mode": "barista", "level": 1, "type": "mc", "q": "Hat eine dunkle Röstung pro Bohne mehr Koffein als eine helle?", nd 30 Sekunden mehr.", "source": {"title": "Kaffeemacher – Filterkaffee zubereiten", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/filter-coffee-brewing"}, "img": "filter", "topic": "Filter", "st": 6}, {"id": "b1-152", "mode": "barista", "level": 1, "type": "mc", "q": "Was tust du nach etwa einer Minute in der French Press?", "options": ["Die Kruste vorsichtig umrühren", "Den Kolben schon ganz herunterdrücken", "Frisches Kaffeemehl nachfüllen", "Den Kaffee in eine Kanne umfüllen"], "correct": 0, "explain": "Nach etwa einer Minute rührt man die Kruste sanft auf, setzt den Deckel auf und lässt rund drei weitere Minuten ziehen, bevor man drückt.", "source": {"title": "NCA – French Press Coffee", "url": "https://www.aboutcoffee.org/brewing/french-press-coffee/"}, "img": "filter", "topic": "Filter", "st": 6}, {"id": "b1-153", "mode": "barista", "level": 1, "type": "mc", "q": "Was ist typisch für die Papierfilter der Chemex?", "options": ["Sie sind dünner als die meisten Filter", "Sie bestehen aus feinem Metallgewebe", "Sie bestehen aus gewebter Baumwolle", "Sie sind dicker als die meisten Filter"], "correct": 3, "explain": "Chemex-Filter sind 20–30 % schwerer als andere Filter und halten mehr Öle und Schwebstoffe zurück – die Tasse wird sehr klar.", "source": {"title": "Perfect Daily Grind – Chemex: The History & Brewing Guide", "url": "https://perfectdailygrind.com/2015/05/chemex-the-history-brewing-guide/"}, "img": "filter", "topic": "Filter", "st": 7}, {"id": "b1-154", "mode": "barista", "level": 1, "type": "mc", "q": "Was machst du mit Siebträger und Sieben nach jeder Schicht?", "options": ["Mit Entkalker über Nacht einlegen", "Mit Kaffeeöl einreiben gegen Rost", "Gründlich mit Wasser ausspülen", "Unbenutzt in der Gruppe lassen"], "correct": 2, "explain": "Siebträger und Siebe spült man nach jeder Session aus; etwa monatlich weicht man sie zusätzlich 15–20 Minuten in Cafiza-Lösung ein.", "source": {"title": "Seattle Coffee Gear – Espresso Machine Maintenance 2024/01/microfoam-milk-coffee-latte-art/"}, "img": "milch", "topic": "Getränke", "st": 10}, {"id": "b1-161", "mode": "barista", "level": 1, "type": "case", "q": "Was passiert mit dem nächsten Bezug, wenn du nur feiner mahlst?", "options": ["Er läuft schneller und dauert kürzer", "Er läuft genauso schnell wie vorher", "Er läuft langsamer und dauert länger", "Er bricht sofort ganz ab"], "correct": 2, "explain": "Ein feinerer Mahlgrad erhöht den Widerstand im Puck und verlängert die Bezugszeit; gröber mahlen verkürzt sie.", "source": {"title": "Perfect Daily Grind – A Guide To Dialling In Espresso", "url": "https://perfectdailygrind.com/2020/07/a-guide-to-dialling-in-espresso/"}, "img": "espresso", "topic": "Espresso", "case": {"title": "Fall · Neue Mahlstufe", "facts": ["Dosis 18 g, Ziel 36 g", "Bisher 24 Sekunden Bezugszeit", "Mühle eine Stufe feiner gestellt"]}, "st": 5}, {"id": "b1-162", "mode": "barista", "level": 1, "type": "case", "q": "Bis zu welcher Temperatur dampfst du den Sojadrink künftig höchstens?", "options": ["Bis etwa 35 °C", "Bis etwa 75 °C", "Bis etwa 90 °C", "Bis etwa 55 °C"], "correct": 3, "explain": "Soja- und Mandeldrinks sollten höchstens etwa 55 °C erreichen, damit sie nicht ausflocken; Haferdrink funktioniert um 60 °C am besten.", "source": {"title": "Perfect Daily Grind – Why more baristas are focusing on milk temperature", "url": "https://perfectdailygrind.com/2026/02/more-baristas-focusing-on-milk-temperature-coffee-shops/"}, "img": "milch", "topic": "Milch", "case": {"title": "Fall · Sojadrink flockt", "facts": ["Sojadrink auf 70 °C gedampft", "Im Cappuccino bilden sich Flocken", "Gast bestellt gleich noch einen"]}, "st": 10}, {"id": "b1-163", "mode": "barista", "level": 1, "type": "mc", "q": "Was solltest du vor einer Verkostung meiden?", "options": ["Sehr scharfes, salziges oder süßes Essen", "Ein Glas stilles Wasser", "Ausreichend Schlaf in der Nacht", "Ein ruhiges, geruchsneutrales Umfeld"], "correct": 0, "explain": "Sehr scharfe, salzige oder süße Speisen dämpfen die Empfindlichkeit für feine Geschmäcker und sollten vor dem Verkosten gemieden werden.", "source": {"title": "Perfect Daily Grind – Coffee Cupping: How to Use Solutions to Improve Your Palate", "url": "https://perfectdailygrind.com/2018/03/coffee-cupping-how-to-use-solutions-to-improve-your-palate/"}, "img": "tasse", "topic": "Sensorik", "st": 3}, {"id": "b1-165", "mode": "barista", "level": 1, "type": "mc", "q": "Was tust du kurz bevor du den gefüllten Siebträger einspannst?", "options": ["Die Dampflanze kurz in Milch tauchen", "Die Maschine einmal aus- und anschalten", "Das Duschsieb mit einem Tuch trocken reiben", "Kurz Wasser durch die Brühgruppe laufen lassen"], "correct": 3, "explain": "Ein kurzer Spülstoß durch die Gruppe entfernt Kaffeereste und bringt frisches Wasser in die Gruppe; laut NCA kann dabei kurz Dampf austreten.", "source": {"title": "NCA – Espresso", "url": "https://www.aboutcoffee.org/brewing/espresso/"}, "img": "espresso", "topic": "Espresso", "st": 5}, {"id": "b1-166", "mode": "barista", "level": 1, "type": "mc", "q": "Welchen Mahlgrad empfiehlt CHEMEX für seine Karaffe?", "options": ["Mittelgrob", "Pulverfein", "Fein wie für Espresso", "Sehr grob wie Kies"], "correct": 0, "explain": "CHEMEX empfiehlt mittelgrobes Mahlgut, damit der dicke Filter nicht verstopft und der Durchfluss nicht zu langsam wird.", "source": {"title": "CHEMEX – Filter Series Info and Support", "url": "https://chemexcoffeemaker.com/pages/filter-series-support-page"}, "img": "muehle", "topic": "Mahlgrad", "st": 9}, {"id": "b1-167", "mode": "barista", "level": 1, "type": "mc", "q": "Was tust du laut NCA mit gerade gekochtem Wasser vor dem Handaufguss?", "options": ["Sofort kochend aufgießen", "Etwa eine Minute stehen lassen", "Mit Eiswürfeln herunterkühlen", "Zehn Minuten weiterkochen lassen"], "correct": 1, "explain": "Die NCA nennt 93 ± 3 °C als Brühtemperatur; dazu lässt man frisch gekochtes Wasser etwa eine Minute ruhen.", "source": {"title": "NCA – Pour-over Coffee", "url": "https://www.aboutcoffee.org/brewing/pour-over-coffee/"}, "img": "filter", "topic": "Filter", "st": 10}, {"id": "b1-168", "mode": "barista", "level": 1, "type": "mc", "q": "Wie viel Kaffee kaufst du laut NCA am besten auf einmal?", "options": ["So viel wie für etwa ein halbes Jahr", "So viel wie für etwa ein bis zwei Wochen", "Immer genau ein Kilogramm am Stück", "So viel, wie ins Gefrierfach passt"], "correct": 1, "explain": "Die NCA empfiehlt, frisch gerösteten Kaffee in kleineren Mengen für ein bis zwei Wochen zu kaufen und erst kurz vor dem Brühen zu mahlen.", "source": {"title": "NCA – Storage and Shelf Life", "url": "https://www.aboutcoffee.org/beans/storage-and-shelf-life/"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 10}, {"id": "b1-169", "mode": "barista", "level": 1, "type": "mc", "q": "In welchem Temperaturbereich vermehren sich Bakterien in Milch besonders?", "options": ["Etwa zwischen 70 und 90 °C", "Nur unter 0 °C im Gefrierfach", "Nur über 100 °C beim Kochen", "Etwa zwischen 5 und 60 °C"], "correct": 3, "explain": "Bakterien in Milch vermehren sich zwischen etwa 5 °C und 60 °C – darum gehört Milch gekühlt und angewärmte Milch wird verworfen.", "source": {"title": "Perfect Daily Grind – Reducing Your Coffee Shop's Milk Waste", "url": "https://perfectdailygrind.com/2020/07/reducing-your-coffee-shops-milk-waste/"}, "img": "milch", "topic": "Milch", "st": 10}, {"id": "b1-170", "mode": "barista", "level": 1, "type": "mc", "q": "Womit füllst du laut Kaffeemacher den Kessel der Mokkakanne?", "options": ["Mit kaltem Wasser direkt aus dem Hahn", "Mit heißem Wasser aus dem Wasserkocher", "Mit Eiswasser für eine langsame Extraktion", "Mit Mineralwasser mit viel Kohlensäure"], "correct": 1, "explain": "Kaffeemacher empfiehlt heißes Wasser aus dem Wasserkocher: Das spart Zeit und verbessert den Kaffee. Gefüllt wird bis knapp unter das Sicherheitsventil.", "source": {"title": "Kaffeemacher – Espressokocher (Mokka-Kanne): Anleitung und Tipps", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/espressokocher-mokka-kanne"}, "img": "filter", "topic": "Filter", "st": 10}, {"id": "b2-101", "mode": "barista", "level": 2, "type": "case", "q": "Wie viel heißes Wasser gießt du auf?", "options": ["Etwa 325 g, das Eis zählt mit", "Etwa 500 g, das Eis zählt nicht", "Etwa 675 g, das Eis kommt dazu", "Etwa 175 g, wie das Eis selbst"], "correct": 0, "explain": "Bei Flash Brew zählt das Eis zum Brühwasser: Heißwasser plus Eis ergeben das Gesamtgewicht. Hier 325 g Wasser plus 175 g Eis für 500 g Getränk.", "source": {"title": "Perfect Daily Grind – What is flash brew coffee?", "url": "https://perfectdailygrind.com/2022/03/what-is-flash-brew-coffee/"}, "img": "filter", "topic": "Filter", "case": {"title": "Fall · Flash Brew", "facts": ["30 g Kaffee, Ziel 500 g Getränk", "175 g Eis liegen in der Karaffe", "V60, Wasser 90–96 °C"]}, "st": 9}, {"id": "b2-102", "mode": "barista", "level": 2, "type": "mc", "q": "Welchen Anteil am gesamten Brühwasser macht das Eis bei Flash Brew meist aus?", "options": ["Etwa 5–10 %", "Etwa 60–70 %", "Etwa 90 %", "Etwa 30–40 %"], "correct": 3, "explain": "Baristas nehmen meist 30–40 % Eis (z. B. 65 % heiß, 35 % Eis). Mehr Eis bedeutet zu wenig heißes Wasser für eine ausreichende Extraktion.", "source": {"title": "Perfect Daily Grind – What is flash brew coffee?", "url": "https://perfectdailygrind.com/2022/03/what-is-flash-brew-coffee/"}, "img": "filter", "topic": "Filter", "st": 6}, {"id": "b2-103", "mode": "barista", "level": 2, "type": "mc", "q": "Was ändert sich, wenn Cold Brew im Kühlschrank statt bei Raumtemperatur zieht?", "options": ["Langsamere Extraktion, klareres Ergebnis", "Schnellere Extraktion, trüberes Ergebnis", "Keine Extraktion, nur kalte Lösung", "Gleiche Extraktion, mehr Bitterkeit"], "correct": 0, "explain": "Im Kühlschrank extrahiert Cold Brew langsamer und kontrollierter und wird klarer; bei Raumtemperatur geht es etwas schneller.", "source": {"title": "Kaffeemacher – Cold Brew selber machen: Anleitung & Verhältnis", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/cold-brew"}, "img": "filter", "topic": "Filter", "st": 2}, {"id": "b2-104", "mode": "barista", "level": 2, "type": "mc", "q": "Was bringt es, Cold Brew deutlich länger als 24 Stunden ziehen zu lassen?", "options": ["Deutlich mehr Süße und weniger Bitterkeit", "Doppelt so viel Koffein und mehr Säure", "Kaum mehr Extraktion, aber mehr Bitterkeit", "Eine längere Haltbarkeit im Kühlschrank"], "correct": 2, "explain": "Kaffeemacher nennt 12–16 Stunden als Grundrezept und höchstens 24 Stunden; länger bringt kaum Extraktion, aber mehr Bitterkeit.", "source": {"title": "Kaffeemacher – Cold Brew selber machen: Anleitung & Verhältnis", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/cold-brew"}, "img": "filter", "topic": "Filter", "st": 2}, {"id": "b2-105", "mode": "barista", "level": 2, "type": "mc", "q": "Hat Cold Brew grundsätzlich zwei- bis dreimal so viel Koffein wie heißer Kaffee?", "options": ["Ja, kaltes Wasser löst Koffein deutlich besser", "Ja, weil Cold Brew immer aus Robusta gemacht wird", "Nein, das hängt vor allem von Rezept und Verdünnung ab", "Nein, Cold Brew enthält praktisch gar kein Koffein"], "correct": 2, "explain": "Pauschal stimmt das nicht: Unverdünntes Konzentrat liefert mehr Koffein, auf Trinkstärke verdünnt gleicht sich das weitgehend aus.", "source": {"title": "Kaffeemacher – Cold Brew selber machen: Anleitung & Verhältnis", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/cold-brew"}, "img": "filter", "topic": "Filter", "st": 5}, {"id": "b2-106", "mode": "barista", "level": 2, "type": "mc", "q": "Wie lange hält sich Cold-Brew-Konzentrat im Kühlschrank laut Kaffeemacher etwa?", "options": ["Etwa 5–7 Tage", "Etwa 5–7 Stunden", "Etwa 5–7 Wochen", "Etwa 5–7 Monate"], "correct": 0, "explain": "Laut Kaffeemacher hält sich Konzentrat gekühlt etwa 5–7 Tage, trinkfertiger Cold Brew nur etwa 2–3 Tage.", "source": {"title": "Kaffeemacher – Cold Brew selber machen: Anleitung & Verhältnis", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/cold-brew"}, "img": "filter", "topic": "Filter", "st": 7}, {"id": "b2-107", "mode": "barista", "level": 2, "type": "case", "q": "Warum zischt das Sicherheitsventil der Mokkakanne?", "options": ["Zu wenig Wasser im unteren Kessel", "Mehl zu grob gemahlen und zu locker", "Kanne zu früh vom Herd genommen", "Mehl zu fein oder zu fest, Hitze zu hoch"], "correct": 3, "explain": "Kann das Wasser nicht durch den Filter, steigt der Druck schnell – etwa bei zu feinem oder festgedrücktem Mehl oder zu starker Hitze. Dann öffnet das Ventil.", "source": {"title": "Bialetti – The Moka valve: a tiny component of remarkable importance", "url": "https://www.bialetti.com/it_en/inspiration/post/the-moka-valve-a-tiny-component-of-remarkable-importance"}, "img": "filter", "topic": "Filter", "case": {"title": "Fall · Ventil zischt", "facts": ["Mokkakanne auf höchster Stufe", "Mehl fein gemahlen und angedrückt", "Aus dem Sicherheitsventil zischt Dampf, oben kommt kaum Kaffee"]}, "st": 6}, {"id": "b2-108", "mode": "barista", "level": 2, "type": "mc", "q": "Wie pflegst du das Sicherheitsventil einer Mokkakanne?", "options": ["Mit Öl einreiben, damit es nicht klemmt", "Mit heißem Wasser spülen und den Stift bewegen", "Mit Klebeband abdichten, damit es dicht bleibt", "Gar nicht, es ist wartungsfrei verschlossen"], "correct": 1, "explain": "Bialetti rät, das Ventil regelmäßig mit heißem Wasser zu spülen und dabei den herausstehenden Stift entlang seiner Achse zu bewegen – so setzt sich kein Kalk fest.", "source": {"title": "Bialetti – The Moka valve: a tiny component of remarkable importance", "url": "https://www.bialetti.com/it_en/inspiration/post/the-moka-valve-a-tiny-component-of-remarkable-importance"}, "img": "filter", "topic": "Pflege", "st": 4}, {"id": "b2-109", "mode": "barista", "level": 2, "type": "mc", "q": "Was drückt beim Siphon (Vakuumkanne) das Wasser nach oben?", "options": ["Eine kleine Pumpe im Sockel des Siphons", "Unterdruck im oberen, offenen Glaskolben", "Dampfdruck im geschlossenen unteren Kolben", "Der Druck des Brenners auf den Glasboden"], "correct": 2, "explain": "Der eingeschlossene Dampf drückt das Wasser durch das Steigrohr nach oben. Nimmt man die Hitze weg, kondensiert er und der Kaffee wird wieder nach unten gezogen.", "source": {"title": "Barista Hustle – The Science Behind Syphons", "url": "https://www.baristahustle.com/lesson/im-4-07-the-science-behind-syphons/"}, "img": "filter", "topic": "Filter", "st": 4}, {"id": "b2-110", "mode": "barista", "level": 2, "type": "mc", "q": "Warum brüht man die AeroPress „inverted“ (umgedreht)?", "options": ["Damit der Kaffee unter mehr Druck extrahiert", "Damit während des Ziehens nichts durchtropft", "Damit kein Papierfilter nötig ist", "Damit das Wasser heißer bleibt"], "correct": 1, "explain": "Umgedreht kann kein Kaffee vorzeitig durch den Filter laufen, die Ziehzeit lässt sich genauer steuern. Kritisch ist das Umdrehen vor dem Pressen.", "source": {"title": "Kaffeemacher – AeroPress Guide: Standardrezept, Inverted & Bypass", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/aeropress-guide"}, "img": "filter", "topic": "Filter", "st": 1}, {"id": "b2-111", "mode": "barista", "level": 2, "type": "mc", "q": "Was bedeutet „Bypass“ bei der AeroPress?", "options": ["Das Wasser läuft am Filterpapier vorbei", "Der Kaffee wird ein zweites Mal gepresst", "Ein Konzentrat wird mit heißem Wasser verdünnt", "Der Filter wird vorher kalt durchgespült"], "correct": 2, "explain": "Beim Bypass brüht man ein starkes Konzentrat und verdünnt es danach mit heißem Wasser – bei vielen Siegerrezepten der World AeroPress Championship üblich.", "source": {"title": "Kaffeemacher – AeroPress Guide: Standardrezept, Inverted & Bypass", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/aeropress-guide"}, "img": "filter", "topic": "Filter", "st": 8}, {"id": "b2-112", "mode": "barista", "level": 2, "type": "mc", "q": "Wie setzt du den gefalteten Chemex-Filter richtig ein?", "options": ["Die einlagige Seite zum Ausguss", "Die dreilagige Seite zum Griff", "Die dreilagige Seite zum Ausguss", "Egal, beide Seiten sind gleich"], "correct": 2, "explain": "Die dreilagige Seite gehört an den Ausguss: Das stabilisiert den Filter dort und verhindert, dass er sich ansaugt und die Luftzufuhr blockiert.", "source": {"title": "CHEMEX – Filter Series Info and Support", "url": "https://chemexcoffeemaker.com/pages/filter-series-support-page"}, "img": "filter", "topic": "Filter", "st": 3}, {"id": "b2-113", "mode": "barista", "level": 2, "type": "mc", "q": "Wie pflegt man laut NCA einen Stofffilter für den Handaufguss?", "options": ["Alle 6–8 Wochen in Wasser auskochen", "Nach jedem Brühen in die Spülmaschine geben", "Einmal pro Jahr mit Entkalker durchspülen", "Nach jedem Brühen mit Spülmittel einweichen"], "correct": 0, "explain": "Die NCA empfiehlt, Stofffilter alle 6–8 Wochen 10 Minuten in frischem Wasser auszukochen; Stoff liegt im Ergebnis zwischen Papier und Metall.", "source": {"title": "NCA – Pour-over Coffee", "url": "https://www.aboutcoffee.org/brewing/pour-over-coffee/"}, "img": "filter", "topic": "Pflege", "st": 9}, {"id": "b2-114", "mode": "barista", "level": 2, "type": "mc", "q": "Was unterscheidet eine Rotationspumpe von einer Vibrationspumpe?", "options": ["Lauter, schwankender Druck, kurzlebiger", "Kleiner, günstiger, leichter zu tauschen", "Leiser, gleichmäßiger Druck, langlebiger", "Kein Unterschied, nur ein anderer Name"], "correct": 2, "explain": "Rotationspumpen laufen leiser, liefern gleichmäßigeren Druck und halten oft 15+ Jahre; Vibrationspumpen sind kompakt, günstig und halten etwa 5–7 Jahre.", "source": {"title": "Clive Coffee – How Do Espresso Machines Work?", "url": "https://clivecoffee.com/blogs/learn/how-do-espresso-machines-work"}, "img": "espresso", "topic": "Espresso", "st": 9}, {"id": "b2-115", "mode": "barista", "level": 2, "type": "mc", "q": "Was kann ein PID-Regler, was ein Pressostat nicht kann?", "options": ["Den Pumpendruck während des Bezugs steuern", "Die Temperatur gradgenau einstellbar regeln", "Die Brühgruppe automatisch rückspülen", "Den Wasserstand im Kessel messen"], "correct": 1, "explain": "Ein PID liest einen Temperaturfühler und taktet das Heizelement; die Temperatur lässt sich in 1-Grad-Schritten einstellen. Ein Pressostat ist günstig, aber ungenauer.", "source": {"title": "Clive Coffee – How Do Espresso Machines Work?", "url": "https://clivecoffee.com/blogs/learn/how-do-espresso-machines-work"}, "img": "espresso", "topic": "Espresso", "st": 8}, {"id": "b2-116", "mode": "barista", "level": 2, "type": "case", "q": "Was tust du an der HX-Maschine vor dem nächsten Bezug?", "options": ["Etwas Wasser aus der Gruppe ablassen", "Die Maschine zum Abkühlen ausschalten", "Die Mühle zwei Stufen feiner stellen", "Den Shot einfach kürzer laufen lassen"], "correct": 0, "explain": "Bei Zweikreisern steht das Brühwasser im Wärmetauscher im heißen Dampfkessel und überhitzt in Pausen. Kurzes Spülen („Temperature Surfing“) bringt es auf Brühtemperatur.", "source": {"title": "Clive Coffee – How Do Espresso Machines Work?", "url": "https://clivecoffee.com/blogs/learn/how-do-espresso-machines-work"}, "img": "espresso", "topic": "Espresso", "case": {"title": "Fall · Zweikreiser nach der Pause", "facts": ["HX-Maschine, 20 Minuten kein Bezug", "Beim Spülen zischt und sprudelt das Wasser", "Erster Shot schmeckt verbrannt-bitter"]}, "st": 10}, {"id": "b2-117", "mode": "barista", "level": 2, "type": "mc", "q": "Wie steuerst du die Präinfusion an einer klassischen E61-Gruppe?", "options": ["Über einen Regler am Dampfkessel", "Über die Stellung des Brühhebels", "Über den Anpressdruck beim Tampen", "Gar nicht, sie ist immer gleich lang"], "correct": 1, "explain": "Bei der E61 bestimmt der Barista mit dem Hebel, wie lange die Präinfusion dauert; gesättigte Gruppen steuern sie über die Elektronik.", "source": {"title": "Clive Coffee – How Do Espresso Machines Work?", "url": "https://clivecoffee.com/blogs/learn/how-do-espresso-machines-work"}, "img": "espresso", "topic": "Espresso", "st": 3}, {"id": "b2-118", "mode": "barista", "level": 2, "type": "mc", "q": "Wie oft wird die Brühgruppendichtung einer Siebträgermaschine etwa getauscht?", "options": ["Etwa wöchentlich bei normaler Nutzung", "Etwa jährlich oder wenn sie hart wird", "Etwa alle zehn Jahre, sonst nie", "Nur nach jedem Entkalken des Kessels"], "correct": 1, "explain": "Seattle Coffee Gear rät, die Dichtung alle 3–6 Monate zu prüfen und etwa jährlich zu tauschen – früher, wenn sie rissig, flach oder hart wird.", "source": {"title": "Seattle Coffee Gear – Espresso Machine Maintenance Schedule", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/espresso-machine-maintenance-schedule"}, "img": "espresso", "topic": "Pflege", "st": 4}, {"id": "b2-119", "mode": "barista", "level": 2, "type": "mc", "q": "Woran merkst du, dass eine Maschine früher entkalkt werden sollte?", "options": ["Die Crema wird dunkler und deutlich dicker", "Der Espresso schmeckt plötzlich deutlich süßer", "Das Manometer zeigt plötzlich mehr als 9 bar", "Der Durchfluss wird langsamer, Bezüge dauern länger"], "correct": 3, "explain": "Bei hartem Wasser oder wenn der Durchfluss nachlässt und Bezüge länger dauern, sollte öfter entkalkt werden – nach Herstelleranleitung.", "source": {"title": "Seattle Coffee Gear – Espresso Machine Maintenance Schedule", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/espresso-machine-maintenance-schedule"}, "img": "wasser", "topic": "Pflege", "st": 2}, {"id": "b2-120", "mode": "barista", "level": 2, "type": "mc", "q": "Was tust du direkt nach dem Durchmahlen von Reinigungstabs in der Mühle?", "options": ["Die Mühle zwei Stunden ruhen lassen", "Einige Gramm Bohnen nachmahlen und verwerfen", "Den Mahlgrad auf ganz grob stellen", "Den Bohnenbehälter mit Wasser ausspülen"], "correct": 1, "explain": "Die Tabs binden Öle und schieben altes Mehl heraus; danach mahlt man einige Gramm Bohnen nach, um Reste der Tabs zu entfernen.", "source": {"title": "Perfect Daily Grind – Cleaning and maintaining your coffee grinder", "url": "https://perfectdailygrind.com/2021/11/cleaning-and-maintaining-your-coffee-grinder/"}, "img": "muehle", "topic": "Pflege", "st": 4}, {"id": "b2-121", "mode": "barista", "level": 2, "type": "mc", "q": "Welchen Vorteil haben größere Mahlscheiben?", "options": ["Sie mahlen schneller und mit weniger Wärme", "Sie mahlen langsamer und mit mehr Wärme", "Sie mahlen nur gröber, nie für Espresso", "Sie brauchen nie gereinigt zu werden"], "correct": 0, "explain": "Größere Mahlscheiben mahlen schneller, mit weniger Wärme, Reibung und Statik; größer ist aber nicht automatisch besser.", "source": {"title": "Clive Coffee – How to Choose an Espresso Grinder", "url": "https://clivecoffee.com/blogs/learn/how-to-choose-a-grinder"}, "img": "muehle", "topic": "Mahlgrad", "st": 3}, {"id": "b2-122", "mode": "barista", "level": 2, "type": "mc", "q": "Wie dick sollten WDT-Nadeln laut Barista Hustle höchstens sein?", "options": ["Etwa 2–3 mm", "Etwa 4–5 mm", "Unter etwa 1 mm", "Wie ein Zahnstocher"], "correct": 2, "explain": "Tests von Barista Hustle zeigten, dass alles über 1 mm Durchmesser kontraproduktiv ist – ein Zahnstocher ist also ungeeignet.", "source": {"title": "Barista Hustle – Should we all be using the Weiss Distribution Technique again?", "url": "https://www.baristahustle.com/?p=345144"}, "img": "tamper", "topic": "Espresso", "st": 6}, {"id": "b2-123", "mode": "barista", "level": 2, "type": "mc", "q": "Wie schmeckt ein Espresso mit starkem Channeling typischerweise?", "options": ["Besonders süß und ausgewogen", "Nur sehr mild und neutral", "Nur leicht salzig, sonst rund", "Gleichzeitig sauer und bitter"], "correct": 3, "explain": "Durch die Kanäle wird ein Teil des Pucks überextrahiert, der Rest unterextrahiert – die Tasse schmeckt sauer und bitter zugleich.", "source": {"title": "Perfect Daily Grind – What is channeling and how does it affect espresso extraction?", "url": "https://perfectdailygrind.com/2022/03/what-is-channeling-espresso-extraction/"}, "img": "espresso", "topic": "Extraktion", "st": 1}, {"id": "b2-124", "mode": "barista", "level": 2, "type": "case", "q": "Woher kommt der Abdruck des Duschsiebs im Puck?", "options": ["Zu niedrig dosiert, zu viel Headspace", "Zu hoch dosiert, zu wenig Headspace", "Zu grob gemahlen für das Sieb", "Zu kaltes Brühwasser in der Gruppe"], "correct": 1, "explain": "Bei Überdosierung bleibt zu wenig Platz zum Duschsieb; das Wasser kann den Puck aufbrechen und Kanäle bilden. Die Dosis sollte zur Siebgröße passen.", "source": {"title": "Perfect Daily Grind – What is channeling and how does it affect espresso extraction?", "url": "https://perfectdailygrind.com/2022/03/what-is-channeling-espresso-extraction/"}, "img": "espresso", "topic": "Espresso", "case": {"title": "Fall · Abdruck im Puck", "facts": ["18-g-Sieb, 22 g Kaffee eingefüllt", "Duschsieb hinterlässt einen Abdruck im Puck", "Nackter Siebträger zeigt mehrere schräge Strahlen"]}, "st": 9}, {"id": "b2-125", "mode": "barista", "level": 2, "type": "mc", "q": "Welche Dosis passt etwa in ein 18-g-Präzisionssieb?", "options": ["Etwa 10–12 g", "Etwa 24–28 g", "Etwa 16–20 g", "Genau 18,0 g"], "correct": 2, "explain": "Ein 18-g-Sieb nimmt etwa 16–20 g Kaffee auf; außerhalb dieses Bereichs leidet die Präinfusion.", "source": {"title": "Perfect Daily Grind – A Guide To Dialling In Espresso", "url": "https://perfectdailygrind.com/2020/07/a-guide-to-dialling-in-espresso/"}, "img": "espresso", "topic": "Espresso", "st": 6}, {"id": "b2-126", "mode": "barista", "level": 2, "type": "case", "q": "Was bedeutet der nasse Puck?", "options": ["Der Shot war stark überextrahiert", "Das Duschsieb ist undicht geworden", "Die Pumpe liefert zu wenig Druck", "Nichts Schlimmes, Restwasser im Sieb"], "correct": 3, "explain": "Ein nasser Puck ist laut Barista Hustle kein Fehler: Wasser über, im und unter dem Puck wird beim Druckabbau nicht herausgedrückt. Mehr Headspace oder weniger Dosis machen ihn nasser.", "source": {"title": "Barista Hustle – For a good puck", "url": "https://www.baristahustle.com/for-a-good-puck/"}, "img": "espresso", "topic": "Espresso", "case": {"title": "Fall · Nasser Puck", "facts": ["Shot schmeckt süß und ausgewogen", "Nach dem Ausspannen steht Wasser auf dem Puck", "Puck ist matschig statt fest"]}, "st": 9}, {"id": "b2-127", "mode": "barista", "level": 2, "type": "mc", "q": "In welcher Reihenfolge stellst du beim Dialing-in die Parameter ein?", "options": ["Erst Dosis, dann Getränkemenge, dann Zeit", "Erst Zeit, dann Dosis, dann Getränkemenge", "Erst Getränkemenge, dann Zeit, dann Dosis", "Alle drei Werte immer gleichzeitig"], "correct": 0, "explain": "Perfect Daily Grind empfiehlt: Dosis zuerst festlegen, dann die Getränkemenge (Yield), zuletzt die Bezugszeit über den Mahlgrad.", "source": {"title": "Perfect Daily Grind – A Guide To Dialling In Espresso", "url": "https://perfectdailygrind.com/2020/07/a-guide-to-dialling-in-espresso/"}, "img": "espresso", "topic": "Espresso", "st": 9}, {"id": "b2-128", "mode": "barista", "level": 2, "type": "case", "q": "Wie korrigierst du den sauren, kurzen Shot?", "options": ["Gröber mahlen oder weniger Getränk ziehen", "Feiner mahlen oder mehr Getränk ziehen", "Dosis senken und kürzer beziehen", "Brühtemperatur deutlich senken"], "correct": 1, "explain": "Saure oder salzige Noten, fehlende Süße und ein kurzer Abgang zeigen Unterextraktion – mehr Yield oder feiner mahlen erhöht die Extraktion.", "source": {"title": "Perfect Daily Grind – A Guide To Dialling In Espresso", "url": "https://perfectdailygrind.com/2020/07/a-guide-to-dialling-in-espresso/"}, "img": "espresso", "topic": "Extraktion", "case": {"title": "Fall · Kurzer Abgang", "facts": ["18 g in, 32 g out in 19 Sekunden", "Tasse schmeckt sauer und leicht salzig", "Kaum Süße, kurzer Abgang"]}, "st": 5}, {"id": "b2-129", "mode": "barista", "level": 2, "type": "mc", "q": "Wie schmecken kurze Bezüge im Vergleich zu langen tendenziell?", "options": ["Säuerlicher und mit weniger Körper", "Süßer und mit deutlich mehr Körper", "Bitterer und mit deutlich mehr Körper", "Genauso, die Zeit ist geschmacksneutral"], "correct": 0, "explain": "Kurze Bezüge sind oft säuerlicher und dünner, lange eher süßer und bitterer.", "source": {"title": "Perfect Daily Grind – A Guide To Dialling In Espresso", "url": "https://perfectdailygrind.com/2020/07/a-guide-to-dialling-in-espresso/"}, "img": "espresso", "topic": "Espresso", "st": 1}, {"id": "b2-130", "mode": "barista", "level": 2, "type": "mc", "q": "Welche Röstung gibt ihr CO₂ schneller ab?", "options": ["Helle Röstung", "Beide gleich schnell", "Dunkle Röstung", "Nur grüner Rohkaffee"], "correct": 2, "explain": "Dunkle Röstungen entgasen schneller: Mehr Zucker ist umgewandelt, und mehr Mikrorisse lassen das CO₂ entweichen. Helle Röstungen brauchen oft länger.", "source": {"title": "Perfect Daily Grind – Coffee Degassing: What Does It Mean For Brewers & Roasters?", "url": "https://perfectdailygrind.com/2019/01/why-does-coffee-degas-what-does-it-mean-for-brewers-roasters/"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 3}, {"id": "b2-131", "mode": "barista", "level": 2, "type": "mc", "q": "Was ergab der Barista-Hustle-Test mit über ein Jahr tiefgefrorenem Kaffee?", "options": ["Der Kaffee war nach einem Jahr ungenießbar", "Nur kleine Unterschiede zum frischeren Kaffee", "Der gefrorene Kaffee schmeckte deutlich besser", "Die Bohnen ließen sich nicht mehr mahlen"], "correct": 1, "explain": "Vakuumiert eingefrorener Kaffee zeigte nach 15 Monaten nur kleine, nicht signifikante Unterschiede; das Fazit: Einfrieren hält Kaffee mindestens ein Jahr gut.", "source": {"title": "Barista Hustle – A Year in the Deep Freeze", "url": "https://www.baristahustle.com/a-year-in-the-deep-freeze/"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 5}, {"id": "b2-132", "mode": "barista", "level": 2, "type": "mc", "q": "Du bereitest eine Bestellung mit Espresso und Milchgetränken zu. Was machst du zuletzt?", "options": ["Die Milchgetränke", "Den Milchschaum", "Die puren Espressi", "Das Abwiegen der Dosis"], "correct": 2, "explain": "Kaffeeöle bauen die Crema schnell ab; bei Gruppenbestellungen bereitet man die puren Espressi deshalb als Letztes zu.", "source": {"title": "Barista Hustle – Espresso Size and Strength", "url": "https://www.baristahustle.com/lesson/b1-6-01-espresso-size-and-strength/"}, "img": "espresso", "topic": "Espresso", "st": 1}, {"id": "b2-133", "mode": "barista", "level": 2, "type": "mc", "q": "Bis etwa zu welcher Milchtemperatur sollte das Lufteinziehen abgeschlossen sein?", "options": ["Bis etwa 37–38 °C", "Bis etwa 15–20 °C", "Bis etwa 55–60 °C", "Bis etwa 65–70 °C"], "correct": 0, "explain": "Die Belüftung sollte vor etwa 38 °C abgeschlossen sein; danach lassen sich große Blasen kaum noch zu Mikroschaum verarbeiten.", "source": {"title": "Perfect Daily Grind – Why does milk foam disintegrate?", "url": "https://perfectdailygrind.com/2021/01/why-does-milk-foam-disintegrate/"}, "img": "milch", "topic": "Milch", "st": 7}, {"id": "b2-134", "mode": "barista", "level": 2, "type": "case", "q": "Wann stoppst du den Dampf?", "options": ["Erst wenn das Thermometer 60 °C zeigt", "Etwas vor der Zielanzeige von 60 °C", "Erst bei einer Anzeige von 65 °C", "Wenn das Kännchen hörbar zu brodeln beginnt"], "correct": 1, "explain": "Digitale Fühler zeigen mit kurzer Verzögerung an; die Milch kann beim Abschalten 2–3 °C heißer sein als angezeigt. Darum kurz vor dem Ziel stoppen.", "source": {"title": "Barista Hustle – Temperature Targets", "url": "https://www.baristahustle.com/lesson/b1-4-03-temperature-targets/"}, "img": "milch", "topic": "Milch", "case": {"title": "Fall · Digitales Thermometer", "facts": ["Ziel: 60 °C im Kännchen", "Digitaler Fühler hängt am Kännchen", "Gäste beschweren sich über zu heiße Getränke"]}, "st": 9}, {"id": "b2-135", "mode": "barista", "level": 2, "type": "mc", "q": "Was sind laut Perfect Daily Grind die Hauptursachen für Milchverschwendung im Café?", "options": ["Zu viel Milch pro Getränk und Remakes", "Verschüttete Milch und falsche Lagerung", "Abgelaufene Milch und defekte Kühlung", "Zu kleine Kännchen und zu kalte Milch"], "correct": 0, "explain": "Nicht Verschütten oder Verderb, sondern zu viel aufgeschäumte Milch pro Getränk und neu gemachte Getränke sind die größten Faktoren.", "source": {"title": "Perfect Daily Grind – Reducing Your Coffee Shop's Milk Waste", "url": "https://perfectdailygrind.com/2020/07/reducing-your-coffee-shops-milk-waste/"}, "img": "milch", "topic": "Milch", "st": 9}, {"id": "b2-136", "mode": "barista", "level": 2, "type": "mc", "q": "Wie verhält sich Sojadrink beim Aufschäumen im Vergleich zu Kuhmilch?", "options": ["Er schäumt durch wenig Eiweiß kaum auf", "Er braucht doppelt so lange zum Schäumen", "Er schäumt durch viel Eiweiß schnell auf", "Er schäumt nur bei über 80 °C richtig"], "correct": 2, "explain": "Sojadrink hat viel Eiweiß, lässt sich gut belüften und schäumt etwa doppelt so schnell wie Kuhmilch – also früh vorsichtig Luft ziehen.", "source": {"title": "Perfect Daily Grind – A Guide To Working With Plant Milks", "url": "https://perfectdailygrind.com/2020/08/a-guide-to-working-with-plant-milks/"}, "img": "milch", "topic": "Milch", "st": 4}, {"id": "b2-137", "mode": "barista", "level": 2, "type": "mc", "q": "Was gilt für Mikroschaum aus Mandeldrink?", "options": ["Er ist sehr fest und hält stundenlang", "Er ist dick und braucht lange Ruhezeit", "Er schäumt nur ganz ohne Luftzufuhr", "Er ist dünn und zerfällt schnell – zügig gießen"], "correct": 3, "explain": "Mandeldrink hat wenig Eiweiß und ergibt dünneren Schaum, der schnell zerfällt – also sofort und sanft gießen.", "source": {"title": "Perfect Daily Grind – A Guide To Working With Plant Milks", "url": "https://perfectdailygrind.com/2020/08/a-guide-to-working-with-plant-milks/"}, "img": "milch", "topic": "Milch", "st": 3}, {"id": "b2-138", "mode": "barista", "level": 2, "type": "mc", "q": "Was droht, wenn Kuhmilch über etwa 70 °C gedampft wird?", "options": ["Unangenehm gekochter, verbrannter Geschmack", "Deutlich mehr Süße und feinerer Schaum", "Mehr Koffein aus dem Espresso gelöst", "Die Milch gefriert danach schneller"], "correct": 0, "explain": "Über 70 °C kann Laktose karamellisieren oder verbrennen und der Geschmack wird unangenehm; für 3-%-Milch gelten etwa 60–65 °C als Obergrenze.", "source": {"title": "Perfect Daily Grind – Why more baristas are focusing on milk temperature", "url": "https://perfectdailygrind.com/2026/02/more-baristas-focusing-on-milk-temperature-coffee-shops/"}, "img": "milch", "topic": "Milch", "st": 1}, {"id": "b2-139", "mode": "barista", "level": 2, "type": "mc", "q": "Was bewirkt das Homogenisieren der Milch?", "options": ["Es entfernt den Milchzucker vollständig", "Es verteilt das Fett in kleinen, gleichmäßigen Tröpfchen", "Es tötet alle Keime durch starkes Erhitzen ab", "Es trennt das Eiweiß vollständig vom Fett"], "correct": 1, "explain": "Beim Homogenisieren werden Fettkügelchen in gleichmäßige kleine Tröpfchen zerteilt, die sich fein in der Milch verteilen.", "source": {"title": "Clive Coffee – The Science Behind Perfect Steamed Milk", "url": "https://clivecoffee.com/blogs/learn/the-science-behind-perfect-steamed-milk"}, "img": "milch", "topic": "Milch", "st": 2}, {"id": "b2-140", "mode": "barista", "level": 2, "type": "mc", "q": "Aus welcher Höhe beginnst du laut Barista Hustle das Eingießen für Latte Art etwa?", "options": ["Etwa 1 cm über der Tasse", "Etwa 10 cm über der Tasse", "Etwa 30 cm über der Tasse", "Etwa 50 cm über der Tasse"], "correct": 1, "explain": "Barista Hustle empfiehlt etwa 10 cm; aus größerer Höhe beschleunigt die Milch, der Strahl reißt ab und es entstehen Spritzer und Blasen.", "source": {"title": "Barista Hustle – Latte Art Faults", "url": "https://www.baristahustle.com/lesson/la-5-03-latte-art-faults/"}, "img": "milch", "topic": "Milch", "st": 7}, {"id": "b2-141", "mode": "barista", "level": 2, "type": "mc", "q": "Was stimmt über die Regel „ein Drittel Espresso, Milch, Schaum“ beim Cappuccino?", "options": ["Sie kam erst in den 1950er-Jahren auf", "Sie stammt von den Kapuzinermönchen", "Sie ist die heutige SCA-Definition", "Sie ist im INEI-Standard festgelegt"], "correct": 0, "explain": "Laut James Hoffmann tauchte die Drittel-Definition erst in den 1950ern auf, lange nach der Entstehung des Getränks – sie gilt als Mythos.", "source": {"title": "Perfect Daily Grind – What Is a Cappuccino & How Has It Developed Over Time?", "url": "https://perfectdailygrind.com/2020/03/what-is-a-cappuccino-how-has-it-developed-over-time/"}, "img": "milch", "topic": "Getränke", "st": 9}, {"id": "b2-142", "mode": "barista", "level": 2, "type": "mc", "q": "Wie groß ist ein Cappuccino nach SCA- und WBC-Verständnis etwa?", "options": ["Etwa 150–180 ml", "Etwa 60–80 ml", "Etwa 300–350 ml", "Etwa 450–500 ml"], "correct": 0, "explain": "SCA und WBC beschreiben 5–6 oz (rund 150–180 ml) aus einem einfachen Espresso, texturierter Milch und mindestens 1 cm Schaum.", "source": {"title": "Perfect Daily Grind – What Is a Cappuccino & How Has It Developed Over Time?", "url": "https://perfectdailygrind.com/2020/03/what-is-a-cappuccino-how-has-it-developed-over-time/"}, "img": "milch", "topic": "Getränke", "st": 6}, {"id": "b2-143", "mode": "barista", "level": 2, "type": "mc", "q": "Wobei helfen die Farben im SCA-Aromarad?", "options": ["Sie zeigen, welche Aromen Fehler sind", "Sie zeigen die Herkunft der Kaffees", "Sie geben die Intensität des Aromas an", "Sie passen zum Begriff und helfen beim Suchen"], "correct": 3, "explain": "Jeder Begriff hat eine passende Farbe. Fällt dir kein Wort ein, kannst du nach Farbe suchen – ein „bräunlicher“ Eindruck führt etwa zu Gewürz- oder Getreidenoten.", "source": {"title": "SCA – How to Use the Coffee Taster's Flavor Wheel in Eight Steps", "url": "https://sca.coffee/sca-news/how-to-use-the-flavor-wheel-in-eight-steps-ab2hy"}, "img": "rad", "topic": "Sensorik", "st": 8}, {"id": "b2-144", "mode": "barista", "level": 2, "type": "mc", "q": "Was zeigte eine Studie der Brown University zur „Zungenkarte“?", "options": ["Bitter wird nur ganz hinten auf der Zunge geschmeckt", "Süß wird nur an der Zungenspitze geschmeckt", "Sauer wird nur an den Zungenrändern geschmeckt", "Geschmacksrezeptoren sitzen über die ganze Zunge verteilt"], "correct": 3, "explain": "Die Zungenkarte ist ein Mythos: Geschmacksrezeptoren sind über die ganze Zunge verteilt, nicht festen Zonen zugeordnet.", "source": {"title": "Perfect Daily Grind – Coffee Cupping: How to Use Solutions to Improve Your Palate", "url": "https://perfectdailygrind.com/2018/03/coffee-cupping-how-to-use-solutions-to-improve-your-palate/"}, "img": "tasse", "topic": "Sensorik", "st": 5}, {"id": "b2-145", "mode": "barista", "level": 2, "type": "mc", "q": "Mit welchem Stoff trainiert man laut Perfect Daily Grind den Bittergeschmack?", "options": ["Zitronensäure aus der Drogerie", "Haushaltszucker in Wasser", "Kochsalz in Wasser", "Chininsulfat aus der Apotheke"], "correct": 3, "explain": "Für Lösungen nimmt man Zucker (süß), Salz (salzig), Zitronensäure (sauer) und Chininsulfat (bitter) – jeweils nur einen Stoff pro Lösung.", "source": {"title": "Perfect Daily Grind – Coffee Cupping: How to Use Solutions to Improve Your Palate", "url": "https://perfectdailygrind.com/2018/03/coffee-cupping-how-to-use-solutions-to-improve-your-palate/"}, "img": "tasse", "topic": "Sensorik", "st": 7}, {"id": "b2-146", "mode": "barista", "level": 2, "type": "mc", "q": "Wie viele flüchtige Aromastoffe entstehen beim Rösten etwa?", "options": ["Etwa 10", "Etwa 50", "Mehr als 900", "Mehr als 90.000"], "correct": 2, "explain": "Beim Rösten bilden sich über 900 flüchtige Aromastoffe; nur etwa 30 davon prägen Aroma und Geschmack in der Tasse deutlich.", "source": {"title": "Perfect Daily Grind – What Creates Coffee Aroma? Understanding The Chemistry", "url": "https://perfectdailygrind.com/2019/08/what-creates-coffee-aroma-understanding-the-chemistry/"}, "img": "tasse", "topic": "Sensorik", "st": 10}, {"id": "b2-147", "mode": "barista", "level": 2, "type": "mc", "q": "Warum riechen grüne Rohkaffeebohnen kaum nach Kaffee?", "options": ["Die Aromen sind im Rohkaffee eingefroren", "Die Schale der Bohne hält jeden Duft zurück", "Die Aromastoffe entstehen erst beim Rösten", "Rohkaffee enthält noch kein Wasser"], "correct": 2, "explain": "Das typische Kaffeearoma entsteht erst beim Rösten aus Vorstufen wie Kohlenhydraten, Proteinen und Säuren – Rohkaffee riecht kaum.", "source": {"title": "Perfect Daily Grind – What Creates Coffee Aroma? Understanding The Chemistry", "url": "https://perfectdailygrind.com/2019/08/what-creates-coffee-aroma-understanding-the-chemistry/"}, "img": "bohne", "topic": "Sensorik", "st": 2}, {"id": "b2-148", "mode": "barista", "level": 2, "type": "mc", "q": "Wie unterscheiden sich Arabica und Robusta laut Kaffeemacher beim Säuregehalt?", "options": ["Arabica hat mehr als Robusta", "Robusta hat mehr als Arabica", "Beide haben genau gleich viel", "Nur Robusta enthält Säuren"], "correct": 0, "explain": "Arabica enthält mehr Säure als Canephora (Robusta); zwischen den Varietäten innerhalb einer Art sind die Unterschiede gering.", "source": {"title": "Kaffeemacher – Säure im Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/acidity-in-coffee"}, "img": "bohne", "topic": "Sensorik", "st": 8}, {"id": "b2-149", "mode": "barista", "level": 2, "type": "mc", "q": "Welcher Anteil einer Kaffeebohne lässt sich etwa höchstens lösen?", "options": ["Etwa 5 %", "Etwa 60 %", "Etwa 90 %", "Etwa 30 %"], "correct": 3, "explain": "Nur etwa 30 % der Bohne sind löslich; der Rest ist Zellmaterial, das sich beim Brühen nicht löst. Messungen ergeben 28–32 %.", "source": {"title": "Kaffeemacher – Extraktion und Stärke von Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/extraction-strength-coffee"}, "img": "tasse", "topic": "Extraktion", "st": 6}, {"id": "b2-150", "mode": "barista", "level": 2, "type": "mc", "q": "Welche Getränkestärke (TDS) hat ein Espresso typischerweise?", "options": ["Etwa 1–1,5 %", "Etwa 20–25 %", "Etwa 35–40 %", "Etwa 8–10 %"], "correct": 3, "explain": "Espresso enthält etwa 8–10 % gelöste Stoffe, Filterkaffee nur etwa 1,2–1,5 %.", "source": {"title": "Kaffeemacher – Extraktion und Stärke von Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/extraction-strength-coffee"}, "img": "espresso", "topic": "Extraktion", "st": 6}, {"id": "b2-151", "mode": "barista", "level": 2, "type": "mc", "q": "Womit nullst du ein Kaffee-Refraktometer vor dem Messen?", "options": ["Mit Leitungswasser", "Mit frischem Espresso", "Mit destilliertem Wasser", "Mit Milch"], "correct": 2, "explain": "Man nullt das Gerät mit destilliertem Wasser auf 0,00 % – so werden Drift und Rückstände am Prisma ausgeschlossen.", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "tasse", "topic": "Extraktion", "st": 7}, {"id": "b2-152", "mode": "barista", "level": 2, "type": "mc", "q": "Was kann ein TDS-Meter für Wasser nicht sagen?", "options": ["Wie viel insgesamt gelöst ist", "Welche Mineralien gelöst sind", "Ob das Wasser fast rein ist", "Wie leitfähig das Wasser ist"], "correct": 1, "explain": "Das TDS-Meter misst die Leitfähigkeit und schätzt daraus die gelösten Stoffe. Welche Mineralien das sind, verrät die Zahl nicht.", "source": {"title": "Prima Coffee – Testing Your Water (SCA-Wasserstandard)", "url": "https://prima-coffee.com/blog/testing-your-water/"}, "img": "wasser", "topic": "Wasser", "st": 7}, {"id": "b2-153", "mode": "barista", "level": 2, "type": "mc", "q": "Was versteht man unter „temporärer Härte“?", "options": ["Härte, die nur im Winter auftritt", "Härte, die ein Filter dauerhaft bindet", "Härte, die beim Kochen als Kalk ausfällt", "Härte, die nur aus Natrium besteht"], "correct": 2, "explain": "Temporäre Härte fällt beim Kochen als Kalk aus und entspricht der Karbonathärte; die bleibende Härte ist der Rest (GH minus KH).", "source": {"title": "Barista Hustle – Water Hardness", "url": "https://www.baristahustle.com/water-hardness/"}, "img": "wasser", "topic": "Wasser", "st": 8}, {"id": "b2-154", "mode": "barista", "level": 2, "type": "mc", "q": "In welchem Bereich muss eine SCA-zertifizierte Filtermaschine den Kaffee warmhalten?", "options": ["Bei 60–65 °C", "Bei 90–96 °C", "Bei 80–85 °C", "Bei 70–75 °C"], "correct": 2, "explain": "Laut SCA-Standard 310 hält eine beheizte Kanne den Kaffee in den ersten 30 Minuten bei 80–85 °C; das Heizelement darf 85 °C nie überschreiten.", "source": {"title": "SCA Standard 310-2021 Home Coffee Brewers", "url": "https://sca.coffee/s/SCA_Standard_310-2021.pdf"}, "img": "filter", "topic": "Standards", "st": 10}, {"id": "b2-155", "mode": "barista", "level": 2, "type": "mc", "q": "Welcher Vorteil hat ein dickwandiges Milchkännchen aus Edelstahl?", "options": ["Es spürt jede Temperaturänderung schneller", "Es verzeiht mehr, weil es langsamer heiß wird", "Es macht die Milch deutlich süßer", "Es braucht keine Reinigung nach dem Dampfen"], "correct": 1, "explain": "Dickwandige Kännchen geben ein paar Sekunden mehr Spielraum; dünnwandige werden schneller heiß und geben direkteres Feedback.", "source": {"title": "Clive Coffee – Best Milk Pitcher for Latte Art at Home", "url": "https://clivecoffee.com/blogs/learn/best-milk-pitcher-for-latte-art-at-home-size-material-clive"}, "img": "milch", "topic": "Milch", "st": 4}, {"id": "b2-156", "mode": "barista", "level": 2, "type": "mc", "q": "Welches Kännchen nimmst du für einen Cappuccino von etwa 180 ml?", "options": ["Etwa 150 ml (5 oz)", "Etwa 600 ml (20 oz)", "Etwa 1.000 ml (34 oz)", "Etwa 350 ml (12 oz)"], "correct": 3, "explain": "Clive Coffee empfiehlt 12-oz-Kännchen für 6–8-oz-Getränke; in zu großen Kännchen ist zu wenig Milch, um die Lanze richtig einzutauchen.", "source": {"title": "Clive Coffee – Best Milk Pitcher for Latte Art at Home", "url": "https://clivecoffee.com/blogs/learn/best-milk-pitcher-for-latte-art-at-home-size-material-clive"}, "img": "milch", "topic": "Milch", "st": 7}, {"id": "b2-157", "mode": "barista", "level": 2, "type": "mc", "q": "Was bringt immer feineres Mahlen laut Barista Hustle beim Espresso?", "options": ["Immer mehr Extraktion und deutlich mehr Süße", "Immer weniger Bitterkeit und mehr Crema", "Immer kürzere Bezüge mit mehr Körper", "Oft nicht mehr Extraktion, weniger Genuss"], "correct": 3, "explain": "Feiner mahlen steigert die Extraktion nicht unbegrenzt und mindert oft den Genuss. Mehr Extraktion gelingt vor allem mit gleichmäßigerer Extraktion.", "source": {"title": "Barista Hustle – The Espresso Compass", "url": "https://www.baristahustle.com/the-espresso-compass/"}, "img": "espresso", "topic": "Extraktion", "st": 4}, {"id": "b2-158", "mode": "barista", "level": 2, "type": "mc", "q": "Was tust du etwa monatlich mit einem abnehmbaren Duschsieb?", "options": ["15–20 Minuten in Reinigerlösung einweichen", "In der Spülmaschine mit Salz reinigen", "Mit grobem Schleifpapier glatt schleifen", "Mit Speiseöl gegen Kalk einreiben"], "correct": 0, "explain": "Seattle Coffee Gear empfiehlt, das Duschsieb monatlich 15–20 Minuten in Cafiza-Lösung einzuweichen und zu schrubben; Tausch etwa jährlich oder bei Schäden.", "source": {"title": "Seattle Coffee Gear – Espresso Machine Maintenance Schedule", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/espresso-machine-maintenance-schedule"}, "img": "espresso", "topic": "Pflege", "st": 8}, {"id": "b2-159", "mode": "barista", "level": 2, "type": "mc", "q": "Wofür ist ein Reiniger wie Rinza gedacht, wofür Cafiza?", "options": ["Rinza für Kaffeeöle, Cafiza für Milchreste", "Beide nur zum Entkalken des Kessels", "Rinza für Kalk, Cafiza für Milchreste", "Rinza für Milchreste, Cafiza für Kaffeeöle"], "correct": 3, "explain": "Seattle Coffee Gear nennt Rinza als milchspezifischen Reiniger (z. B. für die Dampflanzenspitze) und Cafiza für Kaffeerückstände in Brühgruppe und Sieben.", "source": {"title": "Seattle Coffee Gear – Espresso Machine Maintenance Schedule", "url": "https://www.seattlecoffeegear.com/blogs/learning-center/espresso-machine-maintenance-schedule"}, "img": "milch", "topic": "Pflege", "st": 8}, {"id": "b2-160", "mode": "barista", "level": 2, "type": "mc", "q": "Welches Verfahren entkoffeiniert ohne Lösungsmittel nur mit Wasser und Aktivkohle?", "options": ["Das Wasserverfahren (z. B. Swiss Water)", "Das Ethylacetat-Verfahren (Zuckerrohr)", "Das Dichlormethan-Verfahren", "Das Benzol-Verfahren von 1906"], "correct": 0, "explain": "Beim Wasserverfahren löst Wasser bzw. koffeinfreier Rohkaffee-Extrakt vor allem das Koffein; Aktivkohlefilter holen es heraus, der Extrakt wird wiederverwendet.", "source": {"title": "Kaffeemacher – Wie wird Kaffee entkoffeiniert? Vier Verfahren im Vergleich", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/decaffeination-process"}, "img": "bohne", "topic": "Bohne & Lagerung", "st": 8}, {"id": "b2-161", "mode": "barista", "level": 2, "type": "mc", "q": "Wofür sorgen die spiralförmigen Rippen innen im Hario V60?", "options": ["Sie bremsen das Wasser auf dem Weg nach unten", "Sie halten das Kaffeemehl am Boden fest", "Sie verhindern, dass das Papier sich spült", "Sie halten Luftkanäle am Filterpapier frei"], "correct": 3, "explain": "Die Spiralrippen halten Luftkanäle zwischen Papier und Wand offen, sodass das Wasser ungehindert ablaufen kann.", "source": {"title": "Kaffeemacher – Hario V60: Standardrezept, Tipps & Weltmeister-Rezepte", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/hario-v60"}, "img": "filter", "topic": "Filter", "st": 4}, {"id": "b2-162", "mode": "barista", "level": 2, "type": "mc", "q": "An welche Frucht erinnert Äpfelsäure im Kaffee?", "options": ["An Zitronen und Limetten", "An Äpfel und Birnen", "An Trauben und Wein", "An Bananen und Mango"], "correct": 1, "explain": "Äpfelsäure kommt in Äpfeln, Birnen und Rhabarber vor; im Kaffee wirkt sie ähnlich wie Zitronensäure, aber runder.", "source": {"title": "Kaffeemacher – Säure im Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/acidity-in-coffee"}, "img": "tasse", "topic": "Sensorik", "st": 3}, {"id": "b2-163", "mode": "barista", "level": 2, "type": "mc", "q": "Welchen pH-Wert hat Kaffee ungefähr?", "options": ["Etwa pH 2", "Etwa pH 7", "Etwa pH 9", "Etwa pH 5"], "correct": 3, "explain": "Kaffee liegt bei etwa pH 5 (rund 4,85–5,1) – deutlich weniger sauer als Softdrinks mit etwa pH 3.", "source": {"title": "Kaffeemacher – Säure im Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/acidity-in-coffee"}, "img": "tasse", "topic": "Sensorik", "st": 3}, {"id": "b2-164", "mode": "barista", "level": 2, "type": "mc", "q": "Wozu dient die Weiss Distribution Technique (WDT)?", "options": ["Das Kaffeemehl vor dem Bezug befeuchten", "Klumpen im Kaffeemehl auflösen", "Den Puck nach dem Bezug auflockern", "Die Brühgruppe vor dem Bezug spülen"], "correct": 1, "explain": "Bei WDT rührt man das Mehl im Sieb mit feinen Nadeln um. Das löst Klumpen, gleicht die Dichte im Puck aus und verringert Channeling.", "source": {"title": "Barista Hustle – Should we all be using the Weiss Distribution Technique again?", "url": "https://www.baristahustle.com/?p=345144"}, "img": "tamper", "topic": "Espresso", "st": 1}, {"id": "b3-101", "mode": "barista", "level": 3, "type": "mc", "q": "Dosis 18 g, Getränk 40 g, Ziel 20 % Extraktion. Welchen TDS-Wert brauchst du?", "options": ["8,0 %", "9,0 %", "10,0 %", "11,1 %"], "correct": 1, "explain": "Umgestellt: TDS = Extraktion × Dosis ÷ Getränk = 20 % × 18 g ÷ 40 g = 9,0 %.", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "espresso", "topic": "Extraktion", "st": 5}, {"id": "b3-102", "mode": "barista", "level": 3, "type": "mc", "q": "Du brühst 22 g Kaffee im Verhältnis 1:16. Wie viel Wasser brauchst du?", "options": ["352 g", "220 g", "320 g", "384 g"], "correct": 0, "explain": "22 g × 16 = 352 g Brühwasser. Das Verhältnis bezieht sich auf Kaffee zu Brühwasser, nicht auf das fertige Getränk.", "source": {"title": "Kaffeemacher – Filterkaffee zubereiten", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/filter-coffee-brewing"}, "img": "filter", "topic": "Filter", "st": 1}, {"id": "b3-103", "mode": "barista", "level": 3, "type": "case", "q": "Wie viel Eis legst du in die Karaffe?", "options": ["105 g", "240 g", "168 g", "312 g"], "correct": 2, "explain": "Gesamtwasser 30 g × 16 = 480 g, davon 35 % Eis: 480 g × 0,35 = 168 g Eis und 312 g heißes Wasser.", "source": {"title": "Perfect Daily Grind – What is flash brew coffee?", "url": "https://perfectdailygrind.com/2022/03/what-is-flash-brew-coffee/"}, "img": "filter", "topic": "Filter", "case": {"title": "Fall · Flash-Brew-Rezept", "facts": ["30 g Kaffee, Verhältnis 1:16 (Eis zählt mit)", "35 % des Wassers als Eis", "Rest als heißes Wasser über den V60"]}, "st": 6}, {"id": "b3-104", "mode": "barista", "level": 3, "type": "mc", "q": "Ein Refraktometer hat ±0,15 % Genauigkeit. Was kann es bei echten 1,30 % TDS anzeigen?", "options": ["1,28 bis 1,32 %", "1,00 bis 1,60 %", "1,15 bis 1,45 %", "1,30 bis 1,45 %"], "correct": 2, "explain": "Bei ±0,15 % kann ein wahrer Wert von 1,30 % als 1,15 % bis 1,45 % erscheinen – für Filterkaffee eine große Spanne.", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "tasse", "topic": "Extraktion", "st": 6}, {"id": "b3-105", "mode": "barista", "level": 3, "type": "mc", "q": "Ein günstiges Brix-Meter zeigt 10 °Bx für einen Espresso. Welcher TDS-Wert entspricht dem etwa?", "options": ["Etwa 10 %", "Etwa 8,5 %", "Etwa 11,8 %", "Etwa 1,0 %"], "correct": 1, "explain": "Kaffeemacher nennt den Umrechnungsfaktor von rund 0,85: 10 °Bx entsprechen etwa 8,5 % TDS.", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "tasse", "topic": "Extraktion", "st": 6}, {"id": "b3-106", "mode": "barista", "level": 3, "type": "mc", "q": "Etwa wie viel wiegen 40 ml Espresso mit Crema?", "options": ["Etwa 40 g", "Etwa 50 g", "Etwa 30 g", "Etwa 20 g"], "correct": 2, "explain": "Laut Barista Hustle wiegt Espresso grob 25 % (±10 %) weniger als sein Volumen, weil die Crema aus leichtem CO₂-Schaum besteht.", "source": {"title": "Barista Hustle – Espresso Size and Strength", "url": "https://www.baristahustle.com/lesson/b1-6-01-espresso-size-and-strength/"}, "img": "espresso", "topic": "Espresso", "st": 1}, {"id": "b3-107", "mode": "barista", "level": 3, "type": "case", "q": "Was ist der Hauptfehler bei dieser Messung?", "options": ["Probe mit Pipette durchmischt", "Gerät mit destilliertem Wasser genullt", "Probe warm und ungefiltert gemessen", "Nur ein bis zwei Tropfen aufgetragen"], "correct": 2, "explain": "Für genaue Werte kühlt man die Probe auf etwa 20 °C und filtert Espresso z. B. mit einem Spritzenfilter; warme, trübe Proben streuen stärker.", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "tasse", "topic": "Extraktion", "case": {"title": "Fall · TDS-Messung", "facts": ["Espresso direkt aus der Tasse, rund 70 °C", "Probe nicht gefiltert", "Zwei Messungen weichen um 0,4 % voneinander ab"]}, "st": 9}, {"id": "b3-108", "mode": "barista", "level": 3, "type": "mc", "q": "Wie weit dürfen zwei Wiederholungsmessungen am Refraktometer laut Kaffeemacher höchstens auseinanderliegen?", "options": ["Etwa ±0,03 %", "Etwa ±0,3 %", "Etwa ±1 %", "Etwa ±3 %"], "correct": 0, "explain": "Wiederholte Messungen sollten höchstens ±0,03 % abweichen; größere Unterschiede deuten auf einen Bedienfehler.", "source": {"title": "Kaffeemacher – Refraktometer und TDS", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/refractometer-and-tds"}, "img": "tasse", "topic": "Extraktion", "st": 7}, {"id": "b3-109", "mode": "barista", "level": 3, "type": "mc", "q": "Was steuert bei Tetsu Kasuyas 4:6-Methode der erste Teil (40 %) des Wassers?", "options": ["Die Stärke der Tasse", "Die Temperatur des Kaffeebetts", "Das Verhältnis von Säure und Süße", "Die gesamte Durchlaufzeit"], "correct": 2, "explain": "Kasuya (Weltmeister 2016): Die ersten 40 % des Wassers bestimmen die Balance von Säure und Süße, die letzten 60 % die Stärke.", "source": {"title": "Kaffeemacher – Hario V60: Standardrezept, Tipps & Weltmeister-Rezepte", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/hario-v60"}, "img": "filter", "topic": "Filter", "st": 7}, {"id": "b3-110", "mode": "barista", "level": 3, "type": "mc", "q": "Warum kocht das Wasser im oberen Glaskolben eines Siphons nicht?", "options": ["Der obere Kolben ist dicker und isoliert besser", "Das Kaffeemehl entzieht dem Wasser viel Wärme", "Der Dampf muss nur Schwerkraft und Luftdruck überwinden", "Im oberen Kolben herrscht ein höherer Druck"], "correct": 2, "explain": "Laut Barista Hustle bleibt die Temperatur oben unter 100 °C, weil der Dampf das Wasser nur gegen Schwerkraft und Luftdruck nach oben drücken muss.", "source": {"title": "Barista Hustle – The Science Behind Syphons", "url": "https://www.baristahustle.com/lesson/im-4-07-the-science-behind-syphons/"}, "img": "filter", "topic": "Filter", "st": 5}, {"id": "b3-111", "mode": "barista", "level": 3, "type": "mc", "q": "Was kennzeichnet eine gesättigte Brühgruppe?", "options": ["Sie wird über einen Thermosiphon beheizt", "Sie hat einen eigenen Thermoblock", "Sie wird nur über Dampf beheizt", "Sie ist direkt zum Kessel hin offen"], "correct": 3, "explain": "Bei einer gesättigten Gruppe ist die Gruppe zum Kessel offen und heizt schnell auf; die semi-gesättigte trennt den Bereich über dem Verteilerblock vom Kessel.", "source": {"title": "Clive Coffee – How Do Espresso Machines Work?", "url": "https://clivecoffee.com/blogs/learn/how-do-espresso-machines-work"}, "img": "espresso", "topic": "Espresso", "st": 3}, {"id": "b3-112", "mode": "barista", "level": 3, "type": "mc", "q": "Was fand Jonathan Gagne zu tiefem WDT im Vergleich zum oberflächlichen „Puck Raking“?", "options": ["Weniger Puckwiderstand und mehr Streuung", "Keinen messbaren Unterschied", "Mehr Channeling bei tiefem Rühren", "Mehr Puckwiderstand und weniger Streuung"], "correct": 3, "explain": "In Gagnes White Paper ergab tiefes WDT bis zum Siebboden einen höheren Puckwiderstand und weniger Schwankung von Shot zu Shot.", "source": {"title": "Barista Hustle – Should we all be using the Weiss Distribution Technique again?", "url": "https://www.baristahustle.com/?p=345144"}, "img": "tamper", "topic": "Espresso", "st": 4}, {"id": "b3-113", "mode": "barista", "level": 3, "type": "mc", "q": "Was passiert laut Barista Hustle, wenn das Kaffeemehl das Duschsieb berührt?", "options": ["Die Extraktion wird gleichmäßiger", "Die Extraktion wird ungleichmäßiger", "Der Puck bleibt deutlich trockener", "Die Crema wird deutlich dichter"], "correct": 1, "explain": "Berührt das Mehl das Duschsieb, wird die Extraktion ungleichmäßiger. Barista Hustle empfiehlt daher höhere Siebe mit mehr Headspace.", "source": {"title": "Barista Hustle – For a good puck", "url": "https://www.baristahustle.com/for-a-good-puck/"}, "img": "espresso", "topic": "Espresso", "st": 2}, {"id": "b3-114", "mode": "barista", "level": 3, "type": "mc", "q": "Welche traditionelle italienische Brew Ratio nennt La Marzocco?", "options": ["Etwa 1:1", "Etwa 1:6", "Etwa 1:3", "Etwa 1:10"], "correct": 2, "explain": "Italien gilt oft als Ristretto-Land, traditionell wird laut La Marzocco aber etwa 1:3 bezogen – rund 7 g Kaffee für 21 g Espresso.", "source": {"title": "La Marzocco Home – Brew Ratios Around the World", "url": "https://home.lamarzoccousa.com/brew-ratios-around-world/"}, "img": "espresso", "topic": "Espresso", "st": 2}, {"id": "b3-115", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Getränkestärke verlangt der SCA-Standard 310 bei 55 g/kg?", "options": ["1,15–1,55 % TDS", "0,55–0,85 % TDS", "1,75–2,25 % TDS", "2,50–3,00 % TDS"], "correct": 0, "explain": "Standard 310 fordert bei 55 g Kaffee pro kg Wasser 1,15–1,55 % TDS, gemessen mit einem Kaffee-Refraktometer.", "source": {"title": "SCA Standard 310-2021 Home Coffee Brewers", "url": "https://sca.coffee/s/SCA_Standard_310-2021.pdf"}, "img": "filter", "topic": "Standards", "st": 6}, {"id": "b3-116", "mode": "barista", "level": 3, "type": "mc", "q": "Welchen Testkaffee schreibt der SCA-Standard 310 vor?", "options": ["Robusta-Blend, 1–2 Tage nach der Röstung", "Beliebiger Kaffee, 3–6 Monate gelagert", "100 % Arabica, 1–1,5 Wochen nach der Röstung", "Grüner Rohkaffee, frisch vor dem Test geröstet"], "correct": 2, "explain": "Getestet wird mit 100 % Arabica, Röstfarbe #55–#65 auf der SCA-Skala und 1–1,5 Wochen nach der Röstung.", "source": {"title": "SCA Standard 310-2021 Home Coffee Brewers", "url": "https://sca.coffee/s/SCA_Standard_310-2021.pdf"}, "img": "filter", "topic": "Standards", "st": 8}, {"id": "b3-117", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Calciumhärte gibt der SCA-Standard 310 für das Testwasser an?", "options": ["0–10 ppm als CaCO₃", "50–175 ppm als CaCO₃", "250–400 ppm als CaCO₃", "500–700 ppm als CaCO₃"], "correct": 1, "explain": "Das Testwasser hat 50–175 ppm Calciumhärte und 40–70 ppm Alkalinität (jeweils als CaCO₃) bei pH 6–8.", "source": {"title": "SCA Standard 310-2021 Home Coffee Brewers", "url": "https://sca.coffee/s/SCA_Standard_310-2021.pdf"}, "img": "filter", "topic": "Standards", "st": 9}, {"id": "b3-118", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Bewertung der Extraktionsgleichmäßigkeit verlangt der SCA-Standard 310 mindestens?", "options": ["60 oder mehr", "30 oder mehr", "90 oder mehr", "100, also perfekt"], "correct": 0, "explain": "Gefordert sind 60 oder mehr; über 75 gilt als exzellent, über 90 als herausragend.", "source": {"title": "SCA Standard 310-2021 Home Coffee Brewers", "url": "https://sca.coffee/s/SCA_Standard_310-2021.pdf"}, "img": "filter", "topic": "Standards", "st": 6}, {"id": "b3-119", "mode": "barista", "level": 3, "type": "mc", "q": "Wie viel Natrium sieht der SCA-Wasserstandard im Brühwasser vor?", "options": ["Etwa 0 mg/L", "Etwa 75 mg/L", "Etwa 10 mg/L", "Etwa 150 mg/L"], "correct": 2, "explain": "Ziel sind etwa 10 mg/L Natrium („at or near 10 mg/L“).", "source": {"title": "Prima Coffee – Testing Your Water (SCA-Wasserstandard)", "url": "https://prima-coffee.com/blog/testing-your-water/"}, "img": "wasser", "topic": "Wasser", "st": 9}, {"id": "b3-120", "mode": "barista", "level": 3, "type": "mc", "q": "Was misst ein KH-Tropftest im Wasser eigentlich?", "options": ["Nur die Menge an Calcium", "Die Alkalinität, also das Hydrogencarbonat", "Nur die Menge an Magnesium", "Die Summe von Calcium und Magnesium"], "correct": 1, "explain": "Laut Barista Hustle misst der KH-Tropftest die Alkalinität (Hydrogencarbonat) und nicht streng die Karbonathärte – außer wenn KH unter GH liegt.", "source": {"title": "Barista Hustle – Water Hardness", "url": "https://www.baristahustle.com/water-hardness/"}, "img": "wasser", "topic": "Wasser", "st": 3}, {"id": "b3-121", "mode": "barista", "level": 3, "type": "case", "q": "Wie hoch ist die bleibende (permanente) Härte?", "options": ["10 Einheiten", "6 Einheiten", "4 Einheiten", "2 Einheiten"], "correct": 2, "explain": "Bleibende Härte = Gesamthärte minus Karbonathärte = 10 − 6 = 4. Die 6 Einheiten temporäre Härte fallen beim Erhitzen als Kalk aus.", "source": {"title": "Barista Hustle – Water Hardness", "url": "https://www.baristahustle.com/water-hardness/"}, "img": "wasser", "topic": "Wasser", "case": {"title": "Fall · Wasseranalyse", "facts": ["Gesamthärte (GH): 10 Einheiten", "Karbonathärte (KH): 6 Einheiten", "KH liegt unter GH"]}, "st": 10}, {"id": "b3-122", "mode": "barista", "level": 3, "type": "mc", "q": "Was unterscheidet Magnesium- von Calcium-Ablagerungen?", "options": ["Magnesium haftet deutlich fester an Flächen", "Magnesium haftet weniger fest an Flächen", "Magnesium bildet überhaupt nie Ablagerungen", "Magnesium löst sich beim Kochen nicht mehr"], "correct": 1, "explain": "Magnesium kann Kesselstein bilden, haftet aber nicht so fest wie Kalk; seine Carbonate und Hydroxide sind etwas besser löslich.", "source": {"title": "Barista Hustle – Water Hardness", "url": "https://www.baristahustle.com/water-hardness/"}, "img": "wasser", "topic": "Wasser", "st": 10}, {"id": "b3-123", "mode": "barista", "level": 3, "type": "mc", "q": "Warum werden GH und KH meist in ppm als CaCO₃ angegeben?", "options": ["Tropftests trennen Calcium und Magnesium nicht", "Kaffee enthält nur Calciumcarbonat", "Magnesium kommt im Trinkwasser nicht vor", "CaCO₃ ist das einzige lösliche Salz"], "correct": 0, "explain": "Tropftests können Calcium und Magnesium nicht unterscheiden; deshalb rechnet man beide in Calciumcarbonat-Äquivalente um.", "source": {"title": "Barista Hustle – Barista Water Recipes", "url": "https://www.baristahustle.com/diy-water-recipes-redux/"}, "img": "wasser", "topic": "Wasser", "st": 8}, {"id": "b3-124", "mode": "barista", "level": 3, "type": "mc", "q": "Warum rät Barista Hustle von seinen Brühwasser-Rezepten für Espressomaschinen ab?", "options": ["Ohne Calcium droht Korrosion im Kessel", "Mit viel Calcium droht starker Kalk", "Natron zerstört die Brühgruppendichtung", "Bittersalz verstopft die Rotationspumpe"], "correct": 0, "explain": "Die Rezepte enthalten kein Calcium; solches Wasser kann zwar kalkfrei, aber korrosiv für Kesselbauteile sein.", "source": {"title": "Barista Hustle – Barista Water Recipes", "url": "https://www.baristahustle.com/diy-water-recipes-redux/"}, "img": "wasser", "topic": "Wasser", "st": 9}, {"id": "b3-125", "mode": "barista", "level": 3, "type": "mc", "q": "Ab etwa welchem Chloridgehalt wird Korrosion in Espressomaschinen zum großen Problem?", "options": ["Ab etwa 30 ppm", "Ab etwa 3 ppm", "Ab etwa 300 ppm", "Ab etwa 3.000 ppm"], "correct": 0, "explain": "Laut Espresso Parts ist Chlorid über etwa 30 ppm ein großes Korrosionsrisiko, manche Hersteller verlangen 15 ppm oder weniger; Schäden sind irreversibel.", "source": {"title": "Espresso Parts – Water Chemistry: Hardness, Chloride, Scale and RO Water", "url": "https://www.espressoparts.com/blogs/news/how-water-chemistry-affects-espresso-machines-hardness-chloride-scale-and-ro-water"}, "img": "wasser", "topic": "Wasser", "st": 6}, {"id": "b3-126", "mode": "barista", "level": 3, "type": "mc", "q": "Womit hängt die wahrgenommene Säure eines Kaffees laut Batali et al. (2021) am engsten zusammen?", "options": ["Mit dem pH-Wert des Getränks", "Mit der titrierbaren Säure", "Mit der Summe aller Säuren", "Mit dem Koffeingehalt"], "correct": 1, "explain": "Die wahrgenommene Säure korreliert stärker mit der titrierbaren Säure (wie viel Lauge zum Neutralisieren nötig ist) als mit pH oder Gesamtsäure; Puffer halten den pH oft stabil.", "source": {"title": "Barista Hustle – What We Taste When We Taste Acidity", "url": "https://www.baristahustle.com/what-we-taste-when-we-taste-acidity/"}, "img": "tasse", "topic": "Sensorik", "st": 7}, {"id": "b3-127", "mode": "barista", "level": 3, "type": "mc", "q": "Kenianischer Kaffee wurde mit Nasenklammer als weniger sauer bewertet. Was zeigt das?", "options": ["Das Aroma beeinflusst die wahrgenommene Säure", "Die Nasenklammer senkt den pH-Wert im Mund", "Kenianischer Kaffee enthält keine Säuren", "Säure wird nur über die Nase wahrgenommen"], "correct": 0, "explain": "Brollo et al. (2008): Kenia-Kaffee hatte höheren pH und weniger titrierbare Säure, wirkte aber saurer – mit Nasenklammer sank die Säurewahrnehmung. Aroma prägt also den Säureeindruck.", "source": {"title": "Barista Hustle – What We Taste When We Taste Acidity", "url": "https://www.baristahustle.com/what-we-taste-when-we-taste-acidity/"}, "img": "tasse", "topic": "Sensorik", "st": 9}, {"id": "b3-128", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Säure lag in der CoffeeMind-Studie (2023) als einzige klar über der Wahrnehmungsschwelle?", "options": ["Zitronensäure", "Äpfelsäure", "Milchsäure", "Essigsäure"], "correct": 0, "explain": "In French-Press-Kaffee mit etwa 1,1 % TDS lag nur Zitronensäure deutlich über der Schwelle; Äpfel-, Milch- und Essigsäure lagen im Mittel darunter, Phosphorsäure knapp darüber.", "source": {"title": "Barista Hustle – What We Taste When We Taste Acidity", "url": "https://www.baristahustle.com/what-we-taste-when-we-taste-acidity/"}, "img": "tasse", "topic": "Sensorik", "st": 6}, {"id": "b3-129", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Säuregruppe macht im Rohkaffee den größten Anteil aus?", "options": ["Zitronensäure", "Phosphorsäure", "Milchsäure", "Chlorogensäuren"], "correct": 3, "explain": "Chlorogensäuren machen bei Arabica etwa 6–7 %, bei Robusta fast 10 % aus – mehr als das Koffein mit 1–2 %.", "source": {"title": "Kaffeemacher – Säure im Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/acidity-in-coffee"}, "img": "bohne", "topic": "Sensorik", "st": 1}, {"id": "b3-130", "mode": "barista", "level": 3, "type": "mc", "q": "Was entsteht, wenn Chlorogensäuren beim Rösten abgebaut werden?", "options": ["Bittere Lactone", "Süße Einfachzucker", "Fruchtige Ester", "Salzige Mineralien"], "correct": 0, "explain": "Beim Rösten zerfallen vor allem die Mono-Caffeoyl-Formen der Chlorogensäuren; dabei entstehen bitter schmeckende Lactone.", "source": {"title": "Kaffeemacher – Säure im Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/acidity-in-coffee"}, "img": "bohne", "topic": "Sensorik", "st": 3}, {"id": "b3-131", "mode": "barista", "level": 3, "type": "mc", "q": "Welche Säure wird oft in kenianischen Kaffees wahrgenommen und ist eine Mineralsäure?", "options": ["Äpfelsäure", "Weinsäure", "Phosphorsäure", "Zitronensäure"], "correct": 2, "explain": "Phosphorsäure ist keine organische, sondern eine Mineralsäure; sie wird als herb bis spritzig beschrieben und oft Kenia-Kaffees zugeschrieben.", "source": {"title": "Kaffeemacher – Säure im Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/acidity-in-coffee"}, "img": "tasse", "topic": "Sensorik", "st": 6}, {"id": "b3-132", "mode": "barista", "level": 3, "type": "mc", "q": "Wie verhält sich Essigsäure beim Rösten anders als die übrigen organischen Säuren?", "options": ["Sie steigt bis zum Ende der Röstung stetig an", "Sie erreicht kurz um den zweiten Crack ein Hoch", "Sie entsteht erst nach dem Abkühlen der Bohnen", "Sie bleibt während der Röstung völlig gleich"], "correct": 1, "explain": "Laut Kaffeemacher erreicht Essigsäure kurz beim Rösten in den zweiten Crack einen Höhepunkt; alle anderen organischen Säuren nehmen mit längerer, heißerer Röstung ab.", "source": {"title": "Kaffeemacher – Säure im Kaffee", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/acidity-in-coffee"}, "img": "bohne", "topic": "Sensorik", "st": 10}, {"id": "b3-133", "mode": "barista", "level": 3, "type": "mc", "q": "Was ergab eine Studie der Thomas Jefferson University zum pH von Cold Brew und Heißbrühung?", "options": ["Cold Brew hat einen pH-Wert von etwa 7", "Heiß gebrühter Kaffee hat einen pH-Wert von 3", "Fast gleich – heiß enthält mehr titrierbare Säure", "Cold Brew ist zehnmal saurer als heißer Kaffee"], "correct": 2, "explain": "Beide lagen bei etwa pH 4,85–5,13. Heiß gebrühter Kaffee enthält aber mehr titrierbare Säuren – darum schmeckt Cold Brew weicher.", "source": {"title": "Kaffeemacher – Cold Brew selber machen: Anleitung & Verhältnis", "url": "https://kaffeemacher.de/en/blogs/kaffeewissen/cold-brew"}, "img": "filter", "topi
