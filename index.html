pic": "Aufbereitung", "st": 2}, {"id": "a3-27", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie entfernt ein mechanischer Entschleimer (Demucilager) den Fruchtschleim?", "options": ["Durch kurzes Erhitzen der Bohnen in kochend heißem Wasser", "Durch Reibung der Bohnen aneinander, mit wenig Wasser", "Durch Zugabe von Natronlauge in einem Spültank", "Durch Ultraschallwellen in einem Salzwasserbad"], "correct": 1, "explain": "Der Schleim wird durch Reibung der Bohnen aneinander entfernt, allein oder kombiniert mit Fermentation; moderne Geräte brauchen nur etwa 0,5–1 m³ Wasser pro Tonne nassem Pergament.", "source": {"title": "SCA 25 Magazine – The Impact of Mucilage Removers on Coffee Sustainability and Quality", "url": "https://sca.coffee/sca-news/25-magazine/issue-6/english/water-saving-demucilagers"}, "img": "trocknung", "topic": "Aufbereitung", "st": 10}, {"id": "a3-28", "mode": "anbau", "level": 3, "type": "mc", "q": "Welche Mikroorganismen vermehrten sich in einer klassischen Studie zur Kaffee-Nassfermentation am stärksten?", "options": ["Schimmelpilze (Penicillium)", "Milchsäurebakterien und Hefen", "Cyanobakterien und Grünalgen", "Aspergillus- und Fusarium-Pilze"], "correct": 1, "explain": "Avallone et al. (2001) beobachteten die stärkste Zunahme bei Milchsäurebakterien (v. a. Leuconostoc mesenteroides) und Hefen.", "source": {"title": "Avallone et al. (2001), Current Microbiology – Microbiological and biochemical study of coffee fermentation", "url": "https://agritrop.cirad.fr/526386"}, "img": "trocknung", "topic": "Aufbereitung", "st": 4}, {"id": "a3-29", "mode": "anbau", "level": 3, "type": "mc", "q": "Wie groß ist die Standardprobe für die Defektzählung nach der SCAA-Rohkaffeeklassifizierung?", "options": ["100 g geschälter Rohkaffee", "300 g geschälter Rohkaffee", "500 g geschälter Rohkaffee", "1 kg geschälter Rohkaffee"], "correct": 1, "explain": "Ausgangspunkt sind 300 g geschälter Rohkaffee; Specialty Grade erlaubt darin höchstens 5 Full Defects.", "source": {"title": "Coffee Research Institute – SCAA Green Coffee Classification", "url": "https://coffeeresearch.org/coffee/scaaclass.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 3}, {"id": "a3-30", "mode": "anbau", "level": 3, "type": "mc", "q": "Was zeigte eine Studie in „Science“ (Wright et al. 2013) über Koffein im Nektar von Kaffeeblüten?", "options": ["Koffein im Nektar verbessert das Duftgedächtnis von Honigbienen", "Koffein im Nektar schreckt Honigbienen von den Blüten ab", "Koffein im Nektar schädigt das Gedächtnis von Honigbienen", "Koffein im Nektar lockt vor allem Hummeln statt der Honigbienen an"], "correct": 0, "explain": "Kaffee- und Zitrusblüten enthalten Koffein im Nektar; Bienen mit koffeinhaltiger Zuckerlösung erinnerten sich etwa dreimal so häufig an den Blütenduft.", "source": {"title": "Newcastle University – Bees get a buzz from caffeine (Wright et al. 2013, Science)", "url": "https://www.ncl.ac.uk/press/articles/archive/2013/03/beesgetabuzzfromcaffeine.html"}, "img": "bluete", "topic": "Botanik", "st": 5}, {"id": "a1-31", "mode": "anbau", "level": 1, "type": "mc", "topic": "Aufbereitung", "img": "trocknung", "q": "Was passiert bei der gewaschenen Aufbereitung (Washed)?", "options": ["Entpulpen, Schleim fermentieren und abwaschen, dann trocknen", "Ganze Kirschen trocknen, danach Haut und Fruchtfleisch entfernen", "Entpulpen und mitsamt dem Fruchtschleim trocknen lassen", "Pergament noch feucht schälen und die Bohne fertig trocknen"], "correct": 0, "explain": "Bei Washed wird die Kirsche entpulpt, der klebrige Fruchtschleim durch Fermentation gelöst und abgewaschen; danach trocknet der Pergamentkaffee. Ganze Kirschen trocknen bei Natural, mit Schleim bei Honey, feucht geschält wird bei Wet Hulled.", "source": {"title": "Coffee Review – Processing Coffee: Fruit Removal and Drying", "url": "https://www.coffeereview.com/?p=5562"}, "st": 7}, {"id": "a1-101", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Farbe haben reife Kaffeekirschen bei den meisten Varietäten?", "options": ["Hellgrün bis gelblich", "Orange bis hellbraun", "Schwarz bis dunkelblau", "Tiefrot bis purpurfarben"], "correct": 3, "explain": "Reife Kirschen färben sich tiefrot bis purpurn; unreife Kirschen sind noch grün. Es gibt aber auch Varietäten, die gelb abreifen.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "kirsche", "topic": "Botanik", "st": 1}, {"id": "a1-102", "mode": "anbau", "level": 1, "type": "mc", "q": "Was ist eine Kaffeebohne botanisch gesehen?", "options": ["Eine getrocknete Hülsenfrucht", "Ein verholzter Fruchtstiel", "Der Samen der Kaffeekirsche", "Eine verdickte Wurzelknolle"], "correct": 2, "explain": "Die Kaffeebohne ist der Samen der Kaffeekirsche – mit der Gartenbohne, einer Hülsenfrucht, hat sie botanisch nichts zu tun.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "kirsche", "topic": "Botanik", "st": 1}, {"id": "a1-103", "mode": "anbau", "level": 1, "type": "mc", "q": "Wo werden junge Kaffeepflanzen meist angezogen, bevor sie aufs Feld kommen?", "options": ["In schattigen Baumschulen", "Im vollen Sonnenlicht am Hang", "In beheizten Glashäusern", "In Becken mit Nährlösung"], "correct": 0, "explain": "Sämlinge wachsen meist in Beeten schattiger Baumschulen (Nurseries); sie werden oft gegossen und vor praller Sonne geschützt, bis sie ausgepflanzt werden.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 2}, {"id": "a1-104", "mode": "anbau", "level": 1, "type": "mc", "q": "Wann werden Kaffeesetzlinge bevorzugt auf dem Feld ausgepflanzt?", "options": ["Mitten in der Trockenzeit", "Während der Ernte", "Direkt nach einem Frost", "In der Regenzeit"], "correct": 3, "explain": "Gepflanzt wird oft in der Regenzeit, damit der Boden feucht bleibt, während die Wurzeln anwachsen.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 4}, {"id": "a1-105", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie heißt in Kolumbien die kleinere Zwischenernte neben der Haupternte?", "options": ["Pasilla", "Beneficio", "Mitaca", "Pergamino"], "correct": 2, "explain": "Viele Regionen Kolumbiens haben zwei Erntezeiten: im Valle del Cauca etwa die Haupternte von September bis Dezember und die Mitaca von März bis Juni.", "source": {"title": "Barista Hustle – Origins: Valle del Cauca, Colombia", "url": "https://www.baristahustle.com/?p=413056"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 7}, {"id": "a1-106", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie viele Haupternten gibt es in den meisten Kaffeeanbaugebieten pro Jahr?", "options": ["Eine", "Zwei", "Drei", "Vier"], "correct": 0, "explain": "Die meisten Anbaugebiete haben eine Haupternte pro Jahr. Ausnahmen wie Kolumbien haben zwei Blüten und damit eine Haupt- und eine Nebenernte.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 1}, {"id": "a1-107", "mode": "anbau", "level": 1, "type": "mc", "q": "Wo wird Rohkaffee in der Regel geröstet?", "options": ["Direkt auf der Farm im Ursprung", "In dem Land, wo er verkauft wird", "Im Exporthafen des Ursprungs", "In der Nassmühle nach dem Waschen"], "correct": 1, "explain": "Geröstet wird meist im Verbraucherland, damit der Kaffee frisch beim Kunden ankommt; exportiert wird grüner Rohkaffee.", "source": {"title": "National Coffee Association – Lifecycle of Coffee", "url": "https://www.aboutcoffee.org/origins/lifecycle-of-coffee/"}, "img": "berg", "topic": "Herkunft", "st": 1}, {"id": "a1-108", "mode": "anbau", "level": 1, "type": "mc", "q": "Welches Land ist laut USDA der größte Robusta-Produzent?", "options": ["Vietnam", "Brasilien", "Indien", "Uganda"], "correct": 0, "explain": "Die USDA-Prognose 2026/27 sieht Vietnam bei rund 31 Mio. Sack Robusta, vor Brasilien mit rund 24 Mio. Sack.", "source": {"title": "USDA FAS – Coffee: World Markets and Trade (Juli 2026)", "url": "https://apps.fas.usda.gov/psdonline/circulars/2026/07/coffee.pdf"}, "img": "berg", "topic": "Herkunft", "st": 3}, {"id": "a1-109", "mode": "anbau", "level": 1, "type": "mc", "q": "Welches Land ist der größte Kaffeeproduzent Afrikas?", "options": ["Uganda", "Kenia", "Ruanda", "Äthiopien"], "correct": 3, "explain": "Äthiopien liegt laut USDA-Prognose 2026/27 bei rund 12 Mio. Sack, Uganda bei rund 7 Mio. Sack. Kenia und Ruanda produzieren deutlich weniger.", "source": {"title": "USDA FAS – Coffee: World Markets and Trade (Juli 2026)", "url": "https://apps.fas.usda.gov/psdonline/circulars/2026/07/coffee.pdf"}, "img": "berg", "topic": "Herkunft", "st": 3}, {"id": "a1-110", "mode": "anbau", "level": 1, "type": "mc", "q": "Welches dieser Länder produziert laut USDA praktisch nur Arabica?", "options": ["Vietnam", "Kolumbien", "Uganda", "Indonesien"], "correct": 1, "explain": "Kolumbien führt in der USDA-Statistik ausschließlich Arabica. Vietnam, Uganda und Indonesien produzieren überwiegend Robusta.", "source": {"title": "USDA FAS – Coffee: World Markets and Trade (Juli 2026)", "url": "https://apps.fas.usda.gov/psdonline/circulars/2026/07/coffee.pdf"}, "img": "berg", "topic": "Herkunft", "st": 3}, {"id": "a1-111", "mode": "anbau", "level": 1, "type": "mc", "q": "Welcher Markt verbraucht laut USDA am meisten Kaffee?", "options": ["Die Europäische Union", "Die Vereinigten Staaten", "Japan und Südkorea", "Brasilien und Kolumbien"], "correct": 0, "explain": "Für 2026/27 erwartet die USDA in der EU einen Verbrauch von rund 42,5 Mio. Sack, in den USA rund 27 Mio. Sack.", "source": {"title": "USDA FAS – Coffee: World Markets and Trade (Juli 2026)", "url": "https://apps.fas.usda.gov/psdonline/circulars/2026/07/coffee.pdf"}, "img": "berg", "topic": "Handel & Preise", "st": 8}, {"id": "a1-112", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Weltregion produziert laut ICO den meisten Kaffee?", "options": ["Asien und Ozeanien", "Afrika", "Südamerika", "Mittelamerika"], "correct": 2, "explain": "Laut ICO kamen 2023/24 rund 89 von 178 Mio. Sack aus Südamerika – vor allem aus Brasilien und Kolumbien.", "source": {"title": "ICO – Coffee Market Report April 2025", "url": "https://www.ico.org/documents/cy2024-25/cmr-0425-e.pdf"}, "img": "berg", "topic": "Herkunft", "st": 3}, {"id": "a1-113", "mode": "anbau", "level": 1, "type": "mc", "q": "Welches Land ist der größte Kaffeeexporteur Mittelamerikas?", "options": ["Panama", "Honduras", "Costa Rica", "El Salvador"], "correct": 1, "explain": "Honduras ist laut World Coffee Research der dominierende Exporteur Mittelamerikas und weltweit etwa auf Platz 8; rund 95 % des Kaffees stammen von Kleinbauern.", "source": {"title": "World Coffee Research – Country profile: Honduras", "url": "https://worldcoffeeresearch.org/countries/honduras"}, "img": "berg", "topic": "Herkunft", "st": 7}, {"id": "a1-114", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie viele Kaffeebauern gibt es laut World Coffee Research weltweit etwa?", "options": ["Rund 2,5 Millionen", "Rund 250.000", "Rund 250 Millionen", "Rund 25 Millionen"], "correct": 3, "explain": "Rund 25 Millionen Bauern bewirtschaften über 11 Mio. Hektar Kaffee – die meisten davon Kleinbauern.", "source": {"title": "World Coffee Research – Climate change: Pinpointing the world’s most vulnerable coffee zones (Bunn et al. 2015)", "url": "https://worldcoffeeresearch.org/news/2015/climate-change-pinpointing-the-worlds-most-vulnerable-coffee-zones"}, "img": "berg", "topic": "Herkunft", "st": 8}, {"id": "a1-115", "mode": "anbau", "level": 1, "type": "case", "q": "Warum sollten Kirschen vom Boden nicht mit der Ernte gemischt werden?", "case": {"title": "Fall · Ernte auf einer Kleinfarm", "facts": ["Pflücker sammeln auch Kirschen vom Boden auf", "Alles kommt in denselben Sack", "Verarbeitung am Abend"]}, "options": ["Sie enthalten deutlich mehr Koffein", "Sie sind fast immer noch ganz unreif", "Sie bringen gärige oder schimmlige Aromen", "Sie färben die anderen Bohnen dunkel"], "correct": 2, "explain": "Vom Boden aufgelesene Kirschen können gärige, fruchtig-überreife oder schimmlige Aromen in die Partie bringen. Gepflückt und verarbeitet werden sollen nur reife Kirschen.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 6: Harvesting and processing", "url": "https://www.fao.org/4/ae939e/ae939e08.htm"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 6}, {"id": "a1-116", "mode": "anbau", "level": 1, "type": "mc", "q": "Worauf sollte Kaffee laut FAO-Handbuch nicht getrocknet werden?", "options": ["Direkt auf dem nackten Erdboden", "Auf erhöhten Trockenbetten", "Auf sauberen Betonflächen", "Auf Planen oder Matten"], "correct": 0, "explain": "Getrocknet wird auf harten, ebenen und sauberen Flächen wie Beton, Planen, Matten oder erhöhten Tischen – nicht auf Erde.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 6: Harvesting and processing", "url": "https://www.fao.org/4/ae939e/ae939e08.htm"}, "img": "trocknung", "topic": "Aufbereitung", "st": 5}, {"id": "a1-117", "mode": "anbau", "level": 1, "type": "mc", "q": "Was wird in der Baumschule als Saatgut für neue Kaffeepflanzen gesät?", "options": ["Geschälter grüner Rohkaffee", "Ganze, frische Kirschen", "Pergamentkaffee mit Hülle", "Leicht angeröstete Bohnen"], "correct": 2, "explain": "Saatgut ist Pergamentkaffee, also der Samen mit noch vorhandener Pergamenthülle – nicht geschälter Rohkaffee.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 2: Nursery practices", "url": "https://www.fao.org/4/ae939e/ae939e04.htm"}, "img": "pflanze", "topic": "Botanik", "st": 9}, {"id": "a1-118", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie lange dauert es nach der Aussaat etwa, bis Kaffeekeimlinge aus dem Boden kommen?", "options": ["Etwa 3–5 Tage", "Etwa 30–50 Tage", "Etwa 6–8 Monate", "Etwa 1 Jahr"], "correct": 1, "explain": "Je nach Bodentemperatur erscheinen die Keimlinge etwa 30–50 Tage nach der Aussaat.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 2: Nursery practices", "url": "https://www.fao.org/4/ae939e/ae939e04.htm"}, "img": "pflanze", "topic": "Botanik", "st": 8}, {"id": "a1-119", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Funktion hat Koffein vermutlich für die Kaffeepflanze selbst?", "options": ["Schutz vor Insekten und Pilzen", "Lockstoff für samenfressende Vögel", "Wasserspeicher für die Trockenzeit", "Frostschutz für junge Blätter"], "correct": 0, "explain": "Koffein kommt in der ganzen Pflanze vor, im Samen besonders konzentriert, und hilft, sie gegen Insekten und Pilze zu schützen.", "source": {"title": "Sweet Maria's Coffee Library – Arabica Coffee Cherry Cross Section", "url": "https://library.sweetmarias.com/arabica-coffee-cherry-cross-section/"}, "img": "blatt", "topic": "Botanik", "st": 5}, {"id": "a1-120", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie groß ist eine Kaffeekirsche ungefähr?", "options": ["Etwa 3–5 mm lang", "Etwa 25–30 mm lang", "Etwa 10–15 mm lang", "Etwa 40–50 mm lang"], "correct": 2, "explain": "Die Kirsche ist etwa 10–15 mm lang und enthält normalerweise zwei Samen.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 1: Coffee plant & site selection", "url": "https://www.fao.org/4/ae939e/ae939e03.htm"}, "img": "kirsche", "topic": "Botanik", "st": 8}, {"id": "a1-121", "mode": "anbau", "level": 1, "type": "mc", "q": "In welchen Höhenlagen wird Robusta typischerweise angebaut?", "options": ["Vom Meeresniveau bis etwa 800 m", "Etwa zwischen 1.200 und 2.000 m", "Etwa zwischen 2.000 und 2.800 m", "Nur oberhalb von etwa 1.500 m"], "correct": 0, "explain": "Robusta wächst vom Meeresniveau bis etwa 800 m; Arabica gedeiht am besten in höheren Lagen.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "berg", "topic": "Klima & Standort", "st": 9}, {"id": "a1-122", "mode": "anbau", "level": 1, "type": "mc", "q": "Wofür ist die Varietät Geisha (Gesha) in der Tasse bekannt?", "options": ["Erdige, würzige Tabaknoten", "Kräftige Bitterkeit und Rauch", "Nussige Noten mit wenig Säure", "Florale Jasmin- und Pfirsichnoten"], "correct": 3, "explain": "Geisha ist für zarte florale Aromen wie Jasmin und pfirsichartige Noten bekannt, vor allem gut gepflegt in großer Höhe.", "source": {"title": "World Coffee Research – Varietätenkatalog: Geisha (Panama)", "url": "https://varieties.worldcoffeeresearch.org/varieties/geisha-panama"}, "img": "bluete", "topic": "Arten & Sorten", "st": 5}, {"id": "a1-123", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Varietät wird auf Jamaika als „Blue Mountain“ angebaut?", "options": ["Bourbon", "Typica", "Caturra", "Geisha"], "correct": 1, "explain": "Typica ist in Peru, der Dominikanischen Republik und Jamaika noch weit verbreitet – auf Jamaika als Jamaica Blue Mountain.", "source": {"title": "World Coffee Research – Varietätenkatalog: Typica", "url": "https://varieties.worldcoffeeresearch.org/varieties/typica"}, "img": "berg", "topic": "Arten & Sorten", "st": 7}, {"id": "a1-124", "mode": "anbau", "level": 1, "type": "mc", "q": "Wo wächst Kona-Kaffee?", "options": ["Auf der Insel Java", "In den Blue Mountains Jamaikas", "Auf der Insel La Réunion", "Auf der Big Island von Hawaii"], "correct": 3, "explain": "Kona-Kaffee kommt von Farmen an der Kona-Küste der Big Island von Hawaii, in vergleichsweise niedrigen Lagen.", "source": {"title": "Sweet Maria's Coffee Library – Glossar: Kona", "url": "https://library.sweetmarias.com/glossary/kona/"}, "img": "berg", "topic": "Herkunft", "st": 3}, {"id": "a1-125", "mode": "anbau", "level": 1, "type": "mc", "q": "Woher stammt der Kaffeename „Mokka“ ursprünglich?", "options": ["Von einer Region in Äthiopien", "Von einer Schokoladensorte", "Von einem türkischen Händler", "Von einer Hafenstadt im Jemen"], "correct": 3, "explain": "Mocha (Al Makha) ist ein Hafen am Roten Meer. Kaffee aus dem jemenitischen Hochland wurde dort verschifft und im Ausland nach dem Hafen benannt.", "source": {"title": "Gulf News – How Yemen port gave its name to world-famous coffee", "url": "https://gulfnews.com/amp/story/world%2Fgulf%2Fyemen%2Fhouthis-seize-mocha-how-yemen-port-gave-its-name-to-world-famous-coffee-1.500669794"}, "img": "berg", "topic": "Herkunft", "st": 4}, {"id": "a1-126", "mode": "anbau", "level": 1, "type": "mc", "q": "Was versteht man unter äthiopischen Landrassen?", "options": ["Im Labor gezüchtete F1-Hybride", "Robusta-Klone aus dem Kongobecken", "Zwergmutationen aus Brasilien", "Örtlich angepasste, traditionelle Sorten"], "correct": 3, "explain": "Äthiopische Landrassen sind lokal angepasste, traditionelle Sorten, die mit sehr hoher Tassenqualität, aber eher niedrigen Erträgen verbunden werden.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 9}, {"id": "a1-127", "mode": "anbau", "level": 1, "type": "mc", "q": "Welchen Zusatznutzen bringen Leguminosen als Schattenbäume?", "options": ["Sie binden Stickstoff aus der Luft", "Sie verhindern Kaffeerost zuverlässig", "Sie erhöhen den Koffeingehalt", "Sie beschleunigen die Kirschreife"], "correct": 0, "explain": "Schattenbäume schützen vor Sonne und Trockenheit; Leguminosen wie Gliricidia liefern zusätzlich organische Masse und binden Stickstoff.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 3: Field management & planting trees", "url": "https://www.fao.org/4/ae939e/ae939e05.htm"}, "img": "sonne", "topic": "Boden & Pflege", "st": 5}, {"id": "a1-128", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie helfen Schattenbäume bei kühlem Wetter?", "options": ["Sie locken Wärme liebende Bienen an", "Sie heizen den Boden stark auf", "Sie verringern das Frostrisiko", "Sie verlängern die Blütezeit"], "correct": 2, "explain": "Arabica ist frostempfindlich; Schattenbäume verringern das Auftreten von Frost.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 1: Coffee plant & site selection", "url": "https://www.fao.org/4/ae939e/ae939e03.htm"}, "img": "sonne", "topic": "Klima & Standort", "st": 4}, {"id": "a1-129", "mode": "anbau", "level": 1, "type": "mc", "q": "Wozu pflanzt man Bodendecker zwischen Kaffeereihen?", "options": ["Gegen Kaffeerost", "Für mehr Koffein", "Gegen Bodenerosion", "Für frühere Blüte"], "correct": 2, "explain": "Bodendecker sollen Erosion verhindern; Leguminosen-Bodendecker unterdrücken zudem Unkraut, liefern Stickstoff und Mulch.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 3: Field management & planting trees", "url": "https://www.fao.org/4/ae939e/ae939e05.htm"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 1}, {"id": "a1-130", "mode": "anbau", "level": 1, "type": "mc", "q": "Warum muss man beim Jäten unter Kaffeebäumen vorsichtig sein?", "options": ["Die Pfahlwurzel wächst waagrecht im Oberboden", "Kaffeebäume treiben aus jeder Wunde neue Stämme", "Viele Saugwurzeln liegen dicht unter der Oberfläche", "Die Blätter reagieren empfindlich auf Erde"], "correct": 2, "explain": "Die Seitenwurzeln mit den Wurzelhaaren sitzen vor allem in den oberen 30 cm des Bodens; beim Jäten dürfen diese flachen Wurzeln nicht verletzt werden.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 3: Field management & planting trees", "url": "https://www.fao.org/4/ae939e/ae939e05.htm"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 10}, {"id": "a1-131", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Böden eignen sich laut FAO besonders für Arabica?", "options": ["Schwere, staunasse Tonböden im Tal", "Flachgründige, salzhaltige Küstenböden", "Tiefgründige, gut drainierte Vulkanböden", "Reine, humusarme Sandböden am Fluss"], "correct": 2, "explain": "Ideal ist ein frei drainierender Boden von mindestens einem Meter Tiefe, etwa fruchtbare vulkanische Roterde oder tiefer sandiger Lehm. Schwerer Ton und Staunässe sind zu meiden.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 1: Coffee plant & site selection", "url": "https://www.fao.org/4/ae939e/ae939e03.htm"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 10}, {"id": "a1-132", "mode": "anbau", "level": 1, "type": "mc", "q": "Womit hebt man den pH-Wert zu saurer Kaffeeböden an?", "options": ["Mit Kalk oder Dolomit", "Mit frischem Fruchtfleisch", "Mit Harnstoff", "Mit Schwefelpulver"], "correct": 0, "explain": "Viele Böden sind zu sauer (unter pH 5) und brauchen Kalk oder Dolomit; ideal ist ein pH von etwa 5–6.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 1: Coffee plant & site selection", "url": "https://www.fao.org/4/ae939e/ae939e03.htm"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 8}, {"id": "a1-133", "mode": "anbau", "level": 1, "type": "mc", "q": "Was macht man sinnvollerweise mit dem Fruchtfleisch aus der Nassmühle?", "options": ["Frisch rund um die Bäume streuen", "Kompostieren und als Dünger nutzen", "In den nächsten Bach leiten", "Mit dem Rohkaffee exportieren"], "correct": 1, "explain": "Kompostiertes Fruchtfleisch kann Mineraldünger ersetzen. Frisches, nicht kompostiertes Fruchtfleisch soll nie verwendet werden: Es kann Pflanzen schädigen und OTA-bildende Schimmel tragen.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 4: Plant nutrition & fertiliser management", "url": "https://www.fao.org/4/ae939e/ae939e06.htm"}, "img": "kirsche", "topic": "Boden & Pflege", "st": 9}, {"id": "a1-134", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie verbreiten sich die Sporen des Kaffeerosts vor allem über weite Strecken?", "options": ["Über das Grundwasser", "Mit dem Wind", "Durch den Kirschenkäfer", "Über die Wurzeln"], "correct": 1, "explain": "Wind ist der wichtigste Weg über größere Distanzen; vor Ort verteilen spritzende Regentropfen die Sporen. Insekten spielen nur eine Nebenrolle.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 9}, {"id": "a1-135", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie groß ist ein weiblicher Kaffeekirschenkäfer etwa?", "options": ["Etwa 1 cm", "Etwa 5 mm", "Etwa 2 cm", "Knapp 2 mm"], "correct": 3, "explain": "Weibchen sind etwa 1,6–1,9 mm lang, Männchen sogar nur rund 1 mm – der Käfer passt durch ein Bohrloch von unter 1 mm.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 10}, {"id": "a1-136", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche beiden Länder sind für einen hohen Anteil natürlich aufbereiteter Kaffees bekannt?", "options": ["Äthiopien und Brasilien", "Kenia und Kolumbien", "Ruanda und Burundi", "Guatemala und Mexiko"], "correct": 0, "explain": "Äthiopien und Brasilien produzieren viele Naturals. Kenia, Kolumbien und viele mittelamerikanische Länder setzen traditionell vor allem auf gewaschenen Kaffee.", "source": {"title": "Perfect Daily Grind – Simplifying green coffee grading (2022)", "url": "https://perfectdailygrind.com/2022/07/simplifying-green-coffee-grading/"}, "img": "trocknung", "topic": "Aufbereitung", "st": 1}, {"id": "a1-137", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Farbe hat frischer, gut getrockneter gewaschener Rohkaffee typischerweise?", "options": ["Hellbraun bis beige", "Bläulich- bis jadegrün", "Gelblich bis orange", "Grau bis fast schwarz"], "correct": 1, "explain": "Gut getrockneter gewaschener Rohkaffee ist bläulich- bis jadegrün. Eine verblasste Farbe deutet meist auf Alterung oder schlechte Lagerung hin.", "source": {"title": "Perfect Daily Grind – Simplifying green coffee grading (2022)", "url": "https://perfectdailygrind.com/2022/07/simplifying-green-coffee-grading/"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 4}, {"id": "a1-138", "mode": "anbau", "level": 1, "type": "mc", "q": "Was macht ein Pulper (Entpulper) in der Nassmühle?", "options": ["Er schält das trockene Pergament", "Er sortiert die Bohnen nach Farbe", "Er misst die Restfeuchte der Bohnen", "Er entfernt Haut und Fruchtfleisch"], "correct": 3, "explain": "Der Pulper quetscht die Samen aus der Kirsche und trennt Haut und Fruchtfleisch ab; der klebrige Fruchtschleim bleibt zunächst an der Bohne.", "source": {"title": "Coffee Review – Processing Coffee: Fruit Removal and Drying", "url": "https://www.coffeereview.com/?p=5562"}, "img": "kirsche", "topic": "Aufbereitung", "st": 2}, {"id": "a1-139", "mode": "anbau", "level": 1, "type": "mc", "q": "Was passiert im Trockenwerk (Dry Mill) kurz vor dem Export?", "options": ["Das trockene Pergament wird abgeschält", "Die frischen Kirschen werden entpulpt", "Der Fruchtschleim wird fermentiert", "Die Kirschen werden im Wasser geflotet"], "correct": 0, "explain": "Nach dem Trocknen entfernt ein Huller (Schälmaschine) das Pergament, bevor der Rohkaffee verschifft wird; Polieren ist ein optionaler letzter Schritt.", "source": {"title": "Coffee Review – Processing Coffee: Fruit Removal and Drying", "url": "https://www.coffeereview.com/?p=5562"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 10}, {"id": "a1-140", "mode": "anbau", "level": 1, "type": "mc", "q": "Warum wird Kaffee auf dem Trockenpatio regelmäßig gewendet?", "options": ["Damit das Koffein verdunstet", "Damit er gleichmäßig trocknet", "Damit er stärker fermentiert", "Damit die Bohnen heller werden"], "correct": 1, "explain": "Der Kaffee liegt in einer dünnen Schicht und wird regelmäßig gerecht, damit alle Bohnen gleichmäßig trocknen.", "source": {"title": "Coffee Review – Processing Coffee: Fruit Removal and Drying", "url": "https://www.coffeereview.com/?p=5562"}, "img": "trocknung", "topic": "Aufbereitung", "st": 2}, {"id": "a1-141", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie lange brauchen ganze Kirschen (Natural) in der Sonne etwa zum Trocknen?", "options": ["Etwa 10 bis 20 Tage", "Etwa 1 bis 2 Tage", "Etwa 3 bis 5 Tage", "Etwa 60 bis 90 Tage"], "correct": 0, "explain": "Die Trocknung ganzer Kirschen dauert laut Coffee Review etwa zehn Tage bis drei Wochen; das FAO-Handbuch nennt 18–20 Tage, für Pergament nur 9–10 Tage.", "source": {"title": "Coffee Review – Processing Coffee: Fruit Removal and Drying", "url": "https://www.coffeereview.com/?p=5562"}, "img": "trocknung", "topic": "Aufbereitung", "st": 9}, {"id": "a1-142", "mode": "anbau", "level": 1, "type": "mc", "q": "Was ist eine „Wet Mill“ (Nassmühle)?", "options": ["Eine Anlage zum Entpulpen, Fermentieren und Waschen", "Eine Mühle, die Rohkaffee in Wasser vermahlt", "Ein feuchtes Lager zum Nachreifen der Kirschen", "Eine Röstanlage, die mit Wasser abkühlt"], "correct": 0, "explain": "In der Nassmühle werden Kirschen angenommen, sortiert, entpulpt, fermentiert, gewaschen und meist auch getrocknet. Mit Mahlen hat der Begriff nichts zu tun.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Aufbereitung", "st": 6}, {"id": "a1-143", "mode": "anbau", "level": 1, "type": "mc", "q": "Wann setzen Farmen mechanische Trockner statt Sonnentrocknung ein?", "options": ["Nur bei besonders teuren Geisha-Losen", "Immer direkt nach dem Pflücken", "Bei schlechtem Wetter oder vollem Patio", "Wenn der Kaffee zu trocken geworden ist"], "correct": 2, "explain": "Mechanische Trockner sind eine Alternative, wenn das Wetter schlecht ist oder die Patiofläche nicht reicht. Als Qualitätsoptimum gilt meist trotzdem die Sonnentrocknung.", "source": {"title": "Sweet Maria's Coffee Library – Glossar: Mechanical Dryer", "url": "https://library.sweetmarias.com/glossary/mechanical-dryer/"}, "img": "trocknung", "topic": "Aufbereitung", "st": 6}, {"id": "a1-144", "mode": "anbau", "level": 1, "type": "mc", "q": "Womit prüft man am zuverlässigsten, ob Pergamentkaffee trocken genug ist?", "options": ["Mit einem Infrarot-Thermometer", "Mit einem Feuchtemessgerät", "Mit einer genauen Feinwaage", "Mit dem Geruch der Bohnen"], "correct": 1, "explain": "Nahe am Ziel von 10–12 % Feuchte soll stündlich mit einem kalibrierten Messgerät geprüft werden; das Infrarot-Thermometer dient nur zur Temperaturkontrolle.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 5}, {"id": "a1-145", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie lange sollte Rohkaffee laut FAO-Handbuch höchstens gelagert werden?", "options": ["Etwa 2 Wochen", "Etwa 12 Monate", "Etwa 5 Jahre", "Beliebig lange"], "correct": 1, "explain": "Rohkaffee sollte nicht länger als etwa 12 Monate lagern, weil die Bohnen sonst verblassen und fleckig werden.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 6: Harvesting and processing", "url": "https://www.fao.org/4/ae939e/ae939e08.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 8}, {"id": "a1-146", "mode": "anbau", "level": 1, "type": "mc", "q": "Mit welcher Organisation hat sich die Rainforest Alliance 2018 zusammengeschlossen?", "options": ["Fairtrade International", "UTZ Certified", "Bird Friendly", "4C Services"], "correct": 1, "explain": "Die Fusion von UTZ und Rainforest Alliance wurde 2017 angekündigt und Anfang 2018 umgesetzt; ein gemeinsames Zertifizierungsprogramm folgte.", "source": {"title": "BeanScene – UTZ and Rainforest Alliance complete merge in 2018", "url": "https://www.beanscenemag.com.au/utz-rainforest-alliance-complete-merge-2018"}, "img": "sonne", "topic": "Herkunft", "st": 8}, {"id": "a1-147", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Rohstoffe umfasst die EU-Entwaldungsverordnung (EUDR) unter anderem?", "options": ["Tee, Zucker und Reis", "Baumwolle, Mais und Weizen", "Bananen, Vanille und Tee", "Kaffee, Kakao und Palmöl"], "correct": 3, "explain": "Die EUDR erfasst Rinder, Holz, Palmöl, Soja, Kautschuk, Kakao und Kaffee sowie bestimmte Folgeprodukte.", "source": {"title": "Rainforest Alliance – EUDR Webinar (Okt. 2023)", "url": "https://www.rainforest-alliance.org/wp-content/uploads/2023/10/EUDR-External-Webinar-11Oct2023.pdf"}, "img": "sonne", "topic": "Herkunft", "st": 5}, {"id": "a1-148", "mode": "anbau", "level": 1, "type": "mc", "q": "Was ist der „C-Preis“ im Kaffeehandel?", "options": ["Der Mindestpreis für Fairtrade-Kaffee", "Der Börsen-Referenzpreis für Arabica", "Der Durchschnittspreis pro Tasse", "Der Höchstpreis bei Kaffeeauktionen"], "correct": 1, "explain": "Der C-Preis ist der Preis der Arabica-Futures („Coffee C“) an der ICE in New York und gilt als De-facto-Referenzpreis für Arabica weltweit.", "source": {"title": "Daily Coffee News – Coffee Economics with Karl: Where Does the C Price Come From?", "url": "https://dailycoffeenews.com/2024/03/25/coffee-ecomics-with-karl-where-does-the-c-price-come-from-differentials"}, "img": "berg", "topic": "Handel & Preise", "st": 5}, {"id": "a1-149", "mode": "anbau", "level": 1, "type": "mc", "q": "Wozu dienen erhöhte Trockenbetten („African Beds“)?", "options": ["Der Kaffee wird dabei zusätzlich gewaschen", "Die Kirschen reifen dort am Zweig nach", "Luft strömt auch von unten an den Kaffee", "Der Kaffee kann ohne Wenden liegen bleiben"], "correct": 2, "explain": "Erhöhte Betten fördern die Luftzirkulation über und unter dem Kaffee und damit gleichmäßiges, zügiges Trocknen. Gewendet wird trotzdem regelmäßig.", "source": {"title": "Sweet Maria's Coffee Library – Glossar: Raised Beds", "url": "https://library.sweetmarias.com/glossary/raised-beds/"}, "img": "trocknung", "topic": "Aufbereitung", "st": 10}, {"id": "a1-150", "mode": "anbau", "level": 1, "type": "case", "q": "Im Lager riecht der Rohkaffee muffig. Was änderst du zuerst?", "case": {"title": "Fall · Kleines Rohkaffeelager", "facts": ["Säcke stehen direkt auf dem Betonboden", "Stapel lehnen an der Außenwand", "Lager liegt nahe an einem Fluss"]}, "options": ["Säcke enger stapeln, damit Luft fehlt", "Lager täglich mit Wasser auswischen", "Säcke auf Paletten mit Abstand zur Wand", "Säcke direkt in die Sonne stellen"], "correct": 2, "explain": "Säcke gehören etwa 15 cm über den Boden und mindestens 30 cm von Wand und Dach entfernt. Die Luftfeuchte soll bei etwa 50–60 % liegen, die Temperatur unter 25 °C.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 6}, {"id": "a1-151", "mode": "anbau", "level": 1, "type": "case", "q": "Auf dem neuen Hang knicken Zweige und Blätter reißen. Was hilft langfristig?", "case": {"title": "Fall · Neue Parzelle", "facts": ["Exponierter Hang ohne Wald ringsum", "Häufig starker Wind", "Junge Kaffeepflanzen seit einem Jahr"]}, "options": ["Kaffee enger pflanzen, ohne Schatten", "Mehr Stickstoff auf die Blätter sprühen", "Windschutzbäume wie Grevillea am Rand", "Die Bäume früh auf Kniehöhe kappen"], "correct": 2, "explain": "Windige Standorte meidet man oder schützt sie mit Windschutzreihen, am besten schon vor dem Pflanzen; bevorzugt wird die Silbereiche (Grevillea robusta).", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 3: Field management & planting trees", "url": "https://www.fao.org/4/ae939e/ae939e05.htm"}, "img": "sonne", "topic": "Klima & Standort", "st": 10}, {"id": "a1-152", "mode": "anbau", "level": 1, "type": "case", "q": "Der Pergamentkaffee liegt rund 20 cm hoch auf dem Trockentisch. Was ist das Problem?", "case": {"title": "Fall · Trockentisch", "facts": ["Schichthöhe rund 20 cm", "Gewendet wird nur einmal am Tag", "Feuchte nach einer Woche noch hoch"]}, "options": ["Er trocknet zu ungleichmäßig", "Er trocknet viel zu schnell", "Er nimmt zu wenig Sonne auf", "Er verliert zu viel Koffein"], "correct": 0, "explain": "Zu dick aufgeschütteter Kaffee ist laut FAO ein Hauptproblem: Er trocknet ungleichmäßig, feuchte Nester begünstigen Schimmel. TechnoServe empfiehlt 5–7 cm Schichthöhe auf dem Endtrocknungstisch.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "trocknung", "topic": "Aufbereitung", "st": 6}, {"id": "a1-153", "mode": "anbau", "level": 1, "type": "case", "q": "Bei der Kirschenannahme liegen viele grüne Kirschen im Korb. Was ist sinnvoll?", "case": {"title": "Fall · Kirschenannahme", "facts": ["Lieferung von mehreren Pflückern", "Deutlich viele grüne Kirschen", "Annahme bis etwa 17 Uhr"]}, "options": ["Alles annehmen, grüne reifen im Tank nach", "Die grünen Kirschen nur länger fermentieren", "Grüne mit überreifen Kirschen mischen", "Stichprobe nehmen, nach Reifeanteil bezahlen"], "correct": 3, "explain": "Mehr als 90 % der Kirschen sollen im Reife-Zielbereich liegen. TechnoServe empfiehlt Stichproben und Bezahlung nach dem Anteil reifer Kirschen; bei zu vielen unreifen wird die Lieferung abgelehnt.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 7}, {"id": "a1-154", "mode": "anbau", "level": 1, "type": "mc", "q": "In welchen Monaten wird in Brasilien ungefähr geerntet?", "options": ["Etwa Dezember bis März", "Etwa Oktober bis Januar", "Etwa Mai bis Oktober", "Etwa Februar bis April"], "correct": 2, "explain": "Brasilien liegt auf der Südhalbkugel. Je nach Region beginnt die Ernte im Mai oder Juni und läuft bis etwa September oder Oktober.", "source": {"title": "3FE – What is coffee seasonality? Part 2", "url": "https://3fe.com/blog/2021/6/17/what-is-coffee-seasonality-part-2"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 8}, {"id": "a1-155", "mode": "anbau", "level": 1, "type": "mc", "q": "Warum entfernt man bei jungen Kaffeebäumen Wasserschosse (Suckers)?", "options": ["Damit der Baum schneller blüht", "Damit ein Stamm ohne Konkurrenz wächst", "Damit Rost nicht am Stamm keimt", "Damit die Wurzeln flacher bleiben"], "correct": 1, "explain": "Im ersten Jahr werden Schosse entfernt, um einen einzelnen Stamm zu erhalten und Konkurrenz durch Nebentriebe zu verhindern.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 5: Pruning and tree management", "url": "https://www.fao.org/4/ae939e/ae939e07.htm"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 9}, {"id": "a1-156", "mode": "anbau", "level": 1, "type": "mc", "q": "Welchem Land wird die Popularität des Honey Process meist zugeschrieben?", "options": ["Äthiopien", "Costa Rica", "Indonesien", "Kenia"], "correct": 1, "explain": "Der Honey Process wurde in Mittelamerika populär; Costa Rica wird dafür in den letzten Jahren meist die größte Rolle zugeschrieben.", "source": {"title": "Sprudge – What Is Honey Processed Coffee?", "url": "https://sprudge.com/what-is-honey-processed-coffee-184876.html"}, "img": "trocknung", "topic": "Aufbereitung", "st": 7}, {"id": "a1-157", "mode": "anbau", "level": 1, "type": "mc", "q": "Welchen Vorteil hat der Honey Process gegenüber der gewaschenen Aufbereitung?", "options": ["Er braucht weniger Sonne", "Er ist schneller trocken", "Er senkt den Koffeingehalt", "Er braucht weniger Wasser"], "correct": 3, "explain": "Weil der Fruchtschleim nicht abgewaschen wird, verbraucht Honey weniger Wasser als Washed. Durch den Schleim dauert das Trocknen eher länger.", "source": {"title": "Sprudge – What Is Honey Processed Coffee?", "url": "https://sprudge.com/what-is-honey-processed-coffee-184876.html"}, "img": "trocknung", "topic": "Aufbereitung", "st": 5}, {"id": "a1-158", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie wird in Äthiopien der größte Teil des Kaffees angebaut?", "options": ["In Gärten kleinbäuerlicher Höfe", "Auf großen staatlichen Plantagen", "Ausschließlich als wilder Waldkaffee", "In Gewächshäusern im Hochland"], "correct": 0, "explain": "Gartenkaffee ist das dominierende System – oft gemischt mit Ensete (falscher Banane), Zuckerrohr oder Gemüse. Plantagen machen nur rund 5 % aus.", "source": {"title": "Tropentag 2004 – Coffee production systems in Ethiopia", "url": "https://www.tropentag.de/2004/abstracts/full/293.pdf"}, "img": "berg", "topic": "Herkunft", "st": 9}, {"id": "a1-159", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie viel Kirschen braucht man als Faustregel für 1 kg Rohkaffee?", "options": ["Etwa 1–2 kg", "Etwa 3 kg", "Etwa 6–7 kg", "Etwa 15–20 kg"], "correct": 2, "explain": "Als Faustregel ergeben 5 kg Kirschen 1 kg Pergament, 6 kg Kirschen 1 kg Rohkaffee und 7 kg Kirschen 1 kg exportfähigen Rohkaffee.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 7}, {"id": "a1-160", "mode": "anbau", "level": 1, "type": "mc", "q": "Was versteht man unter Kaffee im Agroforstsystem?", "options": ["Kaffee wächst in reiner Monokultur", "Kaffee wächst nur im Gewächshaus", "Kaffee wächst als Kletterpflanze", "Kaffee wächst zusammen mit Bäumen"], "correct": 3, "explain": "Im Agroforstsystem stehen Schatten-, Nutz- oder Obstbäume zwischen den Kaffeepflanzen. Das FAO-Handbuch empfiehlt, Schattenbäume direkt in den Kaffeereihen zu pflanzen.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 3: Field management & planting trees", "url": "https://www.fao.org/4/ae939e/ae939e05.htm"}, "img": "sonne", "topic": "Klima & Standort", "st": 5}, {"id": "a1-161", "mode": "anbau", "level": 1, "type": "mc", "q": "Warum muss Kaffee nach der Aufbereitung getrocknet werden?", "options": ["Damit er im Röster schneller bräunt", "Damit der Koffeingehalt deutlich steigt", "Damit er ohne Schimmel lagerfähig ist", "Damit er im Sack mehr Gewicht hat"], "correct": 2, "explain": "Zu feuchter Kaffee schimmelt im Lager. Ziel ist ein lagerstabiler Feuchtebereich; zu starkes Übertrocknen macht die Bohnen aber spröde.", "source": {"title": "Barista Magazine – How Raised Drying Beds Are Improving Coffee Quality in Kenya", "url": "https://www.baristamagazine.com/how-kenyan-coffee-farmers-improve-coffee-quality-through-raised-bed-drying/"}, "img": "trocknung", "topic": "Aufbereitung", "st": 2}, {"id": "a1-162", "mode": "anbau", "level": 1, "type": "mc", "q": "Welche Säcke sollte man für frisch gepflückte Kirschen nie verwenden?", "options": ["Säcke aus sauberer, neuer Jute", "Gewaschene Säcke aus Baumwolle", "Saubere Säcke aus Kunststoff", "Säcke, in denen zuvor Dünger war"], "correct": 3, "explain": "Erntesäcke müssen sauber sein; Säcke, in denen Dünger oder Chemikalien waren, sind tabu.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 6: Harvesting and processing", "url": "https://www.fao.org/4/ae939e/ae939e08.htm"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 9}, {"id": "a1-163", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie viel Kaffee wird weltweit pro Jahr etwa produziert?", "options": ["Rund 170–190 Mio. Sack à 60 kg", "Rund 17–19 Mio. Sack à 60 kg", "Rund 1,7–1,9 Mrd. Sack à 60 kg", "Rund 50–60 Mio. Sack à 60 kg"], "correct": 0, "explain": "Die ICO nennt für 2023/24 rund 178 Mio. Sack, die USDA erwartet für 2026/27 rund 190 Mio. Sack – je nach Jahr und Quelle.", "source": {"title": "USDA FAS – Coffee: World Markets and Trade (Juli 2026)", "url": "https://apps.fas.usda.gov/psdonline/circulars/2026/07/coffee.pdf"}, "img": "berg", "topic": "Herkunft", "st": 10}, {"id": "a1-164", "mode": "anbau", "level": 1, "type": "mc", "q": "In welchem dieser Länder überwiegt laut USDA der Robusta-Anbau?", "options": ["Indien", "Äthiopien", "Kolumbien", "Peru"], "correct": 0, "explain": "Indien produziert laut USDA-Prognose 2026/27 rund 4,6 Mio. Sack Robusta und nur rund 1,6 Mio. Sack Arabica. Äthiopien, Kolumbien und Peru führen nur Arabica.", "source": {"title": "USDA FAS – Coffee: World Markets and Trade (Juli 2026)", "url": "https://apps.fas.usda.gov/psdonline/circulars/2026/07/coffee.pdf"}, "img": "berg", "topic": "Herkunft", "st": 7}, {"id": "a1-165", "mode": "anbau", "level": 1, "type": "mc", "q": "Warum deckt man trocknenden Kaffee nachts ab?", "options": ["Damit er nachts weiter fermentiert", "Damit er im Dunkeln nachreift", "Damit Vögel die Bohnen nicht fressen", "Damit er nicht wieder feucht wird"], "correct": 3, "explain": "Bei Regen und jede Nacht wird der Kaffee mit Folie abgedeckt, damit er nicht rückbefeuchtet. Getrocknet werden soll langsam, aber kontinuierlich.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 6: Harvesting and processing", "url": "https://www.fao.org/4/ae939e/ae939e08.htm"}, "img": "trocknung", "topic": "Aufbereitung", "st": 2}, {"id": "a1-166", "mode": "anbau", "level": 1, "type": "mc", "q": "Woher stammt der Kaffeekirschenkäfer ursprünglich?", "options": ["Aus Afrika", "Aus Südamerika", "Aus Südostasien", "Aus Australien"], "correct": 0, "explain": "Der Käfer breitete sich in rund 100 Jahren von Afrika aus in fast alle Kaffeeländer aus; Australien, China und Nepal gelten als Ausnahmen.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 7}, {"id": "a1-167", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie viele Kaffeearten kennt die Wissenschaft heute ungefähr?", "options": ["Rund 2", "Rund 130", "Rund 15", "Rund 1.300"], "correct": 1, "explain": "Durch neue Genomstudien stieg die Zahl bekannter Kaffeearten zuletzt von 131 auf 133. Kommerziell wichtig sind aber vor allem Arabica und Robusta.", "source": {"title": "SCA 25 Magazine – Beyond Arabica and Robusta: Liberica and Excelsa", "url": "https://sca.coffee/sca-news/25/issue-25-insight-liberica-excelsa"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 10}, {"id": "a1-168", "mode": "anbau", "level": 1, "type": "mc", "q": "Welchen Anteil an der weltweiten Bohnenproduktion haben Arabica und Robusta zusammen?", "options": ["Rund 50 %", "Rund 99 %", "Rund 75 %", "Rund 85 %"], "correct": 1, "explain": "Arabica und Robusta machen zusammen rund 99 % der Weltproduktion aus; Arten wie Liberica und Excelsa sind Nischen.", "source": {"title": "DaMatta & Ramalho (2006), Braz. J. Plant Physiol. – Impacts of drought and temperature stress on coffee", "url": "https://www.scielo.br/j/bjpp/a/bDfpJwLr4xLcznSwy4b9zkf/?lang=en"}, "img": "kirsche", "topic": "Arten & Sorten", "st": 8}, {"id": "a1-169", "mode": "anbau", "level": 1, "type": "mc", "q": "Was ist Typica?", "options": ["Eine eigene wilde Kaffeeart", "Ein Robusta-Klon aus Uganda", "Eine Aufbereitungsmethode", "Eine Varietät der Art Arabica"], "correct": 3, "explain": "Typica ist eine der ältesten Arabica-Varietäten und gehört mit Bourbon zur Bourbon-Typica-Gruppe, auf die der Großteil des heutigen Arabica-Anbaus zurückgeht.", "source": {"title": "World Coffee Research – Varietätenkatalog: Typica", "url": "https://varieties.worldcoffeeresearch.org/varieties/typica"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 3}, {"id": "a1-170", "mode": "anbau", "level": 1, "type": "mc", "q": "Wie lange können Kaffeebäume tragen, wenn sie gepflegt werden?", "options": ["Nur 2–3 Jahre", "Mehrere Jahrzehnte", "Nur eine Saison", "Etwa 5 Jahre"], "correct": 1, "explain": "In Kenia tragen SL28-Bäume teils noch mit 60–80 Jahren. Damit Erträge hoch bleiben, werden Bäume regelmäßig verjüngt.", "source": {"title": "World Coffee Research – Varietätenkatalog: SL28", "url": "https://varieties.worldcoffeeresearch.org/varieties/sl28"}, "img": "pflanze", "topic": "Boden & Pflege", "st": 3}, {"id": "a2-101", "mode": "anbau", "level": 2, "type": "mc", "q": "Wann wird in Äthiopien etwa geerntet – und wann kommt der neue Kaffee bei Röstern an?", "options": ["Ernte etwa Juni–Okt., Ankunft etwa Okt.–Feb.", "Ernte etwa März–Mai, Ankunft etwa Juli–Sep.", "Ernte etwa Nov.–Feb., Ankunft etwa Apr.–Aug.", "Ernte etwa Aug.–Okt., Ankunft etwa Dez.–Feb."], "correct": 2, "explain": "Äthiopien erntet etwa von November bis Februar; nach Aufbereitung, Trocknung und Export kommt der Kaffee meist zwischen April und August an. Die Zeiten verschieben sich durch das Klima zunehmend.", "source": {"title": "3FE – What is coffee seasonality? Part 2", "url": "https://3fe.com/blog/2021/6/17/what-is-coffee-seasonality-part-2"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 9}, {"id": "a2-102", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ist beim Einsatz von Kupferfungiziden gegen Kaffeerost entscheidend?", "options": ["Sie müssen vor der Infektion auf dem Blatt sein", "Sie wirken erst, wenn Sporen sichtbar sind", "Sie werden einmal pro Jahr zur Ernte gespritzt", "Sie werden nur in den Boden eingearbeitet"], "correct": 0, "explain": "Kupfer wirkt vorbeugend und muss vor der Infektion auf den Blättern liegen; Spritzintervalle sollten unter 21 Tagen bleiben. Nachteil: Kupfer reichert sich im Boden an.", "source": {"title": "APS Plant Health Instructor – Coffee Rust (Hemileia vastatrix)", "url": "https://apsnet.org/edcenter/pdlessons/Pages/CoffeeRust.aspx"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 5}, {"id": "a2-103", "mode": "anbau", "level": 2, "type": "mc", "q": "In welchen Jahren traf eine Kaffeerost-Epidemie Mittelamerika in bis dahin unbekannter Stärke?", "options": ["1970–1971", "2012–2013", "1995–1996", "2020–2021"], "correct": 1, "explain": "2012–2013 wüteten Rostepidemien in Mittelamerika, Mexiko und der Karibik. Honduras meldete für 2012/13 rund 31 % weniger Ernte, El Salvador verlor in der Folgeernte 57 %.", "source": {"title": "Avelino (2016), CIRAD Agritrop – The coffee rust crisis in Central America", "url": "https://agritrop.cirad.fr/580046"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 6}, {"id": "a2-104", "mode": "anbau", "level": 2, "type": "mc", "q": "Womit werden Fallen für den Kaffeekirschenkäfer typischerweise beködert?", "options": ["Mit zerdrückten grünen Kirschen", "Mit Zuckerwasser und Hefe", "Mit einem Methanol-Ethanol-Gemisch", "Mit Kupfersulfat-Lösung"], "correct": 2, "explain": "Trichterfallen nutzen einen Lockstoff aus Methanol und Ethanol (etwa 3:1). Massenfang mit etwa 22–25 Fallen pro Hektar gilt als wirksam.", "source": {"title": "Johnson et al. (2020), Insects 11(12):882 – Coffee Berry Borer, a Global Pest of Coffee", "url": "https://www.mdpi.com/2075-4450/11/12/882"}, "img": "kaefer", "topic": "Krankheiten & Schädlinge", "st": 7}, {"id": "a2-105", "mode": "anbau", "level": 2, "type": "mc", "q": "Was verursacht den schwarzen Rußtau auf Kaffeeblättern?", "options": ["Ruß aus nahen Trocknungsfeuern", "Pilze auf dem Honigtau saugender Insekten", "Ein Mangel an Kalium im Boden", "Ein Befall mit dem Kaffeerostpilz"], "correct": 1, "explain": "Rußtau (Capnodium) wächst auf dem Honigtau von Schildläusen und anderen saugenden Insekten, Ameisen verbreiten ihn. Bekämpft werden die Insekten, nicht der Pilz.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 9: Pests and diseases", "url": "https://www.fao.org/4/ae939e/ae939e0b.htm"}, "img": "blatt", "topic": "Krankheiten & Schädlinge", "st": 8}, {"id": "a2-106", "mode": "anbau", "level": 2, "type": "mc", "q": "Welchen Verlust brachte die Coffee-Berry-Disease-Epidemie von 1968 für Kenia?", "options": ["Etwa die Hälfte der Produktion", "Etwa ein Zehntel der Produktion", "Fast die gesamte Produktion", "Kaum messbare Verluste"], "correct": 0, "explain": "Die CBD-Epidemie 1968 kostete Kenia etwa 50 % seiner Produktion und war Auslöser des Züchtungsprogramms, aus dem Ruiru 11 hervorging.", "source": {"title": "World Coffee Research – Varietätenkatalog: Ruiru 11", "url": "https://varieties.worldcoffeeresearch.org/varieties/ruiru-11"}, "img": "kirsche", "topic": "Krankheiten & Schädlinge", "st": 8}, {"id": "a2-107", "mode": "anbau", "level": 2, "type": "mc", "q": "Aus welcher Kreuzung stammt die Varietätengruppe Catimor?", "options": ["Caturra × Timor-Hybrid", "Catuaí × Mundo Novo", "Villa Sarchi × Timor-Hybrid", "Typica × Bourbon"], "correct": 0, "explain": "Catimore gehen auf Caturra × Timor-Hybrid zurück; das Robusta-Erbgut im Timor-Hybrid bringt Resistenz gegen Rost und teils gegen CBD.", "source": {"title": "Sweet Maria's Coffee Library – Glossar: Catimor", "url": "https://library.sweetmarias.com/glossary/catimor/"}, "img": "blatt", "topic": "Arten & Sorten", "st": 3}, {"id": "a2-108", "mode": "anbau", "level": 2, "type": "mc", "q": "Was startete Kolumbien ab 2008, um den Kaffeerost einzudämmen?", "options": ["Ein Verbot aller Varietäten außer Typica", "Ein Umstieg auf reinen Robusta-Anbau", "Ein Programm zum Ersatz von über 3 Mrd. Bäumen", "Eine Pflicht zu zwölf Kupferspritzungen"], "correct": 2, "explain": "Ab 2008 förderte ein staatliches Programm den Ersatz von über drei Milliarden Bäumen – oft Caturra – durch die rostresistente Varietät Castillo.", "source": {"title": "World Coffee Research – Varietätenkatalog: Caturra", "url": "https://varieties.worldcoffeeresearch.org/varieties/caturra"}, "img": "blatt", "topic": "Arten & Sorten", "st": 8}, {"id": "a2-109", "mode": "anbau", "level": 2, "type": "mc", "q": "Welche Entwicklung förderte die Verbreitung der Kompaktvarietät Caturra in Mittelamerika?", "options": ["Lockere Pflanzungen unter dichtem Wald", "Dichtere Pflanzungen, oft in voller Sonne", "Die Rückkehr zu hohen, alten Typica-Bäumen", "Den Umstieg auf maschinelle Ernte am Hang"], "correct": 1, "explain": "Die Einführung von Caturra trug in der zweiten Hälfte des 20. Jahrhunderts zu dichteren, oft ungeschatteten Pflanzungen bei.", "source": {"title": "World Coffee Research – Varietätenkatalog: Caturra", "url": "https://varieties.worldcoffeeresearch.org/varieties/caturra"}, "img": "sonne", "topic": "Klima & Standort", "st": 9}, {"id": "a2-110", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie viele Pflanzen je Hektar empfiehlt WCR etwa für Kompaktvarietäten wie Caturra?", "options": ["Etwa 500–1.000", "Etwa 1.500–2.000", "Etwa 5.000–6.000", "Etwa 15.000–20.000"], "correct": 2, "explain": "Kompakte Varietäten wie Caturra stehen mit etwa 5.000–6.000 Pflanzen/ha (Einzelstamm), hohe wie Bourbon oder Typica mit etwa 3.000–4.000 Pflanzen/ha.", "source": {"title": "World Coffee Research – Varietätenkatalog: Caturra", "url": "https://varieties.worldcoffeeresearch.org/varieties/caturra"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 10}, {"id": "a2-111", "mode": "anbau", "level": 2, "type": "mc", "q": "Woher stammt die Kompaktvarietät Pacas?", "options": ["Eine Bourbon-Mutation aus El Salvador", "Eine Typica-Mutation aus Guatemala", "Eine Arabica-Robusta-Kreuzung aus Honduras", "Eine äthiopische Landrasse aus Kaffa"], "correct": 0, "explain": "Pacas ist eine natürliche Zwergmutation von Bourbon, 1949 auf einer Farm der Familie Pacas in Santa Ana (El Salvador) entdeckt.", "source": {"title": "World Coffee Research – Varietätenkatalog: Pacas", "url": "https://varieties.worldcoffeeresearch.org/varieties/pacas"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 8}, {"id": "a2-112", "mode": "anbau", "level": 2, "type": "mc", "q": "Wofür ist die costa-ricanische Varietät Villa Sarchi agronomisch bekannt?", "options": ["Sie ist vollständig resistent gegen Kaffeerost", "Sie wächst im Tiefland unter 500 m am besten", "Sie trägt schon im ersten Jahr volle Ernten", "Sie passt in höchste Lagen und verträgt starken Wind"], "correct": 3, "explain": "Villa Sarchi ist eine kompakte Bourbon-Mutation aus Costa Rica, gut an höchste Lagen angepasst und tolerant gegenüber starkem Wind; gegen Rost ist sie anfällig.", "source": {"title": "World Coffee Research – Varietätenkatalog: Villa Sarchi", "url": "https://varieties.worldcoffeeresearch.org/varieties/villa-sarchi"}, "img": "berg", "topic": "Arten & Sorten", "st": 9}, {"id": "a2-113", "mode": "anbau", "level": 2, "type": "mc", "q": "Warum wurde Typica ab den 1940er-Jahren in Lateinamerika weitgehend durch Bourbon ersetzt?", "options": ["Typica wächst nur oberhalb von 2.500 m Höhe", "Typica-Samen keimen in Lateinamerika nicht", "Typica bringt wenig Ertrag und ist krankheitsanfällig", "Typica liefert grundsätzlich bittere Tassen"], "correct": 2, "explain": "Bis in die 1940er stand in Mittel- und Südamerika vor allem Typica. Wegen niedriger Erträge und hoher Anfälligkeit für wichtige Krankheiten wurde sie großteils durch Bourbon ersetzt.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 5}, {"id": "a2-114", "mode": "anbau", "level": 2, "type": "mc", "q": "Wer brachte Bourbon-Kaffee im 19. Jahrhundert nach Ostafrika?", "options": ["Niederländische Händler aus Java", "Britische Siedler aus Indien", "Portugiesische Seefahrer", "Französische Spiritaner-Missionare"], "correct": 3, "explain": "Spiritaner-Missionare verbreiteten Bourbon von La Réunion aus über Sansibar und Bagamoyo bis nach Kenia; daraus entstand der „French Mission“-Kaffee.", "source": {"title": "World Coffee Research – History of Arabica", "url": "https://varieties.worldcoffeeresearch.org/arabica-2/history-of-arabica"}, "img": "berg", "topic": "Herkunft", "st": 7}, {"id": "a2-115", "mode": "anbau", "level": 2, "type": "mc", "q": "Wer brachte der Überlieferung nach die ersten Kaffeesamen aus dem Jemen nach Indien?", "options": ["Der Botaniker Linné", "Der Seefahrer Vasco da Gama", "Der Mönch Baba Budan", "Der Händler Gabriel Clieu"], "correct": 2, "explain": "Der indische Mönch Baba Budan soll Samen aus dem Jemen mitgenommen haben; sie begründeten die indischen Arabica-Bestände.", "source": {"title": "University at Buffalo – Newly sequenced genome reveals coffee’s prehistoric origin story (2024, Nature Genetics)", "url": "https://www.buffalo.edu/news/releases/2024/04/newly-sequenced-genome-reveals-coffees-prehistoric-origin-story.html"}, "img": "berg", "topic": "Herkunft", "st": 7}, {"id": "a2-116", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ist Wush Wush?", "options": ["Eine kolumbianische F1-Hybride aus Castillo", "Eine Robusta-Varietät aus dem Kongobecken", "Eine Bourbon-Mutation aus Brasilien", "Eine äthiopische Landrasse, heute oft in Kolumbien"], "correct": 3, "explain": "Wush Wush stammt aus dem gleichnamigen Ort nahe dem Bonga-Wald in Kaffa (Äthiopien) und kam Anfang der 1990er nach Südamerika; viele Partien kommen heute aus Kolumbien.", "source": {"title": "Sweet Maria's Coffee Library – Glossar: Wush Wush", "url": "https://library.sweetmarias.com/glossary/wush-wush/"}, "img": "bluete", "topic": "Arten & Sorten", "st": 8}, {"id": "a2-117", "mode": "anbau", "level": 2, "type": "mc", "q": "Was macht Coffea eugenioides für Specialty-Kaffee interessant?", "options": ["Hoher Koffeingehalt und kräftige Bitterkeit", "Sehr große Bohnen und hohe Erträge", "Wenig Koffein und eine ungewöhnliche Süße", "Volle Resistenz gegen alle Krankheiten"], "correct": 2, "explain": "Eugenioides aus Ostafrika hat von Natur aus weniger Koffein und schmeckt auffallend süß. 2021 nutzten drei Landesmeister, darunter Weltmeister Diego Campos, Eugenioides bei der WBC.", "source": {"title": "Sprudge – What Is Eugenioides Coffee?", "url": "https://sprudge.com/?p=181142"}, "img": "bluete", "topic": "Arten & Sorten", "st": 8}, {"id": "a2-118", "mode": "anbau", "level": 2, "type": "mc", "q": "Was ist äußerlich ungewöhnlich an der Art Coffea stenophylla?", "options": ["Sie trägt blaue Blüten", "Sie trägt keine Blätter", "Sie trägt schwarze Kirschen", "Sie trägt nur Peaberries"], "correct": 2, "explain": "Stenophylla aus Westafrika bildet schwarze Kirschen, was unter Kaffeearten selten ist. Sie gilt auf der Roten Liste als gefährdet.", "source": {"title": "CIRAD – Coffea stenophylla could help futureproof coffee (Davis et al. 2021, Nature Plants)", "url": "https://www.cirad.fr/en/press-area/press-releases/2021/coffea-stenophylla-coffee-climate-change"}, "img": "kirsche", "topic": "Arten & Sorten", "st": 7}, {"id": "a2-119", "mode": "anbau", "level": 2, "type": "mc", "q": "Welche Kaffeeart ersetzte nach dem Rostbefall in Ceylon zunächst Arabica in weiten Teilen Asiens?", "options": ["Robusta", "Stenophylla", "Liberica", "Eugenioides"], "correct": 2, "explain": "Kurz nach 1869 wurde Liberica in Ceylon eingeführt und verbreitete sich mit dem Rost in Asien. Ende des 19. Jahrhunderts dominierten Arabica und Liberica den Welthandel; Robusta spielte kaum eine Rolle.", "source": {"title": "SCA 25 Magazine – Beyond Arabica and Robusta: Liberica and Excelsa", "url": "https://sca.coffee/sca-news/25/issue-25-insight-liberica-excelsa"}, "img": "kirsche", "topic": "Arten & Sorten", "st": 6}, {"id": "a2-120", "mode": "anbau", "level": 2, "type": "mc", "q": "Welches Geschmacksprofil wird Liberica typischerweise zugeschrieben?", "options": ["Erdig, holzig und sehr bitter", "Dominante tropische Fruchtnoten", "Neutral mit kaum Aroma", "Rauchig mit starker Säure"], "correct": 1, "explain": "Liberica wird von tropischen Fruchtnoten geprägt, Excelsa von herber Frucht, Schokolade und Gewürz. Beide sind süß mit mittlerem Körper; ihr Koffeingehalt liegt nahe an Arabica.", "source": {"title": "SCA 25 Magazine – Beyond Arabica and Robusta: Liberica and Excelsa", "url": "https://sca.coffee/sca-news/25/issue-25-insight-liberica-excelsa"}, "img": "kirsche", "topic": "Arten & Sorten", "st": 4}, {"id": "a2-121", "mode": "anbau", "level": 2, "type": "mc", "q": "Wofür steht „Conilon“ im brasilianischen Kaffeeanbau?", "options": ["Für eine Arabica-Mutation", "Für eine Gruppe von C. canephora", "Für eine Aufbereitungsmethode", "Für eine Qualitätsstufe"], "correct": 1, "explain": "Conilon und Robusta sind botanische Gruppen von C. canephora. Conilon wächst eher strauchig und verträgt Trockenheit, Robusta wächst aufrechter mit größeren Früchten und mehr Krankheitsresistenz.", "source": {"title": "Embrapa – Amazonian Robustas (Robustas Amazônicos)", "url": "https://www.alice.cnptia.embrapa.br/alice/bitstream/doc/1160418/1/AMAZON-ROBUSTAS.pdf"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 7}, {"id": "a2-122", "mode": "anbau", "level": 2, "type": "mc", "q": "Seit wann war der Anbau von Robusta in Costa Rica verboten, bevor 2018 über eine Aufhebung beraten wurde?", "options": ["Seit 1988", "Seit 1948", "Seit 1968", "Seit 2008"], "correct": 0, "explain": "Costa Rica verbot Robusta 1988, um auf den hochwertigeren Arabica zu setzen. 2018 wollten Agrarministerium und ICAFE das Verbot aufheben – wegen Klima, Schädlingen und ländlicher Einkommen.", "source": {"title": "Daily Coffee News – Costa Rica agriculture leaders seek to lift 30-year robusta ban (2018)", "url": "https://dailycoffeenews.com/2018/02/19/costa-rica-agriculture-leaders-seek-to-lift-30-year-robusta-ban"}, "img": "berg", "topic": "Herkunft", "st": 10}, {"id": "a2-123", "mode": "anbau", "level": 2, "type": "mc", "q": "Welche beiden Varietäten prägen klassisch den Anbau in Kenia?", "options": ["Caturra und Catuaí", "Pacas und Pacamara", "SL28 und SL34", "Typica und Maragogipe"], "correct": 2, "explain": "SL28 und SL34 wurden an den Scott Agricultural Laboratories in Kenia selektiert und sind dort sowie in Uganda, Malawi und Simbabwe verbreitet.", "source": {"title": "World Coffee Research – Varietätenkatalog: SL28", "url": "https://varieties.worldcoffeeresearch.org/varieties/sl28"}, "img": "pflanze", "topic": "Arten & Sorten", "st": 1}, {"id": "a2-124", "mode": "anbau", "level": 2, "type": "mc", "q": "Wozu dient beim kenianischen „Double Washed“ vor allem das Einweichen unter Wasser?", "options": ["Pergament zwischenzulagern, bis Trockenplatz frei ist", "Den Koffeingehalt der Bohnen deutlich zu senken", "Die Kirschen vor dem Entpulpen weich zu machen", "Den Kaffee mit Zucker aus dem Wasser zu süßen"], "correct": 0, "explain": "Das Einweichen hält gewaschenen Kaffee kühl und geschützt, wenn die Trockenbetten zur Erntezeit voll sind. Eine echte zweite Fermentation ist es nicht, da der Fruchtschleim schon weg ist.", "source": {"title": "Barista Magazine – Understanding the Process: Double Fermentation", "url": "https://baristamagazine.com/understanding-the-process-double-fermentation"}, "img": "trocknung", "topic": "Aufbereitung", "st": 9}, {"id": "a2-125", "mode": "anbau", "level": 2, "type": "mc", "q": "Welches Tassenprofil gilt als typisch für Wet-Hulled-Kaffee aus Sumatra?", "options": ["Erdig, kräuterig, schwerer Körper", "Hell, zitrisch, florale Teenoten", "Sehr fruchtig mit Weinnoten", "Leicht, nussig mit wenig Körper"], "correct": 0, "explain": "Cafe Imports beschreibt Wet-Hulled-Kaffee als erdig, herzhaft, kräuterig, mit schwerem Körper, dunkler Schokolade und Nussnoten.", "source": {"title": "Cafe Imports – Wet-Hulled (Giling Basah)", "url": "https://www.cafeimports.com/europe/blog/?p=37563"}, "img": "trocknung", "topic": "Aufbereitung", "st": 1}, {"id": "a2-126", "mode": "anbau", "level": 2, "type": "mc", "q": "In welchem Land ist „Pulped Natural“ (Fruchtschleim trocknet an der Bohne) regelmäßige Praxis?", "options": ["In Brasilien", "In Kenia", "In Kolumbien", "In Ruanda"], "correct": 0, "explain": "Beim Pulped Natural wird die Haut entfernt, der Schleim trocknet an und wird später mit dem Pergament abgeschält. Coffee Review nennt Brasilien sowie Teile von Sumatra und Sulawesi.", "source": {"title": "Coffee Review – Processing Coffee: Fruit Removal and Drying", "url": "https://www.coffeereview.com/?p=5562"}, "img": "trocknung", "topic": "Aufbereitung", "st": 3}, {"id": "a2-127", "mode": "anbau", "level": 2, "type": "mc", "q": "Was unterscheidet trockene von nasser Fermentation in der Nassmühle?", "options": ["Trocken: ohne zugesetztes Wasser im Tank", "Trocken: Kirschen fermentieren ungeschält", "Nass: der Kaffee liegt in der Sonne", "Nass: es wird Hefe zugegeben"], "correct": 0, "explain": "Bei nasser Fermentation wird Wasser in den Tank gegeben, bei trockener gärt der Kaffee im eigenen Saft. Trocken fermentierte Kaffees gelten oft als komplexer und süßer, nass fermentierte als heller.", "source": {"title": "Coffee Review – Processing Coffee: Fruit Removal and Drying", "url": "https://www.coffeereview.com/?p=5562"}, "img": "trocknung", "topic": "Aufbereitung", "st": 4}, {"id": "a2-128", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie lange werden Kaffees bei anaerober Fermentation typischerweise verschlossen gehalten?", "options": ["Etwa 1–2 Stunden", "Etwa 1–6 Tage", "Etwa 3–4 Wochen", "Etwa 3 Monate"], "correct": 1, "explain": "Laut Coffee Review bleiben die Kaffees etwa ein bis sechs Tage verschlossen; je länger, desto deutlicher der anaerobe Effekt.", "source": {"title": "Coffee Review – Anaerobically Processed Coffees", "url": "https://www.coffeereview.com/anaerobically-processed-coffees/"}, "img": "trocknung", "topic": "Aufbereitung", "st": 6}, {"id": "a2-129", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie arbeitet ein Guardiola-Trockner?", "options": ["Als Vakuumkammer in etwa 3 Stunden", "Als Solardach über etwa 3 Wochen", "Als Gefriertrockner in etwa 3 Minuten", "Als rotierende Trommel über etwa 3 Tage"], "correct": 3, "explain": "Die Guardiola ist ein Trommeltrockner, der die Feuchte über etwa drei Tage senkt; sie gilt als besser als vertikale Trockner, Sonnentrocknung aber als Optimum.", "source": {"title": "Sweet Maria's Coffee Library – Glossar: Mechanical Dryer", "url": "https://library.sweetmarias.com/glossary/mechanical-dryer/"}, "img": "trocknung", "topic": "Aufbereitung", "st": 7}, {"id": "a2-130", "mode": "anbau", "level": 2, "type": "mc", "q": "Was passiert, wenn Pergamentkaffee unter 10 % Feuchte übertrocknet wird?", "options": ["Die Bohnen werden süßer und dichter", "Der Kaffee wird lagerstabiler und frischer", "Der Koffeingehalt steigt messbar an", "Aroma und Säure lassen nach, Bruch steigt"], "correct": 3, "explain": "Unter etwa 10 % Feuchte beginnen Aroma und Säure zu verblassen, und beim Schälen brechen mehr Bohnen.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 9}, {"id": "a2-131", "mode": "anbau", "level": 2, "type": "mc", "q": "Womit messen viele Nassmühlen die Reife von Kirschen zusätzlich zur Farbe?", "options": ["Mit dem Zuckergehalt in °Brix", "Mit dem Koffeingehalt in Prozent", "Mit dem pH-Wert der Fruchthaut", "Mit der Bohnengröße in Sieben"], "correct": 0, "explain": "Reife Kirschen liegen je nach Gegend bei etwa 15–25 °Brix; Mühlen sollten ihre eigenen Zielwerte ermitteln.", "source": {"title": "TechnoServe – Coffee Wet Mill Processing Guide", "url": "https://www.technoserve.org/wp-content/uploads/2022/03/TechnoServe-Wet-Mill-Processing-Guide.pdf"}, "img": "kirsche", "topic": "Blüte & Ernte", "st": 8}, {"id": "a2-132", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie viel Wasser braucht die vollständig gewaschene Aufbereitung laut FAO etwa je kg Kirschen?", "options": ["Etwa 0,1 l", "Etwa 2–10 l", "Etwa 30–50 l", "Etwa 100 l"], "correct": 1, "explain": "Full Wash braucht etwa 2–10 Liter Wasser je kg Kirschen, die Semi-Wash-Variante mit Entschleimer nur etwa 0,5 l.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 6: Harvesting and processing", "url": "https://www.fao.org/4/ae939e/ae939e08.htm"}, "img": "kirsche", "topic": "Aufbereitung", "st": 6}, {"id": "a2-133", "mode": "anbau", "level": 2, "type": "case", "q": "Eine Bohne zerbricht beim Bisstest. Was sagt das über die Trocknung?", "case": {"title": "Fall · Trocknungskontrolle", "facts": ["Kein Messgerät auf der Farm", "Bohne aus dem Pergament geschält", "Beim Draufbeißen splittert sie"]}, "options": ["Sie ist ideal getrocknet, etwa 12 %", "Sie ist zu feucht, über 15 % Feuchte", "Sie ist unreif und daher sehr weich", "Sie ist übertrocknet, etwa 8–10 % Feuchte"], "correct": 3, "explain": "Eine richtig getrocknete Bohne zeigt beim Biss kaum einen Abdruck; zerbricht sie, ist sie mit etwa 8–10 % Feuchte übertrocknet.", "source": {"title": "FAO – Arabica coffee manual for Lao PDR, Kap. 6: Harvesting and processing", "url": "https://www.fao.org/4/ae939e/ae939e08.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 9}, {"id": "a2-134", "mode": "anbau", "level": 2, "type": "mc", "q": "Welches Sackgewicht ist für Rohkaffee aus Kolumbien üblich?", "options": ["60 kg", "46 kg", "70 kg", "50 kg"], "correct": 2, "explain": "Kolumbien verschifft in 70-kg-Säcken, viele mittelamerikanische Länder in 69 kg, Brasilien, Äthiopien und Kenia in 60 kg.", "source": {"title": "Royal Coffee – Coffee Weights by Origin (PDF)", "url": "https://cdn.royalcoffee.com/wp-content/uploads/2020/08/14100208/CoffeeWeights_FINAL.pdf"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 3}, {"id": "a2-135", "mode": "anbau", "level": 2, "type": "mc", "q": "In welcher Einheit werden Siebgrößen für Rohkaffee angegeben?", "options": ["In 1/10 Millimeter", "In 1/64 Zoll", "In 1/32 Zoll", "In ganzen Millimetern"], "correct": 1, "explain": "Jede Siebgröße entspricht 1/64 Zoll Lochdurchmesser; Sieb 15 hat also rund 6 mm. Üblich sind Größen um 15–18.", "source": {"title": "Coffee Research Institute – Coffee Bean Size", "url": "https://coffeeresearch.org/coffee/beansize.htm"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 6}, {"id": "a2-136", "mode": "anbau", "level": 2, "type": "mc", "q": "Was bezeichnet „Supremo“ bei kolumbianischem Kaffee?", "options": ["Die beste Note im Cupping", "Große Bohnen der Siebgröße 17–18", "Kaffee aus über 2.000 m Höhe", "Handverlesene Peaberries"], "correct": 1, "explain": "Supremo steht für Sieb 17–18, Excelso für 15–16. Beide Begriffe beschreiben nur die Bohnengröße, nicht die Tassenqualität.", "source": {"title": "Sweet Maria's Coffee Library – Glossar: Supremo", "url": "https://library.sweetmarias.com/glossary/supremo/"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 4}, {"id": "a2-137", "mode": "anbau", "level": 2, "type": "mc", "q": "Was trennt ein Dichtetisch (Gravity Table) im Trockenwerk?", "options": ["Bohnen nach Farbe, mit Kameras", "Bohnen nach Dichte, mit Luftstrom", "Bohnen nach Größe, mit Sieben", "Bohnen nach Feuchte, mit Wärme"], "correct": 1, "explain": "Dichtetische (Densitographen) nutzen Luft und Rüttelbewegung, um leichte von dichten Bohnen zu trennen.", "source": {"title": "Perfect Daily Grind – Simplifying green coffee grading (2022)", "url": "https://perfectdailygrind.com/2022/07/simplifying-green-coffee-grading/"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 7}, {"id": "a2-138", "mode": "anbau", "level": 2, "type": "mc", "q": "Womit werden „Stinker“-Bohnen typischerweise in Verbindung gebracht?", "options": ["Mit verschmutztem Prozesswasser", "Mit Frost während der Blüte", "Mit zu großem Bohnendurchmesser", "Mit Schatten über der Pflanze"], "correct": 0, "explain": "Unhygienisches Wasser in der Aufbereitung kann zu übelriechenden „Stinker“-Bohnen führen.", "source": {"title": "Perfect Daily Grind – Simplifying green coffee grading (2022)", "url": "https://perfectdailygrind.com/2022/07/simplifying-green-coffee-grading/"}, "img": "kirsche", "topic": "Rohkaffee & Qualität", "st": 8}, {"id": "a2-139", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie hoch ist die Fairtrade-Prämie für Kaffee seit August 2023?", "options": ["0,02 US-$ je Pfund", "1,00 US-$ je Pfund", "0,20 US-$ je Pfund", "2,00 US-$ je Pfund"], "correct": 2, "explain": "Seit dem 1. August 2023 beträgt die Fairtrade-Prämie für alle Kaffeetypen 0,20 US-$/lb zusätzlich zum Preis.", "source": {"title": "Fairtrade International – Coffee Price Announcement (30.03.2023)", "url": "https://files.fairtrade.net/standards/2023-03-30_Coffee-Price-Announcement_EN.pdf"}, "img": "berg", "topic": "Handel & Preise", "st": 10}, {"id": "a2-140", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie hoch ist der Fairtrade-Mindestpreis für konventionellen gewaschenen Arabica seit August 2023?", "options": ["0,80 US-$ je Pfund FOB", "3,80 US-$ je Pfund FOB", "5,00 US-$ je Pfund FOB", "1,80 US-$ je Pfund FOB"], "correct": 3, "explain": "Seit 1. August 2023 gilt für gewaschenen Arabica 1,80 US-$/lb, für natürlichen 1,75 US-$/lb; Robusta liegt bei 1,25 bzw. 1,20 US-$/lb.", "source": {"title": "Fairtrade International – Coffee Price Announcement (30.03.2023)", "url": "https://files.fairtrade.net/standards/2023-03-30_Coffee-Price-Announcement_EN.pdf"}, "img": "berg", "topic": "Handel & Preise", "st": 7}, {"id": "a2-141", "mode": "anbau", "level": 2, "type": "mc", "q": "Ab welchem Stichtag darf Kaffee für den EU-Markt laut EUDR nicht von entwaldeten Flächen stammen?", "options": ["31. Dezember 2020", "1. Januar 2000", "31. Dezember 2015", "1. Januar 2025"], "correct": 0, "explain": "Produkte dürfen nicht von Flächen stammen, die nach dem 31. Dezember 2020 entwaldet wurden; zudem sind Geodaten der Anbauflächen nötig.", "source": {"title": "Rainforest Alliance – EUDR Webinar (Okt. 2023)", "url": "https://www.rainforest-alliance.org/wp-content/uploads/2023/10/EUDR-External-Webinar-11Oct2023.pdf"}, "img": "sonne", "topic": "Herkunft", "st": 7}, {"id": "a2-142", "mode": "anbau", "level": 2, "type": "mc", "q": "Wie setzt sich im Rohkaffeehandel ein Preis mit „Differential“ zusammen?", "options": ["Fairtrade-Preis plus Bio-Aufschlag", "Börsenpreis plus oder minus Differential", "Röstpreis minus Transportkosten", "Farmpreis mal Wechselkurs"], "correct": 1, "explain": "Das Differential ist der Auf- oder Abschlag einer Herkunft oder Qualität zum Börsenpreis (für Arabica der C-Preis). Beispiel: Honduras HG mit +20 bei 200 c/lb ergibt 2,20 US-$/lb.", "source": {"title": "Sucafina – The Silent Power of Differentials", "url": "https://sucafina.com/na/news/the-silent-power-of-differentials"}, "img": "berg", "topic": "Handel & Preise", "st": 4}, {"id": "a2-143", "mode": "anbau", "level": 2, "type": "mc", "q": "Welche vier Gruppen-Indikatoren unterscheidet die ICO beim Kaffeepreis?", "options": ["Arabica, Robusta, Liberica, Excelsa", "Colombian Milds, Other Milds, Brazilian Naturals, Robustas", "Washed Arabicas, Natural Arabicas, Washed Robustas, Natural Robustas", "Specialty, Premium, Exchange, Below Standard"], "correct": 1, "explain": "Aus diesen vier Gruppen bildet die ICO ihren Composite Indicator Price. Robustas notierten im April 2025 deutlich unter den Arabica-Gruppen.", "source": {"title": "ICO – Coffee Market Report April 2025", "url": "https://www.ico.org/documents/cy2024-25/cmr-0425-e.pdf"}, "img": "berg", "topic": "Handel & Preise", "st": 10}, {"id": "a2-144", "mode": "anbau", "level": 2, "type": "mc", "q": "Welches afrikanische Land produziert laut USDA am meisten Robusta?", "options": ["Uganda", "Äthiopien", "Kenia", "Tansania"], "correct": 0, "explain": "Uganda produziert laut USDA-Prognose 2026/27 rund 6 Mio. Sack Robusta und gut 1 Mio. Sack Arabica. Äthiopien und Kenia bauen fast nur Arabica an.", "source": {"title": "USDA FAS – Coffee: World Markets and Trade (Juli 2026)", "url": "https://apps.fas.usda.gov/psdonline/circulars/2026/07/coffee.pdf"}, "img": "berg", "topic": "Herkunft", "st": 3}, {"id": "a2-145", "mode": "anbau", "level": 2, "type": "mc", "q": "Welcher brasilianische Bundesstaat erntet etwa die Hälfte des brasilianischen Kaffees?", "options": ["Minas Gerais", "São Paulo", "Espírito Santo", "Paraná"], "correct": 0, "explain": "Für 2026 erwartet Conab in Minas Gerais rund 32 Mio. Sack – etwa 49 % der brasilianischen Ernte.", "source": {"title": "Itatiaia – Minas Gerais assume quase 50 % da produção de café no Brasil (Feb. 2026)", "url": "https://www.itatiaia.com.br/agro/minas-gerais-assume-quase-50-da-producao-de-cafe-no-brasil-e-lidera-safra-recorde/"}, "img": "berg", "topic": "Herkunft", "st": 3}, {"id": "a2-146", "mode": "anbau", "level": 2, "type": "mc", "q": "Wofür nutzen Produzenten und Röster den „Specialty Coffee Transaction Guide“?", "options": ["Als Liste zugelassener Varietäten", "Als Katalog von Rohkaffeedefekten", "Als Leitfaden für Röstprofile", "Als Preisreferenz neben dem C-Preis"], "correct": 3, "explain": "Der Guide fasst anonymisierte FOB-Preise aus über 100.000 Verträgen nach Qualität, Losgröße und Herkunft zusammen und dient als alternative Preisreferenz zum C-Preis.", "source": {"title": "Daily Coffee News – The 2024 Specialty Coffee Transaction Guide Is Here", "url": "https://dailycoffeenews.com/2025/02/18/the-2024-specialty-coffee-transaction-guide-is-here"}, "img": "berg", "topic": "Handel & Preise", "st": 8}, {"id": "a2-147", "mode": "anbau", "level": 2, "type": "mc", "q": "Was bedeutet „FOB“ auf einem Rohkaffeevertrag?", "options": ["Final Organic Bonus, ein Aufschlag", "First Offer Bid, ein Auktionspreis", "Free on Board, eine Lieferklausel", "Fully Organic Bean, ein Bio-Siegel"], "correct": 2, "explain": "FOB („free on board“) ist eine Incoterm-Klausel aus dem Seehande
